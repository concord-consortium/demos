<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>child-buttons</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; padding: 6px; font-size: 13px; background: #eef6ee; }
  button { margin: 2px; padding: 2px 8px; font-size: 12px; }

  /* Same dual-ring scheme as the parent: red for :focus, +blue for :focus-visible. */
  *:focus           { outline: 3px solid #d00; outline-offset: 0; }
  *:focus-visible   { box-shadow: 0 0 0 4px #fff, 0 0 0 7px #06f; }
  body:focus        { outline-offset: -3px; }
  body:focus-visible { box-shadow: inset 0 0 0 7px #fff, inset 0 0 0 10px #06f; }
</style>
</head>
<body>
<div>child-buttons.html — 3 focusables:</div>
<button id="btn-1">BUTTON 1</button>
<button id="btn-2">BUTTON 2</button>
<button id="btn-3">BUTTON 3</button>
</body>
</html>
