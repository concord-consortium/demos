<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MassSims</title>
<style>
/* Self-hosted fonts */
/* Barlow 400 */ @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 400; src: url('fonts/17ef8a066a33.woff2') format('woff2'); }
/* Barlow Condensed 400 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 400; src: url('fonts/343e6c738440.woff2') format('woff2'); }
/* Barlow Condensed 600 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 600; src: url('fonts/07c3c732a90e.woff2') format('woff2'); }
/* Lato 400 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; src: url('fonts/d5b18a30a456.woff2') format('woff2'); }
/* Lato 400i */ @font-face { font-family: 'Lato'; font-style: italic; font-weight: 400; src: url('fonts/lato-italic-400.woff2') format('woff2'); }
/* Lato 700 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 700; src: url('fonts/a658a6a6ab26.woff2') format('woff2'); }
/* Roboto Condensed */ @font-face { font-family: 'Roboto Condensed'; font-style: normal; font-weight: 100 900; src: url('fonts/d2466d84dfac.woff2') format('woff2'); }
/* Slackey */ @font-face { font-family: 'Slackey'; font-style: normal; font-weight: 400; src: url('fonts/b9e0133fed40.woff2') format('woff2'); }
/* Fontdiner Swanky */ @font-face { font-family: 'Fontdiner Swanky'; font-style: normal; font-weight: 400; src: url('fonts/ab612a511c9f.woff2') format('woff2'); }
/* Vampiro One */ @font-face { font-family: 'Vampiro One'; font-style: normal; font-weight: 400; src: url('fonts/51ccc1196225.woff2') format('woff2'); }
/* Coming Soon */ @font-face { font-family: 'Coming Soon'; font-style: normal; font-weight: 400; src: url('fonts/f6db7f9cd556.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    background: #e0e0e0;
    color: #333;
    letter-spacing: 0.02em;
    padding: 20px;
  }

  /* Main layout: left buttons | viewport | right buttons */
  .main-layout {
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }

  /* Button columns */
  .btn-column {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 150px;
    flex-shrink: 0;
    padding-top: 0;
  }

  .btn-column [role="group"] {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .btn-column-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .toggle-btn {
    font-family: 'Barlow Condensed', sans-serif;
    padding: 8px 14px;
    min-height: 44px;
    font-size: 16px;
    line-height: 20px;
    font-weight: 600;
    color: #333;
    background: #f0f0f0;
    border: 1px solid #858585;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    white-space: nowrap;
  }

  .toggle-btn:hover,
  .toggle-btn:focus-visible {
    background: #d8d8d8;
    color: #333;
  }

  .toggle-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }

  .toggle-btn:active:not(.active) {
    background: #c0c0c0;
  }

  .toggle-btn.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }

  /* Viewport display area */
  .viewport-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-left: 1px solid #858585;
    align-self: stretch;
    min-height: calc(100vh - 40px);
    position: relative;
  }

  .viewport-info {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.3;
    color: #333;
    margin-bottom: 12px;
    text-align: center;
    min-height: 2.6em;
    position: relative;
    z-index: 1;
  }

  .viewport-info strong {
    font-weight: 600;
    color: #333;
  }

  /* Device frame */
  .device-frame {
    position: relative;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    box-sizing: content-box;
    border: 2px solid #333;
    transition: width 0.3s ease, height 0.3s ease;
  }

  .device-frame.no-limit {
    border-color: #ccc;
    border-style: dashed;
    background: transparent;
  }

  /* Browser / OS chrome bars */
  .chrome-top {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0 8px;
    position: relative;
  }

  .chrome-top::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    white-space: nowrap;
  }

  .chrome-bottom {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .chrome-bottom::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    text-align: center;
    white-space: nowrap;
  }

  /* Available viewport area */
  .viewport-area {
    background: #0592af;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
    flex: 1;
  }

  /* AP container — floated centered unit */
  .ap-container {
    background: transparent;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .ap-right-column {
    display: flex;
    flex-direction: column;
    width: 767px;
    box-sizing: content-box;
    border: 1px solid #858585;
    margin-right: 26px;
  }

  .ap-header {
    background: #047a99;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .ap-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .ap-body {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  /* Left column for 2-column layout */
  .ap-left-column {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-left: 28px;
    margin-right: 10px;
    transition: width 0.25s ease;
    overflow: hidden;
  }

  .ap-left-toggle {
    background: #3f3f3f;
    display: flex;
    align-items: center;
    position: relative;
    cursor: pointer;
  }

  .ap-left-toggle:hover {
    background: #4a4a4a;
  }

  .ap-left-toggle:active {
    background: #3a3a3a;
  }

  .ap-left-toggle-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    position: absolute;
    left: 181px;
    white-space: nowrap;
  }

  .ap-left-toggle-icon {
    position: absolute;
    right: 20px;
    width: 32px;
    height: 32px;
  }

  .ap-left-toggle-icon-collapsed {
    width: 32px;
    height: 32px;
    margin-top: 5px;
    transform: scaleX(-1);
  }

  .ap-left-toggle-label-collapsed {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    margin-top: 12px;
    white-space: nowrap;
  }

  .ap-left-toggle:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }

  .ap-left-resources {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .ap-left-resources-header {
    background: #dfdfdf;
    height: 37px;
    padding-left: 20px;
    display: flex;
    align-items: center;
  }

  .ap-left-resources-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #333;
  }

  .ap-left-resources-body {
    flex: 1;
    background: #f4f4f4;
    padding: 25px 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
    overflow: auto;
  }

  .ap-left-resources-body p {
    margin: 0 0 16px 0;
  }

  .ap-left-resources-body p:last-child {
    margin-bottom: 0;
  }

  .ap-left-resources-body ul {
    margin: 0 0 16px 0;
    padding-left: 40px;
  }

  .ap-left-resources-body li {
    margin-bottom: 12px;
  }

  .ap-left-resources-body li:last-child {
    margin-bottom: 0;
  }


  /* Sim title bar */
  .sim-title-bar {
    height: 50px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px 0 20px;
    flex-shrink: 0;
  }

  .sim-title-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sim-title-name {
    font-family: 'Lato', sans-serif;
    font-size: 24px;
    line-height: 1;
    font-weight: 700;
    color: #333;
    margin: 0;
    font-synthesis: none;
    display: flex;
    align-items: center;
    height: 28px;
  }

  .sim-title-desc {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    color: #333;
  }

  .sim-title-right {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .sim-title-logo {
    display: block;
  }

  .sim-title-logo:first-child {
    margin-right: 3px;
  }

  .data-show-all-btn {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    font-weight: 700;
    padding: 3px 12px;
    height: 34px;
    box-sizing: border-box;
    border: 2px solid #555;
    border-radius: 6px;
    background: #fff;
    color: #333;
    cursor: pointer;
    display: none;
    align-items: center;
    white-space: nowrap;
    position: relative;
  }

  .data-show-all-btn::after {
    content: "";
    position: absolute;
    top: -7px;
    left: 0;
    right: 0;
    bottom: -7px;
  }

  .data-show-all-btn:hover,
  .data-show-all-btn:focus-visible {
    background: #f0f0f0;
  }

  .data-show-all-btn:active {
    background: #d0d0d0;
  }

  .data-show-all-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }

  .sim-info-btn {
    margin-left: 5px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    font-weight: 700;
    padding: 3px 12px 3px 8px;
    height: 34px;
    box-sizing: border-box;
    border: 2px solid #555;
    border-radius: 6px;
    background: #fff;
    color: #333;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
  }

  .sim-info-btn::after {
    content: "";
    position: absolute;
    top: -7px;
    left: 0;
    right: 0;
    bottom: -7px;
  }

  .sim-info-btn.compact-hit::after {
    top: 0;
    bottom: 0;
  }

  .sim-info-btn img {
    width: 24px;
    height: 24px;
    pointer-events: none;
  }

  .sim-info-btn:hover,
  .sim-info-btn:focus-visible {
    background: #f0f0f0;
  }

  .sim-info-btn:active {
    background: #d0d0d0;
  }

  .sim-info-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }

  /* Info modal */
  .info-modal {
    position: absolute;
    top: 50px;
    right: 10px;
    width: 400px;
    max-height: 70%;
    background: #fff;
    border: 2px solid #555;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    z-index: 101;
    overflow: hidden;
  }

  .info-modal-header {
    display: flex;
    align-items: center;
    padding: 3px 3px 3px 12px;
    height: 52px;
    box-sizing: border-box;
    border-bottom: 1px solid #ccc;
    cursor: grab;
    flex-shrink: 0;
    user-select: none;
  }

  .info-modal-header:active {
    cursor: grabbing;
  }

  .info-modal-header-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    margin-right: 10px;
  }

  .info-modal-header-title {
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #333;
    flex: 1;
    margin: 0;
  }

  .info-modal-close {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    border-radius: 4px;
    padding: 0;
    flex-shrink: 0;
  }

  .info-modal-close:hover,
  .info-modal-close:focus-visible {
    background: #f0f0f0;
  }

  .info-modal-close:active {
    background: #d0d0d0;
  }

  .info-modal-close:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }

  .info-modal-close img {
    width: 24px;
    height: 24px;
  }

  .info-modal-body {
    padding: 16px 20px 20px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 22px;
    color: #333;
    user-select: text;
  }

  .info-modal-body-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .info-modal-body:focus-visible {
    outline: none;
  }

  .info-modal-body-wrap .scroll-focus-ring {
    border-radius: 0 0 6px 6px;
  }

  .info-modal-body:focus-visible ~ .scroll-focus-ring {
    display: block;
  }

  .info-modal-body h3 {
    font-size: 17px;
    font-weight: 700;
    margin: 16px 0 6px;
    color: #333;
  }

  .info-modal-body h3:first-child {
    margin-top: 0;
  }

  .info-modal-body p {
    margin: 0 0 12px;
  }

  .info-modal-body ul,
  .info-modal-body ol {
    margin: 0 0 12px;
    padding-left: 20px;
  }

  .info-modal-body li {
    margin-bottom: 4px;
  }

  /* Question containers below sim content */
  .question-row {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    padding: 0 27px;
    width: 100%;
    box-sizing: border-box;
  }

  .question-container {
    width: 517px;
    display: flex;
    flex-direction: column;
    border: 1px solid #858585;
    box-sizing: content-box;
  }

  .question-header {
    background: #047a99;
    height: 36px;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .question-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .question-body {
    background: #fff;
    flex: 1;
    min-height: 200px;
    padding: 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
  }

  .question-input {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 16px;
    height: 200px;
    margin-top: 10px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-style: italic;
    color: #767676;
    line-height: 1.5;
  }

  .content-area.standalone {
    border: 2px solid #555;
    border-radius: 10px;
    box-sizing: content-box;
    overflow: hidden;
  }

  /* Content area */
  .content-area {
    font-family: 'Lato', sans-serif;
    background: #fff;
    position: relative;
    flex-shrink: 0;
    transition: width 0.25s ease;
    display: flex;
    flex-direction: column;
    user-select: none;
    overflow: hidden;
  }

  /* Sim content containers */
  .sim-content {
    display: flex;
    gap: 10px;
    padding: 0 10px 10px 10px;
    flex: 1;
    min-height: 0;
  }

  .sim-panel-tab {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 36px;
    padding: 0 10px;
    background: #e8e8e8;
    border: 2px solid #555;
    border-radius: 8px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    font-family: 'Lato', sans-serif;
    white-space: nowrap;
    z-index: 11;
  }

  .sim-panel-tab-label {
    font-size: 18px;
    line-height: 22px;
    font-weight: 700;
    color: #333;
    margin: 0;
  }

  .sim-panel-tab-subtitle {
    font-size: 16px;
    font-weight: 400;
    color: #333;
  }

  .sim-tab-wrap {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: stretch;
    height: 36px;
    z-index: 11;
    box-sizing: border-box;
    white-space: nowrap;
  }

  .sim-panel {
    border: 2px solid #555;
    border-radius: 8px;
    background: #e8e8e8;
    margin-top: 17px;
    box-sizing: border-box;
    flex: 1;
    position: relative;
  }

  .sim-panel.has-scroll {
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .trials-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 31px 0 12px 15px;
  }

  .trials-scroll:focus-visible {
    outline: none;
  }

  .trials-scroll:focus-visible ~ .scroll-focus-ring {
    display: block;
  }

  .scroll-focus-ring {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px #fff, inset 0 0 0 3px #005FCC;
    pointer-events: none;
    z-index: 10;
  }

  .trial-card {
    width: 120px;
    height: 136px;
    border: 2px solid #555;
    border-radius: 6px;
    background: #fff;
    box-sizing: border-box;
    position: relative;
    flex-shrink: 0;
    font-family: 'Roboto Condensed', sans-serif;
  }

  .trial-card-label {
    position: absolute;
    top: 4px;
    left: 4px;
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #333;
    background: #e0e0e0;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .trial-card:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }

  .trial-card:hover,
  .trial-card:focus-visible {
    background: #f0f0f0;
  }

  .trial-card:active {
    background: #d0d0d0;
  }

  .trial-card.selected {
    background: #f0f0f0;
    border-color: #333;
    box-shadow: inset 0 0 0 1px #333;
  }

  .trial-card.new-card {
    border-style: dashed;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .trial-card-new-icon {
    width: 24px;
    height: 24px;
  }

  .trial-card.new-card:hover,
  .trial-card.new-card:focus-visible {
    background: #f0f0f0;
  }

  .trial-card.new-card:active {
    background: #d0d0d0;
  }

  .trial-card-new-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    font-weight: 700;
    color: #333;
    text-align: center;
  }

  .trial-card.selected .trial-card-label {
    color: #fff;
    background: #000;
  }

  .trial-card-reset {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 44px;
    height: 44px;
    background: transparent;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    padding: 0;
  }

  .trial-card-reset:focus-visible {
    outline: none;
  }

  .trial-card-reset:focus-visible::after {
    content: "";
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    outline: 2px solid #005FCC;
    outline-offset: 0px;
  }

  .trial-card-reset img {
    width: 28px;
    height: 28px;
    padding: 2px;
    border-radius: 4px;

<script>

  },

const AP_WIDTH = 1100;
const AP_CONTENT_W_EXPANDED = 767;
const AP_CONTENT_W_COLLAPSED = AP_WIDTH - 28 - 45 - 10 - 2 - 26;
const AP_HEADER_H = 36;
const AP_CONTENT_H = 562;

const LAYOUTS = {
  standalone: { name: "Standalone", hasAP: false, contentWidth: null },
  "ap-full": { name: "AP Full Width", hasAP: true, contentWidth: 1044, sidebar: false },
  "ap-2col": { name: "AP 2-Column", hasAP: true, contentWidth: 833, sidebar: true, sidebarExpanded: true }
};

const SIMS = {
  bananas: {
    name: "Bananas",
    description: "An interactive genetics simulation",
    titleFont: "'Slackey', 'Lato', sans-serif"
  },
  collapse: {
    name: "Collapse!",
    description: "Short description of the sim",
    titleFont: "'Fontdiner Swanky', 'Lato', cursive",
    titleLetterSpacing: "2px"
  },
  noreaster: {
    name: "Nor\u2019easter Riley",
    description: "Short description of the sim",
    titleFont: "'Vampiro One', 'Lato', cursive",
    titleLetterSpacing: "-0.5px"
  },
  tbd: {
    name: "Coming Soon",
    description: "Short description of the sim",
    titleFont: "'Coming Soon', 'Lato', cursive"
  }
};

let activeSim = "bananas";
let activeDevice = "none";
let activeLayout = "standalone";
let sidebarExpanded = true;

// Cached sim DOM elements — persist across layout switches
const SIM = {};
let _simTitleBar = null;
let _simContent = null;
let _currentSim = null; // tracks which sim the cached elements belong to

function getSimTitleBar() {
  if (!_simTitleBar || _currentSim !== activeSim) {
    _simTitleBar = buildSimTitleBar();
    _simContent = buildSimContent();
    _currentSim = activeSim;
  }
  return _simTitleBar;
}

function getSimContent() {
  if (!_simContent || _currentSim !== activeSim) {
    _simTitleBar = buildSimTitleBar();
    _simContent = buildSimContent();
    _currentSim = activeSim;
  }
  return _simContent;
}

function invalidateSimCache() {
  _simTitleBar = null;
  _simContent = null;
  _currentSim = null;
}

function buildSimTitleBar() {
  const bar = document.createElement("div");
  bar.className = "sim-title-bar";

  const left = document.createElement("div");
  left.className = "sim-title-left";
  const name = document.createElement("h1");
  name.className = "sim-title-name";
  name.textContent = SIMS[activeSim].name.toUpperCase();
  if (SIMS[activeSim].titleFont) {
    name.style.fontFamily = SIMS[activeSim].titleFont;
    if (SIMS[activeSim].titleLetterSpacing) {
      name.style.letterSpacing = SIMS[activeSim].titleLetterSpacing;
    }
  }

  const desc = document.createElement("span");
  desc.className = "sim-title-desc";
  desc.textContent = SIMS[activeSim].description;
  left.appendChild(name);
  left.appendChild(desc);

  const right = document.createElement("div");
  right.className = "sim-title-right";
  const deseLogo = document.createElement("img");
  deseLogo.src = "icons/DESE Logo.svg";
  deseLogo.alt = "DESE";
  deseLogo.className = "sim-title-logo";
  const ccLogo = document.createElement("img");
  ccLogo.src = "icons/CC Logo.svg";
  ccLogo.alt = "Concord Consortium";
  ccLogo.className = "sim-title-logo";
  const infoBtn = document.createElement("button");
  infoBtn.className = "sim-info-btn";
  const infoBtnIcon = document.createElement("img");
  infoBtnIcon.src = "icons/Info ICON.svg";
  infoBtnIcon.alt = "";
  infoBtnIcon.setAttribute("aria-hidden", "true");
  infoBtn.appendChild(infoBtnIcon);
  infoBtn.appendChild(document.createTextNode("About"));
  infoBtn.addEventListener("click", () => {
    // Remove existing modal if any
    const existing = document.querySelector(".info-modal");
    if (existing) { existing._closeModal(); return; }

    // Create modal
    const modal = document.createElement("div");
    modal.className = "info-modal";
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-label", "About the " + SIMS[activeSim].name + " Simulation");

    // Header
    const header = document.createElement("div");
    header.className = "info-modal-header";
    const hIcon = document.createElement("img");
    hIcon.className = "info-modal-header-icon";
    hIcon.src = "icons/Info ICON.svg";
    hIcon.alt = "";
    hIcon.setAttribute("aria-hidden", "true");
    const hTitle = document.createElement("h2");
    hTitle.className = "info-modal-header-title";
    hTitle.textContent = "About the " + SIMS[activeSim].name + " Simulation";
    const closeBtn = document.createElement("button");
    closeBtn.className = "info-modal-close";
    closeBtn.setAttribute("aria-label", "Close");
    const closeIcon = document.createElement("img");
    closeIcon.src = "icons/Close ICON.svg";
    closeIcon.alt = "";
    closeIcon.setAttribute("aria-hidden", "true");
    closeBtn.appendChild(closeIcon);
    function closeModal() {
      modal.remove();
      document.removeEventListener("keydown", onModalKeydown);
      document.removeEventListener("mousemove", onMouseMove);
      document.removeEventListener("mouseup", onMouseUp);

        scrollWrap.setAttribute("aria-label", "Trials");
        function updateTrialsTabindex() {
          if (scrollWrap.scrollHeight > scrollWrap.clientHeight) {
            scrollWrap.setAttribute("tabindex", "0");
          } else {
            scrollWrap.removeAttribute("tabindex");
          }
        }
        const allLabels = ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"];
        const trialState = {};
        SIM.trialState = trialState;
        SIM.trialCards = {};
        SIM.selectedTrial = "A";
        let activeTrialCount = 1; // Start with just A

        // Abbreviate parent names for trial cards: "Wild W1" → "W1", "Cavendish C1" → "C1"
        function abbrev(name) {
          if (!name) return null;
          const parts = name.split(" ");
          return parts[parts.length - 1];
        }

        function updateTrialCardLabel(letter) {
          const cardEl = SIM.trialCards[letter];
          if (!cardEl) return;
          const st = trialState[letter];

          // Build or get info container
          let statsEl = cardEl.querySelector(".trial-card-stats");
          if (!statsEl) {
            statsEl = document.createElement("div");
            statsEl.className = "trial-card-stats";
            cardEl.appendChild(statsEl);
          }

          // Build content
          let html = "";
          // Line 1: cross label — × always centered
          function crossRow(left, right) {
            return '<span style="display:flex;align-items:center;justify-content:center;gap:4px;font-weight:500;font-size:16px;width:100%">' +
              '<span style="flex:1;text-align:right">' + left + '</span>' +
              '<span>\u00d7</span>' +
              '<span style="flex:1;text-align:left">' + right + '</span>' +
            '</span>';
          }
          if (st.p1 && st.p2) {
            html += crossRow(abbrev(st.p1), abbrev(st.p2));
          } else if (st.p1) {
            html += crossRow(abbrev(st.p1), '\u2026');
          } else if (st.p2) {
            html += crossRow('\u2026', abbrev(st.p2));
          }

          const allPlants = st.generations.flat();
          if (allPlants.length > 0) {
            // Line 2: offspring count
            html += '<span>Offspring: ' + allPlants.length + '</span>';
            // Line 3: healthy / infected %
            const inf = allPlants.filter(p => p.infected).length;
            const hPct = Math.round(((allPlants.length - inf) / allPlants.length) * 100);
            const iPct = 100 - hPct;
            html += '<span style="display:flex;align-items:center;gap:4px;justify-content:center">' +
              '<span style="width:14px;height:14px;border-radius:2px;background:#C2C2C2;border:1px solid #333;flex-shrink:0"></span>' + hPct + '%' +
              '<span style="width:1px"></span>' +
              '<span style="width:14px;height:14px;border-radius:2px;background:#444;border:1px solid #333;flex-shrink:0"></span>' + iPct + '%' +
              '</span>';
          } else if (st.fungusAfterGen !== null) {
            html += '<span aria-hidden="true">&nbsp;</span>';
            html += '<span aria-hidden="true">&nbsp;</span>';
