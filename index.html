// =====================================================================
// Shared query filter — "consistently available in all interfaces"
// (Day 2 spec). The deployed Pathway Explorer parses these with liqe,
// a Lucene-like parser. A prototype in one HTML file cannot pull that
// dependency, so this implements the subset the curriculum actually
// uses, with the same syntax, so queries copy across between the two:
//
//   model_correct:0            voices_raised:1 AND pathway_0:>1
//   pathway_2:>2               yandor                (bare word = text)
//   NOT near_water:1           target_label:approach OR pathway_1:<-2
// =====================================================================
const NNM_FILTER = (function () {
  const D = window.NNM_DATA;

  // resource_stressed is deliberately absent: on Day 3 it is the planted
  // bias, hidden until students commission the coding. Exposing it in the
  // Day 2 search box would give the answer away before the investigation.
  const HIDDEN_FIELDS = ["resource_stressed"];

  const attrKeys = D.attributeKeys.filter(function (k) { return HIDDEN_FIELDS.indexOf(k) < 0; });
  const attrLabel = {};
  D.attributes.forEach(function (a) { attrLabel[a.key] = a.label; });

  const FIELDS = ["text", "target", "target_label", "prediction", "model_correct"]
    .concat(attrKeys)
    .concat(D.items.length ? Array.from({ length: D.nPathways }, function (_, i) { return "pathway_" + i; }) : []);

  function flatten(it) {
    const o = {
      text: it.text.replace(/\n/g, " "),
      target: it.target,
      target_label: it.target === 1 ? "approach" : "wait",
      prediction: it.pred,
      model_correct: it.pred === it.target ? 1 : 0
    };
    for (let p = 0; p < D.nPathways; p++) o["pathway_" + p] = it.act[p];
    D.attributeKeys.forEach(function (k, i) {
      if (HIDDEN_FIELDS.indexOf(k) < 0) o[k] = it.attrs[i];
    });
    return o;
  }
  const FLAT = D.items.map(flatten);

  // ---- tokenizer ----
  function lex(s) {
    const out = [];
    const re = /\s*(\(|\)|"[^"]*"|[^\s()]+)/g;
    let m;
    while ((m = re.exec(s)) !== null) out.push(m[1]);
    return out;
  }

  // ---- recursive descent ----
  function parse(str) {
    const toks = lex(str);
    let i = 0;
    const peek = function () { return toks[i]; };
    const isKw = function (t, kw) { return t && t.toUpperCase() === kw; };

    function parseOr() {
      let left = parseAnd();
      while (isKw(peek(), "OR")) { i++; const right = parseAnd(); left = or(left, right); }
      return left;
    }
    function parseAnd() {
      let left = parseNot();
      while (peek() && peek() !== ")" && !isKw(peek(), "OR")) {
        if (isKw(peek(), "AND")) i++;
        if (!peek() || peek() === ")" || isKw(peek(), "OR")) break;
        const right = parseNot();
        left = and(left, right);
      }
      return left;
    }
    function parseNot() {
      if (isKw(peek(), "NOT")) { i++; const inner = parseNot(); return function (o) { return !inner(o); }; }
      if (peek() && peek()[0] === "-" && peek().length > 1) {
        toks[i] = toks[i].slice(1);
        const inner = parseNot();
        return function (o) { return !inner(o); };
      }
      return parsePrimary();
    }
    function parsePrimary() {
      if (peek() === "(") { i++; const e = parseOr(); if (peek() === ")") i++; return e; }
      const t = toks[i++];
      if (t === undefined) return function () { return true; };
      return term(t);
    }
    function and(a, b) { return function (o) { return a(o) && b(o); }; }
    function or(a, b) { return function (o) { return a(o) || b(o); }; }

    function term(t) {
      const c = t.indexOf(":");
      if (c < 1) {                                   // bare word -> text search
        const needle = t.replace(/^"|"$/g, "").toLowerCase();
        return function (o) { return String(o.text).toLowerCase().indexOf(needle) >= 0; };
      }
      const field = t.slice(0, c);
      let raw = t.slice(c + 1).replace(/^"|"$/g, "");
      if (FIELDS.indexOf(field) < 0) throw new Error("unknown field “" + field + "”");
      const cmp = raw.match(/^(>=|<=|>|<)(.*)$/);
      if (cmp) {
        const n = parseFloat(cmp[2]);
        if (isNaN(n)) throw new Error("“" + cmp[2] + "” is not a number");
        const op = cmp[1];
        return function (o) {
          const v = o[field];
          if (typeof v !== "number") return false;
          return op === ">" ? v > n : op === "<" ? v < n : op === ">=" ? v >= n : v <= n;
        };
      }
      const num = parseFloat(raw);
      const isNum = raw !== "" && !isNaN(num) && /^-?[\d.]+$/.test(raw);
      const needle = raw.toLowerCase();
      return function (o) {
        const v = o[field];
        if (isNum && typeof v === "number") return v === num;
        return String(v).toLowerCase().indexOf(needle) >= 0;
      };
    }

    const fn = parseOr();
    if (i < toks.length) throw new Error("could not read “" + toks.slice(i).join(" ") + "”");
    return fn;
  }

  function run(query) {
    if (!query.trim()) return { items: D.items.slice(), error: null };
    let fn;
    try { fn = parse(query); }
    catch (e) { return { items: null, error: e.message }; }
    const out = [];
    for (let k = 0; k < FLAT.length; k++) if (fn(FLAT[k])) out.push(D.items[k]);
    return { items: out, error: null };
  }

  // ---- the bar ----
  function buildBar(onChange) {
    const bar = document.createElement("div");
    bar.className = "nnm-filterbar";

    const label = document.createElement("label");
    label.className = "nnm-filter-label";
    label.textContent = "Find";
    const id = "nnm-q-" + Math.floor(performance.now() * 1000 % 1e9);
    label.setAttribute("for", id);

    const input = document.createElement("input");
    input.type = "text";
    input.id = id;
    input.className = "nnm-filter-input";
    input.placeholder = "model_correct:0";
    input.setAttribute("autocomplete", "off");
    input.setAttribute("spellcheck", "false");

    const count = document.createElement("span");
    count.className = "nnm-filter-count";

    const helpBtn = document.createElement("button");
    helpBtn.className = "nnm-filter-help";
    helpBtn.textContent = "?";
    helpBtn.setAttribute("aria-label", "Show what you can search for");
    helpBtn.setAttribute("aria-expanded", "false");

    const help = document.createElement("div");
    help.className = "nnm-filter-helpbox";
    help.hidden = true;
    help.innerHTML =
      '<b>Fields</b><div class="nnm-fieldlist">' +
      FIELDS.map(function (f) { return '<code>' + f + '</code>'; }).join(" ") +
      '</div><b>Examples</b><ul>' +
      '<li><code>model_correct:0</code> — the ones the model got wrong</li>' +
      '<li><code>pathway_2:&gt;2</code> — a high score on P2</li>' +
      '<li><code>voices_raised:1 AND pathway_0:&lt;0</code></li>' +
      '<li><code>yandor</code> — conversations containing that word</li>' +
      '<li><code>NOT near_water:1</code></li>' +
      '</ul>';

    bar.appendChild(label);
    bar.appendChild(input);
    bar.appendChild(count);
    bar.appendChild(helpBtn);

    const wrapEl = document.createElement("div");
    wrapEl.className = "nnm-filterwrap";
    wrapEl.appendChild(bar);
    wrapEl.appendChild(help);

    helpBtn.addEventListener("click", function () {
      help.hidden = !help.hidden;
      helpBtn.setAttribute("aria-expanded", help.hidden ? "false" : "true");
    });

    let last = D.items.slice();
    let live = false;
    function apply() {
      const r = run(input.value);
      if (r.error) {
        bar.classList.add("bad");
        count.textContent = r.error;
        count.classList.add("err");
        return;
      }
      bar.classList.remove("bad");
      count.classList.remove("err");
      last = r.items;
      count.textContent = r.items.length === D.items.length
        ? String(D.items.length)
        : r.items.length + " of " + D.items.length;
      if (live) onChange(r.items);
    }
    input.addEventListener("input", apply);
    apply();
    live = true;   // the caller renders the initial state itself

    return { el: wrapEl, input: input, current: function () { return last; } };
  }

  return { buildBar: buildBar, run: run, FIELDS: FIELDS };
})();

// Each day's interactive is built here, branching on activeSim.
// Screens not yet built fall through to the blank wrap at the bottom.
function buildSimContent() {

  // ---------------------------------------------------------------
  // 2B — The Decision Chain.  Laid out to match Design Sketches p.3:
  // left, one card holding all three pathway readings; right, the flow
  // activation x importance => weighted, the three converging on a sum,
  // the sum choosing between two outcomes, and the stacked bar beneath.
  // Probability is omitted on purpose (spec: "not visible, for internal").
  // ---------------------------------------------------------------
  if (activeSim === "d2b") {
    const D = window.NNM_DATA;
    const NP = D.nPathways;
    const IMP = D.importance;
    const PATH_NAMES = ["Pathway 0", "Pathway 1", "Pathway 2"];
    const SVGNS = "http://www.w3.org/2000/svg";

    // Fills are quantised into five steps rather than a smooth ramp. Every
    // continuous ramp has a band where neither dark nor light text reaches
    // 4.5:1; stepping over it keeps each level legible, and it also matches
    // the handful of distinct tints in the sketch. Verified per level.
    const FILL_NEG = ["#C8D6E9", "#A9BDD8", "#8DA6CA", "#7694BD", "#1F4E8F"];
    const FILL_POS = ["#EFD3C4", "#E0B6A4", "#D29A84", "#C6836C", "#A84A2C"];
    const CUTS = [0.12, 0.30, 0.50, 0.75];
    function level(t) {
      for (let i = 0; i < CUTS.length; i++) if (t < CUTS[i]) return i;
      return 4;
    }
    function paint(el, v, scale) {
      const L = level(Math.min(1, Math.abs(v) / scale));
      el.style.background = (v >= 0 ? FILL_POS : FILL_NEG)[L];
      el.style.color = L === 4 ? "#fff" : "#1E242C";
      el.style.borderColor = L === 4 ? "transparent" : "rgba(30,36,44,0.14)";
    }

    const SUM_SCALE = 40;
    const ACT_SCALE = Math.max.apply(null, D.scoreMin.map(Math.abs).concat(D.scoreMax.map(Math.abs)));
    const IMP_MAX = Math.max.apply(null, IMP.map(Math.abs));
    const TOK_MAX = [0, 0, 0];
    Object.keys(D.vocabulary).forEach(function (w) {
      const v = D.vocabulary[w];
      TOK_MAX[v[0]] = Math.max(TOK_MAX[v[0]], Math.abs(v[1]));
    });

    let cases = D.items.slice();
    let idx = 0;
    let step = 0;      // 0 = empty skeleton; the four buttons fill it in

    const wrap = document.createElement("div");
    wrap.className = "sim-content";
    const liveAnnounce = document.createElement("div");
    liveAnnounce.className = "sr-only";
    liveAnnounce.setAttribute("aria-live", "polite");
    liveAnnounce.setAttribute("aria-atomic", "true");
    wrap.appendChild(liveAnnounce);
    SIM.announce = function (msg) {
      liveAnnounce.textContent = "";
      requestAnimationFrame(function () { liveAnnounce.textContent = msg; });
    };
    SIM._timeouts = []; SIM._observers = [];

    const stack = document.createElement("div");
    stack.className = "nnm-stack";
    wrap.appendChild(stack);

    const root = document.createElement("div");
    root.className = "nnm";
    stack.appendChild(root);

    // The find bar sits over the conversation list it filters, so it takes the
    // left column's width and the flow panel runs the full height beside it.
    const leftCol = document.createElement("div");
    leftCol.className = "nnm-leftcol";
    root.appendChild(leftCol);

    const filter = NNM_FILTER.buildBar(function (items) { cancelAnim(); cases = items; idx = 0; render(); });
    leftCol.appendChild(filter.el);

    const emptyMsg = document.createElement("div");
    emptyMsg.className = "nnm-empty";
    emptyMsg.textContent = "No conversations match that search.";
    emptyMsg.hidden = true;

    // ================= left: the three readings =================
    const casePanel = document.createElement("div");
    casePanel.className = "nnm-panel nnm-readings";
    casePanel.setAttribute("role", "region");
    casePanel.setAttribute("aria-label", "Conversation");

    const caseHead = document.createElement("div");
    caseHead.className = "nnm-panel-head";
    const caseIdEl = document.createElement("span");
    caseIdEl.textContent = "Conversation";
    caseHead.appendChild(caseIdEl);
    const nav = document.createElement("div");
    nav.className = "nnm-nav";
    const countEl = document.createElement("span");
    countEl.className = "nnm-count";
    const prevBtn = document.createElement("button");
    prevBtn.className = "nnm-navbtn"; prevBtn.innerHTML = "&#9664;";
    prevBtn.setAttribute("aria-label", "Previous conversation");
    const nextBtn = document.createElement("button");
    nextBtn.className = "nnm-navbtn"; nextBtn.innerHTML = "&#9654;";
    nextBtn.setAttribute("aria-label", "Next conversation");
    nav.appendChild(countEl); nav.appendChild(prevBtn); nav.appendChild(nextBtn);
    caseHead.appendChild(nav);
    casePanel.appendChild(caseHead);

    const caseBody = document.createElement("div");
    caseBody.className = "nnm-panel-body";
    caseBody.style.display = "flex";
    caseBody.style.flexDirection = "column";
    caseBody.style.overflow = "hidden";
    // An empty spacer, not a heading: it exists only to match the height of the
    // flow's column captions so reading 1 and flow row 1 start on the same line.
    const readHead = document.createElement("div");
    readHead.className = "nnm-readhead";
    readHead.setAttribute("aria-hidden", "true");
    caseBody.appendChild(readHead);

    const readScroll = document.createElement("div");
    readScroll.className = "nnm-readscroll";
    caseBody.appendChild(readScroll);

    const readings = [];
    for (let p = 0; p < NP; p++) {
      const r = document.createElement("div");
      r.className = "nnm-read";
      r.innerHTML =
        '<div class="nnm-read-name">' + PATH_NAMES[p] + '</div>' +
        '<div class="nnm-read-scale"><span class="lo"></span>' +
          '<span class="grad"></span><span class="hi"></span></div>' +
        '<div class="nnm-read-text"></div>';
      readScroll.appendChild(r);
      readings.push(r);
    }

    casePanel.appendChild(caseBody);
    leftCol.appendChild(casePanel);
    leftCol.appendChild(emptyMsg);

    // ================= right: the flow =================
    const rightCol = document.createElement("div");
    rightCol.className = "nnm-rightcol";
    root.appendChild(rightCol);

    const chainPanel = document.createElement("div");
    chainPanel.className = "nnm-panel nnm-flowpanel";
    chainPanel.setAttribute("role", "region");
    chainPanel.setAttribute("aria-label", "How the pathways decide");

    const chainHead = document.createElement("div");
    chainHead.className = "nnm-panel-head";
    const chainHeadTitle = document.createElement("span");
    chainHeadTitle.textContent = "Neural pathways";
    chainHead.appendChild(chainHeadTitle);

    const STEP_LABELS = ["Words", "Weigh", "Add up", "Decide"];
    let prevStep = 0;
    let wordAnim = false;          // true while the Words sequence is in flight
    let weighAnim = false;         // true while the Weigh sequence is in flight
    let addUpAnim = false;         // true while the three lines are converging
    let decideAnim = false;        // true while the answer line is being drawn
    let decidePending = true;      // the answer line is hidden until Decide runs
    let animateOn = true;          // the Animate checkbox
    // The non-animated version is the same screen with every stage arriving at
    // once. Reduced-motion users get it whether or not the box is ticked.
    function motionOff() {
      return !animateOn || window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }
    const CONV_W = 46;             // the conv SVG's real layout contribution
    let animSeq = 0;               // bumped to invalidate anything still queued
    const animTimers = [];

    function cancelAnim() {
      animSeq++;
      animTimers.forEach(clearTimeout);
      animTimers.length = 0;
      document.querySelectorAll(".nnm-fly").forEach(function (e) { e.remove(); });
      if (trackRaf) { cancelAnimationFrame(trackRaf); trackRaf = null; }
      for (let i = 0; i < solidPending.length; i++) solidPending[i] = false;
      decidePending = true;
      wordAnim = false;
      weighAnim = false;
      addUpAnim = false;
      decideAnim = false;
    }
    function later(fn, ms) {
      const mine = animSeq;
      const t = setTimeout(function () { if (mine === animSeq) fn(); }, ms);
      animTimers.push(t);
      SIM._timeouts.push(t);
    }

    // One word at a time: it lights where it sits, travels to the activation
    // cell carrying its own score, and on arrival that score is added to the
    // running total in the cell. The number a student watches climb IS the sum
    // that defines the pathway activation.
    function flyOne(el, target, v) {
      const r = el.getBoundingClientRect();
      const tr = target.getBoundingClientRect();
      const c = document.createElement("span");
      c.className = "nnm-fly";
      c.style.left = r.left + "px";
      c.style.top = r.top + "px";
      // Colours come from the token's own custom properties, not getComputedStyle:
      // `lit` animates the background, so the computed value can still be the
      // un-lit one and the chip would come out transparent.
      c.style.background = el.style.getPropertyValue("--tok-bg") || "#DDE3EC";
      c.style.color = el.style.getPropertyValue("--tok-fg") || "#1E242C";
      c.textContent = el.textContent;
      document.body.appendChild(c);

      // Aim at the top edge of the cell, centred, so the chips pour in over the
      // rim rather than converging on the middle of the number.
      // Measure the CHIP, not the word. The chip is placed at the word's top-left
      // but is a different size — it carries the score as well — so offsetting by
      // the word's centre leaves the chip landing about 20px right of target.
      const cr = c.getBoundingClientRect();
      const dx = (tr.left + tr.width / 2) - (cr.left + cr.width / 2);
      const dy = tr.top - (cr.top + cr.height / 2);

      // A sampled quadratic Bézier rather than a few waypoints: the control point
      // sits above the midpoint, so the path is a real parabola into the cell.
      // Easing is baked into the sampling and the animation runs linear, because
      // an easing in the options would be re-applied between every keyframe.
      const lift = Math.min(150, Math.abs(dx) * 0.30 + 60);
      const cx = dx * 0.42;
      const cy = Math.min(0, dy) - lift;
      const STEPS = 20;
      const frames = [];
      for (let i = 0; i <= STEPS; i++) {
        const u = i / STEPS;
        const s2 = u * u * (3 - 2 * u);               // smoothstep
        const mt = 1 - s2;
        const x = 2 * mt * s2 * cx + s2 * s2 * dx;
        const y = 2 * mt * s2 * cy + s2 * s2 * dy;
        const sc = 1 - 0.56 * Math.pow(s2, 1.5);
        const rot = (1 - s2) * (dx < 0 ? 5 : -5);
        const op = s2 < 0.74 ? 1 : Math.max(0, 1 - (s2 - 0.74) / 0.26);
        frames.push({
          offset: u,
          transform: "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) rotate(" +
            rot.toFixed(2) + "deg) scale(" + sc.toFixed(3) + ")",
          opacity: op
        });
      }
      c.animate(frames, { duration: FLY, easing: "linear", fill: "forwards" });
      later(function () { c.remove(); }, FLY + 120);
    }

    function showZero(cell) {
      cell.textContent = fmt(0, 3);
      cell.style.background = "#fff";
      cell.style.color = "var(--nnm-ink-3)";
      cell.style.borderColor = "rgba(30,36,44,0.14)";
    }

    function showRunning(cell, v) {
      cell.textContent = fmt(v, 3);
      cell.style.color = "";
      paint(cell, v, ACT_SCALE);
      cell.classList.remove("nnm-tick");
      void cell.offsetWidth;
      cell.classList.add("nnm-tick");
    }

    const SCAN_HOLD = 300;   // how long a word wears the outline before resolving
    const FLY = 1440;        // a chip's journey
    const PAUSE = 100;       // after the sentence is lit, before the cell opens
    const TO_FLY = 110;      // base held before the first word sets off
    const TAIL = 170;        // after the last arrival, before the next pathway

    function playWords() {
      const it = cases[idx];
      const groups = readings.map(function (r) {
        return Array.prototype.slice.call(r.querySelectorAll(".nnm-tok.scored"));
      });
      const allWords = readings.map(function (r) {
        return Array.prototype.slice.call(r.querySelectorAll(".nnm-tok"));
      });
      if (motionOff()) {
        allWords.forEach(function (g) { g.forEach(function (e) { e.classList.add("lit"); }); });
        rows.forEach(function (r, p) { revealCell(r.querySelector(".act"), 0); });
        wordAnim = false;
        return;
      }
      let t = 0;
      for (let p = 0; p < NP; p++) {
        const toks = groups[p];
        const all = allWords[p];
        const cell = rows[p].querySelector(".act");
        const n = toks.length;
        // Longer conversations send words faster, so a pathway takes roughly the
        // same time to build whether it has four words or fourteen.
        const gap = Math.max(80, Math.min(170, 1100 / Math.max(1, n)));
        const start = t;

        // 1. every word in the sentence is scanned in turn — outlined, then
        //    resolved to a colour if this pathway knows it, or left white if not.
        //    Scanning all of them, not just the scoring ones, is the point: the
        //    model reads the whole sentence.
        const scanGap = Math.max(55, Math.min(120, 1400 / Math.max(1, all.length)));
        all.forEach(function (el, i) {
          later(function () { el.classList.add("scanning"); }, start + i * scanGap);
          later(function () {
            el.classList.remove("scanning");
            if (el.classList.contains("scored")) el.classList.add("lit");
          }, start + i * scanGap + SCAN_HOLD);
        });

        // 2. the cell opens empty, at zero
        const opened = start + all.length * scanGap + SCAN_HOLD + PAUSE;
        later(function () { cell.classList.remove("empty"); showZero(cell); }, opened);

        // 3. the words, one at a time. The pathway's constant base value rides in
        //    with the first of them rather than appearing on its own beforehand:
        //    it is 0.2-0.9% of each pathway's range, and the thing it was meant to
        //    stand for — the length of the text — is not in this data, since it is
        //    the same value for a 12-word conversation and a 40-word one.
        //    Ten of the 800 conversations leave some pathway with no words at all;
        //    there is nothing to fold into, so those cells open on their answer.
        let running = 0;
        const flyFrom = opened + TO_FLY;
        toks.forEach(function (el, i) {
          const v = D.vocabulary[el.textContent][1];
          const add = i === 0 ? v + D.baseValues[p] : v;
          later(function () { flyOne(el, cell, v); }, flyFrom + i * gap);
          later(function () { running += add; showRunning(cell, running); }, flyFrom + i * gap + FLY);
        });
        if (n === 0) {
          later(function () { showRunning(cell, it.act[p]); }, flyFrom);
        }

        // land on the stored activation, not the accumulated float, so the cell
        // agrees to the last digit with every other number on screen
        later(function () {
          cell.textContent = fmt(it.act[p], 3);
          paint(cell, it.act[p], ACT_SCALE);
        }, flyFrom + n * gap + FLY + 40);

        t = flyFrom + n * gap + FLY + TAIL;
      }
      later(function () { wordAnim = false; }, t);
    }

    const WGT_MIN = 46;      // narrowest a weighted box gets, still fits its number

    // Weighted boxes are sized against the largest weighted value in THIS
    // conversation, so the row shows how much of this decision each pathway is
    // responsible for. On most conversations P0 fills its slot and the other two
    // are slivers — which is the point, and is what the stacked bar used to say.
    function weightedWidth(w, maxAbs, full) {
      if (!maxAbs) return full;
      return WGT_MIN + (full - WGT_MIN) * Math.min(1, Math.abs(w) / maxAbs);
    }

    function playWeigh() {
      const it = cases[idx];
      const wgt = it.act.map(function (a, p) { return a * IMP[p]; });
      const maxAbs = Math.max.apply(null, wgt.map(Math.abs));
      const full = rows[0].querySelector(".nnm-slot").getBoundingClientRect().width;
      const apply = function (p) {
        const cell = rows[p].querySelector(".wgt");
        cell.style.width = Math.round(weightedWidth(wgt[p], maxAbs, full)) + "px";
        cell.textContent = fmt(wgt[p], 2);
        paint(cell, wgt[p], SUM_SCALE);
        revealCell(cell, 0);
        trackConnectors(motionOff() ? 0 : 520);
      };

      if (motionOff()) {
        rows.forEach(function (r) { r.classList.add("lit-mul", "lit-arr"); });
        for (let p = 0; p < NP; p++) apply(p);
        weighAnim = false;
        return;
      }

      let t = 0;
      for (let p = 0; p < NP; p++) {
        (function (pi, start) {
          const r = rows[pi];
          later(function () { r.classList.add("lit-mul"); }, start);
          later(function () { r.querySelector(".imp").classList.add("nnm-tick"); }, start + 260);
          later(function () { r.classList.add("lit-arr"); }, start + 560);
          later(function () { apply(pi); }, start + 820);
        })(p, t);
        t += 1040;
      }
      later(function () { weighAnim = false; }, t);
    }

    // The three lines converge together, not one after another, and the sum only
    // appears once they have all arrived — it is what they add up to, so it should
    // not be sitting there before they land.
    const DRAW = 620;

    function playAddUp() {
      if (motionOff()) {
        for (let i = 0; i < NP; i++) solidPending[i] = false;
        addUpAnim = false;
        trackConnectors(0);
        return;
      }
      for (let i = 0; i < NP; i++) solidPending[i] = true;
      trackConnectors(0);

      later(function () {
        for (let i = 0; i < NP; i++) solidPending[i] = false;
        // Redraw first so the resting attribute reads "drawn": the animation has
        // no fill, so when it ends the attribute is what keeps the line visible.
        drawConnectors(lastChosen);
        convSolid.forEach(function (sol) {
          const len = parseFloat(sol.getAttribute("stroke-dasharray")) || 0;
          sol.animate(
            [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
            { duration: DRAW, easing: "cubic-bezier(.3,0,.35,1)" }
          );
        });
      }, 60);

      later(function () {
        addUpAnim = false;
        sumCell.classList.remove("empty");
        revealCell(sumCell, 0);
      }, 60 + DRAW + 90);
    }

    // The two answers are on screen from the start, plain. Decide draws the line
    // to the one the sum picked, and only when it arrives does that answer take
    // its colour — the line delivers the result rather than confirming it.
    function playDecide() {
      if (motionOff()) {
        decidePending = false;
        decideAnim = false;
        trackConnectors(0);
        return;
      }
      decidePending = true;
      trackConnectors(0);
      later(function () {
        decidePending = false;
        drawConnectors(lastChosen);
        const flen = fanSolid.getTotalLength ? fanSolid.getTotalLength() : 0;
        fanSolid.animate(
          [{ strokeDashoffset: flen }, { strokeDashoffset: 0 }],
          { duration: DRAW, easing: "cubic-bezier(.3,0,.35,1)" }
        );
      }, 60);
      later(function () {
        decideAnim = false;
        outEls.forEach(function (o) {
          o.el.classList.toggle("on", o.v === lastChosen);
        });
      }, 60 + DRAW + 60);
    }

    function setStep(n) {
      cancelAnim();
      const from = step;
      step = n;
      wordAnim = (n === 1);
      weighAnim = (n === 2);
      // Must be set before render(), not after: render decides whether the sum
      // cell is filled or left as a stand-in, and it reads this.
      addUpAnim = (n >= 3 && from < 3 && !motionOff());
      decideAnim = (n >= 4 && from < 4 && !motionOff());
      render();
      if (wordAnim) playWords();
      if (weighAnim) playWeigh();
      if (n >= 3 && from < 3) playAddUp();
      if (n >= 4 && from < 4) playDecide();
    }
    const steps = document.createElement("div");
    steps.className = "nnm-steprow";
    const stepBtns = STEP_LABELS.map(function (label, i) {
      const b = document.createElement("button");
      b.className = "nnm-step"; b.textContent = label;
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () { setStep(i + 1); });
      steps.appendChild(b);
      return b;
    });
    const resetBtn = document.createElement("button");
    resetBtn.className = "nnm-reset";
    resetBtn.innerHTML = "&#8634;";
    resetBtn.setAttribute("aria-label", "Clear the steps and start over");
    resetBtn.addEventListener("click", function () { setStep(0); });
    steps.appendChild(resetBtn);

    const animWrap = document.createElement("label");
    animWrap.className = "nnm-animtoggle";
    const animBox = document.createElement("input");
    animBox.type = "checkbox";
    animBox.checked = true;
    const animText = document.createElement("span");
    animText.textContent = "Animate";
    animWrap.appendChild(animBox);
    animWrap.appendChild(animText);
    animBox.addEventListener("change", function () {
      animateOn = animBox.checked;
      wrap.classList.toggle("nnm-nomotion", !animateOn);
      // Whatever was mid-flight is abandoned and the current step is re-drawn in
      // whichever mode we just switched to.
      cancelAnim();
      setStep(step);
    });
    steps.appendChild(animWrap);

    rightCol.appendChild(steps);
    chainPanel.appendChild(chainHead);

    const chainOuter = document.createElement("div");
    chainOuter.className = "nnm-panel-body nnm-flowouter";
    chainPanel.appendChild(chainOuter);
    const chainBody = document.createElement("div");
    chainBody.className = "nnm-flowbodywrap";
    chainOuter.appendChild(chainBody);
    rightCol.appendChild(chainPanel);

    const flowHead = document.createElement("div");
    flowHead.className = "nnm-flowhead";
    flowHead.innerHTML =
      '<span class="c act">Pathway<br>Activation</span>' +
      '<span class="g"></span>' +
      '<span class="c imp">Pathway<br>Importance</span>' +
      '<span class="g"></span>' +
      '<span class="c wgt">Weighted<br>Value</span>' +
      '<span class="c far sum">Weighted<br>Sum</span>' +
      '<span class="c far dec">Decision</span>';
    chainBody.appendChild(flowHead);

    const flowBody = document.createElement("div");
    flowBody.className = "nnm-flowbody";
    chainBody.appendChild(flowBody);

    const rowsEl = document.createElement("div");
    rowsEl.className = "nnm-frows";
    flowBody.appendChild(rowsEl);

    function glyphX() {
      return '<svg class="nnm-glyph" viewBox="0 0 32 32" aria-hidden="true">' +
        '<path d="M6 2 L16 12 L26 2 L30 6 L20 16 L30 26 L26 30 L16 20 L6 30 L2 26 L12 16 L2 6 Z" ' +
        'fill="#E3E7ED" stroke="#CBD2DC" stroke-width="1.2" stroke-linejoin="round"/></svg>';
    }
    function glyphArrow() {
      return '<svg class="nnm-glyph arr" viewBox="0 0 32 24" aria-hidden="true">' +
        '<path d="M2 8 H18 V2 L30 12 L18 22 V16 H2 Z" ' +
        'fill="#F1F3F6" stroke="#CBD2DC" stroke-width="1.2" stroke-linejoin="round"/></svg>';
    }

    const rows = [];
    for (let p = 0; p < NP; p++) {
      const r = document.createElement("div");
      r.className = "nnm-frow";
      r.innerHTML =
        '<span class="nnm-cell act"></span>' +
        '<span class="nnm-op mul">' + glyphX() + '</span>' +
        '<span class="nnm-cell imp"></span>' +
        '<span class="nnm-op arr">' + glyphArrow() + '</span>' +
        '<span class="nnm-slot"><span class="nnm-cell wgt"></span></span>';
      rowsEl.appendChild(r);
      rows.push(r);
    }

    // three weighted values converging on one score
    const conv = document.createElementNS(SVGNS, "svg");
    conv.setAttribute("class", "nnm-conv");
    const convPaths = [];
    for (let p = 0; p < NP; p++) {
      const ln = document.createElementNS(SVGNS, "line");
      ln.setAttribute("stroke", "#9AA3B0");
      ln.setAttribute("stroke-width", "1.3");
      ln.setAttribute("stroke-dasharray", "5 4");
      ln.setAttribute("stroke-linecap", "round");
      conv.appendChild(ln);
      convPaths.push(ln);
    }
    // A solid line over each dashed guide. It is hidden by holding its dash
    // offset at the full length, and drawn by running that offset to zero — from
    // the weighted value towards the sum, which is the direction of x1 to x2.
    // While a line is waiting its turn to be drawn it must read as hidden, not as
    // finished. An animation delay cannot do that job: during the delay the
    // animation is not in effect, so the resting "fully drawn" value applies and
    // the line flashes in complete before snapping back. Each line's turn is
    // scheduled instead, and this records which are still waiting.
    const solidPending = [false, false, false];
    const convSolid = [];
    for (let p = 0; p < NP; p++) {
      const ln = document.createElementNS(SVGNS, "line");
      ln.setAttribute("stroke", "#3E4753");
      ln.setAttribute("stroke-width", "2");
      ln.setAttribute("stroke-linecap", "round");
      conv.appendChild(ln);
      convSolid.push(ln);
    }
    flowBody.appendChild(conv);

    const decideWrap = document.createElement("div");
    decideWrap.className = "nnm-decidewrap";
    const decideRow = document.createElement("div");
    decideRow.className = "nnm-deciderow";
    decideWrap.appendChild(decideRow);
    flowBody.appendChild(decideWrap);

    const tail = document.createElement("div");
    tail.className = "nnm-tail";
    const sumLabel = document.createElement("div");
    sumLabel.className = "nnm-taillabel";
    sumLabel.hidden = true;   // the caption now lives in the header row
    const sumCell = document.createElement("div");
    sumCell.className = "nnm-cell sum";
    tail.appendChild(sumLabel);
    tail.appendChild(sumCell);
    decideRow.appendChild(tail);

    // sum -> one of two outcomes
    const fan = document.createElementNS(SVGNS, "svg");
    fan.setAttribute("class", "nnm-fan");
    const fanUp = document.createElementNS(SVGNS, "path");
    const fanDown = document.createElementNS(SVGNS, "path");
    [fanUp, fanDown].forEach(function (pth) {
      pth.setAttribute("fill", "none");
      pth.setAttribute("stroke", "#B9C0CA");
      pth.setAttribute("stroke-width", "1.3");
      pth.setAttribute("stroke-dasharray", "5 4");
      pth.setAttribute("stroke-linecap", "round");
      fan.appendChild(pth);
    });
    // Drawn along whichever route the sum picks, the same way the converging
    // lines are: hidden by holding its dash offset at full length, then run to
    // zero so it fills from the sum towards the answer.
    const fanSolid = document.createElementNS(SVGNS, "path");
    fanSolid.setAttribute("fill", "none");
    fanSolid.setAttribute("stroke", "#3E4753");
    fanSolid.setAttribute("stroke-width", "2.2");
    fanSolid.setAttribute("stroke-linecap", "round");
    fan.appendChild(fanSolid);
    decideRow.appendChild(fan);

    const outs = document.createElement("div");
    outs.className = "nnm-outs";
    const outEls = [1, 0].map(function (v) {
      const o = document.createElement("span");
      o.className = "nnm-out " + (v === 1 ? "approach" : "wait");
      o.textContent = v === 1 ? "Approach" : "Wait";
      outs.appendChild(o);
      return { v: v, el: o };
    });
    decideRow.appendChild(outs);

    const labelsEl = document.createElement("div");
    labelsEl.className = "nnm-labels";
    decideRow.appendChild(labelsEl);

    const noteEl = document.createElement("div");
    noteEl.className = "nnm-note";
    chainBody.appendChild(noteEl);

    // ---------- helpers ----------
    function fmt(v, dp) { return (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(dp === undefined ? 2 : dp); }
    function pill(v) {
      const s = document.createElement("span");
      s.className = "nnm-pill " + (v === 1 ? "approach" : "wait");
      s.textContent = v === 1 ? "Approach" : "Wait";
      return s;
    }

    // Whether the wide arrangement fits must be re-decided every render:
    // measuring it once caught whatever layout happened to be up at build time.
    // Dropping the class first makes the browser report the wide widths.
    function fitFlow() {
      flowBody.classList.remove("narrow");
      // getBoundingClientRect, not offsetWidth: conv and fan are SVG elements and
      // SVGElement has no offsetWidth, so the sum came out NaN and never compared true.
      const wOf = function (el) { return el.getBoundingClientRect().width; };
      // conv's canvas reaches back over the slot via a negative margin, so its
      // rect is wider than the space it actually occupies. Use the constant, or
      // the flow measures itself as needing the slot width twice and goes narrow.
      // The labels are positioned out of the flow, so decideWrap no longer reports
      // their width — measure them alongside the row, since both still have to fit.
      const need = wOf(rowsEl) + CONV_W + Math.max(wOf(decideRow), wOf(labelsEl));
      // Measure against the panel's inner width, not flowBody's own: when the
      // row overflows, flowBody stretches with it and reports the inflated size,
      // so comparing need to that always says "it fits".
      const cs = getComputedStyle(chainOuter);
      const avail = chainOuter.clientWidth
        - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      if (avail > 0 && need > avail) flowBody.classList.add("narrow");
    }

    // Reading p on the left and flow row p on the right must sit on the same line.
    // Readings vary with text length, so both are cleared, measured, then set to
    // the taller of the pair — clearing first keeps it from ratcheting upward.
    // The flow panel starts at the top of the card while the readings start below
    // the find bar, so the captions absorb the difference and the first row still
    // lands on the first reading. Cleared before measuring so it cannot ratchet.
    function alignTops() {
      flowHead.style.height = "";
      const base = flowHead.getBoundingClientRect().height;
      const delta = readScroll.getBoundingClientRect().top - rowsEl.getBoundingClientRect().top;
      if (delta > 0) flowHead.style.height = (base + delta) + "px";
    }

    // The last two captions sit over elements the header row cannot reach by
    // flex order — the conv SVG's negative margin means header widths and body
    // positions do not correspond. They are placed against the measured centres
    // of the sum cell and the pair of answers instead.
    function alignHeadCaptions() {
      const hr = flowHead.getBoundingClientRect();
      if (hr.width < 2) return;
      const place = function (cap, target) {
        const t = target.getBoundingClientRect();
        if (t.width < 1) { cap.style.display = "none"; return; }
        cap.style.display = "";
        cap.style.left = Math.round(t.left + t.width / 2 - hr.left) + "px";
      };
      place(flowHead.querySelector(".sum"), sumCell);
      place(flowHead.querySelector(".dec"), outs);
    }

    function syncRows() {
      readings.forEach(function (r) { r.style.minHeight = ""; });
      rows.forEach(function (r) { r.style.minHeight = ""; });
      const h = readings.map(function (r, i) {
        return Math.max(r.offsetHeight, rows[i].offsetHeight);
      });
      readings.forEach(function (r, i) { r.style.minHeight = h[i] + "px"; });
      rows.forEach(function (r, i) { r.style.minHeight = h[i] + "px"; });
    }

    // The weighted boxes change width over a 0.45s transition, and the converging
    // lines are anchored to their right edges — so a single redraw would catch the
    // box mid-move. This follows the edge frame by frame until the box settles.
    let lastChosen = 0;
    let trackRaf = null;
    function trackConnectors(ms) {
      if (trackRaf) cancelAnimationFrame(trackRaf);
      const until = performance.now() + ms;
      (function frame() {
        drawConnectors(lastChosen);
        if (performance.now() < until) {
          trackRaf = requestAnimationFrame(frame);
        } else {
          trackRaf = null;
        }
      })();
    }

    // Fills a cell in and kicks it, without the stand-in hatching.
    function revealCell(el, delay) {
      el.classList.remove("empty", "nnm-pop");
      void el.offsetWidth;
      el.style.animationDelay = (delay || 0) + "ms";
      el.classList.add("nnm-pop");
    }

    // The converging lines start at the right EDGE of each weighted box, not at a
    // fixed column, so they stay attached as the boxes change width. That means the
    // SVG has to reach back over the slot: it is given a negative left margin equal
    // to the slot width and the same amount of extra width, so its canvas covers the
    // slot while its contribution to the row's layout is unchanged.

    function drawConnectors(chosen) {
      const slotW = rows[0].querySelector(".nnm-slot").getBoundingClientRect().width;
      conv.style.marginLeft = (-slotW) + "px";
      conv.style.width = (CONV_W + slotW) + "px";

      const cr0 = conv.getBoundingClientRect();
      if (cr0.width < 2) {
        conv.style.visibility = "hidden";
      } else {
        conv.style.visibility = "";
        conv.setAttribute("viewBox", "0 0 " + cr0.width + " " + cr0.height);
        const sc = sumCell.getBoundingClientRect();
        const ty = sc.top + sc.height / 2 - cr0.top;
        rows.forEach(function (r, i) {
          const rr = r.querySelector(".wgt").getBoundingClientRect();
          const y = rr.top + rr.height / 2 - cr0.top;
          const x = rr.right - cr0.left;
          const ln = convPaths[i];
          ln.setAttribute("x1", x);
          ln.setAttribute("y1", y);
          ln.setAttribute("x2", cr0.width);
          ln.setAttribute("y2", ty);

          const sol = convSolid[i];
          sol.setAttribute("x1", x);
          sol.setAttribute("y1", y);
          sol.setAttribute("x2", cr0.width);
          sol.setAttribute("y2", ty);
          const len = Math.hypot(cr0.width - x, ty - y);
          sol.setAttribute("stroke-dasharray", len);
          // Resting state: fully drawn once Add up has run, fully hidden before.
          // A running animation still overrides this, so redraws during the draw
          // reposition the line without cutting the animation short.
          sol.setAttribute("stroke-dashoffset", (step >= 3 && !solidPending[i]) ? 0 : len);
        });
      }

      const fr = fan.getBoundingClientRect();
      if (fr.width < 2) { fan.style.visibility = "hidden"; return; }
      fan.style.visibility = "";
      fan.setAttribute("viewBox", "0 0 " + fr.width + " " + fr.height);
      const sc2 = sumCell.getBoundingClientRect();
      const sy = sc2.top + sc2.height / 2 - fr.top;
      outEls.forEach(function (o, i) {
        const orr = o.el.getBoundingClientRect();
        const oy = orr.top + orr.height / 2 - fr.top;
        const pth = i === 0 ? fanUp : fanDown;
        pth.setAttribute("d", "M0 " + sy + " C " + (fr.width * 0.55) + " " + sy + ", " +
          (fr.width * 0.45) + " " + oy + ", " + fr.width + " " + oy);
      });

      const chosenPath = chosen === 1 ? fanUp : fanDown;
      fanSolid.setAttribute("d", chosenPath.getAttribute("d") || "");
      const flen = fanSolid.getTotalLength ? fanSolid.getTotalLength() : 0;
      fanSolid.setAttribute("stroke-dasharray", flen);
      fanSolid.setAttribute("stroke-dashoffset", (step >= 4 && !decidePending) ? 0 : flen);
    }

    // ---------- render ----------
    function render() {
      const empty = cases.length === 0;
      casePanel.style.display = empty ? "none" : "";
      chainPanel.style.visibility = empty ? "hidden" : "";
      emptyMsg.hidden = !empty;
      if (empty) return;
      if (idx >= cases.length) idx = cases.length - 1;
      const it = cases[idx];

      countEl.textContent = (idx + 1) + " / " + cases.length;
      setAriaDisabled(prevBtn, idx === 0);
      setAriaDisabled(nextBtn, idx === cases.length - 1);
      caseIdEl.title = "#" + it.id;   // id kept for cross-referencing the explorer

      // all three readings, each on its own colour scale
      readings.forEach(function (r, p) {
        r.querySelector(".lo").textContent = (-TOK_MAX[p]).toFixed(4);
        r.querySelector(".hi").textContent = TOK_MAX[p].toFixed(4);
        const txt = r.querySelector(".nnm-read-text");
        txt.innerHTML = "";
        it.text.split(/\s+/).forEach(function (w, wi) {
          if (wi) txt.appendChild(document.createTextNode(" "));
          const span = document.createElement("span");
          span.className = "nnm-tok";
          span.textContent = w;
          const v = D.vocabulary[w];
          if (v && v[0] === p) {
            const L = level(Math.min(1, Math.abs(v[1]) / TOK_MAX[p]));
            span.classList.add("scored");
            span.style.setProperty("--tok-bg", (v[1] >= 0 ? FILL_POS : FILL_NEG)[L]);
            span.style.setProperty("--tok-fg", L === 4 ? "#fff" : "#1E242C");
            span.title = w + ": " + fmt(v[1], 4);
            // Lit straight away unless the Words sequence is about to light them
            // one at a time.
            if (step >= 1 && !wordAnim) span.classList.add("lit");
          }
          txt.appendChild(span);
        });
      });

      labelsEl.innerHTML = "";
      [["Actually", it.target], ["Model said", it.pred]].forEach(function (pair) {
        const row = document.createElement("div");
        row.className = "nnm-label-row";
        const b = document.createElement("b"); b.textContent = pair[0];
        row.appendChild(b); row.appendChild(pill(pair[1]));
        labelsEl.appendChild(row);
      });
      if (it.pred !== it.target) {
        const f = document.createElement("div");
        f.className = "nnm-label-row";
        const sp = document.createElement("span");
        sp.className = "nnm-flag"; sp.textContent = "MODEL WAS WRONG";
        f.appendChild(sp); labelsEl.appendChild(f);
      }

      // the flow
      const wgt = []; let sum = 0;
      const revealed = function (el, on, wasOn, delay) {
        el.classList.toggle("empty", !on);
        el.classList.remove("nnm-pop");
        if (on && !wasOn) {
          void el.offsetWidth;                 // restart the animation
          el.style.animationDelay = (delay || 0) + "ms";
          el.classList.add("nnm-pop");
        }
      };
      for (let p = 0; p < NP; p++) {
        const a = it.act[p], w = a * IMP[p];
        wgt.push(w); sum += w;
        const r = rows[p];
        const actC = r.querySelector(".act"), impC = r.querySelector(".imp"), wgtC = r.querySelector(".wgt");
        actC.textContent = fmt(a, 3); paint(actC, a, ACT_SCALE);
        impC.textContent = fmt(IMP[p], 2);
        wgtC.textContent = fmt(w, 2); paint(wgtC, w, SUM_SCALE);
        revealed(actC, step >= 1 && !wordAnim, prevStep >= 1 && !wordAnim, p * 90);
        // Importance is never revealed: it is not produced by the step before it.
        // It is a property of the model — the same three numbers on all 800
        // conversations, unchanged by any step — so it is on screen from the
        // start, and staying put while everything around it moves is the point.
        impC.classList.remove("empty");
        revealed(wgtC, step >= 2 && !weighAnim, prevStep >= 2 && !weighAnim, p * 90 + 140);
        if (step >= 2 && !weighAnim) {
          const slot = r.querySelector(".nnm-slot").getBoundingClientRect().width;
          const maxAbs = Math.max.apply(null, it.act.map(function (a, k) { return Math.abs(a * IMP[k]); }));
          wgtC.style.width = Math.round(weightedWidth(w, maxAbs, slot)) + "px";
        } else if (step < 2) {
          wgtC.style.width = "";
        }
        if (!weighAnim) {
          r.classList.toggle("lit-mul", step >= 2);
          r.classList.toggle("lit-arr", step >= 2);
        } else {
          r.classList.remove("lit-mul", "lit-arr");
        }
      }
      conv.style.visibility = step >= 3 ? "" : "hidden";
      fan.style.visibility = step >= 4 ? "" : "hidden";

      sumCell.textContent = fmt(sum, 1);
      paint(sumCell, sum, SUM_SCALE);
      revealed(sumCell, step >= 3 && !addUpAnim, prevStep >= 3 && !addUpAnim, 260);

      const chosen = sum > 0 ? 1 : 0;
      lastChosen = chosen;
      outEls.forEach(function (o) {
        o.el.classList.remove("empty");
        o.el.classList.toggle("on", o.v === chosen && step >= 4 && !decideAnim);
      });

      // Held back until the Decide animation has finished, so the answer lands
      // before the comparison against it appears.
      if (step >= 4) {
        if (prevStep < 4) {
          labelsEl.style.visibility = "hidden";
          const t = setTimeout(function () {
            labelsEl.style.visibility = "";
            labelsEl.classList.remove("nnm-pop"); void labelsEl.offsetWidth;
            labelsEl.classList.add("nnm-pop");
          }, 560);
          SIM._timeouts.push(t);
        } else {
          labelsEl.style.visibility = "";
        }
      } else {
        labelsEl.style.visibility = "hidden";
      }

      noteEl.textContent = (step >= 4 && chosen !== it.pred)
        ? "The pathways and the model point different ways on this one. The pathways are a "
          + "summary of the model, not a copy of it — they land on the same answer in about "
          + "9 cases out of 10." : "";

      stepBtns.forEach(function (b, i) {
        b.classList.toggle("on", i + 1 === step);
        b.setAttribute("aria-pressed", i + 1 === step ? "true" : "false");
      });

      fitFlow();

      alignTops();
      syncRows();
      alignHeadCaptions();
      // Widths may have just changed here too, so follow them rather than drawing once.
      trackConnectors(motionOff() ? 0 : 520);
      prevStep = step;

      SIM.announce("Conversation " + (idx + 1) + " of " + cases.length +
        ". Weighted sum " + fmt(sum) + ". Pathways say " + (chosen ? "approach" : "wait") + ".");
    }

    // The readings and the flow rows are aligned line for line, so they have to
    // scroll as one. The right side is taller (bar, hint, note sit below the rows),
    // so its scrollTop simply clamps when the left runs out — the guard stops the
    // two handlers bouncing the value back and forth.
    let syncingScroll = false;
    function linkScroll(a, b) {
      a.addEventListener("scroll", function () {
        if (syncingScroll) return;
        syncingScroll = true;
        b.scrollTop = a.scrollTop;
        requestAnimationFrame(function () { syncingScroll = false; });
      }, { passive: true });
    }
    linkScroll(readScroll, chainBody);
    linkScroll(chainBody, readScroll);

    prevBtn.addEventListener("click", function () { if (idx > 0) { cancelAnim(); idx--; render(); } });
    nextBtn.addEventListener("click", function () { if (idx < cases.length - 1) { cancelAnim(); idx++; render(); } });

    SIM.onResize = function () { requestAnimationFrame(render); };
    requestAnimationFrame(render);
    render();

    return wrap;
  }

  // ---- not yet built: blank content area ----
  const wrap = document.createElement("div");
  wrap.className = "sim-content";

  // Polite live region for screen-reader announcements. Call SIM.announce("...")
  // from anywhere in the interactive.
  const liveAnnounce = document.createElement("div");
  liveAnnounce.className = "sr-only";
  liveAnnounce.setAttribute("aria-live", "polite");
  liveAnnounce.setAttribute("aria-atomic", "true");
  wrap.appendChild(liveAnnounce);
  SIM._suppressAnnounce = false;
  SIM.announce = function(msg) {
    if (SIM._suppressAnnounce) return;
    liveAnnounce.textContent = "";
    requestAnimationFrame(() => { liveAnnounce.textContent = msg; });
  };

  // Handles invalidateSimCache() tears down when the sim is switched.
  SIM._timeouts = [];
  SIM._observers = [];

  return wrap;
}

function buildViewport() {
  if (demoMode) { buildDemoView(); return; }
  const device = DEVICES[activeDevice];
  const layout = LAYOUTS[activeLayout];
  const container = document.getElementById("viewportContainer");
  const info = document.getElementById("viewportInfo");
  // Detach cached sim elements before clearing container so they survive
  if (_simTitleBar && _simTitleBar.parentNode) _simTitleBar.remove();

  container.innerHTML = "";
  container.style.paddingTop = "";
  container.style.alignSelf = "";
  container.style.maxWidth = "";
  container.style.overflow = "";
  document.body.style.background = "";
  document.body.classList.remove("teal-bg");
  document.body.style.overflow = "";
  document.body.style.paddingRight = "0";
  const wrapperEl = document.querySelector(".viewport-wrapper");
  if (wrapperEl) { wrapperEl.style.overflow = ""; wrapperEl.style.borderColor = ""; }
  const bwLabel = document.getElementById("browserWidthLabel");
  if (bwLabel) { bwLabel.style.color = ""; bwLabel.style.zIndex = ""; bwLabel.style.background = "rgba(0,0,0,0.15)"; }
  document.querySelectorAll(".btn-column-label").forEach(el => el.style.color = "");

  if (demoHr) demoHr.style.borderColor = "";
  const msTitle = document.getElementById("app-title");
  if (msTitle) msTitle.style.color = "";
  info.style.textAlign = "";
  info.style.alignSelf = "";
  info.style.minWidth = "";

  // Update browser width label
  const bwEl = document.getElementById("browserWidthValue");
  const bwWrapper = document.querySelector(".viewport-wrapper");
  if (bwEl && bwWrapper) bwEl.textContent = Math.round(window.innerWidth - bwWrapper.getBoundingClientRect().left) + "px";

  const isNoLimit = activeDevice === "none";
  const availW = isNoLimit ? (layout.hasAP ? AP_WIDTH : 1200) : device.screenW;
  const availH = isNoLimit ? 700 : device.screenH - device.topChrome - device.bottomChrome;

  // Content width
  let contentW;
  if (activeLayout === "ap-2col") {
    // 28 left margin + sidebar + 10 right margin + 1 border + content + 1 border + 26 right margin = 1100
    contentW = sidebarExpanded ? AP_CONTENT_W_EXPANDED : AP_CONTENT_W_COLLAPSED;
  } else if (activeLayout === "ap-full") {
    contentW = 1044;
  } else {
    contentW = 1024;
  }

  const contentH = AP_CONTENT_H;

  // Info line
  if (isNoLimit) {
    info.innerHTML = `<strong>Teacher Desktop / ${layout.name}</strong><br><strong>Content:</strong> ${contentW}w × ${contentH}h`;
  } else {
    const wrapperClientW = document.querySelector(".viewport-wrapper").clientWidth;
    const frameAvailW = (activeDevice === "chromebook") ? Math.min(device.screenW, wrapperClientW) : device.screenW;
    info.innerHTML = `<strong>${device.name} / ${layout.name}</strong><br><strong>Screen:</strong> ${device.screenW}w × ${device.screenH}h • <strong>Available:</strong> ${frameAvailW}w × ${availH}h • <strong>Content:</strong> ${contentW}w × ${contentH}h`;
    // Label freeze when frame is clipped
    if (wrapperClientW < device.screenW) {
      info.style.alignSelf = "flex-start";
      const infoMinW = (activeDevice === "chromebook") ? Math.max(frameAvailW, 1100) : device.screenW;
      info.style.minWidth = infoMinW + "px";

  }

  // Device frame
  const frame = document.createElement("div");
  frame.className = "device-frame" + (isNoLimit ? " no-limit" : "");

    frame.style.height = frameH + "px";

    container.style.maxWidth = "100%";

      content.setAttribute("role", "main");
      content.style.width = "100%";
      content.style.height = (AP_CONTENT_H) + "px";
      applySimTheme(content);
      { const tb = getSimTitleBar(); if (tb) content.appendChild(tb); }
      const sc2col = getSimContent();
      if (sc2col) content.appendChild(sc2col);

      rightSide.appendChild(content);
      apBody.appendChild(rightSide);
      ap.appendChild(apBody);
    } else {
      // Full-width: border on whole AP container
      ap.style.border = "1px solid #858585";
      ap.style.boxSizing = "content-box";

      const apHeader = document.createElement("div");
      apHeader.className = "ap-header";
      apHeader.style.height = (AP_HEADER_H) + "px";
      const apLabel = document.createElement("span");
      apLabel.className = "ap-header-label";
      apLabel.textContent = SIMS[activeSim].name;
      apHeader.appendChild(apLabel);
      ap.appendChild(apHeader);

      const apBody = document.createElement("div");
      apBody.className = "ap-body";

      // Content area
      const content = document.createElement("div");
      content.className = "content-area";
      content.setAttribute("role", "main");
      content.style.width = (contentW) + "px";
      content.style.height = (AP_CONTENT_H) + "px";
      applySimTheme(content);
      { const tb = getSimTitleBar(); if (tb) content.appendChild(tb); }
      const scFull = getSimContent();
      if (scFull) content.appendChild(scFull);

      apBody.appendChild(content);
      ap.appendChild(apBody);
    }
    page.appendChild(ap);

    // Question containers (below AP on the page)
    if (activeLayout === "ap-full" || activeLayout === "ap-2col") {
      const qRow = document.createElement("div");
      qRow.className = "question-row";
      if (activeLayout === "ap-2col") {
        qRow.style.paddingLeft = "28px";
        qRow.style.paddingRight = "26px";
      }

      [
        { label: "Question #1", text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut eu eros nec tortor tincidunt consequat eget eu eros?" },
        { label: "Question #2", text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit?" }
      ].forEach(q => {
        const qContainer = document.createElement("div");
        qContainer.className = "question-container";

        const qHeader = document.createElement("div");
        qHeader.className = "question-header";
        const qLabel = document.createElement("span");
        qLabel.className = "question-header-label";
        qLabel.textContent = q.label;
        qHeader.appendChild(qLabel);
        qContainer.appendChild(qHeader);

        const qBody = document.createElement("div");
        qBody.className = "question-body";
        qBody.innerHTML = `<div>${q.text}</div><div class="question-input">Please type your answer here.</div>`;
        qContainer.appendChild(qBody);

        qRow.appendChild(qContainer);
      });

      page.appendChild(qRow);
    }
    viewport.appendChild(page);

    // Chromebook + AP: re-measure wrapper and override frame width (matches Standalone logic)
    if (activeDevice === "chromebook") {
      const cbWrapperW = document.querySelector(".viewport-wrapper").clientWidth;
      const cbFrameW = Math.min(device.screenW, cbWrapperW);
      frame.style.width = (cbFrameW) + "px";
      if (cbFrameW < 1100) {
        viewport.style.justifyContent = "flex-start";
      }
    }
  } else if (activeLayout === "standalone" && isNoLimit) {
    // Standalone + Teacher Desktop — gray background, content centered
    const standaloneMax = 1024;
    const standaloneMin = 768;
    const standaloneMargin = 20;
    const standaloneH = 562;

    document.body.style.background = "#ededed";
    document.body.style.paddingRight = "0";
    container.style.alignSelf = "stretch";

    // Measure AFTER stretch so container matches wrapper width
    const fullW = container.clientWidth;
    const standaloneBorder = 4; // 2px border each side, box-sizing: content-box
    const standaloneW = Math.floor(Math.max(standaloneMin, Math.min(standaloneMax, fullW - (standaloneMargin * 2) - standaloneBorder)));
    const ml = standaloneW <= standaloneMin ? standaloneMargin : Math.floor((fullW - standaloneW - standaloneBorder) / 2);

    const topOffset = container.getBoundingClientRect().top;
    const verticalPad = Math.max(0, (window.innerHeight - topOffset - standaloneH) / 2);
    container.style.paddingTop = verticalPad + "px";

    const content = document.createElement("div");
    content.className = "content-area standalone";
    content.setAttribute("role", "main");
    content.style.width = (standaloneW) + "px";
    content.style.height = (standaloneH) + "px";
    content.style.marginLeft = ml + "px";
    applySimTheme(content);
    { const tb = getSimTitleBar(); if (tb) content.appendChild(tb); }
    const scSA1 = getSimContent();
    if (scSA1) content.appendChild(scSA1);

    // Update info line with actual responsive width
    info.innerHTML = `<strong>Teacher Desktop / ${layout.name}</strong><br><strong>Content:</strong> ${standaloneW}w × ${standaloneH}h`;
    if (standaloneW <= standaloneMin) {
      const clipW = standaloneMin + (standaloneMargin * 2) + standaloneBorder; // 812
      info.style.alignSelf = "flex-start";
      info.style.minWidth = clipW + "px";
    }

    container.appendChild(content);
    if (SIM.onResize) SIM.onResize();
    return;
  } else {
    // Standalone with device frame
    const standaloneMax = 1024;
    const standaloneMin = 768;
    const standaloneMargin = 20;
    const contentBorder = 4; // 2px border each side on .content-area.standalone (content-box)
    const wrapperClientW = document.querySelector(".viewport-wrapper").clientWidth;
    const standaloneH = 562;

    let standaloneW, simMarginLeft, frameVisualW;

    if (activeDevice === "chromebook") {
      // Chromebook: frame shrinks with browser, content responsive
      frameVisualW = Math.min(device.screenW, wrapperClientW);
      frame.style.width = (frameVisualW) + "px";

      const shrinkStart = standaloneMax + contentBorder + (standaloneMargin * 2); // 1068
      const clipStart = standaloneMin + contentBorder + (standaloneMargin * 2); // 812

      if (frameVisualW >= shrinkStart) {
        standaloneW = standaloneMax;
        simMarginLeft = null;
      } else if (frameVisualW >= clipStart) {
        standaloneW = frameVisualW - (standaloneMargin * 2) - contentBorder;
        simMarginLeft = standaloneMargin;
      } else {
        standaloneW = standaloneMin;
        simMarginLeft = standaloneMargin;
      }

      // Label freeze when clipping
      if (frameVisualW < clipStart) {
        info.style.alignSelf = "flex-start";
        info.style.minWidth = clipStart + "px";
      }
    } else {
      // iPad/Android: fixed frame, fixed content, no responsiveness
      frameVisualW = device.screenW;
      if (device.screenW <= standaloneMax + contentBorder) {
        standaloneW = device.screenW - (standaloneMargin * 2) - contentBorder;
        simMarginLeft = standaloneMargin;
      } else {
        standaloneW = standaloneMax;
        simMarginLeft = null;
      }

      // Label freeze when frame is clipped by wrapper
      if (wrapperClientW < device.screenW) {
        info.style.alignSelf = "flex-start";
        info.style.minWidth = device.screenW + "px";
      }

      frame.style.boxShadow = "0 2px 12px rgba(0, 0, 0, 0.3)";
    }

    const content = document.createElement("div");
    content.className = "content-area standalone";
    content.setAttribute("role", "main");
    content.style.width = (standaloneW) + "px";
    content.style.height = (standaloneH) + "px";
    applySimTheme(content);
    { const tb = getSimTitleBar(); if (tb) content.appendChild(tb); }
    const scSA2 = getSimContent();
    if (scSA2) content.appendChild(scSA2);

    viewport.style.display = "flex";
    viewport.style.alignItems = "center";
    viewport.style.background = "#ededed";

    if (simMarginLeft !== null) {
      viewport.style.justifyContent = "flex-start";
      content.style.marginLeft = simMarginLeft + "px";
    } else {
      viewport.style.justifyContent = "center";
    }
    viewport.appendChild(content);

    // Update info line
    info.innerHTML = `<strong>${device.name} / ${layout.name}</strong><br><strong>Screen:</strong> ${device.screenW}w × ${device.screenH}h • <strong>Available:</strong> ${frameVisualW}w × ${availH}h • <strong>Content:</strong> ${standaloneW}w × ${standaloneH}h`;
  }

  frame.appendChild(viewport);

  // Bottom chrome
  if (!isNoLimit && device.bottomChrome > 0) {
    const bottom = document.createElement("div");
    bottom.className = "chrome-bottom";
    bottom.style.height = (device.bottomChrome) + "px";
    bottom.setAttribute("data-label", device.bottomLabel);

    frame.appendChild(bottom);
  }

  container.appendChild(frame);
  if (SIM.onResize) SIM.onResize();
}

// Button wiring
function wireToggleGroup(selector, callback) {
  document.querySelectorAll(selector).forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.classList.contains("active")) return;
      if (callback) callback(btn);
      document.querySelectorAll(selector).forEach(b => {
        b.classList.remove("active");
        b.setAttribute("aria-pressed", "false");
      });
      btn.classList.add("active");
      btn.setAttribute("aria-pressed", "true");
      buildViewport();
    });
  });
}

wireToggleGroup("[data-sim]", btn => {
  activeSim = btn.dataset.sim;
  invalidateSimCache();
});
wireToggleGroup("[data-layout]", btn => {
  activeLayout = btn.dataset.layout;
  if (activeLayout === "ap-2col") sidebarExpanded = true;
});
wireToggleGroup("[data-device]", btn => { activeDevice = btn.dataset.device; });

document.getElementById("demo-site-btn").addEventListener("click", () => {
  if (demoMode) {
    demoMode = false;
    exitDemoView();
  } else {
    demoMode = true;
    _savedDevice = activeDevice;
    _savedLayout = activeLayout;
    activeDevice = "none";
    activeLayout = "standalone";
    buildDemoView();
  }
});

// Warm the Lato italic face at startup. It lives in a separate woff2 and is only used by
// late-appearing italic placeholders (e.g. "Max number of trials reached"), so over the
// network it would otherwise download on first render and flash from a wider fallback
// italic. Fetching it now means it's ready before any such label mounts. No-op locally
// (font is already instant) and fully guarded so it can never throw or block startup.
if (document.fonts && document.fonts.load) {
  try { document.fonts.load("italic 16px 'Lato'").catch(function () {}); } catch (e) {}
}

buildViewport();

// Resize handler
let _resizeRafId = null;
function updateStandaloneDeviceFrame() {
  if (_resizeRafId) return; // already scheduled
  _resizeRafId = requestAnimationFrame(() => {
    _resizeRafId = null;
    _updateStandaloneDeviceFrameNow();
  });
}
function _updateStandaloneDeviceFrameNow() {
  const wrapper = document.querySelector(".viewport-wrapper");
  const contentEl = document.querySelector(".content-area.standalone");
  if (!wrapper || !contentEl) return;

  const device = DEVICES[activeDevice];
  if (!device) return;

  const wrapperClientW = wrapper.clientWidth;
  const info = document.getElementById("viewportInfo");

  if (activeDevice !== "chromebook") {
    // iPad/Android: no responsive changes, only label freeze
    if (info) {
      const isClipping = wrapperClientW < device.screenW;
      info.style.alignSelf = isClipping ? "flex-start" : "";
      info.style.minWidth = isClipping ? device.screenW + "px" : "";
    }
    return;
  }

  // Chromebook: full responsive logic
  const contentBorder = 4;
  const margin = 20;
  const standaloneMax = 1024;
  const standaloneMin = 768;
  const availH = device.screenH - device.topChrome - device.bottomChrome;

  const frameVisualW = Math.min(device.screenW, wrapperClientW);
  const frameEl = document.querySelector(".device-frame");
  if (frameEl) {
    frameEl.style.transition = "none";
    frameEl.style.width = frameVisualW + "px";
  }
  contentEl.style.transition = "none";

  const shrinkStart = standaloneMax + contentBorder + (margin * 2); // 1068
  const clipStart = standaloneMin + contentBorder + (margin * 2); // 812

  const viewport = contentEl.parentElement;

  let w;
  if (frameVisualW >= shrinkStart) {
    w = standaloneMax;
    contentEl.style.marginLeft = "";
    if (viewport) viewport.style.justifyContent = "center";
  } else if (frameVisualW >= clipStart) {
    w = frameVisualW - (margin * 2) - contentBorder;
    contentEl.style.marginLeft = margin + "px";
    if (viewport) viewport.style.justifyContent = "flex-start";
  } else {
    w = standaloneMin;
    contentEl.style.marginLeft = margin + "px";
    if (viewport) viewport.style.justifyContent = "flex-start";
  }

  contentEl.style.width = w + "px";
  const layoutName = LAYOUTS[activeLayout] ? LAYOUTS[activeLayout].name : activeLayout;
  if (info) {
    info.innerHTML = '<strong>' + device.name + ' / ' + layoutName + '</strong><br><strong>Screen:</strong> ' + device.screenW + 'w \u00d7 ' + device.screenH + 'h \u2022 <strong>Available:</strong> ' + frameVisualW + 'w \u00d7 ' + availH + 'h \u2022 <strong>Content:</strong> ' + w + 'w \u00d7 562h';
    const isClipping = frameVisualW < clipStart;
    info.style.alignSelf = isClipping ? "flex-start" : "";
    info.style.minWidth = isClipping ? clipStart + "px" : "";
  }
  if (SIM.onResize) SIM.onResize();
}

window.addEventListener("resize", () => {
  // Always update browser width label
  const bwEl = document.getElementById("browserWidthValue");
  const bwWrapper = document.querySelector(".viewport-wrapper");
  if (bwEl && bwWrapper) bwEl.textContent = Math.round(window.innerWidth - bwWrapper.getBoundingClientRect().left) + "px";

  if (demoMode) { buildDemoView(); return; }

  if (activeLayout === "standalone" && activeDevice === "none") {
    // Teacher Desktop — full rebuild (responsive content)
    buildViewport();
  } else if (activeLayout === "standalone" && activeDevice !== "none") {
    // Device frame — lightweight update (no rebuild)
    updateStandaloneDeviceFrame();
  } else if (activeDevice === "chromebook" && activeLayout !== "standalone") {
    // Chromebook + AP layouts — shrink frame, label freeze
    const device = DEVICES[activeDevice];
    const wrapper = document.querySelector(".viewport-wrapper");
    if (device && wrapper) {
      const wrapperW = wrapper.clientWidth;
      const frameVisualW = Math.min(device.screenW, wrapperW);
      const frameEl = document.querySelector(".device-frame");
      if (frameEl) {
        frameEl.style.transition = "none";
        frameEl.style.width = frameVisualW + "px";
      }
      // Pin page to left when frame < 1100, restore centering when wider
      const viewportArea = document.querySelector(".viewport-area");
      if (viewportArea) {
        viewportArea.style.justifyContent = frameVisualW < 1100 ? "flex-start" : "";
      }
      const info = document.getElementById("viewportInfo");
      if (info) {
        const availH = device.screenH - device.topChrome - device.bottomChrome;
        const layoutName = LAYOUTS[activeLayout] ? LAYOUTS[activeLayout].name : activeLayout;
        const contentW = activeLayout === "ap-2col" ? (sidebarExpanded ? AP_CONTENT_W_EXPANDED : AP_CONTENT_W_COLLAPSED) : 1044;
        info.innerHTML = '<strong>' + device.name + ' / ' + layoutName + '</strong><br><strong>Screen:</strong> ' + device.screenW + 'w \u00d7 ' + device.screenH + 'h \u2022 <strong>Available:</strong> ' + frameVisualW + 'w \u00d7 ' + availH + 'h \u2022 <strong>Content:</strong> ' + contentW + 'w \u00d7 ' + AP_CONTENT_H + 'h';
        const isClipping = wrapperW < device.screenW;
        info.style.alignSelf = isClipping ? "flex-start" : "";
        info.style.minWidth = isClipping ? Math.max(frameVisualW, 1100) + "px" : "";
      }
    }
  } else if (activeDevice !== "none" && activeDevice !== "chromebook") {
    // iPad/Android + any layout — label freeze only
    const info = document.getElementById("viewportInfo");
    const device = DEVICES[activeDevice];
    if (info && device) {
      const wrapperW = document.querySelector(".viewport-wrapper").clientWidth;
      const isClipping = wrapperW < device.screenW;
      info.style.alignSelf = isClipping ? "flex-start" : "";
      info.style.minWidth = isClipping ? device.screenW + "px" : "";
    }
  }
  // Let the interactive re-measure at the new size
  if (SIM.onResize) SIM.onResize();
});

</script>
</body>
