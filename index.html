            scrollWrap.insertBefore(realCard, card);
            selectTrialByCard(realCard, letter);
            realCard.focus({ preventScroll: true });
            scrollItemIntoView(realCard, scrollWrap);
            if (activeTrialCount >= MAX_TRIALS) {
              card.style.display = "none";
              const maxLabel = document.createElement("div");
              maxLabel.className = "sim-offspring-placeholder";
              maxLabel.textContent = "Max number of trials reached";
              maxLabel.style.margin = "1px 0 1px 0";
              maxLabel.style.padding = "2px 0";
              maxLabel.style.textAlign = "center";
              maxLabel.style.width = "calc(100% - 15px)";
              scrollWrap.appendChild(maxLabel);
              requestAnimationFrame(() => { scrollWrap.scrollTop = scrollWrap.scrollHeight; });
              if (SIM.announce) SIM.announce("Maximum of " + MAX_TRIALS + " trials reached.");
            }
          });
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              card.click();
            } else {
              handleTrialCardNav(card, e);
            }
          });
          return card;
        }

        const cardA = buildTrialCard("A");
        cardA.classList.add("selected");
        cardA.setAttribute("aria-selected", "true");
        cardA.setAttribute("tabindex", "0");
        cardA.style.cursor = "default";
        var rbA = cardA.querySelector(".trial-card-reset");
        if (rbA) rbA.setAttribute("tabindex", "0");
        scrollWrap.appendChild(cardA);
        scrollWrap.appendChild(buildNewCard());

        panel.appendChild(scrollWrap);
        const focusRing = document.createElement("div");
        focusRing.className = "scroll-focus-ring";
        panel.appendChild(focusRing);
        requestAnimationFrame(updateTrialsTabindex);
        if (SIM.trialsObserver) SIM.trialsObserver.disconnect();
        SIM.trialsObserver = new MutationObserver(updateTrialsTabindex);
        SIM.trialsObserver.observe(scrollWrap, { childList: true });
      }

      // --- Simulation panel ---
      if (p.name === "Simulation") {
        const theme = SIMS[activeSim].theme;
        if (theme && theme.titleBarBg) panel.style.background = theme.titleBarBg;
        panel.style.overflow = "hidden";
        const inner = document.createElement("div");
        inner.className = "sim-panel-inner";

        const indicator = document.createElement("div");
        indicator.className = "sim-trial-indicator";
        indicator.textContent = "A";
        indicator.setAttribute("aria-hidden", "true");
        panel.appendChild(indicator);

        // Top controls
        const topControls = document.createElement("div");
        topControls.style.cssText = "flex-shrink:0;padding:2px 10px 10px 10px;";
        const topPlaceholder = document.createElement("div");
        topPlaceholder.className = "sim-offspring-placeholder";
        topPlaceholder.style.cssText = "font-style:italic;color:#4D4D4D;text-align:center;padding:8px 0;";
        topPlaceholder.textContent = "Controls coming soon";
        topControls.appendChild(topPlaceholder);
        inner.appendChild(topControls);

        // White container (not scrollable)
        const stage = document.createElement("div");
        stage.style.cssText = "flex:1;min-height:0;background:#fff;overflow:hidden;";
        inner.appendChild(stage);
        SIM._stage = stage;

        // Bottom controls (same height as Bananas sim-buttons)
        const bottomControls = document.createElement("div");
        bottomControls.className = "sim-buttons";

        const runIconSVG = '<svg aria-hidden="true" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polygon fill="currentColor" points="7,3 7,21 21,12"/></svg>';

        ["Run", "Reset Trial"].forEach(label => {
          const btn = document.createElement("button");
          btn.className = "sim-btn";
          const iconMap = { "Run": runIconSVG, "Reset Trial": resetIconSVG };
          const icon = createSVGIcon(iconMap[label]);
          btn.appendChild(icon);
          const span = document.createElement("span");
          span.textContent = label;
          btn.appendChild(span);
          btn.setAttribute("aria-disabled", "true");
          if (label === "Run") SIM.runBtn = btn;
          if (label === "Reset Trial") SIM.resetTrialBtn = btn;
          bottomControls.appendChild(btn);
        });

        inner.appendChild(bottomControls);

        panel.appendChild(inner);
        SIM._panel = panel;
      }

      // --- Data panel ---
      if (p.name === "Data") {
        const dataInner = document.createElement("div");
        dataInner.className = "data-panel-inner";
        const placeholder = document.createElement("div");
        placeholder.style.cssText = "display:flex;align-items:center;justify-content:center;flex:1;font-style:italic;color:#4D4D4D;font-family:'Lato',sans-serif;font-size:16px;";
        placeholder.textContent = "Data panel coming soon";
        dataInner.appendChild(placeholder);
        panel.appendChild(dataInner);
      }

      panelWrap.appendChild(panel);

      const tab = document.createElement("div");
      tab.className = "sim-panel-tab";
      const tabLabel = document.createElement("h2");
      tabLabel.className = "sim-panel-tab-label";
      tabLabel.textContent = p.name;
      tab.appendChild(tabLabel);
      if (p.subtitle) {
        const bc = (SIMS[activeSim].theme && SIMS[activeSim].theme.panelBorder) || "#555";
        tab.style.border = "2px solid " + bc;
        tab.style.borderRight = "none";
        tab.style.borderRadius = "999px 0 0 999px";
        tab.style.position = "static";
        tab.style.transform = "none";
        tab.style.left = "";
        tab.style.height = "100%";
        const tabSub = document.createElement("div");
        const surfaceBg = (SIMS[activeSim].theme && SIMS[activeSim].theme.surface) || "#fff";
        tabSub.style.cssText = "display:flex;align-items:center;padding:0 12px 0 10px;background:" + surfaceBg + ";height:100%;box-sizing:border-box;border:2px solid " + bc + ";border-left:none;border-radius:0 999px 999px 0;";
        const tabSubLabel = document.createElement("span");
        tabSubLabel.className = "sim-panel-tab-subtitle";
        tabSubLabel.textContent = p.subtitle;
        tabSub.appendChild(tabSubLabel);
        const tabWrap = document.createElement("div");
        tabWrap.className = "sim-tab-wrap";
        tabWrap.appendChild(tab);
        tabWrap.appendChild(tabSub);
        panelWrap.appendChild(tabWrap);
      } else if (p.name === "Data") {
        tab.style.position = "static";
        tab.style.transform = "none";
        tab.style.left = "";
        const tabWrap = document.createElement("div");
        tabWrap.style.cssText = "position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:36px;z-index:11;";
        tabWrap.appendChild(tab);
        panelWrap.appendChild(tabWrap);
      } else {
        panelWrap.appendChild(tab);
      }

      wrap.appendChild(panelWrap);
    });

    // Ctrl+Arrow: navigate between panels
    const panelEls = wrap.querySelectorAll('.sim-panel[role="region"]');
    if (SIM.panelNavHandler) document.removeEventListener("keydown", SIM.panelNavHandler);
    SIM.panelNavHandler = (e) => {
      if (!e.ctrlKey || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
      e.preventDefault();
      const panelArr = Array.from(panelEls);
      const active = document.activeElement;
      let curIdx = -1;
      panelArr.forEach((p, i) => { if (p.contains(active)) curIdx = i; });
      const dir = e.key === "ArrowRight" ? 1 : -1;
      for (let i = 1; i <= panelArr.length; i++) {
        const nextIdx = (curIdx + dir * i + panelArr.length * panelArr.length) % panelArr.length;
        const focusable = nextIdx === curIdx ? null : panelArr[nextIdx].querySelectorAll('[tabindex="0"], button:not([tabindex="-1"]), a, input, select, textarea');
        if (focusable && focusable.length > 0) {
          focusable[0].focus();
          break;
        }
      }
    };
    document.addEventListener("keydown", SIM.panelNavHandler);

    return wrap;
  }

  return null;
}

function buildViewport() {
  if (demoMode) { buildDemoView(); return; }
  const device = DEVICES[activeDevice];
  const layout = LAYOUTS[activeLayout];
  const container = document.getElementById("viewportContainer");
  const info = document.getElementById("viewportInfo");
  // Detach cached sim elements before clearing container so they survive
  if (_simTitleBar && _simTitleBar.parentNode) _simTitleBar.remove();

  container.innerHTML = "";

  const msTitle = document.getElementById("masssims-title");
  if (msTitle) msTitle.style.color = "";
  info.style.textAlign = "";
  info.style.alignSelf = "";
  info.style.minWidth = "";

  // Update browser width label
  const bwEl = document.getElementById("browserWidthValue");
  const bwWrapper = document.querySelector(".viewport-wrapper");
  if (bwEl && bwWrapper) bwEl.textContent = Math.round(window.innerWidth - bwWrapper.getBoundingClientRect().left) + "px";

  const isNoLimit = activeDevice === "none";
  const availW = isNoLimit ? (layout.hasAP ? AP_WIDTH : 1200) : device.screenW;
  const availH = isNoLimit ? 700 : device.screenH - device.topChrome - device.bottomChrome;

  // Content width
  let contentW;
  if (activeLayout === "ap-2col") {

    const standaloneW = Math.floor(Math.max(standaloneMin, Math.min(standaloneMax, fullW - (standaloneMargin * 2) - standaloneBorder)));
    const ml = standaloneW <= standaloneMin ? standaloneMargin : Math.floor((fullW - standaloneW - standaloneBorder) / 2);

    if (standaloneW <= standaloneMin) {

      frameVisualW = Math.min(device.screenW, wrapperClientW);

      const shrinkStart = standaloneMax + contentBorder + (standaloneMargin * 2); // 1068
      const clipStart = standaloneMin + contentBorder + (standaloneMargin * 2); // 812

      if (frameVisualW >= shrinkStart) {
        standaloneW = standaloneMax;
        simMarginLeft = null;
      } else if (frameVisualW >= clipStart) {
        standaloneW = frameVisualW - (standaloneMargin * 2) - contentBorder;
        simMarginLeft = standaloneMargin;

      }

      frameVisualW = device.screenW;
      if (device.screenW <= standaloneMax + contentBorder) {
        standaloneW = device.screenW - (standaloneMargin * 2) - contentBorder;
        simMarginLeft = standaloneMargin;
      } else {
        standaloneW = standaloneMax;
        simMarginLeft = null;
      }

      // Label freeze when frame is clipped by wrapper

// Button wiring
function wireToggleGroup(selector, callback) {
  document.querySelectorAll(selector).forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.classList.contains("active")) return;
      if (callback) callback(btn);
      document.querySelectorAll(selector).forEach(b => {
        b.classList.remove("active");
        b.setAttribute("aria-pressed", "false");
      });
      btn.classList.add("active");
      btn.setAttribute("aria-pressed", "true");
      buildViewport();
    });
  });
}

wireToggleGroup("[data-sim]", btn => {
  activeSim = btn.dataset.sim;
  invalidateSimCache();
});
wireToggleGroup("[data-layout]", btn => {
  activeLayout = btn.dataset.layout;
  if (activeLayout === "ap-2col") sidebarExpanded = true;
});
wireToggleGroup("[data-device]", btn => { activeDevice = btn.dataset.device; });

function checkFungusStack() {

// Resize handler
let _resizeRafId = null;
function updateStandaloneDeviceFrame() {
  if (_resizeRafId) return; // already scheduled
  _resizeRafId = requestAnimationFrame(() => {
    _resizeRafId = null;
    _updateStandaloneDeviceFrameNow();
  });
}
function _updateStandaloneDeviceFrameNow() {
  const wrapper = document.querySelector(".viewport-wrapper");
  const contentEl = document.querySelector(".content-area.standalone");
  if (!wrapper || !contentEl) return;

  const device = DEVICES[activeDevice];
  if (!device) return;

  const wrapperClientW = wrapper.clientWidth;
  const info = document.getElementById("viewportInfo");

  if (activeDevice !== "chromebook") {
    // iPad/Android: no responsive changes, only label freeze
    if (info) {
      const isClipping = wrapperClientW < device.screenW;
      info.style.alignSelf = isClipping ? "flex-start" : "";
      info.style.minWidth = isClipping ? device.screenW + "px" : "";
    }
    return;
  }

  // Chromebook: full responsive logic
  const contentBorder = 4;
  const margin = 20;
  const standaloneMax = 1024;
  const standaloneMin = 768;
  const availH = device.screenH - device.topChrome - device.bottomChrome;

  const frameVisualW = Math.min(device.screenW, wrapperClientW);
  const frameEl = document.querySelector(".device-frame");
  if (frameEl) {
    frameEl.style.transition = "none";
    frameEl.style.width = frameVisualW + "px";
  }
  contentEl.style.transition = "none";

  const shrinkStart = standaloneMax + contentBorder + (margin * 2); // 1068
  const clipStart = standaloneMin + contentBorder + (margin * 2); // 812

  const viewport = contentEl.parentElement;

  let w;
  if (frameVisualW >= shrinkStart) {
    w = standaloneMax;
    contentEl.style.marginLeft = "";
    if (viewport) viewport.style.justifyContent = "center";
  } else if (frameVisualW >= clipStart) {
    w = frameVisualW - (margin * 2) - contentBorder;
    contentEl.style.marginLeft = margin + "px";
    if (viewport) viewport.style.justifyContent = "flex-start";
  } else {
    w = standaloneMin;
    contentEl.style.marginLeft = margin + "px";
    if (viewport) viewport.style.justifyContent = "flex-start";
  }

  contentEl.style.width = w + "px";
  const layoutName = LAYOUTS[activeLayout] ? LAYOUTS[activeLayout].name : activeLayout;
  if (info) {
    info.innerHTML = '<strong>' + device.name + ' / ' + layoutName + '</strong><br><strong>Screen:</strong> ' + device.screenW + 'w \u00d7 ' + device.screenH + 'h \u2022 <strong>Available:</strong> ' + frameVisualW + 'w \u00d7 ' + availH + 'h \u2022 <strong>Content:</strong> ' + w + 'w \u00d7 562h';
    const isClipping = frameVisualW < clipStart;
    info.style.alignSelf = isClipping ? "flex-start" : "";
    info.style.minWidth = isClipping ? clipStart + "px" : "";
  }
  if (SIM.updateDataPanel) SIM.updateDataPanel();
  if (SIM.updateNorDropdownSize) SIM.updateNorDropdownSize();
  checkFungusStack();
}

window.addEventListener("resize", () => {
  // Always update browser width label
  const bwEl = document.getElementById("browserWidthValue");
  const bwWrapper = document.querySelector(".viewport-wrapper");
  if (bwEl && bwWrapper) bwEl.textContent = Math.round(window.innerWidth - bwWrapper.getBoundingClientRect().left) + "px";

  if (demoMode) { buildDemoView(); return; }

  if (activeLayout === "standalone" && activeDevice === "none") {
    // Teacher Desktop — full rebuild (responsive content)
    buildViewport();
  } else if (activeLayout === "standalone" && activeDevice !== "none") {
    // Device frame — lightweight update (no rebuild)
    updateStandaloneDeviceFrame();
  } else if (activeDevice === "chromebook" && activeLayout !== "standalone") {
    // Chromebook + AP layouts — shrink frame, label freeze
    const device = DEVICES[activeDevice];
    const wrapper = document.querySelector(".viewport-wrapper");
    if (device && wrapper) {
      const wrapperW = wrapper.clientWidth;
      const frameVisualW = Math.min(device.screenW, wrapperW);
      const frameEl = document.querySelector(".device-frame");
      if (frameEl) {
        frameEl.style.transition = "none";
        frameEl.style.width = frameVisualW + "px";
      }
      // Pin page to left when frame < 1100, restore centering when wider
      const viewportArea = document.querySelector(".viewport-area");
      if (viewportArea) {
        viewportArea.style.justifyContent = frameVisualW < 1100 ? "flex-start" : "";
      }
      const info = document.getElementById("viewportInfo");
      if (info) {
        const availH = device.screenH - device.topChrome - device.bottomChrome;
        const layoutName = LAYOUTS[activeLayout] ? LAYOUTS[activeLayout].name : activeLayout;
        const contentW = activeLayout === "ap-2col" ? (sidebarExpanded ? AP_CONTENT_W_EXPANDED : AP_CONTENT_W_COLLAPSED) : 1044;
        info.innerHTML = '<strong>' + device.name + ' / ' + layoutName + '</strong><br><strong>Screen:</strong> ' + device.screenW + 'w \u00d7 ' + device.screenH + 'h \u2022 <strong>Available:</strong> ' + frameVisualW + 'w \u00d7 ' + availH + 'h \u2022 <strong>Content:</strong> ' + contentW + 'w \u00d7 ' + AP_CONTENT_H + 'h';
        const isClipping = wrapperW < device.screenW;
        info.style.alignSelf = isClipping ? "flex-start" : "";
        info.style.minWidth = isClipping ? Math.max(frameVisualW, 1100) + "px" : "";
      }
    }
  } else if (activeDevice !== "none" && activeDevice !== "chromebook") {
    // iPad/Android + any layout — label freeze only
    const info = document.getElementById("viewportInfo");
    const device = DEVICES[activeDevice];
    if (info && device) {
      const wrapperW = document.querySelector(".viewport-wrapper").clientWidth;
      const isClipping = wrapperW < device.screenW;
      info.style.alignSelf = isClipping ? "flex-start" : "";
      info.style.minWidth = isClipping ? device.screenW + "px" : "";
    }
  }
  // Redraw charts at new size
  if (SIM.updateDataPanel) SIM.updateDataPanel();
  if (SIM.updateNorDropdownSize) SIM.updateNorDropdownSize();
});

</script>
</body>
</html>
