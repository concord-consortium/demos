<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MassSims</title>
<style>
/* Self-hosted fonts */
/* Barlow 400 */ @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 400; src: url('fonts/17ef8a066a33.woff2') format('woff2'); }
/* Barlow Condensed 400 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 400; src: url('fonts/343e6c738440.woff2') format('woff2'); }
/* Barlow Condensed 600 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 600; src: url('fonts/07c3c732a90e.woff2') format('woff2'); }
/* Lato 400 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; src: url('fonts/d5b18a30a456.woff2') format('woff2'); }
/* Lato 400i */ @font-face { font-family: 'Lato'; font-style: italic; font-weight: 400; src: url('fonts/lato-italic-400.woff2') format('woff2'); }
/* Lato 700 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 700; src: url('fonts/a658a6a6ab26.woff2') format('woff2'); }
/* Lato 900 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 900; src: url('fonts/lato-black-900.woff2') format('woff2'); }
/* Roboto Condensed */ @font-face { font-family: 'Roboto Condensed'; font-style: normal; font-weight: 100 900; src: url('fonts/d2466d84dfac.woff2') format('woff2'); }
/* Slackey */ @font-face { font-family: 'Slackey'; font-style: normal; font-weight: 400; src: url('fonts/b9e0133fed40.woff2') format('woff2'); }
/* Fontdiner Swanky */ @font-face { font-family: 'Fontdiner Swanky'; font-style: normal; font-weight: 400; src: url('fonts/ab612a511c9f.woff2') format('woff2'); }
/* Vampiro One */ @font-face { font-family: 'Vampiro One'; font-style: normal; font-weight: 400; src: url('fonts/51ccc1196225.woff2') format('woff2'); }
/* Coming Soon */ @font-face { font-family: 'Coming Soon'; font-style: normal; font-weight: 400; src: url('fonts/f6db7f9cd556.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    background: #ededed;
    color: #333;
    letter-spacing: 0.02em;
    padding: 20px;
  }

  /* Main layout: left buttons | viewport | right buttons */
  .main-layout {
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }

  /* Button columns */
  .btn-column {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 150px;
    flex-shrink: 0;
    padding-top: 0;
  }

  .btn-column [role="group"] {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .btn-column-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: -2px;
  }

  .toggle-btn {
    font-family: 'Barlow Condensed', sans-serif;
    padding: 8px 14px;
    min-height: 44px;
    font-size: 18px;
    line-height: 20px;
    font-weight: 600;
    color: #333;
    background: #f0f0f0;
    border: 1px solid #333;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    text-align: left;
    white-space: nowrap;
  }

  .toggle-btn:hover,
  .toggle-btn:focus-visible {
    background: #d8d8d8;
    color: #333;
  }

  .toggle-btn:focus {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px #fff;
  }
  .toggle-btn:focus:not(:focus-visible) {
    outline: none;
    box-shadow: none;
  }
  .toggle-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px #fff;
  }

  body.teal-bg .toggle-btn {
    border-color: #fff;
  }

  body.teal-bg .toggle-btn:focus {
    outline: none;
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px #005FCC, 0 0 0 4px #fff;
  }
  body.teal-bg .toggle-btn:focus:not(:focus-visible) {
    box-shadow: none;
  }
  body.teal-bg .toggle-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px #005FCC, 0 0 0 4px #fff;
  }

  .toggle-btn:active:not(.active) {
    background: #c0c0c0;
  }

  .toggle-btn.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }

  body.teal-bg .toggle-btn.active {
    border-color: #fff;
  }
  /* Viewport display area */
  .viewport-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-left: 1px solid #858585;
    align-self: stretch;
    min-height: calc(100vh - 40px);
    position: relative;
  }

  .viewport-info {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.3;
    color: #333;
    margin-bottom: 12px;
    text-align: center;
    min-height: 2.6em;
    position: relative;
    z-index: 1;
  }

  .viewport-info strong {
    font-weight: 600;
    color: #333;
  }

  /* Device frame */
  .device-frame {
    position: relative;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    box-sizing: content-box;
    border: 2px solid #333;
    transition: width 0.3s ease, height 0.3s ease;
  }

  .device-frame.no-limit {
    border-color: #ccc;
    border-style: dashed;
    background: transparent;
  }

  /* Browser / OS chrome bars */
  .chrome-top {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0 8px;
    position: relative;
  }

  .chrome-top::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    white-space: nowrap;
  }

  .chrome-bottom {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .chrome-bottom::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    text-align: center;
    white-space: nowrap;
  }

  /* Available viewport area */
  .viewport-area {
    background: #0481A0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
    flex: 1;
  }

  /* AP container — floated centered unit */
  .ap-container {
    background: transparent;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .ap-right-column {
    display: flex;
    flex-direction: column;
    width: 767px;
    box-sizing: content-box;
    border: 1px solid #858585;
    margin-right: 26px;
  }

  .ap-header {
    background: #047a99;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .ap-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .ap-body {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  /* Left column for 2-column layout */
  .ap-left-column {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-left: 28px;
    margin-right: 10px;
    transition: width 0.25s ease;
    overflow: hidden;
  }

  .ap-left-toggle {
    background: #3f3f3f;
    display: flex;
    align-items: center;
    position: relative;
    cursor: pointer;
  }

  .ap-left-toggle:hover,
  .ap-left-toggle:focus-visible {
    background: #4a4a4a;
  }

  .ap-left-toggle:active {
    background: #3a3a3a;
  }

  .ap-left-toggle-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    position: absolute;
    left: 181px;
    white-space: nowrap;
  }

  .ap-left-toggle-icon {
    position: absolute;
    right: 20px;
    width: 32px;
    height: 32px;
  }

  .ap-left-toggle-icon-collapsed {
    width: 32px;
    height: 32px;
    margin-top: 5px;
    transform: scaleX(-1);
  }

  .ap-left-toggle-label-collapsed {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    margin-top: 12px;
    white-space: nowrap;
  }

  .ap-left-toggle:focus {
    outline: none;
    box-shadow: inset 0 0 0 2px #005FCC, inset 0 0 0 4px #fff;
  }
  .ap-left-toggle:focus:not(:focus-visible) {
    box-shadow: none;
  }
  .ap-left-toggle:focus-visible {
    outline: none;
    box-shadow: inset 0 0 0 2px #005FCC, inset 0 0 0 4px #fff;
  }

  .ap-left-resources {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .ap-left-resources-header {
    background: #dfdfdf;
    height: 37px;
    padding-left: 20px;
    display: flex;
    align-items: center;
  }

  .ap-left-resources-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #333;
  }

  .ap-left-resources-body {
    flex: 1;
    background: #f4f4f4;
    padding: 25px 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
    overflow: auto;
  }

  .ap-left-resources-body p {
    margin: 0 0 16px 0;
  }

  .ap-left-resources-body p:last-child {
    margin-bottom: 0;
  }

  .ap-left-resources-body ul {
    margin: 0 0 16px 0;
    padding-left: 40px;
  }

  .ap-left-resources-body li {
    margin-bottom: 12px;
  }

  .ap-left-resources-body li:last-child {
    margin-bottom: 0;
  }


  /* Sim title bar */
  .sim-title-bar {
    height: 50px;
    background: var(--sim-title-bar-bg, #fff);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px 0 20px;
    flex-shrink: 0;
    position: relative;
  }

  .sim-title-bar::after {
    content: "";
    position: absolute;
    bottom: calc(-1 * var(--sim-title-accent, 0px));
    left: 0;
    right: 0;
    height: var(--sim-title-accent, 0px);
    background: inherit;
  }

  .sim-title-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sim-title-name {
    font-family: 'Lato', sans-serif;
    font-size: 24px;
    line-height: 1;
    font-weight: 700;
    color: var(--sim-title-text, #333);
    margin: 0;
    font-synthesis: none;
    display: flex;
    align-items: center;
    height: 28px;
  }

  .sim-title-desc {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    color: var(--sim-title-desc, #333);
  }

  .sim-title-right {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .sim-title-logo {
    display: block;
  }

  .sim-title-logo:first-child {
    margin-right: 3px;
  }

  .sim-info-btn {
    margin-left: 5px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    font-weight: 700;
    padding: 3px 12px 3px 8px;
    height: 34px;
    box-sizing: border-box;
    border: 2px solid var(--sim-about-border, #555);
    border-radius: 6px;
    background: var(--sim-surface, #fff);
    color: var(--sim-about-text, #333);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .sim-info-btn::after {
    content: "";
    position: absolute;
    top: -7px;
    left: 0;
    right: 0;
    bottom: -7px;
  }

  .sim-info-btn.compact-hit::after {
    top: 0;
    bottom: 0;
  }

  .sim-info-btn svg {
    width: 24px;
    height: 24px;
    pointer-events: none;
  }

  .sim-info-btn:hover,
  .sim-info-btn:focus-visible {
    background: var(--sim-btn-hover, #f0f0f0);
  }

  .sim-info-btn:active {
    background: var(--sim-btn-active, #d0d0d0);
  }

  .sim-info-btn:focus {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }
  .sim-info-btn:focus:not(:focus-visible) {
    outline: none;
  }
  .sim-info-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }

  /* Info modal */
  .info-modal {
    position: absolute;
    top: 50px;
    right: 10px;
    width: 400px;
    max-height: 70%;
    background: #fff;
    border: 2px solid var(--sim-about-border, #555);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    z-index: 101;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .info-modal-header {
    display: flex;
    align-items: center;
    padding: 3px 3px 3px 12px;
    height: 52px;
    box-sizing: border-box;
    border-bottom: 1px solid var(--sim-modal-border, #555);
    cursor: grab;
    flex-shrink: 0;
    user-select: none;
    touch-action: none;
    background: var(--sim-surface, #fff);
  }

  .info-modal-header:active {
    cursor: grabbing;
  }

  .info-modal-header-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    margin-right: 10px;
  }

  .info-modal-header-title {
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #333;
    flex: 1;
    margin: 0;
  }

  .info-modal-close {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--sim-surface, #fff);
    border: none;
    cursor: pointer;
    border-radius: 4px;
    padding: 0;
    flex-shrink: 0;
    transition: background-color 0.15s ease;
  }

  .info-modal-close:hover,
  .info-modal-close:focus-visible {
    background: var(--sim-btn-hover, #f0f0f0);
  }

  .info-modal-close:active {
    background: var(--sim-btn-active, #d0d0d0);
  }

  .info-modal-close:focus {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }
  .info-modal-close:focus:not(:focus-visible) {
    outline: none;
  }
  .info-modal-close:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }

  .info-modal-close svg {
    width: 24px;
    height: 24px;
  }

  .info-modal-body {
    padding: 16px 20px 20px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 22px;
    color: #333;
    user-select: text;
  }

  .info-modal-body-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .info-modal-body:focus {
    outline: none;
  }
  .info-modal-body:focus-visible {
    outline: 2px solid transparent;
  }

  .info-modal-body-wrap .scroll-focus-ring {
    border-radius: 0 0 6px 6px;
  }

  .info-modal-body:focus ~ .scroll-focus-ring {
    display: block;
  }
  .info-modal-body:focus:not(:focus-visible) ~ .scroll-focus-ring {
    display: none;
  }
  .info-modal-body:focus-visible ~ .scroll-focus-ring {
    display: block;
  }

  .info-modal-body h3 {
    font-size: 16px;
    font-weight: 700;
    margin: 16px 0 6px;
    color: #333;
  }

  .info-modal-body h3:first-child {
    margin-top: 0;
  }

  .info-modal-body p {
    margin: 0 0 12px;
  }

  .info-modal-body ul,
  .info-modal-body ol {
    margin: 0 0 12px;
    padding-left: 20px;
  }

  .info-modal-body li {
    margin-bottom: 4px;
  }

  /* Question containers below sim content */
  .question-row {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    padding: 0 27px;
    width: 100%;
    box-sizing: border-box;
  }

  .question-container {
    width: 517px;
    display: flex;
    flex-direction: column;
    border: 1px solid #858585;
    box-sizing: content-box;
  }

  .question-header {
    background: #047a99;
    height: 36px;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .question-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .question-body {
    background: #fff;
    flex: 1;
    min-height: 200px;
    padding: 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
  }

  .question-input {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 16px;
    height: 200px;
    margin-top: 10px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-style: italic;
    color: #767676;
    line-height: 1.5;
  }

  .content-area.standalone {
    border: 2px solid var(--sim-panel-border, #555);
    border-radius: 10px;
    box-sizing: content-box;
    overflow: hidden;
  }

  /* Content area */
  .content-area {
    font-family: 'Lato', sans-serif;
    background: var(--sim-content-bg, #fff);
    position: relative;
    flex-shrink: 0;
    transition: width 0.25s ease;
    display: flex;
    flex-direction: column;
    user-select: none;
    overflow: hidden;
  }

  /* Sim content containers */
  .sim-content {
    display: flex;
    gap: 10px;
    padding: 0 10px 10px 10px;
    flex: 1;
    min-height: 0;
  }

  .sim-panel-tab {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 36px;
    padding: 0 14px;
    background: var(--sim-panel-tab-bg, #e8e8e8);
    border: 2px solid var(--sim-panel-border, #555);
    border-radius: 999px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    font-family: 'Lato', sans-serif;
    white-space: nowrap;
    z-index: 11;
  }

  .sim-panel-tab-label {
    font-size: 18px;
    line-height: 22px;
    font-weight: 700;
    color: var(--sim-panel-tab-text, #333);
    margin: 0;
  }

  .sim-panel-tab-subtitle {
    font-size: 16px;
    font-weight: 400;
    color: #333;
  }

  .sim-tab-wrap {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: stretch;
    height: 36px;
    z-index: 11;
    box-sizing: border-box;
    white-space: nowrap;
  }

  /* DEV NOTE: flex is overridden by JS — initial panel setup sets per-sim ratios,
     then the responsive handler (e.g. updateNorDropdownSize) sets flex:none + explicit widths. */
  .sim-panel {
    border: 2px solid var(--sim-panel-border, #555);
    border-radius: 8px;
    background: var(--sim-panel-bg, #e8e8e8);
    margin-top: 17px;
    box-sizing: border-box;
    flex: 1;
    position: relative;
  }

  .sim-panel.has-scroll {
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .trials-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-gutter: stable;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 31px 0 12px 15px;
  }

  .trials-scroll:focus {
    outline: none;
  }
  .trials-scroll:focus-visible {
    outline: none;
  }

  .trials-scroll:focus ~ .scroll-focus-ring {
    display: block;
  }
  .trials-scroll:focus:not(:focus-visible) ~ .scroll-focus-ring {
    display: none;
  }
  .trials-scroll:focus-visible ~ .scroll-focus-ring {
    display: block;
  }

  .scroll-focus-ring {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px #fff, inset 0 0 0 3px #005FCC;
    pointer-events: none;
    z-index: 10;
  }

  .trial-card {
    width: 120px;
    height: 136px;
    border: 2px solid var(--sim-panel-border, #555);
    border-radius: 6px;
    background: var(--sim-surface, #fff);

function getSimTitleBar() {
  if (!_simTitleBar || _currentSim !== activeSim) {
    _simTitleBar = buildSimTitleBar();
    _simContent = buildSimContent();
    _currentSim = activeSim;
  }
  return _simTitleBar;
}

function getSimContent() {
  if (!_simContent || _currentSim !== activeSim) {
    _simTitleBar = buildSimTitleBar();
    _simContent = buildSimContent();
    _currentSim = activeSim;
  }
  return _simContent;
}

function invalidateSimCache() {
  _simTitleBar = null;
  _simContent = null;
  _currentSim = null;
  var tcb = document.getElementById("temp-combo-bar");
  var tcn = document.getElementById("temp-combo-note");
  if (tcb) tcb.style.display = "none";
  if (tcn) tcn.style.display = "none";
  if (SIM._stopNorCloud) SIM._stopNorCloud();
  if (SIM._stopSnow) SIM._stopSnow();
  if (SIM._stopSun) SIM._stopSun();
  if (SIM._stopWind) SIM._stopWind();
  if (SIM._stopHaze) SIM._stopHaze();
  if (SIM._stopWxFx) SIM._stopWxFx();
  if (SIM._resetArrowPositions) SIM._resetArrowPositions();
  if (SIM._norRunTimeouts) { SIM._norRunTimeouts.forEach(clearTimeout); SIM._norRunTimeouts.length = 0; }
  if (SIM.trialsObserver) SIM.trialsObserver.disconnect();
  if (SIM._norDataRO) SIM._norDataRO.disconnect();
  if (SIM.closeDropdownsHandler) document.removeEventListener("click", SIM.closeDropdownsHandler);
  if (SIM.panelNavHandler) document.removeEventListener("keydown", SIM.panelNavHandler);
  for (var key in SIM) delete SIM[key];
}

        }

function buildSimContent() {

    };

    // Build the fungus "F-in-circle" icon path using canvas API calls
    // instead of new Path2D(svgString), which crashes Safari < 14.1.
    function buildFungusIconPath() {
      const p = new Path2D();
      // Outer circle (clockwise)
      p.arc(12, 12, 10, 0, Math.PI * 2);
      // Inner circle cutout (counter-clockwise)
      p.moveTo(20, 12);
      p.arc(12, 12, 8, 0, Math.PI * 2, true);
      // Letter "F"
      p.moveTo(15.6264648, 6.97851562);
      p.lineTo(15.6264648, 8.67382813);
      p.lineTo(10.7797852, 8.67382813);
      p.lineTo(10.7797852, 11.0458984);
      p.lineTo(14.9633789, 11.0458984);
      p.lineTo(14.9633789, 12.7412109);
      p.lineTo(10.7797852, 12.7412109);
      p.lineTo(10.7797852, 17);
      p.lineTo(8.75634766, 17);
      p.lineTo(8.75634766, 6.97851562);
      p.closePath();
      return p;
    }

    const fungusIconPath = buildFungusIconPath();

    function drawFungusFlag(ctx, fx, margin, gh, canFlip, chartWidth) {
      ctx.font = "400 16px 'Roboto Condensed', sans-serif";
      const flagText = "Fungus";
      const tw = ctx.measureText(flagText).width;
      const iconSz = 20, iconGap = 3;
      const flagH = 28, flagPadL = 4, flagPadR = 8;
      const flagW = flagPadL + iconSz + iconGap + tw + flagPadR;
      const flipLeft = canFlip && (fx + flagW > chartWidth - margin.right);
      const flagX = flipLeft ? fx - flagW - 1 : fx + 1;
      const flagY = 32 - flagH;
      const flagR = flagH / 2;
      ctx.strokeStyle = "#1A3C8F";
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.moveTo(fx, flagY);
      ctx.lineTo(fx, margin.top + gh);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#C8D8FC";
      ctx.beginPath();
      if (flipLeft) {
        ctx.moveTo(flagX + flagR, flagY);
        ctx.lineTo(flagX + flagW, flagY);
        ctx.lineTo(flagX + flagW, flagY + flagH);
        ctx.lineTo(flagX + flagR, flagY + flagH);
        ctx.arcTo(flagX, flagY + flagH, flagX, flagY + flagH - flagR, flagR);
        ctx.lineTo(flagX, flagY + flagR);
        ctx.arcTo(flagX, flagY, flagX + flagR, flagY, flagR);
      } else {
        ctx.moveTo(flagX, flagY);
        ctx.lineTo(flagX + flagW - flagR, flagY);
        ctx.arcTo(flagX + flagW, flagY, flagX + flagW, flagY + flagR, flagR);
        ctx.lineTo(flagX + flagW, flagY + flagH - flagR);
        ctx.arcTo(flagX + flagW, flagY + flagH, flagX + flagW - flagR, flagY + flagH, flagR);
        ctx.lineTo(flagX, flagY + flagH);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#1A3C8F";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      const iconX = flagX + flagPadL;
      const iconY = flagY + (flagH - iconSz) / 2;
      ctx.save();
      ctx.translate(iconX, iconY);
      ctx.scale(iconSz / 24, iconSz / 24);
      ctx.fill(fungusIconPath);
      ctx.restore();
      ctx.fillText(flagText, iconX + iconSz + iconGap, flagY + flagH / 2 + 1.5);
    }

    function scrollItemIntoView(el, container) {
      const cs = getComputedStyle(container);
      const padTop = parseFloat(cs.paddingTop);
      const padBottom = parseFloat(cs.paddingBottom);

      const eRect = el.getBoundingClientRect();

        SIM.selectedTrial = "A";
        let activeTrialCount = 1; // Start with just A

        // Abbreviate parent names for trial cards: "Wild W1" → "W1", "Cavendish C1" → "C1"
        function abbrev(name) {
          if (!name) return null;

        function updateTrialCardLabel(letter) {
          const cardEl = SIM.trialCards[letter];

        SIM.updateTrialCardLabel = updateTrialCardLabel;

        function buildTrialCard(letter) {
          trialState[letter] = { p1: null, p2: null, locked: false, crosses: [], fungusAfterCross: null };
          const card = document.createElement("div");
          card.className = "trial-card";
          card.setAttribute("role", "option");
          card.setAttribute("tabindex", "-1");
          card.setAttribute("aria-label", "Trial " + letter);
          card.style.cursor = "pointer";
          SIM.trialCards[letter] = card;
          function selectTrial() {
            selectTrialByCard(card, letter);
          }
          card.addEventListener("click", selectTrial);
          card.addEventListener("keydown", (e) => {
            if ((e.key === "Enter" || e.key === " ") && e.target === card) {
              e.preventDefault();
              selectTrial();
              return;
            }
            handleTrialCardNav(card, e);
          });
          card.setAttribute("aria-selected", "false");
          const lbl = document.createElement("span");
          lbl.className = "trial-card-label";
          lbl.textContent = letter;
          lbl.setAttribute("aria-hidden", "true");
          card.appendChild(lbl);
          const resetBtn = document.createElement("button");
          resetBtn.className = "trial-card-reset";
          resetBtn.setAttribute("aria-label", "Reset trial " + letter);
          setAriaDisabled(resetBtn, true);
          resetBtn.setAttribute("tabindex", "-1");
          const resetIcon = createSVGIcon(resetIconSVG);
          resetBtn.appendChild(resetIcon);
          function resetTrial(e) {
            e.stopPropagation();
            if (resetBtn.getAttribute("aria-disabled") === "true") return;
            trialState[letter] = { p1: null, p2: null, locked: false, crosses: [], fungusAfterCross: null };
            updateTrialCardLabel(letter);
            setAriaDisabled(resetBtn, true);
            if (SIM.syncDropdownsToTrial) SIM.syncDropdownsToTrial(letter);
            if (SIM.renderOffspring) SIM.renderOffspring(letter);
            if (SIM.updateSimButtons) SIM.updateSimButtons();
            if (SIM.announce) SIM.announce("Trial " + letter + " reset.");
          }
          resetBtn.addEventListener("click", resetTrial);
          card.appendChild(resetBtn);
          return card;
        }

        function selectTrialByCard(targetCard, targetLetter) {
          scrollWrap.querySelectorAll(".trial-card:not(.new-card)").forEach(c => {
            c.classList.remove("selected");
            c.setAttribute("aria-selected", "false");
            c.style.cursor = "pointer";
            const rb = c.querySelector(".trial-card-reset");
            if (rb) rb.setAttribute("tabindex", "-1");

          targetCard.classList.add("selected");

          targetCard.style.cursor = "default";
          const rb = targetCard.querySelector(".trial-card-reset");
          if (rb) rb.setAttribute("tabindex", "0");

          if (indicator) indicator.textContent = targetLetter;
          scrollItemIntoView(targetCard, scrollWrap);

          SIM._suppressAnnounce = true;
          if (SIM.syncDropdownsToTrial) SIM.syncDropdownsToTrial(targetLetter);

          if (SIM.updateSimButtons) SIM.updateSimButtons();

            parts.push("Parent 2 " + (st.p2 || "not selected"));

            e.preventDefault();
            const cards = getTrialNavCards();
            const cur = cards.indexOf(cardEl);
            if (cur < 0) return;
            const next = e.key === "ArrowDown"
              ? (cur + 1) % cards.length
              : (cur - 1 + cards.length) % cards.length;
            cards[cur].setAttribute("tabindex", "-1");
            cards[next].setAttribute("tabindex", "0");
            cards[next].focus({ preventScroll: true });
            scrollItemIntoView(cards[next], scrollWrap);

            e.preventDefault();
            const cards = getTrialNavCards();
            cards.forEach(c => c.setAttribute("tabindex", "-1"));

            cards[0].focus({ preventScroll: true });
            scrollItemIntoView(cards[0], scrollWrap);
          } else if (e.key === "End") {

            const cards = getTrialNavCards();
            cards.forEach(c => c.setAttribute("tabindex", "-1"));
            cards[cards.length - 1].setAttribute("tabindex", "0");
            cards[cards.length - 1].focus({ preventScroll: true });
            scrollItemIntoView(cards[cards.length - 1], scrollWrap);

          const selIdx = cards.findIndex(c => c.classList.contains("selected"));
          const activeIdx = selIdx >= 0 ? selIdx : 0;
          cards.forEach((c, i) => c.setAttribute("tabindex", i === activeIdx ? "0" : "-1"));

            if (e.key === "Enter" || e.key === " ") {

              card.click();

          function openDropdown(fromKeyboard) {
            document.querySelectorAll(".sim-dropdown.open").forEach(d => {
              d.classList.remove("open");
              d.querySelector(".sim-dropdown-trigger").setAttribute("aria-expanded", "false");
              d.querySelector(".sim-dropdown-list").setAttribute("aria-hidden", "true");
            });
            dropdown.classList.add("open");
            trigger.setAttribute("aria-expanded", "true");
            list.setAttribute("aria-hidden", "false");
            if (fromKeyboard) {
              focusedIndex = items.findIndex(it => it.classList.contains("selected"));
              if (focusedIndex < 0) focusedIndex = 0;
              updateFocus();
            } else {
              focusedIndex = -1;
              items.forEach(it => it.classList.remove("focused"));
            }
          }

          function closeDropdown() {
            dropdown.classList.remove("open");
            trigger.setAttribute("aria-expanded", "false");
            list.setAttribute("aria-hidden", "true");
            trigger.removeAttribute("aria-activedescendant");
            items.forEach(it => it.classList.remove("focused"));
            focusedIndex = -1;
          }

          function updateFocus() {
            items.forEach(it => it.classList.remove("focused"));
            if (focusedIndex >= 0 && focusedIndex < items.length) {
              items[focusedIndex].classList.add("focused");
              trigger.setAttribute("aria-activedescendant", items[focusedIndex].id);
              items[focusedIndex].scrollIntoView({ block: "nearest" });
            }
          }

          trigger.addEventListener("click", (e) => {
            e.stopPropagation();
            if (dropdown.classList.contains("locked")) return;
            if (dropdown.classList.contains("open")) closeDropdown();
            else openDropdown();
          });

          trigger.addEventListener("keydown", (e) => {
            if (dropdown.classList.contains("locked")) return;
            const isOpen = dropdown.classList.contains("open");
            switch (e.key) {
              case "Enter":
              case " ":
                e.preventDefault();
                if (isOpen && focusedIndex >= 0) selectItem(focusedIndex);
                else openDropdown(true);
                break;
              case "ArrowDown":
                e.preventDefault();
                if (!isOpen) { openDropdown(true); break; }
                focusedIndex = (focusedIndex + 1) % items.length;
                updateFocus();
                break;
              case "ArrowUp":
                e.preventDefault();
                if (!isOpen) { openDropdown(true); break; }
                focusedIndex = (focusedIndex - 1 + items.length) % items.length;
                updateFocus();
                break;
              case "Home":
                e.preventDefault();
                if (isOpen) { focusedIndex = 0; updateFocus(); }
                break;
              case "End":
                e.preventDefault();
                if (isOpen) { focusedIndex = items.length - 1; updateFocus(); }
                break;
              case "Escape":
                e.preventDefault();
                closeDropdown();
                break;
              case "Tab":
                closeDropdown();
                break;
              default:
                // Type-ahead: jump to first item starting with typed letter
                if (isOpen && e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                  const ch = e.key.toLowerCase();
                  const idx = items.findIndex(it => it.textContent.toLowerCase().startsWith(ch));
                  if (idx >= 0) { focusedIndex = idx; updateFocus(); }
                }
                break;
            }
          });

          group.appendChild(dropdown);
          return group;
        }

        // Close dropdowns when clicking outside
        if (SIM.closeDropdownsHandler) document.removeEventListener("click", SIM.closeDropdownsHandler);
        SIM.closeDropdownsHandler = () => {

        SIM.syncDropdownsToTrial = function(letter) {
          const st = SIM.trialState[letter];
          parents.querySelectorAll(".sim-dropdown").forEach(d => {
            if (d._parentLabel === "Parent 1") {
              d._setSelection(st.p1);
            } else if (d._parentLabel === "Parent 2") {
              d._setSelection(st.p2);
            }
            if (st.locked) d._lock(); else d._unlock();
          });
          updateCircleSize();
        };

        function updateCircleSize() {
          const pw = parents.clientWidth;
          const triggers = parents.querySelectorAll(".sim-dropdown-trigger");
          const t0 = triggers[0];
          if (!t0) return;
          const latoW = t0._latoW;
          const condensedW = t0._condensedW;
          const crossW = 24;
          const minGap = 5;
          const fullGap = 10;

          // Phase 1: try Lato-width dropdowns, shrink circles
          const availLato = pw - (latoW * 2) - crossW - (fullGap * 4);
          const szLato = Math.max(CIRCLE_MIN, Math.min(CIRCLE_MAX, Math.floor(availLato / 2)));

          if (szLato > CIRCLE_MIN) {
            const t = (szLato - CIRCLE_MIN) / (CIRCLE_MAX - CIRCLE_MIN);
            const gap = Math.max(minGap, Math.round(minGap + t * (fullGap - minGap)));
            const crossFontSize = Math.round(20 + t * (24 - 20));
            parents.style.gap = gap + "px";
            cross.style.fontSize = crossFontSize + "px";
            parents.querySelectorAll(".sim-parent-group").forEach(g => { g.style.flex = ""; });
            triggers.forEach(tr => {
              const dd = tr.closest(".sim-dropdown");
              if (dd.classList.contains("locked")) return;
              tr.style.width = tr._defaultW + "px";
              tr.style.padding = "";
              tr.style.gap = "";
              const caret = tr.querySelector(".sim-dropdown-caret");
              if (caret) { caret.style.width = ""; caret.style.height = ""; }
              tr.style.fontWeight = "";
              dd.style.fontFamily = "";
              const selItem = dd.querySelector(".sim-dropdown-item.selected");
              if (selItem) selItem.style.fontWeight = "";
            });
            circle1.style.width = szLato + "px"; circle1.style.height = szLato + "px";
            circle2.style.width = szLato + "px"; circle2.style.height = szLato + "px";
            return;
          }

          // Phase 2: circles at minimum (42px) — switch to Roboto Condensed, use min gap
          parents.style.gap = minGap + "px";
          cross.style.fontSize = "20px";
          parents.querySelectorAll(".sim-parent-group").forEach(g => {
            g.style.flex = g.classList.contains("locked") ? "" : "none";
          });
          circle1.style.width = CIRCLE_MIN + "px"; circle1.style.height = CIRCLE_MIN + "px";
          circle2.style.width = CIRCLE_MIN + "px"; circle2.style.height = CIRCLE_MIN + "px";

          // Space available for the two dropdowns after circles, cross, and gaps are placed
          const fixedSpace = CIRCLE_MIN * 2 + crossW + (minGap * 4);
          const ddBudget = Math.floor((pw - fixedSpace) / 2);
          const ddW = Math.max(condensedW, Math.min(latoW, ddBudget));

          const useCondensed = ddW < latoW;
          const ddT = latoW > condensedW ? (ddW - condensedW) / (latoW - condensedW) : 0;
          triggers.forEach(t => {
            const dd = t.closest(".sim-dropdown");
            if (dd.classList.contains("locked")) {
              return;
            }
            const ddPadL = Math.round(7 + ddT * (10 - 7));
            const ddPadR = Math.round(5 + ddT * (10 - 5));
            const ddGap = Math.round(0 + ddT * (6 - 0));
            const caretSize = Math.round(18 + ddT * (24 - 18));
            t.style.width = ddW + "px";
            t.style.padding = "8px " + ddPadR + "px 8px " + ddPadL + "px";
            t.style.gap = ddGap + "px";
            const caret = t.querySelector(".sim-dropdown-caret");
            if (caret) { caret.style.width = caretSize + "px"; caret.style.height = caretSize + "px"; }
            t.style.fontWeight = useCondensed ? "500" : "";
            dd.style.fontFamily = useCondensed ? "'Roboto Condensed',sans-serif" : "";
            const selItem = dd.querySelector(".sim-dropdown-item.selected");
            if (selItem) selItem.style.fontWeight = useCondensed ? "500" : "";
          });
          const hasFungus = statsLabel && statsLabel.querySelector(".fungus-active-label");
          const preCross = hasFungus && SIM.trialState[SIM.selectedTrial] && SIM.trialState[SIM.selectedTrial].crosses.length === 0;
          if (preCross) { statsLabel.style.fontFamily = useCondensed ? "'Roboto Condensed',sans-serif" : ""; } else if (statsLabel) { statsLabel.style.fontFamily = ""; }
          const condensedFont = useCondensed ? "'Roboto Condensed',sans-serif" : "";
          document.querySelectorAll(".fungus-divider-label").forEach(el => { el.style.fontFamily = condensedFont; });
        }
        SIM.updateCircleSize = updateCircleSize;

        inner.appendChild(parents);

        // Stats label straddling the border between parents and offspring
        const statsWrap = document.createElement("div");

        statsWrap.appendChild(statsLabel);

        // Middle: Offspring section (scrollable)
        const offspring = document.createElement("div");
        offspring.className = "sim-offspring";

        function updateOffspringTabindex() {
