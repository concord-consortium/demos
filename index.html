<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Net Maker</title>
<style>
/* Self-hosted fonts */
/* Barlow 400 */ @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 400; src: url('fonts/17ef8a066a33.woff2') format('woff2'); }
/* Barlow Condensed 400 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 400; src: url('fonts/343e6c738440.woff2') format('woff2'); }
/* Barlow Condensed 600 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 600; src: url('fonts/07c3c732a90e.woff2') format('woff2'); }
/* Lato 400 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; src: url('fonts/d5b18a30a456.woff2') format('woff2'); }
/* Lato 400i */ @font-face { font-family: 'Lato'; font-style: italic; font-weight: 400; src: url('fonts/lato-italic-400.woff2') format('woff2'); }
/* Lato 700 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 700; src: url('fonts/a658a6a6ab26.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    background: #ededed;
    color: #333;
    letter-spacing: 0.02em;
    padding: 20px;
  }

  /* Main layout: left buttons | viewport | right buttons */
  .main-layout {
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }

  /* Button columns */
  .btn-column {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 150px;
    flex-shrink: 0;
    padding-top: 0;
  }

  .btn-column [role="group"] {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .btn-column-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: -2px;
  }

  /* Day sub-heading inside the Interactives group */
  .day-sublabel {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #6B7280;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 0 2px;
  }
  .day-sublabel::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #C4C9D2;
  }
  .day-sublabel:first-child { margin-top: 0; }
  body.teal-bg .day-sublabel { color: rgba(255,255,255,0.85); }
  body.teal-bg .day-sublabel::after { background: rgba(255,255,255,0.4); }

  .toggle-btn {
    font-family: 'Barlow Condensed', sans-serif;
    /* Prototype chrome, not a student touch target — the 44px minimum doesn't
       apply here. padding + line-height set the real floor, so both move together. */
    padding: 5px 14px;
    min-height: 32px;
    font-size: 18px;
    line-height: 20px;
    font-weight: 600;
    color: #333;
    background: #f0f0f0;
    border: 1px solid #333;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    text-align: left;
    white-space: nowrap;
  }

  .toggle-btn:hover,
  .toggle-btn:focus-visible {
    background: #d8d8d8;
    color: #333;
  }

  .toggle-btn:focus {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px #fff;
  }
  .toggle-btn:focus:not(:focus-visible) {
    outline: none;
    box-shadow: none;
  }
  .toggle-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px #fff;
  }

  body.teal-bg .toggle-btn {
    border-color: #fff;
  }

  body.teal-bg .toggle-btn:focus {
    outline: none;
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px #005FCC, 0 0 0 4px #fff;
  }
  body.teal-bg .toggle-btn:focus:not(:focus-visible) {
    box-shadow: none;
  }
  body.teal-bg .toggle-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px #005FCC, 0 0 0 4px #fff;
  }

  .toggle-btn:active:not(.active) {
    background: #c0c0c0;
  }

  .toggle-btn.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }

  body.teal-bg .toggle-btn.active {
    border-color: #fff;
  }
  /* Viewport display area */
  .viewport-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-left: 1px solid #858585;
    align-self: stretch;
    min-height: calc(100vh - 40px);
    position: relative;
  }

  .viewport-info {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.3;
    color: #333;
    margin-bottom: 12px;
    text-align: center;
    min-height: 2.6em;
    position: relative;
    z-index: 1;
  }

  .viewport-info strong {
    font-weight: 600;
    color: #333;
  }

  /* Device frame */
  .device-frame {
    position: relative;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    box-sizing: content-box;
    border: 2px solid #333;
    transition: width 0.3s ease, height 0.3s ease;
  }

  .device-frame.no-limit {
    border-color: #ccc;
    border-style: dashed;
    background: transparent;
  }

  /* Browser / OS chrome bars */
  .chrome-top {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0 8px;
    position: relative;
  }

  .chrome-top::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    white-space: nowrap;
  }

  .chrome-bottom {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .chrome-bottom::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    text-align: center;
    white-space: nowrap;
  }

  /* Available viewport area */
  .viewport-area {
    background: #0481A0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
    flex: 1;
  }

  /* AP container — floated centered unit */
  .ap-container {
    background: transparent;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .ap-right-column {
    display: flex;
    flex-direction: column;
    width: 767px;
    box-sizing: content-box;
    border: 1px solid #858585;
    margin-right: 26px;
  }

  .ap-header {
    background: #047a99;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .ap-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .ap-body {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  /* Left column for 2-column layout */
  .ap-left-column {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-left: 28px;
    margin-right: 10px;
    transition: width 0.25s ease;
    overflow: hidden;
  }

  .ap-left-toggle {
    background: #3f3f3f;
    display: flex;
    align-items: center;
    position: relative;
    cursor: pointer;
  }

  .ap-left-toggle:hover,
  .ap-left-toggle:focus-visible {
    background: #4a4a4a;
  }

  .ap-left-toggle:active {
    background: #3a3a3a;
  }

  .ap-left-toggle-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    position: absolute;
    left: 181px;
    white-space: nowrap;
  }

  .ap-left-toggle-icon {
    position: absolute;
    right: 20px;
    width: 32px;
    height: 32px;
  }

  .ap-left-toggle-icon-collapsed {
    width: 32px;
    height: 32px;
    margin-top: 5px;
    transform: scaleX(-1);
  }

  .ap-left-toggle-label-collapsed {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    margin-top: 12px;
    white-space: nowrap;
  }

  .ap-left-toggle:focus {
    outline: none;
    box-shadow: inset 0 0 0 2px #005FCC, inset 0 0 0 4px #fff;
  }
  .ap-left-toggle:focus:not(:focus-visible) {
    box-shadow: none;
  }
  .ap-left-toggle:focus-visible {
    outline: none;
    box-shadow: inset 0 0 0 2px #005FCC, inset 0 0 0 4px #fff;
  }

  .ap-left-resources {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .ap-left-resources-header {
    background: #dfdfdf;
    height: 37px;
    padding-left: 20px;
    display: flex;
    align-items: center;
  }

  .ap-left-resources-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #333;
  }

  .ap-left-resources-body {
    flex: 1;
    background: #f4f4f4;
    padding: 25px 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
    overflow: auto;
  }

  .ap-left-resources-body p {
    margin: 0 0 16px 0;
  }

  .ap-left-resources-body p:last-child {
    margin-bottom: 0;
  }

  .ap-left-resources-body ul {
    margin: 0 0 16px 0;
    padding-left: 40px;
  }

  .ap-left-resources-body li {
    margin-bottom: 12px;
  }

  .ap-left-resources-body li:last-child {
    margin-bottom: 0;
  }
  /* Sim title bar */
  .sim-title-bar {
    height: 50px;
    background: var(--sim-title-bar-bg, #fff);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px 0 20px;
    flex-shrink: 0;
    position: relative;
  }

  .sim-title-bar::after {
    content: "";
    position: absolute;
    bottom: calc(-1 * var(--sim-title-accent, 0px));
    left: 0;
    right: 0;
    height: var(--sim-title-accent, 0px);
    background: inherit;
  }

  .sim-title-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sim-title-name {
    font-family: 'Lato', sans-serif;
    font-size: 24px;
    line-height: 1;
    font-weight: 700;
    color: var(--sim-title-text, #333);
    margin: 0;
    font-synthesis: none;
    display: flex;
    align-items: center;
    height: 28px;
  }

  .sim-title-desc {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    color: var(--sim-title-desc, #333);
  }

  .sim-title-right {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .sim-title-logo {
    display: block;
  }

  .sim-info-btn {
    margin-left: 5px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    font-weight: 700;
    padding: 3px 12px 3px 8px;
    height: 34px;
    box-sizing: border-box;
    border: 2px solid var(--sim-about-border, #555);
    border-radius: 6px;
    background: var(--sim-surface, #fff);
    color: var(--sim-about-text, #333);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .sim-info-btn::after {
    content: "";
    position: absolute;
    top: -7px;
    left: 0;
    right: 0;
    bottom: -7px;
  }

  .sim-info-btn.compact-hit::after {
    top: 0;
    bottom: 0;
  }

  .sim-info-btn svg {
    width: 24px;
    height: 24px;
    pointer-events: none;
  }

  .sim-info-btn:hover,
  .sim-info-btn:focus-visible {
    background: var(--sim-btn-hover, #f0f0f0);
  }

  .sim-info-btn:active {
    background: var(--sim-btn-active, #d0d0d0);
  }

  .sim-info-btn:focus {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }
  .sim-info-btn:focus:not(:focus-visible) {
    outline: none;
  }
  .sim-info-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }

  /* Info modal */
  .info-modal {
    position: absolute;
    top: 50px;
    right: 10px;
    width: 400px;
    max-height: 70%;
    background: #fff;
    border: 2px solid var(--sim-about-border, #555);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    z-index: 101;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .info-modal-header {
    display: flex;
    align-items: center;
    padding: 3px 3px 3px 12px;
    height: 52px;
    box-sizing: border-box;
    border-bottom: 1px solid var(--sim-modal-border, #555);
    cursor: grab;
    flex-shrink: 0;
    user-select: none;
    touch-action: none;
    background: var(--sim-surface, #fff);
  }

  .info-modal-header:active {
    cursor: grabbing;
  }

  .info-modal-header-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    margin-right: 10px;
  }

  .info-modal-header-title {
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #333;
    flex: 1;
    margin: 0;
  }

  .info-modal-close {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--sim-surface, #fff);
    border: none;
    cursor: pointer;
    border-radius: 4px;
    padding: 0;
    flex-shrink: 0;
    transition: background-color 0.15s ease;
  }

  .info-modal-close:hover,
  .info-modal-close:focus-visible {
    background: var(--sim-btn-hover, #f0f0f0);
  }

  .info-modal-close:active {
    background: var(--sim-btn-active, #d0d0d0);
  }

  .info-modal-close:focus {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }
  .info-modal-close:focus:not(:focus-visible) {
    outline: none;
  }
  .info-modal-close:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }

  .info-modal-close svg {
    width: 24px;
    height: 24px;
  }

  .info-modal-body {
    padding: 16px 20px 20px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 22px;
    color: #333;
    user-select: text;
  }

  .info-modal-body-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .info-modal-body:focus {
    outline: none;
  }
  .info-modal-body:focus-visible {
    outline: 2px solid transparent;
  }

  .info-modal-body-wrap .scroll-focus-ring {
    border-radius: 0 0 6px 6px;
  }

  .info-modal-body:focus ~ .scroll-focus-ring {
    display: block;
  }
  .info-modal-body:focus:not(:focus-visible) ~ .scroll-focus-ring {
    display: none;
  }
  .info-modal-body:focus-visible ~ .scroll-focus-ring {
    display: block;
  }

  .info-modal-body h3 {
    font-size: 16px;
    font-weight: 700;
    margin: 16px 0 6px;
    color: #333;
  }

  .info-modal-body h3:first-child {
    margin-top: 0;
  }

  .info-modal-body p {
    margin: 0 0 12px;
  }

  .info-modal-body ul,
  .info-modal-body ol {
    margin: 0 0 12px;
    padding-left: 20px;
  }

  .info-modal-body li {
    margin-bottom: 4px;
  }

  /* Question containers below sim content */
  .question-row {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    padding: 0 27px;
    width: 100%;
    box-sizing: border-box;
  }

  .question-container {
    width: 517px;
    display: flex;
    flex-direction: column;
    border: 1px solid #858585;
    box-sizing: content-box;
  }

  .question-header {
    background: #047a99;
    height: 36px;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .question-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .question-body {
    background: #fff;
    flex: 1;
    min-height: 200px;
    padding: 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
  }

  .question-input {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 16px;
    height: 200px;
    margin-top: 10px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-style: italic;
    color: #767676;
    line-height: 1.5;
  }
  .content-area.standalone {
    border: 2px solid var(--sim-panel-border, #555);
    border-radius: 10px;
    box-sizing: content-box;
    overflow: hidden;
  }

  /* Content area */
  .content-area {
    font-family: 'Lato', sans-serif;
    background: var(--sim-content-bg, #fff);
    position: relative;
    flex-shrink: 0;
    transition: width 0.25s ease;
    display: flex;
    flex-direction: column;
    user-select: none;
    overflow: hidden;
  }

  /* Sim content containers */
  .sim-content {
    display: flex;
    gap: 10px;
    padding: 0 10px 10px 10px;
    flex: 1;
    min-height: 0;
  }


  .sim-info-btn svg,
  .info-modal-close svg,
  .info-modal-header-icon {
    color: var(--sim-icon-color, #000);
  }

  #demo-site-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  /* Demo Site entry point is hidden for now. The demo view itself is untouched —
     buildDemoView() / exitDemoView() still work. Delete this one rule to bring it back. */
  #demo-site-divider,
  #demo-site-btn {
    display: none;
  }

  /* ============================================================
     Neural Net Maker interactives
     Signed values are orange-positive / blue-negative throughout.
     ============================================================ */
  .sim-content {
    --nnm-pos: #D9722E;
    --nnm-pos-soft: #FAE6D6;
    --nnm-neg: #3A72BE;
    --nnm-neg-soft: #DCE7F7;
    --nnm-ink: #1E242C;
    --nnm-ink-2: #58616F;
    --nnm-ink-3: #6A727C;
    /* The ink for UNSIGNED graphics — histogram bars, the column headings' split
       bars. Neutral by design: orange and blue mean a signed value everywhere in
       this piece and a count has no sign. A purple cast at 12% saturation rather
       than a dead grey; 1B's loadings ramp runs 45-52%, so this cannot be read as
       that scale. Its own value, not --nnm-ink-3, which is quiet TEXT in half a
       dozen places that should stay as they are. */
    --nnm-count: #766581;
    /* One number for the attribute icon, so the placeholder and everything sized
       against it cannot drift apart. */
    --nnm-attr-ico: 24px;
    --nnm-rule: #CCD3DD;
    --nnm-rule-soft: #E4E9F0;
    --nnm-surface: #F4F6FA;
    --nnm-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  .nnm-stack { display: flex; flex-direction: column; width: 100%; min-height: 0; flex: 1; padding-top: 9px; }
  .nnm { display: flex; gap: 10px; width: 100%; min-height: 0; flex: 1; }

  /* --- shared query filter --- */
  /* The filter and the About button share one row. The filter takes what is left
     after the button, so adding About costs the row no height — which is why it
     lives here rather than in a 50px title bar above the whole interactive. */
  .nnm-filterrow { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .nnm-filterwrap { position: relative; flex: 1; min-width: 0; }
  /* Deliberately NOT a second round mini-button beside the "?" inside the bar.
     That one explains the search box; this one explains the interactive, and two
     22px circles 30px apart would read as a pair with one meaning. Squared off at
     the height of the bar, with a drawn icon and a word, it reads as a peer of the
     step buttons instead — which is what it is. */
  .nnm-about-btn {
    height: 36px;
    box-sizing: border-box;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 10px;
    border: 2px solid var(--nnm-rule);
    border-radius: 5px;
    background: #fff;
    color: var(--nnm-ink-2);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .nnm-blankhead { display: flex; justify-content: flex-end; height: 36px; flex-shrink: 0; }
  .nnm-about-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .nnm-about-btn:hover { background: var(--nnm-surface); }
  /* Same press-is-the-answer rule as every other button here. */
  .nnm-about-btn:active,
  .nnm-about-btn.on { background: var(--nnm-ink); border-color: var(--nnm-ink); color: #fff; }
  .nnm-about-btn:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .nnm-filterbar {
    display: flex;
    align-items: center;
    gap: 9px;
    background: #fff;
    border: 2px solid var(--nnm-rule);
    border-radius: 7px;
    padding: 0 8px 0 12px;
    height: 36px;
    box-sizing: border-box;
  }
  .nnm-filterbar.bad { border-color: #C0503E; }
  .nnm-filter-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    /* ink-2, not ink-3: at 3.4:1 this failed AA, and it is the word that says what
       the box beside it does. Shared by every interactive's filter bar. */
    color: var(--nnm-ink-2);
    flex-shrink: 0;
  }
  .nnm-filter-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--nnm-mono);
    font-size: 13px;
    color: var(--nnm-ink);
    padding: 3px 0;
  }
  .nnm-filter-input::placeholder { color: #A6AEBA; }
  .nnm-filter-input:focus-visible { outline: none; }
  .nnm-filterbar:focus-within { border-color: var(--nnm-neg); box-shadow: 0 0 0 2px var(--nnm-neg-soft); }
  .nnm-filter-count {
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--nnm-mono);
    font-size: 11.5px;
    /* ink-2 with the label beside it: at 3.4:1 this failed AA, and it is the one
       number in the bar a student acts on — how many the query matched. */
    color: var(--nnm-ink-2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .nnm-filter-count.err { color: #C0503E; }
  .nnm-filter-help {
    width: 22px; height: 22px;
    flex-shrink: 0;
    /* Same 2px rule the buttons carry. border-box keeps it 22px across — without
       it the thicker border would push it to 24 and unbalance the filter bar. */
    box-sizing: border-box;
    border: 2px solid var(--nnm-rule);
    border-radius: 50%;
    background: #fff;
    color: var(--nnm-ink-2);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .nnm-filter-help:hover { background: var(--nnm-surface); }
  .nnm-filter-help:active {
    background: var(--nnm-ink); border-color: var(--nnm-ink); color: #fff;
  }
  .nnm-filter-help:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .nnm-filter-helpbox {
    position: absolute;
    z-index: 20;
    top: calc(100% + 5px);
    right: 0;
    width: min(430px, 100%);
    background: #fff;
    border: 1px solid var(--nnm-rule);
    border-radius: 7px;
    box-shadow: 0 6px 20px -8px rgba(30,36,44,0.35);
    padding: 11px 13px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--nnm-ink-2);
    max-height: 300px;
    overflow: auto;
  }
  .nnm-filter-helpbox b {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--nnm-ink-3);
    margin: 8px 0 4px;
  }
  .nnm-filter-helpbox b:first-child { margin-top: 0; }
  .nnm-filter-helpbox ul { margin: 0; padding-left: 17px; }
  .nnm-filter-helpbox li { margin-bottom: 3px; }
  .nnm-filter-helpbox code,
  .nnm-fieldlist code {
    font-family: var(--nnm-mono);
    font-size: 11.5px;
    background: var(--nnm-surface);
    border: 1px solid var(--nnm-rule-soft);
    border-radius: 3px;
    padding: 0 4px;
    white-space: nowrap;
  }
  .nnm-fieldlist { display: flex; flex-wrap: wrap; gap: 4px; }
  /* A class-level `display` beats the UA rule for [hidden], so state it back. */
  .nnm-empty[hidden] { display: none; }
  .nnm-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--nnm-ink-3);
    font-size: 15px;
  }
  .nnm-panel {
    background: #fff;
    border: 1px solid var(--nnm-rule);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .nnm-panel-head {
    min-height: 44px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    padding: 9px 14px 8px;
    border-bottom: 1px solid var(--nnm-rule-soft);
    background: var(--nnm-surface);
    border-radius: 7px 7px 0 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .nnm-panel-body { padding: 12px 14px; overflow: auto; min-height: 0; flex: 1; }
  /* The two scrolling panels give up their right padding so the scroll container
     reaches the card edge and its bar rides there rather than floating 14px in.
     The inset moves onto the scrolling content itself, which keeps text off the
     bar without pulling the bar inwards. */
  .nnm-readings .nnm-panel-body,
  .nnm-flowpanel .nnm-panel-body { padding-right: 0; }
  .nnm-readhead { padding-right: 14px; }
  /* Exactly .nnm-flowbodywrap's box, so the two scrollers — and so the two
     scrollbars — start and end on the same lines. The 5/6px inset with matching
     negative margin buys focus-ring room without displacing anything. */
  .nnm-readscroll { padding: 5px 14px 5px 6px; margin: -5px 0 -5px -6px; }
  .nnm-readings, .nnm-flowpanel { --nnm-row-gap: 30px; }

  /* --- case navigator --- */
  .nnm-nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .nnm-navbtn {
    width: 36px; height: 36px;
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--nnm-rule);
    background: #fff;
    border-radius: 5px;
    cursor: pointer;
    color: var(--nnm-ink-2);
    padding: 0;
  }
  /* Drawn rather than typed. The ◀ ▶ characters carry their own side bearings and
     baseline offset, so they sit off-centre in the button by an amount that
     depends on the font — a symmetric viewBox centres exactly and always. */
  .nnm-navbtn svg { width: 19px; height: 19px; display: block; }
  .nnm-navbtn:hover:not([aria-disabled="true"]) { background: var(--nnm-surface); }
  /* Same press as the step buttons: the dark fill, no nudge. The glyph is drawn
     in currentColor, so it turns white with the rest of the button. */
  .nnm-navbtn:active:not([aria-disabled="true"]) {
    background: var(--nnm-ink); border-color: var(--nnm-ink); color: #fff;
  }
  .nnm-navbtn:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .nnm-navbtn[aria-disabled="true"] { opacity: 0.35; cursor: default; }
  .nnm-count {
    font-family: var(--nnm-mono);
    font-size: 11.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    text-transform: none;
    letter-spacing: 0;
  }

  /* --- alien conversation --- */
  .nnm-alien {
    font-family: var(--nnm-mono);
    font-size: 14px;
    line-height: 1.85;
    color: var(--nnm-ink);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .nnm-caseid {
    font-family: var(--nnm-mono);
    font-size: 11px;
    color: var(--nnm-ink-3);
    text-transform: none;
    letter-spacing: 0;
  }
  .nnm-decidewrap {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex-shrink: 0;
  }
  .nnm-deciderow { position: relative; display: flex; align-items: stretch; }
  /* Sits under the sum and the outcome it is being compared against, in a narrow
     column, so the two facts stack rather than running side by side. */
  /* Out of the flow, like the sum's caption before it. Left in, the wrapper
     centres the sum row plus these labels as one group, which lifts the sum
     half the labels' height above the centre of the three pathways. */
  /* Anchored on the right so the two rows line up with each other rather than
     ragging out from a shared left edge — the values are what is being compared,
     and they are the last thing on each line. */
  .nnm-labels {
    position: absolute;
    top: calc(100% + 16px);
    right: 6px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .nnm-labels .nnm-label-row { justify-content: flex-end; }
  /* In the narrow layout the labels rejoin the flow, so the row must wrap or they
     sit alongside the sum and push the panel wide. */
  .nnm-flowbody.narrow .nnm-deciderow { flex-wrap: wrap; }
  .nnm-flowbody.narrow .nnm-labels {
    position: static;
    width: 100%;
    margin-top: 12px;
    padding-left: 0;
  }
  .nnm-label-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--nnm-ink-2);
  }
  .nnm-label-row b {
    font-weight: 400;
    color: var(--nnm-ink-3);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .nnm-pill {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 9px;
    border-radius: 11px;
    border: 1px solid currentColor;
  }
  .nnm-pill.approach { color: var(--nnm-pos); background: var(--nnm-pos-soft); }
  .nnm-pill.wait { color: var(--nnm-neg); background: var(--nnm-neg-soft); }
  .nnm-flag {
    font-size: 12px;
    font-weight: 700;
    color: #A03A2B;
    background: #FBE3DF;
    border-radius: 4px;
    padding: 1px 6px;
  }

  .nnm-tok {
    border-radius: 3px;
    padding: 1px 2px;
    margin: 0 -1px;
    /* The scan rule is an inset shadow, not an outline or a border. An outline is
       drawn outside the box, so adjacent words' outlines overlapped in the ~3.6px
       of a space; a border would reflow the sentence as each word gained one.
       Inset draws within the padding, so words can sit as tight as they like. */
    box-shadow: inset 0 0 0 0 transparent;
    transition: background-color 0.22s ease, color 0.22s ease, box-shadow 0.18s ease;
  }
  .nnm-tok.scanning { box-shadow: inset 0 0 0 1.5px var(--nnm-ink); }
  /* A scored word carries its colour but does not show it until it is lit —
     the Words step lights them one at a time, in sentence order. */
  .nnm-tok.scored.lit {
    background: var(--tok-bg);
    color: var(--tok-fg);
  }
  /* Clones that travel from the reading into the activation cell they feed.
     Fixed to the body so they are not clipped by either panel. */
  /* The travelling chip carries the word and the score it is about to add. */
  .nnm-fly {
    position: absolute; left: 0; top: 0;
    z-index: 9999;
    pointer-events: none;
    border-radius: 4px;
    padding: 2px 6px;
    white-space: nowrap;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    box-shadow: 0 2px 8px -2px rgba(30,36,44,0.4);
    will-change: transform, opacity;
  }
  /* A small kick each time the running total takes on another word. */
  .nnm-tick { animation: nnm-tick 0.26s ease-out; }
  @keyframes nnm-tick {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.09); }
    100% { transform: scale(1); }
  }
  .nnm-scale {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
    font-family: var(--nnm-mono);
    font-size: 10.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .nnm-scale-bar {
    flex: 1;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(to right, var(--nnm-neg), #fff, var(--nnm-pos));
    border: 1px solid var(--nnm-rule-soft);
  }
  .nnm-reading {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    margin-bottom: 7px;
    flex-shrink: 0;
  }
  .nnm-reading b { color: var(--nnm-ink); font-weight: 600; }

  /* --- left: three readings in one card, per the sketch --- */
  /* 470 tipped the flow into its stacked fallback at AP Full Width: the flow needs
     ~556px and the row only has ~1014 to share. 440 leaves the flow enough. */
  /* Two columns, each a toolbar over a card: find over the conversation,
     the steps over the pathways. Both toolbars are the same height so the
     two panels start on the same line. */
  .nnm-rightcol {
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex: 1 1 560px;
    min-width: 318px;
    min-height: 0;
  }
  /* No card behind these — just the buttons. The 36px height stays so the panel
     below still starts level with the conversation panel. */
  .nnm-steprow {
    position: relative;
    display: flex;
    align-items: center;
    height: 36px;
    box-sizing: border-box;
    flex-shrink: 0;
  }
  /* Left-aligned on the flow panel's own left edge: .nnm-steprow is a sibling of
     the panel inside .nnm-rightcol and neither carries padding, so flex-start
     puts the first button flush with the card below it. */
  .nnm-stepgroup {
    /* Sized to its five buttons rather than to the row, so the free space to the
       right of them is the rule's to centre in. */
    flex: 0 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 6px;
  }
  /* The divider between the five steps and About. `margin: 0 auto` makes it take
     an equal share of the row's free space on each side, which centres it in the
     gap at any panel width and pushes About flush to the right edge without
     taking it out of the flow. At widths where there is no free space the margins
     collapse and it simply sits between the two, which is the right degradation.
     2px and --nnm-rule: the same line the buttons are drawn with. */
  .nnm-steprule {
    width: 2px;
    height: 36px;
    margin: 0 auto;
    flex-shrink: 0;
    background: var(--nnm-rule);
  }
  .nnm-leftcol {
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex: 1 1 440px;
    min-width: 236px;
    min-height: 0;
  }
  .nnm-readings { flex: 1; min-height: 0; }
  .nnm-readhead {
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    line-height: 1.25;
    color: var(--nnm-ink-2);
    min-height: 30px;          /* at least .nnm-flowhead's two-line captions */
    display: flex;
    align-items: flex-end;
    margin-bottom: 28px;
    flex-shrink: 0;
  }
  .nnm-readscroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-gutter: stable;
    display: flex;
    flex-direction: column;
    /* gap comes from --nnm-row-gap, shared with .nnm-frows */
  }
  .nnm-read { border-radius: 5px; padding: 0 5px; box-sizing: border-box; }
  /* Words carry a tooltip once Activate has run — its value here, or where it
     counts instead. Before that there is nothing to tell, so no help cursor. */
  .nnm-read-text .nnm-tok[title] { cursor: help; }
  .nnm-read-name {
    font-family: 'Lato', sans-serif;
    font-size: 12.5px;
    color: var(--nnm-ink-2);
    padding-bottom: 4px;
    border-bottom: 1px solid #B9CBE4;
    margin-bottom: 5px;
  }
  /* The one being read right now. Three sentences scan and fly in turn and
     nothing else says which is which — the highlighting is the thing you are
     already watching, so it cannot also be the thing that tells you where to
     look. The name is left-aligned in a block of its own, so the weight change
     reflows nothing. */
  .nnm-read-name.reading {
    font-weight: 700;
    color: var(--nnm-ink);
    border-bottom-color: var(--nnm-ink-3);
  }
  /* Label over the ramp, both filling the caption band. No "Scale" in the name —
     the gradient is visibly one; the legend names the quantity, not the widget. */
  .nnm-legend { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .nnm-legend-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--nnm-ink-3);
    line-height: 1.1;
  }
  .nnm-readhead .nnm-read-scale { margin-bottom: 0; font-size: 12px; }
  .nnm-readhead .nnm-read-scale .grad { height: 12px; border-radius: 3px; }
  .nnm-read-scale {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--nnm-mono);
    font-size: 9.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }
  .nnm-read-scale .grad {
    flex: 1;
    height: 9px;
    border-radius: 2px;
    background: linear-gradient(to right, #1F4E8F, #C8D6E9, #FFFFFF, #EFD3C4, #A84A2C);
    /* Same hairline the correlation key carries. The ramp passes through white at
       zero, so without it the middle of the bar dissolves into the panel and the
       scale looks like two separate swatches. */
    box-shadow: inset 0 0 0 1px rgba(30,36,44,0.18);
  }
  .nnm-read-text {
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    line-height: 1.85;
    color: var(--nnm-ink);
    word-break: break-word;
  }

  /* --- right: the flow diagram --- */
  .nnm-flowpanel { flex: 1; min-height: 0; }
  .nnm-flowouter { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  /* min-height:0 is required — without it a flex child refuses to shrink below its
     content and overflow-y:auto never engages, so the bar escaped the card. */
  .nnm-flowbodywrap {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    min-height: 0;
    flex: 1;
    scrollbar-gutter: stable;
    padding: 5px 14px 5px 6px;
    margin: -5px 0 -5px -6px;
  }
  .nnm-flowhead { padding-right: 14px; box-sizing: border-box; }
  /* Outside the scroller, exactly as the legend is on the readings side, so both
     scrollbars span the same band and neither heading moves. Both scrollers now
     hold only their rows, so the sync — which copies scrollTop straight across —
     still lines them up row for row. */
  .nnm-flowhead {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 0;
    height: 30px;
    /* Matches .nnm-readhead's. alignTops only controls this element's height, and
       the captions are pinned to its bottom edge, so that space opens above them —
       the gap below has to be set here to stay in step with the legend's. */
    margin-bottom: 28px;
    flex-shrink: 0;
    box-sizing: content-box;
  }
  /* Positioned against measured centres rather than flex order. */
  .nnm-flowhead .c.far {
    position: absolute;
    bottom: 0;
    transform: translateX(-50%);
    width: auto;
    white-space: nowrap;
  }
  /* Two words, two lines: kept to the width of a cell so it breaks rather than
     reaching for the panel edge, which it was 13px short of on one line. */
  .nnm-flowhead .c.far.dec {
    white-space: normal;
    width: 82px;
  }
  .nnm-flowhead .c {
    width: 82px;
    flex-shrink: 0;
    text-align: center;
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    line-height: 1.25;
    color: var(--nnm-ink-2);
  }
  .nnm-flowhead .g { width: 30px; flex-shrink: 0; }
  .nnm-flowbody { display: flex; align-items: stretch; flex-shrink: 0; min-width: 0; }
  /* Both columns must use the SAME gap or they drift: syncRows matches each pair's
     height and alignTops pins the first pair, so a difference in gap accumulates
     down the rows and only shows from row 2 onwards. One value, used by both.
     20px is the floor — the number hangs 18px below its cell — and the rest is air. */
  .nnm-readscroll, .nnm-frows { gap: var(--nnm-row-gap); }
  .nnm-frows { display: flex; flex-direction: column; flex-shrink: 0; }
  .nnm-frow { display: flex; align-items: center; gap: 0; border-radius: 5px; box-sizing: border-box; }


  /* ---- 1A Trace a Case ---- */
  .d1a-toolbar { margin-bottom: 9px; }
  .d1a-toolbar .d3-filter { flex: 0 1 447px; }
  .d1a-toolbar .nnm-about-btn { margin-left: auto; }
  .d1a-panel { flex: 1; min-height: 0; }
  /* The conversation is the smaller half: the network is the thing being read.
     Scoped under .nnm to outrank .d3b-col's `flex: 1 1 0`, which is declared
     further down and otherwise splits the row in half. 447px is the filter's
     width above it, so the card and the filter share one left edge and one right. */
  .nnm .d1a-leftcol { flex: 0 0 447px; }
  .d1a-casebody { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  /* The marks under the notes. Wraps, because the number of them varies with the
     conversation and the panel is 447px wide. */
  /* Nine marks at 34 with 9 between them measure 378. The box that holds them is
     390 inside its own padding — not the 414 of the panel — so 12px of gap wrapped
     the row onto two lines. 9 still clears the badge, which overhangs its mark by
     4px on the right. */
  .d1a-marks {
    display: flex; flex-wrap: nowrap; align-items: stretch;
    justify-content: space-between; flex-shrink: 0; margin-top: 12px;
  }
  /* Label, mark, answer — the order a field sheet reads in. The cell is wider than
     the 34px mark so a two-word label has somewhere to wrap to; the mark stays 34
     and centres in it. */
  /* All nine on one line, so the cells share the width rather than claiming a fixed
     one: `flex: 1 1 0` gives each of them an equal ninth of whatever the notes box
     is, and the label wraps inside that. break-word because "Resource" on its own is
     wider than a ninth and would otherwise push the row out. */
  /* The cell is the MARK's width, not an equal share of the row, so the first mark
     starts on the text's own left edge and the last ends on its right one. The slack
     goes into the gaps instead, spread by space-between. With equal shares the marks
     were centred in cells wider than themselves and every one sat ~3px inboard of
     the prose above. */
  .d1a-mark {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    flex: 0 0 34px; color: var(--nnm-ink-2);
  }
  /* The label is centred on its mark and allowed to run wider than it — the slack
     between cells is where it goes. Nothing clips, because the row is the only thing
     on its line. */
  .d1a-mark .lbl {
    /* Barlow Condensed, the piece's own condensed face, so the label can be bigger
       than the 9.5px Lato it replaces and still fit a 34px column: at 12px the
       longest word, "stressed", measures 40 against Lato's 44 at 9.5. */
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px; line-height: 1.12;
    text-align: center; color: var(--nnm-ink-3);
    width: 42px; margin-left: -4px; margin-right: -4px;
  }
  /* Pushes the mark and its box to the bottom of a cell whose label ran to a
     different number of lines, so every mark and every box shares a baseline
     across the row however the words fell. */
  .d1a-mark .lbl { margin-bottom: auto; }
  .d1a-mark svg { display: block; }
  /* A box on a field sheet: hairline and paper-white, drawn rather than offered.
     No cursor change and no hover — it sits inside the notes, which are a document
     and not a control panel, so nothing invites a click it would not answer. */
  .d1a-mark b {
    display: flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 3px;
    border: 1px solid var(--nnm-rule); background: #fff;
    font-family: 'Lato', sans-serif; font-size: 12px; font-weight: 700;
    line-height: 1; color: var(--nnm-ink);
  }
  /* Empty. Left declared so the state is named in the stylesheet rather than being
     an accident of an empty string. */
  .d1a-mark b.no { color: transparent; }
  .d1a-text { flex-shrink: 0; margin-bottom: 10px; }
  .d1a-casebody .d1a-notes { flex: 1 1 auto; min-height: 70px; overflow-y: auto; }
  .d1a-labelrow { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-bottom: 10px; }
  .d1a-labelcap {
    font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--nnm-ink-2);
  }
  .d1a-label {
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 2px 9px; border-radius: 999px; border: 2px solid;
  }
  .d1a-label.app { color: #A15522; border-color: var(--nnm-pos); background: var(--nnm-pos-soft); }
  /* The text is a shade darker than --nnm-neg: the blue on its own soft ground came
     to 3.88:1 at 13px, and this is the least that clears AA. The border stays the
     token, so the chip still reads as the same blue. */
  .d1a-label.wait { color: #3568AD; border-color: var(--nnm-neg); background: var(--nnm-neg-soft); }

  .d1a-panel .nnm-nav { margin-left: 8px; }
  /* Both heads to the taller one's height, so the two panel bodies start on the
     same line. The Conversation head is 54 because it carries the 36px nav buttons
     (36 + 9 + 8 of padding + 1 of border); The Network head holds only a title and
     the scale, so it was sitting at the 44px floor and its body began 10px higher. */
  .d1a-panel .nnm-panel-head { min-height: 54px; }

  /* The column captions sit 10px under the header rule, so the body gives up
     most of its top padding and the SVG carries the rest. */
  /* The drawing keeps the width it has when the conversation panel is beside it,
     and centres in whatever it is given. Without this the solo screen did not make
     the diagram bigger, it made it WIDER — the same neurons with the four columns
     pulled 457px further apart and the edges stretched to reach. Capping the body
     rather than the svg keeps the readout underneath on the same measure, so the
     two stay one block. 565 is the PANEL's width beside the conversation card, not
     the drawing's — the body carries 14px of padding each side, so capping at the
     drawing's own 537 came out 28 short. A no-op on Trace a Case, which is 565. */
  .d1a-netbody { display: flex; flex-direction: column; min-height: 0; padding-top: 2px; }
  /* `flex: 1 1 0`, not `auto`: the host's height has to come from the row it is in
     and NOT from the SVG inside it, or measuring the host to size the SVG would
     feed back into the host and never settle. */
  /* The drawing keeps the width it has when the conversation panel is beside it,
     and centres in whatever it is given. Without this the solo screen did not make
     the diagram bigger, it made it WIDER — the same neurons with the four columns
     pulled 457px apart and the edges stretched to reach. The cap is on the drawing
     alone, so the readout below still runs the full width of the panel. A no-op on
     Trace a Case, where the host is 537 already. */
  .d1a-svghost {
    flex: 1 1 0; min-height: 0;
    width: 100%; max-width: 537px; margin-left: auto; margin-right: auto;
  }
  .d1a-net { display: block; overflow: visible; }
  /* Off-layout, but rendered: getComputedTextLength needs a laid-out element, and
     `visibility: hidden` keeps that while `display: none` would not. */
  .d1a-meas {
    position: absolute; width: 0; height: 0; overflow: visible;
    visibility: hidden; pointer-events: none;
  }
  /* The steps sit in the toolbar row, between the query and About. About keeps its
     margin-left:auto, so it stays hard right whatever the group in front of it. */
  .d1a-steps { display: flex; gap: 6px; }
  /* Extract Pathways and its Reset sit between the find bar and About, centred in
     whatever room those two leave. True centring on the toolbar would have run the
     pair under the find bar's right edge. */
  .d1a-exrow { margin: 0 auto; }
  .d1a-tools-right {
    position: relative; flex: 1 1 0; min-width: 0;
    display: flex; align-items: center;
  }
  .d1a-tools-right .nnm-about-btn { position: absolute; right: 0; margin-left: 0; }
  /* One word of the conversation. Inline so it wraps with the text, and it has to
     be a box of its own so a flight can be aimed at where it actually sits. */
  .d1a-word { display: inline-block; }
  /* A word in flight is a copy — the original stays put, at full strength. Dimming
     it while its copy travelled only made the sentence flicker for the whole run. */
  /* A word in flight is two elements, because its two axes travel on different
     schedules: the wrapper carries the HORIZONTAL move and the chip inside it the
     VERTICAL one. One transform cannot hold two easings, and that difference is the
     whole shape — the word drops to the unit's height first, then sweeps across into
     it, arriving from the side rather than aiming diagonally at it from the start. */
  .d1a-flywrap { position: absolute; z-index: 60; will-change: transform; }
  .d1a-flyy { will-change: transform; }
  .d1a-fly {
    position: relative; pointer-events: none; white-space: nowrap;
    font-family: 'Lato', sans-serif; font-size: 12.5px; line-height: 1;
    color: var(--nnm-ink); background: #fff;
    border: 1px solid var(--nnm-rule); border-radius: 4px; padding: 2px 5px;
    box-shadow: 0 2px 8px -3px rgba(30,36,44,0.45);
    will-change: transform, opacity;
  }
  @media (prefers-reduced-motion: reduce) { .d1a-node { transition: none; } }

  /* The key sits in the card head, where the Correlations key's label sits. */
  /* Type and bar height are the Prediction Chain's, so the two screens name their
     scales at the same size: .nnm-legend-label's 14px/600/0.05em, and the 12px bar
     .nnm-readhead gives .nnm-read-scale, and its 3px radius — so this is the Chain's
     squarer bar now, not the pill it was. Colour stays --nnm-ink-2: this sits in a panel head
     next to the title, not above a reading, so it is a shade darker than the
     Chain's --nnm-ink-3. */
  .d1a-scale {
    margin-left: auto; display: flex; align-items: center; gap: 6px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--nnm-ink-2);
  }
  /* Miniature neurons, not colour chips: a circle at the node's own size, filled
     from the middle the way the diagram fills them — orange upward for positive,
     blue downward for negative. The key is then a sample of the encoding itself
     rather than of two colours, and it shows the direction as well as the hue,
     which is the half of the rule a flat swatch could not carry. The hard stop at
     50% is the centre line every gauge grows from. */
  .d1a-scale .sw {
    /* 24px — the diameter the diagram actually draws a neuron at (r = 12), so the
       key is the same object at the same size rather than a shrunken echo of it. */
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    box-shadow: inset 0 0 0 1px #6E7580;          /* the node's own outline */
  }
  .d1a-scale .sw.pos { background: linear-gradient(to bottom, #A84A2C 50%, #FFFFFF 50%); }
  .d1a-scale .sw.neg { background: linear-gradient(to bottom, #FFFFFF 50%, #1F4E8F 50%); }
  /* The sign sits right after its swatch, so the pairs do not drift apart. */
  .d1a-scale .lo { margin-right: 4px; }
  /* #CCD3DD measured 1.51:1 on white — these lines ARE the wiring, so they are
     graphics required to understand the content and 3:1 applies. A plain grey
     rather than the blue-grey the rules use, since these are not rules. #909090 is
     3.19:1; #949494 was the other candidate and is the lightest neutral grey that
     reaches 3:1 at all (3.033:1), which leaves nothing for a ground that is ever
     less than pure white. Not the thinness: even the 2px edges only ever reached
     their nominal colour, so the colour was the whole fix. */
  /* The three pathways, once extracted. Boxes rather than circles: a pathway is a
     grouping over neurons, not another neuron, and it should not look like one. */
  .d1a-pathbox { fill: #FFFFFF; stroke: var(--nnm-ink-2); stroke-width: 2; }
  /* Which units make which pathway. Slide 17 gives loadings a ramp of their own —
     purple positive, yellow negative — so a loading can never be mistaken for an
     activation, and the pathway's own square stays on the orange/blue activation
     ramp beside it.

     Two colours, not the slide's five steps. As a filled heatmap cell the pale end
     of each ramp is readable; as a 0.6px line it is not — against white the purple
     ramp passes 3:1 only at its top two steps (7.33 and 3.68) and the yellow ramp
     fails at every step, its darkest at 1.97. So sign is the hue and magnitude is
     the width, which is what the neurons already do. The yellow is slide 17's own
     #F9A825 darkened along its hue until it clears 4.5:1. */
  /* A loading, drawn as a bar beside the thing it belongs to: length is the
     magnitude on one scale across the whole matrix, direction and hue the sign.
     Purple positive, yellow negative, per the deck — so a loading can never be
     mistaken for an activation, which is orange and blue two inches away. The
     yellow is the deck's own #F9A825 darkened along its hue until it clears
     4.5:1 against white; at this size the pale end of the deck's five-step ramp
     is invisible. */
  .d1a-loadbar.pos { fill: #673AB7; }
  .d1a-loadbar.neg { fill: #A76905; }
  .d1a-loadwire { stroke: #909090; stroke-width: 0.5; fill: none; }
  .d1a-loadring { fill: none; stroke: var(--nnm-ink); stroke-width: 2; }
  /* One conversation's neuron, once the fourteen have become one. Same circle the
     network draws, minus the gauge — there is no activation to show at this point,
     only that a conversation went through and came out as one thing. */
  .d1a-convnode { fill: #FFFFFF; stroke: var(--nnm-ink-2); stroke-width: 1.5; }
  /* A neuron in a stacked conversation. Outline only — the white disc and the gauge
     are drawn under it, so the ring is the last thing over both. */
  .d1a-stacknode { fill: none; stroke: var(--nnm-ink-2); stroke-width: 1; }
  /* One name per column, full size — only ever one on screen at a time, so it does
     not have to fit beside its neighbours. It hands over as the next column lands. */
  .d1a-stacklabel {
    font-family: 'Lato', sans-serif; font-size: 14px;
    fill: var(--nnm-ink); pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .d1a-convrow { will-change: transform; }
  /* The edge of the set, once all 800 are in. Hairline and unfilled: it is naming
     the collection, not adding another object to it. */
  .d1a-gridbox {
    fill: var(--nnm-surface); stroke: var(--nnm-ink-3); stroke-width: 1.5;
  }
  .d1a-convnode { cursor: pointer; }
  .d1a-readlayer { pointer-events: none; }
  /* The count that replaces the ten names. */
  .d1a-colhead { font-size: 15px; fill: var(--nnm-ink); }
  /* Names the thing the fourteen have just become. */
  .d1a-mergelabel {
    font-family: 'Lato', sans-serif; font-size: 14px; fill: var(--nnm-ink);
    transition: opacity 0.3s ease; pointer-events: none;
  }
  .d1a-loadtip {
    font-family: 'Lato', sans-serif; font-size: 13px; fill: var(--nnm-ink-2);
    pointer-events: none; transition: opacity 0.2s ease;
  }
  /* Both sides of the matrix are pickable, and both say so. */
  .d1a-pathbox.pick, .d1a-node.pick { cursor: pointer; }
  /* A pathway box is a control too, so it answers a pointer the way the buttons do:
     hover darkens the outline, pressing thickens it to exactly what selecting will
     leave behind. The neurons already do this with their ring — half strength on
     hover, full on select — and this is the same idea in the one property a
     rectangle has to spend. */
  .d1a-pathbox.pick:hover { stroke: var(--nnm-ink); }
  .d1a-pathbox.pick:active { stroke: var(--nnm-ink); stroke-width: 3; }
  .d1a-pathbox.on { stroke: var(--nnm-ink); stroke-width: 3; }
  .d1a-pathbox.pick:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 2px; }
  .d1a-pathlabel {
    font-family: 'Lato', sans-serif; font-size: 13px; fill: var(--nnm-ink);
  }
  /* The permanent wiring. Hairline and pale, drawn under every signal line. */
  /* "× weight", one per gap between columns, sitting on the same band as the
     column captions and over the exact x where every line in that gap changes.
     Starts invisible and fades in when the sweep reaches the multiplier. */
  .d1a-wlabel {
    font-family: 'Lato', sans-serif; font-size: 12px; fill: var(--nnm-ink-2);
    opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
  }
  .d1a-svghost.no-anim .d1a-wlabel { transition: none; }
  .d1a-wire { stroke: #909090; stroke-width: 0.5; }
  .d1a-wire.gone { display: none; }
  .d1a-edge {
    stroke: #909090;
    /* The dim is an opacity now, not a second stroke colour — one colour to reason
       about, and it can fade. 0.18s is enough to read as a transition without
       making 254 lines feel sluggish; the global prefers-reduced-motion rule zeroes
       it. */
    transition: opacity 0.18s ease, stroke 0.18s ease;
  }
  /* Hovering dims everything unrelated rather than brightening what is related:
     the answer to "what is this neuron wired to" should be what is LEFT. */
  /* The unrelated edges fade back rather than changing colour. 0.35 was set when
     every edge was grey #909090, where it composited to about #D9D9D9; against the
     saturated orange and blue the edges carry now it left them clearly visible, so
     the dim was doing much less work than it was tuned for. At 0.2 a full-strength
     line composites to about #EEDCD5 orange / #D2DBE9 blue — lighter than the grey
     edges ever were, so the lit ones carry the picture on their own. */
  /* Dimmed only WITHIN the gaps the read neuron sits between. A gap it has no
     part in is left entirely alone — every line in it at full strength — because
     dimming it would say those lines were candidates that lost, when they are
     simply somewhere else. Driven by a class on the edge rather than by a
     `hovering` class on the diagram, which could only ever dim everything. */
  .d1a-edge.dim { opacity: 0.1; }
  /* Lit in the hovered unit's own colour, set as --lit by applyHover. Near-black is
     the fallback, and it is what a unit sitting at white on the ramp still uses —
     its colour would be invisible. A custom property rather than an inline stroke so
     the step animations, which DO paint the stroke inline while a fan grows, are not
     fighting the highlight for the same declaration. */
  .d1a-net.hovering .d1a-edge.near { opacity: 1; }
  .d1a-node {
    stroke: #6E7580; stroke-width: 1; cursor: pointer;
    /* fill eases between ramp steps as input arrives. Short: at the fast end of
       Step 1 the gap between landings is 30ms, and a long transition would still be
       chasing the previous colour when the next three had already arrived. */
    transition: r 0.12s ease, fill 0.18s ease;
  }
  /* Not yet reached by the animation. It still shows — the shape of the network is
     the point — but it does not answer: no pointer, no hover ring, no readout. */
  .d1a-node.off { cursor: default; }
  /* Restoring a conversation must not animate into place. Every node is built white
     and then painted, so the fill transition turned each return into a visible blink:
     empty circles for a fifth of a second, then colour. Suppressed for the single
     frame the state is applied in, then handed straight back — the transition still
     does its job while the steps are actually running. Pills and edges are in here
     for the same reason: the answer would fade in, and a tinted line would fade out,
     on a screen that is supposed to have simply arrived. */
  .d1a-svghost.no-anim .d1a-node,
  .d1a-svghost.no-anim .d1a-outpill,
  .d1a-svghost.no-anim .d1a-edge { transition: none; }
  /* `outline` on an SVG shape follows the bounding box and ignores border-radius,
     so any ring on a circle comes out square. Both focus states are cleared —
     :focus-visible alone left the box on a mouse click — and the ring is drawn
     as its own circle instead, one per neuron. */
  .d1a-node:focus, .d1a-node:focus-visible { outline: none; }
  /* Two states in one ring. SELECTED is near-black: --nnm-neg means "negative" on
     the signed ramp everywhere else in this piece, so a blue ring round a neuron
     reads as a claim about its value — and near-black matches the lit edges, so a
     selected node and its wiring read as one object. FOCUSED keeps the blue, which
     is the focus colour on every other control here. */
  .d1a-ring {
    fill: none; stroke: var(--nnm-ink); stroke-width: 2;
    pointer-events: none; opacity: 0;
  }
  .d1a-ring.focus { stroke: var(--nnm-neg); }
  /* Three strengths of the same ring. Hover is the lightest — a half-strength
     version of the selected ring, so hovering reads as a preview of clicking
     rather than as a different kind of mark. */
  .d1a-ring.hover { opacity: 0.5; }
  .d1a-ring.on { opacity: 1; }
  /* The selected node used to ALSO get a thicker dark border. Two indicators for
     one state, and they did not agree: the ring was driven by focus, and a click
     focuses an SVG element in Chrome but not reliably in Safari or Firefox — so the
     ring came and went while the border always showed. The ring is the indicator
     now, driven by the selection, and .pinned carries no styling of its own. */
  /* What a click leaves behind. The point of the panel is that it can report the
     number and the wiring and still have nothing to say about the meaning. */
  /* Its height is set from a measurement (see sizeReadout) and does not move when
     the message does. It used to grow with the text, which shortened the diagram,
     which the ResizeObserver answered by redrawing — so the network jumped every
     time you clicked a neuron. */
  .d1a-pin {
    flex-shrink: 0; display: flex; align-items: baseline; gap: 8px;
    margin-top: 8px; padding: 7px 10px; box-sizing: border-box; overflow: hidden;
    background: var(--nnm-surface); border: 1px solid var(--nnm-rule-soft); border-radius: 6px;
    font-family: 'Lato', sans-serif; font-size: 12.5px; line-height: 1.45;
    color: var(--nnm-ink-2);
  }
  .d1a-pin.idle { color: var(--nnm-ink-3); }
  .d1a-pin b { color: var(--nnm-ink); font-weight: 700; }
  .d1a-pin .v { font-family: var(--nnm-mono); color: var(--nnm-ink); }
  /* .nnm-navbtn's box and behaviour — 36x36 is the button size everywhere in this
     piece (nav, Reset, About, the steps). Centred in the readout rather than sitting
     on the first line, since the box is a fixed height and the message is not
     always one line. */
  .d1a-pinclear {
    margin-left: auto; flex-shrink: 0; align-self: center;
    width: 36px; height: 36px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Lato', sans-serif; font-size: 19px; line-height: 1;
    color: var(--nnm-ink-2); background: #fff;
    border: 2px solid var(--nnm-rule); border-radius: 5px; padding: 0;
    cursor: pointer;
  }
  .d1a-pinclear:hover { background: var(--nnm-surface); }
  .d1a-pinclear:active {
    background: var(--nnm-ink); border-color: var(--nnm-ink); color: #fff;
  }
  .d1a-pinclear:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  /* Off-layout twin of the readout, at the same width and type, used to find the
     tallest message this conversation can produce. */
  .d1a-pinmeasure {
    position: absolute; visibility: hidden; pointer-events: none;
    left: -9999px; top: 0; height: auto;
    /* Capped to the drawing's width, not the panel's. The box reserves the height of
       the tallest message this conversation could produce, and that height depends on
       how the text wraps — measured across the full 994 of the solo screen it came
       out 53px against Trace a Case's 71, so the same empty box was two lines shorter
       on one screen than the other. */
    max-width: 537px;
  }
  /* Same type as the Prediction Chain's column captions (.nnm-flowhead .c). */
  .d1a-collabel {
    font-family: 'Lato', sans-serif; font-size: 12px; fill: var(--nnm-ink-2);
  }
  .d1a-inlabel { font-family: 'Lato', sans-serif; font-size: 10.5px; fill: var(--nnm-ink-2); }
  .d1a-outlabel {
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; fill: var(--nnm-ink);
    /* The word paints over the pill it sits in, so without this the pointer LEFT the
       pill the moment it crossed the text — hover died and the click missed, over
       the largest and most obvious part of the target. Events pass through to the
       pill beneath instead of the label growing handlers of its own, so there is
       still one thing listening per outcome. */
    pointer-events: none;
  }
  /* Which outcome the network chose, marked where you are already looking. It used
     to be a sentence under the diagram — and that sentence was the ONLY place on
     screen naming the model's decision, which matters because the chip on the left
     is the HUMAN's label and the two disagree on 64 of the 800. */
  /* The same two-state chip the human's label uses on the left: filled for the one
     the network chose, outline for the one it did not. One shape, one difference. */
  /* The chosen pill stays a little bigger than the one it beat — the size IS the
     answer, held after the moment that announced it. Scaled about its own centre,
     which needs fill-box: an SVG element's transform-origin is the user-space origin
     otherwise, and the pill would fly off to the corner rather than grow in place.
     Only the pill scales; the node and the word inside it hold still, so what reads
     is the pill inflating around them rather than the whole group lurching. */
  .d1a-outpill {
    stroke-width: 2; cursor: pointer; transition: fill 0.35s ease;
    transform-box: fill-box; transform-origin: center;
  }
  /* The size is geometry now, set in the reveal; this is only the moment that
     announces it. So the bounce overshoots and returns to scale(1) — the pill it
     lands on is already the bigger one. */
  @keyframes d1a-pillpop {
    0%   { transform: scale(0.94); }
    45%  { transform: scale(1.10); }
    72%  { transform: scale(0.98); }
    100% { transform: scale(1); }
  }
  .d1a-outpill.won.pop { animation: d1a-pillpop 460ms cubic-bezier(.34,1.1,.5,1) both; }
  @media (prefers-reduced-motion: reduce) {
    .d1a-outpill.won.pop { animation: none; }
  }
  .d1a-outpill.app { stroke: var(--nnm-pos); }
  .d1a-outpill.wait { stroke: var(--nnm-neg); }
  .d1a-outpill.lost { fill: #FFFFFF; }
  .d1a-outpill.won.app { fill: var(--nnm-pos-soft); }
  .d1a-outpill.won.wait { fill: var(--nnm-neg-soft); }
  /* #A15522, not --nnm-pos: the orange is 3.28:1 on white and 2.71:1 on its own
     soft ground, both under the 4.5 this size needs. The blue opposite it was
     darkened for the same reason. Borders and fills keep the tokens — it is only
     the text that has to carry contrast. */
  .d1a-outlabel.app { fill: #A15522; }
  /* #3568AD, not --nnm-neg: the blue on its own soft ground is 3.88:1 at this size,
     and this is the least that clears AA. Same value the chip on the left uses. */
  .d1a-outlabel.wait { fill: #3568AD; }

  /* ---- 1B Extract Pathways ---- */
  .d1b-toolbar { margin-bottom: 9px; }
  .d1b-toolbar .d3-filter { flex: 0 1 447px; }
  .d1b-toolbar .nnm-about-btn { margin-left: auto; }
  .d1b-panel { flex: 1; min-height: 0; }
  .d1b-body { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  .d1b-actcol { flex: 0 0 300px; }
  .d1b-headsub {
    margin-left: auto; font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--nnm-ink-2);
  }
  /* Two keys, because there are two quantities and they must never be read on
     the same scale: activations on the project's orange/blue ramp, loadings on
     the purple/yellow one slide 17 gives them. */
  .d1b-key {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-bottom: 8px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 10.5px;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--nnm-ink-2);
  }
  .d1b-key i { flex: 1; height: 8px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(30,36,44,0.18); }
  .d1b-key i.act { background: linear-gradient(to right, var(--nnm-neg), #fff, var(--nnm-pos)); }
  .d1b-key i.load { background: linear-gradient(to right, #F9A825, #fff, #673AB7); }
  .d1b-loadkey { margin-top: 2px; }

  .d1b-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; flex-shrink: 0; }
  .d1b-dot { display: block; width: 100%; aspect-ratio: 1; border-radius: 50%;
             box-shadow: inset 0 0 0 1px rgba(30,36,44,0.18); }
  .d1b-dot.pickable { cursor: pointer; }
  .d1b-dot.picked { box-shadow: inset 0 0 0 1px rgba(30,36,44,0.18), 0 0 0 2px var(--nnm-ink); }
  .d1b-actgrid { margin-bottom: 10px; }
  .d1b-casetext {
    flex-shrink: 0; font-family: 'Lato', sans-serif; font-size: 11.5px;
    color: var(--nnm-ink-2); line-height: 1.4; margin-bottom: 10px;
  }
  .d1b-extract {
    margin-top: auto; flex-shrink: 0; height: 36px; box-sizing: border-box;
    border: 2px solid var(--nnm-ink); border-radius: 5px; background: var(--nnm-ink);
    color: #fff; cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .d1b-extract:hover:not(:disabled) { background: #2C3541; border-color: #2C3541; }
  .d1b-extract:disabled { opacity: 0.4; cursor: default; }
  .d1b-extract:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 2px; }

  .d1b-pathrow { display: flex; gap: 10px; flex-shrink: 0; align-items: flex-start; }
  .d1b-empty {
    font-family: 'Lato', sans-serif; font-size: 13px; font-style: italic;
    color: var(--nnm-ink-2); padding: 20px 0;
  }
  /* The pathways arrive one after another rather than all at once — the brief
     asks for them to be seen emerging, and a stagger is what makes four grids
     read as an extraction rather than a screen redraw. */
  .d1b-path {
    flex: 1 1 0; min-width: 0; padding: 6px; border-radius: 6px;
    border: 2px solid transparent; cursor: pointer;
    animation: d1b-emerge 0.42s cubic-bezier(.3,0,.3,1) both;
  }
  .d1b-path.on { border-color: var(--nnm-ink); background: var(--nnm-surface); }
  .d1b-path:hover { background: var(--nnm-surface); }
  @keyframes d1b-emerge {
    from { opacity: 0; transform: translateY(10px) scale(0.94); }
    to   { opacity: 1; transform: none; }
  }
  .nnm-nomotion .d1b-path { animation: none; }
  .d1b-pathgrid { gap: 1px; }
  .d1b-pathname {
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--nnm-ink);
    margin-bottom: 5px;
  }
  .d1b-stat {
    margin-top: 5px; font-family: var(--nnm-mono); font-size: 9.5px; line-height: 1.5;
    color: var(--nnm-ink-2); font-variant-numeric: tabular-nums;
  }
  .d1b-loadhead { margin-top: 12px; }
  .d1b-loadwrap { flex: 0 0 auto; }
  .d1b-loadgrid { grid-template-columns: repeat(12, 1fr); max-width: 330px; }

  /* One neuron's loadings: bars out from a zero line, per the sketch under
     "Loadings" in the brief. */
  .d1b-bars { display: flex; flex-direction: column; gap: 4px; max-width: 380px; }
  .d1b-barrow {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 11.5px; color: var(--nnm-ink-2);
  }
  .d1b-barlab { flex: 0 0 68px; }
  .d1b-bartrack { position: relative; flex: 1; height: 10px; border-radius: 2px; background: #EEF1F5; }
  .d1b-bartrack::after {
    content: ""; position: absolute; left: 50%; top: -1px; width: 1px; height: 12px;
    background: var(--nnm-ink-3);
  }
  .d1b-barfill { position: absolute; top: 0; height: 10px; border-radius: 2px; }
  .d1b-barfill.pos { background: #673AB7; }
  .d1b-barfill.neg { background: #F9A825; }
  .d1b-barnum {
    flex: 0 0 52px; text-align: right; font-style: normal;
    font-family: var(--nnm-mono); font-size: 10px; color: var(--nnm-ink-2);
    font-variant-numeric: tabular-nums;
  }
  .d1b-note {
    flex-shrink: 0; margin-top: auto; padding-top: 10px;
    font-family: 'Lato', sans-serif; font-size: 12.5px; line-height: 1.45;
    color: var(--nnm-ink-2);
  }
  .d1b-clear {
    border: 2px solid var(--nnm-rule); border-radius: 5px; background: #fff;
    color: var(--nnm-ink-2); cursor: pointer; padding: 1px 8px; margin-right: 6px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 11.5px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .d1b-clear:hover { background: var(--nnm-surface); }

  /* ---- 3B Investigate Pathway 3 ---- */
  .d3b-bar { justify-content: flex-start; }
  /* Nothing else in this bar is elastic, so About takes the slack itself. In 2B
     the rule's auto margins do it and in 3A the view switch's flex does. */
  .d3b-bar .nnm-about-btn { margin-left: auto; }
  /* Three columns: the two conversations being compared, then the one control set
     that is not per conversation. The conversations are equal — two things being
     compared cannot be given different amounts of room — and commissioning takes
     what is left, which is enough for four one-line items and the results table.
     Stacking commissioning below instead leaves it about 67px once two full
     conversation cards are placed, which is not a panel. */
  .d3b-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: 1 1 0; }
  .d3b-buycol { flex: 0 0 314px; }
  .d3b-conv, .d3b-panel { flex: 1; min-height: 0; }
  /* Both heads in this screen stand the same height. The conversation cards reach 54
     on their own — 36px of nav buttons inside 9/8 padding — while Commission coding
     carries only a title and a count, so it fell back to .nnm-panel-head's 44 and sat
     10px short of the cards beside it. Stated for both, so the pair moves together if
     the nav buttons ever change size. Trace a Case pins its head the same way. */
  .d3b-conv .nnm-panel-head,
  .d3b-panel .nnm-panel-head { min-height: 54px; }
  .d3b-convbody { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  /* Nothing in this toolbar is elastic once the prompt is gone, so the query would
     stretch across the whole row and stop matching the one on Correlations. Held
     at the same basis, with the buttons taking the slack. */
  .d3b-toolbar .d3-filter { flex: 0 1 447px; }
  .d3b-toolbar .nnm-reset { margin-left: auto; }
  /* 9px between the query row and the cards under it, the same gap the Prediction
     Chain's columns carry between their top row and their panels. The stack has no
     row gap of its own, so the toolbar and the cards were butted together. */
  .d3b-toolbar { margin-bottom: 9px; }
  /* The reading is the thing being compared, so it gets the room in the card and
     the notes below it keep their own. */
  .d3b-readtext { flex-shrink: 0; margin-bottom: 12px; }
  /* The reading collapses, and starts collapsed. The work on this screen is
     comparing the NOTES across two conversations, and the legend plus the sentence
     pushed them down the card. "Pathway 3" stays behind as the trigger so a card
     still says what it is a reading OF.
     Height animates through grid-template-rows 0fr -> 1fr rather than max-height:
     no measured height, so it stays correct when the sentence rewraps at a
     different card width, and nothing has to be remeasured on resize. */
  .d3b-disc {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; padding: 7px 0; margin-bottom: 5px;
    background: none; border: 0; border-bottom: 1px solid #B9CBE4;
    border-radius: 4px 4px 0 0;
    font-family: 'Lato', sans-serif; font-size: 12.5px; color: var(--nnm-ink-2);
    text-align: left; cursor: pointer;
    transition: background 0.16s ease, color 0.16s ease,
                margin-bottom 0.26s cubic-bezier(.4,0,.2,1);
  }
  /* The whole bar is the target, so the whole bar answers: --nnm-surface is the
     hover every other button in this piece uses. It stops at the content width
     rather than bleeding to the card edges, which keeps its rule aligned with the
     one over Observation notes. The caret picks up a chip at the same moment — the
     wash says "this row is live", the chip says "and this is the control". */
  .d3b-disc:hover { color: var(--nnm-ink); background: var(--nnm-surface); }
  /* One step past hover, so opening and closing both acknowledge the press. */
  .d3b-disc:active { background: var(--nnm-rule-soft); }
  .d3b-disc:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .d3b-caretchip {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: transparent; border: 1px solid transparent;
    transition: background 0.16s ease, border-color 0.16s ease;
  }
  /* White on the tinted bar, so the chip reads as raised rather than as a second
     tint. The border is the same --nnm-rule the nav buttons are drawn with. */
  .d3b-disc:hover .d3b-caretchip { background: #FFFFFF; border-color: var(--nnm-rule); }
  .d3b-disc svg { display: block; transition: transform 0.26s cubic-bezier(.4,0,.2,1); }
  .d3b-disc[aria-expanded="true"] svg { transform: rotate(180deg); }
  .d3b-discwrap {
    flex-shrink: 0; display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows 0.26s cubic-bezier(.4,0,.2,1);
  }
  .d3b-disc[aria-expanded="true"] + .d3b-discwrap { grid-template-rows: 1fr; }
  /* visibility, not the clip alone: it takes the collapsed reading out of the
     accessibility tree and out of tab order, which overflow:hidden does not. The
     0.26s delay is on the way CLOSED only, so it does not blank before the height
     has finished travelling. */
  .d3b-discinner {
    overflow: hidden; min-height: 0;
    visibility: hidden; transition: visibility 0s linear 0.26s;
  }
  .d3b-disc[aria-expanded="true"] + .d3b-discwrap .d3b-discinner {
    visibility: visible; transition-delay: 0s;
  }
  /* The two blocks ride in just behind the opening height, legend first, so the
     card assembles rather than appearing. They leave together — a staggered exit
     reads as hesitation. */
  .d3b-discinner > * {
    opacity: 0; transform: translateY(-5px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .d3b-disc[aria-expanded="true"] + .d3b-discwrap .d3b-discinner > * {
    opacity: 1; transform: none;
  }
  .d3b-disc[aria-expanded="true"] + .d3b-discwrap .nnm-readhead { transition-delay: 0.06s; }
  .d3b-disc[aria-expanded="true"] + .d3b-discwrap .d3b-readtext { transition-delay: 0.12s; }
  .d3b-convbody .d3b-subhead { margin-top: 2px; }
  /* Half the 28px .nnm-readhead carries by default. That value is for the
     Prediction Chain, where the key stands over a whole column of readings; here it
     sits directly on top of one sentence, and 28px read as a break between two
     things rather than as a key labelling the line beneath it. Scoped to this card
     so the Chain keeps its own spacing. */
  .d3b-convbody .nnm-readhead { margin-bottom: 14px; }
  /* Collapsed, the two rules become one. The disc already draws a border, so the
     Observation notes rule goes transparent and the 5px + 2px between them closes,
     lifting the heading to sit under the Pathway 3 rule. Its 10px of padding stays
     — that is the same air the heading has below the rule when the card is open.
     Both animate on the disclosure's curve and duration, so the heading travels
