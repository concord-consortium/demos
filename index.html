    // 77 is 7 padding + 31 name + 4 gap + 26 counts + 7 padding + 2. The attribute
    // icon costs nothing at 24px: it sits BESIDE the two-line name, needing
    // 24 + 6 + 74 (the widest line, "Engaged in a") + 12 padding = 116 of the 126 a
    // column has. At 40px it needed 161, had to go above the name instead, and that
    // pushed this to 123 — 46px straight off every plot row.
    // 100. Was 130. "Pathway 1" needs 59.8 of ink and the row head has 18 of
    // padding, so the names have room to spare; what sets the floor is the key's
    // "Correlation (r)" label, which is pinned to this width so it lines up under
    // them — 92.3 of ink plus its own 16 of padding wants 109, and below that it
    // wraps to two lines.
    const STUB = 100, ROW = 70, HEAD = 77, GAP = 1;
    // The "Commissioned" band above the bought columns. It grows UPWARD — its
    // bottom is pinned to the table's top edge and placeBand() subtracts this from
    // there — so the table never gives up a pixel for it. The ceiling is the About
    // button, whose bottom sits 38px above the table; 30 leaves 8px clear.
    const BANNER = 30;
    // Must match .d3-margbox's padding-top: the slot the pathway's own histogram
    // hangs in, which is part of the box's open height. (STUB_GAP, the 8px the name
    // and the range bar used to hold open in Correlations view, went with the range
    // bar itself.)
    const MARG_PLOT = 62;

    // Where the heading block rests in each view: flush to the top in Histograms view,
    // so it reads as a caption for the plot right beneath it; centred in the band
    // in correlation view, which has no plot to caption.
    // render() rebuilds the grid, so the headings that come back are new nodes with
    // nothing to transition FROM. Put them where the outgoing view had them, let
    // the browser take that as the starting style, then release them to the new
    // resting place on the next frame — the move animates even though the elements
    // themselves did not survive the switch.
    // Only ever called for a view SWITCH. The heading is built already wearing the
    // right class, so a fresh page needs nothing done to it — which is what stops
    // the counts appearing and then sliding away on load. render() rebuilds the
    // grid, so to animate a switch the new headings are put into the OUTGOING
    // view's state with transitions off, flushed so the browser takes that as the
    // start, then released into the incoming one.
    function placeHeads() {
      if (prevView === view) return;
      scroll.querySelectorAll(".d3-headinner").forEach(function (inner) {
        inner.style.transition = "none";
        inner.classList.toggle("nocounts", prevView === "corr");
        void inner.offsetWidth;
        inner.style.transition = "";
        inner.classList.toggle("nocounts", view === "corr");
      });
      scroll.querySelectorAll(".d3-stubinner").forEach(function (inner) {
        // The gap-opening padding lives on a descendant with its own transition,
        // so it has to be pinned for the flush as well — otherwise it animates to
        // the outgoing state and the real move starts from somewhere in between.
        const box = inner.querySelector(".d3-margbox");
        inner.style.transition = "none";
        if (box) box.style.transition = "none";
        inner.classList.toggle("noplot", prevView === "corr");
        void inner.offsetWidth;
        inner.style.transition = "";
        if (box) box.style.transition = "";
        inner.classList.toggle("noplot", view === "corr");
      });
      prevView = view;
    }

    // The grid sizes itself now. This only aligns the key to the block of squares.
    // The body rows divide whatever the scroller has, down to a ROW floor. ROW is
    // not a fixed height any more — it is the tallest thing that must sit in one
    // row: the stub's pathway name, its histogram and its range bar. With four
    // pathways at a flat 70px the table used to stop 94px short of the bottom,
    // which read as the matrix having been cut off.
    //
    // Written in px, not `minmax(ROW, 1fr)`: a flexible track lets its content
    // push it taller, and in Histograms view the plots have an intrinsic height that
    // took the rows to 98px and overflowed the scroller by 18. A fixed px row
    // keeps the cells clipping their contents the way they always have — and when
    // the floor does bite, the grid simply grows past the scroller and scrolls,
    // which is the behaviour a dataset with more pathways needs.
    //
    // Both views get the same answer because the scroller does not change size
    // when the view does, so switching still moves nothing.
    // Measured onto the columns rather than computed: the grid divides its width
    // between however many columns there are, so the only reliable source for where
    // the commissioned ones start and end is the headings themselves.
    // Watches the GRID, not the scroller. The band was placed from the scroller's
    // own ResizeObserver, and a layout change moves the columns without necessarily
    // resizing that scroller in a way it reports in time — so the band kept the
    // previous layout's left and width and sat short of the columns it names. The
    // grid is the thing whose width decides where those columns are.
    const bandWatch = window.ResizeObserver ? new ResizeObserver(function () {
      placeBand();
    }) : null;
    if (bandWatch) SIM._observers.push(bandWatch);

    function placeBand() {
      const heads = scroll.querySelectorAll(".d3-colhead.commissioned");
      if (!heads.length) { commBand.hidden = true; return; }
      const grid = scroll.querySelector(".d3-grid");
      if (!grid) { commBand.hidden = true; return; }
      const gb = grid.getBoundingClientRect();
      const hb = head.getBoundingClientRect();
      // From the grid's own geometry rather than from the heading elements. The
      // headings gave the same answer every time I could measure it, but they are
      // one indirection away from the thing that decides where a column is — the
      // grid's track arithmetic — and a stale or duplicated heading node would put
      // the band somewhere plausible-looking and wrong. This cannot: the grid is
      // `STUB px repeat(N, minmax(0, 1fr))` inside 1px of padding with 1px gaps, so
      // every column is the same width and the last `nComm` of them end where the
      // grid's padding does.
      const nCols = rows.length;
      const colW = (gb.width - 2 - STUB - nCols * GAP) / nCols;
      const trackW = heads.length * colW + (heads.length - 1) * GAP;
      // Out over the rules on both sides, not inside them. A column has no border
      // of its own — the lines between columns are the grid's background showing
      // through its 1px gaps, outside the track — while this band's border is drawn
      // inside its own box. Sized to the track exactly, the two sat side by side as
      // a 2px double line and the band's fill began 1px in from the column's. A gap
      // wider on each side makes the band's border land ON the rules instead, so it
      // reads as a cell of the table rather than a box floating inside one.
      const bandW = trackW + 2 * GAP;
      commBand.style.top = (gb.top - BANNER - hb.top) + "px";
      commBand.style.left = (gb.right - 1 - trackW - GAP - hb.left) + "px";
      commBand.style.width = bandW + "px";
      commBand.hidden = false;
    }

    function sizeRows(gridEl) {
      const grid = gridEl || scroll.querySelector(".d3-grid");
      if (!grid || !rowCount) return;
      // The grid's own 1px padding top and bottom, and one 1px gap per body row
      // (there are rowCount gaps: one under the head, one under each row but the
      // last, which is rowCount in total).
      // Nothing to divide up until the panel is on screen. Every call during the
      // build runs with a scroller of 0, which made `avail` negative and wrote a
      // row template pinned to the ROW floor; the only thing that ever corrected it
      // was the ResizeObserver below, and leaning on that left the table 98px short
      // whenever it did not fire. Better to write nothing than to write a number
      // measured against nothing.
      if (scroll.clientHeight < 20) return;
      const avail = scroll.clientHeight - 2 - HEAD - rowCount;
      // Down to the half pixel, never up: rounding up puts the grid a pixel past
      // the scroller and starts it scrolling for nothing. At most 2px is left over
      // across four rows, well under the 1px ruling the eye is reading.
      const h = Math.max(ROW, Math.floor((avail / rowCount) * 2) / 2);
      grid.style.gridTemplateRows = HEAD + "px repeat(" + rowCount + ", " + h.toFixed(2) + "px)";

      // Where the name + range block sits when the plot is not there. Measured
      // from a real stub rather than assumed: the block's height depends on the
      // name's line box and on however tall the range bar's own caption makes it,
      // and the row's height is whatever the line above just decided.
      // How tall the range block is when it is open. The margbox collapses from
      // this to 0 on the way into Correlations view, and max-height cannot animate
      // out of `none`, so the open height has to be a number — measured, since it
      // depends on the range bar's own line box and margin. The bar's margin-top
      // counts: it sits inside the box but a rect does not include it.
      const stub = grid.querySelector(".d3-rowhead");
      const nm = stub && stub.querySelector(".d3-rowname");
      const nmH = nm ? nm.getBoundingClientRect().height : 0;
      const cs = stub ? getComputedStyle(stub) : null;
      const contentH = stub ? stub.getBoundingClientRect().height
        - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) : 0;
      // Only once the row has a real height. The first call runs while the panel is
      // still mounting, and a row measured then is shorter than its own name — which
      // wrote a lift of 0 and left the name pinned to the top of the cell until
      // something else happened to resize the grid. Until this holds, the CSS
      // fallback stands, and it is within half a pixel of the measured answer.
      if (nm && contentH > nmH + 2) {
        // How tall the block is when it is open: the plot's slot plus the range bar
        // under it. The margbox collapses from this to 0 on the way into
        // Correlations view, and max-height cannot animate out of `none`, so it has
        // to be a number — measured, since it depends on the bar's own line box.
        // The bar's margin-top counts: it is inside the box but a rect is not.
        const rng = stub && stub.querySelector(".d3-range");
        const margPx = rng
          ? MARG_PLOT + parseFloat(getComputedStyle(rng).marginTop)
            + rng.getBoundingClientRect().height
          : MARG_PLOT;
        const margH = margPx.toFixed(1) + "px";
        // Half the slack around each view's block. In Correlations the block is the
        // name alone, the margbox having collapsed to nothing; in Histograms it is
        // the name, the plot's slot and the range bar.
        const lift = ((contentH - nmH) / 2).toFixed(1) + "px";
        const glift = (Math.max(0, contentH - nmH - margPx) / 2).toFixed(1) + "px";
        if (grid.style.getPropertyValue("--stub-lift") !== lift
            || grid.style.getPropertyValue("--graph-lift") !== glift
            || grid.style.getPropertyValue("--marg-h") !== margH) {
          // Pinned for the change, the way the view switch pins its own. Both the
          // stub and the box carry transitions, so writing a new value animates it
          // — on first render that is a slide from the fallback to the measured
          // figure, and on resize a drift as the rows resize. Neither is a state
          // change anyone asked to see; only the view switch should move these.
          const inners = grid.querySelectorAll(".d3-stubinner");
          const boxes = grid.querySelectorAll(".d3-margbox");
          inners.forEach(function (i) { i.style.transition = "none"; });
          boxes.forEach(function (b) { b.style.transition = "none"; });
          grid.style.setProperty("--stub-lift", lift);
          grid.style.setProperty("--graph-lift", glift);
          grid.style.setProperty("--marg-h", margH);
          void grid.offsetWidth;
          inners.forEach(function (i) { i.style.transition = ""; });
          boxes.forEach(function (b) { b.style.transition = ""; });
        }
      }
    }

    // Sizes the key against the grid. Reads whichever grid is up: the key is shown
    // in both views now, and it was measuring `.d3-grid.corr` only — in Histograms view
    // it returned at the first line and the bar kept whatever height the last
    // correlation render had left it.
    // -1 at the left end of the bar, +1 at the right — the ticks' own mapping. A
    // percentage of the rail, so the marker needs no measurement and stays right
    // through a resize on its own.
    let lastMarkR = 0;
    function placeMark(r) {
      const v = Math.max(-1, Math.min(1, r));
      lastMarkR = v;
      legendMark.style.left = (((1 + v) / 2) * 100).toFixed(2) + "%";
      legendMarkVal.textContent = (v >= 0 ? "+" : "\u2212") + Math.abs(v).toFixed(2);
    }
    function showMark(r) {
      if (!isFinite(r)) return;
      placeMark(r);
      legendMark.hidden = false;
    }
    function hideMark() { legendMark.hidden = true; }

    // ---- the panel behind one cell ----
    // Opened from either view and identical in both: the distribution that produced
    // the number, with the number stated beside it. That is what makes the two
    // views an overview and its detail rather than two separate screens.
    let detailEl = null;

    function closeDetail() {
      if (!detailEl) return;
      const trigger = detailEl._trigger;
      detailEl.remove();
      detailEl = null;
      document.removeEventListener("keydown", detailKeys);
      if (trigger && trigger.isConnected) {
        trigger.classList.remove("selected");
        trigger.focus();
      }
    }

    // The card can be dragged by its header, the way the About panel can, so a
    // panel that lands over the cell you want to compare against can be moved off
    // it. Alt+arrows do the same from the keyboard.
    function makeDraggable(card, handle, bounds) {
      let x = 0, y = 0, dx = 0, dy = 0, dragging = false;
      // Kept inside the interactive. Applied after the move rather than by
      // pre-computing limits, so it stays correct when the panel is resized or the
      // card's own height changes underneath it.
      function put() {
        card.style.transform = "translate(" + x + "px," + y + "px)";
        const r = card.getBoundingClientRect(), b = bounds.getBoundingClientRect();
        let ax = 0, ay = 0;
        if (r.width <= b.width) {
          if (r.left < b.left) ax = b.left - r.left;
          else if (r.right > b.right) ax = b.right - r.right;
        }
        if (r.height <= b.height) {
          if (r.top < b.top) ay = b.top - r.top;
          else if (r.bottom > b.bottom) ay = b.bottom - r.bottom;
        }
        if (ax || ay) {
          x += ax; y += ay;
          card.style.transform = "translate(" + x + "px," + y + "px)";
        }
      }
      handle.addEventListener("pointerdown", function (e) {
        if (e.target.closest("button")) return;      // the close button is not a grip
        dragging = true;
        dx = e.clientX - x;
        dy = e.clientY - y;
        handle.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      handle.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        x = e.clientX - dx;
        y = e.clientY - dy;
        put();
      });
      handle.addEventListener("pointerup", function () { dragging = false; });
      handle.addEventListener("pointercancel", function () { dragging = false; });
      card.addEventListener("keydown", function (e) {
        if (!e.altKey) return;
        const step = e.shiftKey ? 40 : 10;
        if (e.key === "ArrowLeft") x -= step;
        else if (e.key === "ArrowRight") x += step;
        else if (e.key === "ArrowUp") y -= step;
        else if (e.key === "ArrowDown") y += step;
        else return;
        e.preventDefault();
        put();
      });
      handle.style.cursor = "move";
    }

    function detailKeys(e) {
      if (e.key === "Escape") { e.stopPropagation(); closeDetail(); }
    }

    function openDetail(row, ri, pi, trigger) {
      closeDetail();
      const pa = paths[pi];
      const r = R[ri][pi];
      const gv = row.gvals || row.vals;
      const bands = row.groups.map(function (g) {
        const vals = [];
        for (let i = 0; i < items.length; i++) if (gv[i] === g[0]) vals.push(pa.vals[i]);
        return { label: g[1] + "  (" + vals.length + ")", vals: vals };
      });

      const scrim = document.createElement("div");
      scrim.className = "d3-scrim";
      scrim._trigger = trigger;
      scrim.addEventListener("click", function (e) { if (e.target === scrim) closeDetail(); });

      const card = document.createElement("div");
      card.className = "d3-detail";
      card.setAttribute("role", "dialog");
      card.setAttribute("aria-modal", "true");
      card.setAttribute("aria-label", pa.label + " against " + row.label);
      scrim.appendChild(card);

      const head = document.createElement("div");
      head.className = "d3-detail-head";
      const title = document.createElement("div");
      title.className = "d3-detail-title";
      title.textContent = pa.label + "  \u00d7  " + row.label;
      head.appendChild(title);

      const rv = document.createElement("div");
      rv.className = "d3-detail-r";
      if (isFinite(r)) {
        const sw = document.createElement("i");
        sw.style.background = Math.abs(r) < 0.005 ? "#FFFFFF" : rampHex(r);
        rv.appendChild(sw);
        const num = document.createElement("span");
        num.textContent = "r = " + (r >= 0 ? "+" : "\u2212") + Math.abs(r).toFixed(2);
        rv.appendChild(num);
      } else {
        const num = document.createElement("span");
        num.textContent = "r not defined";
        rv.appendChild(num);
      }
      head.appendChild(rv);

      const x = document.createElement("button");
      x.className = "d3-detail-close";
      x.innerHTML = "&times;";
      x.setAttribute("aria-label", "Close");
      x.addEventListener("click", closeDetail);
      head.appendChild(x);
      card.appendChild(head);

      const body = document.createElement("div");
      body.className = "d3-detail-body";
      // Scaled off the matrix rather than fitted to itself, so this is the cell's
      // own picture enlarged — one zoom factor on both axes, from detailGeom.
      //
      // Note what that trades away. A bar here does NOT mean the same count as a
      // bar of the same height in the matrix — it means k times fewer, because the
      // lane is k times taller. Holding the unit fixed instead was tried: it makes
      // counts comparable across the two, but a distribution filling 66% of its
      // lane in the cell then fills 25% here, and it stopped looking like the thing
      // that was clicked. Comparisons WITHIN a plot — band against band, filtered
      // against all — are unaffected either way, and those are the ones the panel
      // exists to make.
      //
      const geom = detailGeom(detailAvailW(), detailAvailH(), DETAIL_LABW, bands.length,
        fitCellPlotW, fitCellPlotH / bands.length - LANE_GUTTER);
      // The zoom itself, not the plot-box ratio: the box and the lane grow by
      // slightly different factors because LANE_GUTTER is fixed, and scaling the
      // unit by the box left every bar at 94.5% of the fraction it filled in the
      // cell. k is the number both axes were built from.
      body.appendChild(histPlot(bands, pa.lo, pa.hi, geom.W, geom.H,
        { unit: fitUnit ? fitUnit * geom.k : 0, labW: DETAIL_LABW, padR: DETAIL_PADR }));
      // The card follows the plot rather than the plot filling a fixed card, or the
      // aspect the zoom just fixed would be lost to dead space at the sides.
      card.style.width = (geom.W + 30) + "px";
      card.appendChild(body);


      makeDraggable(card, head, scrim);
      if (trigger) trigger.classList.add("selected");
      wrap.appendChild(scrim);
      detailEl = scrim;
      document.addEventListener("keydown", detailKeys);
      x.focus();
    }

    // The panel behind a pathway. Deliberately NOT a bigger copy of the stub plot:
    // it draws the pathway across all 800 conversations and the filtered set on the
    // same axis, which is the one thing the range bar asserts and nothing in the
    // interactive shows. For Pathway 1 under the error filter that is the finding —
    // a full spread above, a single spike below.
    function openPathwayDetail(pa, pi, trigger) {
      closeDetail();
      const full = pa.full || pa.vals;
      const fLo = Math.min.apply(null, full), fHi = Math.max.apply(null, full);
      const vLo = Math.min.apply(null, pa.vals), vHi = Math.max.apply(null, pa.vals);
      const frac = fHi - fLo > 0 ? (vHi - vLo) / (fHi - fLo) : 1;

      const scrim = document.createElement("div");
      scrim.className = "d3-scrim";
      scrim._trigger = trigger;
      scrim.addEventListener("click", function (e) { if (e.target === scrim) closeDetail(); });

      const card = document.createElement("div");
      card.className = "d3-detail";
      card.setAttribute("role", "dialog");
      card.setAttribute("aria-modal", "true");
      card.setAttribute("aria-label", pa.label + " across all conversations");
      scrim.appendChild(card);

      const head = document.createElement("div");
      head.className = "d3-detail-head";
      const title = document.createElement("div");
      title.className = "d3-detail-title";
      title.textContent = pa.label;
      head.appendChild(title);
      const imp = document.createElement("div");
      imp.className = "d3-detail-r";
      const iv = D.importance[pi];
      imp.textContent = "importance " + (iv >= 0 ? "+" : "\u2212") + Math.abs(iv).toFixed(4);
      head.appendChild(imp);
      const x = document.createElement("button");
      x.className = "d3-detail-close";
      x.innerHTML = "&times;";
      x.setAttribute("aria-label", "Close");
      x.addEventListener("click", closeDetail);
      head.appendChild(x);
      card.appendChild(head);

      const body = document.createElement("div");
      body.className = "d3-detail-body";
      // Both on the FULL range, so the second band's narrowness is measured against
      // the first rather than rescaled away.
      // The filtered set on top: it is what the panel is about, and the full set
      // below is the backdrop it is being measured against.
      // pa.lo/pa.hi — the SHARED axis the stub and every cell use — not this
      // pathway's own min and max. Scaled to its own range the panel stretched the
      // same data across a different width: the last pathway covers about nine
      // tenths of the shared axis while Pathway 1 covers a fraction of it, so a
      // close-up scaled to its own range came out a different width from the stub
      // it opened from and read as a different distribution. A zoom has to be the
      // same picture, larger.
      // The same card every close-up gets. Shaping this one to the stub's own
      // aspect was tried and reverted: what made the stub and its close-up
      // disagree was the SCALE below, not the card, and once that is fixed the fill,
      // the bar count and the horizontal span all match at any aspect. Reshaping
      // the card only made the two kinds of panel different sizes.
      //
      // One unit per band, which is the exception rather than the rule here.
      //
      // The two bands are 64 conversations and 800 of the same thing, so the lower
      // is about twelve times deeper and a shared unit is set by it. That did not
      // merely flatten the band above: at 0.67px per conversation every bin holding
      // one or two of them rounded away, so the tails vanished and the filtered set
      // arrived both flat AND narrower than it is. The stub read 82% full and its
      // own close-up read 8%, of a visibly different distribution.
      //
      // Nothing is lost by scaling them apart. Comparing the two bands' HEIGHTS was
      // never a real reading — of course 800 conversations pile deeper than 64;
      // the labels say so. What this panel is for is where the two sit on the axis,
      // and that is horizontal. The top band is now the stub enlarged by exactly
      // the zoom, and the backdrop fills its own lane.
      const pGeom = detailGeom(detailAvailW(), detailAvailH(), DETAIL_LABW, 2,
        fitCellPlotW, fitCellPlotH / 2 - LANE_GUTTER);
      // The top band keeps the stub's fill exactly: its unit is the stub's, grown
      // by however much taller this lane is. That is what makes it the same
      // picture; the card's shape has nothing to do with it.
      const pLane = (pGeom.H - AXIS_H - PAD_T) / 2 - LANE_GUTTER;
      const pTop = pa.stubUnit && fitStubLane ? pa.stubUnit * (pLane / fitStubLane) : 0;
      // Both bands asked for the matrix's scale. The backdrop usually cannot take
      // it — it is the whole corpus against a filtered slice, and histPlot refits
      // any band the unit would overflow — but with no filter in force the two
      // bands ARE the same 800 conversations, and asking for one unit is what makes
      // them draw identically instead of one filling its lane and the other not.
      body.appendChild(histPlot([
        { label: "these " + pa.vals.length, vals: pa.vals },
        { label: "all " + ALL.length, vals: full }
      ], pa.lo, pa.hi, pGeom.W, pGeom.H, { labW: DETAIL_LABW, padR: DETAIL_PADR, bandUnits: [pTop, pTop] }));
      card.style.width = (pGeom.W + 30) + "px";
      card.appendChild(body);


      makeDraggable(card, head, scrim);
      if (trigger) trigger.classList.add("selected");
      wrap.appendChild(scrim);
      detailEl = scrim;
      document.addEventListener("keydown", detailKeys);
      x.focus();
    }

    // ---- a cell in the correlation view: the square IS the mark ----
    function corrCell(r) {
      const el = document.createElement("div");
      el.className = "d3-cell corr";
      // Undefined rather than zero: every conversation in the filter shares one
      // value on this row, so there is nothing for the pathway to line up with.
      // Drawn as an em dash with no circle, because any circle at all — even the
      // smallest — would be read as a measured weak result.
      if (!isFinite(r)) {
        el.classList.add("undef");
        const dash = document.createElement("span");
        dash.className = "d3-r";
        dash.textContent = "\u2014";
        el.appendChild(dash);
        el.title = "Not defined: every one of these " + items.length +
          " conversations has the same value on this row, so there is nothing to correlate.";
        return el;
      }
      // A filled square with its value inside, on the same five-step ramp the
      // words and the Day 2 squares use, so a colour means the same thing
      // everywhere in the piece. Drawn INSIDE the cell at a fixed size rather than
      // being the cell, so the column can stay the width the Histograms view needs.
      // Below half of the last displayed digit there is nothing to show a
      // direction for, and tinting it would give a sign to a rounding remainder.
      const flat = Math.abs(r) < 0.005;
      const sq = document.createElement("i");
      sq.className = "d3-sq";
      sq.style.background = flat ? "#FFFFFF" : rampHex(r);
      if (!flat && rampIsDark(r)) el.classList.add("deep");
      const num = document.createElement("span");
      num.className = "d3-r";
      num.textContent = (r >= 0 ? "+" : "−") + Math.abs(r).toFixed(2);
      sq.appendChild(num);
      el.appendChild(sq);
      el.dataset.r = r;
      // Kept here, unlike on the graph cells: this one carries 4dp and the n, and
      // the cell itself only shows 2dp, so removing it would lose the precision
      // with nothing to replace it. The marker on the key runs alongside it.
      el.title = "r = " + r.toFixed(4) + "  (n = " + items.length + ")";

      return el;
    }

    // ---- the Histograms view: a histogram per group, on a shared axis ----
    // Every panel uses the same mark. Bar height is a count — bars are
    // literal counts, not a histogram scaled to fit — so "how many" reads the same
    // in a marginal, a cell, and a category. Dots shrink when a stack would
    // overflow rather than the count being capped, which is what CODAP does.
    // LABEL_W was sized for a 210-unit viewBox. The plots are drawn at their real
    // pixel size now, so a cell's band labels get COMPACT_LABEL_W: "3 or more" is
    // the longest at 35px, plus the 6px the text is inset from the axis.
    const AXIS_H = 16, LABEL_W = 52, COMPACT_LABEL_W = 42, PAD_R = 6, PAD_T = 6;
    // The strip at the top of each lane that a pile may not enter, so two full
    // piles meeting back to back still read as two. Used by the clip AND by every
    // unit fit, which have to agree to the pixel or a bar fitted exactly is cut.
    const LANE_GUTTER = 3;
    let clipSeq = 0;

    function niceTicks(lo, hi, want) {
      const span = hi - lo;
      if (!(span > 0)) return [lo];
      const raw = span / want;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const norm = raw / mag;
      const stepN = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
      const step = stepN * mag;
      const out = [];
      for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
      return out;
    }

    function fmtTick(v, span, compact) {
      // In a cell the axis is a reference line, not something read off precisely,
      // and five labels at "−4.0" need ~90px on their own — more than the whole
      // cell has. Three bare integers need 42.
      if (compact) return String(Math.round(Math.abs(v) < 1e-9 ? 0 : v));
      const dp = span >= 20 ? 0 : span >= 4 ? 1 : 2;
      return (Math.abs(v) < 1e-9 ? 0 : v).toFixed(dp);
    }

    // Lays one band of dots: values -> x, packed into columns a dot wide, stacked
    // upward from the baseline. Returns the radius that made the tallest stack fit.
    // The radius ladder, shared so the fitting pass and the drawing pass agree.
    // Height given to ONE conversation inside a bar. This is the old dot-radius
    // ladder doubled: a dot stood 2r tall, so a bar holding n conversations stands
    // n * 2r — which puts every fitted size, and every decision about what clips,
    // exactly where the dot plots had them.

    // BINS is fixed for every plot of an activation axis. It used to be derived
    // from the dot radius — cols = plotW / 2r — which tied the histogram's shape to
    // how big the dots happened to be: a cell at r=0.95 across 52px got 27 columns
    // while its own close-up at r=3.2 across 472px got 74, so the zoom was a
    // differently-shaped picture of identical numbers. Fixed, the shape is a
    // property of the data and the axis, and the dots just fill whatever column
    // width the plot has room for.
    const BINS = 27;

    // The histogram itself: how many conversations land in each of the BINS
    // columns of the axis. Everything else is a way of drawing this.
    function binCounts(vals, lo, hi) {
      const counts = new Array(BINS).fill(0);
      for (let i = 0; i < vals.length; i++) {
        let c = Math.floor(((vals[i] - lo) / (hi - lo)) * BINS);
        if (c < 0) c = 0; if (c >= BINS) c = BINS - 1;
        counts[c]++;
      }
      return counts;
    }

    // How tall the fullest bin would stand at a given unit. Used to find the one
    // unit every band in the matrix can live with.
    function stackAt(vals, lo, hi, plotW, unit) {
      const counts = binCounts(vals, lo, hi);
      return Math.max.apply(null, counts) * unit;
    }

    function svgEl(name, attrs) {
      const e = document.createElementNS(SVGNS, name);
      Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      return e;
    }

    // One histogram. `bands` is a list of {label, vals}; a single band gives the
    // marginal distributions in the headers, several give a matrix cell.
    function histPlot(bands, lo, hi, W, H, opts) {
      opts = opts || {};
      const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", height: H });
      svg.setAttribute("class", "d3-plot");
      // A pile taller than its band grew straight up into the band above it — the
      // two groups' dots mixed and neither could be read, and some ran clean out
      // of the plot (measured 17px above its top edge). Each band is clipped to
      // its own lane now: an over-tall pile is cut at the top of its own strip,
      // where it reads as running off the scale rather than as its neighbour's.
      const defs = svgEl("defs", {});
      svg.appendChild(defs);
      const clipId = "nnmclip" + (clipSeq++);
      const rules = [];
      // LABEL_W is sized for the label at 10.5px. The close-up draws them at 14 and
      // its groups carry three-digit counts — "Approach  (386)" is about 88px — so
      // it asks for its own gutter rather than right-anchoring into a 52px one and
      // running off the left of the card.
      const labW = opts.noLabels ? 8 : (opts.labW || (opts.compact ? COMPACT_LABEL_W : LABEL_W));
      // The right margin normally just keeps the last bar off the edge, but in the
      // close-ups it has to answer the label gutter on the left, or the plot sits
      // off-centre in the card by the whole width of that gutter.
      const padR = opts.padR || PAD_R;
      const plotW = W - labW - padR;
      // Without an axis the whole height goes to the dots. The pathway stub takes
      // this: every cell in its row carries the same axis on the same scale, so a
      // fifth copy of it in the stub was spending 22 of 28px to say nothing new —
      // and left 6px for the dots themselves.
      const plotH = H - (opts.noAxis ? 0 : AXIS_H) - PAD_T;
      const bandH = plotH / bands.length;

      // One unit for every band in this plot, so a given height means the same
      // number of conversations wherever it appears. Fitted per band, a panel
      // showing 800 above 63 would draw the two at different scales — the same
      // bar meaning a different count in each half of one picture. Where a unit is
      // dictated (the matrix, which fits one across every cell) that wins;
      // otherwise the largest that suits them all.
      function fitsAt(uu) {
        return bands.every(function (b) {
          return stackAt(b.vals, lo, hi, plotW, uu) <= bandH - LANE_GUTTER;
        });
      }
      // The largest unit at which every band in `set` fits, exactly — the deepest
      // one then reaches the top of its lane and no further. This replaced a walk
      // down a ladder of fixed step sizes, which landed wherever the next rung
      // happened to be: the tallest bar on screen came out anywhere between 81% and
      // 95% of its lane depending on the filter, wasting up to a fifth of the
      // height of every plot at once, since they all share the unit.
      function exactFit(set) {
        let u = Infinity;
        set.forEach(function (b) {
          const depth = stackAt(b.vals, lo, hi, plotW, 1);
          if (depth > 0) u = Math.min(u, (bandH - LANE_GUTTER) / depth);
        });
        return isFinite(u) ? Math.max(0.01, u) : 1;
      }
      // A unit handed in (the matrix's shared one, and the close-up's scaled copy
      // of it) is a CEILING rather than an instruction. Taking it as an instruction
      // is what cut the close-up's "all 800" band down to 15% of its height: the
      // panel's bands are not the cell's, so a unit that fits the cell can be far
      // too large here. When it does fit, it is used and the zoom is the same
      // picture larger; when it does not, this drops to the largest unit that does.
      const unit = opts.unit && fitsAt(opts.unit) ? opts.unit : exactFit(bands);
      // Per-band units, when the caller asks for them. A 0 in the list means "fit
      // this band to its own lane"; a value is used as given, unless it would run
      // the band past its lane, in which case it is refitted like any other.
      const bandUnits = opts.bandUnits ? bands.map(function (b, i) {
        const want = opts.bandUnits[i];
        if (want && stackAt(b.vals, lo, hi, plotW, want) <= bandH - LANE_GUTTER) return want;
        return exactFit([b]);
      }) : null;

      const colW = plotW / BINS;
      // Bars meet edge to edge in a matrix cell, where a column is under 4px wide
      // and a gap would read as a comb rather than a distribution. In the close-up,
      // where a column is ~17px, 1px of daylight separates them into bars.
      const barGap = colW > 6 ? 1 : 0;

      bands.forEach(function (b, bi) {
        const base = PAD_T + (bi + 1) * bandH;
        // LANE_GUTTER at the top of each lane. Clipped flush, two full piles sat
        // edge to edge and read as one unbroken column spanning both bands — the
        // clipping stopped them mixing but not looking joined. Every fit above is
        // measured against the same number: it was 2 there and 3 here, so a bar
        // fitted to the last pixel still overshot the clip by one and came back cut.
        const cp = svgEl("clipPath", { id: clipId + "-" + bi });
        cp.appendChild(svgEl("rect", { x: 0, y: base - bandH + LANE_GUTTER,
                                       width: W, height: bandH - LANE_GUTTER }));
        defs.appendChild(cp);
        const lane = svgEl("g", { "clip-path": "url(#" + clipId + "-" + bi + ")" });
        svg.appendChild(lane);
        // Held back and drawn over the dots at the end, so the boundary between two
        // bands is never buried under a pile that reaches it.
        rules.push({ y: base, last: bi === bands.length - 1 });
        if (!opts.noLabels) {
          const t = svgEl("text", { x: labW - 6, y: base - bandH / 2, class: "d3-blabel" });
          t.setAttribute("text-anchor", "end");
          t.setAttribute("dominant-baseline", "middle");
          t.textContent = b.label;
          svg.appendChild(t);
        }
        // A bar per bin, standing on the band's baseline. Height is the count
        // times the unit. Normally that unit is shared by every band in the plot,
        // so two bars of the same height hold the same number of conversations
        // wherever they are — bandUnits is the exception, for a plot whose bands
        // are of such different sizes that one scale erases the smaller one.
        const bu = bandUnits ? bandUnits[bi] : unit;
        binCounts(b.vals, lo, hi).forEach(function (n, c) {
          if (!n) return;
          const h = n * bu;
          lane.appendChild(svgEl("rect", {
            x: labW + c * colW, y: base - h,
            width: Math.max(0.5, colW - barGap), height: h, class: "d3-bar"
          }));
        });
      });

      rules.forEach(function (rl) {
        svg.appendChild(svgEl("line", {
          x1: labW, x2: W - padR, y1: rl.y, y2: rl.y,
          // The pale rule separates two bands packed into a matrix cell; at full
          // size each band is its own plot with its own axis, so both get the
          // darker line rather than the top one looking like a fold.
          // One grey for every band's baseline. The separator between two bands
          // used to be paler than the axis under the bottom one, which read as
          // the top histogram having a fainter axis than the one below it — they
          // are both axes. #838C99 rather than the old #B9C0CA, which measured
          // 1.9:1 on white, under the 3:1 a graphic has to clear.
          stroke: "#838C99", "stroke-width": 1
        }));
      });

      // 3 across a full-size axis, not 5. The scale runs -5.10 to 4.99, and asking
      // for 5 ticks makes niceTicks choose a step of 2 — so the axis ended at -4
      // and 4 and READ as if the data stopped there, while the cells beside it were
      // labelled -5, 0, 5. Three asks for a step of 5, which lands on the ends.
      if (!opts.noAxis) niceTicks(lo, hi, opts.compact ? 2 : 3).forEach(function (v) {
        const x = labW + ((v - lo) / (hi - lo)) * plotW;
        svg.appendChild(svgEl("line", {
          x1: x, x2: x, y1: PAD_T + plotH, y2: PAD_T + plotH + 3,
          stroke: "#838C99", "stroke-width": 1
        }));
        const t = svgEl("text", { x: x, y: H - 3, class: "d3-tick" });
        t.setAttribute("text-anchor", "middle");
        t.textContent = fmtTick(v, hi - lo, opts.compact);
        svg.appendChild(t);
      });
      return svg;
    }

    // Every graph cell, so they can be redrawn at their real size once there is
    // one. A viewBox is a fixed coordinate system scaled to fit the element, and
    // 210 units of it inside a 96px cell meant everything drew at 46% — dots below
    // a pixel across, tick labels illegible, and the whole plot letterboxed into
    // the top of a cell that was 22px taller than it. Built at the measured width
    // instead, the scale is 1 and the plot fills its cell.
    const plotJobs = [];
    // What fitPlots last settled on: the unit, and the PLOT height a matrix cell
    // got it for. The close-ups scale the two together — see openDetail.
    //
    // Plot height, not lane height. A lane is the plot divided by however many
    // bands that column has, so a lane-to-lane ratio is only right when the cell
    // and the close-up have the SAME number of bands. Every column is binary in
    // this dataset, so that held by luck; a three-level attribute would have
    // scaled its close-up against a two-band cell's lane and drawn it two-thirds
    // too short. The band counts cancel out of a plot-to-plot ratio.
    let fitUnit = 0, fitCellPlotH = 0, fitCellPlotW = 0;
    // The stub's lane, so its close-up can reproduce the fill it was drawn at.
    let fitStubLane = 0;

    // One unit for every bar on screen, cells and pathway stubs alike. Fitted per
    // band it would produce ten different scales across the matrix — the same bar
    // height meaning three times as many conversations in one cell as in another.
    // Here the whole set is measured first and the largest unit every band can
    // live with is used everywhere.
    function fitPlots() {
      if (view !== "hist" || !plotJobs.length) return;
      plotJobs.forEach(function (j) {
        const b = j.el.getBoundingClientRect();
        const cs = getComputedStyle(j.el);
        // The CONTENT box. This measured the border box, while histPlot sets the
        // svg's width to 100% and its height to the number given — so the width
        // came back inside the padding and the height did not, and every cell's
        // plot hung 2px past the bottom of its own padding. That is what put the
        // axis labels on the cell's edge.
        j.w = Math.round(b.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
        j.h = Math.round(b.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)) || 0;
      });
      if (plotJobs.some(function (j) { return j.w < 20 || j.h < 10; })) return;
      // Every band has to fit, and each PLOT is fitted on its own.
      //
      // Two things were wrong with one unit for the whole matrix. It let bands that
      // could not fit run past their band to be clipped — on the grounds that a
      // clipped pile reads as "off the scale". It does not: it reads as a flat top,
      // which is a shape, and unfiltered that was happening to 54% of the bars on
      // screen. And once nothing may be clipped, one shared unit is set by the
      // single deepest band anywhere in the matrix — under model_correct:0 that is
      // Pathway 1, which puts 43 of the 64 conversations in one bin because it has
      // only 5% of its range left. Every other cell then drew at that unit and the
      // median band came out 18% full. Per plot it is 84%.
      //
      // What is given up is comparing bar heights BETWEEN cells. That was never
      // really on offer: it was being paid for by clipping the cells that would
      // have contradicted it. Inside a cell the two bands still share a unit, which
      // is the comparison a cell exists to make — does this group sit where that
      // one does — and the range bar under each pathway name is what says how much
      // of its spread is left.
      const FLOOR = 1;
      const measured = [];
      plotJobs.forEach(function (j) {
        // Must match what histPlot will actually use, or the fit is computed for a
        // wider plot than gets drawn and the bars come out taller than measured.
        const plotW = j.w - (j.labels ? COMPACT_LABEL_W : 8) - PAD_R;
        const bandH = (j.h - (j.noAxis ? 0 : AXIS_H) - PAD_T) / j.bands.length;
        j.bands.forEach(function (b) {
          measured.push({ b: b, j: j, plotW: plotW, bandH: bandH });
        });
      });
      // The largest unit at which every band in `set` fits, exactly, so the deepest
      // band on screen reaches the top of its lane and everything else is drawn in
      // proportion to it. A ladder of fixed steps used to be walked here instead,
      // and it left the tallest bar anywhere between 81% and 95% of its lane.
      function unitOver(set) {
        let u = Infinity;
        set.forEach(function (m) {
          const depth = stackAt(m.b.vals, m.j.lo, m.j.hi, m.plotW, 1);
          if (depth > 0) u = Math.min(u, (m.bandH - LANE_GUTTER) / depth);
        });
        return isFinite(u) ? Math.max(0.01, u) : FLOOR;
      }
      // ONE unit for everything on screen — every cell and every pathway stub — so
      // a bar of a given height means the same number of conversations wherever it
      // is, including down the stub column and between a stub and the cells in its
      // row. Letting the stubs fit themselves was tried: it kept the cells from
      // being squashed, but it left the three stubs disagreeing with EACH OTHER by
      // up to 4.3x under a filter, which is the one place a reader is most likely
      // to compare, since they sit in one column on one axis.
      //
      // That squashing is why .d3-pathplot is 62px now. A stub band was 19px
      // against a cell's 41.5, so with one unit the stub was always the binding
      // constraint and the cells drew at a fifth of the scale they could have.
      const sharedUnit = unitOver(measured);
      function unitFor() { return sharedUnit; }
      // The close-ups still open at a scale tied to the matrix, so a zoom is the
      // same picture larger. A cell's own unit is the one to carry across, and the
      // cells are the labelled jobs; the stubs are the unlabelled ones and have a
      // plot of their own height.
      const cellJob = plotJobs.filter(function (j) { return j.labels; })[0];
      fitUnit = sharedUnit;
      fitCellPlotH = cellJob ? (cellJob.h - AXIS_H - PAD_T) : 0;
      fitCellPlotW = cellJob ? (cellJob.w - COMPACT_LABEL_W - PAD_R) : 0;
      // A stub draws one band, so its lane is the whole plot.
      const stubJob = plotJobs.filter(function (j) { return !j.labels; })[0];
      fitStubLane = stubJob
        ? (stubJob.h - (stubJob.noAxis ? 0 : AXIS_H) - PAD_T) / stubJob.bands.length - LANE_GUTTER
        : 0;
      plotJobs.forEach(function (j) {
        const u = unitFor(j);
        // The close-up of a pathway reproduces its stub exactly, so it needs the
        // unit the stub was actually drawn at rather than a recomputation that
        // might land on a different rung of the ladder.
        if (j.pa) j.pa.stubUnit = u;
        j.el.innerHTML = "";
        j.el.appendChild(histPlot(j.bands, j.lo, j.hi, j.w, j.h,
          { noLabels: !j.labels, compact: true, noAxis: j.noAxis, unit: u }));
      });
    }

    // The unit a close-up should draw at: the matrix's, grown by the ratio between
    // its lane and a matrix cell's. 0 hands the plot back to fitting itself, which
    // is what happens if the matrix has not been measured yet.
    function detailUnit(H) {
      if (!fitUnit || !fitCellPlotH) return 0;
      return fitUnit * ((H - AXIS_H - PAD_T) / fitCellPlotH);
    }

    // A close-up has to be the cell ENLARGED, which means one zoom factor on both
    // axes. It was a fixed 530 x 230 with the unit scaled by the height ratio
    // alone: 5.79x across, 2.43x down, so the same data that was a spike in the
    // cell arrived as a broad low mound. Every bar was the same fraction of its
    // band as in the cell, which is what was being checked, and the picture was
    // still wrong — fill is not shape.
    //
    // So the zoom is picked from whichever axis runs out of room first, and the
    // plot is sized from it. Capped, because a 4-bar cell can otherwise ask for a
    // zoom that makes the card taller than the screen.
    // 26px of horizontal padding and 4 of border; the height budget is the panel
    // the card is opening over, less its own head and padding. Measured from the
    // scroller rather than the window: the card lives inside the AP frame.
    function detailAvailW() { return Math.min(560, scroll.clientWidth * 0.92) - 30; }
    function detailAvailH() {
      return (wrap.clientHeight || scroll.clientHeight) * 0.94 - 46 - 22;
    }
    const DETAIL_MAX_ZOOM = 6;
    // The close-up filled almost the whole panel. 0.75 of whatever fits, applied to
    // the zoom itself, so the plot, its label gutter and its type all come down
    // together and the picture is unchanged — only smaller.
    const DETAIL_SCALE = 0.75;
    // The label gutter and the right margin do NOT scale with the plot, because the
    // type in them does not either. 84 holds the widest band label at 14px; 14 holds
    // the half of a 12px end tick that hangs past the axis, which an svg would
    // otherwise clip. One pair of values, used by both kinds of close-up.
    const DETAIL_LABW = 84;
    const DETAIL_PADR = 14;
    // srcW/srcLane are the plot this close-up is enlarging — a matrix cell for a
    // cell close-up, the row's stub for a pathway one. The two sources are very
    // different shapes (a cell's lane is 1.83 plot-widths, a stub's is 10.3,
    // because a stub is a sliver in a row header), so the two kinds of card come
    // out different shapes too. That is the point: a zoom keeps the shape of what
    // was clicked, and what was clicked differs.
    function detailGeom(availW, availH, labW, nBands, srcW, srcLane) {
      if (!srcW || !srcLane) return { W: 530, H: 230, k: 1 };
      const padR = DETAIL_PADR;
      // Height is worked back from the LANE, not from the plot box. LANE_GUTTER is
      // a fixed 3px taken off every lane and it does not scale, so matching the
      // boxes left the bars 5.5% taller against their lane than in the cell — the
      // aspect came out 1.73 where the cell's is 1.83. What has to be equal is
      // lane-to-plotW, since that is the shape.
      const k = Math.max(0.5, DETAIL_SCALE * Math.min(DETAIL_MAX_ZOOM,
        (availW - labW - padR) / srcW,
        ((availH - AXIS_H - PAD_T) / nBands - LANE_GUTTER) / srcLane));
      return { W: Math.round(labW + padR + srcW * k),
               H: Math.round(AXIS_H + PAD_T + nBands * (srcLane * k + LANE_GUTTER)), k: k };
    }

    function histCell(row, pi, r) {
      const el = document.createElement("div");
      el.className = "d3-cell hist";
      // Hovering a panel paints it the colour its correlation has in the other
      // view, so the two readings of one pair are tied together: piles that sit on
      // top of each other come up pale, piles that separate come up deep. It is
      // also what earns the key on the right its place in this view.
      //
      // On the CELL, not on the ::after overlay the grey wash uses — that overlay
      // sits above the plot, so an opaque colour there would hide the histogram it
      // is meant to be annotating. The cell's background is behind the SVG.
      if (isFinite(r)) {
        const flat = Math.abs(r) < 0.005;
        el.classList.add("hascorr");
        el.style.setProperty("--corr", flat ? "#FFFFFF" : rampHex(r));
        el.style.setProperty("--barfill", flat ? "#1E242C" : rampBarInk(r));
        // Read by the delegated listener that drives the marker on the key. No
        // title: a native tooltip waits a second, cannot be styled, covers the
        // histogram it is describing, and does not exist on the tablets this runs
        // on. The marker says the same thing faster and in a fixed place.
        el.dataset.r = r;
      }
      const gv = row.gvals || row.vals;
      const bands = row.groups.map(function (g) {
        const vals = [];
        for (let i = 0; i < items.length; i++) if (gv[i] === g[0]) vals.push(paths[pi].vals[i]);
        return { label: g[1], vals: vals };
      });
      // Half the previous size. 26px a band left most of each panel empty above
      // the bars; 13 holds them without capping any bin, since the unit shrinks to
      // whatever the band allows. The axis strip and top pad are
      // NOT halved — they hold tick text, and 8px cannot.
      // noLabels: "Approach / Wait" is redrawn in all four cells of a column and
      // is the same in every one — and the column heading's marginal already names
      // each band and counts it. A quarter of the plot's width was going on a
      // caption sitting directly above it, four times over.
      // Labelled in every cell. It repeats the column heading, but which pile is
      // which is the thing the panel exists to show, and leaving it to be inferred
      // from the heading's line order made the pairs unreadable.
      plotJobs.push({ el: el, bands: bands, lo: paths[pi].lo, hi: paths[pi].hi, labels: true });
      el.appendChild(histPlot(bands, paths[pi].lo, paths[pi].hi, 210,
        Math.max(40, 13 * bands.length + AXIS_H + PAD_T),
        { noLabels: true, compact: true }));
      return el;
    }

    // The marginals the sketch puts in the headers: what each variable looks like
    // on its own, before anything is compared. An attribute that is 95% one value
    // cannot correlate with much, and that is visible here and nowhere else.
    // How much of this column's usual range the filter left standing. Without it
    // a narrow column just looks like a broken plot: filtered to the model's
    // mistakes, Pathway 1 moves across 0.4 of the 7.9 it spans over all 800, and
    // that IS the finding — the model only errs when Pathway 1 has nothing to say
    // — but on a shared axis it draws as a featureless spike at zero.
    function rangeBar(pa) {
      const full = pa.full || pa.vals;
      const fLo = Math.min.apply(null, full), fHi = Math.max.apply(null, full);
      const vLo = Math.min.apply(null, pa.vals), vHi = Math.max.apply(null, pa.vals);
      const span = fHi - fLo;
      const frac = span > 0 ? (vHi - vLo) / span : 1;
      const el = document.createElement("div");
      // Every row's bar is drawn the same. A pathway the filter has all but
      // flattened used to be picked out in colour as well, on the grounds that it
      // is the one worth looking at — but the caption already says "4% of the
      // range" and the fill is already a sliver, so the colour was a third way of
      // saying the same thing, and the only strong colours available here mean
      // something else on this screen.
      el.className = "d3-range";
      const track = document.createElement("i");
      track.className = "d3-range-track";
      // Positions are on the SHARED axis the histogram above uses, not on this
      // pathway's own min and max. Drawn against its own range the bar was a
      // different scale from the plot it sits under — aligning the two while they
      // disagreed would have invited a reading that is not true.
      const axSpan = pa.hi - pa.lo;
      const at = function (v) { return ((v - pa.lo) / axSpan) * 100; };
      const fullSeg = document.createElement("i");
      fullSeg.className = "d3-range-full";
      fullSeg.style.left = at(fLo).toFixed(2) + "%";
      fullSeg.style.width = Math.max(1.5, at(fHi) - at(fLo)).toFixed(2) + "%";
      track.appendChild(fullSeg);
      const fill = document.createElement("i");
      fill.className = "d3-range-fill";
      // Floored so a collapsed span still shows WHERE it collapsed.
      fill.style.left = at(vLo).toFixed(2) + "%";
      fill.style.width = Math.max(1.5, at(vHi) - at(vLo)).toFixed(2) + "%";
      track.appendChild(fill);
      const cap = document.createElement("span");
      cap.className = "cap";
      // The words are back: they were dropped when the caption had to share a row
      // with the bar, and on its own line there is 118px for a string that measures
      // about 50. The tooltip still spells out both spans in full.
      cap.textContent = Math.round(frac * 100) + "% of the range";
      el.appendChild(track);
      el.appendChild(cap);
      el.title = "These " + pa.vals.length + " conversations span " +
        vLo.toFixed(2) + " to " + vHi.toFixed(2) + ". Over all " + ALL.length +
        " this column spans " + fLo.toFixed(2) + " to " + fHi.toFixed(2) + ".";
      return el;
    }

    function pathMarginal(pa) {
      const box = document.createElement("div");
      box.className = "d3-margbox";
      const plot = document.createElement("div");
      plot.className = "d3-pathplot";
      box.appendChild(plot);
      // Fitted with the cells, so a dot means the same thing in the stub as it
      // does in the matrix beside it.
      plotJobs.push({ el: plot, bands: [{ label: "", vals: pa.vals }],
                      lo: pa.lo, hi: pa.hi, pa: pa });
      plot.appendChild(histPlot([{ label: "", vals: pa.vals }], pa.lo, pa.hi, 210, 62,
        { noLabels: true, compact: true }));
      // The "N% of the range" bar, under the histogram in Histograms view only —
      // the whole box collapses in Correlations, so nothing extra is needed to hide
      // it there. Taken out on 2026-09-02 and put back the same day: it is the one
      // place the amount of spread a filter has left is given as a NUMBER, and the
      // About text leans on it.
      box.appendChild(rangeBar(pa));
      return box;
    }

    function rowMarginal(row) {
      const gv = row.gvals || row.vals;
      const counts = row.groups.map(function (g) {
        let n = 0;
        for (let i = 0; i < gv.length; i++) if (gv[i] === g[0]) n++;
        return { label: g[1], n: n };
      });
      const most = Math.max.apply(null, counts.map(function (c) { return c.n; })) || 1;
      const el = document.createElement("div");
      el.className = "d3-marg";
      counts.forEach(function (c) {
        const b = document.createElement("div");
        b.className = "d3-margrow";
        const bar = document.createElement("i");
        // 4px so an empty group still shows a stub, up to 26 — the width that is
        // actually free once the longest label and the count have theirs.
        bar.style.width = (4 + 22 * c.n / most).toFixed(1) + "px";
        const lab = document.createElement("span");
        lab.textContent = c.label;
        const n = document.createElement("em");
        n.textContent = c.n;
        b.appendChild(bar); b.appendChild(lab); b.appendChild(n);
        el.appendChild(b);
      });
      return el;
    }

    // Below this, r swings wildly on one or two conversations and reads as a
    // finding when it is not. Every cell shares the same n, so the whole matrix
    // says so rather than marking cells individually.
    const MIN_N = 12;

    function render() {
      const n = items.length;
      title.textContent = "Correlations over " + n + " of " + ALL.length + " conversations";
      if (n < MIN_N) {
        scroll.innerHTML = "";
        scrollWrap.classList.remove("showkey");
        setNote(n === 0
          ? "Nothing matches that filter."
          : "Only " + n + " conversations match. A correlation over so few is mostly "
            + "noise — widen the filter to at least " + MIN_N + " to read this matrix.");
        syncViews();
        // Nothing drawn, so there is nothing to open.
        viewHint.hidden = true;
        return;
      }
      buildSeries();
      syncViews();
      viewHint.hidden = view !== "hist";
      // Settled before the grid is built, not after: the note is a flex sibling of
      // the table, so whether it is showing decides how much height sizeRows() has
      // to divide. Setting it afterwards made the first pass measure against the
      // old height and left the ResizeObserver to correct it a frame later.
      setNote("");
      scroll.innerHTML = "";
      // The trigger it would hand focus back to is about to be destroyed.
      closeDetail();
      plotJobs.length = 0;
      // The key explains the fills, so it belongs to the correlation view only.
      // Shown in both views: graph cells take their correlation's colour on hover,
      // so the key explains something here too. It costs no layout either way —
      // the legend is toggled with visibility, so its column is reserved in both.
      scrollWrap.classList.add("showkey");
      // Pathways down the side, the things they might line up with across the
      // top. R is still indexed [series][pathway] — the transpose is in the
      // laying out, not in the arithmetic, so the correlations are untouched.
      const grid = document.createElement("div");
      grid.className = "d3-grid " + view;
      // ONE geometry for both views, so switching changes what is inside a cell
      // and never where the cell is. The stub is the Histograms view's requirement (the
      // pathway dot plot lives there); the columns simply divide what is left, so
      // nothing overflows and neither view scrolls.
      // minmax(0, 1fr), not 1fr: a bare 1fr is minmax(AUTO, 1fr), so a column can
      // be pushed wider by its own longest word. That is why the columns came out
      // 85 to 96 wide under the correlation headings and a uniform 100 under the
      // graph ones — the same grid measuring different contents. A zero minimum
      // makes every column exactly equal in both views.
      grid.style.gridTemplateColumns =
        STUB + "px repeat(" + rows.length + ", minmax(0, 1fr))";

      // The key's label holds the stub column, so the scale starts where the
      // correlations do. Set here rather than where the legend is built: STUB is
      // declared further down and is still in its dead zone up there.
      legendLabel.style.width = STUB + "px";
      // Set here rather than in buildSeries, so it can never be out of step with
      // the grid sizeRows() is about to measure against.
      rowCount = paths.length;
      sizeRows(grid);
      const corner = document.createElement("div");
      corner.className = "d3-corner";
      grid.appendChild(corner);
      rows.forEach(function (row, ri) {
        const h = document.createElement("div");
        // No styling hangs off `commissioned` any more — tinting these headings was
        // tried and read badly against the rest of the table. The class stays
        // because placeBand() counts them to size the band above them.
        h.className = "d3-colhead" + (ri < 2 ? " outcome" : "") + (ri === 1 ? " sep" : "")
          + (row.commissioned ? " commissioned" : "");
        // Name and counts travel together, so one transform moves both.
        const inner = document.createElement("div");
        inner.className = "d3-headinner" + (view === "corr" ? " nocounts" : "");
        h.appendChild(inner);
        // Attributes only. The outcome columns are the first two — the same `ri < 2`
        // the .outcome class above keys off — and they are not attributes: there is
        // no coding to illustrate for "Actual label", and no colour to give it.
        if (ri >= 2 && ATTR_FAINT[row.key]) {
          // The attribute's colour at its lightest, on the heading of that
          // attribute's column. Set on the head rather than the inner because the
          // head is what is sticky and what paints the white it would otherwise
          // scroll under.
          h.style.background = ATTR_FAINT[row.key];
        }
        if (ri >= 2) {
          const ico = document.createElement("span");
          ico.className = "attr-ico";
          ico.setAttribute("aria-hidden", "true");
          ico.innerHTML = alienMark(row.key, 24);
          inner.appendChild(ico);
        }
        const nm = document.createElement("div");
        nm.className = "d3-colname";
        // Broken at the FIRST space, so every heading is two lines and they all sit
        // on the same two baselines. Left to wrap naturally the band was ragged —
        // "Group size" and "Near water" fit on one line at this width while
        // "Engaged in a task" took two.
        //
        // First rather than last: every two-word name breaks identically either way,
        // but the longer ones read properly. "Engaged in a task" was splitting as
        // "Engaged in a / task", which orphans an article and a preposition on the
        // first line; it is "Engaged / in a task" now. Same for "Carrying a burden".
        const cut = row.label.indexOf(" ");
        if (cut > 0) {
          nm.appendChild(document.createTextNode(row.label.slice(0, cut)));
          nm.appendChild(document.createElement("br"));
          nm.appendChild(document.createTextNode(row.label.slice(cut + 1)));
        } else {
          nm.textContent = row.label;
        }
        inner.appendChild(nm);
        // In BOTH views. How the conversations divide between a column's values is
        // what decides whether a correlation could exist at all, so it belongs over
        // the correlations as much as over the plots — and drawing it either way is
        // what lets the two views share one set of headings.
        inner.appendChild(rowMarginal(row));
        grid.appendChild(h);
      });
      paths.forEach(function (pa, pi) {
        const lab = document.createElement("div");
        lab.className = "d3-rowhead" + (pa.derived ? " derived" : "");
        // Same arrangement as the column headings, but only the PLOT comes and
        // goes. The plot is the "before splitting" reference for the cells beside
        // it in Histograms view and has no counterpart in correlation view; the range
        // bar is a caveat on the numbers themselves — Pathway 1 sits at 4% of its
        // full range here, which is exactly why its whole row is +/-0.01 — so it
        // stays in both. It is what keeps a row of near-zeros from reading as
        // "this pathway has nothing to do with anything".
        const sInner = document.createElement("div");
        sInner.className = "d3-stubinner" + (view === "corr" ? " noplot" : "");
        lab.appendChild(sInner);
        const nm = document.createElement("div");
        nm.className = "d3-rowname";
        nm.textContent = pa.label;
        sInner.appendChild(nm);
        sInner.appendChild(pathMarginal(pa));
        // Clickable in Histograms view only, matching the cells — and for the same
        // reason: correlation view has no plots, so there is nothing to open up.
        if (view === "hist") {
          lab.setAttribute("role", "button");
          lab.setAttribute("tabindex", "0");
          lab.setAttribute("aria-label", pa.label + ", show across all conversations");
          lab.addEventListener("click", function () { openPathwayDetail(pa, pi, lab); });
          lab.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              openPathwayDetail(pa, pi, lab);
            }
          });
        }
        grid.appendChild(lab);
        rows.forEach(function (row, ri) {
          const cell = view === "corr" ? corrCell(R[ri][pi]) : histCell(row, pi, R[ri][pi]);
          if (ri === 1) cell.classList.add("sep");
          // Graph view only. A correlation cell is a colour and a number, and the
          // detail behind it is the distribution — which is what Histograms view already
          // shows, so the panel belongs to that view. It also keeps the correlation
          // cells free of any hover treatment, which would have washed over the
          // fill that IS the reading. A real button rather than a bare click
          // handler, so it is reachable and operable from the keyboard.
          if (view === "hist") {
            cell.setAttribute("role", "button");
            cell.setAttribute("tabindex", "0");
            cell.setAttribute("aria-label",
              paths[pi].label + " against " + row.label + ", show detail");
            cell.addEventListener("click", function () { openDetail(row, ri, pi, cell); });
            cell.addEventListener("keydown", function (e) {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                openDetail(row, ri, pi, cell);
              }
            });
          }
          grid.appendChild(cell);
        });
      });
      scroll.appendChild(grid);
      if (bandWatch) { bandWatch.disconnect(); bandWatch.observe(grid); }

      // Nothing is written under the matrix any more: what a square means, what a
      // dot means, and what a flat row does to the reading all moved into About on
      // 2026-09-01. The element stays only because the too-few-conversations path
      // above still writes to it — cleared at the top of this draw.
      // Again, now the grid is populated. The call up at gridTemplateColumns sets
      // the row heights, but it runs before a single stub exists — and the stub is
      // what --stub-lift has to be measured from.
      sizeRows(grid);
      fitPlots();
      placeHeads();
      placeBand();
      syncFade();
    }

    // Opens on the conversations the model got wrong, which is where the day's
    // finding lives: over all 800 Pathway 3 lines up with nothing you can see,
    // and only in here does it become the strongest thing in the matrix.
    filter.input.value = "model_correct:0";
    filter.input.dispatchEvent(new Event("input", { bubbles: true }));

    render();

    // The app calls this whenever the frame changes — a layout switch, a device
    // switch, a window resize. It was a no-op here, so the columns moved underneath
    // the "Commissioned" band and it kept the previous layout's left and width,
    // sitting short of the two columns it names. Nothing else was watching: the
    // ResizeObserver on the scroller reports the scroller, and a layout change moves
    // the columns without it reporting in time.
    SIM.onResize = function () {
      sizeRows();
      placeBand();
      fitPlots();
      syncFade();
    };

    // Everything above runs before this panel is in the document, so the scroller
    // measures 0 and sizeRows has nothing to divide. The ResizeObserver was doing
    // the real measurement, but it only fires when the scroller CHANGES size — true
    // the first time a sim is opened (0 to 415) and false on every switch after
    // that, because the previous sim left the scroller at its full height. So the
    // table was drawn short on re-entry. This is the one measurement that is
    // guaranteed to happen after mount.
    const afterMount = setTimeout(function () {
      sizeRows();
      fitPlots();
      placeBand();
      syncFade();
    }, 0);
    SIM._timeouts.push(afterMount);

    // Part 2 reads what Investigate Pathway 3 commissioned, so arriving with
    // nothing commissioned means arriving at a matrix identical to Correlations,
    // with no way to tell that anything is missing. This says so. Built on the
    // close-up's scrim and card, so it looks like the other panels here.
    if (partTwo && !NNM_COMMISSIONED.length) {
      const scrim = document.createElement("div");
      scrim.className = "d3-scrim";
      const card = document.createElement("div");
      card.className = "d3-detail d3-hintcard";
      card.setAttribute("role", "dialog");
      card.setAttribute("aria-modal", "true");
      card.setAttribute("aria-label", "Nothing commissioned yet");
      const head = document.createElement("div");
      head.className = "d3-detail-head";
      const title = document.createElement("div");
      title.className = "d3-detail-title";
      title.textContent = "Nothing commissioned yet";
      const x = document.createElement("button");
      x.className = "d3-detail-close";
      x.innerHTML = "&times;";
      x.setAttribute("aria-label", "Close");
      head.appendChild(title);
      head.appendChild(x);
      const body = document.createElement("div");
      body.className = "d3-detail-body d3-hintbody";
      body.textContent = "For this prototype, go to Investigate P3 and commission "
        + "1 or 2 codings to see an update.";
      card.appendChild(head);
      card.appendChild(body);
      scrim.appendChild(card);
      function closeHint() {
        scrim.remove();
        document.removeEventListener("keydown", hintKeys);
      }
      function hintKeys(e) {
        if (e.key === "Escape") { e.stopPropagation(); closeHint(); }
      }
      x.addEventListener("click", closeHint);
      scrim.addEventListener("click", function (e) { if (e.target === scrim) closeHint(); });
      document.addEventListener("keydown", hintKeys);
      // Parked so a sim switch takes the listener with it — _observers is emptied
      // by disconnect(), which is all this needs to be.
      SIM._observers.push({ disconnect: function () {
        document.removeEventListener("keydown", hintKeys);
      } });
      wrap.appendChild(scrim);
      x.focus();
    }

    return wrap;
  }


  // ---------------------------------------------------------------
  // 2B — The Prediction Chain.  Laid out to match Design Sketches p.3:
  // left, one card holding all three pathway readings; right, the flow
  // activation x importance => weighted, the three converging on a sum,
  // the sum choosing between two outcomes, and the stacked bar beneath.
  // Probability is omitted on purpose (spec: "not visible, for internal").
  // ---------------------------------------------------------------
  if (activeSim === "d2b") {
    const D = simData();
    const NP = D.nPathways;
    const IMP = D.importance;
    // Pathways are numbered from 1 for students. The data — act[], importance[],
    // explainedVariance[], baseValues[] — is indexed from 0 and stays that way,
    // so every label is the index plus PATH_OFFSET and nothing else converts.
    const PATH_NAMES = Array.from(
      { length: D.nPathways },
      function (_, i) { return "Pathway " + (i + PATH_OFFSET); }
    );
    // Area-proportional, not side-proportional: if the side tracked the value,
    // doubling it would quadruple the ink. side = MAX * sqrt(v / scale) makes the
    // AREA track the value, which is what the eye actually judges.
    // SIZE is measured against one scale for all four columns, so a square means
    // the same thing wherever it appears — and so the chain can be read across:
    // activation x importance visibly grows or shrinks into the weighted value.
    // Per-column sizing made that invisible, because it rescaled the result back
    // to the same apparent size as the input.
    // COLOUR stays per-column: activations are at most 6% of the shared scale, so
    // colouring them against it would wash the whole column out to nothing.
    function sizeSym(cell, v, sizeScale, colourScale) {
      const sq = cell.querySelector(".nnm-sq");
      if (!sq) return;
      const scale = colourScale === undefined ? sizeScale : colourScale;
      const t = Math.sqrt(Math.min(1, Math.abs(v) / sizeScale));
      const side = SYM_MIN + (SYM_MAX - SYM_MIN) * t;
      sq.style.width = side.toFixed(1) + "px";
      sq.style.height = side.toFixed(1) + "px";
      // Importance is drawn as an outline, not a fill — it is a property of the
      // MODEL rather than a value a step produced, the same distinction the grey
      // number already makes. The outline takes the darkest shade of its own
      // sign, so the direction still reads at a glance while the box stays
      // plainly a reference. Its corners are square (see the CSS) for the same
      // reason: nothing else in the panel is, so the difference is the mark.
      if (cell.classList.contains("imp")) {
        sq.style.background = "transparent";
        sq.style.boxShadow = "inset 0 0 0 1px " + (v >= 0 ? FILL_POS[4] : FILL_NEG[4]);
        return;
      }
      // Zero has no sign, and the legend already says so — its ramp runs
      // blue - white - orange. Tinting the opening square the lightest positive
      // shade claimed a direction the value does not have; it starts white and
      // takes a colour only once a word has moved it.
      sq.style.background = v === 0 ? "#FFFFFF"
        : (v > 0 ? FILL_POS : FILL_NEG)[level(Math.min(1, Math.abs(v) / scale))];
    }

    // One way in for every value the three symbol cells show, so the number and
    // its square can never disagree.
    function writeCell(cell, v, colourScale, sizeScale) {
      const num = cell.querySelector(".nnm-num");
      // 4dp throughout. Importance needs it because Pathway 2's is 0.0854 and 2dp
      // read 0.09 — 5.4% high on the one number whose smallness is the point. The
      // computed columns need it because at 3dp seven values across the 800 came
      // out as "+0.000"/"−0.000"; the smallest anywhere is −0.000135, so 4dp
      // clears every one of them.
      (num || cell).textContent = fmt(v, 4);
      paint(cell, v, colourScale);
      sizeSym(cell, v, sizeScale === undefined ? colourScale : sizeScale, colourScale);
    }

    function paint(el, v, scale) {
      const L = level(Math.min(1, Math.abs(v) / scale));
      el.style.background = (v >= 0 ? FILL_POS : FILL_NEG)[L];
      el.style.color = L === 4 ? "#fff" : "#1E242C";
      el.style.borderColor = L === 4 ? "transparent" : "rgba(30,36,44,0.14)";
    }

    const SUM_SCALE = 40;
    // Squares are sized against the largest value the whole dataset produces, so a
    // square means the same thing on every conversation. The weighted values and
    // the sum share one scale because the sum IS those three added — sharing is
    // what makes that readable. Activation keeps its own: it spans +-4.8 against
    // the weighted +-74, and one scale across both would flatten it to nothing.
    const SYM_SCALE = (function () {
      let m = 0;
      D.items.forEach(function (it) {
        let s = 0;
        for (let p = 0; p < NP; p++) {
          const w = it.act[p] * IMP[p];
          s += w;
          m = Math.max(m, Math.abs(w));
        }
        m = Math.max(m, Math.abs(s));
      });
      return m;
    })();
    // Side of the largest square. The squares are absolutely positioned, so they
    // do not drive layout width — only the cells do — and the sum's square is free
    // to overhang its 62px cell into the blank either side of it. The real limit
    // is vertical: the cell must be tall enough to centre this and still clear the
    // number below, and the rows (and through syncRows, the readings) follow.
    const SYM_MAX = 68;
    const SYM_MIN = 12;   // and of the smallest, so a zero still reads as a square
