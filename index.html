     with the closing height rather than snapping when it lands. */
  .d3b-convbody .d3b-subhead {
    transition: margin-top 0.26s cubic-bezier(.4,0,.2,1), border-top-color 0.26s ease;
  }
  .d3b-disc[aria-expanded="false"] { margin-bottom: 0; }
  .d3b-disc[aria-expanded="false"] + .d3b-discwrap + .d3b-subhead {
    margin-top: 0; border-top-color: transparent;
  }
  /* The notes scroll inside their own block rather than pushing the chips out of
     the card. The chips have to stay in view: they are where a commissioned
     attribute turns up, and the whole point of reading the notes is to decide
     what to commission.
     min-height: 0, not 90. At 90 the notes stopped giving height back part way
     through opening the Pathway 3 disclosure — it wants 158px and they could only
     surrender 151 — so the last 14px came out of the card instead and carried the
     chips down with it. The notes are the elastic part of this card by design, so
     nothing should stop them shrinking; they keep their own scrollbar, so a short
     notes block is still a readable one. */
  .d3b-convbody .d3b-notes { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .d3b-convbody .d3b-known { flex-shrink: 0; padding-top: 8px; }
  .d3b-count {
    margin-left: auto; font-family: var(--nnm-mono); font-size: 11.5px;
    color: var(--nnm-ink-2); font-variant-numeric: tabular-nums;
  }
  .d3b-conv .nnm-nav { margin-left: 8px; }
  .d3b-panel { flex: 1; min-height: 0; }
  /* The panel scrolls in its LIST, not as a whole, so the note at the top stays put
     while the codings scroll under it. (It also used to hold a findings block below
     the list on screen; that block is gone, but scrolling the list rather than the
     panel is still the right behaviour for the note.) */
  .d3b-body {
    display: flex; flex-direction: column; gap: 12px;
    overflow: hidden; min-height: 0;
  }
  .d3b-body .d3b-subnote { flex-shrink: 0; }
  .d3b-body .d3b-list { flex: 1 1 auto; min-height: 60px; overflow-y: auto; }
  .d3b-budget {
    margin-left: auto; font-family: var(--nnm-mono); font-size: 11.5px; color: var(--nnm-ink-3);
  }
  .d3b-notes {
    font-family: 'Lato', sans-serif; font-size: 13.5px; line-height: 1.55;
    color: var(--nnm-ink); background: var(--nnm-surface);
    border-left: 3px solid #C6D2E2; border-radius: 0 5px 5px 0;
  }
  /* The padding lives here so the box above it can shrink the whole way. Trace a
     Case shares .d3b-notes but builds no inner element — its notes are not the
     elastic part of anything, so they keep the padding on the box itself. Without
     this line they lost it altogether when the padding moved in here. */
  .d3b-notesinner { padding: 10px 12px; }
  .d1a-notes { padding: 10px 12px; }
  /* 4 both ways. The pills are a set — what this conversation is already coded for
     — so they should read as one block rather than as a scatter, and an equal gap is
     what makes a wrapped group read as a block. It changes no wrapping: the widest
     row is 300px of pills in a 315px column either way, and a third pill would need
     another 110. */
  .d3b-known { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  /* No icon on this one — it stands for the whole set, not for a coding, so a
     placeholder circle would promise artwork that will never exist. It keeps the
     others' height instead, and takes their left padding back since there is
     nothing to sit beside the text. */
  /* Two classes, because .d3b-attr's `padding` shorthand is declared after this rule
     and a single class ties with it on specificity — the longhand lost and the pill
     kept the 6px gutter it has no icon to fill. */
  .d3b-attr.d3b-attr-all { padding-left: 12px; }
  /* Pills again, but each drawn in the colour of the sentence it was read from, so a
     chip and its line in the notes are one object. Nine hues; every one clears 4.5:1
     as text on white, as text on its own hover tint, and as white text on itself
     when filled. young_present went from #2E7D46 to #2A7340 for the middle of those
     three — it measured 4.27 on its own tint. They sit outside the signed ramp on
     purpose: the notes are prose with no value encoded in them, so orange here would
     be borrowing a meaning it does not have. */
  .d3b-attr {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.03em; text-transform: uppercase;
    padding: 3px 12px 3px 6px; border-radius: 999px;
    /* Every pill stands the same height whether it carries an icon or not — the
       All pill has none, and without this it sat 8px shorter than its neighbours.
       Derived from the icon so the two cannot drift: 3+3 padding, 1+1 border. */
    min-height: calc(var(--nnm-attr-ico) + 8px);
    border: 1px solid var(--ac, var(--nnm-rule));
    background: #fff; color: var(--ac, var(--nnm-ink-2)); cursor: pointer;
    transition: background 0.14s ease, color 0.14s ease;
  }
  /* Hover tints the pill; SELECTED fills it. Same specificity, selected declared
     second, so a selected pill takes no hover — it is already at its final state.
     Learned the hard way on .nnm-step, where a guard on one of them silently
     outranked the other. */
  .d3b-attr:hover { background: var(--ac-soft, var(--nnm-surface)); }
  /* Pressing shows the state the press is about to produce — the pill's own colour,
     which is exactly what aria-pressed gives it. Hover previews at 20%, the press at
     full, so the two read as one gesture arriving. Declared before the pressed rule
     below so a selected pill keeps its own state under the finger. */
  .d3b-attr:active { background: var(--ac, var(--nnm-ink-2)); color: #fff; }
  .d3b-attr:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .d3b-attr[aria-pressed="true"] {
    background: var(--ac, var(--nnm-ink-2)); color: #fff;
  }
  /* Which facts were bought is the point of the screen, so a commissioned
     attribute still carries a mark. Weight, not a glyph: a "+" reads as an ACTION —
     something to press to add another — on a control that is already pressable for
     a different reason, and it was a third thing competing with the pill's mark and
     its colour. A heavier border says "this one" without saying anything else, and
     it survives both other states: hover and selected change the background, which
     leaves the border free to mean one thing. It costs no width either, and the
     widest row of pills has 3px to spare. */
  .d3b-attr.new { border-width: 2px; padding-top: 2px; padding-bottom: 2px; }

  .d3b-sent { transition: opacity 0.18s ease, color 0.18s ease; }
  /* Dimmed only where a VISIBLE chip already accounts for the sentence. What stays
     at full strength is everything the coding does not yet capture — the four
     uncommissioned attributes and the fourteen distractors — which is the thing
     the student is here to find. Commissioning an attribute dims its sentences,
     so the notes visibly empty out as the coding catches up. */
  .d3b-sent.coded { opacity: 0.35; }
  /* A lit sentence is drawn the way its pill is when selected — white on the colour,
     not the colour on the page — so the chip and the line read as the same object in
     the same state. box-decoration-break keeps the padding and the rounded ends on
     every line fragment; without it a sentence wrapping across three lines gets one
     rounded start, one rounded end, and two ragged joins in between. */
  .d3b-sent.sel {
    opacity: 1; color: #fff; background: var(--ac);
    border-radius: 3px; padding: 1px 3px;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  .d3b-subhead {
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--nnm-ink-2);
    border-top: 1px solid var(--nnm-rule-soft); padding-top: 10px;
  }
  .d3b-subnote { font-family: 'Lato', sans-serif; font-size: 12px; color: var(--nnm-ink-3); margin-top: -6px; }
  .d3b-list { display: flex; flex-direction: column; gap: 6px; }
  /* Two lines. The top one is the identity and the action — mark, name, and the
     button that buys it — and the description runs the full width underneath, where
     it has the room to be a sentence rather than a column squeezed beside a button. */
  .d3b-item {
    display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px;
    align-items: center; padding: 8px 10px;
    border: 1px solid var(--nnm-rule-soft); border-radius: 6px; background: #fff;
  }
  /* The ground and border come from the attribute's own palette, set inline — see
     renderList. The rule is kept so the state is named here too, and so a coding
     with no colour of its own still reads as coded. */
  .d3b-item.done { background: var(--nnm-surface); border-color: var(--nnm-rule); }
  .d3b-itemname {
    grid-area: 1 / 2;
    font-family: 'Lato', sans-serif; font-size: 13.5px; color: var(--nnm-ink);
  }
  /* Full width from the left edge and under the button too — the title is indented
     past the mark, the description is not. */
  .d3b-itemdesc {
    grid-row: 2; grid-column: 1 / span 3;
    font-family: 'Lato', sans-serif; font-size: 11.5px;
    line-height: 1.4; color: var(--nnm-ink-3);
  }
  .d3b-buy {
    grid-row: 1; grid-column: 3;
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 0 12px; height: 32px; box-sizing: border-box;
    border: 2px solid var(--nnm-rule); background: #fff; color: var(--nnm-ink-2);
    border-radius: 5px; cursor: pointer;
  }
  .d3b-buy:hover:not(:disabled) { background: var(--nnm-surface); }
  /* The house press, the same one Step, Reset and the conversation arrows use. On
     the ROW rather than after it: a button that only changes once its work is done
     leaves the press unacknowledged, and commissioning re-renders the whole list. */
  .d3b-buy:active:not(:disabled) {
    background: var(--nnm-ink); border-color: var(--nnm-ink); color: #fff;
  }
  .d3b-buy:disabled { opacity: 0.45; cursor: default; }

  /* ---- attribute icon placeholders (2026-09-05) ----
     Standing in for artwork that does not exist yet, at the size being tested.
     One class everywhere so a single change swaps every site at once, and one grey
     that is obviously a placeholder rather than a colour anyone chose. */
  /* Holds one alien field mark. The grey disc it used to be was a placeholder for
     exactly this. Size still comes from --nnm-attr-ico so every site changes at
     once, and the mark strokes in currentColor, so a pill's own colour carries
     straight through to it. */
  .attr-ico {
    flex: 0 0 auto; display: block;
    width: var(--nnm-attr-ico); height: var(--nnm-attr-ico);
  }
  .attr-ico svg { display: block; width: 100%; height: 100%; }
  /* Beside the name in the correlation headings, which only fits at this size — the
     arithmetic is on HEAD in the 3A block. The counts underneath are absolutely
     positioned against .d3-headinner, so making the inner a flex row leaves them
     exactly where they were. */
  .d3-headinner { display: flex; align-items: center; justify-content: center; gap: 6px; }
  /* The name box shrinks to its text rather than filling the column, so the icon and
     the title centre together as one group. Filling it left the icon pinned to the
     column's left edge with the centred title floating away from it, and the gap
     changed from column to column with the length of the name. */
  .d3-headinner .d3-colname { flex: 0 1 auto; min-width: 0; }
  .d3b-attr .attr-ico { margin-left: -4px; }
  /* Beside the title only. Every cell in this row is placed explicitly rather than
     left to auto-flow: adding the icon column moved the Commission button, which was
     pinned to column 2 and found itself in the middle. */
  .d3b-item .attr-ico { grid-area: 1 / 1; align-self: center; }

  /* ---- 3A Correlations ---- */
  /* padding-top matches .nnm-stack so the toolbar sits on the same line as 2B's. */
  .d3-wrap {
    display: flex; flex-direction: column; min-height: 0; gap: 10px; padding-top: 9px;
    position: relative;                 /* the cell-detail scrim is laid over this */
  }
  /* The toolbar reuses 2B's column proportions exactly — .nnm's gap, .nnm-leftcol's
     basis, .nnm-rightcol's basis — so the find bar is the same width and sits in the
     same place, and the view switch lands where the Animate toggle does over there. */
  .d3-toolbar { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .d3-filter { flex: 1 1 440px; min-width: 236px; }
  .d3-head { position: relative; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .d3-title {
    font-family: 'Lato', sans-serif; font-size: 15px; color: var(--nnm-ink-2);
  }
  /* The same 560 basis .nnm-rightcol carries, against the filter's 440, so the
     toolbar divides exactly as the two panels beneath it do and the find bar is
     the width it is in the Prediction Chain. No gap: the switch's `margin: 0 auto`
     takes an equal share of whatever is left on each side, which centres it
     between the filter and About at any width — a gap would push it off by half
     of one. */
  .d3-views { display: flex; align-items: center; flex: 1 1 560px; min-width: 318px; }
  /* The auto margins centre the switch inside .d3-views, but the toolbar's own
     10px gap sits to the LEFT of that group and not to the right of it, so a
     switch centred in the group measures 10px further from the filter than from
     About. Backing off half the gap puts it on the true midpoint between the
     filter's right edge and About's left edge. */
  .d3-viewswitch { margin: 0 auto; position: relative; left: -5px; }
  /* One switch with a name on each side, correlation on the left because that is
     the view this opens on. The names ARE the control — no chrome of their own —
     so nothing competes with the thumb for the "which is it on" reading. */
  .d3-viewswitch { display: flex; align-items: center; gap: 10px; }
  .d3-viewbtn {
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 0; height: 36px; box-sizing: border-box;
    border: 0; background: none; color: var(--nnm-ink-2);
    cursor: pointer; white-space: nowrap;
  }
  /* Weight stays 600 in both states: going bold on the chosen name would widen it
     and shove the switch sideways every time it is thrown. Colour carries it, and
     the thumb's position carries it before colour does. --nnm-ink-2 is 6.3:1 on
     white, so the name that is not chosen is still properly readable. */
  .d3-viewbtn.on { color: var(--nnm-ink); }
  /* :not(.on) so pressing the name already chosen does nothing — it is already at
     its final state, the same rule the device toggles follow. */
  .d3-viewbtn:active:not(.on) { color: var(--nnm-ink); }
  .d3-viewbtn:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 2px; border-radius: 3px; }
  /* The Prediction Chain's slider thumb exactly — 24px, white, 2px --nnm-rule —
     with its hover and press states, so the two controls read as one family. */
  .d3-switchtrack {
    position: relative;
    width: 54px; height: 30px;
    box-sizing: border-box;
    flex-shrink: 0;
    border: 2px solid var(--nnm-rule);
    border-radius: 15px;
    background: var(--nnm-surface);
    cursor: pointer;
  }
  .d3-switchthumb {
    position: absolute; left: 1px; top: 1px;
    width: 24px; height: 24px;
    box-sizing: border-box;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--nnm-rule);
    transition: transform 0.2s cubic-bezier(.3,0,.3,1);
  }
  /* 24px of travel: the padding box is 50px wide (54 less two 2px borders), the
     thumb is 24, and it is inset 1px at each end — 50 - 24 - 1 - 1. At 26 it
     would sit hard against the right border instead of mirroring its rest. */
  .d3-switchtrack.hist .d3-switchthumb { transform: translateX(24px); }
  .d3-switchtrack:hover .d3-switchthumb { background: var(--nnm-surface); border-color: #A7B0BC; }
  .d3-switchtrack:active .d3-switchthumb {
    background: var(--nnm-ink); border-color: var(--nnm-ink);
    box-shadow: 0 0 0 4px rgba(30,36,44,0.10);
  }
  /* Centred on the full width of the row, not on what the title leaves over.
     Absolute, so it takes no part in the row's flex and nothing moves when it
     appears. --nnm-ink-2, not the --nnm-ink-3 it used to wear: this is an
     instruction, and ink-3 measures 3.4:1 on white, under the 4.5:1 that 12px
     text has to clear. ink-2 is 6.3:1. */
  .d3-viewhint {
    position: absolute; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    /* 15px, the same size as the title it shares the row with — one type size on
       the line, and the hint does not outrank the thing it sits beside. */
    font-family: 'Lato', sans-serif; font-size: 15px; font-style: italic;
    color: var(--nnm-ink-2); white-space: nowrap;
  }
  .d3-viewhint[hidden] { display: none; }
  .d3-viewbtn:hover { color: var(--nnm-ink); }
  /* The matrix is taller than the panel at every size this runs at, so the last
     row is always cut by the scroll edge. It scrolled before, but nothing said so
     — a row sliced in half just reads as broken. The wrapper carries a fade that
     is switched off once you reach the bottom. */
  /* Column, not row: the key used to stand to the right of the scroller. It is a
     horizontal band under the matrix now, in the space the Pathway 4 row left. */
  .d3-scrollwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0; }
  .d3-fadebox { position: relative; flex: 1; min-width: 0; display: flex; }
  .d3-fadebox::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
    background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 88%);
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.18s ease;
  }
  .d3-fadebox.at-end::after { opacity: 0; }
  .d3-scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; }
  /* A real grid, ruled by the container showing through 1px gaps rather than by
     borders on the cells. Borders double up at every shared edge and drift by a
     subpixel wherever a column lands on a fraction; a gap is exactly one pixel
     everywhere by construction. Because every child paints its own background —
     headings and the pathway stub included — the ruling runs through the whole
     table without a single border being declared. The padding rules the outer
     edge as well as the gaps between children. */
  .d3-grid {
    display: grid;
    grid-template-columns: 130px repeat(3, 1fr);
    gap: 1px;
    padding: 1px;
    background: var(--nnm-rule);
    align-items: stretch;
  }
  .d3-colhead, .d3-rowhead {
    font-family: 'Lato', sans-serif; font-size: 12.5px; color: var(--nnm-ink-2);
    display: flex; align-items: center;
  }
  /* The ruled gaps draw these edges now. */
  /* flex-start, because the transform below does the positioning. */
  .d3-colhead { justify-content: flex-start; padding: 7px 6px; overflow: hidden; }
  /* Only as tall as the column NAME — the counts hang off it absolutely, so they
     never add to its height and the name can be centred in the band when they are
     not showing. Graph view lifts this to the top and the counts appear beneath,
     captioning the plots; correlation view drops it to the middle and takes the
     counts away, since the split they describe is not what a correlation measures. */
  .d3-headinner {
    position: relative; width: 100%;
    transition: transform 0.34s cubic-bezier(.34, 1.08, .5, 1);
  }
  .d3-headinner .d3-marg {
    position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px;
    transition: opacity 0.24s ease;
  }
  /* The two resting states, in CSS rather than measured. The band is a fixed 77,
     its padding 7 a side, and the name is pinned to two lines at 12.5/1.25 = 31 —
     so the slack is 32 and half of it is 16. Declaring it means the heading is
     already in the right place the moment it is built: nothing to measure, and no
     correction to watch happen after the panel mounts. */
  .d3-headinner { transform: translateY(0); }
  .d3-headinner.nocounts { transform: translateY(16px); }
  .d3-headinner.nocounts .d3-marg { opacity: 0; }
  .d3-rowhead { justify-content: flex-start; padding: 6px 10px 6px 8px; overflow: hidden; }
  /* Name and range bar are the block that moves; the plot hangs out of flow between
     them so it can leave without the block changing height. 70px row less 12
     padding is 58 of content; name 15 + range 13 = 28, so the slack is 30 and the
     pair centres at 15. */
  /* Both views centre their block in the row; only the block differs. Histograms
     holds the name and the plot's slot, Correlations the name alone once the slot
     collapses. Two variables rather than one because the two heights are measured
     separately, and one transform so the switch between them animates. The row is
     a column flex box with align-items: stretch and content at the top, so nothing
     centres this for us. Fallbacks cover the frame before the first measurement.
     The plot's slot used to be followed by the "% of the range" bar, which held
     the block down to the bottom of the row; with that gone the block was floating
     at the top with 22px of dead space under it. */
  .d3-stubinner {
    position: relative; width: 100%;
    transform: translateY(var(--graph-lift, 11px));
    transition: transform 0.34s cubic-bezier(.34, 1.08, .5, 1);
  }
  /* The row is a column flex box with align-items: stretch and content at the
     top, so nothing centres the stub for us — this transform is what does it, and
     it is a transform rather than justify-content so the name GLIDES into the
     middle as the range bar collapses instead of jumping there. sizeRows measures
     the block; the fallback is for the frame before the first measurement lands. */
  .d3-stubinner.noplot { transform: translateY(var(--stub-lift, 21px)); }
  /* 44 = the 22px of bars it had at 28, plus AXIS_H and PAD_T for the axis it now
     draws. The stub used to go without one on the grounds that every cell in its
     row carries the same axis on the same scale — but the stub's plot is ~132px
     wide against a cell's ~99, so its scale is stretched differently and the axis
     beside it cannot be borrowed. It was the only histogram on screen with no way
     to see where zero is. */
  /* 62, not 44. The stub shares one unit with every cell now, and its band was
     the shortest on screen at 19px against a cell's 41.5 — so IT set the scale and
     squashed the whole matrix. This is the height the row header has spare once
     the pathway's name and its range bar are placed. */
  .d3-pathplot {
    position: absolute; left: 0; right: 0; top: 0;
    height: 62px;
    transition: opacity 0.24s ease;
  }
  .d3-stubinner.noplot .d3-pathplot { opacity: 0; }
  /* The range bar sits below the plot's slot in Histograms view and directly under the
     name when the plot is gone. */
  /* Positioned, so the plot inside it hangs from the box's own top — against the
     stub it was anchoring to the top of the whole block and drawing over the name.
     The padding is what opens the gap the plot appears in, so it has to be
     transitioned too: without it the name slid up while the range bar jumped its
     28px in one frame. Same curve as the name's, so the two separate together. */
  /* In Correlations the range bar goes the way the plot does: that view is one
     number per column, and the stub is just the pathway's name. Collapsed with a
     max-height rather than display:none, so it leaves with the same movement
     instead of popping. --marg-h is measured in sizeRows — a guessed ceiling
     would spend the first part of the transition doing nothing visible. */
  .d3-margbox {
    position: relative; padding-top: 62px;
    overflow: hidden; max-height: var(--marg-h, 60px);
    transition: padding-top 0.34s cubic-bezier(.34, 1.08, .5, 1),
                max-height 0.34s cubic-bezier(.34, 1.08, .5, 1);
  }
  .d3-stubinner.noplot .d3-margbox { padding-top: 0; max-height: 0; }
  /* Two lines whether or not the label has a space to break at, so the band keeps
     one height and the marginals below it stay level. */
  .d3-colname { min-height: 2.5em; }
  /* Both header bands stay put while the matrix scrolls under them — with eight
     rows you otherwise lose track of which pathway a column is. Opaque, or the
     cells show through; the corner sits above both where they cross. */
  .d3-colhead, .d3-rowhead, .d3-corner { position: sticky; background: #fff; }

  .d3-colhead { top: 0; z-index: 2; }
  /* A band naming the columns Investigate Pathway 3 bought, sitting ON TOP of the
     table rather than inside it — the table's own height is not its to spend. It
     lives at the bottom of the head row, in space that is already there under the
     About button, and is measured onto the columns it names. */
  /* display:flex below would otherwise beat the browser's own [hidden] rule and
     the band would keep painting with `hidden` set — the trap .d3-legend-mark and
     .d3-viewhint each have a line for. */
  .d3-banner[hidden] { display: none; }
  .d3-banner {
    position: absolute; height: 30px;
    display: flex; align-items: center; justify-content: center;
    /* The panel heads' own colours and type — .nnm-panel-head — rather than the
       orange Investigate Pathway 3 marks a bought attribute with. This is a
       heading on the table, so it should look like one. */
    background: var(--nnm-surface); color: var(--nnm-ink-2);
    border: 1px solid var(--nnm-rule); border-bottom: none;
    box-sizing: border-box;
    font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    border-radius: 4px 4px 0 0;
  }
  .d3-rowhead { left: 0; z-index: 2; }
  /* The one cell in the table that is not a heading and not a reading. It still
     has to be there — the grid needs something in that slot or every column shifts
     one to the left — but it should read as empty page, not as an empty box. The
     ruling is the container showing through 1px gaps, so white is painted into the
     two gaps that belong to this cell alone — the grid's own padding above it and
     to its left. NOT a 1px spread on all four sides: the gaps to its right and
     below are the first heading's left border and the first stub's top border, and
     those belong to the table. Three shadows rather than two because the 1px at
     the diagonal corner falls outside both strips. */
  .d3-corner {
    top: 0; left: 0; z-index: 3;
    box-shadow: -1px 0 0 #fff, 0 -1px 0 #fff, -1px -1px 0 #fff;
  }
  /* Pathways are the rows now and the series are the columns, so the outcome
     block — what the model is judged against, as opposed to attributes of the
     scene — is the first three COLUMNS. A heavier heading and a tinted cell keep
     the two blocks apart, as the explorer does. */
  .d3-colhead.outcome { color: var(--nnm-ink); font-weight: 600; }
  /* The heavier weight marks the outcome HEADINGS, not their counts — inherited,
     it made the same marginal look like two different things across the band. */
  .d3-colhead.outcome .d3-marg { color: var(--nnm-ink-2); font-weight: 400; }
  /* A tint no longer separates the outcome block from the attributes — every cell
     carries its own fill now — so the boundary is drawn instead, on the last
     column of the block. */
  .d3-colhead.sep, .d3-cell.sep { border-right: 2px solid var(--nnm-rule); }
  /* No radius: the cells tile, and a rounded corner would break the ruling. The
     row height comes from the grid, not from the contents. */
  .d3-cell {
    display: flex; align-items: center; justify-content: center;
    background: #fff; min-height: 0; overflow: hidden;
  }
  /* 3px of air around every fill. The fill is .d3-sq at 100% of the cell's CONTENT
     box, so padding here insets it without touching the cell — which keeps the
     whole cell as the hover target, and the hover is what drives the marker on the
     key. Edge to edge the matrix read as one continuous wash; a gutter turns it
     into a row of swatches and lets the ruling breathe. */
  .d3-cell.corr { padding: 3px; }
  /* The fill is a rectangle, not a square, so it keeps whatever box the shared grid
     hands it and the two views tile identically. */
  .d3-sq {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
    /* The fill is an <i>, which is italic by default — and the value sits inside
       it, so it was inheriting the slant from its own container. */
    font-style: normal;
  }
  /* No marker for "strong" any more. It was a ring at |r| >= 0.30, from when the
     fills were bucketed; with a continuous ramp the colour already says how strong
     a cell is, and a hard threshold made 0.29 and 0.31 look like different kinds
     of thing. */
  .d3-cell.corr.deep .d3-r { color: #fff; }
  .d3-r {
    font-family: var(--nnm-mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
    color: var(--nnm-ink-2); min-width: 46px;
  }
  /* No reserved width inside the fill, and a size that fits it. Full ink: these
     are the reading, and on a pale fill ink-2 was softer than it needed to be. */
  .d3-cell.corr .d3-r { font-size: 11px; min-width: 0; color: var(--nnm-ink); }
  /* Headings were turned 45 degrees while the square WAS the column and there was
     no width for them. The column is ~88px now and "prediction" needs 58, so they
     read horizontally again. */

  /* No circle, and the dash sits where the circle would, so an undefined cell
     reads as a gap in the matrix rather than as a very small measured result. */
  .d3-cell.corr.undef { justify-content: center; }
  .d3-cell.corr.undef .d3-r { color: var(--nnm-ink-3); min-width: 0; }
  /* 5, not 2: the band labels sat 1.8px off the cell's left edge and the axis
     labels 0.5px off its bottom. */
  .d3-cell.hist { padding: 5px; align-items: stretch; }
  /* Bar height is a count, drawn at whatever scale makes the fullest bin fit —
     never capped, or the bars would stop meaning counts. */
  .d3-plot { display: block; overflow: visible; }
  /* Neutral, not orange. Orange and blue carry a SIGN on this screen — the key
     reads "-1 blue, +1 orange" and the cell fills run that ramp — but a bar here is
     a count, and a count has no sign. #D08A6A sat at 52% saturation, inside the
     positive ramp's own 46-58% band, so an all-orange histogram was telling a
     student who had just read the key that everything was positive. It also failed
     on its own terms: 2.79:1 on white, under the 3:1 a meaningful graphic needs.
     --nnm-ink-3 is 4.87:1, and it is the ink these bars already turn on hover, so
     resting and hover are now one colour at two weights rather than two hues. */
  .d3-bar { fill: var(--nnm-count); fill-opacity: 0.85; }

  /* The bar is the histogram's own axis, drawn as a line. Its margins are the
     insets the plot above uses — 8px for the label gutter, 6px for PAD_R — so the
     two line up, and the caption sits under it rather than beside it. Beside it,
     the caption's width decided the track's: "4% of range" and "64% of range"
     differ enough that two rows got tracks 5px apart in length, which is the one
     thing a bar like this must not do. */
  .d3-range {
    display: block; margin: 3px 6px 0 8px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
    color: var(--nnm-ink-2);
  }
  .d3-range-track {
    position: relative; display: block; height: 4px; border-radius: 2px;
    background: #E4E8EE;
  }
  /* Three layers on one axis: the track is the whole -5..5, the "full" segment is
     everything this pathway reaches over all 800 conversations, and the fill is
     what the filter left. The caption's percentage is fill / full, so the ratio it
     names is a ratio you can see. */
  .d3-range-full {
    position: absolute; top: 0; height: 4px; border-radius: 2px;
    background: #CCD3DD;
  }
  .d3-range-fill {
    position: absolute; top: 0; height: 4px; border-radius: 2px;
    background: #838C99;
  }
  .d3-range .cap { display: block; line-height: 1; margin-top: 4px; text-align: center; }
  .d3-blabel { font-family: 'Barlow Condensed', sans-serif; font-size: 10.5px; fill: var(--nnm-ink-2); }
  /* The close-up has room the matrix cells do not: 10.5px is sized for a 42px stub
     inside a 99px cell, and at 530px wide it read as fine print. The ticks are
     8.5px for the same reason and get the same treatment, a step below the band
     labels so the axis stays quieter than the groups it is measuring. */
  /* Full size, NOT scaled with the plot. Scaled down they landed on the same
     10.5/9px the matrix cells use, so the close-up was five times the picture with
     the same size caption — which is not what "see it larger" means. The gutter and
     the right margin below are sized to hold them. */
  .d3-detail .d3-blabel { font-size: 14px; fill: var(--nnm-ink); }
  .d3-detail .d3-tick { font-size: 12px; fill: var(--nnm-ink-2); }
  .d3-tick { font-family: var(--nnm-mono); font-size: 8.5px; fill: var(--nnm-ink-2); }
  .d3-colname { text-align: center; }
  /* The stub is the widest thing in the row and the names are short, so they read
     better against the matrix than floating in the middle of it. */
  .d3-rowname { text-align: left; }
  .d3-colhead, .d3-rowhead { flex-direction: column; align-items: stretch; gap: 4px; }
  /* The row marginal: how the conversations divide between this row's values,
     which is the thing that decides whether a correlation could exist at all.
     The bar is drawn BEHIND the text rather than beside it. Sitting alongside, it
     took up to 32px of a ~79px column and the labels were the thing that gave —
     "Approach" became "App…" and "wrong" became "wro…". Behind, it costs no width
     at all, so every label reads in full and the proportion is still there. */
  .d3-marg { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .d3-margrow {
    display: flex; align-items: center; gap: 5px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 10.5px; color: var(--nnm-ink-2);
  }
  /* Bar, label, count — the original arrangement. It truncated because the bar was
     drawn up to 32px while the column only had 84 of content, and the label was the
     one item allowed to shrink, so it absorbed the 5px overrun as an ellipsis.
     Capped to what is genuinely left over, with the label pinned to its own width
     and the count pushed to the right edge, everything fits with room to spare:
        26 bar + 5 + 35 label + 5 + 12 count = 83 in 88. */
  .d3-margrow i {
    flex: 0 0 auto;
    /* Neutral for the same reason .d3-bar is: this shows the column's split, which
       is a proportion and has no sign, so it has no business wearing the colour that
       means "positive correlation" three inches away. It was #E0B6A4 at 1.84:1,
       then #C9692B at 3.79:1 — accessible but still orange. --nnm-ink-3 is 4.87:1. */
    height: 7px; border-radius: 2px; background: var(--nnm-count);
  }
  .d3-margrow span { flex: 0 0 auto; white-space: nowrap; }
  /* auto, so the counts line up on the right however long the label before them. */
  .d3-margrow em {
    margin-left: auto; font-style: normal;
    font-family: var(--nnm-mono); font-size: 9.5px; color: var(--nnm-ink-2);
    font-variant-numeric: tabular-nums;
  }
  /* Sized against the matrix, not the panel: it is a key to the squares, so it
     starts where they start and ends where they end. */
  /* Hidden, not removed. Taking the key out of the layout in Histograms view moved the
     scroller's height, so the same grid produced different row heights in one view
     and the other. Its space is reserved either way and the two views tile
     identically. */
  .d3-legend {
    position: relative;
    display: flex; visibility: hidden;
    flex-shrink: 0; align-items: center; gap: 0;
    height: 54px; padding: 0 1px;
  }
  /* Level with the pathway names it sits under, and set in their type, so the band
     reads as the row the matrix lost rather than as a caption bolted underneath.
     Its width is the stub's, set inline from STUB. */
  /* .nnm-legend-label's type, so the two interactives name their scales the same
     way. Right-aligned in the stub column rather than flush left: the label is
     naming the bar beside it, so it belongs against it. */
  .d3-legend-label {
    position: static; flex-shrink: 0; box-sizing: border-box;
    /* 8px on the right, not 12: 4px closer to the bar it names. The floor is the
       rail's own 24px inset — the "-1.0" tick hangs 17px left of the bar's end, so
       the label has 7px of that to give before the two would touch. */
    padding: 0 8px;
    text-align: right;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--nnm-ink-3);
    line-height: 1.1;
  }
  /* r is the symbol, and it is lower case. The uppercasing above would make it R,
     which is a different quantity. */
  .d3-legend-label .sym { text-transform: none; }
  .d3-scrollwrap.showkey .d3-legend { visibility: visible; }
  /* 24px of inset each side. The end ticks and the marker's pill are centred ON
     the ends of the bar, and the pill is the wider of the two at ~48px, so half of
     it would hang off the panel without this. MARGIN, not padding: the marker is
     placed as a percentage, and a percentage on an absolutely-positioned child
     resolves against the padding box — with padding here the marker ran up to
     18px wide of its own value at the ends of the scale, 0.04 in r. As a margin
     the rail's box IS the bar's box. */
  .d3-legend-rail { position: relative; flex: 1; min-width: 0; margin: 0 24px; }
  .d3-legend-bar {
    height: 16px; width: auto;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(30,36,44,0.18);
  }
  .d3-legend-ticks { position: relative; height: 15px; margin-top: 5px; }
  .d3-legend-ticks span {
    position: absolute; top: 0; transform: translateX(-50%);
    /* 11px, the size of the values in the cells: a tick and a cell value are the
       same kind of number in the same mono face, so they read at the same size. */
    font-family: var(--nnm-mono); font-size: 11px;
    font-variant-numeric: tabular-nums; color: var(--nnm-ink-2);
    white-space: nowrap;
  }
  .d3-legend-ticks span.zero { color: var(--nnm-ink); }
  /* Sits across the bar with its value in the ticks column, on an opaque ground so
     it reads over whichever tick it lands on. Centred on its own line, so the top
     it is given is the value's position rather than the top of the mark. */
  /* display:flex here would otherwise beat the browser's own [hidden] rule, and
     `legendMark.hidden = true` would set the property while the element carried on
     painting. Same trap .d3-viewhint has a rule for. */
  .d3-legend-mark[hidden] { display: none; }
  .d3-legend-mark {
    position: absolute; top: -3px;
    /* Above the ticks. The marker is added to the legend before the bar and the
       ticks are, and positioned siblings with no z-index paint in DOM order — so
       the tick labels were drawing OVER the bubble, and its white fill covered
       nothing. That is what the tick-dimming had really been compensating for. */
    z-index: 1;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0;
    pointer-events: none;
  }
  /* 22px: the bar's 16 plus 3px of overhang each end, so the line reads as
     pointing AT the ramp rather than as part of it. 23 with the gap closed — the
     line grows by the pixel the gap gave up, so it runs into the bubble's outline
     and the pill does not shift. The two are one mark, in one ink. */
  .d3-legend-mark i {
    height: 23px; width: 2px;
    background: var(--nnm-ink); flex-shrink: 0;
  }
  .d3-legend-mark .val {
    font-family: var(--nnm-mono); font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--nnm-ink); background: #FFFFFF;
    /* Solid white, so the tick label the pill lands on is covered rather than read
       through it — at r = 0.51 the bubble sits on "+0.5" and the two sets of digits
       printed over each other. This is what does that job now; the ticks are left
       alone. Outline in the same ink as the marker line it runs into, so the line
       and the bubble read as one object rather than as a mark with a label near
       it. */
    border: 1.5px solid var(--nnm-ink);
    padding: 3px 6px; border-radius: 999px;
  }
  .d3-legend-ticks span::before {
    content: ""; position: absolute; top: -4px; left: 50%;
    width: 1px; height: 3px; background: var(--nnm-rule);
  }
  /* --- cell detail --- */
  /* The matrix is the overview; this is the one panel behind a cell, big enough to
     read. Same card from either view, so a correlation and the distribution that
     produced it are two sides of one thing rather than two separate screens. */
  .d3-cell[role="button"] { position: relative; }
  .d3-cell.hist[role="button"], .d3-rowhead[role="button"] { cursor: pointer; }
  /* The pathway stub takes the same treatment as a graph cell. It has no fill of
     its own to protect, so the wash is safe here in either view — it is limited to
     Histograms view only because that is where it opens something. */
  .d3-rowhead[role="button"] { position: relative; }
  .d3-rowhead[role="button"]::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: rgba(30, 36, 44, 0);
    box-shadow: inset 0 0 0 0 rgba(30, 36, 44, 0);
    transition: background-color 0.12s ease, box-shadow 0.12s ease;
  }
  .d3-rowhead[role="button"]:hover::after {
    background: rgba(30, 36, 44, 0.07);
    box-shadow: inset 0 0 0 2px var(--nnm-ink-3);
  }
  .d3-rowhead[role="button"]:active::after {
    background: rgba(30, 36, 44, 0.14);
    box-shadow: inset 0 0 0 2px var(--nnm-ink-2);
  }
  .d3-rowhead[role="button"]:focus-visible {
    outline: 2px solid var(--nnm-neg); outline-offset: -2px;
  }
  /* Graph view only. In correlation view the cell's fill IS the reading, and a
     dark wash over it shifts the very colour the key is there to decode — the
     hover would be changing the data. Graph cells are white, so a wash costs
     nothing. Both the wash and the ring live on this overlay because an inset
     shadow on the cell itself paints under the fill and never appeared.
     Deeper on press, the way the buttons darken. */
  .d3-cell.hist[role="button"]::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: rgba(30, 36, 44, 0);
    box-shadow: inset 0 0 0 0 rgba(30, 36, 44, 0);
    transition: background-color 0.12s ease, box-shadow 0.12s ease;
  }
  /* The hover colour is the cell's own background, set per cell as --corr from the
     correlation it would show in the other view. The neutral grey wash is dropped
     while it is on: laid over the hue it would muddy it, and the cell would no
     longer match the key it is meant to be read against. Cells whose column is
     flat have no correlation, so they keep the grey. */
  .d3-cell.hist[role="button"] { transition: background-color 0.12s ease; }
  .d3-cell.hist.hascorr[role="button"]:hover,
  .d3-cell.hist.hascorr[role="button"]:focus-visible { background: var(--corr); }
  /* The overlay carries the ring and nothing else where there is a colour: it is
     painted ABOVE the plot, so any background on it covers the histogram. */
  .d3-cell.hist[role="button"]:hover::after,
  .d3-cell.hist[role="button"]:focus-visible::after {
    box-shadow: inset 0 0 0 2px var(--nnm-ink-3);
  }
  .d3-cell.hist[role="button"]:not(.hascorr):hover::after,
  .d3-cell.hist[role="button"]:not(.hascorr):focus-visible::after {
    background: rgba(30, 36, 44, 0.07);
  }
  /* Hovering any panel you can open darkens its bars. Where the cell is also
     wearing its correlation, --barfill is whatever contrasts with that colour (see
     rampBarInk) — the usual salmon is itself a colour from the ramp behind it, so
     at one point on the scale it would match it exactly. Everywhere else it falls
     back to ink: a cell whose column is flat has no correlation to show, and a
     pathway stub is not a pair, but both are still buttons that open a close-up
     and both should answer the pointer the same way. */
  .d3-cell.hist, .d3-rowhead { --barfill: var(--nnm-ink); }
  .d3-cell.hist[role="button"]:hover .d3-bar,
  .d3-cell.hist[role="button"]:focus-visible .d3-bar,
  .d3-rowhead[role="button"]:hover .d3-bar,
  .d3-rowhead[role="button"]:focus-visible .d3-bar {
    fill: var(--barfill); fill-opacity: 0.95;
  }
  .d3-cell.hist[role="button"]:active::after {
    background: rgba(30, 36, 44, 0.14);
    box-shadow: inset 0 0 0 2px var(--nnm-ink-2);
  }
  .d3-cell[role="button"]:focus-visible {
    outline: 2px solid var(--nnm-neg); outline-offset: -2px;
  }
  /* Marks where the open panel came from: the same dark outline the press state
     uses, held on. NO z-index — raised above the scrim it also cleared the card
     sitting inside it, so the cell painted over the panel. It stays under the wash
     with everything else and only the ring identifies it. */
  .d3-cell.selected::after, .d3-rowhead.selected::after {
    background: rgba(30, 36, 44, 0) !important;
    box-shadow: inset 0 0 0 2px var(--nnm-ink-2) !important;
  }
  .d3-scrim {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(30, 36, 44, 0.28);
    display: flex; align-items: center; justify-content: center;
  }
  .d3-detail {
    background: #fff; border: 2px solid var(--nnm-rule);
    border-radius: 8px; box-shadow: 0 10px 28px -10px rgba(30,36,44,0.45);
    width: min(560px, 92%); max-height: 94%;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .d3-detail-head {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px 9px 13px;
    border-bottom: 1px solid var(--nnm-rule-soft);
  }
  .d3-detail-title {
    font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 700;
    color: var(--nnm-ink); flex: 1; min-width: 0;
  }
  .d3-detail-r {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--nnm-mono); font-size: 13px; color: var(--nnm-ink);
    font-variant-numeric: tabular-nums;
  }
  .d3-detail-r i {
    display: block; width: 18px; height: 18px; border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(30,36,44,0.18);
  }
  .d3-detail-close {
    width: 26px; height: 26px; flex-shrink: 0;
    border: 2px solid var(--nnm-rule); border-radius: 5px; background: #fff;
    color: var(--nnm-ink-2); cursor: pointer; line-height: 1; font-size: 15px;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .d3-detail-close:hover { background: var(--nnm-surface); }
  .d3-detail-close:active {
    background: var(--nnm-ink); border-color: var(--nnm-ink); color: #fff;
  }
  .d3-detail-close:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  /* 12 at the foot, not 4. The 4 was sized for a card that had a paragraph of
     text under the plot to hold it off the edge; with that gone the axis labels
     sat almost on the border. */
  .d3-detail-body { padding: 10px 13px 12px; }
  /* Narrower than a close-up: it holds one sentence, not a plot. */
  .d3-hintcard { width: min(380px, 88%); }
  .d3-hintbody {
    font-family: 'Lato', sans-serif; font-size: 14px; line-height: 1.5;
    color: var(--nnm-ink-2); padding: 14px 16px 18px;
  }
  .d3-note {
    font-family: 'Lato', sans-serif; font-size: 12.5px; line-height: 1.45;
    color: var(--nnm-ink-3); flex-shrink: 0; padding-bottom: 2px;
  }

  .nnm-cell {
    width: 82px;
    height: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(30,36,44,0.14);
    border-radius: 6px;
    font-family: var(--nnm-mono);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    background: #fff;
    transition: background-color 0.35s ease, color 0.35s ease, opacity 0.3s ease;
  }
  /* Importance stays grey: it is the one number that does not change
     from conversation to conversation. */
  /* Importance keeps the same bare-square grammar as the other three columns.
     What marks it as a property of the MODEL rather than a result of a step is
     that it is the only column already showing a real value at step 0, while the
     others still hold their empty stand-ins — and that it never changes as you
     move between conversations. */
  .nnm-cell.imp { color: var(--nnm-ink) !important; }
  /* The importance VALUE starts pale — as an unlit operator does, a shade darker
     (see .nnm-glyph), and for the same reason: nothing has taken it up yet. It
     goes to ink at the beat the carried square lands on the box, so the number
     and the box are seen to be picked up together rather than the number having
     been dark all along. 0.2s, started 200ms before the square lands, so the
     change is complete as it arrives — see IMP_INK, which must match. */
  /* #C2C9D4 was 1.67:1 on white — this is the palest that clears AA at 12.5px.
     Still far lighter than the ink it lands on (4.88:1 against 15.63:1), so the
     move from "not worked out yet" to "worked out" still reads. */
  .nnm-cell.imp .nnm-num { color: #6D7178 !important; transition: color 0.2s ease; }
  .nnm-frow.lit-imp .imp .nnm-num { color: var(--nnm-ink) !important; }
  .nnm-cell.sum { width: 62px; height: 40px; }
  /* A stage that has not run yet is a stand-in: the box is there so the shape of
     the calculation is visible from the start, but it holds no value and no colour. */
  .nnm-cell.empty, .nnm-out.empty {
    background: repeating-linear-gradient(-45deg, #FAFBFC 0 5px, #F1F3F6 5px 10px) !important;
    border-color: #D8DDE5 !important;
    border-style: dashed !important;
    color: transparent !important;
  }
  .nnm-pop { animation: nnm-pop 0.42s cubic-bezier(0.2, 0.9, 0.3, 1.3); }
  @keyframes nnm-pop {
    from { opacity: 0; transform: scale(0.90); }
    60%  { opacity: 1; }
    to   { opacity: 1; transform: scale(1); }
  }
  .nnm-reset {
    /* In the flow, as the fifth member of .nnm-stepgroup. It was absolute at the
       row's right edge back when the four steps were centred and it had to stay
       clear of them; that job belongs to About now. */
    height: 36px;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    border: 2px solid var(--nnm-rule);
    background: #fff;
    border-radius: 5px;
    cursor: pointer;
    color: var(--nnm-ink-2);
    padding: 0 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .nnm-reset .glyph { font-size: 19px; line-height: 1; padding-bottom: 2px; }
  .nnm-reset:hover:not(:disabled) { background: var(--nnm-surface); }
  /* Same press as the step and nav buttons: the dark fill, no nudge. The glyph is
     a text character, so it inherits the colour and turns white with the rest of
     the button. */
  .nnm-reset:active:not(:disabled) {
    background: var(--nnm-ink); border-color: var(--nnm-ink); color: #fff;
  }
  /* Nothing to clear until a step has run, so it starts unavailable rather than
     inviting a press that would do nothing. */
  .nnm-reset:disabled {
    opacity: 0.35;
    cursor: default;
  }

  /* Speed sits to the right of Animate; the pair is pushed right together. */
  .nnm-speed {
    position: relative;
    display: flex; flex-direction: column; align-items: stretch; gap: 2px;
    /* The header already contributes its own 10px gap, and SLOW overhangs the
       track's left edge by half its width — so this margin is small to land the
       visible ANIMATE-to-SLOW gap at about 10px. */
    flex-shrink: 0; margin-left: 0; width: 92px;
  }
  /* The thumb is sized here rather than left to the browser, so the stop
     positions are a known quantity the labels can be pinned to. */
  .nnm-speed input[type=range] {
    -webkit-appearance: none; appearance: none;
    /* Negative vertical margins pull the LAYOUT height back to what an 18px
       thumb occupied, so a bigger thumb does not make this header taller than
       the conversation header beside it. The thumb still draws at full size —
       margins do not clip. */
    width: 92px; height: 40px; margin: 0; cursor: pointer; background: transparent;
  }
  /* The bar is drawn by .nnm-trackline, so the native one is invisible. */
  /* The input is stretched over the whole block — bar AND labels — so the entire
     height is draggable and clicking a name jumps to that stop. Its content box
     is held to the bar's height with a bottom padding, which keeps the track (and
     so the thumb) up on the bar rather than centred in the taller box. */
  .nnm-speedtrack { position: relative; height: 18px; }
  .nnm-trackline {
    position: absolute; top: 50%; margin-top: -2px;
    background: #D3D8E0; pointer-events: none;
  }
  .nnm-speed input[type=range] {
    position: absolute; top: 0; left: 0; z-index: 1;
    box-sizing: border-box; padding-bottom: 22px;
  }
  .nnm-speed input[type=range]::-webkit-slider-runnable-track {
    height: 4px; background: transparent;
  }
  /* White with the same 2px rule the step buttons above it carry. border-box is
     load-bearing: without it the border would push the thumb to 18px and the
     labels, which are pinned to a 14px thumb, would stop lining up. */
  .nnm-speed input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    box-sizing: border-box;
    width: 24px; height: 24px; margin-top: -10px;
    border-radius: 50%; background: #fff; border: 2px solid var(--nnm-rule);
    transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .nnm-speed input[type=range]::-moz-range-track {
    height: 4px; background: transparent;
  }
  .nnm-speed input[type=range]::-moz-range-thumb {
    box-sizing: border-box;
    width: 24px; height: 24px; border-radius: 50%;
    background: #fff; border: 2px solid var(--nnm-rule);
    transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  /* Hover borrows the step buttons' hover fill; dragging fills it solid, so the
     thumb reads as held. Guarded on :not(:disabled) so it stays inert while
     Animate is off. Size never changes — the stops, ticks and track ends are all
     derived from the thumb's width, so growing it on hover would pull them apart. */
  .nnm-speed input[type=range]:not(:disabled):hover::-webkit-slider-thumb {
    background: var(--nnm-surface); border-color: #A7B0BC;
  }
  .nnm-speed input[type=range]:not(:disabled):hover::-moz-range-thumb {
    background: var(--nnm-surface); border-color: #A7B0BC;
  }
  .nnm-speed input[type=range]:not(:disabled):active::-webkit-slider-thumb {
    background: var(--nnm-ink); border-color: var(--nnm-ink);
    box-shadow: 0 0 0 4px rgba(30,36,44,0.10);
  }
  .nnm-speed input[type=range]:not(:disabled):active::-moz-range-thumb {
    background: var(--nnm-ink); border-color: var(--nnm-ink);
    box-shadow: 0 0 0 4px rgba(30,36,44,0.10);
  }
  /* Keyboard focus marks the thumb itself rather than drawing a ring round the
     whole control, which would sit awkwardly over the ticks. */
  .nnm-speed input[type=range]:focus-visible::-webkit-slider-thumb {
    border-color: var(--nnm-ink);
    box-shadow: 0 0 0 3px rgba(30,36,44,0.16);
  }
  .nnm-speed input[type=range]:focus-visible::-moz-range-thumb {
    border-color: var(--nnm-ink);
    box-shadow: 0 0 0 3px rgba(30,36,44,0.16);
  }
  /* Greyed and inert while Animate is off. */
  .nnm-speed.off { opacity: 0.4; }
  .nnm-speed.off input[type=range] { cursor: default; }
  /* One name per stop, with a tick above it. The row is inset by half a thumb at
     each end so the outer two sit under where the thumb actually comes to rest,
     not under the ends of the track. */
  .nnm-speedticks {
    position: relative; height: 17px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.03em; text-transform: uppercase; color: var(--nnm-ink-3);
    line-height: 1;
  }
  .nnm-speedticks span {
    position: absolute; top: 0; transform: translateX(-50%);
    padding-top: 6px; white-space: nowrap;
  }
  .nnm-speedticks span::before {
    content: ""; position: absolute; top: 0; left: 50%;
    width: 1px; height: 4px; margin-left: -0.5px; background: #B9C0CA;
  }
  .nnm-speedticks span.on { color: var(--nnm-ink); }
  .nnm-speedticks span.on::before { background: var(--nnm-ink); }
  /* No ring when clicked, kept for Tab — losing it there would leave the control
     untraceable by keyboard, which is worse than a ring after a click. The
     :not(:focus-visible) form is not enough on its own: browsers match
     :focus-visible on a clicked checkbox, so the modality class decides. */
  .nnm-animtoggle input:focus:not(:focus-visible),
  .nnm-speed input:focus:not(:focus-visible),
  .nnm-pointer .nnm-animtoggle input:focus,
  .nnm-pointer .nnm-speed input:focus { outline: none; box-shadow: none; }
  .nnm-animtoggle {
    flex-shrink: 0;
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    cursor: pointer;
    user-select: none;
  }
  .nnm-animtoggle input { width: 15px; height: 15px; margin: 0; cursor: pointer; accent-color: var(--nnm-neg); }
  .nnm-animtoggle:hover { color: var(--nnm-ink); }
  .nnm-animtoggle:active { color: var(--nnm-ink); background: var(--nnm-surface); }
  .nnm-animtoggle:focus-within { outline: 2px solid var(--nnm-neg); outline-offset: 2px; border-radius: 4px; }

  /* The non-animated version: same screen, every stage arriving at once. */
  .nnm-nomotion .nnm-pop,
  .nnm-nomotion .nnm-tick { animation: none !important; }
  .nnm-nomotion .nnm-cell,
  .nnm-nomotion .nnm-cell.wgt,
  .nnm-nomotion .nnm-sq,
  .nnm-nomotion .nnm-tok { transition: none !important; }
  .nnm-reset:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  /* A fixed-width track for the weighted box, so the box can change size with
     its value without moving the flow's overall width. */
  .nnm-slot {
    width: 82px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }
  /* Resting width sits between the widest and narrowest a value can produce, so
     the Weigh step is seen to widen some boxes and narrow others rather than only
     ever shrinking them. */
  /* A symbol cell holds a square over its number. The square carries magnitude
     by AREA and sign by colour; the number stays put rather than moving above or
     below by sign, so the column can still be scanned. The cell itself goes
     plain — colouring both it and the square would say the same thing twice and
     make the square's edge unreadable against it. */
  /* The square grows from a fixed centre, on the same line as the multiply glyph
     beside it, so it expands in every direction rather than upward off a baseline.
     Both it and the number are taken out of the flow to do that: in flow, a
     growing square pushes the number down the cell, and a label that bobs with
     the value is unreadable. The number is parked at half the LARGEST square plus
     a gap, so it is clear of the square at full size and never moves. */
  .nnm-cell.sym {
    position: relative;
    /* Only tall enough to hold the largest square centred. The number is absolute
       and hangs below into the row gap rather than being contained here — sizing
       the cell to fit it forced a matching 40px of empty space ABOVE the square,
       which nothing used, and pushed the row pitch to 126px for 65px of ink. */
    height: 72px;
    /* Transparent, not white: the connector lines run INTO these cells to reach
       the square in the middle, and an opaque cell paints over the last 25px of
       every line — the ends looked clipped. The square carries the fill, so the
       cell needs none. !important because paint() still writes one inline. */
    background: transparent !important;
    border-color: transparent !important;
  }
  .nnm-cell.sym .nnm-num {
    position: absolute;
    left: 0; right: 0;
    top: calc(50% + 41px);
    text-align: center;
  }
  /* Corner cues on the importance box: which way the carried square is about to
     resize. Out means multiplied by more than one, in means less. */
  /* Zero-size, fixed, holds the position; the flying element lives inside and
     owns the animation transform. The two nest without fighting. */
  .nnm-flyanchor { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 40; }
  /* A fixed box the size of the flow scroller's viewport. Being fixed it is the
     containing block for the absolutely positioned anchors inside it, so its
     overflow actually clips them — which a scroller cannot do to a fixed anchor
     parked on <body>. */
  .nnm-flyclip { position: fixed; overflow: hidden; pointer-events: none; z-index: 40; }
  .nnm-flyanchor.clipped { position: absolute; }
  /* The turn-over arrow, shown only where importance is negative. */
  .nnm-flipcue { position: absolute; left: 0; top: 0; pointer-events: none; color: #8A94A3; }
  .nnm-flipcue svg { display: block; overflow: visible; }
  .nnm-nomotion .nnm-flipcue { display: none; }
  .nnm-cue {
    position: absolute; left: 0; top: 0;
    width: 13px; height: 13px;
    color: #8A94A3;
    pointer-events: none;
    z-index: 41;
  }
  .nnm-cue svg { display: block; width: 13px; height: 13px; }
  .nnm-nomotion .nnm-cue { display: none; }

  /* The square carried across the row by the Weigh step. Same treatment as the
     squares it comes from and lands on, so it reads as the same object moving. */
  .nnm-carry {
    position: absolute; left: 0; top: 0;
    box-sizing: border-box;
    border: 1px solid transparent;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px #6E7580;
    pointer-events: none;
    z-index: 40;
    will-change: transform;
  }
  .nnm-cell.sym .nnm-sq {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
    box-sizing: border-box;
    border: 1px solid transparent;
    border-radius: 3px;
    flex-shrink: 0;
    /* Inset so it never changes the square's measured size — the connector lines
       anchor to that. Keeps a white or very pale square visible on white. */
    box-shadow: inset 0 0 0 1px #6E7580;
    transition: width 0.35s cubic-bezier(.3,0,.3,1),
                height 0.35s cubic-bezier(.3,0,.3,1),
                background-color 0.35s ease;
  }
  /* paint() flips the cell's text to white at the top colour level — correct when
     the cell itself carried a dark fill, fatal now that it is forced white and the
     square holds the colour. An explicit colour here beats that inherited value,
     so the number stays legible however dark its square gets. */
  .nnm-cell.sym .nnm-num { line-height: 1; color: #1E242C; }
  /* The weighted box still varies in width, so its own centre slides. The slot
     behind it does not, so the symbol is pinned to that instead and stays put. */
  .nnm-cell.wgt.sym .nnm-sq { left: 41px; }
  .nnm-cell.wgt.sym .nnm-num { left: 0; right: auto; width: 82px; }
  .nnm-flowbody.narrow .nnm-cell.wgt.sym .nnm-sq { left: 37px; }
  .nnm-flowbody.narrow .nnm-cell.wgt.sym .nnm-num { width: 74px; }
  /* Square corners on the importance box only. sizeSym writes its transparent
     fill and its darkest-shade outline inline; the radius belongs here because
     it never varies. */
  .nnm-cell.imp.sym .nnm-sq { border-radius: 0; }
  /* Nothing has been computed yet: the stand-in is the smallest square the scale
     can produce, empty. That is also the size a real value starts from, so the
     step grows the square out of the stand-in instead of collapsing a large
     placeholder first. Sized with !important because sizeSym writes the real
     dimensions inline, and .empty is toggled after that. */
  .nnm-cell.sym.empty .nnm-sq {
    width: 12px !important;
    height: 12px !important;
    background: #FFFFFF !important;
  }
  /* Beats the explicit colour that keeps a number legible on a dark square, which
     would otherwise defeat .empty's `color: transparent`. */
  .nnm-cell.sym.empty .nnm-num { color: transparent; }
  /* Held back while the carried square is still settling on top of it — see the
     drop timer in carry(). visibility, not display: the connector lines anchor to
     this square's measured rect and it has to keep occupying its place. */
  .nnm-cell.wgt.under .nnm-sq { visibility: hidden; }


  .nnm-cell.wgt {
    width: 58px;
    transition: width 0.45s cubic-bezier(.3,0,.3,1), background-color 0.35s ease, color 0.35s ease;
  }
  /* The operators sit on the NUMBERS, not on the squares: the row reads as
     0.1234 × 0.5000 → 0.0617, which is the arithmetic the step actually does.
     Dropped by the same 41px that puts .nnm-num's line box below the square,
     plus the 6px from that box's top down to the centre of the digits' ink —
     so the glyph's ink lands on the digits' ink, not on their line box.
     A relative offset, not a transform: .nnm-op carries the tick animation's
     scale, which is applied about the box's own centre once this has moved it. */
  .nnm-op {
    width: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    top: 47px;
    transition: opacity 0.3s ease;
  }
  .nnm-glyph {
    font-family: var(--nnm-mono);
    font-size: 24px;
    line-height: 1;
    /* #C2C9D4 was 1.67:1 on white. At 24px regular this counts as large text, so
       3:1 is the bar rather than 4.5 — which is why it can stay paler than the
       importance value below it, which is 12.5px and cannot. */
    color: #8A8F97;
    display: block;
    transition: color 0.3s ease;
  }
  /* Each glyph's ink sits differently inside its own line box, so the shared 47px
     drop above lands them ~1px apart. These two make up the remainder: measured
     ink centres are 453.2 (×) and 454.3 (→) against a digit ink centre of 500.9,
     so × needs 47.7 and → needs 46.6. Sub-pixel, so the tick animation's scale
     (which does multiply them) moves them by a fraction of a pixel — invisible,
     and the same fraction the previous corrections already lived with. */
  /* Same 24px as the X, inherited from .nnm-glyph. Its own correction is a shade
     smaller: the equals' ink centres 0.13px higher in the line box than the X's. */
  .nnm-glyph.eq { position: relative; top: -0.15px; }
  .nnm-op.mul .nnm-glyph { position: relative; top: -0.3px; }
  /* The operators darken as the Weigh step reaches them, one row at a time. */
  .nnm-frow.lit-mul .mul .nnm-glyph,
  .nnm-frow.lit-eq .eq .nnm-glyph { color: #6B7583; }
  /* A bigger kick than the cells get. They are small marks with no number to
     carry the change, so the standard 1.09 barely registered on them. */
  .nnm-op.nnm-tick { animation: nnm-tick-op 0.30s ease-out; }
  /* The importance value takes the CELLS' 1.09, not the operators' 1.34, because
     a ratio is not a distance. The x's ink is 10.9px wide and the ='s 12.4px, so
     1.34 throws them about 2px out per side. The value's ink is 58.7px wide, so
     the same 1.34 would throw it nearly 10px — five times the travel, on the
     widest thing in the row. At 1.09 it moves 2.6px per side and reads as the
     same size of kick as the marks either side of it. */
  @keyframes nnm-tick-op {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.34); }
    100% { transform: scale(1); }
  }

  .nnm-conv {
    flex-shrink: 0;
    transition: opacity 0.3s ease;
    overflow: visible;
    pointer-events: none;
  }
  .nnm-tail {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.3s ease;
  }
  /* Lifted out of the flow so only the cell is centred. Left in it, the tail
     centres label-plus-cell as a group, which pushes the cell below the midpoint
     the two answers are centred on — 40px above it and 6px below. */
  .nnm-taillabel {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    line-height: 1.2;
    color: var(--nnm-ink-2);
    text-align: center;
  }
  .nnm-flowbody.narrow .nnm-taillabel {
    position: static;
    transform: none;
    white-space: normal;
  }
  .nnm-fan { width: 40px; flex-shrink: 0; transition: opacity 0.3s ease; overflow: visible; }
  .nnm-outs {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    flex-shrink: 0;
    transition: opacity 0.3s ease;
  }
  .nnm-out {
    width: 74px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    border-radius: 6px;
    border: 1px solid rgba(30,36,44,0.14);
    background: #fff;
    color: var(--nnm-ink-3);
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  /* Coloured before anything runs. The two answers are not empty slots waiting to
     be filled — every other white box in the row is one, but these are the two
     destinations, both equally true as options before the model has said
     anything. Greying them claims "nothing here yet", which is the wrong claim.
     Carrying the mapping instead (positive is orange, negative is blue, as
     everywhere else here) lets the chain read forward: a blue sum is visibly
     heading for the blue answer, rather than the student learning that pairing at
     the one moment they are busy watching the reveal.
     The FILL stays white until Predict, so which one won is still said by exactly
     one thing. */
  .nnm-out.approach { border-color: var(--nnm-pos); }
  .nnm-out.wait { border-color: var(--nnm-neg); }
  .nnm-out.approach.on { background: #EFD3C4; color: #1E242C; }
  .nnm-out.wait.on { background: #1F4E8F; color: #fff; }

  .nnm-flowbody.narrow { flex-wrap: wrap; }
  .nnm-flowbody.narrow .nnm-cell { width: 74px; height: 36px; font-size: 12px; }
  .nnm-flowbody.narrow .nnm-slot { width: 74px; }
  .nnm-flowbody.narrow .nnm-cell.sum { width: 58px; }
  /* Narrow drops the numbers to 12px, which lifts the centre of their ink by
     0.6px. The operators follow it rather than staying put and reading half a
     pixel low, the same tolerance the corrections above are drawn to. */
  .nnm-flowbody.narrow .nnm-op { width: 26px; top: 46.4px; }
  .nnm-flowpanel:has(.nnm-flowbody.narrow) .nnm-flowhead .c { width: 74px; }
  .nnm-flowpanel:has(.nnm-flowbody.narrow) .nnm-flowhead .g { width: 26px; }
  .nnm-flowbody.narrow .nnm-out { width: 68px; height: 34px; font-size: 12.5px; }
  .nnm-flowbody.narrow .nnm-conv, .nnm-flowbody.narrow .nnm-fan { display: none; }
  .nnm-flowbody.narrow .nnm-decidewrap { width: 100%; padding-top: 12px; }
  .nnm-flowbody.narrow .nnm-deciderow { align-items: center; gap: 10px; }
  .nnm-flowbody.narrow .nnm-tail { flex-direction: row; gap: 8px; }
  .nnm-flowbody.narrow .nnm-outs { flex-direction: row; gap: 8px; }
  .nnm-flowbody.narrow .nnm-labels { flex-direction: row; gap: 6px 20px; align-items: center; }


  /* --- verdict --- */
  .nnm-verdict {
    margin-top: 14px;
    padding: 11px 13px;
    border: 1px solid var(--nnm-rule);
    border-radius: 7px;
    background: var(--nnm-surface);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    flex-shrink: 0;
  }
  .nnm-verdict-main {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nnm-note {
    min-width: 0;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--nnm-ink-2);
    font-style: italic;
    margin-top: 11px;
  }
  .nnm-note:empty { display: none; }
  .nnm-outs { display: flex; gap: 6px; }
  .nnm-out {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 3px 11px;
    /* Fully rounded rather than a fixed radius, so it stays a true pill at the
       narrow layout's shorter height without a second value to keep in step. */
    border-radius: 999px;
    border: 1px solid var(--nnm-rule);
    color: var(--nnm-ink-3);
    background: #fff;
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  }
  .nnm-out.approach.on { color: var(--nnm-pos); border-color: var(--nnm-pos); background: var(--nnm-pos-soft); }
  .nnm-out.wait.on { color: var(--nnm-neg); border-color: var(--nnm-neg); background: var(--nnm-neg-soft); }
  /* AFTER the two blocks above, not before: there are two .nnm-out rule sets in
     this stylesheet, and a bare .nnm-out placed earlier loses to the later one on
     order at equal specificity. Unselected, ink-3 on white is 3.4:1 — under the
     4.5:1 these labels need. */
  .nnm-out { color: var(--nnm-ink-2); }

  /* --- step control --- */
  .nnm-step {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0 12px;
    height: 36px;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 2px solid var(--nnm-rule);
    background: #fff;
    color: var(--nnm-ink-2);
    border-radius: 5px;
    cursor: pointer;
  }
  /* Each icon is a miniature of what the step does to the diagram beside it —
     marked-up text, the multiply glyph, the three lines converging, the fork to
     two answers — rather than a generic metaphor. currentColor so they invert
     with the button when it is the active step. */
  .nnm-step svg { width: 13px; height: 13px; flex-shrink: 0; overflow: visible; }
  /* Every interactive state is gated on the button actually being interactive.
     Without this a locked step still lit on hover and still flipped to the full
     pressed look on mousedown, so it answered like a live control and simply did
     nothing — which reads as broken rather than as unavailable. Both forms are
     excluded: `disabled` is what blocks the click, `aria-disabled` is what tells a
     screen reader, and the buttons carry both. */
  /* HOVER and PRESS carry an identical guard — same three :not()s, same specificity
     (0,5,0) — so which one wins is decided by source order, press being second,
     rather than by an accident of how many conditions each happens to carry. Getting
     that wrong twice is what motivated writing it this way: guarding hover alone put
     it above .nnm-step.on and the pale wash beat the selected step's dark fill; then
     adding :not(.on) to hover alone put it above :active, so a press showed a pale
     background with the white text :active had set — invisible.
     A selected step is excluded from both: it already shows its final state, so it
     has nothing to preview and nothing to travel to when pressed. */
  .nnm-step:hover:not(.on):not(:disabled):not([aria-disabled="true"]) {
    background: var(--nnm-surface);
  }
  /* Press states. Activation stays on click — moving it to mousedown would remove
     the escape hatch of pressing, thinking better of it and releasing off the
     button, and on the tablets this runs on it would fire whenever a scroll
     gesture happened to start on a control. What was missing is the feedback,
     not the speed: the button now answers the moment it is pressed. */
  /* Pressing a step shows the SELECTED look straight away — the press is the
     answer, not a grey stop on the way to it. Nothing changes on release except
     that it stays. No nudge either: a shift would mean the press was not quite
     the final state after all. */
  .nnm-step:active:not(.on):not(:disabled):not([aria-disabled="true"]) {
    background: var(--nnm-ink); border-color: var(--nnm-ink); color: #fff;
  }
  .nnm-step.on {
    background: var(--nnm-ink);
    border-color: var(--nnm-ink);
    color: #fff;
  }
  .nnm-step:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .nnm-step:disabled,
  .nnm-step[aria-disabled="true"] { opacity: 0.35; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

</style>

<script>
const DEVICES = {
  none: {
    name: "Teacher Desktop",
    screenW: null, screenH: null,
    topChrome: 0, bottomChrome: 0,
    topLabel: "", bottomLabel: ""
  },
  chromebook: {
    name: "Chromebook",
    screenW: 1366, screenH: 768,
    topChrome: 111, bottomChrome: 48,
    topLabel: "Chrome tabs + address + bookmarks: 111px",
    bottomLabel: "ChromeOS shelf: 48px"
  },
  ipad: {
    name: "iPad (\u2264 9th gen, landscape)",
    screenW: 1024, screenH: 768,
    topChrome: 70, bottomChrome: 0,
    topLabel: "Safari address + tab bar: 70px",
    bottomLabel: ""
  },
  ipad10: {
    name: "iPad (10th gen, landscape)",
