    const ACT_SCALE = Math.max.apply(null, D.scoreMin.map(Math.abs).concat(D.scoreMax.map(Math.abs)));
    const IMP_MAX = Math.max.apply(null, IMP.map(Math.abs));
    // One colour scale across all three pathways, not one each. Per-pathway
    // normalisation is common in attribution tools and keeps a weak output
    // readable, but here the three maxima sit within 1.48x of each other, so it
    // bought almost nothing while implying the readings were separately
    // calibrated and not comparable. It also disagreed with the cells the words
    // fly into: ACT_SCALE is already a single value across all three, so the same
    // word could read full-strength on the left and mid-tone on the right.
    // Pathway 1's strongest word now renders at 68% intensity, Pathway 2's at 76%.
    const TOK_MAX = Math.max.apply(null,
      Object.keys(D.vocabulary).map(function (w) { return Math.abs(D.vocabulary[w][1]); }));

    let cases = D.items.slice();
    let idx = 0;
    let step = 0;      // 0 = empty skeleton; the four buttons fill it in

    const wrap = document.createElement("div");
    wrap.className = "sim-content";
    const liveAnnounce = document.createElement("div");
    liveAnnounce.className = "sr-only";
    liveAnnounce.setAttribute("aria-live", "polite");
    liveAnnounce.setAttribute("aria-atomic", "true");
    wrap.appendChild(liveAnnounce);
    SIM.announce = function (msg) {
      liveAnnounce.textContent = "";
      requestAnimationFrame(function () { liveAnnounce.textContent = msg; });
    };
    SIM._timeouts = []; SIM._observers = []; SIM._rafs = [];

    const stack = document.createElement("div");
    stack.className = "nnm-stack";
    wrap.appendChild(stack);

    const root = document.createElement("div");
    root.className = "nnm";
    stack.appendChild(root);

    // The find bar sits over the conversation list it filters, so it takes the
    // left column's width and the flow panel runs the full height beside it.
    // The panel itself is shared with 3B — see buildCasePanel. 2B keeps its own
    // render(), because it has to withhold the word colours until Activate runs
    // and drive the chain on the right off the same case.
    const casePane = buildCasePanel({
      onFilter: function (items) { cases = items; goToCase(0); }
    });
    const leftCol = casePane.leftCol;
    root.appendChild(leftCol);
    const filter = casePane.filter;
    const emptyMsg = casePane.emptyMsg;
    const casePanel = casePane.casePanel;
    const caseIdEl = casePane.caseIdEl;
    const countEl = casePane.countEl;
    const prevBtn = casePane.prevBtn;
    const nextBtn = casePane.nextBtn;
    const readHead = casePane.readHead;
    const readScroll = casePane.readScroll;
    const readings = casePane.readings;
    // ================= right: the flow =================
    const rightCol = document.createElement("div");
    rightCol.className = "nnm-rightcol";
    root.appendChild(rightCol);

    const chainPanel = document.createElement("div");
    chainPanel.className = "nnm-panel nnm-flowpanel";
    chainPanel.setAttribute("role", "region");
    chainPanel.setAttribute("aria-label", "How the pathways decide");

    const chainHead = document.createElement("div");
    chainHead.className = "nnm-panel-head";
    const chainHeadTitle = document.createElement("span");
    chainHeadTitle.textContent = "Neural pathways";
    chainHead.appendChild(chainHeadTitle);

    // Words read off the page: three lines of text with some words marked.
    const ICON_ACTIVATE =
      '<svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">' +
      '<rect x="1" y="2.4" width="5.5" height="2.6" rx="1.1"/>' +
      '<rect x="8" y="2.4" width="7" height="2.6" rx="1.1" opacity=".3"/>' +
      '<rect x="1" y="6.7" width="4" height="2.6" rx="1.1" opacity=".3"/>' +
      '<rect x="5.5" y="6.7" width="6.5" height="2.6" rx="1.1"/>' +
      '<rect x="1" y="11" width="6.5" height="2.6" rx="1.1"/>' +
      '<rect x="9" y="11" width="4.5" height="2.6" rx="1.1" opacity=".3"/></svg>';

    // The multiply glyph itself, the same shape that sits in every row.
    const ICON_WEIGH =
      '<svg viewBox="0 0 32 32" aria-hidden="true" fill="currentColor">' +
      '<path d="M6 2 L16 12 L26 2 L30 6 L20 16 L30 26 L26 30 L16 20 L6 30 L2 26 L12 16 L2 6 Z"/></svg>';

    // Three contributions converging on one total.
    const ICON_ADDUP =
      '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round">' +
      '<path d="M1 1.4 L10 8"/><path d="M1 8 H10"/><path d="M1 14.6 L10 8"/>' +
      '<circle cx="12.8" cy="8" r="2.4" fill="currentColor" stroke="none"/></svg>';

    // One score forking to two answers; the one it picks is filled.
    const ICON_PREDICT =
      '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round">' +
      '<path d="M0.8 8 H5"/><path d="M5 8 C8 8 7.5 2.6 10.2 2.6"/>' +
      '<path d="M5 8 C8 8 7.5 13.4 10.2 13.4"/>' +
      '<circle cx="12.9" cy="2.6" r="2.7" fill="currentColor" stroke="none"/>' +
      '<circle cx="12.9" cy="13.4" r="2"/></svg>';

    const STEP_LABELS = ["Activate", "Weigh", "Add Up", "Predict"];
    const STEP_ICONS = [ICON_ACTIVATE, ICON_WEIGH, ICON_ADDUP, ICON_PREDICT];
    let prevStep = 0;
    let wordAnim = false;          // true while the Words sequence is in flight
    let weighAnim = false;         // true while the Weigh sequence is in flight
    let addUpAnim = false;         // true while the three lines are converging
    let decideAnim = false;        // true while the answer line is being drawn
    let decidePending = true;      // the answer line is hidden until Decide runs
    let animateOn = true;          // the Animate checkbox
    // The non-animated version is the same screen with every stage arriving at
    // once. Reduced-motion users get it whether or not the box is ticked.
    function motionOff() {
      return !animateOn || window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }
    const CONV_W = 46;             // the conv SVG's real layout contribution
    let animSeq = 0;               // bumped to invalidate anything still queued
    const animTimers = [];

    function cancelAnim() {
      animSeq++;
      animTimers.forEach(clearTimeout);
      animTimers.length = 0;
      pending.length = 0;
      liveAnims.length = 0;
      carryFor.length = 0;
      flyLive.length = 0;
      document.querySelectorAll(".nnm-flyanchor").forEach(function (e) { e.remove(); });
      document.querySelectorAll(".nnm-flyclip").forEach(function (e) { e.remove(); });
      for (const k in flyClips) delete flyClips[k];
      if (trackRaf) { cancelAnimationFrame(trackRaf); trackRaf = null; }
      // Both flags mean the same thing and must be cleared the same way: false =
      // the line is drawn. playDecide raises decidePending itself when it is about
      // to animate, so raising it here only affected the paths that DON'T animate
      // — restoring a conversation from memory — where it hid the fan line while
      // the three convergence lines came back drawn.
      for (let i = 0; i < solidPending.length; i++) solidPending[i] = false;
      decidePending = false;
      document.querySelectorAll(".nnm-read-name.reading")
        .forEach(function (e) { e.classList.remove("reading"); });
      wordAnim = false;
      weighAnim = false;
      addUpAnim = false;
      decideAnim = false;
    }
    // One knob for the whole interactive: every scheduled beat and every
    // animation duration is multiplied by this. Slow and Fast are 1.7x and 0.6x
    // of the timings the piece was tuned at, which stays Medium.
    const SPEEDS = [1.7, 1, 0.6];
    const SPEED_NAMES = ["Slow", "Med", "Fast"];
    let animSpeed = 1;

    // Not every delay should stretch with the speed. A journey should — that is
    // the thing being slowed down to watch. But the beat between a cause and its
    // reaction is perceptual, not choreographic: a word wearing its outline before
    // resolving, or the gap before a box answers something landing on it. Stretch
    // those the same amount and Slow stops reading as slower and starts reading as
    // unresponsive. This damps them to about a third of the speed change, and
    // divides by animSpeed because later() will multiply it back.
    function react(ms) {
      const damped = 1 + (animSpeed - 1) * 0.35;
      return ms * damped / animSpeed;
    }

    const liveAnims = [];

    function playAnim(el, frames, opts) {
      const o = {};
      for (const k in opts) o[k] = opts[k];
      if (typeof o.duration === "number") o.duration = o.duration * animSpeed;
      const a = el.animate(frames, o);
      liveAnims.push(a);
      if (liveAnims.length > 60) {
        for (let i = liveAnims.length - 1; i >= 0; i--) {
          const st = liveAnims[i].playState;
          if (st === "finished" || st === "idle") liveAnims.splice(i, 1);
        }
      }
      return a;
    }

    // Each pending beat remembers when it is due and what it will do, so a speed
    // change can cancel it and re-arm it with its REMAINING time rescaled. A bare
    // setTimeout cannot be stretched once it is running.
    const pending = [];

    function fireLater(rec) {
      const i = pending.indexOf(rec);
      if (i >= 0) pending.splice(i, 1);
      if (rec.seq === animSeq) rec.fn();
    }

    function later(fn, ms) {
      const delay = ms * animSpeed;
      const rec = { fn: fn, seq: animSeq, due: performance.now() + delay, id: 0 };
      rec.id = setTimeout(function () { fireLater(rec); }, delay);
      pending.push(rec);
      animTimers.push(rec.id);
      SIM._timeouts.push(rec.id);
    }

    // Applies a new speed to a run already under way: every beat still to come is
    // re-armed with its remaining time scaled, and every animation still playing
    // has its playbackRate divided by the same factor, so the two halves stay in
    // step. Without both, the timers and the motion they schedule drift apart.
    function rescale(k) {
      if (k === 1) return;
      const now = performance.now();
      pending.slice().forEach(function (rec) {
        clearTimeout(rec.id);
        const remain = Math.max(0, rec.due - now) * k;
        rec.due = now + remain;
        rec.id = setTimeout(function () { fireLater(rec); }, remain);
        animTimers.push(rec.id);
        SIM._timeouts.push(rec.id);
      });
      for (let i = liveAnims.length - 1; i >= 0; i--) {
        const a = liveAnims[i];
        if (a.playState === "finished" || a.playState === "idle") { liveAnims.splice(i, 1); continue; }
        a.playbackRate = a.playbackRate / k;
      }
    }

    // One word at a time: it lights where it sits, travels to the activation
    // cell carrying its own score, and on arrival that score is added to the
    // running total in the cell. The number a student watches climb IS the sum
    // that defines the pathway activation.
    // Everything that flies — word chips, the carried square, the resize cues — is
    // placed from a viewport rectangle and then animated with a transform. Fixed
    // positioning holds it still against the viewport, so scrolling either panel
    // mid-flight slides the content out from under it and it lands nowhere.
    //
    // Each flying thing therefore gets an anchor: a fixed, zero-size wrapper that
    // holds the position, with the animated element inside it. On scroll every
    // live anchor is shifted by how far the panel has moved since it was made, so
    // the flight stays glued to the rows. The two panels scroll in lockstep, so a
    // single delta is right for all of them.
    const flyLive = [];

    // Everything that flies during Weigh — the carried square and its two cues —
    // belongs to one ROW of the flow scroller, so it has to be clipped the way
    // that row is. A fixed anchor on <body> is clipped by nothing, so a carry on
    // a row scrolled out of view played in the open, over the panel's head or
    // below the card. These three go into a clip host instead.
    //
    // The word chips deliberately do NOT: they fly from the readings panel into
    // the flow panel, and either scroller's rectangle would cut that flight in
    // half. If they ever need clipping it is to the two panels' union, not to one.
    // Two regions, because the two flights have different reach. A carry stays
    // inside one row, so "flow" is the flow scroller's viewport exactly. A word
    // chip arcs up to 150px over the rows on its way across — measured, its peak
    // sits 42px ABOVE the scroller band and 83px inside the top of the card — so
    // clipping it to the scroller would cut the arc off. "cards" is the two
    // panels' union, which holds the whole flight and still hides anything
    // scrolled out of the rows.
    const flyClips = {};
    function flyClipRect(kind) {
      if (kind === "cards") {
        const a = document.querySelector(".nnm-readings");
        const b = document.querySelector(".nnm-flowpanel");
        if (a && b) {
          const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
          return { left: Math.min(ra.left, rb.left), top: Math.min(ra.top, rb.top),
                   right: Math.max(ra.right, rb.right), bottom: Math.max(ra.bottom, rb.bottom) };
        }
      }
      return chainBody.getBoundingClientRect();
    }
    function flyClip(kind) {
      let el = flyClips[kind];
      if (!el || !el.isConnected) {
        el = document.createElement("div");
        el.className = "nnm-flyclip";
        document.body.appendChild(el);
        flyClips[kind] = el;
      }
      // Re-aimed only while empty. Moving it with live anchors inside would drag
      // them along with it, since they are positioned against its origin.
      if (!el.firstChild) {
        const r = flyClipRect(kind);
        el.style.left = r.left + "px";
        el.style.top = r.top + "px";
        el.style.width = (r.right - r.left) + "px";
        el.style.height = (r.bottom - r.top) + "px";
      }
      return el;
    }

    function flyAnchor(left, top, kind) {
      const w = document.createElement("div");
      w.className = "nnm-flyanchor";
      let host = document.body;
      if (kind) {
        host = flyClip(kind);
        const h = host.getBoundingClientRect();
        w.classList.add("clipped");
        left -= h.left;
        top -= h.top;
      }
      w.style.left = left + "px";
      w.style.top = top + "px";
      w._s0 = readScroll ? readScroll.scrollTop : 0;
      host.appendChild(w);
      flyLive.push(w);
      return w;
    }

    function dropAnchor(w) {
      const i = flyLive.indexOf(w);
      if (i >= 0) flyLive.splice(i, 1);
      w.remove();
      // A host outlives one flight — the next row's is a few hundred ms behind —
      // so it goes only once nothing is left inside it.
      for (const k in flyClips) {
        if (flyClips[k] && !flyClips[k].firstChild) { flyClips[k].remove(); delete flyClips[k]; }
      }
    }

    function syncFlyLayer() {
      const cur = readScroll ? readScroll.scrollTop : 0;
      for (let i = 0; i < flyLive.length; i++) {
        flyLive[i].style.transform = "translateY(" + (flyLive[i]._s0 - cur) + "px)";
      }
    }

    function flyOne(el, target, v, scores) {
      const r = el.getBoundingClientRect();
      // The square is what the eye reads as the value now, and it sits in the
      // middle of a mostly empty 82px cell — aiming at the cell would send chips
      // to a rim well above it. Its centre is fixed as it grows (it is
      // translate(-50%,-50%)), so it is a stable target mid-flight.
      const tr = (target.querySelector(".nnm-sq") || target).getBoundingClientRect();
      const c = document.createElement("span");
      c.className = "nnm-fly";
      const anchor = flyAnchor(r.left, r.top, "cards");
      // Colours come from the token's own custom properties, not getComputedStyle:
      // `lit` animates the background, so the computed value can still be the
      // un-lit one and the chip would come out transparent.
      c.style.background = scores ? el.style.getPropertyValue("--tok-bg") : "#FFFFFF";
      c.style.color = scores ? el.style.getPropertyValue("--tok-fg") : "var(--nnm-ink-2)";
      if (!scores) c.style.border = "1px solid var(--nnm-rule)";
      c.textContent = el.textContent;
      anchor.appendChild(c);

      // Measure the CHIP, not the word. The chip is placed at the word's top-left
      // but is a different size, so offsetting by the word's centre leaves the
      // chip landing about 20px right of target.
      const cr = c.getBoundingClientRect();
      const dx = (tr.left + tr.width / 2) - (cr.left + cr.width / 2);
      const dy = (tr.top + tr.height / 2) - (cr.top + cr.height / 2);

      // A sampled quadratic Bézier rather than a few waypoints: the control point
      // sits above the midpoint, so the path is a real parabola into the cell.
      // Easing is baked into the sampling and the animation runs linear, because
      // an easing in the options would be re-applied between every keyframe.
      const lift = Math.min(150, Math.abs(dx) * 0.30 + 60);
      const cx = dx * 0.42;
      const cy = Math.min(0, dy) - lift;
      const STEPS = 20;
      const frames = [];
      for (let i = 0; i <= STEPS; i++) {
        const u = i / STEPS;
        const s2 = u * u * (3 - 2 * u);               // smoothstep
        const mt = 1 - s2;
        const x = 2 * mt * s2 * cx + s2 * s2 * dx;
        const y = 2 * mt * s2 * cy + s2 * s2 * dy;
        const sc = 1 - 0.56 * Math.pow(s2, 1.5);
        const rot = (1 - s2) * (dx < 0 ? 5 : -5);
        const op = s2 < 0.74 ? 1 : Math.max(0, 1 - (s2 - 0.74) / 0.26);
        frames.push({
          offset: u,
          transform: "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) rotate(" +
            rot.toFixed(2) + "deg) scale(" + sc.toFixed(3) + ")",
          opacity: op
        });
      }
      playAnim(c, frames, { duration: FLY, easing: "linear", fill: "forwards" });
      later(function () { dropAnchor(anchor); }, FLY + 120);
    }

    function showZero(cell) {
      const z = cell.querySelector(".nnm-num");
      (z || cell).textContent = fmt(0, 4);
      sizeSym(cell, 0, SYM_SCALE, ACT_SCALE);
      cell.style.background = "#fff";
      cell.style.color = "var(--nnm-ink-3)";
      cell.style.borderColor = "rgba(30,36,44,0.14)";
    }

    // nnm-pop and nnm-tick both set `animation` at the same specificity, and
    // .nnm-pop is declared later, so it wins wherever both are present. A cell
    // revealed with a pop would then swallow every kick that followed — the
    // class went on, the animation never changed. Only one is ever left on.
    function bump(cell) {
      cell.classList.remove("nnm-tick", "nnm-pop");
      void cell.offsetWidth;   // restart the animation on a re-add
      cell.classList.add("nnm-tick");
    }

    function showRunning(cell, v) {
      cell.querySelector(".nnm-num").textContent = fmt(v, 4);
      sizeSym(cell, v, SYM_SCALE, ACT_SCALE);
      cell.style.color = "";
      paint(cell, v, ACT_SCALE);
      bump(cell);
    }

    const SCAN_HOLD = 300;   // how long a word wears the outline before resolving
    const FLY = 1440;        // a chip's journey
    // The chip fades out over the last quarter of that, so the last moment it is
    // visible — the moment it reads as having landed — is about here. The box
    // answers then rather than at the formal end, and because it is a fraction of
    // the flight it stays in step at every speed.
    const FLY_LAND = 0.84;
    const PAUSE = 100;       // after the sentence is lit, before the cell opens
    const TO_FLY = 110;      // base held before the first word sets off
    const TAIL = 170;        // after the last arrival, before the next pathway

    function playWords() {
      const it = cases[idx];
      const groups = readings.map(function (r) {
        return Array.prototype.slice.call(r.querySelectorAll(".nnm-tok.scored"));
      });
      const allWords = readings.map(function (r) {
        return Array.prototype.slice.call(r.querySelectorAll(".nnm-tok"));
      });
      if (motionOff()) {
        allWords.forEach(function (g) { g.forEach(function (e) { e.classList.add("lit"); }); });
        rows.forEach(function (r, p) { revealCell(r.querySelector(".act"), 0); });
        wordAnim = false;
        return;
      }
      let t = 0;
      for (let p = 0; p < NP; p++) {
        const toks = groups[p];
        const all = allWords[p];
        const cell = rows[p].querySelector(".act");
        const n = toks.length;
        // Longer conversations send words faster, so a pathway takes roughly the
        // same time to build whether it has four words or fourteen.
        const gap = Math.max(80, Math.min(170, 1100 / Math.max(1, n)));
        const start = t;
        const name = readings[p].querySelector(".nnm-read-name");
        later(function () { name.classList.add("reading"); }, start);

        // 1. every word in the sentence is scanned in turn — outlined, then
        //    resolved to a colour if this pathway knows it, or left white if not.
        //    Scanning all of them, not just the scoring ones, is the point: the
        //    model reads the whole sentence.
        const scanGap = Math.max(55, Math.min(120, 1400 / Math.max(1, all.length)));
        all.forEach(function (el, i) {
          later(function () { el.classList.add("scanning"); }, start + i * scanGap);
          later(function () {
            el.classList.remove("scanning");
            if (el.classList.contains("scored")) el.classList.add("lit");
          }, start + i * scanGap + react(SCAN_HOLD));
        });

        // 2. the cell opens empty, at zero
        const opened = start + all.length * scanGap + react(SCAN_HOLD) + PAUSE;
        later(function () { cell.classList.remove("empty"); showZero(cell); }, opened);

        // 3. Only the words this pathway scores travel. That every word was read
        //    is already said by the scan above, which outlines all of them one at
        //    a time; flying them all as well repeats that and adds a claim that is
        //    not true — a word this pathway has no entry for did not contribute a
        //    zero, it has no value here at all. So the three beats each mean one
        //    thing: the scan reads, the flight contributes, the bounce moves the
        //    number.
        //    The pathway's constant base value rides in with the first word rather
        //    than appearing on its own beforehand: it is 0.2-0.9% of each pathway's
        //    range, and the thing it was meant to stand for — the length of the
        //    text — is not in this data, since it is the same value for a 12-word
        //    conversation and a 40-word one.
        let running = 0;
        const flyFrom = opened + TO_FLY;
        // They travel in order of value, not in the order they appear in the
        // sentence: most negative first, most positive last. The total then falls
        // to its lowest point and climbs back, so the two directions are separated
        // in time instead of cancelling each other out at random. Identical words
        // carry identical values, so repeats naturally arrive together.
        const order = toks.slice().sort(function (x, y) {
          return D.vocabulary[x.textContent][1] - D.vocabulary[y.textContent][1];
        });
        order.forEach(function (el, i) {
          const v = D.vocabulary[el.textContent][1];
          const add = i === 0 ? v + D.baseValues[p] : v;
          later(function () { flyOne(el, cell, v, true); }, flyFrom + i * gap);
          later(function () {
            running += add;
            showRunning(cell, running);
          }, flyFrom + i * gap + FLY * FLY_LAND);
        });
        // Ten of the 800 conversations leave some pathway with no words it knows.
        // Nothing to fold the base into, so the cell lands on its answer directly.
        if (n === 0) {
          later(function () { showRunning(cell, it.act[p]); }, flyFrom);
        }

        // land on the stored activation, not the accumulated float, so the cell
        // agrees to the last digit with every other number on screen
        later(function () {
          cell.querySelector(".nnm-num").textContent = fmt(it.act[p], 4);
          sizeSym(cell, it.act[p], SYM_SCALE, ACT_SCALE);
          paint(cell, it.act[p], ACT_SCALE);
        }, flyFrom + n * gap + FLY + 40);

        t = flyFrom + n * gap + FLY + TAIL;
        later(function () { name.classList.remove("reading"); }, t);
      }
      later(function () { wordAnim = false; }, t);
    }

    const WGT_MIN = 46;      // narrowest a weighted box gets, still fits its number

    // Weighted boxes are sized against the largest weighted value in THIS
    // conversation, so the row shows how much of this decision each pathway is
    // responsible for. On most conversations Pathway 1 fills its slot and the other two
    // are slivers — which is the point, and is what the stacked bar used to say.
    function weightedWidth(w, maxAbs, full) {
      if (!maxAbs) return full;
      return WGT_MIN + (full - WGT_MIN) * Math.min(1, Math.abs(w) / maxAbs);
    }

    // The Weigh step carries a copy of the activation square across the row: it
    // slides onto the importance box, is resized and — when importance is
    // negative — turned over, and then travels on to become the weighted
    // activation. The turn is the point. Multiplying by a negative flips the
    // sign, and a square that physically rotates and comes back the other colour
    // says that in a way "x -1.75" does not. In this data Pathway 3's importance
    // is the negative one, so it always flips and the other two never do; across
    // conversations that gives all four sign combinations.
    // The middle of the journey is two separate beats, not one. Resizing and
    // turning over at the same time made both hard to read — the square was
    // changing shape while it was edge-on. Now it settles at its new size, and
    // only then turns. Each beat gets its own cue: the corner arrows belong to
    // the resize, the arc to the turn.
    const CARRY_A = 400;      // activation square -> importance box
    const CARRY_SCALE = 620;  // resize, on every row
    const CARRY_FLIP = 780;   // turn over, only where importance is negative
    const CARRY_C = 400;      // -> weighted activation
    const CARRY_GAP = 200;    // before the next pathway sets off
    // The importance value takes its ink over the last stretch of the approach,
    // so it has finished changing BY THE TIME the square lands rather than
    // starting to change once everything has stopped. Must match the colour
    // transition on .nnm-cell.imp .nnm-num.
    const IMP_INK = 200;
    // The last leg's SETTLE easing gets there at HALF its duration: measured on
    // cubic-bezier(.34,1.26,.52,1), progress crosses 1.0 at t=0.503, then spends
    // the remaining 200ms overshooting 2% and settling back. That crossing is the
    // arrival the eye reads and the box's own bounce, so the weighted value
    // appears and takes its kick THERE, not when the animation formally ends.
    //
    // It is also when the white stand-in under Weighted Activation goes, because
    // the two are the same event: .nnm-sq is not replaced, apply() takes .empty
    // off it and it becomes the real square. The travelling square's centre is
    // over the stand-in's centre at that instant (0.503 of 400ms = 201ms), which
    // is where this 200 puts it. Do not add a second timer to hide the stand-in
    // — it would land a millisecond after apply() and hide the real value.
    const WGT_LEAD = 200;

    // Rows that flip take longer than rows that do not, which is right: the turn
    // is the thing worth waiting for, and a row that held still to pad the timing
    // out would read as stalled.
    function carryTotal(p) {
      return CARRY_A + CARRY_SCALE + (IMP[p] < 0 ? CARRY_FLIP : 0) + CARRY_C;
    }

    // Only the rows whose importance is negative get this. It sits to the RIGHT of
    // the importance box and traces the path the square's top edge takes: up, over
    // the top, and down the far side — which is what a turn about the horizontal
    // axis looks like from the side. Same line weight, cap and grey as the corner
    // cues, so the three read as one family of instructions rather than three
    // separate decorations. Drawn rather than shown, in step with the turn.
    function flipCue(box, dur) {
      const W = 28, H = 28;
      // Above the box, centred. Now that the square turns about its vertical axis
      // the cue is a plan view of that turn — a wide flat loop, left edge going
      // back and round to the right — so it has to sit over the box rather than
      // beside it. Above rather than below: below is where the row's number sits,
      // 35px away, while above there is a clear 45px to the row before.
      const anc = flyAnchor(box.left + box.width / 2, box.top, "flow");
      const el = document.createElement("div");
      el.className = "nnm-flipcue";
      el.style.width = W + "px";
      el.style.height = H + "px";
      el.style.marginLeft = "-14px";
      // 7px of air under the lowest ink — the head's outer arm at y=21.5, not the
      // foot of the viewBox.
      el.style.marginTop = "-29px";
      // A flat loop seen from above: 270 degrees of a wide, shallow ellipse, open
      // at the left, running out along the top, round the far end and back along
      // the bottom to a head pointing left — the path the square's near face takes
      // when it turns about its vertical axis and comes back facing the other way.
      // Going well past 180 is what makes it read as a turn; a half circle stops
      // while it is still ambiguous with an arch.
      // Drawn as the resize cues are, so the two cues on this box are one family:
      // same 1.7-ish stroke, same round caps, same open chevron of arm 3.3 and
      // half-width 2.9, rather than a solid head.
      el.innerHTML =
        '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true" fill="none" ' +
          'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" ' +
          'stroke-linejoin="round">' +
          '<path class="arc" d="M4.5 10.2 A11 5.5 0 1 1 8.5 17.8"/>' +
          '<path class="head" d="M12.5 15.9 L8.5 17.8 L10.9 21.5"/>' +
        '</svg>';
      anc.appendChild(el);

      const arc = el.querySelector(".arc");
      const len = arc.getTotalLength ? arc.getTotalLength() : W + H;
      arc.setAttribute("stroke-dasharray", len);
      arc.setAttribute("stroke-dashoffset", len);
      playAnim(arc, [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
        { duration: dur * 0.6, easing: "cubic-bezier(.3,0,.35,1)", fill: "forwards" });
      playAnim(el.querySelector(".head"), 
        [{ opacity: 0 }, { opacity: 0, offset: 0.52 }, { opacity: 1, offset: 0.72 },
         { opacity: 1 }],
        { duration: dur, fill: "forwards" });
      playAnim(el, [{ opacity: 1 }, { opacity: 1, offset: 0.82 }, { opacity: 0 }],
        { duration: dur + 160, fill: "forwards" });
      later(function () { dropAnchor(anc); }, dur + 200);
    }

    // grow: arrows sit close in and push out. shrink: they start wide and close in.
    function resizeCue(box, scale, dur) {
      // Only skip a change too small to see. At 4% this also swallowed Pathway 3
      // on 75 of the 800 conversations — its scale runs 1.01 to 1.17 — and a row
      // that flips but shows no arrows reads as broken.
      if (Math.abs(scale - 1) < 0.015) return;
      const grow = scale > 1;
      const cx = box.left + box.width / 2, cy = box.top + box.height / 2;
      const half = Math.max(box.width, box.height) / 2;
      const near = half + 7, far = half + 7 + Math.min(16, 6 + Math.abs(scale - 1) * 7);
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (q) {
        const a = document.createElement("div");
        a.className = "nnm-cue";
        // The glyph points away from the centre; a shrinking cue is turned around.
        const rot = Math.atan2(q[1], q[0]) * 180 / Math.PI + (grow ? 0 : 180);
        a.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true">' +
          '<path d="M1.5 6 H8.5 M5.6 3.1 L8.9 6 L5.6 8.9" fill="none" ' +
          'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" ' +
          'stroke-linejoin="round"/></svg>';
        const anc = flyAnchor(cx, cy, "flow");
        anc.appendChild(a);
        const d0 = grow ? near : far, d1 = grow ? far : near;
        const at = function (d) {
          return "translate(-50%,-50%) translate(" + (q[0] * d * 0.72).toFixed(1) + "px," +
            (q[1] * d * 0.72).toFixed(1) + "px) rotate(" + rot.toFixed(1) + "deg)";
        };
        playAnim(a, 
          [{ transform: at(d0), opacity: 0 },
           { transform: at(d0 + (d1 - d0) * 0.25), opacity: 1, offset: 0.3 },
           { transform: at(d1), opacity: 1, offset: 0.78 },
           { transform: at(d1), opacity: 0 }],
          { duration: dur, easing: "cubic-bezier(.35,0,.3,1)", fill: "forwards" });
        later(function () { dropAnchor(anc); }, dur + 60);
      });
    }

    function carry(p, wv, av) {
      const row = rows[p];
      const from = row.querySelector(".act .nnm-sq");
      const via = row.querySelector(".imp .nnm-sq");
      const to = row.querySelector(".wgt .nnm-sq");
      if (!from || !via || !to) return;
      const a = from.getBoundingClientRect();
      const i = via.getBoundingClientRect();
      const w = to.getBoundingClientRect();
      if (a.width < 1) return;

      // Where it is going and how big it will be when it gets there. The target
      // square is still the empty stand-in, so its size is computed, not measured.
      const endSide = SYM_MIN + (SYM_MAX - SYM_MIN) *
        Math.sqrt(Math.min(1, Math.abs(wv) / SYM_SCALE));
      const flips = (IMP[p] < 0);
      // Both the starting size and colour are computed from the activation, never
      // read off the screen. Weigh can be pressed before Activate, in which case
      // the square underneath is still the empty stand-in — and even when it has
      // been filled, its 0.35s transition means getComputedStyle hands back the
      // value it is transitioning FROM, which is white.
      const startSide = SYM_MIN + (SYM_MAX - SYM_MIN) *
        Math.sqrt(Math.min(1, Math.abs(av) / SYM_SCALE));
      const startBg = av === 0 ? "#FFFFFF"
        : (av > 0 ? FILL_POS : FILL_NEG)[level(Math.min(1, Math.abs(av) / ACT_SCALE))];
      const endBg = wv === 0 ? "#FFFFFF"
        : (wv > 0 ? FILL_POS : FILL_NEG)[level(Math.min(1, Math.abs(wv) / SUM_SCALE))];

      const c = document.createElement("div");
      c.className = "nnm-carry";
      // Anchored on the square's CENTRE, and the element centres itself on that
      // point with translate(-50%,-50%). Growing then keeps the centre still,
      // which is what scale() used to do for free.
      const anc = flyAnchor(a.left + a.width / 2, a.top + a.height / 2, "flow");
      c.style.width = startSide + "px";
      c.style.height = startSide + "px";
      c.style.background = startBg;
      anc.appendChild(c);

      const cx = a.left + a.width / 2, cy = a.top + a.height / 2;
      const dxI = (i.left + i.width / 2) - cx, dyI = (i.top + i.height / 2) - cy;
      const dxW = (w.left + w.width / 2) - cx, dyW = (w.top + w.height / 2) - cy;
      const sc = endSide / startSide;
      // The square resizes by animating its WIDTH AND HEIGHT, not by scale(). A
      // transform scale multiplies everything it touches — at Pathway 1's 3.3x the
      // 1px outline renders over 3px thick and the 3px corner radius near 10px, so
      // the travelling square stopped matching the ones it comes from and lands on.
      //
      // perspective() AFTER the translate, not before it. Transform functions apply
      // right to left, so leading with perspective applies it in the parent's space
      // with the square already carried far from the perspective origin — the turn
      // comes out skewed rather than foreshortening about the square's own centre.
      //
      // rotateY, about the vertical axis. Sign lives on a horizontal axis
      // everywhere else here — the contribution ramp runs negative-blue on the left
      // to positive-orange on the right, and every square's colour is read against
      // it — so a change of sign IS a traverse of that axis, and the box turning
      // around to face the other end of the ramp rehearses the journey its new
      // colour then confirms.
      // This was rotateX, on the argument that a turn about the vertical axis runs
      // parallel to the square's travel and is absorbed into it. That only holds if
      // the two happen at once, and they do not: the square is stationary on the
      // importance box for the whole of this beat, between the move in and the move
      // out. What is left is that the eye is primed for rightward motion, which the
      // dedicated beat and the cue arrow answer.
      function tf(dx, dy, deg) {
        return "translate(-50%,-50%) translate(" + dx.toFixed(1) + "px," +
          dy.toFixed(1) + "px) perspective(520px) rotateY(" + deg + "deg)";
      }
      const px = function (v) { return v.toFixed(1) + "px"; };
      const endPx = px(endSide), startPx = px(startSide);

      // Three legs, each starting where the last one finished. Scheduled on the
      // interactive's own timers rather than chained on onfinish: a cancelled
      // animation never fires onfinish, so a chain built that way strands the
      // clone on screen the moment the step is interrupted. later() is cleared by
      // cancelAnim along with everything else.
      const end = flips ? 180 : 0;
      // Arrivals settle rather than stop dead. The overshoot is the same 1.3 the
      // cells' own pop uses, so the whole interactive moves with one weight.
      const SETTLE = "cubic-bezier(.34,1.26,.52,1)";
      playAnim(c, [{ transform: tf(0, 0, 0) }, { transform: tf(dxI, dyI, 0) }],
        { duration: CARRY_A, easing: SETTLE, fill: "forwards" });

      // Four arrows at the corners of the importance box, pointing the way the
      // square is about to change size. Direction comes from the measured scale,
      // not from the importance value: the 12px floor can stop a square that
      // "should" shrink from shrinking, and an arrow that contradicts what you
      // can see is worse than no arrow. Together with the flip they carry the two
      // halves of the rule — the sign turns it over, the magnitude resizes it.
      // Beat one: resize. A row that does not flip takes its final colour here
      // too, since only the magnitude is changing.
      // One beat, not two: the value takes its ink and its kick together, on the
      // way in. The colour runs out exactly as leg one finishes — see IMP_INK.
      later(function () {
        row.classList.add("lit-imp");
        bump(row.querySelector(".imp .nnm-num"));
      }, Math.max(0, CARRY_A - IMP_INK));

      later(function () {
        resizeCue(i, sc, CARRY_SCALE);
        playAnim(c, 
          [{ transform: tf(dxI, dyI, 0), width: startPx, height: startPx, background: startBg },
           { transform: tf(dxI, dyI, 0), width: endPx, height: endPx,
             background: flips ? startBg : endBg }],
          // A touch more overshoot than the travel legs: a square that grows past
          // its size and settles back reads as being pushed to that size.
          { duration: CARRY_SCALE, easing: "cubic-bezier(.34,1.45,.56,1)", fill: "forwards" });
      }, CARRY_A);

      // Beat two: the turn, at the new size, with the colour swapped at the
      // halfway point where the square is edge-on and cannot be seen changing.
      if (flips) {
        later(function () {
          flipCue(i, CARRY_FLIP);
          playAnim(c, 
            [{ transform: tf(dxI, dyI, 0), width: endPx, height: endPx, background: startBg, offset: 0 },
             { transform: tf(dxI, dyI, 90), width: endPx, height: endPx, background: startBg, offset: 0.5 },
             { transform: tf(dxI, dyI, 90), width: endPx, height: endPx, background: endBg, offset: 0.5001 },
             { transform: tf(dxI, dyI, 180), width: endPx, height: endPx, background: endBg, offset: 1 }],
            // No overshoot here on purpose. A turn that goes past 180 and comes
            // back reads as wobbling; this beat has to land exactly reversed.
            { duration: CARRY_FLIP, easing: "cubic-bezier(.45,0,.3,1)", fill: "forwards" });
        }, CARRY_A + CARRY_SCALE);
      }

      const outAt = CARRY_A + CARRY_SCALE + (flips ? CARRY_FLIP : 0);

      later(function () {
        playAnim(c, 
          [{ transform: tf(dxI, dyI, end), width: endPx, height: endPx },
           { transform: tf(dxW, dyW, end), width: endPx, height: endPx }],
          { duration: CARRY_C, easing: SETTLE, fill: "forwards" });
      }, outAt);

      // Handed over once the square is most of the way there, so the line catches
      // it on arrival rather than following it the whole way across.
      later(function () {
        carryFor[p] = c;
        // Draw at once, then follow. trackConnectors returns early when a loop is
        // already running, so on its own the handover would not take effect until
        // the next frame — and the attach has to be instant.
        drawConnectors(lastChosen);
        trackConnectors(CARRY_C * 0.6 + 80);
      }, outAt + CARRY_C * 0.45);

      // The carry keeps its overshoot and settle — that bounce is the landing. The
      // square it lands on is the one that gives way: apply() uncovers the real
      // one at the crossing, 200ms before this, so it spent the whole settle
      // standing out from behind the moving square. It is held invisible until
      // here (see .under) and revealed as the carry goes, both at full size in the
      // same place, so the handover cannot be seen.
      later(function () {
        row.querySelector(".wgt").classList.remove("under");
        dropAnchor(anc);
      }, outAt + CARRY_C + 40);
    }

    function playWeigh() {
      const it = cases[idx];
      const wgt = it.act.map(function (a, p) { return a * IMP[p]; });
      const maxAbs = Math.max.apply(null, wgt.map(Math.abs));
      const full = rows[0].querySelector(".nnm-slot").getBoundingClientRect().width;
      const apply = function (p) {
        const cell = rows[p].querySelector(".wgt");
        cell.style.width = Math.round(weightedWidth(wgt[p], maxAbs, full)) + "px";
        cell.querySelector(".nnm-num").textContent = fmt(wgt[p], 4);
        // Uncovered, not grown. The square is still at the 12px stand-in size and
        // would transition up to its real size just as the carried square lands on
        // it — a second, smaller arrival underneath the first. The transition is
        // suspended so it is simply already the right size when it appears, and
        // the handoff from the carried square is invisible.
        const sq = cell.querySelector(".nnm-sq");
        if (sq) sq.style.transition = "none";
        sizeSym(cell, wgt[p], SYM_SCALE);
        paint(cell, wgt[p], SUM_SCALE);
        cell.classList.remove("empty", "nnm-pop", "nnm-tick");
        if (sq) { void sq.offsetWidth; sq.style.transition = ""; }
        // The VALUE is kicked as it appears, the same 1.09 the importance value
        // takes when the square lands on it. The number only — the cell keeps its
        // tick removed above, because a box that grows here would give away the
        // handoff the suspended transition exists to hide.
        bump(cell.querySelector(".nnm-num"));
        // The number, the colour and the kick all land here. The square does not:
        // a carry is still settling on top of it and the two would double up. The
        // drop timer in carry() takes this off.
        if (carryFor[p]) cell.classList.add("under");
        carryFor[p] = null;
        trackConnectors(motionOff() ? 0 : 520);
      };

      if (motionOff()) {
        rows.forEach(function (r) { r.classList.add("lit-mul", "lit-eq", "lit-imp"); });
        for (let p = 0; p < NP; p++) apply(p);
        weighAnim = false;
        return;
      }

      let t = 0;
      for (let p = 0; p < NP; p++) {
        (function (pi, start, total) {
          const r = rows[pi];
          later(function () {
            r.classList.add("lit-mul");
            bump(r.querySelector(".nnm-op.mul"));
            carry(pi, wgt[pi], it.act[pi]);
          }, start);
          // No kick on the importance box: the carried square arriving on top of
          // it is the event, and a box that jumps at the same moment competes
          // with the thing it is meant to be multiplied by.
          later(function () {
            r.classList.add("lit-eq");
            bump(r.querySelector(".nnm-op.eq"));
          }, start + total - CARRY_C);
          later(function () { apply(pi); }, start + total - WGT_LEAD);
        })(p, t, carryTotal(p));
        t += carryTotal(p) + CARRY_GAP;
      }
      later(function () { weighAnim = false; }, t);
    }

    // How long one converging line takes to draw. The three run in turn, each
    // followed by the total it just changed.
    const DRAW = 620;

    const SUM_HOLD = 200;    // the total sits with its new value before the next line
    // The draw eases out — with this curve a line is all but touching its target
    // well before the 620ms formally ends. Reacting on that deadline reads as a
    // beat too late, so whatever the line delivers moves slightly ahead of it and
    // lands with the line rather than after it. Used by Add up and by Predict.
    const DRAW_LEAD = 90;

    // Fills the sum with a partial total. The first arrival reveals the cell;
    // later ones kick it, the same grammar the pathway activations use.
    function showSum(v, first) {
      sumCell.classList.remove("empty");
      sumCell.querySelector(".nnm-num").textContent = fmt(v, 4);
      sizeSym(sumCell, v, SYM_SCALE);
      paint(sumCell, v, SUM_SCALE);
      if (first) revealCell(sumCell, 0); else bump(sumCell);
    }

    function playAddUp() {
      if (motionOff()) {
        for (let i = 0; i < NP; i++) solidPending[i] = false;
        addUpAnim = false;
        trackConnectors(0);
        return;
      }
      for (let i = 0; i < NP; i++) solidPending[i] = true;
      // Draw at once. trackConnectors returns early when a follow loop is already
      // running, so on a re-click the lines would stay drawn until the next frame
      // and the replay would appear to do nothing for its first beat.
      drawConnectors(lastChosen);
      trackConnectors(0);

      // One line at a time, each followed by the total it just changed, so the
      // sum is seen being built out of three contributions rather than appearing
      // whole once the lines have all landed.
      const it = cases[idx];
      let running = 0;
      let t = 60;
      for (let i = 0; i < NP; i++) {
        const p = i;
        later(function () {
          solidPending[p] = false;
          // Redraw first so the resting attribute reads "drawn": the animation has
          // no fill, so when it ends the attribute is what keeps the line visible.
          drawConnectors(lastChosen);
          const sol = convSolid[p];
          const len = parseFloat(sol.getAttribute("stroke-dasharray")) || 0;
          playAnim(sol, 
            [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
            { duration: DRAW, easing: "cubic-bezier(.3,0,.35,1)" }
          );
        }, t);
        const react = t + DRAW - DRAW_LEAD;
        later(function () {
          running += it.act[p] * IMP[p];
          showSum(running, p === 0);
        }, react);
        t = react + SUM_HOLD;
      }
      later(function () { addUpAnim = false; }, t - SUM_HOLD + 30);
    }

    // The two answers are on screen from the start, plain. Decide draws the line
    // to the one the sum picked, and only when it arrives does that answer take
    // its colour — the line delivers the result rather than confirming it.
    function playDecide() {
      if (motionOff()) {
        decidePending = false;
        decideAnim = false;
        trackConnectors(0);
        return;
      }
      decidePending = true;
      trackConnectors(0);
      later(function () {
        decidePending = false;
        drawConnectors(lastChosen);
        const flen = fanSolid.getTotalLength ? fanSolid.getTotalLength() : 0;
        playAnim(fanSolid, 
          [{ strokeDashoffset: flen }, { strokeDashoffset: 0 }],
          { duration: DRAW, easing: "cubic-bezier(.3,0,.35,1)" }

      // canvas hides them.
      if (cr0.width < 2) {
        conv.style.visibility = "hidden";
      } else {
        conv.style.visibility = "";
        conv.setAttribute("viewBox", "0 0 " + cr0.width + " " + cr0.height);
        const sc = symRect(sumCell);
        const ty = sc.top + sc.height / 2 - cr0.top;
        // The sum square's own left edge. The SVG's right border is not the same
        // place — the square overhangs its cell and changes size — so ending the
        // lines at the border left a gap that grew and shrank with the value.
        const tx = sc.left - cr0.left;
        rows.forEach(function (r, i) {
          const rr = carryFor[i]
            ? carryFor[i].getBoundingClientRect()
            : symRect(r.querySelector(".wgt"));
          const y = rr.top + rr.height / 2 - cr0.top;
          const x = rr.right - cr0.left;
          const ln = convPaths[i];
          ln.setAttribute("x1", x);
          ln.setAttribute("y1", y);
          ln.setAttribute("x2", tx);
          ln.setAttribute("y2", ty);

          const sol = convSolid[i];
          sol.setAttribute("x1", x);
          sol.setAttribute("y1", y);
          sol.setAttribute("x2", tx);
          sol.setAttribute("y2", ty);
          const len = Math.hypot(tx - x, ty - y);
          sol.setAttribute("stroke-dasharray", len);
          // Resting state: fully drawn once Add up has run, fully hidden before.
          // A running animation still overrides this, so redraws during the draw
          // reposition the line without cutting the animation short.
          sol.setAttribute("stroke-dashoffset", (step >= 3 && !solidPending[i]) ? 0 : len);
        });
      }

      const fr = fan.getBoundingClientRect();
      if (fr.width < 2) { fan.style.visibility = "hidden"; return; }
      fan.style.visibility = "";
      fan.setAttribute("viewBox", "0 0 " + fr.width + " " + fr.height);
      const sc2 = symRect(sumCell);
      const sy = sc2.top + sc2.height / 2 - fr.top;
      // Anchored the same way at both ends: it leaves the sum square's right edge
      // and arrives at the answer's left edge, wherever those happen to be.
      const sx = sc2.right - fr.left;
      outEls.forEach(function (o, i) {
        const orr = o.el.getBoundingClientRect();
        const oy = orr.top + orr.height / 2 - fr.top;
        const ox = orr.left - fr.left;
        const span = ox - sx;
        const pth = i === 0 ? fanUp : fanDown;
        pth.setAttribute("d", "M" + sx + " " + sy +
          " C " + (sx + span * 0.55) + " " + sy + ", " +
          (sx + span * 0.45) + " " + oy + ", " + ox + " " + oy);
      });

      const chosenPath = chosen === 1 ? fanUp : fanDown;
      fanSolid.setAttribute("d", chosenPath.getAttribute("d") || "");
      const flen = fanSolid.getTotalLength ? fanSolid.getTotalLength() : 0;
      fanSolid.setAttribute("stroke-dasharray", flen);
      fanSolid.setAttribute("stroke-dashoffset", (step >= 4 && !decidePending) ? 0 : flen);
    }

    // ---------- render ----------
    function render() {
      const empty = cases.length === 0;
      casePanel.style.display = empty ? "none" : "";
      chainPanel.style.visibility = empty ? "hidden" : "";
      emptyMsg.hidden = !empty;
      if (empty) return;
      if (idx >= cases.length) idx = cases.length - 1;
      const it = cases[idx];

      countEl.textContent = (idx + 1) + " / " + cases.length;
      setAriaDisabled(prevBtn, idx === 0);
      setAriaDisabled(nextBtn, idx === cases.length - 1);
      caseIdEl.title = "#" + it.id;   // id kept for cross-referencing the explorer

      // all three readings, on the one shared colour scale shown above them
      readings.forEach(function (r, p) {
        const txt = r.querySelector(".nnm-read-text");
        txt.innerHTML = "";
        it.text.split(/\s+/).forEach(function (w, wi) {
          if (wi) txt.appendChild(document.createTextNode(" "));
          const span = document.createElement("span");
          span.className = "nnm-tok";
          span.textContent = w;
          const v = D.vocabulary[w];
          // The tooltips say what the model made of a word, so they arrive with
          // the step that shows it. Before Activate the sentence is deliberately
          // plain, and a hover that gave up the value — or, on a blank, the
          // pathway that owns it — would hand over the answer the step exists to
          // reveal, while the words on screen still say nothing has been read.
          const told = step >= 1;
          if (v && v[0] === p) {
            const L = level(Math.min(1, Math.abs(v[1]) / TOK_MAX));
            span.classList.add("scored");
            span.style.setProperty("--tok-bg", (v[1] >= 0 ? FILL_POS : FILL_NEG)[L]);
            span.style.setProperty("--tok-fg", L === 4 ? "#fff" : "#1E242C");
            if (told) span.title = w + ": " + fmt(v[1], 4);
            // Lit straight away unless the Words sequence is about to light them
            // one at a time.
            if (step >= 1 && !wordAnim) span.classList.add("lit");
          } else if (v) {
            // Each of the 30 words belongs to exactly one pathway. Naming that
            // one turns a blank from "this word did not matter" into a fact.
            // No verb: half the vocabulary is negative, so "activates" would be
            // wrong for those, and "scores" is a term used nowhere else here.
            if (told) span.title = w + ": a " + PATH_NAMES[v[0]] + " word";
          }
          txt.appendChild(span);
        });
      });

      labelsEl.innerHTML = "";
      // Three different things are on screen and they must not share a word:
      // the column above is the PATHWAYS' prediction, Model is the model's own,
      // and Actual is the truth. They disagree on 7% of conversations, which is
      // the whole point of Day 3 — so "Prediction" alone was ambiguous here.
      [["Actual", it.target], ["Model", it.pred]].forEach(function (pair) {
        const row = document.createElement("div");
        row.className = "nnm-label-row";
        const b = document.createElement("b"); b.textContent = pair[0];
        row.appendChild(b); row.appendChild(pill(pair[1]));
        labelsEl.appendChild(row);
      });
      if (it.pred !== it.target) {
        const f = document.createElement("div");
        f.className = "nnm-label-row";
        const sp = document.createElement("span");
        sp.className = "nnm-flag"; sp.textContent = "MODEL WAS WRONG";
        f.appendChild(sp); labelsEl.appendChild(f);
      }

      // the flow
      const wgt = []; let sum = 0;
      const revealed = function (el, on, wasOn, delay) {
        el.classList.toggle("empty", !on);
        el.classList.remove("nnm-pop");
        if (on && !wasOn) {
          void el.offsetWidth;                 // restart the animation
          el.style.animationDelay = (delay || 0) + "ms";
          el.classList.add("nnm-pop");
        }
      };
      for (let p = 0; p < NP; p++) {
        const a = it.act[p], w = a * IMP[p];
        wgt.push(w); sum += w;
        const r = rows[p];
        const actC = r.querySelector(".act"), impC = r.querySelector(".imp"), wgtC = r.querySelector(".wgt");
        writeCell(actC, a, ACT_SCALE, SYM_SCALE);
        impC.querySelector(".nnm-num").textContent = fmt(IMP[p], 4);
        sizeSym(impC, IMP[p], SYM_SCALE, IMP_MAX);
        writeCell(wgtC, w, SUM_SCALE, SYM_SCALE);
        revealed(actC, step >= 1 && !wordAnim, prevStep >= 1 && !wordAnim, p * 90);
        // Importance is never revealed: it is not produced by the step before it.
        // It is a property of the model — the same three numbers on all 800
        // conversations, unchanged by any step — so it is on screen from the
        // start, and staying put while everything around it moves is the point.
        impC.classList.remove("empty");
        if (!weighAnim) wgtC.classList.remove("under");
        revealed(wgtC, step >= 2 && !weighAnim, prevStep >= 2 && !weighAnim, p * 90 + 140);
        if (step >= 2 && !weighAnim) {
          const slot = r.querySelector(".nnm-slot").getBoundingClientRect().width;
          const maxAbs = Math.max.apply(null, it.act.map(function (a, k) { return Math.abs(a * IMP[k]); }));
          wgtC.style.width = Math.round(weightedWidth(w, maxAbs, slot)) + "px";
        } else if (step < 2) {
          wgtC.style.width = "";
        }
        if (!weighAnim) {
          r.classList.toggle("lit-mul", step >= 2);
          r.classList.toggle("lit-eq", step >= 2);
          r.classList.toggle("lit-imp", step >= 2);
        } else {
          r.classList.remove("lit-mul", "lit-eq", "lit-imp");
        }
      }
      // conv/fan visibility is owned by drawConnectors — see the note there.

      sumCell.querySelector(".nnm-num").textContent = fmt(sum, 4);
      sizeSym(sumCell, sum, SYM_SCALE);
      paint(sumCell, sum, SUM_SCALE);
      revealed(sumCell, step >= 3 && !addUpAnim, prevStep >= 3 && !addUpAnim, 260);

      const chosen = sum > 0 ? 1 : 0;
      lastChosen = chosen;
      outEls.forEach(function (o) {
        o.el.classList.remove("empty");
        o.el.classList.toggle("on", o.v === chosen && step >= 4 && !decideAnim);
      });

      // Held back until the Decide animation has finished, so the answer lands
      // before the comparison against it appears.
      if (step >= 4) {
        if (prevStep < 4) {
          labelsEl.style.visibility = "hidden";
          const t = setTimeout(function () {
            labelsEl.style.visibility = "";
            labelsEl.classList.remove("nnm-pop"); void labelsEl.offsetWidth;
            labelsEl.classList.add("nnm-pop");
          }, motionOff() ? 0 : DECIDE_SETTLED);
          SIM._timeouts.push(t);
        } else {
          labelsEl.style.visibility = "";
        }
      } else {
        labelsEl.style.visibility = "hidden";
      }

      noteEl.textContent = (step >= 4 && chosen !== it.pred)
        ? "The pathways and the model point different ways on this one. The pathways are a "
          + "summary of the model, not a copy of it — they land on the same answer in about "
          + "9 cases out of 10." : "";

      stepBtns.forEach(function (b, i) {
        const n = i + 1;
        b.classList.toggle("on", n === step);
        b.setAttribute("aria-pressed", n === step ? "true" : "false");
      });
      resetBtn.disabled = step === 0;

      fitFlow();

      alignTops();
      syncRows();
      alignHeadCaptions();
      // Widths may have just changed here too, so follow them rather than drawing once.
      trackConnectors(motionOff() ? 0 : 520);
      prevStep = step;

      SIM.announce("Conversation " + (idx + 1) + " of " + cases.length +
        ". Weighted sum " + fmt(sum) + ". Pathways say " + (chosen ? "approach" : "wait") + ".");
    }

    // The readings and the flow rows are aligned line for line, so they have to
    // scroll as one. The right side is taller (bar, hint, note sit below the rows),
    // so its scrollTop simply clamps when the left runs out — the guard stops the
    // two handlers bouncing the value back and forth.
    let syncingScroll = false;
    function linkScroll(a, b) {
      a.addEventListener("scroll", function () {
        if (syncingScroll) return;
        syncingScroll = true;
        b.scrollTop = a.scrollTop;
        requestAnimationFrame(function () { syncingScroll = false; });
      }, { passive: true });
    }
    linkScroll(readScroll, chainBody);
    linkScroll(chainBody, readScroll);
    readScroll.addEventListener("scroll", syncFlyLayer, { passive: true });
    chainBody.addEventListener("scroll", syncFlyLayer, { passive: true });

    prevBtn.addEventListener("click", function () { if (idx > 0) goToCase(idx - 1); });
    nextBtn.addEventListener("click", function () { if (idx < cases.length - 1) goToCase(idx + 1); });

    SIM.onResize = function () { SIM._rafs.push(requestAnimationFrame(render)); };
    render();

    return wrap;
  }

  // ---------------------------------------------------------------
  // 1A — Trace a Case.  Design Sketches slide 9: input layer, hidden layers,
  // output, neurons coloured by activation, weights on the edges, and the point
  // the slide writes under it — "that's what is really happening" and "difficult
  // to interpret". The whole of Day 1 turns on that second line: a case really
  // can be followed through the network, and following it teaches you nothing.
  // That is what pathways are for, which is 1B.
  //
  // What is real here and what is not, because the difference matters and the
  // About copy says so too:
  //   REAL  — the conversation, its words, and which of the 30 vocabulary words
  //           it contains; the label a human gave it; and the decision, which is
  //           computed by tallying each word's measured lean toward Approach or
  //           Wait over the whole set (that rule is right on 95.8% of the 800).
  //   TOY   — the two hidden layers. There are no neuron activations for the
  //           alien corpus anywhere in the data, so these are a small fixed
  //           network run forward on the real word vector: deterministic per
  //           case, responsive to the text, and not a depiction of the trained
  //           model's own 64x64.
  // ---------------------------------------------------------------
  // Both Day 1 screens are this one screen. Trace a Case runs it forwards a step at
  // a time; Extract Pathways opens on the state Trace a Case ends in — every step
  // already applied, the network lit — and builds from there. Rather than two
  // diagrams that have to be kept identical, it is one, with what differs passed in:
  //   steps    the step row and its buttons
  //   hover    the highlight-a-neuron-and-its-wiring behaviour
  //   title    the right panel's heading
  //   opened   apply all four steps on arrival, with no animation
  function buildNetScreen(opts) {
    const D = simData();
    const items = D.items;
    const VOCAB = Object.keys(D.vocabulary).sort();
    const LABELS = ["Wait", "Approach"];
    // The output column is drawn top-down in this order: Approach above Wait, the
    // same way round as the Prediction Chain's outcome. LABELS stays in target
    // order (0 = Wait) because that is how the data is coded.
    const OUT_ORDER = [1, 0];
    let cases = items.slice();
    let idx = 0;

    // ---- the network ----
    // Fitted, not random, and wired end to end. 30 words -> 10 -> 8 -> 6 -> 2.
    //
    // The first column of the diagram is the 12-unit EMBEDDING, which is what the
    // About panel has always promised: "text to embedding, through two hidden
    // layers, out to a prediction". It replaced a column of one node per word
    // PRESENT in the conversation, which ranged from 5 to 26 and so redrew the
    // picture at a different size for every case. An embedding unit is not a word
    // and has no name, which is why nothing is written beside it.
    //
    // Refitted at these sizes on 2026-09-05 (12/12/8 before that). Target is a blend
    // of the dataset's own model — its probability and its label, 0.85 / 0.15 — over
    // all 800, 6000 epochs of full-batch Adam at lr 0.01. That config over the
    // faster one because it leaves only 4% of embedding activations saturated
    // against 12%, and saturated units are the ones that will animate to the same
    // flat colour as each other. Rounded to 4 decimals it reproduces
    // that model's `pred` on 800 of 800, so this diagram lands where the rest of the
    // sim says it lands, and it disagrees with the human coding on exactly the same
    // 64 conversations. Fitted offline so the picture is identical every time and
    // opening the screen costs nothing.
    const EMB = 10, H1 = 8, H2 = 6;
    const NET = {
      E: [
        [0.7437,-0.1882,0.4657,0.4256,-0.1499,-0.2324,-0.5095,0.1132,-0.1586,-0.545,-0.14,-0.013,-0.2381,-0.1063,0.1848,-0.0921,0.1104,0.0999,0.0713,-0.1025,0.2472,0.0163,-0.533,0.3195,0.1302,-0.3637,-0.135,0.0116,0.3045,0.0692],
        [-0.2238,0.2405,0.9377,0.3112,-0.105,0.6259,0.2639,0.1065,-0.1912,0.3994,0.0371,-0.3646,0.4088,-0.6301,0.715,-0.0815,-0.6215,-0.4569,1.0264,-1.659,0.3869,-0.4633,0.4546,-0.6176,-0.4113,-0.3706,-1.3239,0.6518,-0.0242,0.1328],

        [0.277,0.4525,-0.1238,0.1682,-0.5897,-0.2126,0.0576,-0.3085,-0.1745,-0.315,0.2997,-0.3881,0.3684,0.4803,0.5638,0.2333,0.1602,0.4829,-0.1289,0.2789,-0.5011,-0.0063,-0.0946,-0.2984,0.0757,-0.2142,-0.5644,-0.6013,-0.2074,-0.2174],
        [0.1284,-0.662,-0.3428,0.3755,-0.0984,-0.1182,-0.0093,0.1232,-0.5523,0.6395,-0.7306,-0.1128,-0.1208,0.0099,0.7983,0.069,0.4848,0.5806,-0.3625,-0.1274,0.2213,0.3303,0.0605,-0.1407,-0.275,-0.4452,0.3688,-0.0988,0.3261,-0.581],
        [-0.0974,0.1619,0.392,-0.3591,-0.0919,-0.0469,0.8391,0.4592,-0.3564,0.7673,-0.6154,0.6565,0.1867,-0.1951,-0.5983,1.4068,-0.2122,-0.8414,-0.1919,0.1332,0.2128,0.7881,0.0793,-0.0557,0.2673,-0.9388,-1.0707,0.5474,0.1444,0.5084],
        [-0.0398,0.4934,-0.4177,-0.4864,-0.5761,0.7536,-0.8535,-0.3822,0.5706,-0.7511,-0.3885,-0.6858,-1.0886,-0.2512,0.3672,0.0039,1.0568,-0.3088,0.4109,0.6005,-0.1337,0.0777,0.0098,0.3599,0.0493,0.6629,0.2187,-0.5819,-0.0531,-0.3096],
        [0.1751,-0.5544,-0.0055,-0.0673,-0.3239,0.7523,0.318,-0.2111,0.0365,-0.481,-0.1717,0.0072,0.3021,-0.0636,-0.5199,-0.372,0.4919,0.0087,0.1345,0.8649,-0.4274,0.6199,0.0716,-0.0432,0.0588,-0.647,0.5745,-0.3902,-0.2539,-0.2984],
        [-0.1718,-0.3995,-0.0422,0.5867,0.0196,-0.5997,0.9202,0.7079,-0.211,0.5954,0.4068,0.2325,1.1007,0.495,-0.173,0.2674,-0.2564,0.0639,-0.3925,0.1512,-0.1613,-0.2624,0.1111,-0.4779,-1.0347,-0.6802,-0.4646,0.3303,-0.1822,0.7535],
        [1.4462,-0.54,0.8561,-0.8123,-0.6586,-0.2886,0.6925,0.7347,-0.4799,-1.2393,-0.4276,0.3523,1.3063,-0.9929,1.5338,0.2581,0.3342,-0.6839,0.8857,-0.0114,-0.394,1.6408,-0.065,-1.0013,-0.718,-0.9242,0.0801,-0.0497,0.2104,0.5174]
      ],
      be: [0.0013,0.0349,-0.2524,0.1525,0.7705,1.0681,-0.3202,0.3766,-0.7119,0.9044],
      W1: [
        [-5.2666,3.7516,-0.4326,1.0922,-4.2442,0.5827,-1.2193,-0.6845,-1.8646,1.5635],
        [0.9819,1.3245,0.0508,0.201,-0.6146,1.2178,0.9781,1.0835,0.2083,0.0276],
        [0.2675,0.7135,0.328,0.1408,0.7528,0.2404,0.2464,0.8475,0.3111,-1.5163],
        [-0.981,-0.225,-0.2115,0.6506,-1.3377,-0.7049,1.6312,1.3517,1.4483,-6.0425],
        [0.1994,-2.0046,1.0203,0.4587,-0.817,-0.6347,0.335,-0.4313,1.704,-0.0404],
        [0.6563,-1.4972,-0.3296,3.3848,-0.9284,0.8931,-2.7883,-1.0127,-0.8914,0.1951],
        [0.9192,0.0376,-1.647,-0.3317,-1.5424,0.2455,-1.6788,0.7987,0.1086,-0.1082],
        [0.2375,-1.2829,0.4234,-0.038,0.9525,0.0871,-0.8684,2.0666,1.0873,1.3887]
      ],
      b1: [0.5878,0.4773,0.2835,0.1624,-0.4983,-0.1591,0.1545,-0.3975],
      W2: [
        [0.7955,2.939,2.2596,-0.3705,-0.9166,0.5557,-3.0711,2.3381],
        [-0.6503,-0.2375,-0.1071,0.6854,0.4371,-0.228,1.5082,0.5762],
        [-2.1663,0.3579,1.3204,-0.6956,1.3056,-1.0569,-0.8379,-0.4909],
        [0.5154,-1.1316,-0.0674,0.7914,-1.1952,-1.4111,-5.3107,0.3329],
        [-0.8548,-0.8309,-0.8528,0.0264,-1.1156,-0.0301,0.3863,-0.3387],
        [1.2347,0.7282,1.5021,-0.193,0.7119,-0.5984,1.5406,-0.4366]
      ],
      b2: [0.3244,0.6067,-0.2447,1.0004,0.3072,-1.1915],
      W3: [
        [0.5985,-0.873,1.1306,-0.1031,-1.1465,-0.6822],
        [-0.6815,0.4857,-0.8464,1.6998,0.9387,0.1762]
      ],
      b3: [-0.0645,0.0645]
    };
    function tanh(x) { return Math.tanh ? Math.tanh(x) : (Math.exp(2*x)-1)/(Math.exp(2*x)+1); }

    function forward(it) {
      const words = it.text.split(/\s+/);
      const inp = VOCAB.map(function (w) { return words.indexOf(w) >= 0 ? 1 : 0; });
      const emb = NET.E.map(function (row, j) {
        let s = NET.be[j];
        for (let i = 0; i < inp.length; i++) if (inp[i]) s += row[i];
        return tanh(s);
      });
      const h1 = NET.W1.map(function (row, j) {
        let s = NET.b1[j];
        for (let k = 0; k < emb.length; k++) s += emb[k] * row[k];
        return tanh(s);
      });
      const h2 = NET.W2.map(function (row, k) {
        let s = NET.b2[k];
        for (let j = 0; j < h1.length; j++) s += h1[j] * row[j];
        return tanh(s);
      });
      // Two genuinely independent logits, indexed [Wait, Approach] to match LABELS.
      // Not mirrors: on 451 of 800 they share a sign, so the larger one really is a
      // comparison, which is what argmax over a two-unit softmax head means.
      const out = NET.W3.map(function (row, o) {
        let s = NET.b3[o];
        for (let k = 0; k < h2.length; k++) s += h2[k] * row[k];
        return s;
      });
      return { inp: inp, emb: emb, h1: h1, h2: h2, out: out };
    }

    // What each hidden neuron actually does, over all 800 conversations. Computed
    // once at build: 22 neurons against 800 cases is nothing, and it is the only way
    // the readout can say something true rather than something atmospheric.
    //
    // Two facts per neuron. What drives it hardest — words for Hidden 1, other
    // neurons for Hidden 2 — and how the conversations it fires hardest on split by
    // the human label. That split is the point: neuron 1 runs 91% Approach against a
    // 52% baseline while neurons 5, 11 and 13 sit at chance. A neuron can carry real
    // signal about the answer and still not stand for any one thing, which is the
    // reason Day 2 goes looking for pathways instead.
    // The hidden layers are tanh, so they arrive on the ramp already: |v| <= 1. The
    // logits do not — they run past 3 — so they are divided by the largest |logit|
    // anywhere in the 800 before being coloured. One scale for the whole dataset,
    // not per conversation, or the same number would be a different colour case to
    // case and the column could not be compared with itself.
    const LOGIT_SCALE = (function () {
      let m = 0;
      items.forEach(function (it) {
        forward(it).out.forEach(function (z) { m = Math.max(m, Math.abs(z)); });
      });
      return m || 1;
    })();
    // What a connector's THICKNESS means, now that it varies along the line. The
    // near half is the activation leaving the source; the far half is that
    // activation times the weight. So both halves are magnitudes of a signal, and
    // they have to be banded on ONE scale or "thinner after the multiplier" is not
    // a comparison a reader can make. Pooled per drawn layer, over both halves of
    // every edge in all 800 conversations, so a width means the same thing from
    // case to case and the bands are a property of the model rather than of
    // whichever conversation happens to be open.
    const MAG_T = (function () {
      const Ws = [NET.W1, NET.W2, NET.W3];
      const pools = [[], [], []];
      items.forEach(function (it) {
        const f = forward(it);
        const src = [f.emb, f.h1, f.h2];
        for (let li = 0; li < 3; li++) {
          const a = src[li], m = Ws[li];
          for (let i = 0; i < a.length; i++) {
            pools[li].push(Math.abs(a[i]));
            for (let b = 0; b < m.length; b++) pools[li].push(Math.abs(a[i] * m[b][i]));
          }
        }
      });
      return pools.map(function (f) {
        f.sort(function (x, y) { return x - y; });
        return [f[Math.floor(f.length / 3)], f[Math.floor(2 * f.length / 3)]];
      });
    })();

    // Three widths, not a continuous scale — the reasoning is at bandOf below, and
    // it applies just as much to a signal magnitude as it did to a weight. Declared
    // out here because both drawNet and paintSignal band against them.
    const W_THIN = 1, W_MID = 2, W_THICK = 3;
    function bandOfMag(v, t) {
      const a = Math.abs(v);
      return a < t[0] ? W_THIN : a < t[1] ? W_MID : W_THICK;
    }

    const LEAN_N = 80;                 // how many of the 800 count as "fires hardest"
    const NEURON_FACTS = (function () {
      const acts = items.map(forward);
      const base = items.filter(function (it) { return it.target === 1; }).length / items.length;
      function split(get) {
        const idx = items.map(function (_, i) { return i; });
        idx.sort(function (a, b) { return get(acts[b]) - get(acts[a]); });
        const top = idx.slice(0, LEAN_N);
        const app = top.filter(function (i) { return items[i].target === 1; }).length;
        return app;
      }
      function topBy(weights, name) {
        return weights.map(function (v, i) { return { i: i, v: v }; })
          .sort(function (a, b) { return b.v - a.v; })
          .slice(0, 3).map(name);
      }
      return {
        base: Math.round(100 * base),
        // No drivers for the embedding: what drives one is words, and words are
        // exactly what this column is not allowed to name. The split still says
        // something true about the unit without naming anything.
        emb: NET.E.map(function (row, j) {
          return { app: split(function (h) { return h.emb[j]; }) };
        }),
        h1: NET.W1.map(function (row, n) {
          return { drivers: topBy(row, function (x) { return "Input neuron " + (x.i + 1); }),
                   app: split(function (h) { return h.h1[n]; }) };
        }),
        h2: NET.W2.map(function (row, k) {
          return { drivers: topBy(row, function (x) { return "Hidden 1 neuron " + (x.i + 1); }),
                   app: split(function (h) { return h.h2[k]; }) };
        })
      };
    })();

    const wrap = document.createElement("div");
    wrap.className = "sim-content";

    const stack = document.createElement("div");
    stack.className = "nnm-stack";
    wrap.appendChild(stack);

    const toolbar = document.createElement("div");
    toolbar.className = "d3-toolbar d1a-toolbar";
    stack.appendChild(toolbar);
    const filter = NNM_FILTER.buildBar(function (its) { cases = its; idx = 0; render(); });
    filter.el.classList.add("d3-filter");
    // Built either way — it is what seeds `cases`, and it carries the About button —

    if (opts.filter !== false) toolbar.appendChild(filter.el);

    cBody.appendChild(notesHead);

    notesEl.className = "d3b-notes d1a-notes";
    cBody.appendChild(notesEl);
    // What the notes recorded, as marks, in the order the notes raise them. Under

    //
    // Trace a Case only. Extract Pathways shares this builder but is being

    // Inside the notes box, under the prose — the marks are a reading OF the note,

    if (opts.marks) {

    // ---- right: the network ----
    const netCol = document.createElement("div");
    netCol.className = "d3b-col";
    root.appendChild(netCol);
    const netPanel = document.createElement("div");
    netPanel.className = "nnm-panel d1a-panel";
    netCol.appendChild(netPanel);
    const nHead = document.createElement("div");
    nHead.className = "nnm-panel-head";
    const nTitle = document.createElement("span");
    nTitle.textContent = opts.title;
    nHead.appendChild(nTitle);
    const scaleEl = document.createElement("div");
    scaleEl.className = "d1a-scale";
    // Sign only. A width key was tried here and taken out again: the three widths
    // are terciles computed per LAYER, so no single key can carry numbers — the cut
    // points differ across the three gaps — and without numbers all it could say was
    // that thicker means more, which nobody needed telling. Colour is the opposite
    // case: nothing about orange against blue announces positive against negative,
    // so that has to be said. The one non-obvious thing about the widths — that they
    // CHANGE partway along a line, and why — is labelled on the diagram itself,
    // over the gap where it happens.
    scaleEl.innerHTML =
      '<span class="sw neg"></span><span class="lo">\u2212</span>'
      + '<span class="sw pos"></span><span class="hi">+</span>';
