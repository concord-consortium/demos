      // Measured, not fixed. A hard 560 x 430 viewBox was 74px taller than the
      // host, so the bottom of the Hidden 1 column ran 25px past the caption, and
      // scaling 560 down to the host's width letterboxed 9px off the top and
      // bottom. One unit = one pixel here, so nothing is scaled or clipped.
      const W = drawnW = Math.max(380, Math.round(svgHost.clientWidth || 520));
      const H = drawnH = Math.max(300, Math.round(svgHost.clientHeight || 400));
      const svg = el("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H,
                              class: "d1a-net" });
      const scene = el("g", { class: "d1a-scene" });
      svg.appendChild(scene);
      // Every column is a fixed size, the same in all 800 conversations. The input
      // column used to be one node per word PRESENT, which ran from 5 to 26 and
      // redrew the whole picture at a different size case to case; it is the
      // 12-unit embedding now, so the diagram is one diagram.
      // 44 clears the captions at y 17; 14 keeps the last circle off the bottom.
      const top = 44, bot = H - 14;
      // One radius for every neuron: nothing in the model grows left to right, so
      // size spent on a gradient would only invite being read as importance.
      //
      // DERIVED, not fixed. The columns are 10 / 8 / 6 now, and the tallest of them
      // sets how much room a node can have; a hard radius would overlap as soon as
      // the panel got short, which it does on the iPad layouts. STEP_MAX caps how
      // far apart they spread when there IS room, and the radius is whatever fits
      // that step with a 6px gap left over.
      const STEP_MAX = 30;
      const tightest = Math.min(STEP_MAX, (bot - top) / (EMB - 1));
      const R = Math.max(5, Math.min(12, Math.floor(tightest / 2) - 3));
      // `label` is the caption over the column; `short` is what a neuron in it is
      // called in the readout. They came apart when the captions gained "Layer":
      // "Hidden Layer 1 neuron 3" is not what anything should be called.
      const cols = [
        { n: EMB, x: 0, r: R, label: "Input Layer", short: "Input" },
        { n: H1, x: 0, r: R, label: "Hidden Layer 1", short: "Hidden 1" },
        { n: H2, x: 0, r: R, label: "Hidden Layer 2", short: "Hidden 2" },
        // The two outcomes are one choice, not two separate readings, so they read
        // better as a close pair than as another evenly spaced column. The step is
        // the pill's own height plus 10, so that 10px gap survives any radius.
        { n: 2,  x: 0, r: R, label: "Output Layer", short: "Output", step: R * 2 + 8 + 10 }
      ];
      // Equal margins by construction, and identical from case to case: both label
      // gutters are reserved at their maximum, then the four columns spread evenly
      // across whatever is left.
      const PAD = 4;
      // Was the widest word plus a 6px gap. Nothing is written beside an embedding
      // unit any more, but the gutter cannot go to zero: the column CAPTION is
      // centred on the column, so "Input" over a node 11px from the edge hung 3.9px
      // off the left of the viewBox and lost its I. What has to be reserved now is
      // half the caption, less the node's own radius. Measured, not assumed — the
      // caption is Barlow Condensed and its width is not something to guess at.
      const inGut = Math.max(0, widest(measCap, [cols[0].label]) / 2 - cols[0].r);
      // The outcome is a pill around the node AND its word, so the gutter has to
      // hold the whole thing: the node's other half, the gap, the word, and the
      // pill's own padding.
      const PILL_PADL = 4, PILL_GAP = 7, PILL_PADR = 13;
      // Measured from the node's CENTRE outwards, because xLast already subtracts
      // the node's radius and PAD. Including either of them here counted them twice
      // and left 18px of air to the right of the widest pill against 4 on the left.
      const outGut = PILL_GAP + widest(measOut, LABELS) + PILL_PADR;
      const xFirst = PAD + inGut + cols[0].r;
      const xLast = Math.max(xFirst + 60, W - PAD - outGut - cols[3].r);
      cols.forEach(function (c, i) {
        c.x = xFirst + (xLast - xFirst) * i / (cols.length - 1);
      });
      // The Input column alone sits 10px right of where the even spread puts it.
      // With the word labels gone its only left-hand neighbour is the panel edge,
      // and flush against it the column read as clipped rather than as the start of
      // something. The other three keep their spacing.
      cols[0].x += 10;
      function ys(n, maxStep) {
        if (n === 1) return [(top + bot) / 2];
        const step = Math.min(maxStep || STEP_MAX, (bot - top) / (n - 1));
        const mid = (top + bot) / 2, span = step * (n - 1);
        const out = [];
        for (let i = 0; i < n; i++) out.push(mid - span / 2 + i * step);
        return out;
      }
      const pos = cols.map(function (c) { return ys(c.n, c.step); });
      const vals = [
        f.emb, f.h1, f.h2, OUT_ORDER.map(function (o) { return f.out[o]; })
      ];

      // Three widths, not a continuous scale. The weights are steeply skewed —
      // nine edges in ten sit under half the layer's maximum — so 0.4 + 1.6*|w|
      // pushed almost everything into the bottom of a 0.4..2.0 range and two edges
      // an octave apart in weight came out half a pixel apart on screen.
      // Thresholds are the terciles of |w| WITHIN each drawn layer, so every layer
      // shows all three widths whatever its own spread, and they are computed from
      // the weights rather than hard-coded — a refit re-derives them.
      const W_THIN = 1, W_MID = 2, W_THICK = 3;
      function terciles(m) {
        const f = [];
        m.forEach(function (r) { r.forEach(function (v) { f.push(Math.abs(v)); }); });
        f.sort(function (x, y) { return x - y; });
        return [f[Math.floor(f.length / 3)], f[Math.floor(2 * f.length / 3)]];
      }
      function bandOf(w, t) {
        const a = Math.abs(w);
        return a < t[0] ? W_THIN : a < t[1] ? W_MID : W_THICK;
      }
      // Highlighting scales the width instead of flooring it. A floor of 1.4 made a
      // lit thin edge exactly as wide as a lit middle one, collapsing two of the
      // three bands at the very moment they are being looked at.
      const LIT_MUL = 1.5;

      // Edges first, so every neuron sits on top of its own wiring.
      // Under the edges. An opaque pill drawn with the nodes covered the last
      // stretch of every incoming line, so the wiring looked like it stopped at the
      // pill's outline rather than arriving at the neuron.
      const pillG = el("g", { class: "d1a-pills" });
      scene.appendChild(pillG);
      const edgeG = el("g", { class: "d1a-edges" });
      scene.appendChild(edgeG);
      const edges = [];
      function link(li, a, b, width) {
        const line = el("line", {
          x1: cols[li].x + cols[li].r, y1: pos[li][a],
          x2: cols[li+1].x - cols[li+1].r, y2: pos[li+1][b],
          class: "d1a-edge"
        });
        // The resting width is one of three bands. Kept on the element so the
        // highlight can raise it and put it back without recomputing.
        line.__w = width;
        line.style.strokeWidth = width.toFixed(2);
        // Its own length, from the coordinates rather than getTotalLength(): the svg
        // is still detached at this point, and for a straight line the arithmetic is
        // exact anyway. Dashed out to its full length, so it starts undrawn and a
        // step can grow it by pulling the offset to zero.
        const len = Math.hypot(
          (cols[li+1].x - cols[li+1].r) - (cols[li].x + cols[li].r),
          pos[li+1][b] - pos[li][a]);
        line.__len = len;
        line.style.strokeDasharray = len;
        line.style.strokeDashoffset = len;
        edgeG.appendChild(line);
        edges.push({ el: line, from: [li, a], to: [li+1, b] });
        return line;
      }
      // Connections are off for now (2026-09-05) while the animation is designed.
      // Everything that draws and lights them is left exactly as it was — the three
      // width bands, the `near` class, the dim-the-rest hover, the widen-on-select —
      // so switching this back to true restores the behaviour rather than rebuilding
      // it. `edges` stays an empty array, which the hover code already handles.
      // One switch per drawn layer. Input -> Hidden 1 is back, because Step 2 grows
      // it; the other two stay parked until their own steps exist. Everything that
      // draws and lights them is untouched — the three width bands, the `near`
      // class, the dim-the-rest hover, the widen-on-select.
      const SHOW_EDGES = [true, true, true];
      // Each drawn layer is banded against its OWN terciles: the trained layers do
      // not share a scale, so one set of thresholds would have flattened a whole
      // layer into a single width.
      const T1 = terciles(NET.W1), T2 = terciles(NET.W2), T3 = terciles(NET.W3);
      // Grouped by the unit they LEAVE, because that is how Step 2 grows them: all
      // of one input unit's connections at once, then the next unit's.
      fanOut.length = 0; fanOut2.length = 0; fanOut3.length = 0;
      if (SHOW_EDGES[0]) for (let a = 0; a < EMB; a++) {
        const group = [];
        for (let b = 0; b < H1; b++) group.push(link(0, a, b, bandOf(NET.W1[b][a], T1)));
        fanOut.push(group);
      }
      if (SHOW_EDGES[1]) for (let a = 0; a < H1; a++) {
        const group = [];
        for (let b = 0; b < H2; b++) group.push(link(1, a, b, bandOf(NET.W2[b][a], T2)));
        fanOut2.push(group);
      }
      // These carried a hard-coded 0.5 while the output was computed elsewhere. They
      // are real weights now, read through OUT_ORDER because the output column is
      // drawn Approach-above-Wait while the logits stay in target order.
      if (SHOW_EDGES[2]) for (let a = 0; a < H2; a++) {
        const group = [];
        for (let b = 0; b < 2; b++) {
          group.push(link(2, a, b, bandOf(NET.W3[OUT_ORDER[b]][a], T3)));
        }
        fanOut3.push(group);
      }

      // Selected neurons are moved in here. Nodes live in one group per column and
      // the groups paint in column order, so a node in Input can never rise above
      // Hidden 2 by re-ordering within its own group — it needs a group of its own,
      // appended last. Same reason the lit edges are re-appended: SVG has no
      // z-index, paint order is DOM order.
      // Declared here so bringToFront can close over it, but APPENDED after the node
      // groups below — appended here it would sit behind every one of them.
      const frontG = el("g", { class: "d1a-front" });
      let fronted = null;

      // A ring is lit when its node is SELECTED or focused — derived every time,
      // never toggled incrementally. It was toggled on focus and untoggled on blur,
      // which left it lit after tabbing away and depended on which event landed
      // first; and it was the only indicator of selection, driven by focus, so it
      // showed inconsistently across browsers (a click focuses an SVG element in
      // Chrome but not reliably in Safari or Firefox).
      let hoverEl = null;
      function syncRings() {
        svg.querySelectorAll(".d1a-node").forEach(function (n) {
          if (!n.__ring) return;
          const sel = n.classList.contains("pinned");
          // :focus-visible, not activeElement. A click leaves focus on the node, so
          // matching on focus alone meant clicking a selected node to DEselect it
          // swapped the dark ring for a blue one instead of clearing it — the node
          // looked marked when nothing was chosen. :focus-visible is false after a
          // click and true after Tab, which is exactly the distinction wanted: no
          // ring on deselect, and keyboard focus still shows where it is.
          let foc = false;
          try { foc = n.matches(":focus-visible"); }
          catch (e) { foc = n === document.activeElement; }
          const hov = n === hoverEl;
          n.__ring.classList.toggle("on", sel || foc);
          n.__ring.classList.toggle("hover", !sel && !foc && hov);
          // Selection wins where a node is both: it is the stronger state and the
          // one that persists.
          n.__ring.classList.toggle("focus", foc && !sel);
        });
      }
      // Only the RING moves. Moving the node itself put it last in the tab order —
      // selecting the third Input neuron sent it from position 3 of 33 to 33 —
      // because tab order is DOM order for anything focusable. And the node never
      // needed raising: circles are 16px across at 18.6px apart, so no two ever
      // overlap. A ring is 23px across, so a neighbour's circle DOES cover it, and
      // a ring is not focusable, so moving it costs nothing.
      function bringToFront(node) {
        if (fronted === node) return;
        if (fronted && fronted.__home && fronted.__ring) {
          fronted.__home.appendChild(fronted.__ring);
        }
        fronted = null;
        if (node && node.__ring) {
          frontG.appendChild(node.__ring);
          fronted = node;
        }
      }

      // A click pins the highlight, so the wiring can be read without holding the
      // mouse still — and so the readout below has somewhere to point.
      // No activation is quoted here, on any layer, at the content designer's
      // request (2026-09-04). The number is still on the node — its colour, its
      // tooltip, its screen-reader label — it is just not what the readout is for.
      // What the readout says instead is what the unit is WIRED to and how it leans,
      // which is the thing a student cannot get by looking.
      function pinText(li, i) {
        if (li === 0) {
          // The input row carries no word: an embedding unit is not a word, and
          // naming one would invite a student to read it as one. It IS a neuron
          // though, and is called one (2026-09-04): this column is a trained tanh
          // layer, not raw features sitting there, so it is a neuron in exactly the
          // sense Hidden 1 is, and the hint promises "click any neuron". The two
          // OUTPUT circles keep their outcome names — to a student they are the
          // answer, not machinery.
          const ef = NEURON_FACTS.emb[i];
          return "<b>Input neuron " + (i + 1) + "</b> \u2014 one of the " + EMB + " numbers the "
            + "network turns this conversation into before it starts reasoning about it. "
            + "It feeds all " + H1 + " Hidden 1 neurons. Of the " + LEAN_N
            + " conversations it responds to most strongly, " + ef.app
            + " are <b>Approach</b> and " + (LEAN_N - ef.app) + " are <b>Wait</b>.";
        }
        if (li === 3) {
          // Before Step 4 the two numbers are not both in yet, so there is nothing to
          // compare and the answer is not the readout's to give: it said "the larger
          // one is the answer: here, Wait" while both pills were still blank.
          if (stepDone < 4) {
            return "<b>" + LABELS[OUT_ORDER[i]] + "</b> \u2014 one of the two numbers "
              + "the network ends on. The larger one is the answer.";
          }
          const chose = f.out[1] > f.out[0] ? 1 : 0;
          // The model and the human agree on 736 of the 800. A standing instruction
          // to "compare these" would therefore ask a student to compare two
          // identical words nine times out of ten. So the sentence stays flat when
          // they match and says so plainly when they do not — the 8% is where the
          // comparison is worth making, and Day 3 is built on those conversations.
          const agreed = chose === it.target;
          return "<b>" + LABELS[OUT_ORDER[i]] + "</b> \u2014 one of the two numbers the network "
            + "ends on. The larger one is the answer: here, <b>"
            + LABELS[chose] + "</b>. " + (agreed
               ? "The human who coded this conversation said <b>" + LABELS[it.target]
                 + "</b>, too."
               : "The human who coded this conversation said <b>" + LABELS[it.target]
                 + "</b> — the network and the human disagree here.");
        }
        const fanIn = li === 1 ? EMB : H1;
        const fanOut = li === 1 ? H2 : 2;
        const nf = (li === 1 ? NEURON_FACTS.h1 : NEURON_FACTS.h2)[i];
        const drivers = nf.drivers.slice(0, 2).join(", ") + " and " + nf.drivers[2];
        // Counts, not a percentage, and no sentence telling anyone what to make of
        // them. Some neurons come out 73/7 and some 41/39, and noticing that is the
        // work — saying "it carries something; it is not about anything you could
        // name" did it for them, before they had looked at a second neuron.
        return "<b>" + cols[li].short + " neuron " + (i + 1) + "</b> \u2014 "
          + fanIn + " connections in, " + fanOut + " out. Its strongest inputs are "
          + drivers + ". Of the " + LEAN_N + " conversations it fires hardest on, "
          + nf.app + " are <b>Approach</b> and " + (LEAN_N - nf.app) + " are <b>Wait</b>.";
      }
      function sizeReadout() {
        if (!pinEl.isConnected) return;
        measureEl.style.width = pinEl.getBoundingClientRect().width + "px";
        let tallest = 0;
        cols.forEach(function (c, li) {
          for (let i = 0; i < c.n; i++) {
            measureEl.innerHTML = "<span>" + pinText(li, i) + "</span>"
              + '<button class="d1a-pinclear" type="button">&times;</button>';
            tallest = Math.max(tallest, measureEl.getBoundingClientRect().height);
          }
        });
        // Both idle strings, since which one shows depends on how far the steps
        // have got and the box is a fixed height for all of them.
        ["Run Step 1 to send the conversation into the network.",
         "Click any neuron the signal has reached to see what it does."].forEach(function (h) {
          measureEl.innerHTML = "<span>" + h + "</span>";
          tallest = Math.max(tallest, measureEl.getBoundingClientRect().height);
        });
        measureEl.innerHTML = "";
        if (tallest > 0) pinEl.style.height = Math.ceil(tallest) + "px";
      }

      // Parked so the step machinery, which lives outside drawNet, can ask for a
      // repaint when a step completes and the readout's wording changes.
      svgHost.__paintPin = function () { paintPin(); };
      function paintPin() {
        Array.prototype.forEach.call(svg.querySelectorAll(".d1a-node"), function (n) {
          n.classList.remove("pinned");
          n.setAttribute("aria-pressed", "false");
        });
        if (!pinIdx) {
          syncRings();
          pinEl.className = "d1a-pin idle";
          pinEl.innerHTML = "<span>" + (stepDone > 0
            ? "Click any neuron the signal has reached to see what it does."
            : "Run Step 1 to send the conversation into the network.") + "</span>";
          return;
        }
        pinEl.className = "d1a-pin";
        const sel = svg.querySelector('.d1a-node[data-layer="' + pinIdx[0]
          + '"][data-i="' + pinIdx[1] + '"]');
        if (sel) {
          sel.classList.add("pinned");
          sel.setAttribute("aria-pressed", "true");
        }
        syncRings();
        pinEl.innerHTML = "<span>" + pinText(pinIdx[0], pinIdx[1]) + "</span>"
          + '<button class="d1a-pinclear" type="button" aria-label="Clear">&times;</button>';
        pinEl.querySelector(".d1a-pinclear").addEventListener("click", function () {
          pinIdx = null; applyHover(-1, -1); paintPin();
        });
      }

      // Neurons.
      cols.forEach(function (c, li) {
        const g = el("g", {});
        scene.appendChild(g);
        const cap = el("text", { x: c.x, y: 20, class: "d1a-collabel" });
        cap.setAttribute("text-anchor", "middle");
        cap.textContent = c.label;
        scene.appendChild(cap);
        for (let i = 0; i < c.n; i++) {
          const v = vals[li][i];
          const node = el("circle", { cx: c.x, cy: pos[li][i], r: c.r, class: "d1a-node" });
          // Everywhere but the output, a node's fill is its activation on the signed
          // ramp: orange positive, blue negative. The two output units are exact
          // mirrors — one is always +x and the other always −x — which rules out
          // both of the obvious fills. On the ramp they would read as one darkest
          // orange and one darkest blue in all 800 conversations, identical every
          // time: a tautology dressed as a measurement. Coloured by outcome instead
          // (orange Approach, blue Wait) they contradict the ramp on the number
          // printed beside them — Approach at −0.99 came out orange one row below a
          // hidden neuron at −0.96 in blue, and because of the mirroring exactly one
          // output node broke the rule in every conversation. So the output nodes sit
          // off the scale altogether, in a neutral grey that is neither ramp colour
          // and is too dark to be misread as a near-zero activation. The pill carries
          // which answer it is; the number carries how strong.
          // Everything starts white. The colour each node will end on is parked on
          // the element so the animation can pick it up without recomputing, and so
          // nothing here has to know how that animation will run.
          //
          // The output pair is on the ramp now, like every other column. It was held
          // off it while the two logits were exact mirrors, when depth would have
          // been one darkest orange and one darkest blue in all 800 conversations —
          // a tautology. The refitted network emits independent logits that share a
          // sign on 451 of 800, so the colour finally carries something: two oranges
          // of different depth, and the deeper one is the answer.
          const ramp = li === 3 ? v / LOGIT_SCALE : v;
          node.__v = ramp;   // the steps walk the ramp toward this as input arrives
          node.__act = actColour(ramp);
          node.style.fill = "#FFFFFF";
          node.dataset.layer = li; node.dataset.i = i;
          node.setAttribute("tabindex", "0");
          node.setAttribute("role", "button");
          const name = li === 0 ? "Input neuron " + (i + 1)
            : li === 3 ? LABELS[OUT_ORDER[i]] : c.short + " neuron " + (i + 1);
          // The value lives on the node — tooltip and screen-reader label alike —
          // but only once the step that computes this layer has run. Before that the
          // number does not exist yet as far as the screen is concerned, and on the
          // output row it IS the answer: the two logits were readable on hover while
          // both pills were still unrevealed. syncNodeInfo fills them in as each step
          // completes.
          node.__name = name;
          node.__val = v;
          node.__title = el("title", {});
          node.appendChild(node.__title);
          node.setAttribute("aria-pressed", "false");
          // A neuron the signal has not reached yet answers nothing: its readout
          // would name its connections and its strongest inputs, which is exactly
          // what Steps 2 and 3 exist to draw. Keyed to the STEP, not to whether the
          // circle looks coloured — a unit sitting near zero renders white after a
          // full run, and 28% of conversations end with at least one of those.
          function live() { return !node.classList.contains("off"); }
          function on() { if (!live()) return; setHoverNode(node); setHover(li, i); }
          function off() { setHoverNode(null); setHover(-1, -1); }
          function toggle(ev) {
            if (ev) ev.stopPropagation();
            if (!live()) return;
            if (pinIdx && pinIdx[0] === li && pinIdx[1] === i) { pinIdx = null; applyHover(-1, -1); }
            else { pinIdx = [li, i]; applyHover(li, i); }
            paintPin();
          }
          node.addEventListener("mouseenter", on);
          node.addEventListener("mouseleave", off);
          node.addEventListener("focus", on);
          node.addEventListener("blur", off);
          node.addEventListener("click", toggle);
          node.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(null); }
          });
          g.appendChild(node);
          const ring = el("circle", { cx: c.x, cy: pos[li][i], r: c.r + 3.5, class: "d1a-ring" });
          g.appendChild(ring);
          node.__home = g;
          node.__ring = ring;
          // Ring on for focus too, so tabbing shows where you are. Both handlers just
          // ask syncRings to recompute — bookkeeping on each event separately meant
          // the order of focus and blur decided the outcome.
          node.addEventListener("focus", syncRings);
          node.addEventListener("blur", syncRings);
          if (li === 3) {
            // The larger of the two output values is the answer. It gets a filled
            // pill, the way the human's label is a filled chip on the left; the
            // other gets the same pill as an outline. Same shape for both, so the
            // difference is the fill and nothing else.
            const chose = f.out[1] > f.out[0] ? 1 : 0;
            // The answer is not revealed yet (2026-09-05) — both outcomes render in
            // the same resting state, the way every node now starts white, so the
            // picture gives nothing away before the animation runs. Which one won is
            // parked on the element, like a node's __act, so the reveal is a class
            // change and not a rebuild.
            const REVEAL_ANSWER = false;
            const actuallyWon = OUT_ORDER[i] === chose;
            const won = REVEAL_ANSWER && actuallyWon;
            const app = OUT_ORDER[i] === 1;
            const word = LABELS[OUT_ORDER[i]];
            const tw = widest(measOut, [word]);
            const ph = c.r * 2 + 8;
            // Drawn BEFORE the node, so the incoming edges still run to the circle
            // rather than stopping at the pill.
            const pill = el("rect", {
              x: c.x - c.r - PILL_PADL, y: pos[li][i] - ph / 2,
              width: PILL_PADL + c.r * 2 + PILL_GAP + tw + PILL_PADR,
              height: ph, rx: ph / 2,
              class: "d1a-outpill " + (won ? "won" : "lost") + (app ? " app" : " wait")
            });
            // The pill is what you are looking at, so it is what you click — 96px
            // wide against the node's 20. The node stays the focusable control, so
            // the tab order does not gain a second stop for the same thing.
            pill.addEventListener("click", toggle);
            pill.addEventListener("mouseenter", on);
            pill.addEventListener("mouseleave", off);
            pill.__won = actuallyWon;
            pillG.appendChild(pill);
            const lbl = el("text", { x: c.x + c.r + PILL_GAP, y: pos[li][i] + 4,
              class: "d1a-outlabel " + (app ? "app" : "wait") });
            lbl.textContent = word;
            scene.appendChild(lbl);
          }
        }
      });

      scene.appendChild(frontG);

      // Slide 9's "hover any neuron to see the incoming and outgoing connected
      // neurons": everything unrelated steps back rather than the related edges
      // being brightened, so the answer is what is LEFT rather than what is added.
      // The ring follows the pointer whatever else is going on — including while
      // something is selected, where applyHover bails out so the selected node keeps
      // its lit edges.
      function setHoverNode(n) { hoverEl = n; syncRings(); }
      function setHover(li, i) { if (pinIdx) return; applyHover(li, i); }
      function applyHover(li, i) {
        const on = li >= 0;
        svg.classList.toggle("hovering", on);
        // A line is lit in the colour of the unit it LEAVES — the same rule the step
        // animations use, where a fan grows in its source unit's colour. So the
        // OUTGOING lines from a hovered neuron are all one colour (they all leave
        // it), while the INCOMING ones arrive in as many colours as there are units
        // feeding it. Painting them all with the hovered unit's colour, as this did,
        // said the signal on those lines was its own when it belongs to ten
        // different neurons on the left.
        //
        // Read live rather than from __act: part way through a step a unit is only
        // part-coloured, and a line should agree with the circle it comes out of.
        // White means the unit is at about zero, and a white line is no line at all,
        // so those fall back to the stylesheet's near-black.
        const fillOf = {};
        if (on) {
          svg.querySelectorAll(".d1a-node").forEach(function (n) {
            fillOf[n.dataset.layer + ":" + n.dataset.i] = getComputedStyle(n).fill;
          });
        }
        const lit = [];
        edges.forEach(function (e) {
          const touched = on && ((e.from[0] === li && e.from[1] === i)
                              || (e.to[0] === li && e.to[1] === i));
          e.el.classList.toggle("near", !!touched);
          if (touched) {
            const f = fillOf[e.from[0] + ":" + e.from[1]];
            if (f && f !== "rgb(255, 255, 255)") e.el.style.setProperty("--lit", f);
            else e.el.style.removeProperty("--lit");
            lit.push(e.el);
          } else {
            e.el.style.removeProperty("--lit");
          }
        });
        // Bring the lit ones to the front. SVG has no z-index — paint order is DOM
        // order — so a pale edge that happened to be created later was drawing over
        // the dark ones, and a highlighted line came out broken into segments that
        // read as it tapering. Re-appending moves them to the end of the edge group,
        // which still sits under every node.
        // A lit edge is near-black, but a 0.47px stroke paints only about a third of
        // a pixel — measured at 1.73:1, indistinguishable from the dimmed lines it is
        // supposed to stand out from. So the highlight thickens as well as darkens,
        // and only while lit: the resting hairball keeps its lightness.
        edges.forEach(function (e) {
          const w = e.el.classList.contains("near") ? e.el.__w * LIT_MUL : e.el.__w;
          e.el.style.strokeWidth = w.toFixed(2);
        });
        lit.forEach(function (el) { edgeG.appendChild(el); });
        bringToFront(on
          ? svg.querySelector('.d1a-node[data-layer="' + li + '"][data-i="' + i + '"]')
          : null);
      }

      // Clicking the empty space around the network lets the pin go.
      svg.addEventListener("click", function () {
        if (pinIdx) { pinIdx = null; applyHover(-1, -1); paintPin(); }
      });
      // Reserve the height of the tallest message this conversation can produce, so
      // the box is the same size whether or not one is showing. Measured rather than
      // assumed: the tallest message is 52px wide-open and 107px at AP 2-Column, and
      // which node is longest depends on the words this conversation contains.
      sizeReadout();

      // Restore what was pinned before this redraw — the ring AND the lit edges,
      // which come from applyHover rather than from paintPin.
      if (pinIdx) applyHover(pinIdx[0], pinIdx[1]);
      paintPin();

      svgHost.appendChild(svg);
    }

    function render() {
      const empty = cases.length === 0;
      root.style.display = empty ? "none" : "";
      if (empty) return;
      if (idx >= cases.length) idx = cases.length - 1;
      if (pinnedFor !== idx) { pinIdx = null; pinnedFor = idx; }
      const it = cases[idx];
      const f = forward(it);

      countEl.textContent = (idx + 1) + " / " + cases.length;
      setAriaDisabled(prevBtn, idx === 0);
      setAriaDisabled(nextBtn, idx === cases.length - 1);

      // One span per word, so Step 1 can aim a flight at where each word actually
      // sits. No colouring on them: on Day 1 there is nothing that could honestly
      // tint one.
      textEl.innerHTML = "";
      it.text.split(/\s+/).forEach(function (w, k) {
        if (k) textEl.appendChild(document.createTextNode(" "));
        const sp = document.createElement("span");
        sp.className = "d1a-word";
        sp.textContent = w;
        textEl.appendChild(sp);
      });
      labelRow.innerHTML = "";
      const cap = document.createElement("span");
      cap.className = "d1a-labelcap";
      cap.textContent = "A human labelled this";
      const chip = document.createElement("span");
      chip.className = "d1a-label " + (it.target === 1 ? "app" : "wait");
      chip.textContent = LABELS[it.target];
      labelRow.appendChild(cap); labelRow.appendChild(chip);
      notesEl.textContent = it.obs || "(no notes for this conversation)";

      drawNet(f, it);
      // A redraw builds new white nodes and new lines, so anything still running is
      // pointed at elements that no longer exist.
      if (typeof clearSteps === "function") clearSteps();
    }

    // ---- Step 1: the words fly into the Input Layer ----
    // One word at a time, and every word to every unit: 10 units x the conversation
    // is 120 separate flights. That repetition IS what fully connected means, so it
    // is shown rather than summarised — but it only works if it accelerates. The
    // first few are slow enough to follow one word across; by the twentieth the gap
    // has collapsed to a floor and the rest reads as a stream feeding the column.
    // A unit's colour is built by the words, not switched on at the end: each word
    // that lands moves it one step further along the signed ramp, from white toward
    // its true activation. The step is actColour(v * fraction-landed), so the path
    // runs through the ramp's own levels and arrives exactly on the value rather
    // than on a colour blended toward it.
    let stepRun = 0;                       // bumped to abandon a run in progress
    let flyLayer = null;
    // A fly-over is one unit's pass: the whole conversation crossing to that unit,
    // word by word. WITHIN a pass every word takes the same time — the pass has one
    // speed, so what you are watching is a steady delivery rather than a curve. It
    // is BETWEEN passes that things accelerate: the first is slow enough to follow a
    // single word across, and by the last the eye only needs the rhythm.
    // Every word of a pass leaves at the same instant, but they arrive ONE AT A
    // TIME, and the unit takes another step along its ramp as each one lands.
    //
    // What sets a word's speed is how far it has to go. Arrivals are spaced evenly
    // through the pass in order of distance — the nearest word lands first — so a
    // near word has both a short trip and an early arrival and ambles across, while
    // a far word has to cover three times the distance in only twice the time and
    // visibly rushes. Straight lines at constant speed: any easing would vary a
    // word's speed as it travels, and the comparison between words is the point.
    const DUR_FIRST = 1400, DUR_DECAY = 0.70, DUR_MIN = 170; // the pass, end to end
    // How far into the pass the FIRST word lands. Higher means the arrivals are
    // squeezed into a shorter window at the end, so more words are in the air
    // together and the near ones dawdle harder to get there. 0.7 keeps them
    // arriving one at a time while overlapping for most of the flight.
    const ARRIVE_FIRST = 0.7;
    // The last stretch of a flight, where the word stops being a word and becomes
    // part of the unit: it fades out and collapses into the node's centre. Kept to
    // the tail so the crossing itself is still full-size and unscaled.
    const FADE_AT = 0.86, END_SCALE = 0.12;
    // The two halves of the S. Vertical starts gently and is largely spent by the
    // middle of the flight; horizontal barely moves at first and finishes at the
    // end. Together the word drops, curves, and enters the unit from the side.
    // Both still start slow, so the opening flight is followable.
    const EASE_Y = "cubic-bezier(.45,.05,.3,1)";
    const EASE_X = "cubic-bezier(.7,0,.75,.75)";
    const PASS_OVERLAP = 1;    // 1 = passes run back to back

    // The steps are a sequence, not a menu: exactly one is available at a time, and
    // only once the one before it has FINISHED — a half-grown layer feeding the next
    // step would be showing something that had not happened yet. `stepDone` counts
    // completed steps, so button i is live only when i === stepDone and nothing is
    // running. Reset takes it back to the start.
    let stepDone = 0, running = false;
    const STEP_RUNNERS = [];        // filled in as each step is defined

    function syncSteps() {
      stepBtns.forEach(function (b, i) {
        const live = !running && i === stepDone && !!STEP_RUNNERS[i];
        setAriaDisabled(b, !live);
        b.disabled = !live;
      });
      const any = stepDone > 0 || running;
      resetBtn.disabled = !any;
      setAriaDisabled(resetBtn, !any);
    }

    // A layer's numbers become readable only once the step that produces them has
    // finished: layer L is computed by step L+1.
    function syncNodeInfo() {
      svgHost.querySelectorAll(".d1a-node").forEach(function (n) {
        if (!n.__title) return;
        const known = stepDone >= (+n.dataset.layer) + 1;
        const v = n.__val;
        n.setAttribute("aria-label",
          known ? n.__name + ", activation " + v.toFixed(2) : n.__name);
        n.__title.textContent = known
          ? n.__name + "   " + (v >= 0 ? "+" : "\u2212") + Math.abs(v).toFixed(2)
          : n.__name;
        // Not reached yet: inert, and out of the tab order rather than merely
        // unresponsive, so keyboard users are not walked through 26 stops that do
        // nothing.
        n.classList.toggle("off", !known);
        n.setAttribute("tabindex", known ? "0" : "-1");
        if (known) n.removeAttribute("aria-disabled");
        else n.setAttribute("aria-disabled", "true");
      });
      // A selection can be left pointing at a layer that has just gone inert — a
      // reset while a neuron was open.
      if (pinIdx && stepDone < pinIdx[0] + 1) pinIdx = null;
    }

    // Called when a step's animation has actually finished, not when it was clicked.
    function stepFinished(n, mine) {
      if (mine !== stepRun) return;   // a reset or a redraw overtook it
      running = false;
      stepDone = Math.max(stepDone, n);
      syncSteps();
      syncNodeInfo();
      // A readout already open has to be rewritten: the output one withholds the
      // answer until Step 4, so it changes the moment Step 4 lands.
      if (svgHost.__paintPin) svgHost.__paintPin();
    }

    function clearStep1() {
      stepRun++;
      if (flyLayer) { flyLayer.remove(); flyLayer = null; }
      svgHost.querySelectorAll(".d1a-node").forEach(function (n) {
        n.style.fill = "#FFFFFF";
      });
      stepBtns[0].classList.remove("on");
    }

    function runStep1() {
      clearStep1();
      const mine = ++stepRun;
      const words = Array.prototype.slice.call(textEl.querySelectorAll(".d1a-word"));
      const nodes = Array.prototype.slice.call(
        svgHost.querySelectorAll('.d1a-node[data-layer="0"]'));
      if (!words.length || !nodes.length) return;
      stepBtns[0].classList.add("on");
      running = true;
      syncSteps();

      const reduced = window.matchMedia
        && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduced) {
        nodes.forEach(function (n) { n.style.fill = n.__act; });
        stepFinished(1, mine);
        return;
      }

      flyLayer = document.createElement("div");
      // The class the teardown sweep looks for, so leaving the screen mid-flight
      // cannot strand a chip the way the Prediction Chain's used to.
      flyLayer.className = "nnm-flyanchor";
      document.body.appendChild(flyLayer);

      // Measured once, up front: reading a rect per flight would be 120 forced
      // layouts interleaved with 120 animations.
      const wordRects = words.map(function (w) { return w.getBoundingClientRect(); });
      const nodeRects = nodes.map(function (n) { return n.getBoundingClientRect(); });

      let t = 0;
      nodes.forEach(function (node, ni) {
        const nr = nodeRects[ni];
        const tx = nr.left + nr.width / 2, ty = nr.top + nr.height / 2;
        const dur = Math.max(DUR_MIN, DUR_FIRST * Math.pow(DUR_DECAY, ni));
        const passStart = t;
        t += dur * PASS_OVERLAP;
        // Sorted by how far each word has to travel TO THIS UNIT — which is a
        // different order for every unit, since the column runs down the panel.
        const order = words.map(function (w, wi) {
          const r = wordRects[wi];
          return { wi: wi, d: Math.hypot(tx - (r.left + r.width / 2),
                                         ty - (r.top + r.height / 2)) };
        }).sort(function (a, b) { return a.d - b.d; });
        const go = setTimeout(function () {
          if (mine !== stepRun) return;
          // Made first, measured in one batch, then animated. A chip is wider than
          // the word it copies — it carries its own padding and border — so aiming
          // from the WORD's centre landed it about 6px past the node. The target has
          // to come from the chip's own box, and reading all twelve together keeps
          // that to a single layout instead of twelve interleaved ones.
          const batch = order.map(function (o, k) {
            const r = wordRects[o.wi];
            const wrap = document.createElement("div");
            wrap.className = "d1a-flywrap";
            wrap.style.left = r.left + "px";
            wrap.style.top = r.top + "px";
            const mid = document.createElement("div");
            mid.className = "d1a-flyy";
            const chip = document.createElement("div");
            chip.className = "d1a-fly";
            chip.textContent = words[o.wi].textContent;
            mid.appendChild(chip);
            wrap.appendChild(mid);
            flyLayer.appendChild(wrap);
            return { wrap: wrap, mid: mid, chip: chip, k: k };
          });
          batch.forEach(function (b) {
            const cr = b.chip.getBoundingClientRect();
            b.dx = tx - (cr.left + cr.width / 2);
            b.dy = ty - (cr.top + cr.height / 2);
          });
          batch.forEach(function (b) {
            const k = b.k, last = k === words.length - 1;
            // Evenly spaced arrivals: nearest lands at ARRIVE_FIRST of the pass, the
            // farthest right at the end.
            const arrive = dur * (ARRIVE_FIRST + (1 - ARRIVE_FIRST)
              * (words.length < 2 ? 1 : k / (words.length - 1)));
            // Horizontal on the wrapper, vertical on the chip, each with its own
            // easing. The vertical is mostly spent early and the horizontal late, so
            // the word falls, turns, and comes into the unit sideways.
            b.wrap.animate(
              [{ transform: "translateX(0)" },
               { transform: "translateX(" + b.dx + "px)" }],
              { duration: arrive, easing: EASE_X, fill: "forwards" });
            const anim = b.mid.animate(
              [{ transform: "translateY(0)" },
               { transform: "translateY(" + b.dy + "px)" }],
              { duration: arrive, easing: EASE_Y, fill: "forwards" });
            // Fade and collapse ride on their own clock — linear, so "the last
            // stretch" means the last stretch of TIME. Hanging them off either axis
            // would have made the word start vanishing whenever that axis happened
            // to be near done, which is early for the vertical one.
            //
            // On a THIRD element, and this is not tidiness. CSS applies the
            // individual `scale` property BEFORE `transform`, so a chip carrying both
            // had its translateY multiplied by the scale: the word crept back toward
            // its start as it shrank and landed 32px short of the unit. Each element
            // now owns exactly one moving part — wrapper X, middle Y, chip scale.
            b.chip.animate([
              { offset: 0, opacity: 1, scale: "1" },
              { offset: FADE_AT, opacity: 1, scale: "1" },
              { offset: 1, opacity: 0, scale: String(END_SCALE) }
            ], { duration: arrive, easing: "linear", fill: "forwards" });
            anim.onfinish = function () { b.wrap.remove(); };
            // Every word deepens the unit; the last one lands it exactly on __act.
            const land = setTimeout(function () {
              if (mine !== stepRun) return;
              node.style.fill = last ? node.__act
                : actColour(node.__v * ((k + 1) / words.length));
              if (last && ni === nodes.length - 1) {
                const tidy = setTimeout(function () {
                  if (mine !== stepRun) return;
                  if (flyLayer) { flyLayer.remove(); flyLayer = null; }
                }, 500);
                SIM._timeouts.push(tidy);
              }
            }, arrive);
            SIM._timeouts.push(land);
          });
        }, passStart);
        SIM._timeouts.push(go);
      });
      // `t` is where the last pass starts; it ends one pass later.
      const doneAt = setTimeout(function () { stepFinished(1, mine); }, t + 60);
      SIM._timeouts.push(doneAt);
    }

    // ---- Step 2: the connections grow, one input unit at a time ----
    // Every connection this unit makes grows at once — that is the fact being shown,
    // that one unit reaches all eight — and then the next unit's, faster. The three
    // widths are already on the lines from the weights, so what grows out is the
    // real fan, thick where the weight is large.
    const GROW_FIRST = 900, GROW_DECAY = 0.76, GROW_MIN = 150;

    // How far along its final colour a node is when only part of its input has
    // arrived: actColour of a scaled activation, so the path runs through the ramp's
    // own levels and lands exactly on the value. Every column works the same way now
    // that the output pair is on the ramp too.
    function partialFill(node, frac) {
      return frac >= 1 ? node.__act : actColour(node.__v * frac);
    }

    // The answer, held back until every connection is in. Both pills sit in the
    // same resting state until then; the winner is already on the element as __won,
    // so this is a class change rather than anything being worked out late.
    function revealAnswer(on) {
      svgHost.querySelectorAll(".d1a-outpill").forEach(function (pill) {
        const win = on && pill.__won;
        pill.classList.toggle("won", !!win);
        pill.classList.toggle("lost", !win);
      });
    }

    function clearFan(fan) {
      fan.forEach(function (group) {
        group.forEach(function (line) {
          line.getAnimations().forEach(function (a) { a.cancel(); });
          line.style.strokeDashoffset = line.__len;
          line.style.stroke = "";
        });
      });
    }

    // One unit's whole fan grows at once — that is the fact being shown, that a unit
    // reaches every unit in the next layer — and then the next unit's, faster. The
    // three widths are already on the lines from the weights, so what unfolds is the
    // real fan, thick where the weight is large. Identical for both hidden layers,
    // so it is one function rather than two that drift apart.
    function runFan(fan, bi, stepNo, targetLayer) {
      const mine = ++stepRun;
      if (!fan.length) { stepFinished(stepNo, mine); return; }
      // The layer being fed. Every fan that lands moves ALL of its units one step
      // further along, because each of them has just received one more input — the
      // same accumulation Step 1 does with words, one layer further on.
      const targets = Array.prototype.slice.call(
        svgHost.querySelectorAll('.d1a-node[data-layer="' + targetLayer + '"]'));
      // The units the fans leave FROM. Each group of lines is drawn in its own
      // source unit's colour, so what crosses the gap is visibly that unit's signal
      // and not an anonymous line.
      const sources = Array.prototype.slice.call(
        svgHost.querySelectorAll('.d1a-node[data-layer="' + (targetLayer - 1) + '"]'));
      stepBtns[bi].classList.add("on");
      running = true;
      syncSteps();
      const reduced = window.matchMedia
        && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduced) {
        fan.forEach(function (g) { g.forEach(function (l) { l.style.strokeDashoffset = 0; }); });
        targets.forEach(function (n) { n.style.fill = n.__act; });
        stepFinished(stepNo, mine);
        return;
      }
      let t = 0;
      fan.forEach(function (group, ai) {
        const dur = Math.max(GROW_MIN, GROW_FIRST * Math.pow(GROW_DECAY, ai));
        const at = t;
        t += dur;
        const src = sources[ai];
        // A unit sitting at almost zero is WHITE on the ramp, and a white line on a
        // white panel is no line at all — those keep the resting grey, which is also
        // the honest reading: that unit is passing on nothing much.
        const tint = src && src.__act && src.__act !== "#FFFFFF" ? src.__act : null;
        const go = setTimeout(function () {
          if (mine !== stepRun) return;
          group.forEach(function (line) {
            if (tint) line.style.stroke = tint;
            // Grown from the offset the line is parked at, so it draws OUT of the
            // unit it leaves rather than in from the far end: x1 is that side.
            const a = line.animate(
              [{ strokeDashoffset: line.__len }, { strokeDashoffset: 0 }],
              { duration: dur, easing: "cubic-bezier(.3,.05,.4,1)", fill: "forwards" });
            a.onfinish = function () { line.style.strokeDashoffset = 0; };
          });
        }, at);
        SIM._timeouts.push(go);
        // As the NEXT unit's fan sets off, this one's lines drop back to the resting
        // grey — so at any moment the coloured lines are the ones being drawn, and
        // what is left behind is the wiring. Clearing the inline stroke rather than
        // assigning grey hands the colour back to the stylesheet, which is what the
        // hover highlight needs in order to override it later.
        const cool = setTimeout(function () {
          if (mine !== stepRun) return;
          group.forEach(function (line) { line.style.stroke = ""; });
        }, at + dur);
        SIM._timeouts.push(cool);
        // Painted as the fan ARRIVES, not as it sets off.
        const paint = setTimeout(function () {
          if (mine !== stepRun) return;
          const frac = (ai + 1) / fan.length;
          targets.forEach(function (n) { n.style.fill = partialFill(n, frac); });
        }, at + dur);
        SIM._timeouts.push(paint);
      });
      const doneAt = setTimeout(function () {
        if (mine !== stepRun) return;
        // Every line is in: the two numbers are complete, so the larger one can be
        // called.
        if (stepNo === 4) revealAnswer(true);
        stepFinished(stepNo, mine);
      }, t + 60);
      SIM._timeouts.push(doneAt);
    }

    function clearFanStep(fan, bi, targetLayer) {
      stepRun++;
      clearFan(fan);
      svgHost.querySelectorAll('.d1a-node[data-layer="' + targetLayer + '"]')
        .forEach(function (n) { n.style.fill = "#FFFFFF"; });
      stepBtns[bi].classList.remove("on");
    }
    function clearStep2() { clearFanStep(fanOut, 1, 1); }
    function clearStep3() { clearFanStep(fanOut2, 2, 2); }
    function clearStep4() { clearFanStep(fanOut3, 3, 3); revealAnswer(false); }
    function runStep2() { clearStep2(); runFan(fanOut, 1, 2, 1); }
    function runStep3() { clearStep3(); runFan(fanOut2, 2, 3, 2); }
    function runStep4() { clearStep4(); runFan(fanOut3, 3, 4, 3); }

    function clearSteps() {
      clearStep1(); clearStep2(); clearStep3(); clearStep4();
      running = false; stepDone = 0;
      syncSteps();
      // Also the path every redraw takes, so this is where the tooltips get their
      // initial "name only" state as well as their reset.
      syncNodeInfo();
      if (svgHost.__paintPin) svgHost.__paintPin();
    }

    STEP_RUNNERS[0] = runStep1;
    STEP_RUNNERS[1] = runStep2;
    STEP_RUNNERS[2] = runStep3;
    STEP_RUNNERS[3] = runStep4;
    stepBtns.forEach(function (b, i) {
      b.addEventListener("click", function () {
        if (b.disabled || !STEP_RUNNERS[i]) return;
        STEP_RUNNERS[i]();
      });
    });
    resetBtn.addEventListener("click", clearSteps);
    syncSteps();
    prevBtn.addEventListener("click", function () { if (idx > 0) { idx--; render(); } });
    nextBtn.addEventListener("click", function () {
      if (idx < cases.length - 1) { idx++; render(); }
    });

    render();
    SIM.onResize = function () { render(); };
    // The first render runs before the panel has been laid out, so the host still
    // measures 0 and the drawing above falls back to its minimums. This is what
    // redraws it at the real size, and what keeps it right as the window changes.
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(function () {
        if (Math.abs(svgHost.clientWidth - drawnW) < 1
            && Math.abs(svgHost.clientHeight - drawnH) < 1) return;
        render();
      });
      ro.observe(svgHost);
      SIM._observers.push(ro);
    }
    return wrap;
  }


  // ---------------------------------------------------------------
  // 1B — Extract Pathways.  Design Sketches slides 17-18, and Scott's heatmap
  // demo: a grid of neuron activations on the left, and on the right one grid
  // per pathway showing loading x activation. 1A ends on "the network is real
  // and unreadable"; this is where the readable thing comes from.
  //
  // The extraction is NOT staged. The toy network below is run over all 800
  // conversations to make a real 800 x 96 activation matrix, and the pathways
  // are pulled out of it by actual factor extraction — power iteration with
  // deflation on the covariance — so the loadings, the explained variance and
  // the pathway scores on screen are all computed here, from that matrix. Only
  // the network underneath is invented: the alien corpus has no neuron layer
  // anywhere (alien-fa-4 carries pathway scores and importance but no
  // `loadings`, and its activations/ endpoint is a 404), while the Yelp fit has
  // 6 x 780. If Scott exports alien neuron data, ACT below is the only thing
  // that has to change.
  //
  // Slide 18 is the framing this has to keep: a pathway is not causal, not a
  // substitute for a hidden neuron, just an explanation tool.
  // ---------------------------------------------------------------
  if (activeSim === "d1b") {
    const D = simData();
    const items = D.items;
    const VOCAB = Object.keys(D.vocabulary).sort();
    const LABELS = ["Wait", "Approach"];
    const NEUR = 96, GRID_W = 12, GRID_H = 8;   // 12 x 8 reads as a grid, not a list
    // However many the fit has. It was pinned at 4 while every other interactive
    // moved to the three-pathway fit, so Day 1 extracted four pathways and Day 2
    // then showed three of them.
    const NPATH = D.nPathways;
    let cases = items.slice();
    let idx = 0;
    let extracted = null;      // {loadings, scores, varFrac}
    let selPath = 0;
    let selNeuron = -1;
    let playing = false, playTimer = null;

    // ---- the neuron layer ----
    // A random network was the obvious construction and it was the wrong one:
    // random weights spread the variance evenly, so extraction returned four
    // look-alike pathways (11 / 10 / 7 / 6 percent) where the real fit is
    // dominated by the first (55 / 20 / 15 / 10). Four equally noisy grids is
    // the opposite of the lesson.
    //
    // So the neurons are built from the model's OWN pathway scores: each neuron
    // reads some mix of the four real pathways, scaled by how much variance the
    // fit says each one carries, plus its own private noise. Nothing about a
    // pathway is written into any single neuron — every neuron is a blend — but
    // the structure is genuinely there to be found, which is what makes the
    // extraction below worth running.
    const rand = (function (seed) {
      return function () {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296 * 2 - 1;
      };
    })(20260902);
    function tanh(x) { return Math.tanh ? Math.tanh(x) : (Math.exp(2*x)-1)/(Math.exp(2*x)+1); }

    const NP_REAL = D.nPathways;
    // Pathway scores come out of the fit standardised, so their spread says
    // nothing about their size; explainedVariance is where the size lives.
    const AMP = D.explainedVariance.map(Math.sqrt);
    const MIX = [];                       // NEUR x NP_REAL, unit length per neuron
    for (let j = 0; j < NEUR; j++) {
      const row = [];
      let n2 = 0;
      for (let k = 0; k < NP_REAL; k++) { const v = rand(); row.push(v); n2 += v * v; }
      const norm = Math.sqrt(n2) || 1;
      MIX.push(row.map(function (v) { return v / norm; }));
    }
    const NOISE = 0.35;                   // private variance per neuron
    // Every conversation's activations, once. This is the matrix the pathways
    // are extracted FROM, and slide 17 names it exactly: "activation value for
    // all neurons for all cases".
    const ACT = items.map(function (it) {
      const row = new Array(NEUR);
      for (let j = 0; j < NEUR; j++) {
        let s = 0;
        for (let k = 0; k < NP_REAL; k++) s += MIX[j][k] * AMP[k] * it.act[k];
        row[j] = tanh((s + NOISE * rand()) * 0.9);
      }
      return row;
    });
    const ACT_BY_ID = {};
    items.forEach(function (it, i) { ACT_BY_ID[it.id] = ACT[i]; });
    function hidden(it) { return ACT_BY_ID[it.id]; }

    // ---- real factor extraction ----
    // Power iteration with deflation over the covariance of the centred matrix.
    // Enough for four components on an 800 x 96 matrix, and it means the numbers
    // under each grid are measured rather than written in.
    function extract(nComp) {
      const n = ACT.length, m = NEUR;
      const mean = new Array(m).fill(0);
      for (let r = 0; r < n; r++) for (let c = 0; c < m; c++) mean[c] += ACT[r][c] / n;
      const X = ACT.map(function (row) {
        return row.map(function (v, c) { return v - mean[c]; });
      });
      // covariance, m x m
      const C = [];
      for (let a = 0; a < m; a++) C.push(new Array(m).fill(0));
      for (let r = 0; r < n; r++) {
        const row = X[r];
        for (let a = 0; a < m; a++) {
          const va = row[a];
          if (!va) continue;
          for (let b = a; b < m; b++) C[a][b] += va * row[b];
        }
      }
      for (let a = 0; a < m; a++) for (let b = a; b < m; b++) {
        C[a][b] /= (n - 1); C[b][a] = C[a][b];
      }
      let totalVar = 0;
      for (let a = 0; a < m; a++) totalVar += C[a][a];

      const loadings = [], eig = [];
      for (let k = 0; k < nComp; k++) {
        let v = [];
        for (let a = 0; a < m; a++) v.push(Math.sin((a + 1) * (k + 1) * 12.9898));
        let lam = 0;
        for (let iter = 0; iter < 120; iter++) {
          const u = new Array(m).fill(0);
          for (let a = 0; a < m; a++) {
            let s = 0;
            for (let b = 0; b < m; b++) s += C[a][b] * v[b];
            u[a] = s;
          }
          let norm = Math.sqrt(u.reduce(function (s, x) { return s + x * x; }, 0)) || 1;
          for (let a = 0; a < m; a++) u[a] /= norm;
          lam = norm;
          v = u;
        }
        // Sign is arbitrary in an eigenvector; pin it so the biggest loading is
        // positive, or the same run could paint a pathway's grid inverted.
        let big = 0;
        for (let a = 0; a < m; a++) if (Math.abs(v[a]) > Math.abs(v[big])) big = a;
        if (v[big] < 0) for (let a = 0; a < m; a++) v[a] = -v[a];
        loadings.push(v); eig.push(lam);
        // deflate
        for (let a = 0; a < m; a++) for (let b = 0; b < m; b++) C[a][b] -= lam * v[a] * v[b];
      }
      // Pathway score per case = the centred activations projected on the loading.
      const scores = X.map(function (row) {
        return loadings.map(function (L) {
          let s = 0;
          for (let a = 0; a < m; a++) s += row[a] * L[a];
          return s;
        });
      });
      return { loadings: loadings, scores: scores, mean: mean,
               varFrac: eig.map(function (e) { return e / totalVar; }) };
    }

    // ---- shell ----
    const wrap = document.createElement("div");
    wrap.className = "sim-content";
    SIM._timeouts = []; SIM._observers = []; SIM._rafs = [];
    const stack = document.createElement("div");
    stack.className = "nnm-stack";
    wrap.appendChild(stack);
    const toolbar = document.createElement("div");
    toolbar.className = "d3-toolbar d1b-toolbar";
    stack.appendChild(toolbar);
    const filter = NNM_FILTER.buildBar(function (its) {
      cases = its; idx = 0; render();
    });
    filter.el.classList.add("d3-filter");
    toolbar.appendChild(filter.el);
    if (filter.about) toolbar.appendChild(filter.about);
    const root = document.createElement("div");
    root.className = "nnm";
    stack.appendChild(root);

    function panel(parent, title, cls) {
      const col = document.createElement("div");
      col.className = "d3b-col " + (cls || "");
      parent.appendChild(col);
      const p = document.createElement("div");
      p.className = "nnm-panel d1b-panel";
      col.appendChild(p);
      const h = document.createElement("div");
      h.className = "nnm-panel-head";
      const t = document.createElement("span");
      t.textContent = title;
      h.appendChild(t);
      p.appendChild(h);
      const b = document.createElement("div");
      b.className = "nnm-panel-body d1b-body";
      p.appendChild(b);
      return { col: col, panel: p, head: h, body: b };
    }

    // ---- left: the activations one case at a time ----
    const actCard = panel(root, "Neuron activations", "d1b-actcol");
    const actCount = document.createElement("span");
    actCount.className = "d3b-count";
    actCard.head.appendChild(actCount);
    const nav = document.createElement("div");
    nav.className = "nnm-nav";
    const playBtn = document.createElement("button");
    playBtn.className = "nnm-navbtn d1b-play";
    playBtn.innerHTML = "&#9654;";
    playBtn.setAttribute("aria-label", "Play through the conversations");
    const prevBtn = document.createElement("button");
    prevBtn.className = "nnm-navbtn"; prevBtn.innerHTML = "&#9664;";
    prevBtn.setAttribute("aria-label", "Previous conversation");
    const nextBtn = document.createElement("button");
    nextBtn.className = "nnm-navbtn"; nextBtn.innerHTML = "&#9654;";
    nextBtn.setAttribute("aria-label", "Next conversation");
    nav.appendChild(playBtn); nav.appendChild(prevBtn); nav.appendChild(nextBtn);
    actCard.head.appendChild(nav);
    const actKey = document.createElement("div");
    actKey.className = "d1b-key";
    actKey.innerHTML = '<span>−</span><i class="act"></i><span>+ activation</span>';
    actCard.body.appendChild(actKey);
    const actGrid = document.createElement("div");
    actGrid.className = "d1b-grid d1b-actgrid";
    actCard.body.appendChild(actGrid);
    const actText = document.createElement("div");
    actText.className = "d1b-casetext";
    actCard.body.appendChild(actText);
    const extractBtn = document.createElement("button");
    extractBtn.className = "d1b-extract";
    extractBtn.textContent = "Extract pathways";
    actCard.body.appendChild(extractBtn);

    // ---- right: what comes out ----
    const outCard = panel(root, "Activated pathways", "d1b-outcol");
    const outSub = document.createElement("span");
    outSub.className = "d1b-headsub";
    outSub.textContent = "loading × activation";
    outCard.head.appendChild(outSub);
    const pathRow = document.createElement("div");
    pathRow.className = "d1b-pathrow";
    outCard.body.appendChild(pathRow);
    const loadHead = document.createElement("div");
    loadHead.className = "d3b-subhead d1b-loadhead";
    outCard.body.appendChild(loadHead);
    const loadKey = document.createElement("div");
    loadKey.className = "d1b-key d1b-loadkey";
    loadKey.innerHTML = '<span>−</span><i class="load"></i><span>+ loading</span>';
    outCard.body.appendChild(loadKey);
    const loadWrap = document.createElement("div");
    loadWrap.className = "d1b-loadwrap";
    outCard.body.appendChild(loadWrap);
    const note = document.createElement("div");
    note.className = "d1b-note";
    outCard.body.appendChild(note);

    // ---- drawing ----
    function actColour(v, scale) {
      const t = Math.min(1, Math.abs(v) / (scale || 1));
      if (t < 0.02) return "#FFFFFF";
      return (v >= 0 ? FILL_POS : FILL_NEG)[level(t)];
    }
    // Loadings get their own ramp, per slide 17 — purple positive, yellow
    // negative — so a loading can never be mistaken for an activation.
    const LOAD_POS = ["#EDE7F6", "#D1C4E9", "#B39DDB", "#9575CD", "#673AB7"];
    const LOAD_NEG = ["#FFF8E1", "#FFECB3", "#FFE082", "#FFCA28", "#F9A825"];
    function loadColour(v, scale) {
      const t = Math.min(1, Math.abs(v) / (scale || 1));
      if (t < 0.02) return "#FFFFFF";
      return (v >= 0 ? LOAD_POS : LOAD_NEG)[level(t)];
    }

    function fillGrid(host, vals, colour, scale, onPick) {
      host.innerHTML = "";
      for (let i = 0; i < vals.length; i++) {
        const d = document.createElement("i");
        d.className = "d1b-dot" + (i === selNeuron ? " picked" : "");
        d.style.background = colour(vals[i], scale);
        d.title = "Neuron " + (i + 1) + "   " + (vals[i] >= 0 ? "+" : "−")
          + Math.abs(vals[i]).toFixed(3);
        if (onPick) {
          d.addEventListener("click", function () { onPick(i); });
          d.classList.add("pickable");
        }
        host.appendChild(d);
      }
    }

    function renderPathways(h) {
      pathRow.innerHTML = "";
      if (!extracted) {
        const empty = document.createElement("div");
        empty.className = "d1b-empty";
        empty.textContent = "Nothing has been pulled out of these activations yet.";
        pathRow.appendChild(empty);
        loadHead.textContent = "";
        loadKey.style.visibility = "hidden";
        loadWrap.innerHTML = "";
        note.textContent = "";
        return;
      }
      loadKey.style.visibility = "";
      // loading x activation, neuron by neuron — the quantity Scott's demo puts
      // across the top of its right-hand panel, and the thing a pathway's score
      // is the sum of.
      const prods = extracted.loadings.map(function (L) {
        return L.map(function (l, i) { return l * (h[i] - extracted.mean[i]); });
      });
      const scale = Math.max.apply(null, prods.map(function (p) {
        return Math.max.apply(null, p.map(Math.abs)); })) || 1;
      prods.forEach(function (p, k) {
        const cell = document.createElement("div");
        cell.className = "d1b-path" + (k === selPath ? " on" : "");
        cell.style.animationDelay = (k * 90) + "ms";
        const cap = document.createElement("div");
        cap.className = "d1b-pathname";
        cap.textContent = "Pathway " + (k + 1);
        cell.appendChild(cap);
        const g = document.createElement("div");
        g.className = "d1b-grid d1b-pathgrid";
        fillGrid(g, p, actColour, scale, null);
        cell.appendChild(g);
        const stat = document.createElement("div");
        stat.className = "d1b-stat";
        const absMax = Math.max.apply(null, p.map(Math.abs));
        const sum = p.reduce(function (s, x) { return s + x; }, 0);
        stat.innerHTML = "absMax " + absMax.toFixed(3) + "<br>sum "
          + (sum >= 0 ? "+" : "−") + Math.abs(sum).toFixed(3) + "<br>"
          + Math.round(100 * extracted.varFrac[k]) + "% of variance";
        cell.appendChild(stat);
        cell.addEventListener("click", function () { selPath = k; render(); });
        pathRow.appendChild(cell);
      });

      // Loadings. A pathway's are shown on the same grid the neurons use, so the
      // two pictures line up dot for dot; a single neuron's are four bars out
      // from a zero line, which is the sketch under "Loadings" in the brief.
      loadWrap.innerHTML = "";
      if (selNeuron >= 0) {
        loadHead.textContent = "Neuron " + (selNeuron + 1) + " — its loading on each pathway";
        const chart = document.createElement("div");
        chart.className = "d1b-bars";
        const lim = Math.max.apply(null, extracted.loadings.map(function (L) {
          return Math.abs(L[selNeuron]); })) || 1;
        extracted.loadings.forEach(function (L, k) {
          const v = L[selNeuron];
          const row = document.createElement("div");
          row.className = "d1b-barrow";
          const lab = document.createElement("span");
          lab.className = "d1b-barlab";
          lab.textContent = "Pathway " + (k + 1);
          const track = document.createElement("i");
          track.className = "d1b-bartrack";
          const fill = document.createElement("i");
          fill.className = "d1b-barfill " + (v >= 0 ? "pos" : "neg");
          const half = 50 * Math.abs(v) / lim;
          fill.style.width = half.toFixed(2) + "%";
          fill.style.left = (v >= 0 ? 50 : 50 - half).toFixed(2) + "%";
          track.appendChild(fill);
          const num = document.createElement("em");
          num.className = "d1b-barnum";
          num.textContent = (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(3);
          row.appendChild(lab); row.appendChild(track); row.appendChild(num);
          chart.appendChild(row);
        });
        loadWrap.appendChild(chart);
      } else {
        loadHead.textContent = "Pathway " + (selPath + 1)
          + " — how much it reads from each neuron";
        const L = extracted.loadings[selPath];
        const lim = Math.max.apply(null, L.map(Math.abs)) || 1;
        const g = document.createElement("div");
        g.className = "d1b-grid d1b-loadgrid";
        fillGrid(g, L, loadColour, lim, function (i) { selNeuron = i; render(); });
        loadWrap.appendChild(g);
      }

      note.innerHTML = selNeuron >= 0
        ? '<button class="d1b-clear" type="button">Back to the pathway</button>'
          + " A neuron feeds every pathway a little and one of them a lot."
        : "Click a neuron to see what each pathway reads from it. "
          + "A pathway is not a part of the network — it is a way of reading one.";
      const clear = note.querySelector(".d1b-clear");
      if (clear) clear.addEventListener("click", function () { selNeuron = -1; render(); });
    }

    function render() {
      const empty = cases.length === 0;
      root.style.display = empty ? "none" : "";
      if (empty) return;
      if (idx >= cases.length) idx = cases.length - 1;
      const it = cases[idx];
      const h = hidden(it);

      actCount.textContent = (idx + 1) + " / " + cases.length;
      setAriaDisabled(prevBtn, idx === 0);
      setAriaDisabled(nextBtn, idx === cases.length - 1);
      playBtn.innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
      const scale = Math.max.apply(null, h.map(Math.abs)) || 1;
      fillGrid(actGrid, h, actColour, scale, extracted
        ? function (i) { selNeuron = i; render(); } : null);
      actText.textContent = it.text.split(/\s+/).slice(0, 14).join(" ") + "…";
      extractBtn.disabled = !!extracted;
      extractBtn.textContent = extracted ? "Pathways extracted" : "Extract pathways";

      renderPathways(h);
    }

    extractBtn.addEventListener("click", function () {
      if (extracted) return;
      extractBtn.textContent = "Extracting…";
      extractBtn.disabled = true;
      // A beat first, so the label actually paints before the arithmetic — the
      // extraction is real and takes long enough to see. A timer, NOT
      // requestAnimationFrame: rAF does not run in a background tab, so a student
      // who switched away mid-press would come back to a button that says
      // "Extracting…" for ever.
      const t = setTimeout(function () {
        extracted = extract(NPATH);
        root.classList.add("d1b-hasrun");
        render();
      }, 40);
      SIM._timeouts.push(t);
    });

    function step() {
      if (idx < cases.length - 1) idx++; else idx = 0;
      render();
    }
    playBtn.addEventListener("click", function () {
      playing = !playing;
      if (playing) {
        playTimer = setInterval(step, 700);
        SIM._timeouts.push(playTimer);
      } else if (playTimer) { clearInterval(playTimer); playTimer = null; }
      render();
    });
    prevBtn.addEventListener("click", function () { if (idx > 0) { idx--; render(); } });
    nextBtn.addEventListener("click", function () {
      if (idx < cases.length - 1) { idx++; render(); }
    });

    render();
    SIM.onResize = function () {};
    return wrap;
  }


  // ---- not yet built: blank content area ----
  const wrap = document.createElement("div");
  wrap.className = "sim-content";

  // Day 1's two screens have no content yet, but they do have About copy, so they
  // carry the button in the same corner the built ones put it. Inside a .nnm-stack
  // like every built screen, which is what supplies the 9px above the top row and
  // the full width the button is pushed to the right edge of — without it the
  // row is a shrink-to-fit flex item with no free space to justify into, and the
  // button sits on the LEFT.
  const blankStack = document.createElement("div");
  blankStack.className = "nnm-stack";
  const blankHead = document.createElement("div");
  blankHead.className = "nnm-blankhead";
  blankHead.appendChild(makeAboutButton());
  blankStack.appendChild(blankHead);
  wrap.appendChild(blankStack);

  // Polite live region for screen-reader announcements. Call SIM.announce("...")
  // from anywhere in the interactive.
  const liveAnnounce = document.createElement("div");
  liveAnnounce.className = "sr-only";
  liveAnnounce.setAttribute("aria-live", "polite");
  liveAnnounce.setAttribute("aria-atomic", "true");
  wrap.appendChild(liveAnnounce);
  SIM._suppressAnnounce = false;
  SIM.announce = function(msg) {
    if (SIM._suppressAnnounce) return;
    liveAnnounce.textContent = "";
    requestAnimationFrame(() => { liveAnnounce.textContent = msg; });
  };

  // Handles invalidateSimCache() tears down when the sim is switched.
  SIM._timeouts = [];
  SIM._observers = [];
  SIM._rafs = [];

  return wrap;
}
