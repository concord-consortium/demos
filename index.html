<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MassSims</title>
<style>
/* Self-hosted fonts */
/* Barlow 400 */ @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 400; src: url('fonts/17ef8a066a33.woff2') format('woff2'); }
/* Barlow Condensed 400 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 400; src: url('fonts/343e6c738440.woff2') format('woff2'); }
/* Barlow Condensed 600 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 600; src: url('fonts/07c3c732a90e.woff2') format('woff2'); }
/* Lato 400 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; src: url('fonts/d5b18a30a456.woff2') format('woff2'); }
/* Lato 400i */ @font-face { font-family: 'Lato'; font-style: italic; font-weight: 400; src: url('fonts/lato-italic-400.woff2') format('woff2'); }
/* Lato 700 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 700; src: url('fonts/a658a6a6ab26.woff2') format('woff2'); }
/* Roboto Condensed */ @font-face { font-family: 'Roboto Condensed'; font-style: normal; font-weight: 100 900; src: url('fonts/d2466d84dfac.woff2') format('woff2'); }
/* Slackey */ @font-face { font-family: 'Slackey'; font-style: normal; font-weight: 400; src: url('fonts/b9e0133fed40.woff2') format('woff2'); }
/* Fontdiner Swanky */ @font-face { font-family: 'Fontdiner Swanky'; font-style: normal; font-weight: 400; src: url('fonts/ab612a511c9f.woff2') format('woff2'); }
/* Vampiro One */ @font-face { font-family: 'Vampiro One'; font-style: normal; font-weight: 400; src: url('fonts/51ccc1196225.woff2') format('woff2'); }
/* Coming Soon */ @font-face { font-family: 'Coming Soon'; font-style: normal; font-weight: 400; src: url('fonts/f6db7f9cd556.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    background: #e0e0e0;
    color: #333;
    letter-spacing: 0.02em;
    padding: 20px;
  }

  /* Main layout: left buttons | viewport | right buttons */
  .main-layout {
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }

  /* Button columns */
  .btn-column {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 150px;
    flex-shrink: 0;
    padding-top: 0;
  }

  .btn-column [role="group"] {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .btn-column-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .toggle-btn {
    font-family: 'Barlow Condensed', sans-serif;
    padding: 8px 14px;
    min-height: 44px;
    font-size: 18px;
    line-height: 20px;
    font-weight: 600;
    color: #333;
    background: #f0f0f0;
    border: 1px solid #333;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    white-space: nowrap;
  }

  .toggle-btn:hover,
  .toggle-btn:focus-visible {
    background: #d8d8d8;
    color: #333;
  }

  .toggle-btn:focus {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px #fff;
  }
  .toggle-btn:focus:not(:focus-visible) {
    outline: none;
    box-shadow: none;
  }
  .toggle-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px #fff;
  }

  body.teal-bg .toggle-btn {
    border-color: #fff;
  }

  body.teal-bg .toggle-btn:focus {
    outline: none;
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px #005FCC, 0 0 0 4px #fff;
  }
  body.teal-bg .toggle-btn:focus:not(:focus-visible) {
    box-shadow: none;
  }
  body.teal-bg .toggle-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px #005FCC, 0 0 0 4px #fff;
  }

  .toggle-btn:active:not(.active) {
    background: #c0c0c0;
  }

  .toggle-btn.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }

  body.teal-bg .toggle-btn.active {
    border-color: #fff;
  }

  /* Viewport display area */
  .viewport-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-left: 1px solid #858585;
    align-self: stretch;
    min-height: calc(100vh - 40px);
    position: relative;
  }

  .viewport-info {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.3;
    color: #333;
    margin-bottom: 12px;
    text-align: center;
    min-height: 2.6em;
    position: relative;
    z-index: 1;
  }

  .viewport-info strong {
    font-weight: 600;
    color: #333;
  }

  /* Device frame */
  .device-frame {
    position: relative;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    box-sizing: content-box;
    border: 2px solid #333;
    transition: width 0.3s ease, height 0.3s ease;
  }

  .device-frame.no-limit {
    border-color: #ccc;
    border-style: dashed;
    background: transparent;
  }

  /* Browser / OS chrome bars */
  .chrome-top {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0 8px;
    position: relative;
  }

  .chrome-top::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    white-space: nowrap;
  }

  .chrome-bottom {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .chrome-bottom::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    text-align: center;
    white-space: nowrap;
  }

  /* Available viewport area */
  .viewport-area {
    background: #0481A0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
    flex: 1;
  }

  /* AP container — floated centered unit */
  .ap-container {
    background: transparent;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .ap-right-column {
    display: flex;
    flex-direction: column;
    width: 767px;
    box-sizing: content-box;
    border: 1px solid #858585;
    margin-right: 26px;
  }

  .ap-header {
    background: #047a99;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .ap-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .ap-body {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  /* Left column for 2-column layout */
  .ap-left-column {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-left: 28px;
    margin-right: 10px;
    transition: width 0.25s ease;
    overflow: hidden;
  }

  .ap-left-toggle {
    background: #3f3f3f;
    display: flex;
    align-items: center;
    position: relative;
    cursor: pointer;
  }

  .ap-left-toggle:hover,
  .ap-left-toggle:focus-visible {
    background: #4a4a4a;
  }

  .ap-left-toggle:active {
    background: #3a3a3a;
  }

  .ap-left-toggle-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    position: absolute;
    left: 181px;
    white-space: nowrap;
  }

  .ap-left-toggle-icon {
    position: absolute;
    right: 20px;
    width: 32px;
    height: 32px;
  }

  .ap-left-toggle-icon-collapsed {
    width: 32px;
    height: 32px;
    margin-top: 5px;
    transform: scaleX(-1);
  }

  .ap-left-toggle-label-collapsed {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    margin-top: 12px;
    white-space: nowrap;
  }

  .ap-left-toggle:focus {
    outline: none;
    box-shadow: inset 0 0 0 2px #005FCC, inset 0 0 0 4px #fff;
  }
  .ap-left-toggle:focus:not(:focus-visible) {
    box-shadow: none;
  }
  .ap-left-toggle:focus-visible {
    outline: none;
    box-shadow: inset 0 0 0 2px #005FCC, inset 0 0 0 4px #fff;
  }

  .ap-left-resources {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .ap-left-resources-header {
    background: #dfdfdf;
    height: 37px;
    padding-left: 20px;
    display: flex;
    align-items: center;
  }

  .ap-left-resources-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #333;
  }

  .ap-left-resources-body {
    flex: 1;
    background: #f4f4f4;
    padding: 25px 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
    overflow: auto;
  }

  .ap-left-resources-body p {
    margin: 0 0 16px 0;
  }

  .ap-left-resources-body p:last-child {
    margin-bottom: 0;
  }

  .ap-left-resources-body ul {
    margin: 0 0 16px 0;
    padding-left: 40px;
  }

  .ap-left-resources-body li {
    margin-bottom: 12px;
  }

  .ap-left-resources-body li:last-child {
    margin-bottom: 0;
  }


  /* Sim title bar */
  .sim-title-bar {
    height: 50px;
    background: var(--sim-title-bar-bg, #fff);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px 0 20px;
    flex-shrink: 0;
    position: relative;
  }

  .sim-title-bar::after {
    content: "";
    position: absolute;
    bottom: calc(-1 * var(--sim-title-accent, 0px));
    left: 0;
    right: 0;
    height: var(--sim-title-accent, 0px);
    background: inherit;
  }

  .sim-title-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sim-title-name {
    font-family: 'Lato', sans-serif;
    font-size: 24px;
    line-height: 1;
    font-weight: 700;
    color: var(--sim-title-text, #333);
    margin: 0;
    font-synthesis: none;
    display: flex;
    align-items: center;
    height: 28px;
  }

  .sim-title-desc {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    color: var(--sim-title-desc, #333);
  }

  .sim-title-right {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .sim-title-logo {
    display: block;
  }

  .sim-title-logo:first-child {
    margin-right: 3px;
  }

  .sim-info-btn {
    margin-left: 5px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    font-weight: 700;
    padding: 3px 12px 3px 8px;
    height: 34px;
    box-sizing: border-box;
    border: 2px solid var(--sim-about-border, #555);
    border-radius: 6px;
    background: #FFFDF2;
    color: var(--sim-about-text, #333);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
  }

  .sim-info-btn::after {
    content: "";
    position: absolute;
    top: -7px;
    left: 0;
    right: 0;
    bottom: -7px;
  }

  .sim-info-btn.compact-hit::after {
    top: 0;
    bottom: 0;
  }

  .sim-info-btn svg {
    width: 24px;
    height: 24px;
    pointer-events: none;
  }

  .sim-info-btn:hover,
  .sim-info-btn:focus-visible {
    background: var(--sim-btn-hover, #f0f0f0);
  }

  .sim-info-btn:active {
    background: var(--sim-btn-active, #d0d0d0);
  }

  .sim-info-btn:focus {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }
  .sim-info-btn:focus:not(:focus-visible) {
    outline: none;
  }
  .sim-info-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }

  /* Info modal */
  .info-modal {
    position: absolute;
    top: 50px;
    right: 10px;
    width: 400px;
    max-height: 70%;
    background: #fff;
    border: 2px solid var(--sim-about-border, #555);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    z-index: 101;
    overflow: hidden;
  }

  .info-modal-header {
    display: flex;
    align-items: center;
    padding: 3px 3px 3px 12px;
    height: 52px;
    box-sizing: border-box;
    border-bottom: 1px solid #9E8540;
    cursor: grab;
    flex-shrink: 0;
    user-select: none;
    background: #FFFDF2;
  }

  .info-modal-header:active {
    cursor: grabbing;
  }

  .info-modal-header-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    margin-right: 10px;
  }

  .info-modal-header-title {
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #333;
    flex: 1;
    margin: 0;
  }

  .info-modal-close {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFDF2;
    border: none;
    cursor: pointer;
    border-radius: 4px;
    padding: 0;
    flex-shrink: 0;
  }

  .info-modal-close:hover,
  .info-modal-close:focus-visible {
    background: var(--sim-btn-hover, #f0f0f0);
  }

  .info-modal-close:active {
    background: var(--sim-btn-active, #d0d0d0);
  }

  .info-modal-close:focus {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }
  .info-modal-close:focus:not(:focus-visible) {
    outline: none;
  }
  .info-modal-close:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }

  .info-modal-close svg {
    width: 24px;
    height: 24px;
  }

  .info-modal-body {
    padding: 16px 20px 20px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 22px;
    color: #333;
    user-select: text;
  }

  .info-modal-body-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .info-modal-body:focus {
    outline: none;
  }
  .info-modal-body:focus-visible {
    outline: none;
  }

  .info-modal-body-wrap .scroll-focus-ring {
    border-radius: 0 0 6px 6px;
  }

  .info-modal-body:focus ~ .scroll-focus-ring {
    display: block;
  }
  .info-modal-body:focus:not(:focus-visible) ~ .scroll-focus-ring {
    display: none;
  }
  .info-modal-body:focus-visible ~ .scroll-focus-ring {
    display: block;
  }

  .info-modal-body h3 {
    font-size: 16px;
    font-weight: 700;
    margin: 16px 0 6px;
    color: #333;
  }

  .info-modal-body h3:first-child {
    margin-top: 0;
  }

  .info-modal-body p {
    margin: 0 0 12px;
  }

  .info-modal-body ul,
  .info-modal-body ol {
    margin: 0 0 12px;
    padding-left: 20px;
  }

  .info-modal-body li {
    margin-bottom: 4px;
  }

  /* Question containers below sim content */
  .question-row {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    padding: 0 27px;
    width: 100%;
    box-sizing: border-box;
  }

  .question-container {
    width: 517px;
    display: flex;
    flex-direction: column;
    border: 1px solid #858585;
    box-sizing: content-box;
  }

  .question-header {
    background: #047a99;
    height: 36px;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .question-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .question-body {
    background: #fff;
    flex: 1;
    min-height: 200px;
    padding: 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
  }

  .question-input {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 16px;
    height: 200px;
    margin-top: 10px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-style: italic;
    color: #767676;
    line-height: 1.5;
  }

  .content-area.standalone {
    border: 2px solid var(--sim-panel-border, #555);
    border-radius: 10px;
    box-sizing: content-box;
    overflow: hidden;
  }

  /* Content area */
  .content-area {
    font-family: 'Lato', sans-serif;
    background: var(--sim-content-bg, #fff);
    position: relative;
    flex-shrink: 0;
    transition: width 0.25s ease;
    display: flex;
    flex-direction: column;
    user-select: none;
    overflow: hidden;
  }

  /* Sim content containers */
  .sim-content {
    display: flex;
    gap: 10px;
    padding: 0 10px 10px 10px;
    flex: 1;
    min-height: 0;
  }

  .sim-panel-tab {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 36px;
    padding: 0 14px;
    background: var(--sim-panel-tab-bg, #e8e8e8);
    border: 2px solid var(--sim-panel-border, #555);
    border-radius: 999px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    font-family: 'Lato', sans-serif;
    white-space: nowrap;
    z-index: 11;
  }

  .sim-panel-tab-label {
    font-size: 18px;
    line-height: 22px;
    font-weight: 700;
    color: var(--sim-panel-tab-text, #333);
    margin: 0;
  }

  .sim-panel-tab-subtitle {
    font-size: 16px;
    font-weight: 400;
    color: #333;
  }

  .sim-tab-wrap {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: stretch;
    height: 36px;
    z-index: 11;
    box-sizing: border-box;
    white-space: nowrap;
  }

  .sim-panel {
    border: 2px solid var(--sim-panel-border, #555);
    border-radius: 8px;
    background: var(--sim-panel-bg, #e8e8e8);
    margin-top: 17px;
    box-sizing: border-box;
    flex: 1;
    position: relative;
  }

  .sim-panel.has-scroll {
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .trials-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 31px 0 12px 15px;
  }

  .trials-scroll:focus {
    outline: none;
  }
  .trials-scroll:focus-visible {
    outline: none;
  }

  .trials-scroll:focus ~ .scroll-focus-ring {
    display: block;
  }
  .trials-scroll:focus:not(:focus-visible) ~ .scroll-focus-ring {
    display: none;
  }
  .trials-scroll:focus-visible ~ .scroll-focus-ring {
    display: block;
  }

  .scroll-focus-ring {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px #fff, inset 0 0 0 3px #005FCC;
    pointer-events: none;
    z-index: 10;
  }

  .trial-card {
    width: 120px;
    height: 136px;
    border: 2px solid var(--sim-panel-border, #555);
    border-radius: 6px;
    background: #FFFDF2;
    box-sizing: border-box;
    position: relative;
    flex-shrink: 0;
    font-family: 'Roboto Condensed', sans-serif;
    font-weight: 400;
  }

  .trial-card-label {
    position: absolute;
    top: 4px;
    left: 4px;
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #333;
    background: var(--sim-trial-label-bg, #e0e0e0);
    width: 28px;
    height: 28px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .trial-card:focus {

    };
    body.innerHTML = aboutContent[activeSim] || aboutContent.bananas;

    body.setAttribute("tabindex", "0");
    body.setAttribute("role", "region");
    body.setAttribute("aria-label", "About content");
    const bodyWrap = document.createElement("div");
    bodyWrap.className = "info-modal-body-wrap";
    bodyWrap.appendChild(body);
    const bodyFocusRing = document.createElement("div");
    bodyFocusRing.className = "scroll-focus-ring";
    bodyWrap.appendChild(bodyFocusRing);
    modal.appendChild(header);
    modal.appendChild(bodyWrap);
    // Append to content-area (parent of title bar)
    const contentArea = bar.parentElement;
    if (contentArea) contentArea.appendChild(modal);

    // Dragging
    let dragX = 0, dragY = 0, modalX = 0, modalY = 0, dragging = false;
    header.addEventListener("mousedown", (e) => {
      if (e.target === closeBtn || closeBtn.contains(e.target)) return;
      dragging = true;
      dragX = e.clientX - modalX;
      dragY = e.clientY - modalY;
      e.preventDefault();
    });
    function onMouseMove(e) {
      if (!dragging) return;
      modalX = e.clientX - dragX;
      modalY = e.clientY - dragY;
      modal.style.transform = "translate(" + modalX + "px, " + modalY + "px)";
    }
    function onMouseUp() { dragging = false; }
    document.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", onMouseUp);

    // Keyboard dragging (Alt+Arrow)
    modal.addEventListener("keydown", (e) => {
      if (!e.altKey) return;
      const step = e.shiftKey ? 40 : 10;
      let dx = 0, dy = 0;
      if (e.key === "ArrowLeft") dx = -step;
      else if (e.key === "ArrowRight") dx = step;
      else if (e.key === "ArrowUp") dy = -step;
      else if (e.key === "ArrowDown") dy = step;
      else return;
      e.preventDefault();
      modalX += dx;
      modalY += dy;
      modal.style.transform = "translate(" + modalX + "px, " + modalY + "px)";
    });

    // Escape to close
    function onModalKeydown(e) {
      if (e.key === "Escape") closeModal();
    }
    document.addEventListener("keydown", onModalKeydown);

    if (!document.body.classList.contains("using-mouse")) {
      closeBtn.focus();
    }
  });

  right.appendChild(deseLogo);
  right.appendChild(ccLogo);
  right.appendChild(infoBtn);

  bar.appendChild(left);
  bar.appendChild(right);
  return bar;
}

function buildSimContent() {

    function buildFungusIconPath() {
      const p = new Path2D();

      p.lineTo(10.7797852, 12.7412109);
      p.lineTo(10.7797852, 17);
      p.lineTo(8.75634766, 17);
      p.lineTo(8.75634766, 6.97851562);
      p.closePath();
      return p;
    }

    function scrollItemIntoView(el, container) {
      const cs = getComputedStyle(container);
      const padTop = parseFloat(cs.paddingTop);
      const padBottom = parseFloat(cs.paddingBottom);
      const cRect = container.getBoundingClientRect();
      const eRect = el.getBoundingClientRect();
      if (eRect.top < cRect.top + padTop) {
        container.scrollBy({ top: eRect.top - cRect.top - padTop });
      } else if (eRect.bottom > cRect.bottom - padBottom) {
        container.scrollBy({ top: eRect.bottom - cRect.bottom + padBottom });

            html += '<span style="display:inline-flex;align-items:center;gap:2px;color:#333"><svg aria-hidden="true" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:20px;height:20px;flex-shrink:0;color:#1A3C8F"><path fill="currentColor" d="M12,2 C6.47,2 2,6.47 2,12 C2,17.53 6.47,22 12,22 C17.53,22 22,17.53 22,12 C22,6.47 17.53,2 12,2 Z M12,20 C7.59,20 4,16.41 4,12 C4,7.59 7.59,4 12,4 C16.41,4 20,7.59 20,12 C20,16.41 16.41,20 12,20 Z M15.6264648,6.97851562 L15.6264648,8.67382813 L10.7797852,8.67382813 L10.7797852,11.0458984 L14.9633789,11.0458984 L14.9633789,12.7412109 L10.7797852,12.7412109 L10.7797852,17 L8.75634766,17 L8.75634766,6.97851562 L15.6264648,6.97851562 Z" fill-rule="nonzero"/></svg>Fungus: C' + fCross + (fCross < MAX_CROSSES ? '+' : '') + '</span>';
          }

          // Enrich aria-label with trial state summary

          if (allPlants.length > 0) {

      // Simulation panel content
      if (p.name === "Simulation") {
