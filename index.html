<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MassSims</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700&family=Lato:wght@400;700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    background: #fff;
    color: #333;
    letter-spacing: 0.02em;
    padding: 20px;
  }

  /* Main layout: left buttons | viewport | right buttons */
  .main-layout {
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }

  /* Button columns */
  .btn-column {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 120px;
    padding-top: 24px;
  }

  .btn-column [role="group"] {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .btn-column-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: #767676;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .toggle-btn {
    font-family: 'Barlow Condensed', sans-serif;
    padding: 8px 14px;
    min-height: 44px;
    font-size: 16px;
    line-height: 20px;
    font-weight: 600;
    color: #555;
    background: #f0f0f0;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    white-space: nowrap;
  }

  .toggle-btn:hover {
    background: #e4e4e4;
    color: #333;
  }

  .toggle-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }

  .toggle-btn.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }

  /* Viewport display area */
  .viewport-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .viewport-info {
    font-size: 16px;
    color: #333;
    margin-bottom: 12px;
    text-align: center;
    min-height: 18px;
    position: relative;
    z-index: 1;
  }

  .viewport-info strong {
    color: #222;
  }

  /* Device frame */
  .device-frame {
    position: relative;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    box-sizing: content-box;
    border: 2px solid #333;
    transition: width 0.3s ease, height 0.3s ease;
  }

  .device-frame.no-limit {
    border-color: #ccc;
    border-style: dashed;
    background: transparent;
  }

  /* Browser / OS chrome bars */
  .chrome-top {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0 8px;
    position: relative;
  }

  .chrome-top::after {
    content: attr(data-label);
    font-size: 16px;
    color: #9a9a9a;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .chrome-dots {
    display: flex;
    gap: 4px;
    padding: 6px 0;
  }

  .chrome-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #444;
  }

  .chrome-address {
    background: #2a2a2a;
    border-radius: 3px;
    height: 12px;
    flex: 1;
    margin-left: 8px;
  }

  .chrome-bottom {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .chrome-bottom::after {
    content: attr(data-label);
    font-size: 16px;
    color: #767676;
  }

  .shelf-icon {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    background: #333;
  }

  /* Available viewport area */
  .viewport-area {
    background: #0592af;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
    flex: 1;
  }

  /* AP container — floated centered unit */
  .ap-container {
    background: transparent;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .ap-right-column {
    display: flex;
    flex-direction: column;
    width: 767px;
    box-sizing: content-box;
    border: 1px solid #979797;
    margin-right: 26px;
  }

  .ap-header {
    background: #047a99;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .ap-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .ap-body {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  /* Left column for 2-column layout */
  .ap-left-column {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-left: 28px;
    margin-right: 10px;
    transition: width 0.25s ease;
    overflow: hidden;
  }

  .ap-left-toggle {
    background: #3f3f3f;
    display: flex;
    align-items: center;
    position: relative;
    cursor: pointer;
  }

  .ap-left-toggle:hover {
    background: #4a4a4a;
  }

  .ap-left-toggle-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    position: absolute;
    left: 181px;
    white-space: nowrap;
  }

  .ap-left-toggle-icon {
    position: absolute;
    right: 20px;
    width: 32px;
    height: 32px;
  }

  .ap-left-toggle-icon-collapsed {
    width: 32px;
    height: 32px;
    margin-top: 5px;
    transform: scaleX(-1);
  }

  .ap-left-toggle-label-collapsed {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    margin-top: 12px;
    white-space: nowrap;
  }

  .ap-left-toggle:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }

  .ap-left-resources {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .ap-left-resources-header {
    background: #dfdfdf;
    height: 37px;
    padding-left: 20px;
    display: flex;
    align-items: center;
  }

  .ap-left-resources-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #333;
  }

  .ap-left-resources-body {
    flex: 1;
    background: #f4f4f4;
    padding: 25px 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
    overflow: auto;
  }

  .ap-left-resources-body p {
    margin: 0 0 16px 0;
  }

  .ap-left-resources-body p:last-child {
    margin-bottom: 0;
  }

  .ap-left-resources-body ul {
    margin: 0 0 16px 0;
    padding-left: 40px;
  }

  .ap-left-resources-body li {
    margin-bottom: 12px;
  }

  .ap-left-resources-body li:last-child {
    margin-bottom: 0;
  }


  /* Sim title bar */
  .sim-title-bar {
    height: 50px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px 0 20px;
    flex-shrink: 0;
  }

  .sim-title-left {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .sim-title-name {
    font-family: 'Lato', sans-serif;
    font-size: 24px;
    line-height: 28px;
    font-weight: 700;
    color: #333;
  }

  .sim-title-desc {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    color: #333;
  }

  .sim-title-right {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .sim-title-logo {
    display: block;
  }

  .sim-info-btn {
    margin-left: 5px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    font-weight: bold;
    padding: 3px 12px 3px 8px;
    height: 34px;
    box-sizing: border-box;
    border: 2px solid #555;
    border-radius: 6px;
    background: #fff;
    color: #333;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
  }

  .sim-info-btn::after {
    content: "";
    position: absolute;
    top: -7px;
    left: 0;
    right: 0;
    bottom: -7px;
  }

  .sim-info-btn img {
    width: 24px;
    height: 24px;
    pointer-events: none;
  }

  .sim-info-btn:hover,
  .sim-info-btn:focus-visible {
    background: #f0f0f0;
  }

  .sim-info-btn:active {
    background: #d0d0d0;
  }

  .sim-info-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }

  /* Info modal */
  .info-modal {
    position: absolute;
    top: 50px;
    right: 10px;
    width: 400px;
    max-height: 70%;
    background: #fff;
    border: 2px solid #555;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    z-index: 101;
    overflow: hidden;
  }

  .info-modal-header {
    display: flex;
    align-items: center;
    padding: 3px 3px 3px 12px;
    height: 52px;
    box-sizing: border-box;
    border-bottom: 1px solid #ccc;
    cursor: grab;
    flex-shrink: 0;
    user-select: none;
  }

  .info-modal-header:active {
    cursor: grabbing;
  }

  .info-modal-header-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    margin-right: 10px;
  }

  .info-modal-header-title {
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #333;
    flex: 1;
  }

  .info-modal-close {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    border-radius: 4px;
    padding: 0;
    flex-shrink: 0;
  }

  .info-modal-close:hover,
  .info-modal-close:focus-visible {
    background: #f0f0f0;
  }

  .info-modal-close:active {
    background: #d0d0d0;
  }

  .info-modal-close:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }

  .info-modal-close img {
    width: 24px;
    height: 24px;
  }

  .info-modal-body {
    padding: 16px 20px 20px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 22px;
    color: #333;
    user-select: text;
  }

  .info-modal-body-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .info-modal-body:focus-visible {
    outline: none;
  }

  .info-modal-body-wrap .scroll-focus-ring {
    border-radius: 0 0 6px 6px;
  }

  .info-modal-body:focus-visible ~ .scroll-focus-ring {
    display: block;
  }

  .info-modal-body h3 {
    font-size: 17px;
    font-weight: 700;
    margin: 16px 0 6px;
    color: #333;
  }

  .info-modal-body h3:first-child {
    margin-top: 0;
  }

  .info-modal-body p {
    margin: 0 0 12px;
  }

  .info-modal-body ul,
  .info-modal-body ol {
    margin: 0 0 12px;
    padding-left: 20px;
  }

  .info-modal-body li {
    margin-bottom: 4px;
  }

  /* Question containers below sim content */
  .question-row {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    padding: 0 27px;
    width: 100%;
    box-sizing: border-box;
  }

  .question-container {
    width: 517px;
    display: flex;
    flex-direction: column;
    border: 1px solid #979797;
    box-sizing: content-box;
  }

  .question-header {
    background: #047a99;
    height: 36px;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .question-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .question-body {
    background: #fff;
    flex: 1;
    min-height: 200px;
    padding: 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
  }

  .question-input {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 16px;
    height: 200px;
    margin-top: 10px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-style: italic;
    color: #767676;
    line-height: 1.5;
  }

  .content-area.standalone {
    border: 2px solid #555;
    border-radius: 10px;
    box-sizing: content-box;
    overflow: hidden;
  }

  /* Content area */
  .content-area {
    font-family: 'Lato', sans-serif;
    background: #fff;
    position: relative;
    flex-shrink: 0;
    transition: width 0.25s ease;
    display: flex;
    flex-direction: column;
    user-select: none;
  }

  .content-label {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    font-weight: 600;
    color: #707070;
    text-align: center;
    white-space: pre-line;
    pointer-events: none;
  }

  /* Sim content containers */
  .sim-content {
    display: flex;
    gap: 10px;
    padding: 0 10px 10px 10px;
    flex: 1;
    min-height: 0;
  }

  .sim-panel-tab {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 36px;
    padding: 0 10px;
    background: #e8e8e8;
    border: 2px solid #555;
    border-radius: 8px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    font-family: 'Lato', sans-serif;
    white-space: nowrap;
    z-index: 11;
  }

  .sim-panel-tab-label {
    font-size: 18px;
    line-height: 22px;
    font-weight: bold;
    color: #333;
  }

  .sim-panel-tab-subtitle {
    font-size: 16px;
    font-weight: 400;
    color: #333;
  }

  .sim-panel {
    border: 2px solid #555;
    border-radius: 8px;
    background: #e8e8e8;
    margin-top: 17px;
    box-sizing: border-box;
    flex: 1;
    position: relative;
  }

  .sim-panel.has-scroll {
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .trials-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 31px 0 12px 15px;
  }

  .trials-scroll:focus-visible {
    outline: none;
  }

  .trials-scroll:focus-visible ~ .scroll-focus-ring {
    display: block;
  }

  .scroll-focus-ring {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px #fff, inset 0 0 0 3px #005FCC;
    pointer-events: none;
    z-index: 10;
  }

  .trial-card {
    width: 120px;
    height: 136px;
    border: 2px solid #555;
    border-radius: 6px;
    background: #fff;
    box-sizing: border-box;
    position: relative;
    flex-shrink: 0;
    font-family: 'Roboto Condensed', sans-serif;
  }

  .trial-card-label {
    position: absolute;
    top: 4px;
    left: 4px;
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    font-weight: bold;
    color: #333;
    background: #e0e0e0;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .trial-card:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }

  .trial-card:hover,
  .trial-card:focus-visible {
    background: #f0f0f0;
  }

  .trial-card:active {
    background: #d0d0d0;
  }

  .trial-card.selected {
    background: #f0f0f0;
    border-color: #333;
    box-shadow: 0 0 0 1px #333;
  }

  .trial-card.new-card {
    border-style: dashed;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .trial-card-new-icon {
    width: 24px;
    height: 24px;
  }

  .trial-card.new-card:hover,
  .trial-card.new-card:focus-visible {
    background: #f0f0f0;
  }

  .trial-card.new-card:active {
    background: #d0d0d0;
  }

  .trial-card-new-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    font-weight: bold;
    color: #333;
    text-align: center;
  }

  .trial-card.selected .trial-card-label {
    color: #fff;
    background: #000;
  }

  .trial-card-reset {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 44px;
    height: 44px;
    background: transparent;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    padding: 0;
  }

  .trial-card-reset:focus-visible {
    outline: none;
  }

  .trial-card-reset:focus-visible::after {
    content: "";
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    outline: 2px solid #005FCC;
    outline-offset: 0px;
  }

  .trial-card-reset img {
    width: 28px;
    height: 28px;
    padding: 2px;
    border-radius: 4px;
    background: #fff;
    box-sizing: border-box;
  }

  .trial-card.selected .trial-card-reset {
    display: flex;
  }

  .trial-card-reset:hover:not([aria-disabled="true"]) img,
  .trial-card-reset:focus-visible:not([aria-disabled="true"]) img {
    background: #f0f0f0;
  }

  .trial-card-reset:active:not([aria-disabled="true"]) img {
    background: #d0d0d0;
  }

  .trial-card-reset[aria-disabled="true"] {
    cursor: default;
  }
  .trial-card-reset[aria-disabled="true"] img {
    opacity: 0.35;
  }

  .trial-card-stats {
    position: absolute;
    top: 38px;
    left: 4px;
    right: 4px;
    bottom: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 1px;
    font-size: 16px;
    color: #333;
    text-align: center;
    line-height: 1.3;
  }

  .sim-trial-indicator {
    position: absolute;
    top: 4px;
    left: 4px;
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    line-height: 22px;
    font-weight: bold;
    color: #fff;
    background: #000;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  /* Simulation panel sections */
  .sim-panel-inner {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-top: 29px;
  }

  .sim-parents {
    padding: 2px 10px 30px 10px;
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .sim-stats-wrap {
    position: relative;
    flex-shrink: 0;
    height: 0;
    display: flex;
    justify-content: center;
    z-index: 11;
  }

  .sim-stats {
    position: absolute;
    top: -18px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    color: #333;
    text-align: center;
    padding: 6px 15px;
    background: #fff;
    border: 2px solid #555;
    border-radius: 999px;
    white-space: nowrap;
  }

  .sim-parent-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
    min-width: 0;
  }

  .sim-parent-group.locked:first-child {
    align-items: flex-end;
  }

  .sim-parent-group.locked:last-child {
    align-items: flex-start;
  }

  .sim-dropdown.locked {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .sim-parent-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    font-weight: bold;
    color: #333;
  }

  .sim-dropdown {
    position: relative;
    display: inline-block;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
  }

  .sim-dropdown-trigger {
    display: flex;

  },

  },

    topLabel: "Chrome: 56px",
    bottomLabel: "Nav bar: 48px"
  }
};

const AP_WIDTH = 1100;
const AP_HEADER_H = 36;
const AP_CONTENT_H = 562;

const LAYOUTS = {
  standalone: { name: "Standalone", hasAP: false, contentWidth: null },
  "ap-full": { name: "AP Full Width", hasAP: true, contentWidth: 1044, sidebar: false },
  "ap-2col": { name: "AP 2-Column", hasAP: true, contentWidth: 833, sidebar: true, sidebarExpanded: true }
};

const SIMS = {
  bananas: {
    name: "Bananas",
    description: "An interactive genetics simulation"
  },
  collapse: {
    name: "Collapse!",
    description: "Short description of the sim"
  },
  noreaster: {
    name: "Nor\u2019easter Riley",
    description: "Short description of the sim"
  },
  tbd: {
    name: "TBD",
    description: "Short description of the sim"
  }
};

let activeSim = "bananas";
let activeDevice = "chromebook";
let activeLayout = "ap-full";
let sidebarExpanded = true;

const SCALE = 1;
function getScale() { return SCALE; }

function buildSimTitleBar() {
  const bar = document.createElement("div");
  bar.className = "sim-title-bar";

  const left = document.createElement("div");
  left.className = "sim-title-left";
  const name = document.createElement("span");
  name.className = "sim-title-name";
  name.textContent = SIMS[activeSim].name;
  const desc = document.createElement("span");
  desc.className = "sim-title-desc";
  desc.textContent = SIMS[activeSim].description;
  left.appendChild(name);
  left.appendChild(desc);

  const right = document.createElement("div");
  right.className = "sim-title-right";
  const deseLogo = document.createElement("img");
  deseLogo.src = "icons/DESE Logo.svg";
  deseLogo.alt = "DESE";
  deseLogo.className = "sim-title-logo";
  deseLogo.style.marginRight = "3px";
  const ccLogo = document.createElement("img");
  ccLogo.src = "icons/CC Logo.svg";
  ccLogo.alt = "Concord Consortium";
  ccLogo.className = "sim-title-logo";
  const infoBtn = document.createElement("button");
  infoBtn.className = "sim-info-btn";
  const infoBtnIcon = document.createElement("img");
  infoBtnIcon.src = "icons/Info ICON.svg";
  infoBtnIcon.alt = "";
  infoBtnIcon.setAttribute("aria-hidden", "true");
  infoBtn.appendChild(infoBtnIcon);
  infoBtn.appendChild(document.createTextNode("About"));
  infoBtn.addEventListener("click", () => {
    // Remove existing modal if any
    const existing = document.querySelector(".info-modal");
    if (existing) { existing.remove(); return; }

    // Create modal
    const modal = document.createElement("div");
    modal.className = "info-modal";
    modal.setAttribute("role", "dialog");
    modal.setAttribute("aria-label", "About the " + SIMS[activeSim].name + " Simulation");

    // Header
    const header = document.createElement("div");
    header.className = "info-modal-header";
    const hIcon = document.createElement("img");
    hIcon.className = "info-modal-header-icon";
    hIcon.src = "icons/Info ICON.svg";
    hIcon.alt = "";
    hIcon.setAttribute("aria-hidden", "true");
    const hTitle = document.createElement("div");
    hTitle.className = "info-modal-header-title";
    hTitle.textContent = "About the " + SIMS[activeSim].name + " Simulation";
    const closeBtn = document.createElement("button");
    closeBtn.className = "info-modal-close";
    closeBtn.setAttribute("aria-label", "Close");
    const closeIcon = document.createElement("img");
    closeIcon.src = "icons/Close ICON.svg";
    closeIcon.alt = "";
    closeIcon.setAttribute("aria-hidden", "true");
    closeIcon.style.width = "24px";
    closeIcon.style.height = "24px";
    closeBtn.appendChild(closeIcon);
    function closeModal() {
      modal.remove();
      document.removeEventListener("keydown", onEsc);
      infoBtn.focus();
    }
    closeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      closeModal();
    });
    header.appendChild(hIcon);
    header.appendChild(hTitle);
    header.appendChild(closeBtn);

    // Body
    const body = document.createElement("div");
    body.className = "info-modal-body";
    body.innerHTML =
      '<p>Cross wild banana plants with Cavendish banana plants, then observe what happens when a fungus is introduced.</p>' +
      '<h3>Overview</h3>' +
      '<p>Cavendish bananas are vulnerable to a fungus called Fusarium Tropical Race 4. In this simulation, you select parent banana plants, cross them to produce offspring, and then introduce the fungus to find out which offspring are resistant and which are not.</p>' +
      '<h3>About the Genetics</h3>' +
      '<p>The simulation uses one gene with two alleles: R (resistant to the fungus, dominant) and r (not resistant to the fungus, recessive). Offspring inherit one allele from each parent, producing expected Mendelian ratios with natural variation.</p>' +
      '<h3>How It Works</h3>' +
      '<p>Follow the guided investigation across up to ten independent trials (A\u2013J):</p>' +
      '<ol>' +
      '<li><strong>Select parents:</strong> Choose two parent banana plants from the dropdown menus. Parent selections are locked once the first cross is made. Reset the trial to choose different parents.</li>' +
      '<li><strong>Cross plants:</strong> Each cross produces 5\u201320 offspring. A maximum of 25 crosses (generations) are allowed per trial.</li>' +
      '<li><strong>Introduce fungus:</strong> Fungus can be introduced at any time, even before the first cross. Plants that are not resistant will wilt and turn brown.</li>' +
      '<li><strong>Continue crossing:</strong> Keep crossing after the fungus is introduced to observe how resistance changes across generations.</li>' +
      '<li><strong>Analyze data:</strong> Use the Data panel to compare healthy and infected plants across generations.</li>' +
      '</ol>' +
      '<h3>Keep in Mind</h3>' +
      '<ul>' +
      '<li><strong>Irreversible fungus:</strong> Once introduced, the fungus cannot be removed within a trial \u2014 just like in real life.</li>' +
      '<li><strong>Generation rows:</strong> Offspring are organized by generation (G1, G2, G3\u2026) in the grid, making it easy to compare with the data graphs.</li>' +
      '<li><strong>Dual markers:</strong> Notice that a blue dashed line appears in both the offspring grid and the line graph at the generation when fungus is introduced.</li>' +
      '</ul>';

    body.setAttribute("tabindex", "0");
    body.setAttribute("role", "region");
    body.setAttribute("aria-label", "About content");
    const bodyWrap = document.createElement("div");
    bodyWrap.className = "info-modal-body-wrap";
    bodyWrap.appendChild(body);
    const bodyFocusRing = document.createElement("div");
    bodyFocusRing.className = "scroll-focus-ring";
    bodyWrap.appendChild(bodyFocusRing);
    modal.appendChild(header);
    modal.appendChild(bodyWrap);
    // Append to content-area (parent of title bar)
    const contentArea = bar.parentElement;
    if (contentArea) contentArea.appendChild(modal);

    // Dragging
    let dragX = 0, dragY = 0, modalX = 0, modalY = 0, dragging = false;
    header.addEventListener("mousedown", (e) => {
      if (e.target === closeBtn || closeBtn.contains(e.target)) return;
      dragging = true;
      dragX = e.clientX - modalX;
      dragY = e.clientY - modalY;
      e.preventDefault();
    });
    document.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      modalX = e.clientX - dragX;
      modalY = e.clientY - dragY;
      modal.style.transform = "translate(" + modalX + "px, " + modalY + "px)";
    });
    document.addEventListener("mouseup", () => { dragging = false; });

    // Keyboard dragging (Alt+Arrow)
    modal.addEventListener("keydown", (e) => {
      if (!e.altKey) return;
      const step = e.shiftKey ? 40 : 10;
      let dx = 0, dy = 0;
      if (e.key === "ArrowLeft") dx = -step;
      else if (e.key === "ArrowRight") dx = step;
      else if (e.key === "ArrowUp") dy = -step;
      else if (e.key === "ArrowDown") dy = step;
      else return;
      e.preventDefault();
      modalX += dx;
      modalY += dy;
      modal.style.transform = "translate(" + modalX + "px, " + modalY + "px)";
    });

    // Escape to close
    function onEsc(e) {
      if (e.key === "Escape") closeModal();
    }
    document.addEventListener("keydown", onEsc);

    // Focus close button
    closeBtn.focus();
  });

  right.appendChild(deseLogo);
  right.appendChild(ccLogo);
  right.appendChild(infoBtn);

  bar.appendChild(left);
  bar.appendChild(right);
  return bar;
}

function buildSimContent() {

    const panels = [

      { name: "Data", width: 285, subtitle: null, bg: "#fff" }
    ];

    panels.forEach(p => {
      const panelWrap = document.createElement("div");
      panelWrap.style.width = p.width + "px";
      panelWrap.style.flexShrink = "0";
      panelWrap.style.position = "relative";

      // Panel body (full height)

            item.setAttribute("role", "option");
            item.setAttribute("aria-selected", "false");
            item.id = id + "-opt-" + i;

            item.addEventListener("click", (e) => {
              e.stopPropagation();
              selectItem(i);
            });
            items.push(item);
            list.appendChild(item);
          });
          dropdown.appendChild(list);

          function selectItem(i) {
            // Don't allow changes if trial is locked
            const trial = window._selectedTrial;
            if (window._trialState && window._trialState[trial] && window._trialState[trial].locked) {
              closeDropdown();
              return;
            }
            triggerText.textContent = parentOptions[i];
            triggerText.classList.remove("placeholder");
            items.forEach(it => {
              it.classList.remove("selected");
              it.setAttribute("aria-selected", "false");
            });
            items[i].classList.add("selected");
            items[i].setAttribute("aria-selected", "true");
            trigger.setAttribute("aria-activedescendant", items[i].id);
            closeDropdown();
            trigger.focus();
            // Update associated circle with banana tree
            if (circleEl) {
              circleEl.innerHTML = bananaTreeSVG;
              circleEl.style.color = parentColors[parentOptions[i]] || "#4CAF50";
            }
            // Update trial state
            if (window._trialState && trial) {
              const parentNum = label === "Parent 1" ? "p1" : "p2";
              window._trialState[trial][parentNum] = parentOptions[i];
              if (window._updateTrialCardLabel) window._updateTrialCardLabel(trial);
              if (window._updateSimButtons) window._updateSimButtons();
            }
          }

          // Expose a way to set this dropdown externally
          dropdown._setSelection = function(value) {
            if (value === null) {
              triggerText.textContent = "Select\u2026";
              triggerText.classList.add("placeholder");
              items.forEach(it => {
                it.classList.remove("selected");
                it.setAttribute("aria-selected", "false");
              });
              if (circleEl) {
                circleEl.innerHTML = "";
                circleEl.style.color = "";
              }
            } else {
              const idx = parentOptions.indexOf(value);
              if (idx >= 0) {
                triggerText.textContent = parentOptions[idx];
                triggerText.classList.remove("placeholder");
                items.forEach(it => {
                  it.classList.remove("selected");
                  it.setAttribute("aria-selected", "false");
                });
                items[idx].classList.add("selected");
                items[idx].setAttribute("aria-selected", "true");
                if (circleEl) {
                  circleEl.innerHTML = bananaTreeSVG;
                  circleEl.style.color = parentColors[parentOptions[idx]] || "#4CAF50";
                }
              }
            }
          };
          dropdown._parentLabel = label;
          dropdown._lock = function() {
            dropdown.classList.add("locked");
            group.classList.add("locked");
            trigger.removeAttribute("tabindex");
            trigger.removeAttribute("role");
            trigger.removeAttribute("aria-expanded");
            trigger.removeAttribute("aria-haspopup");
            trigger.removeAttribute("aria-controls");
            trigger.removeAttribute("aria-activedescendant");
            trigger.style.width = "";
            dropdown.insertBefore(lbl, trigger);
            var t = triggerText.textContent;
            if (t && t.match(/^Wild W/)) triggerText.textContent = t.replace("Wild W", "Wild Banana W");
          };
          dropdown._unlock = function() {
            dropdown.classList.remove("locked");
            group.classList.remove("locked");
            trigger.setAttribute("tabindex", "0");
            trigger.setAttribute("role", "combobox");
            trigger.setAttribute("aria-expanded", "false");
            trigger.setAttribute("aria-haspopup", "listbox");
            trigger.setAttribute("aria-controls", id + "-list");
            trigger.style.width = triggerW + "px";
            group.insertBefore(lbl, dropdown);
            var t = triggerText.textContent;
            if (t && t.match(/^Wild Banana W/)) triggerText.textContent = t.replace("Wild Banana W", "Wild W");
          };

          function openDropdown(fromKeyboard) {
            document.querySelectorAll(".sim-dropdown.open").forEach(d => {
              d.classList.remove("open");
              d.querySelector(".sim-dropdown-trigger").setAttribute("aria-expanded", "false");
            });
            dropdown.classList.add("open");
            trigger.setAttribute("aria-expanded", "true");

              focusedIndex = items.findIndex(it => it.classList.contains("selected"));

              updateFocus();
            } else {
              focusedIndex = -1;
              items.forEach(it => it.classList.remove("focused"));
            }
          }

          function closeDropdown() {
            dropdown.classList.remove("open");
            trigger.setAttribute("aria-expanded", "false");
            items.forEach(it => it.classList.remove("focused"));
            focusedIndex = -1;
          }

          function updateFocus() {
            items.forEach(it => it.classList.remove("focused"));
            if (focusedIndex >= 0 && focusedIndex < items.length) {
              items[focusedIndex].classList.add("focused");
              trigger.setAttribute("aria-activedescendant", items[focusedIndex].id);
              items[focusedIndex].scrollIntoView({ block: "nearest" });

          }

          trigger.addEventListener("click", (e) => {
            e.stopPropagation();
            if (dropdown.classList.contains("locked")) return;
            if (dropdown.classList.contains("open")) closeDropdown();
            else openDropdown();
          });

          trigger.addEventListener("keydown", (e) => {
            if (dropdown.classList.contains("locked")) return;
            const isOpen = dropdown.classList.contains("open");
            switch (e.key) {
              case "Enter":
              case " ":
                e.preventDefault();
                if (isOpen && focusedIndex >= 0) selectItem(focusedIndex);
                else openDropdown(true);
                break;
              case "ArrowDown":
                e.preventDefault();
                if (!isOpen) { openDropdown(true); break; }
                focusedIndex = (focusedIndex + 1) % items.length;
                updateFocus();
                break;
              case "ArrowUp":
                e.preventDefault();
                if (!isOpen) { openDropdown(true); break; }
                focusedIndex = (focusedIndex - 1 + items.length) % items.length;
                updateFocus();
                break;
              case "Home":
                e.preventDefault();
                if (isOpen) { focusedIndex = 0; updateFocus(); }
                break;
              case "End":
                e.preventDefault();
                if (isOpen) { focusedIndex = items.length - 1; updateFocus(); }
                break;
              case "Escape":
                e.preventDefault();
                closeDropdown();
                break;
              case "Tab":
                closeDropdown();
                break;
              default:
                // Type-ahead: jump to first item starting with typed letter
                if (isOpen && e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                  const ch = e.key.toLowerCase();
                  const idx = items.findIndex(it => it.textContent.toLowerCase().startsWith(ch));
                  if (idx >= 0) { focusedIndex = idx; updateFocus(); }
                }
                break;
            }
          });

          group.appendChild(dropdown);
          return group;
        }

        // Close dropdowns when clicking outside
        document.addEventListener("click", () => {
          document.querySelectorAll(".sim-dropdown.open").forEach(d => {

          });
        });

        // Left circle
        const circle1 = document.createElement("div");
        circle1.className = "sim-parent-circle";

        // Left dropdown
        parents.appendChild(buildParentGroup("Parent 1", circle1));

        parents.appendChild(circle1);

        // Cross symbol
        const cross = document.createElement("span");
        cross.className = "sim-cross-symbol";
        cross.textContent = "\u00d7";
        parents.appendChild(cross);

        // Right circle
        const circle2 = document.createElement("div");
        circle2.className = "sim-parent-circle";
        parents.appendChild(circle2);

        // Right dropdown
        const parent2Group = buildParentGroup("Parent 2", circle2);
        parents.appendChild(parent2Group);

        // Sync dropdowns when switching trials
        window._syncDropdownsToTrial = function(letter) {
          const st = window._trialState[letter];
          parents.querySelectorAll(".sim-dropdown").forEach(d => {
            if (d._parentLabel === "Parent 1") {
              d._setSelection(st.p1);
            } else if (d._parentLabel === "Parent 2") {
              d._setSelection(st.p2);
            }
            if (st.locked) d._lock(); else d._unlock();
          });
        };

        inner.appendChild(parents);

        // Stats label straddling the border between parents and offspring
        const statsWrap = document.createElement("div");

        statsLabel.setAttribute("aria-live", "polite");
        statsLabel.textContent = "Select two parents to begin";
        statsWrap.style.display = "none";
        statsWrap.appendChild(statsLabel);
        inner.appendChild(statsWrap);

        function updateStatsLabel() {
          const trial = window._selectedTrial;
          const st = window._trialState[trial];
          if (!st || !st.p1 || !st.p2) {
            statsWrap.style.display = "none";

          statsWrap.style.display = "";

          if (st.fungusAfterGen !== null) text += " \u00b7 Fungus active";

          statsLabel.textContent = text;

        const offspring = document.createElement("div");

        offspring.setAttribute("aria-label", "Offspring");

        // Render offspring for a given trial
        function updateGenRowTabindex() {

          if (st.fungusAfterGen === 0) {

            divider.className = "fungus-divider";
            const dlbl = document.createElement("span");
            dlbl.className = "fungus-divider-label";
            dlbl.textContent = "Fungus introduced before crossing";
            divider.appendChild(dlbl);
            offspring.appendChild(divider);

          st.generations.forEach((genPlants, gi) => {
            // Insert fungus divider after the generation it was introduced
            if (st.fungusAfterGen !== null && st.fungusAfterGen > 0 && gi === st.fungusAfterGen) {
              const divider = document.createElement("div");
              divider.className = "fungus-divider";
              const dlbl = document.createElement("span");
              dlbl.className = "fungus-divider-label";

            row.className = "gen-row";

            // Roving tabindex: only selected row (or first row) gets tabindex="0"
            const isSelected = window._selectedGen[trial] === gi;
            if (isSelected) row.classList.add("selected");
            row.setAttribute("tabindex", "-1");
            row.addEventListener("click", () => {
              if (window._selectedGen[trial] === gi) {
                window._selectedGen[trial] = null;
              } else {
                window._selectedGen[trial] = gi;
              }
              const rows = offspring.querySelectorAll(".gen-row");
              rows.forEach((r, ri) => {
                r.classList.toggle("selected", window._selectedGen[trial] === ri);
                r.setAttribute("aria-pressed", window._selectedGen[trial] === ri ? "true" : "false");
              });

              updateGenRowTabindex();
              if (window._updateDataPanel) window._updateDataPanel();

            row.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                row.click();
              } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                e.preventDefault();
                const rows = Array.from(offspring.querySelectorAll(".gen-row"));
                const cur = rows.indexOf(row);
                const next = e.key === "ArrowDown"
                  ? (cur + 1) % rows.length
                  : (cur - 1 + rows.length) % rows.length;
                rows[cur].setAttribute("tabindex", "-1");
                rows[next].setAttribute("tabindex", "0");
                rows[next].focus();
              } else if (e.key === "Home") {
                e.preventDefault();
                const rows = Array.from(offspring.querySelectorAll(".gen-row"));
                rows.forEach(r => r.setAttribute("tabindex", "-1"));
                rows[0].setAttribute("tabindex", "0");
                rows[0].focus();
              } else if (e.key === "End") {
                e.preventDefault();
                const rows = Array.from(offspring.querySelectorAll(".gen-row"));
                rows.forEach(r => r.setAttribute("tabindex", "-1"));
                rows[rows.length - 1].setAttribute("tabindex", "0");
                rows[rows.length - 1].focus();
              }
            });
            row.setAttribute("aria-pressed", isSelected ? "true" : "false");
            const lbl = document.createElement("div");
            lbl.className = "gen-label";
            lbl.innerHTML = "G" + (gi + 1) + "<br><span style='font-weight:400'>(" + genPlants.length + ")</span>";
            row.appendChild(lbl);
            const plantsWrap = document.createElement("div");
            plantsWrap.className = "gen-plants";
            genPlants.forEach(pl => {
              const cell = document.createElement("div");
              cell.className = "offspring-plant";
              cell.style.position = "relative";
              cell.innerHTML = bananaTreeSVG;
              if (pl.infected) {
                cell.classList.add("infected");
              }
              plantsWrap.appendChild(cell);
            });
            row.appendChild(plantsWrap);
            offspring.appendChild(row);
          });

          // Set initial roving tabindex
          updateGenRowTabindex();

          // Fungus divider at the end if introduced after last generation
          if (st.fungusAfterGen !== null && st.fungusAfterGen === st.generations.length && st.generations.length > 0) {
            const divider = document.createElement("div");
            divider.className = "fungus-divider";
            const dlbl = document.createElement("span");
            dlbl.className = "fungus-divider-label";
            dlbl.textContent = "Fungus introduced after G" + st.fungusAfterGen;
            divider.appendChild(dlbl);
            offspring.appendChild(divider);
          }

          offspring.scrollTop = offspring.scrollHeight;
          requestAnimationFrame(updateOffspringTabindex);

        window._renderOffspring = renderOffspring;

        // Bottom: Buttons
        const buttons = document.createElement("div");
        buttons.className = "sim-buttons";
        ["Cross Plants", "Introduce Fungus", "Reset Trial"].forEach(label => {
          const btn = document.createElement("button");
          btn.className = "sim-btn";
          const iconMap = {
            "Cross Plants": "icons/Cross ICON.svg",
            "Introduce Fungus": "icons/Add Fungus ICON.svg",
            "Reset Trial": "icons/Reset ICON.svg"
          };
          if (iconMap[label]) {
            const icon = document.createElement("img");
            icon.src = iconMap[label];
            icon.alt = "";
            icon.style.cssText = "height:24px;flex-shrink:0;";
            btn.style.cssText += "display:flex;align-items:center;gap:4px;";
            icon.setAttribute("aria-hidden", "true");
            btn.appendChild(icon);
            const span = document.createElement("span");
            span.className = "sim-btn-label";
            span.textContent = label;
            btn.appendChild(span);
          } else {
            btn.textContent = label;
          }
          if (label === "Cross Plants") {
            btn.setAttribute("aria-disabled", "true");
            window._crossBtn = btn;
            btn.addEventListener("click", () => {
              if (btn.getAttribute("aria-disabled") === "true") return;
              const trial = window._selectedTrial;
              const st = window._trialState[trial];
              if (st && st.p1 && st.p2 && st.generations.length < 25) {
                st.locked = true;
                // Lock dropdowns
                parents.querySelectorAll(".sim-dropdown").forEach(d => d._lock());
                const count = 5 + Math.floor(Math.random() * 16);
                const isFungusActive = st.fungusAfterGen !== null && st.generations.length >= st.fungusAfterGen;
                // Mendelian genetics: R = resistant (dominant), r = susceptible (recessive)
                const genotypes = {
                  "Wild W1": ["R", "R"],
                  "Wild W2": ["R", "r"],
                  "Wild W3": ["R", "r"],
                  "Cavendish C1": ["r", "r"],
                  "Cavendish C2": ["r", "r"]
                };
                const g1 = genotypes[st.p1];
                const g2 = genotypes[st.p2];
                const plants = [];
                for (let p = 0; p < count; p++) {
                  const a1 = g1[Math.floor(Math.random() * 2)];
                  const a2 = g2[Math.floor(Math.random() * 2)];
                  const isResistant = a1 === "R" || a2 === "R";
                  plants.push({ infected: isFungusActive && !isResistant });
                }
                st.generations.push(plants);
                if (window._updateTrialCardLabel) window._updateTrialCardLabel(trial);
                renderOffspring(trial);
                window._updateSimButtons();
              }
            });
          }
          if (label === "Introduce Fungus") {

            window._fungusBtn = btn;
            btn.addEventListener("click", () => {
              if (btn.getAttribute("aria-disabled") === "true") return;
              const trial = window._selectedTrial;
              const st = window._trialState[trial];
              if (st && st.fungusAfterGen === null) {
                st.fungusAfterGen = st.generations.length;
                renderOffspring(trial);
                window._updateSimButtons();
              }
            });
          }
          if (label === "Reset Trial") {
            btn.setAttribute("aria-disabled", "true");
            window._resetBtn = btn;
            btn.addEventListener("click", () => {
              if (btn.getAttribute("aria-disabled") === "true") return;
              const trial = window._selectedTrial;
              if (window._trialState[trial]) {
                window._trialState[trial] = { p1: null, p2: null, locked: false, generations: [], fungusAfterGen: null };
                if (window._updateTrialCardLabel) window._updateTrialCardLabel(trial);
                if (window._syncDropdownsToTrial) window._syncDropdownsToTrial(trial);
                renderOffspring(trial);
                window._updateSimButtons();
              }
            });
          }
          buttons.appendChild(btn);
        });
        inner.appendChild(buttons);

        // Update button disabled states based on current trial
        window._updateSimButtons = function() {
          const trial = window._selectedTrial;
          const st = window._trialState[trial];
          if (!st) return;
          // Cross Plants: enabled only when both parents selected
          if (window._crossBtn) window._crossBtn.setAttribute("aria-disabled", (!(st.p1 && st.p2) || st.generations.length >= 25) ? "true" : "false");

          if (window._resetBtn) window._resetBtn.setAttribute("aria-disabled", (!(st.p1 || st.p2 || st.generations.length > 0)) ? "true" : "false");
          // Update stats label and data panel
          updateStatsLabel();
          if (window._updateDataPanel) window._updateDataPanel();
        };

        panel.appendChild(inner);
      }

      // Data panel content
      if (p.name === "Data") {
        const dataInner = document.createElement("div");
        dataInner.className = "data-panel-inner";

        // --- Top half: Pie Chart ---
        const topHalf = document.createElement("div");
        topHalf.className = "data-half pie-chart";
        const pieTitle = document.createElement("div");
        pieTitle.className = "data-chart-title";
        pieTitle.innerHTML = "Offspring Phenotypes:<br>All Generations";
        topHalf.appendChild(pieTitle);
        const pieChartBody = document.createElement("div");
        pieChartBody.className = "data-chart-body";
        const dpr = window.devicePixelRatio || 1;
        const pieCanvas = document.createElement("canvas");
        pieCanvas.width = 160 * dpr;
        pieCanvas.height = 105 * dpr;
        pieCanvas.style.width = "160px";
        pieCanvas.style.height = "105px";
        pieCanvas.setAttribute("role", "img");
        pieCanvas.setAttribute("aria-label", "Pie chart showing offspring phenotype percentages");
        pieChartBody.appendChild(pieCanvas);
        topHalf.appendChild(pieChartBody);
        const pieLegend = document.createElement("div");
        pieLegend.className = "data-chart-legend";
        pieLegend.innerHTML =
          '<span class="data-legend-item">' +
            '<span class="data-legend-label"><span class="data-legend-swatch" style="background:#C2C2C2"></span>Healthy</span>' +
            '<span class="data-legend-pct" id="pie-pct-healthy">\u2013</span>' +
          '</span>' +
          '<span class="data-legend-item">' +
            '<span class="data-legend-label"><span class="data-legend-swatch" style="background:#444"></span>Infected</span>' +
            '<span class="data-legend-pct" id="pie-pct-infected">\u2013</span>' +
          '</span>';
        topHalf.appendChild(pieLegend);
        dataInner.appendChild(topHalf);

        // Divider
        const divider = document.createElement("div");
        divider.className = "data-divider";
        dataInner.appendChild(divider);

        // --- Bottom half: Line Graph ---
        const bottomHalf = document.createElement("div");
        bottomHalf.className = "data-half line-graph";
        const lineTitle = document.createElement("div");
        lineTitle.className = "data-chart-title";
        lineTitle.textContent = "Fungus Resistance over Generations";
        bottomHalf.appendChild(lineTitle);
        const lineChartBody = document.createElement("div");
        lineChartBody.className = "data-chart-body";
        const lineCanvas = document.createElement("canvas");
        lineCanvas.width = 260 * dpr;
        lineCanvas.height = 148 * dpr;
        lineCanvas.style.width = "260px";
        lineCanvas.style.height = "148px";
        lineCanvas.setAttribute("role", "img");
        lineCanvas.setAttribute("aria-label", "Line graph showing fungus resistance over generations");
        lineChartBody.appendChild(lineCanvas);
        bottomHalf.appendChild(lineChartBody);
        const lineLegend = document.createElement("div");
        lineLegend.className = "data-chart-legend";
        lineLegend.innerHTML =
          '<span class="data-legend-item" style="flex-direction:row;gap:6px"><svg width="38" height="13" style="flex-shrink:0" aria-hidden="true"><line x1="0" y1="6.5" x2="38" y2="6.5" stroke="#949494" stroke-width="2"/><circle cx="19" cy="6.5" r="5" fill="#949494"/></svg>Healthy</span>' +
          '<span class="data-legend-item" style="flex-direction:row;gap:6px"><svg width="38" height="13" style="flex-shrink:0" aria-hidden="true"><line x1="0" y1="6.5" x2="38" y2="6.5" stroke="#444" stroke-width="2" stroke-dasharray="2,4"/><circle cx="19" cy="6.5" r="5" fill="#444"/></svg>Infected</span>';
        bottomHalf.appendChild(lineLegend);
        dataInner.appendChild(bottomHalf);

        panel.appendChild(dataInner);

        // --- Data update function ---
        window._updateDataPanel = function() {
          const trial = window._selectedTrial;
          const st = window._trialState[trial];
          if (!st) return;
          const selGen = window._selectedGen ? window._selectedGen[trial] : null;

          // Compute stats
          let plants = [];
          if (selGen !== null && selGen !== undefined && st.generations[selGen]) {
            plants = st.generations[selGen];
            pieTitle.innerHTML = "Offspring Phenotypes:<br>G" + (selGen + 1);
          } else if (st.generations.length > 0) {
            plants = st.generations.flat();
            pieTitle.innerHTML = "Offspring Phenotypes:<br>All Generations";
          } else {
            pieTitle.innerHTML = "Offspring Phenotypes:<br>All Generations";
          }

          const total = plants.length;
          const infected = plants.filter(p => p.infected).length;
          const healthy = total - infected;

          // Update legend percentages
          const pctHealthyEl = document.getElementById("pie-pct-healthy");
          const pctInfectedEl = document.getElementById("pie-pct-infected");
          if (total === 0) {
            if (pctHealthyEl) pctHealthyEl.textContent = "\u2013";
            if (pctInfectedEl) pctInfectedEl.textContent = "\u2013";
          } else {
            const hPct = Math.round((healthy / total) * 100);
            const iPct = 100 - hPct;
            if (pctHealthyEl) pctHealthyEl.textContent = hPct + "%";
            if (pctInfectedEl) pctInfectedEl.textContent = iPct + "%";
          }

          // --- Draw Pie ---
          const pCtx = pieCanvas.getContext("2d");
          pCtx.setTransform(1, 0, 0, 1, 0, 0);
          pCtx.clearRect(0, 0, pieCanvas.width, pieCanvas.height);
          pCtx.scale(dpr, dpr);
          const pw = 160, ph = 105;
          const cx = pw / 2, cy = ph / 2, r = Math.min(pw, ph) / 2 - 10;

          if (total === 0) {
            // Gray empty pie with "No data" label
            pCtx.beginPath();
            pCtx.arc(cx, cy, r, 0, Math.PI * 2);
            pCtx.fillStyle = "#e0e3e7";
            pCtx.fill();
            pCtx.fillStyle = "#333";
            pCtx.font = "16px Lato, sans-serif";
            pCtx.textAlign = "center";
            pCtx.textBaseline = "middle";
            pCtx.fillText("No data", cx, cy);
          } else {
            const hPct = Math.round((healthy / total) * 100);
            const iPct = 100 - hPct;
            const slices = [];
            if (healthy > 0) slices.push({ pct: healthy / total, color: "#C2C2C2", labelColor: "#333", label: hPct + "%" });
            if (infected > 0) slices.push({ pct: infected / total, color: "#444", labelColor: "#fff", label: iPct + "%" });

            let startAngle = -Math.PI / 2;
            slices.forEach(s => {
              const sweep = s.pct * 2 * Math.PI;
              pCtx.beginPath();
              pCtx.moveTo(cx, cy);
              pCtx.arc(cx, cy, r, startAngle, startAngle + sweep);
              pCtx.closePath();
              pCtx.fillStyle = s.color;
              pCtx.fill();

              // Label on slice
              const mid = startAngle + sweep / 2;
              let lx, ly;
              if (s.pct >= 1) {
                lx = cx;
                ly = cy;
              } else if (s.pct > 0.25) {
                const d = r * 0.45;
                lx = cx + d * Math.cos(mid);
                ly = cy + d * Math.sin(mid);
              } else {
                const d = r * (2 / 3);
                lx = cx + d * Math.cos(mid);
                ly = cy + d * Math.sin(mid);
              }
              if (s.pct > 0.08) {
                pCtx.fillStyle = s.labelColor;
                pCtx.font = "bold 16px Lato, sans-serif";
                pCtx.textAlign = "center";
                pCtx.textBaseline = "middle";
                pCtx.fillText(s.label, lx, ly);
              }
              startAngle += sweep;
            });
          }

          // --- Draw Line Graph ---
          const lCtx = lineCanvas.getContext("2d");
          lCtx.setTransform(1, 0, 0, 1, 0, 0);
          lCtx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
          lCtx.scale(dpr, dpr);
          const lw = 260, lh = 148;

          const margin = { top: 22, right: 20, bottom: 32, left: 44 };
          const gw = lw - margin.left - margin.right;
          const gh = lh - margin.top - margin.bottom;

          // Y-axis gridlines & labels (always visible)
          lCtx.strokeStyle = "#e0e0e0";
          lCtx.lineWidth = 1;
          lCtx.fillStyle = "#333";
          lCtx.font = "16px 'Roboto Condensed', sans-serif";
          lCtx.textAlign = "right";
          lCtx.textBaseline = "middle";
          for (let i = 0; i <= 4; i++) {
            const y = margin.top + gh - (i / 4) * gh;
            lCtx.beginPath();
            lCtx.moveTo(margin.left, y);
            lCtx.lineTo(margin.left + gw, y);
            lCtx.stroke();
            lCtx.fillText((i * 25) + "%", margin.left - 9, y);
          }

          const gens = st.generations;
          if (gens.length === 0) {
            lCtx.fillStyle = "#333";
            lCtx.font = "16px Lato, sans-serif";
            lCtx.textAlign = "center";
            lCtx.textBaseline = "middle";
            lCtx.fillText("No data", margin.left + gw / 2, margin.top + gh / 2);
            return;
          }

          // X-axis labels
          lCtx.textAlign = "center";
          lCtx.textBaseline = "top";
          const xStep = gens.length > 1 ? gw / (gens.length - 1) : 0;

          // Show every Nth label to avoid overlap
          lCtx.font = "16px 'Roboto Condensed', sans-serif";
          const labelW = lCtx.measureText("G00").width + 4;
          const maxLabels = Math.max(1, Math.floor(gw / labelW));
          const labelStep = Math.ceil(gens.length / maxLabels);
          gens.forEach((_, gi) => {
            if (gi % labelStep !== 0 && gi !== gens.length - 1) return;
            const x = margin.left + (gens.length > 1 ? gi * xStep : gw / 2);
            lCtx.fillStyle = "#333";
            lCtx.fillText("G" + (gi + 1), x, margin.top + gh + 11);
          });

          // Compute healthy % per generation
          const healthyPcts = gens.map(g => {
            const t = g.length;
            const inf = g.filter(p => p.infected).length;
            return t > 0 ? ((t - inf) / t) * 100 : 100;
          });
          const infectedPcts = healthyPcts.map(h => 100 - h);

          // Fungus introduction marker
          if (st.fungusAfterGen !== null) {
            const fgi = st.fungusAfterGen;
            let fx;
            if (fgi === 0) {
              fx = margin.left;
            } else if (fgi >= gens.length) {
              fx = margin.left + gw;
            } else {
              fx = margin.left + (gens.length > 1 ? (fgi - 0.5) * xStep : gw / 2);
            }
            lCtx.strokeStyle = "#1565C0";
            lCtx.lineWidth = 2;
            lCtx.setLineDash([6, 4]);
            lCtx.beginPath();
            lCtx.moveTo(fx, margin.top);
            lCtx.lineTo(fx, margin.top + gh);
            lCtx.stroke();
            lCtx.setLineDash([]);

            // Flag label
            lCtx.font = "bold 14px 'Roboto Condensed', sans-serif";
            const flagText = "Fungus";
            const tw = lCtx.measureText(flagText).width;
            const flagH = 20, flagPad = 4;
            const flagW = tw + flagPad * 2;
            const flagX = fx;
            const flagY = margin.top - flagH;
            lCtx.fillStyle = "#1565C0";
            lCtx.beginPath();
            lCtx.moveTo(flagX, flagY);
            lCtx.lineTo(flagX + flagW, flagY);
            lCtx.lineTo(flagX + flagW, flagY + flagH);
            lCtx.lineTo(flagX, flagY + flagH);
            lCtx.closePath();
            lCtx.fill();
            lCtx.fillStyle = "#fff";
            lCtx.textAlign = "left";
            lCtx.textBaseline = "middle";
            lCtx.fillText(flagText, flagX + flagPad, flagY + flagH / 2);
          }

          function drawLine(data, color, dashed, marker) {
            lCtx.strokeStyle = color;
            lCtx.lineWidth = 2;
            lCtx.setLineDash(dashed ? [2, 4] : []);
            lCtx.beginPath();
            data.forEach((val, i) => {
              const x = margin.left + (gens.length > 1 ? i * xStep : gw / 2);
              const y = margin.top + gh - (val / 100) * gh;
              if (i === 0) lCtx.moveTo(x, y);
              else lCtx.lineTo(x, y);
            });
            lCtx.stroke();
            lCtx.setLineDash([]);

            // Markers
            data.forEach((val, i) => {
              const x = margin.left + (gens.length > 1 ? i * xStep : gw / 2);
              const y = margin.top + gh - (val / 100) * gh;
              const s = selGen === i ? 7 : 5;
              lCtx.fillStyle = color;
              if (marker === "triangle") {
                lCtx.beginPath();
                lCtx.moveTo(x, y - s);
                lCtx.lineTo(x + s, y + s);
                lCtx.lineTo(x - s, y + s);
                lCtx.closePath();
                lCtx.fill();
              } else {
                lCtx.beginPath();
                lCtx.arc(x, y, s, 0, Math.PI * 2);
                lCtx.fill();
              }
            });
          }

          drawLine(healthyPcts, "#949494", false, "circle");
          drawLine(infectedPcts, "#444", true, "circle");

          // Highlight selected generation
          if (selGen !== null && selGen !== undefined && selGen < gens.length) {
            const x = margin.left + (gens.length > 1 ? selGen * xStep : gw / 2);
            lCtx.fillStyle = "rgba(91, 155, 213, 0.15)";
            const bandW = gens.length > 1 ? Math.max(xStep * 0.6, 12) : 24;
            lCtx.fillRect(x - bandW / 2, margin.top, bandW, gh);
          }

          // Dynamic aria-labels for charts
          if (total === 0) {
            pieCanvas.setAttribute("aria-label", "Pie chart: no data");
            lineCanvas.setAttribute("aria-label", "Line graph: no data");
          } else {
            const hPctLabel = Math.round((healthy / total) * 100);
            const iPctLabel = 100 - hPctLabel;
            const genLabel = (selGen !== null && selGen !== undefined) ? "generation " + (selGen + 1) : "all generations";
            pieCanvas.setAttribute("aria-label", "Pie chart showing offspring phenotypes for " + genLabel + ": " + hPctLabel + "% healthy, " + iPctLabel + "% infected");
            const lastHealthy = Math.round(healthyPcts[healthyPcts.length - 1]);
            const lastInfected = 100 - lastHealthy;
            lineCanvas.setAttribute("aria-label", "Line graph showing fungus resistance over " + gens.length + " generation" + (gens.length > 1 ? "s" : "") + ". Latest: " + lastHealthy + "% healthy, " + lastInfected + "% infected");
          }
        };
      }

      panelWrap.appendChild(panel);

      // Title tab (overlays top of panel)
      const tab = document.createElement("div");
      tab.className = "sim-panel-tab";
      const tabLabel = document.createElement("span");
      tabLabel.className = "sim-panel-tab-label";
      tabLabel.textContent = p.name;
      tab.appendChild(tabLabel);
      if (p.subtitle) {
        const pipe = document.createElement("span");
        pipe.style.margin = "0 6px";
        pipe.style.fontSize = "16px";
        pipe.style.fontWeight = "400";
        pipe.style.color = "#333";
        pipe.textContent = "\u2022";
        tab.appendChild(pipe);
        const tabSub = document.createElement("span");
        tabSub.className = "sim-panel-tab-subtitle";
        tabSub.textContent = p.subtitle;
        tab.appendChild(tabSub);
      }
      panelWrap.appendChild(tab);

      wrap.appendChild(panelWrap);
    });

    // Initial data panel render
    if (window._updateDataPanel) window._updateDataPanel();
    document.fonts.ready.then(() => { if (window._updateDataPanel) window._updateDataPanel(); });

    // Ctrl+Arrow: navigate between panels
    const panelEls = wrap.querySelectorAll('.sim-panel[role="region"]');
    document.addEventListener("keydown", (e) => {
      if (!e.ctrlKey || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
      e.preventDefault();
      const panelArr = Array.from(panelEls);
      const active = document.activeElement;
      let curIdx = -1;
      panelArr.forEach((p, i) => { if (p.contains(active)) curIdx = i; });
      const dir = e.key === "ArrowRight" ? 1 : -1;
      // Move in direction, skip panels with no focusable elements
      for (let i = 1; i <= panelArr.length; i++) {
        const nextIdx = (curIdx + dir * i + panelArr.length * panelArr.length) % panelArr.length;
        const focusable = nextIdx === curIdx ? null : panelArr[nextIdx].querySelectorAll('[tabindex="0"], button:not([tabindex="-1"]), a, input, select, textarea');
        if (focusable && focusable.length > 0) {
          focusable[0].focus();
          break;
        }
      }
    });

    return wrap;
  }
  return null;
}

  const isNoLimit = activeDevice === "none";

  let contentW;

  } else if (isNoLimit) {

    frame.style.height = (frameH * scale) + "px";
  } else {
    frame.style.width = (device.screenW * scale) + "px";

  // Top chrome

    top.style.height = (device.topChrome * scale) + "px";
    top.setAttribute("data-label", device.topLabel);

    frame.appendChild(top);
  }

  // Viewport area

  viewport.style.alignItems = "flex-start";
  if (isNoLimit && layout.hasAP) {

  } else {

  }

  if (layout.hasAP) {

    const page = document.createElement("div");

    page.style.minHeight = (isNoLimit ? "100%" : (availH * scale) + "px");
    page.style.background = "#fff";
    page.style.display = "flex";

      ap.appendChild(apBody);

    document.body.style.background = "#e0e0e0";

    const topOffset = container.getBoundingClientRect().top;
    const verticalPad = Math.max(0, (window.innerHeight - topOffset - standaloneH) / 2);
    container.style.paddingTop = verticalPad + "px";

    const content = document.createElement("div");
    content.className = "content-area standalone";
    content.style.width = (standaloneW * scale) + "px";
    content.style.height = (standaloneH * scale) + "px";
    content.style.margin = "0 auto";
    content.appendChild(buildSimTitleBar());

    const cLabel = document.createElement("div");
    cLabel.className = "content-label";
    cLabel.textContent = `Content\n${standaloneW} x ${standaloneH}`;
    content.appendChild(cLabel);

    container.appendChild(content);
    return;
  } else {
    // Standalone with device frame
    const standaloneW = 1024;
    const standaloneH = 562;
    const content = document.createElement("div");
    content.className = "content-area standalone";
    content.style.width = (standaloneW * scale) + "px";
    content.style.height = (standaloneH * scale) + "px";
    content.appendChild(buildSimTitleBar());

    const cLabel = document.createElement("div");
    cLabel.className = "content-label";
    cLabel.textContent = `Content\n${standaloneW} x ${standaloneH}`;
    content.appendChild(cLabel);

    viewport.style.display = "flex";
    viewport.style.justifyContent = "center";
    viewport.style.alignItems = "center";
    viewport.style.background = "#e0e0e0";
    viewport.appendChild(content);
  }

  frame.appendChild(viewport);

  // Bottom chrome
  if (!isNoLimit && device.bottomChrome > 0) {
    const bottom = document.createElement("div");
    bottom.className = "chrome-bottom";
    bottom.style.height = (device.bottomChrome * scale) + "px";
    bottom.setAttribute("data-label", device.bottomLabel);

    frame.appendChild(bottom);
  }

  container.appendChild(frame);
}

// Button wiring
function wireToggleGroup(selector, stateKey, callback) {
  document.querySelectorAll(selector).forEach(btn => {
    btn.addEventListener("click", () => {
      if (callback) callback(btn);
      document.querySelectorAll(selector).forEach(b => {
        b.classList.remove("active");
        b.setAttribute("aria-pressed", "false");
      });
      btn.classList.add("active");
      btn.setAttribute("aria-pressed", "true");
      buildViewport();
    });
  });
}

wireToggleGroup("[data-sim]", "activeSim", btn => { activeSim = btn.dataset.sim; });
wireToggleGroup("[data-layout]", "activeLayout", btn => {
  activeLayout = btn.dataset.layout;
  if (activeLayout === "ap-2col") sidebarExpanded = true;
});
wireToggleGroup("[data-device]", "activeDevice", btn => { activeDevice = btn.dataset.device; });

buildViewport();
</script>
