        let running = 0;
        const flyFrom = opened + TO_FLY;
        // They travel in order of value, not in the order they appear in the
        // sentence: most negative first, most positive last. The total then falls
        // to its lowest point and climbs back, so the two directions are separated
        // in time instead of cancelling each other out at random. Identical words
        // carry identical values, so repeats naturally arrive together.
        const order = toks.slice().sort(function (x, y) {
          return D.vocabulary[x.textContent][1] - D.vocabulary[y.textContent][1];
        });
        order.forEach(function (el, i) {
          const v = D.vocabulary[el.textContent][1];
          const add = i === 0 ? v + D.baseValues[p] : v;
          later(function () { flyOne(el, cell, v, true); }, flyFrom + i * gap);
          later(function () {
            running += add;
            showRunning(cell, running);
          }, flyFrom + i * gap + FLY * FLY_LAND);
        });
        // Ten of the 800 conversations leave some pathway with no words it knows.
        // Nothing to fold the base into, so the cell lands on its answer directly.
        if (n === 0) {
          later(function () { showRunning(cell, it.act[p]); }, flyFrom);
        }

        // land on the stored activation, not the accumulated float, so the cell
        // agrees to the last digit with every other number on screen
        later(function () {
          cell.querySelector(".nnm-num").textContent = fmt(it.act[p], 4);
          sizeSym(cell, it.act[p], SYM_SCALE, ACT_SCALE);
          paint(cell, it.act[p], ACT_SCALE);
        }, flyFrom + n * gap + FLY + 40);

        t = flyFrom + n * gap + FLY + TAIL;
        later(function () { name.classList.remove("reading"); }, t);
      }
      later(function () { wordAnim = false; }, t);
    }

    const WGT_MIN = 46;      // narrowest a weighted box gets, still fits its number

    // Weighted boxes are sized against the largest weighted value in THIS
    // conversation, so the row shows how much of this decision each pathway is
    // responsible for. On most conversations Pathway 1 fills its slot and the other two
    // are slivers — which is the point, and is what the stacked bar used to say.
    function weightedWidth(w, maxAbs, full) {
      if (!maxAbs) return full;
      return WGT_MIN + (full - WGT_MIN) * Math.min(1, Math.abs(w) / maxAbs);
    }

    // The Weigh step carries a copy of the activation square across the row: it
    // slides onto the importance box, is resized and — when importance is
    // negative — turned over, and then travels on to become the weighted
    // activation. The turn is the point. Multiplying by a negative flips the
    // sign, and a square that physically rotates and comes back the other colour
    // says that in a way "x -1.75" does not. In this data Pathway 3's importance
    // is the negative one, so it always flips and the other two never do; across
    // conversations that gives all four sign combinations.
    // The middle of the journey is two separate beats, not one. Resizing and
    // turning over at the same time made both hard to read — the square was
    // changing shape while it was edge-on. Now it settles at its new size, and
    // only then turns. Each beat gets its own cue: the corner arrows belong to
    // the resize, the arc to the turn.
    const CARRY_A = 400;      // activation square -> importance box
    const CARRY_SCALE = 620;  // resize, on every row
    const CARRY_FLIP = 780;   // turn over, only where importance is negative
    const CARRY_C = 400;      // -> weighted activation
    const CARRY_GAP = 200;    // before the next pathway sets off
    // The importance value takes its ink over the last stretch of the approach,
    // so it has finished changing BY THE TIME the square lands rather than
    // starting to change once everything has stopped. Must match the colour
    // transition on .nnm-cell.imp .nnm-num.
    const IMP_INK = 200;
    // The last leg's SETTLE easing gets there at HALF its duration: measured on
    // cubic-bezier(.34,1.26,.52,1), progress crosses 1.0 at t=0.503, then spends
    // the remaining 200ms overshooting 2% and settling back. That crossing is the
    // arrival the eye reads and the box's own bounce, so the weighted value
    // appears and takes its kick THERE, not when the animation formally ends.
    //
    // It is also when the white stand-in under Weighted Activation goes, because
    // the two are the same event: .nnm-sq is not replaced, apply() takes .empty
    // off it and it becomes the real square. The travelling square's centre is
    // over the stand-in's centre at that instant (0.503 of 400ms = 201ms), which
    // is where this 200 puts it. Do not add a second timer to hide the stand-in
    // — it would land a millisecond after apply() and hide the real value.
    const WGT_LEAD = 200;

    // Rows that flip take longer than rows that do not, which is right: the turn
    // is the thing worth waiting for, and a row that held still to pad the timing
    // out would read as stalled.
    function carryTotal(p) {
      return CARRY_A + CARRY_SCALE + (IMP[p] < 0 ? CARRY_FLIP : 0) + CARRY_C;
    }

    // Only the rows whose importance is negative get this. It sits to the RIGHT of
    // the importance box and traces the path the square's top edge takes: up, over
    // the top, and down the far side — which is what a turn about the horizontal
    // axis looks like from the side. Same line weight, cap and grey as the corner
    // cues, so the three read as one family of instructions rather than three
    // separate decorations. Drawn rather than shown, in step with the turn.
    function flipCue(box, dur) {
      const W = 28, H = 28;
      // Above the box, centred. Now that the square turns about its vertical axis
      // the cue is a plan view of that turn — a wide flat loop, left edge going
      // back and round to the right — so it has to sit over the box rather than
      // beside it. Above rather than below: below is where the row's number sits,
      // 35px away, while above there is a clear 45px to the row before.
      const anc = flyAnchor(box.left + box.width / 2, box.top, "flow");
      const el = document.createElement("div");
      el.className = "nnm-flipcue";
      el.style.width = W + "px";
      el.style.height = H + "px";
      el.style.marginLeft = "-14px";
      // 7px of air under the lowest ink — the head's outer arm at y=21.5, not the
      // foot of the viewBox.
      el.style.marginTop = "-29px";
      // A flat loop seen from above: 270 degrees of a wide, shallow ellipse, open
      // at the left, running out along the top, round the far end and back along
      // the bottom to a head pointing left — the path the square's near face takes
      // when it turns about its vertical axis and comes back facing the other way.
      // Going well past 180 is what makes it read as a turn; a half circle stops
      // while it is still ambiguous with an arch.
      // Drawn as the resize cues are, so the two cues on this box are one family:
      // same 1.7-ish stroke, same round caps, same open chevron of arm 3.3 and
      // half-width 2.9, rather than a solid head.
      el.innerHTML =
        '<svg viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true" fill="none" ' +
          'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" ' +
          'stroke-linejoin="round">' +
          '<path class="arc" d="M4.5 10.2 A11 5.5 0 1 1 8.5 17.8"/>' +
          '<path class="head" d="M12.5 15.9 L8.5 17.8 L10.9 21.5"/>' +
        '</svg>';
      anc.appendChild(el);

      const arc = el.querySelector(".arc");
      const len = arc.getTotalLength ? arc.getTotalLength() : W + H;
      arc.setAttribute("stroke-dasharray", len);
      arc.setAttribute("stroke-dashoffset", len);
      playAnim(arc, [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
        { duration: dur * 0.6, easing: "cubic-bezier(.3,0,.35,1)", fill: "forwards" });
      playAnim(el.querySelector(".head"), 
        [{ opacity: 0 }, { opacity: 0, offset: 0.52 }, { opacity: 1, offset: 0.72 },
         { opacity: 1 }],
        { duration: dur, fill: "forwards" });
      playAnim(el, [{ opacity: 1 }, { opacity: 1, offset: 0.82 }, { opacity: 0 }],
        { duration: dur + 160, fill: "forwards" });
      later(function () { dropAnchor(anc); }, dur + 200);
    }

    // grow: arrows sit close in and push out. shrink: they start wide and close in.
    function resizeCue(box, scale, dur) {
      // Only skip a change too small to see. At 4% this also swallowed Pathway 3
      // on 75 of the 800 conversations — its scale runs 1.01 to 1.17 — and a row
      // that flips but shows no arrows reads as broken.
      if (Math.abs(scale - 1) < 0.015) return;
      const grow = scale > 1;
      const cx = box.left + box.width / 2, cy = box.top + box.height / 2;
      const half = Math.max(box.width, box.height) / 2;
      const near = half + 7, far = half + 7 + Math.min(16, 6 + Math.abs(scale - 1) * 7);
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(function (q) {
        const a = document.createElement("div");
        a.className = "nnm-cue";
        // The glyph points away from the centre; a shrinking cue is turned around.
        const rot = Math.atan2(q[1], q[0]) * 180 / Math.PI + (grow ? 0 : 180);
        a.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true">' +
          '<path d="M1.5 6 H8.5 M5.6 3.1 L8.9 6 L5.6 8.9" fill="none" ' +
          'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" ' +
          'stroke-linejoin="round"/></svg>';
        const anc = flyAnchor(cx, cy, "flow");
        anc.appendChild(a);
        const d0 = grow ? near : far, d1 = grow ? far : near;
        const at = function (d) {
          return "translate(-50%,-50%) translate(" + (q[0] * d * 0.72).toFixed(1) + "px," +
            (q[1] * d * 0.72).toFixed(1) + "px) rotate(" + rot.toFixed(1) + "deg)";
        };
        playAnim(a, 
          [{ transform: at(d0), opacity: 0 },
           { transform: at(d0 + (d1 - d0) * 0.25), opacity: 1, offset: 0.3 },
           { transform: at(d1), opacity: 1, offset: 0.78 },
           { transform: at(d1), opacity: 0 }],
          { duration: dur, easing: "cubic-bezier(.35,0,.3,1)", fill: "forwards" });
        later(function () { dropAnchor(anc); }, dur + 60);
      });
    }

    function carry(p, wv, av) {
      const row = rows[p];
      const from = row.querySelector(".act .nnm-sq");
      const via = row.querySelector(".imp .nnm-sq");
      const to = row.querySelector(".wgt .nnm-sq");
      if (!from || !via || !to) return;
      const a = from.getBoundingClientRect();
      const i = via.getBoundingClientRect();
      const w = to.getBoundingClientRect();
      if (a.width < 1) return;

      // Where it is going and how big it will be when it gets there. The target
      // square is still the empty stand-in, so its size is computed, not measured.
      const endSide = SYM_MIN + (SYM_MAX - SYM_MIN) *
        Math.sqrt(Math.min(1, Math.abs(wv) / SYM_SCALE));
      const flips = (IMP[p] < 0);
      // Both the starting size and colour are computed from the activation, never
      // read off the screen. Weigh can be pressed before Activate, in which case
      // the square underneath is still the empty stand-in — and even when it has
      // been filled, its 0.35s transition means getComputedStyle hands back the
      // value it is transitioning FROM, which is white.
      const startSide = SYM_MIN + (SYM_MAX - SYM_MIN) *
        Math.sqrt(Math.min(1, Math.abs(av) / SYM_SCALE));
      const startBg = av === 0 ? "#FFFFFF"
        : (av > 0 ? FILL_POS : FILL_NEG)[level(Math.min(1, Math.abs(av) / ACT_SCALE))];
      const endBg = wv === 0 ? "#FFFFFF"
        : (wv > 0 ? FILL_POS : FILL_NEG)[level(Math.min(1, Math.abs(wv) / SUM_SCALE))];

      const c = document.createElement("div");
      c.className = "nnm-carry";
      // Anchored on the square's CENTRE, and the element centres itself on that
      // point with translate(-50%,-50%). Growing then keeps the centre still,
      // which is what scale() used to do for free.
      const anc = flyAnchor(a.left + a.width / 2, a.top + a.height / 2, "flow");
      c.style.width = startSide + "px";
      c.style.height = startSide + "px";
      c.style.background = startBg;
      anc.appendChild(c);

      const cx = a.left + a.width / 2, cy = a.top + a.height / 2;
      const dxI = (i.left + i.width / 2) - cx, dyI = (i.top + i.height / 2) - cy;
      const dxW = (w.left + w.width / 2) - cx, dyW = (w.top + w.height / 2) - cy;
      const sc = endSide / startSide;
      // The square resizes by animating its WIDTH AND HEIGHT, not by scale(). A
      // transform scale multiplies everything it touches — at Pathway 1's 3.3x the
      // 1px outline renders over 3px thick and the 3px corner radius near 10px, so
      // the travelling square stopped matching the ones it comes from and lands on.
      //
      // perspective() AFTER the translate, not before it. Transform functions apply
      // right to left, so leading with perspective applies it in the parent's space
      // with the square already carried far from the perspective origin — the turn
      // comes out skewed rather than foreshortening about the square's own centre.
      //
      // rotateY, about the vertical axis. Sign lives on a horizontal axis
      // everywhere else here — the contribution ramp runs negative-blue on the left
      // to positive-orange on the right, and every square's colour is read against
      // it — so a change of sign IS a traverse of that axis, and the box turning
      // around to face the other end of the ramp rehearses the journey its new
      // colour then confirms.
      // This was rotateX, on the argument that a turn about the vertical axis runs
      // parallel to the square's travel and is absorbed into it. That only holds if
      // the two happen at once, and they do not: the square is stationary on the
      // importance box for the whole of this beat, between the move in and the move
      // out. What is left is that the eye is primed for rightward motion, which the
      // dedicated beat and the cue arrow answer.
      function tf(dx, dy, deg) {
        return "translate(-50%,-50%) translate(" + dx.toFixed(1) + "px," +
          dy.toFixed(1) + "px) perspective(520px) rotateY(" + deg + "deg)";
      }
      const px = function (v) { return v.toFixed(1) + "px"; };
      const endPx = px(endSide), startPx = px(startSide);

      // Three legs, each starting where the last one finished. Scheduled on the
      // interactive's own timers rather than chained on onfinish: a cancelled
      // animation never fires onfinish, so a chain built that way strands the
      // clone on screen the moment the step is interrupted. later() is cleared by
      // cancelAnim along with everything else.
      const end = flips ? 180 : 0;
      // Arrivals settle rather than stop dead. The overshoot is the same 1.3 the
      // cells' own pop uses, so the whole interactive moves with one weight.
      const SETTLE = "cubic-bezier(.34,1.26,.52,1)";
      playAnim(c, [{ transform: tf(0, 0, 0) }, { transform: tf(dxI, dyI, 0) }],
        { duration: CARRY_A, easing: SETTLE, fill: "forwards" });

      // Four arrows at the corners of the importance box, pointing the way the
      // square is about to change size. Direction comes from the measured scale,
      // not from the importance value: the 12px floor can stop a square that
      // "should" shrink from shrinking, and an arrow that contradicts what you
      // can see is worse than no arrow. Together with the flip they carry the two
      // halves of the rule — the sign turns it over, the magnitude resizes it.
      // Beat one: resize. A row that does not flip takes its final colour here
      // too, since only the magnitude is changing.
      // One beat, not two: the value takes its ink and its kick together, on the
      // way in. The colour runs out exactly as leg one finishes — see IMP_INK.
      later(function () {
        row.classList.add("lit-imp");
        bump(row.querySelector(".imp .nnm-num"));
      }, Math.max(0, CARRY_A - IMP_INK));

      later(function () {
        resizeCue(i, sc, CARRY_SCALE);
        playAnim(c, 
          [{ transform: tf(dxI, dyI, 0), width: startPx, height: startPx, background: startBg },
           { transform: tf(dxI, dyI, 0), width: endPx, height: endPx,
             background: flips ? startBg : endBg }],
          // A touch more overshoot than the travel legs: a square that grows past
          // its size and settles back reads as being pushed to that size.
          { duration: CARRY_SCALE, easing: "cubic-bezier(.34,1.45,.56,1)", fill: "forwards" });
      }, CARRY_A);

      // Beat two: the turn, at the new size, with the colour swapped at the
      // halfway point where the square is edge-on and cannot be seen changing.
      if (flips) {
        later(function () {
          flipCue(i, CARRY_FLIP);
          playAnim(c, 
            [{ transform: tf(dxI, dyI, 0), width: endPx, height: endPx, background: startBg, offset: 0 },
             { transform: tf(dxI, dyI, 90), width: endPx, height: endPx, background: startBg, offset: 0.5 },
             { transform: tf(dxI, dyI, 90), width: endPx, height: endPx, background: endBg, offset: 0.5001 },
             { transform: tf(dxI, dyI, 180), width: endPx, height: endPx, background: endBg, offset: 1 }],
            // No overshoot here on purpose. A turn that goes past 180 and comes
            // back reads as wobbling; this beat has to land exactly reversed.
            { duration: CARRY_FLIP, easing: "cubic-bezier(.45,0,.3,1)", fill: "forwards" });
        }, CARRY_A + CARRY_SCALE);
      }

      const outAt = CARRY_A + CARRY_SCALE + (flips ? CARRY_FLIP : 0);

      later(function () {
        playAnim(c, 
          [{ transform: tf(dxI, dyI, end), width: endPx, height: endPx },
           { transform: tf(dxW, dyW, end), width: endPx, height: endPx }],
          { duration: CARRY_C, easing: SETTLE, fill: "forwards" });
      }, outAt);

      // Handed over once the square is most of the way there, so the line catches
      // it on arrival rather than following it the whole way across.
      later(function () {
        carryFor[p] = c;
        // Draw at once, then follow. trackConnectors returns early when a loop is
        // already running, so on its own the handover would not take effect until
        // the next frame — and the attach has to be instant.
        drawConnectors(lastChosen);
        trackConnectors(CARRY_C * 0.6 + 80);
      }, outAt + CARRY_C * 0.45);

      // The carry keeps its overshoot and settle — that bounce is the landing. The
      // square it lands on is the one that gives way: apply() uncovers the real
      // one at the crossing, 200ms before this, so it spent the whole settle
      // standing out from behind the moving square. It is held invisible until
      // here (see .under) and revealed as the carry goes, both at full size in the
      // same place, so the handover cannot be seen.
      later(function () {
        row.querySelector(".wgt").classList.remove("under");
        dropAnchor(anc);
      }, outAt + CARRY_C + 40);
    }

    function playWeigh() {
      const it = cases[idx];
      const wgt = it.act.map(function (a, p) { return a * IMP[p]; });
      const maxAbs = Math.max.apply(null, wgt.map(Math.abs));
      const full = rows[0].querySelector(".nnm-slot").getBoundingClientRect().width;
      const apply = function (p) {
        const cell = rows[p].querySelector(".wgt");
        cell.style.width = Math.round(weightedWidth(wgt[p], maxAbs, full)) + "px";
        cell.querySelector(".nnm-num").textContent = fmt(wgt[p], 4);
        // Uncovered, not grown. The square is still at the 12px stand-in size and
        // would transition up to its real size just as the carried square lands on
        // it — a second, smaller arrival underneath the first. The transition is
        // suspended so it is simply already the right size when it appears, and
        // the handoff from the carried square is invisible.
        const sq = cell.querySelector(".nnm-sq");
        if (sq) sq.style.transition = "none";
        sizeSym(cell, wgt[p], SYM_SCALE);
        paint(cell, wgt[p], SUM_SCALE);
        cell.classList.remove("empty", "nnm-pop", "nnm-tick");
        if (sq) { void sq.offsetWidth; sq.style.transition = ""; }
        // The VALUE is kicked as it appears, the same 1.09 the importance value
        // takes when the square lands on it. The number only — the cell keeps its
        // tick removed above, because a box that grows here would give away the
        // handoff the suspended transition exists to hide.
        bump(cell.querySelector(".nnm-num"));
        // The number, the colour and the kick all land here. The square does not:
        // a carry is still settling on top of it and the two would double up. The
        // drop timer in carry() takes this off.
        if (carryFor[p]) cell.classList.add("under");
        carryFor[p] = null;
        trackConnectors(motionOff() ? 0 : 520);
      };

      if (motionOff()) {
        rows.forEach(function (r) { r.classList.add("lit-mul", "lit-eq", "lit-imp"); });
        for (let p = 0; p < NP; p++) apply(p);
        weighAnim = false;
        return;
      }

      let t = 0;
      for (let p = 0; p < NP; p++) {
        (function (pi, start, total) {
          const r = rows[pi];
          later(function () {
            r.classList.add("lit-mul");
            bump(r.querySelector(".nnm-op.mul"));
            carry(pi, wgt[pi], it.act[pi]);
          }, start);
          // No kick on the importance box: the carried square arriving on top of
          // it is the event, and a box that jumps at the same moment competes
          // with the thing it is meant to be multiplied by.
          later(function () {
            r.classList.add("lit-eq");
            bump(r.querySelector(".nnm-op.eq"));
          }, start + total - CARRY_C);
          later(function () { apply(pi); }, start + total - WGT_LEAD);
        })(p, t, carryTotal(p));
        t += carryTotal(p) + CARRY_GAP;
      }
      later(function () { weighAnim = false; }, t);
    }

    // How long one converging line takes to draw. The three run in turn, each
    // followed by the total it just changed.
    const DRAW = 620;

    const SUM_HOLD = 200;    // the total sits with its new value before the next line
    // The draw eases out — with this curve a line is all but touching its target
    // well before the 620ms formally ends. Reacting on that deadline reads as a
    // beat too late, so whatever the line delivers moves slightly ahead of it and
    // lands with the line rather than after it. Used by Add up and by Predict.
    const DRAW_LEAD = 90;

    // Fills the sum with a partial total. The first arrival reveals the cell;
    // later ones kick it, the same grammar the pathway activations use.
    function showSum(v, first) {
      sumCell.classList.remove("empty");
      sumCell.querySelector(".nnm-num").textContent = fmt(v, 4);
      sizeSym(sumCell, v, SYM_SCALE);
      paint(sumCell, v, SUM_SCALE);
      if (first) revealCell(sumCell, 0); else bump(sumCell);
    }

    function playAddUp() {
      if (motionOff()) {
        for (let i = 0; i < NP; i++) solidPending[i] = false;
        addUpAnim = false;
        trackConnectors(0);
        return;
      }
      for (let i = 0; i < NP; i++) solidPending[i] = true;
      // Draw at once. trackConnectors returns early when a follow loop is already
      // running, so on a re-click the lines would stay drawn until the next frame
      // and the replay would appear to do nothing for its first beat.
      drawConnectors(lastChosen);
      trackConnectors(0);

      // One line at a time, each followed by the total it just changed, so the
      // sum is seen being built out of three contributions rather than appearing
      // whole once the lines have all landed.
      const it = cases[idx];
      let running = 0;
      let t = 60;
      for (let i = 0; i < NP; i++) {
        const p = i;
        later(function () {
          solidPending[p] = false;
          // Redraw first so the resting attribute reads "drawn": the animation has
          // no fill, so when it ends the attribute is what keeps the line visible.
          drawConnectors(lastChosen);
          const sol = convSolid[p];
          const len = parseFloat(sol.getAttribute("stroke-dasharray")) || 0;
          playAnim(sol, 
            [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
            { duration: DRAW, easing: "cubic-bezier(.3,0,.35,1)" }
          );
        }, t);
        const react = t + DRAW - DRAW_LEAD;
        later(function () {
          running += it.act[p] * IMP[p];
          showSum(running, p === 0);
        }, react);
        t = react + SUM_HOLD;
      }
      later(function () { addUpAnim = false; }, t - SUM_HOLD + 30);
    }

    // The two answers are on screen from the start, plain. Decide draws the line
    // to the one the sum picked, and only when it arrives does that answer take
    // its colour — the line delivers the result rather than confirming it.
    function playDecide() {
      if (motionOff()) {
        decidePending = false;
        decideAnim = false;
        trackConnectors(0);
        return;
      }
      decidePending = true;
      trackConnectors(0);
      later(function () {
        decidePending = false;
        drawConnectors(lastChosen);
        const flen = fanSolid.getTotalLength ? fanSolid.getTotalLength() : 0;
        playAnim(fanSolid, 
          [{ strokeDashoffset: flen }, { strokeDashoffset: 0 }],
          { duration: DRAW, easing: "cubic-bezier(.3,0,.35,1)" }
        );
      }, 60);
      // The line arrives first, then the answer it delivers takes its colour and
      // is kicked, and only after that does the comparison appear beneath. Three
      // separate beats: the route, the result, then how it measured up.
      later(function () {
        decideAnim = false;
        outEls.forEach(function (o) {
          const on = o.v === lastChosen;
          o.el.classList.toggle("on", on);
          if (on) { o.el.classList.remove("nnm-pop"); void o.el.offsetWidth; o.el.classList.add("nnm-pop"); }
        });
        // The fan is anchored to the answer's left edge, and the pop overshoots —
        // so following it for the length of the kick lets the line share the
        // bounce instead of ending at where the pill used to be. Same idea as the
        // carried square handing the convergence line its arrival.
        drawConnectors(lastChosen);
        trackConnectors(POP_MS + 80);
      }, 60 + DRAW - DRAW_LEAD);
    }

    // Length of the .nnm-pop kick, so anything that has to follow a popping
    // element knows how long to follow it for.
    const POP_MS = 420;

    // How long after Predict starts before the answer box has finished arriving.
    // The labels underneath wait for this.
    const DECIDE_SETTLED = 60 + DRAW - DRAW_LEAD + 420;

    // Each conversation is its own problem and keeps its own place in the chain.
    // Keyed by conversation id rather than position, so a filter that reorders or
    // narrows the set doesn't hand one conversation another's progress.
    const stepByCase = Object.create(null);

    function remember() {
      const it = cases[idx];
      if (it) stepByCase[it.id] = step;
    }

    // Arriving at a conversation restores where it was left — or the empty
    // skeleton the first time. It re-draws that state rather than replaying the
    // animation: you are returning to your work, not watching it happen again.
    function goToCase(n) {
      cancelAnim();
      idx = n;
      const it = cases[n];
      step = it ? (stepByCase[it.id] || 0) : 0;
      render();
    }

    function setStep(n) {
      cancelAnim();
      const from = step;
      step = n;
      remember();
      wordAnim = (n === 1);
      weighAnim = (n === 2);
      // Must be set before render(), not after: render decides whether the sum
      // cell is filled or left as a stand-in, and it reads this.
      // A button plays its own step and nothing else. Everything before it is
      // simply already there, drawn by render(). Keyed on the step pressed rather
      // than on where you came from, so pressing one you are already on replays
      // it, and jumping straight to Predict does not make Add Up animate on the
      // way past — it is just in place, like Activate and Weigh already were.
      const doAddUp = (n === 3);
      const doDecide = (n === 4);
      addUpAnim = (doAddUp && !motionOff());
      decideAnim = (doDecide && !motionOff());
      // Raised here, not in cancelAnim, because only here is it known whether an
      // animation is actually coming. In cancelAnim it also applied to the paths
      // that never animate — restoring a conversation — and hid the line there.
      // Left false, render would paint it fully drawn for a frame before
      // playDecide hid it again, which is the flash the convergence lines had.
      decidePending = decideAnim;
      render();
      if (wordAnim) playWords();
      if (weighAnim) playWeigh();
      if (doAddUp) playAddUp();
      if (doDecide) playDecide();
    }
    const steps = document.createElement("div");
    steps.className = "nnm-steprow";
    const stepGroup = document.createElement("div");
    stepGroup.className = "nnm-stepgroup";
    steps.appendChild(stepGroup);
    const stepBtns = STEP_LABELS.map(function (label, i) {
      const b = document.createElement("button");
      b.className = "nnm-step";
      b.innerHTML = STEP_ICONS[i] + '<span>' + label + '</span>';
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () { setStep(i + 1); });
      stepGroup.appendChild(b);
      return b;
    });
    const resetBtn = document.createElement("button");
    resetBtn.className = "nnm-reset";
    resetBtn.innerHTML = '<span class="glyph">&#8634;</span><span>Reset</span>';
    resetBtn.setAttribute("aria-label", "Clear the steps and start over");
    resetBtn.addEventListener("click", function () { setStep(0); });
    // One group of five. Reset is the same 36px pill as the four steps and reads
    // as one of them; what kept it apart was where it sat, not how it looked.
    stepGroup.appendChild(resetBtn);
    // About moves out of the filter row above the conversations and into the slot
    // Reset has just left — appending moves the node, so there is nothing to
    // remove from the row it came from — with a rule between the two groups.
    if (casePane.filter && casePane.filter.about) {
      const stepRule = document.createElement("span");
      stepRule.className = "nnm-steprule";
      stepRule.setAttribute("aria-hidden", "true");
      steps.appendChild(stepRule);
      steps.appendChild(casePane.filter.about);
    }

    const animWrap = document.createElement("label");
    animWrap.className = "nnm-animtoggle";
    const animBox = document.createElement("input");
    animBox.type = "checkbox";
    animBox.checked = true;
    const animText = document.createElement("span");
    animText.textContent = "Animate";
    animWrap.appendChild(animBox);
    animWrap.appendChild(animText);
    animBox.addEventListener("change", function () {
      animateOn = animBox.checked;
      wrap.classList.toggle("nnm-nomotion", !animateOn);
      // Nothing is animating, so there is no speed to choose.
      speedIn.disabled = !animateOn;
      speedWrap.classList.toggle("off", !animateOn);
      // Whatever was mid-flight is abandoned and the current step is re-drawn in
      // whichever mode we just switched to.
      cancelAnim();
      setStep(step);
    });
    // The browser focuses a form control on MOUSEDOWN, before any click handler
    // can run — so blurring afterwards is always a frame late, and the ring has
    // already been painted. And it cannot be styled away either: a native control
    // draws its focus indication in ways CSS `outline` does not govern. The only
    // reliable answer is to stop the pointer giving it focus at all. Cancelling
    // the mousedown default does that; the click still toggles, because a label
    // activates its control on click, not on mousedown. Tab is untouched, so the
    // ring still appears for keyboard users, where it is the whole point.
    animWrap.addEventListener("mousedown", function (e) { e.preventDefault(); });

    chainHead.appendChild(animWrap);

    const speedWrap = document.createElement("div");
    speedWrap.className = "nnm-speed";
    const speedIn = document.createElement("input");
    speedIn.type = "range";
    speedIn.min = "0"; speedIn.max = "2"; speedIn.step = "1"; speedIn.value = "1";
    speedIn.setAttribute("aria-label", "Animation speed");
    // A tick and a name under each stop, rather than one caption that changes.
    // The three positions are then readable without moving the thumb to find out
    // what they are, and the chosen one is the one that is darkened.
    const speedTicks = document.createElement("div");
    speedTicks.className = "nnm-speedticks";
    // Each name is pinned to the x the thumb actually comes to rest at, which is
    // only knowable because the thumb's size is set in CSS: its centre travels
    // from half a thumb in to half a thumb from the far end. Laying the three out
    // with space-between instead lines up their EDGES, so the ticks missed the
    // stops by however wide each word happened to be.
    const SPEED_W = 92, THUMB = 24;
    const speedLabs = SPEED_NAMES.map(function (nm, i) {
      const t = document.createElement("span");
      t.textContent = nm;
      t.style.left = (THUMB / 2 + i * (SPEED_W - THUMB) / 2).toFixed(1) + "px";
      speedTicks.appendChild(t);
      return t;
    });

    function setSpeed(i) {
      animSpeed = SPEEDS[i];
      speedLabs.forEach(function (t, k) { t.classList.toggle("on", k === i); });
      speedIn.setAttribute("aria-valuetext", SPEED_NAMES[i]);
    }
    speedIn.addEventListener("input", function () {
      const was = animSpeed;
      setSpeed(parseInt(speedIn.value, 10));
      // Applies to whatever is already running, not just the next step.
      rescale(animSpeed / was);
    });
    setSpeed(1);
    speedIn.disabled = !animBox.checked;
    speedWrap.classList.toggle("off", !animBox.checked);
    // The native track always spans the whole input, which runs half a thumb past
    // the first and last stops at each end. Drawn here instead, so it starts and
    // stops where the thumb does: the bar is inset by half a thumb and extended
    // by half its own height at each end, which puts the centre of each rounded
    // cap exactly on an outer stop.
    const TRACK_H = 4;
    const speedTrack = document.createElement("div");
    speedTrack.className = "nnm-speedtrack";
    const trackLine = document.createElement("i");
    trackLine.className = "nnm-trackline";
    trackLine.style.left = (THUMB / 2 - TRACK_H / 2) + "px";
    trackLine.style.width = ((SPEED_W - THUMB) + TRACK_H) + "px";
    trackLine.style.height = TRACK_H + "px";
    trackLine.style.borderRadius = (TRACK_H / 2) + "px";
    speedTrack.appendChild(trackLine);
    speedTrack.appendChild(speedIn);
    speedWrap.appendChild(speedTrack);
    speedWrap.appendChild(speedTicks);
    chainHead.appendChild(speedWrap);

    rightCol.appendChild(steps);
    chainPanel.appendChild(chainHead);

    const chainOuter = document.createElement("div");
    chainOuter.className = "nnm-panel-body nnm-flowouter";
    chainPanel.appendChild(chainOuter);
    const chainBody = document.createElement("div");
    chainBody.className = "nnm-flowbodywrap";
    chainOuter.appendChild(chainBody);
    rightCol.appendChild(chainPanel);

    const flowHead = document.createElement("div");
    flowHead.className = "nnm-flowhead";
    flowHead.innerHTML =
      '<span class="c act">Pathway<br>Activation</span>' +
      '<span class="g"></span>' +
      '<span class="c imp">Pathway<br>Importance</span>' +
      '<span class="g"></span>' +
      '<span class="c wgt">Weighted<br>Activation</span>' +
      '<span class="c far sum">Weighted<br>Sum</span>' +
      '<span class="c far dec">Pathway Prediction</span>';
    chainOuter.insertBefore(flowHead, chainBody);

    const flowBody = document.createElement("div");
    flowBody.className = "nnm-flowbody";
    chainBody.appendChild(flowBody);

    const rowsEl = document.createElement("div");
    rowsEl.className = "nnm-frows";
    flowBody.appendChild(rowsEl);

    // Typographic marks rather than drawn shapes: the old chunky X read as a close
    // button, and neither glyph could align or scale with the numbers beside it.
    // "=", at the same size as the X, so the row reads as one statement of
    // arithmetic. It replaced an arrow on 2026-08-31 at the content designer's
    // request. Worth knowing: the row does NOT multiply out exactly on screen,
    // because activation is shown to 4dp and stored to 6 — 0.7293 x 17.9428 is
    // 13.0857, not the 13.0863 displayed. Showing activation to 5dp is what it
    // would take to make the equals sign check out by hand.
    function glyphX() { return '<span class="nnm-glyph" aria-hidden="true">\u00D7</span>'; }
    function glyphEq() { return '<span class="nnm-glyph eq" aria-hidden="true">=</span>'; }

    const rows = [];
    for (let p = 0; p < NP; p++) {
      const r = document.createElement("div");
      r.className = "nnm-frow";
      r.innerHTML =
        '<span class="nnm-cell act sym"><i class="nnm-sq"></i><span class="nnm-num"></span></span>' +
        '<span class="nnm-op mul">' + glyphX() + '</span>' +
        '<span class="nnm-cell imp sym"><i class="nnm-sq"></i><span class="nnm-num"></span></span>' +
        '<span class="nnm-op eq">' + glyphEq() + '</span>' +
        '<span class="nnm-slot"><span class="nnm-cell wgt sym">' +
          '<i class="nnm-sq"></i><span class="nnm-num"></span></span></span>';
      rowsEl.appendChild(r);
      rows.push(r);
    }

    // three weighted values converging on one score
    const conv = document.createElementNS(SVGNS, "svg");
    conv.setAttribute("class", "nnm-conv");
    const convPaths = [];
    for (let p = 0; p < NP; p++) {
      const ln = document.createElementNS(SVGNS, "line");
      ln.setAttribute("stroke", "#9AA3B0");
      ln.setAttribute("stroke-width", "1.3");
      ln.setAttribute("stroke-dasharray", "5 4");
      ln.setAttribute("stroke-linecap", "round");
      conv.appendChild(ln);
      convPaths.push(ln);
    }
    // A solid line over each dashed guide. It is hidden by holding its dash
    // offset at the full length, and drawn by running that offset to zero — from
    // the weighted value towards the sum, which is the direction of x1 to x2.
    // While a line is waiting its turn to be drawn it must read as hidden, not as
    // finished. An animation delay cannot do that job: during the delay the
    // animation is not in effect, so the resting "fully drawn" value applies and
    // the line flashes in complete before snapping back. Each line's turn is
    // scheduled instead, and this records which are still waiting.
    const solidPending = [false, false, false];
    const convSolid = [];
    for (let p = 0; p < NP; p++) {
      const ln = document.createElementNS(SVGNS, "line");
      ln.setAttribute("stroke", "#3E4753");
      ln.setAttribute("stroke-width", "2");
      ln.setAttribute("stroke-linecap", "round");
      conv.appendChild(ln);
      convSolid.push(ln);
    }
    flowBody.appendChild(conv);

    const decideWrap = document.createElement("div");
    decideWrap.className = "nnm-decidewrap";
    const decideRow = document.createElement("div");
    decideRow.className = "nnm-deciderow";
    decideWrap.appendChild(decideRow);
    flowBody.appendChild(decideWrap);

    const tail = document.createElement("div");
    tail.className = "nnm-tail";
    const sumLabel = document.createElement("div");
    sumLabel.className = "nnm-taillabel";
    sumLabel.hidden = true;   // the caption now lives in the header row
    const sumCell = document.createElement("div");
    sumCell.className = "nnm-cell sum sym";
    sumCell.innerHTML = '<i class="nnm-sq"></i><span class="nnm-num"></span>';
    tail.appendChild(sumLabel);
    tail.appendChild(sumCell);
    decideRow.appendChild(tail);

    // sum -> one of two outcomes
    const fan = document.createElementNS(SVGNS, "svg");
    fan.setAttribute("class", "nnm-fan");
    const fanUp = document.createElementNS(SVGNS, "path");
    const fanDown = document.createElementNS(SVGNS, "path");
    [fanUp, fanDown].forEach(function (pth) {
      pth.setAttribute("fill", "none");
      pth.setAttribute("stroke", "#B9C0CA");
      pth.setAttribute("stroke-width", "1.3");
      pth.setAttribute("stroke-dasharray", "5 4");
      pth.setAttribute("stroke-linecap", "round");
      fan.appendChild(pth);
    });
    // Drawn along whichever route the sum picks, the same way the converging
    // lines are: hidden by holding its dash offset at full length, then run to
    // zero so it fills from the sum towards the answer.
    const fanSolid = document.createElementNS(SVGNS, "path");
    fanSolid.setAttribute("fill", "none");
    fanSolid.setAttribute("stroke", "#3E4753");
    fanSolid.setAttribute("stroke-width", "2.2");
    fanSolid.setAttribute("stroke-linecap", "round");
    fan.appendChild(fanSolid);
    decideRow.appendChild(fan);

    const outs = document.createElement("div");
    outs.className = "nnm-outs";
    const outEls = [1, 0].map(function (v) {
      const o = document.createElement("span");
      o.className = "nnm-out " + (v === 1 ? "approach" : "wait");
      o.textContent = v === 1 ? "Approach" : "Wait";
      outs.appendChild(o);
      return { v: v, el: o };
    });
    decideRow.appendChild(outs);

    const labelsEl = document.createElement("div");
    labelsEl.className = "nnm-labels";
    decideRow.appendChild(labelsEl);

    const noteEl = document.createElement("div");
    noteEl.className = "nnm-note";
    chainBody.appendChild(noteEl);

    // ---------- helpers ----------
    // Exactly zero carries no sign — the same reason its square is white rather
    // than the lightest positive tint. A value that merely ROUNDS to zero keeps
    // its sign: Pathway 2's weighted values are all under +-0.41, so "+0.00" is
    // usually a real positive, not nothing.
    function fmt(v, dp) {
      const d = dp === undefined ? 2 : dp;
      return (v === 0 ? "" : v > 0 ? "+" : "−") + Math.abs(v).toFixed(d);
    }
    function pill(v) {
      const s = document.createElement("span");
      s.className = "nnm-pill " + (v === 1 ? "approach" : "wait");
      s.textContent = v === 1 ? "Approach" : "Wait";
      return s;
    }

    // Whether the wide arrangement fits must be re-decided every render:
    // measuring it once caught whatever layout happened to be up at build time.
    // Dropping the class first makes the browser report the wide widths.
    function fitFlow() {
      flowBody.classList.remove("narrow");
      // getBoundingClientRect, not offsetWidth: conv and fan are SVG elements and
      // SVGElement has no offsetWidth, so the sum came out NaN and never compared true.
      const wOf = function (el) { return el.getBoundingClientRect().width; };
      // conv's canvas reaches back over the slot via a negative margin, so its
      // rect is wider than the space it actually occupies. Use the constant, or
      // the flow measures itself as needing the slot width twice and goes narrow.
      // The labels are positioned out of the flow, so decideWrap no longer reports
      // their width — measure them alongside the row, since both still have to fit.
      const need = wOf(rowsEl) + CONV_W + Math.max(wOf(decideRow), wOf(labelsEl));
      // Measure against the panel's inner width, not flowBody's own: when the
      // row overflows, flowBody stretches with it and reports the inflated size,
      // so comparing need to that always says "it fits".
      const cs = getComputedStyle(chainOuter);
      const avail = chainOuter.clientWidth
        - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      if (avail > 0 && need > avail) flowBody.classList.add("narrow");
    }

    // Reading p on the left and flow row p on the right must sit on the same line.
    // Readings vary with text length, so both are cleared, measured, then set to
    // the taller of the pair — clearing first keeps it from ratcheting upward.
    // The flow panel starts at the top of the card while the readings start below
    // the find bar, so the captions absorb the difference and the first row still
    // lands on the first reading. Cleared before measuring so it cannot ratchet.
    function alignTops() {
      flowHead.style.height = "";
      readHead.style.height = "";
      const base = flowHead.getBoundingClientRect().height;
      const rBase = readHead.getBoundingClientRect().height;
      // Measure the two things that must sit on the same line — the first reading
      // and the first flow row — not their scroll containers. The containers carry
      // padding for focus-ring room, so their top edges sit above their content by
      // an amount that has nothing to do with the alignment being solved for.
      const delta = readings[0].getBoundingClientRect().top
        - rows[0].getBoundingClientRect().top;
      // Whichever caption block is shorter absorbs the difference. Only the flow
      // head ever needed to grow while the captions were plain text; once they can
      // carry button chrome they become the taller of the two, so the readings
      // have to be able to give as well as take.
      if (delta > 0) flowHead.style.height = (base + delta) + "px";
      else if (delta < 0) readHead.style.height = (rBase - delta) + "px";
    }

    // The last two captions sit over elements the header row cannot reach by
    // flex order — the conv SVG's negative margin means header widths and body
    // positions do not correspond. They are placed against the measured centres
    // of the sum cell and the pair of answers instead.
    function alignHeadCaptions() {
      const hr = flowHead.getBoundingClientRect();
      if (hr.width < 2) return;
      const place = function (cap, target) {
        const t = target.getBoundingClientRect();
        if (t.width < 1) { cap.style.display = "none"; return; }
        cap.style.display = "";
        cap.style.left = Math.round(t.left + t.width / 2 - hr.left) + "px";
      };
      place(flowHead.querySelector(".sum"), sumCell);
      place(flowHead.querySelector(".dec"), outs);
    }

    function syncRows() {
      readings.forEach(function (r) { r.style.minHeight = ""; });
      rows.forEach(function (r) { r.style.minHeight = ""; });
      const h = readings.map(function (r, i) {
        return Math.max(r.offsetHeight, rows[i].offsetHeight);
      });
      readings.forEach(function (r, i) { r.style.minHeight = h[i] + "px"; });
      rows.forEach(function (r, i) { r.style.minHeight = h[i] + "px"; });
    }

    // The weighted boxes change width over a 0.45s transition, and the converging
    // lines are anchored to their right edges — so a single redraw would catch the
    // box mid-move. This follows the edge frame by frame until the box settles.
    let lastChosen = 0;
    let trackRaf = null;
    // Callers ask for a window to follow; the longest one wins. Replacing the
    // deadline instead of extending it lets a trackConnectors(0) — playAddUp and
    // playDecide both open with one — cancel a follow that render() started for a
    // width transition still in flight, freezing the lines at whatever width the
    // boxes happened to be passing through.
    let trackUntil = 0;
    function trackConnectors(ms) {
      trackUntil = Math.max(trackUntil, performance.now() + ms);
      if (trackRaf) return;
      (function frame() {
        drawConnectors(lastChosen);
        if (performance.now() < trackUntil) {
          trackRaf = requestAnimationFrame(frame);
        } else {
          trackRaf = null;
        }
      })();
    }

    // The lines are anchored to the right edge of each weighted box, so the boxes'
    // geometry is what should drive the redraw — not a duration guessed in advance.
    // A timed follow only covers the transition it was told about: one that starts
    // late, a re-layout from fitFlow's narrow mode, or a second width change
    // arriving mid-flight all leave the lines attached to where the boxes were.
    // Watching the boxes themselves catches every width change, whatever caused it.
    if (window.ResizeObserver) {
      const boxWatch = new ResizeObserver(function () { drawConnectors(lastChosen); });
      rows.forEach(function (r) { boxWatch.observe(r.querySelector(".wgt")); });
      boxWatch.observe(sumCell);
      outEls.forEach(function (o) { boxWatch.observe(o.el); });
    }

    // Width is transitioned, so the end of that transition is the moment the final
    // anchor is knowable. Cheap, exact, and independent of any follow window:
    // whatever else has been cancelled by then, the lines land attached.
    rows.forEach(function (r) {
      r.querySelector(".wgt").addEventListener("transitionend", function (e) {
        if (e.propertyName === "width") drawConnectors(lastChosen);
      });
    });

    // The squares carry the anchors now, and they animate their own size, so the
    // lines have to follow them the same way they follow the boxes.
    rows.map(function (r) { return r.querySelector(".wgt .nnm-sq"); })
      .concat([sumCell.querySelector(".nnm-sq")])
      .forEach(function (sq) {
        if (!sq) return;
        if (window.ResizeObserver) {
          new ResizeObserver(function () { drawConnectors(lastChosen); }).observe(sq);
        }
        sq.addEventListener("transitionend", function (e) {
          if (e.propertyName === "width" || e.propertyName === "height") {
            drawConnectors(lastChosen);
          }
        });
      });

    // Fills a cell in and kicks it, without the stand-in hatching.
    function revealCell(el, delay) {
      el.classList.remove("empty", "nnm-pop", "nnm-tick");
      void el.offsetWidth;
      el.style.animationDelay = (delay || 0) + "ms";
      el.classList.add("nnm-pop");
    }

    // The converging lines start at the right EDGE of each weighted box, not at a
    // fixed column, so they stay attached as the boxes change width. That means the
    // SVG has to reach back over the slot: it is given a negative left margin equal
    // to the slot width and the same amount of extra width, so its canvas covers the
    // slot while its contribution to the row's layout is unchanged.

    // The lines leave the symbol, not the box around it. The box is transparent
    // now that the square carries the value, so anchoring to its edge left the
    // lines starting in blank space up to 26px clear of anything.
    // While a carried square is arriving at its weighted slot, the connector for
    // that row anchors to IT rather than to the still-hidden square underneath.
    // The line is then dragged into place by the value landing, and shares its
    // settle, instead of snapping across once everything has stopped moving.
    const carryFor = [];

    function symRect(cell) {
      const sq = cell.querySelector(".nnm-sq");
      return (sq && sq.getBoundingClientRect().width > 0 ? sq : cell).getBoundingClientRect();
    }

    function drawConnectors(chosen) {
      const slotW = rows[0].querySelector(".nnm-slot").getBoundingClientRect().width;
      conv.style.marginLeft = (-slotW) + "px";
      conv.style.width = (CONV_W + slotW) + "px";

      // The SVG carries a width but no height, so its height falls out of the
      // viewBox's aspect ratio — and the viewBox is built from its own measured
      // height. That loop ratchets: a long conversation stretches it, and nothing
      // shrinks it again, so it holds flowBody at the tallest conversation seen
      // and the sum keeps centring on that rather than on the middle pathway.
      // The rows are the authority on how tall this column is. They carry explicit
      // heights from syncRows and never stretch, so their span is measured
      // directly rather than read off a container the SVG may already be inflating.
      const span = rows[NP - 1].getBoundingClientRect().bottom
        - rows[0].getBoundingClientRect().top;
      if (span > 0) conv.style.height = span + "px";

      const cr0 = conv.getBoundingClientRect();
      // The guides are on screen from the start — they are the shape of the chain
      // waiting to be filled, like the empty stand-in squares. Only an unmeasurable
      // canvas hides them.
      if (cr0.width < 2) {
        conv.style.visibility = "hidden";
      } else {
        conv.style.visibility = "";
        conv.setAttribute("viewBox", "0 0 " + cr0.width + " " + cr0.height);
        const sc = symRect(sumCell);
        const ty = sc.top + sc.height / 2 - cr0.top;
        // The sum square's own left edge. The SVG's right border is not the same
        // place — the square overhangs its cell and changes size — so ending the
        // lines at the border left a gap that grew and shrank with the value.
        const tx = sc.left - cr0.left;
        rows.forEach(function (r, i) {
          const rr = carryFor[i]
            ? carryFor[i].getBoundingClientRect()
            : symRect(r.querySelector(".wgt"));
          const y = rr.top + rr.height / 2 - cr0.top;
          const x = rr.right - cr0.left;
          const ln = convPaths[i];
          ln.setAttribute("x1", x);
          ln.setAttribute("y1", y);
          ln.setAttribute("x2", tx);
          ln.setAttribute("y2", ty);

          const sol = convSolid[i];
          sol.setAttribute("x1", x);
          sol.setAttribute("y1", y);
          sol.setAttribute("x2", tx);
          sol.setAttribute("y2", ty);
          const len = Math.hypot(tx - x, ty - y);
          sol.setAttribute("stroke-dasharray", len);
          // Resting state: fully drawn once Add up has run, fully hidden before.
          // A running animation still overrides this, so redraws during the draw
          // reposition the line without cutting the animation short.
          sol.setAttribute("stroke-dashoffset", (step >= 3 && !solidPending[i]) ? 0 : len);
        });
      }

      const fr = fan.getBoundingClientRect();
      if (fr.width < 2) { fan.style.visibility = "hidden"; return; }
      fan.style.visibility = "";
      fan.setAttribute("viewBox", "0 0 " + fr.width + " " + fr.height);
      const sc2 = symRect(sumCell);
      const sy = sc2.top + sc2.height / 2 - fr.top;
      // Anchored the same way at both ends: it leaves the sum square's right edge
      // and arrives at the answer's left edge, wherever those happen to be.
      const sx = sc2.right - fr.left;
      outEls.forEach(function (o, i) {
        const orr = o.el.getBoundingClientRect();
        const oy = orr.top + orr.height / 2 - fr.top;
        const ox = orr.left - fr.left;
        const span = ox - sx;
        const pth = i === 0 ? fanUp : fanDown;
        pth.setAttribute("d", "M" + sx + " " + sy +
          " C " + (sx + span * 0.55) + " " + sy + ", " +
          (sx + span * 0.45) + " " + oy + ", " + ox + " " + oy);
      });

      const chosenPath = chosen === 1 ? fanUp : fanDown;
      fanSolid.setAttribute("d", chosenPath.getAttribute("d") || "");
      const flen = fanSolid.getTotalLength ? fanSolid.getTotalLength() : 0;
      fanSolid.setAttribute("stroke-dasharray", flen);
      fanSolid.setAttribute("stroke-dashoffset", (step >= 4 && !decidePending) ? 0 : flen);
    }

    // ---------- render ----------
    function render() {
      const empty = cases.length === 0;
      casePanel.style.display = empty ? "none" : "";
      chainPanel.style.visibility = empty ? "hidden" : "";
      emptyMsg.hidden = !empty;
      if (empty) return;
      if (idx >= cases.length) idx = cases.length - 1;
      const it = cases[idx];

      countEl.textContent = (idx + 1) + " / " + cases.length;
      setAriaDisabled(prevBtn, idx === 0);
      setAriaDisabled(nextBtn, idx === cases.length - 1);
      caseIdEl.title = "#" + it.id;   // id kept for cross-referencing the explorer

      // all three readings, on the one shared colour scale shown above them
      readings.forEach(function (r, p) {
        const txt = r.querySelector(".nnm-read-text");
        txt.innerHTML = "";
        it.text.split(/\s+/).forEach(function (w, wi) {
          if (wi) txt.appendChild(document.createTextNode(" "));
          const span = document.createElement("span");
          span.className = "nnm-tok";
          span.textContent = w;
          const v = D.vocabulary[w];
          // The tooltips say what the model made of a word, so they arrive with
          // the step that shows it. Before Activate the sentence is deliberately
          // plain, and a hover that gave up the value — or, on a blank, the
          // pathway that owns it — would hand over the answer the step exists to
          // reveal, while the words on screen still say nothing has been read.
          const told = step >= 1;
          if (v && v[0] === p) {
            const L = level(Math.min(1, Math.abs(v[1]) / TOK_MAX));
            span.classList.add("scored");
            span.style.setProperty("--tok-bg", (v[1] >= 0 ? FILL_POS : FILL_NEG)[L]);
            span.style.setProperty("--tok-fg", L === 4 ? "#fff" : "#1E242C");
            if (told) span.title = w + ": " + fmt(v[1], 4);
            // Lit straight away unless the Words sequence is about to light them
            // one at a time.
            if (step >= 1 && !wordAnim) span.classList.add("lit");
          } else if (v) {
            // Each of the 30 words belongs to exactly one pathway. Naming that
            // one turns a blank from "this word did not matter" into a fact.
            // No verb: half the vocabulary is negative, so "activates" would be
            // wrong for those, and "scores" is a term used nowhere else here.
            if (told) span.title = w + ": a " + PATH_NAMES[v[0]] + " word";
          }
          txt.appendChild(span);
        });
      });

      labelsEl.innerHTML = "";
      // Three different things are on screen and they must not share a word:
      // the column above is the PATHWAYS' prediction, Model is the model's own,
      // and Actual is the truth. They disagree on 7% of conversations, which is
      // the whole point of Day 3 — so "Prediction" alone was ambiguous here.
      [["Actual", it.target], ["Model", it.pred]].forEach(function (pair) {
        const row = document.createElement("div");
        row.className = "nnm-label-row";
        const b = document.createElement("b"); b.textContent = pair[0];
        row.appendChild(b); row.appendChild(pill(pair[1]));
        labelsEl.appendChild(row);
      });
      if (it.pred !== it.target) {
        const f = document.createElement("div");
        f.className = "nnm-label-row";
        const sp = document.createElement("span");
        sp.className = "nnm-flag"; sp.textContent = "MODEL WAS WRONG";
        f.appendChild(sp); labelsEl.appendChild(f);
      }

      // the flow
      const wgt = []; let sum = 0;
      const revealed = function (el, on, wasOn, delay) {
        el.classList.toggle("empty", !on);
        el.classList.remove("nnm-pop");
        if (on && !wasOn) {
          void el.offsetWidth;                 // restart the animation
          el.style.animationDelay = (delay || 0) + "ms";
          el.classList.add("nnm-pop");
        }
      };
      for (let p = 0; p < NP; p++) {
        const a = it.act[p], w = a * IMP[p];
        wgt.push(w); sum += w;
        const r = rows[p];
        const actC = r.querySelector(".act"), impC = r.querySelector(".imp"), wgtC = r.querySelector(".wgt");
        writeCell(actC, a, ACT_SCALE, SYM_SCALE);
        impC.querySelector(".nnm-num").textContent = fmt(IMP[p], 4);
        sizeSym(impC, IMP[p], SYM_SCALE, IMP_MAX);
        writeCell(wgtC, w, SUM_SCALE, SYM_SCALE);
        revealed(actC, step >= 1 && !wordAnim, prevStep >= 1 && !wordAnim, p * 90);
        // Importance is never revealed: it is not produced by the step before it.
        // It is a property of the model — the same three numbers on all 800
        // conversations, unchanged by any step — so it is on screen from the
        // start, and staying put while everything around it moves is the point.
        impC.classList.remove("empty");
        if (!weighAnim) wgtC.classList.remove("under");
        revealed(wgtC, step >= 2 && !weighAnim, prevStep >= 2 && !weighAnim, p * 90 + 140);
        if (step >= 2 && !weighAnim) {
          const slot = r.querySelector(".nnm-slot").getBoundingClientRect().width;
          const maxAbs = Math.max.apply(null, it.act.map(function (a, k) { return Math.abs(a * IMP[k]); }));
          wgtC.style.width = Math.round(weightedWidth(w, maxAbs, slot)) + "px";
        } else if (step < 2) {
          wgtC.style.width = "";
        }
        if (!weighAnim) {
          r.classList.toggle("lit-mul", step >= 2);
          r.classList.toggle("lit-eq", step >= 2);
          r.classList.toggle("lit-imp", step >= 2);
        } else {
          r.classList.remove("lit-mul", "lit-eq", "lit-imp");
        }
      }
      // conv/fan visibility is owned by drawConnectors — see the note there.

      sumCell.querySelector(".nnm-num").textContent = fmt(sum, 4);
      sizeSym(sumCell, sum, SYM_SCALE);
      paint(sumCell, sum, SUM_SCALE);
      revealed(sumCell, step >= 3 && !addUpAnim, prevStep >= 3 && !addUpAnim, 260);

      const chosen = sum > 0 ? 1 : 0;
      lastChosen = chosen;
      outEls.forEach(function (o) {
        o.el.classList.remove("empty");
        o.el.classList.toggle("on", o.v === chosen && step >= 4 && !decideAnim);
      });

      // Held back until the Decide animation has finished, so the answer lands
      // before the comparison against it appears.
      if (step >= 4) {
        if (prevStep < 4) {
          labelsEl.style.visibility = "hidden";
          const t = setTimeout(function () {
            labelsEl.style.visibility = "";
            labelsEl.classList.remove("nnm-pop"); void labelsEl.offsetWidth;
            labelsEl.classList.add("nnm-pop");
          }, motionOff() ? 0 : DECIDE_SETTLED);
          SIM._timeouts.push(t);
        } else {
          labelsEl.style.visibility = "";
        }
      } else {
        labelsEl.style.visibility = "hidden";
      }

      noteEl.textContent = (step >= 4 && chosen !== it.pred)
        ? "The pathways and the model point different ways on this one. The pathways are a "
          + "summary of the model, not a copy of it — they land on the same answer in about "
          + "9 cases out of 10." : "";

      stepBtns.forEach(function (b, i) {
        const n = i + 1;
        b.classList.toggle("on", n === step);
        b.setAttribute("aria-pressed", n === step ? "true" : "false");
      });
      resetBtn.disabled = step === 0;

      fitFlow();

      alignTops();
      syncRows();
      alignHeadCaptions();
      // Widths may have just changed here too, so follow them rather than drawing once.
      trackConnectors(motionOff() ? 0 : 520);
      prevStep = step;

      SIM.announce("Conversation " + (idx + 1) + " of " + cases.length +
        ". Weighted sum " + fmt(sum) + ". Pathways say " + (chosen ? "approach" : "wait") + ".");
    }

    // The readings and the flow rows are aligned line for line, so they have to
    // scroll as one. The right side is taller (bar, hint, note sit below the rows),
    // so its scrollTop simply clamps when the left runs out — the guard stops the
    // two handlers bouncing the value back and forth.
    let syncingScroll = false;
    function linkScroll(a, b) {
      a.addEventListener("scroll", function () {
        if (syncingScroll) return;
        syncingScroll = true;
        b.scrollTop = a.scrollTop;
        requestAnimationFrame(function () { syncingScroll = false; });
      }, { passive: true });
    }
    linkScroll(readScroll, chainBody);
    linkScroll(chainBody, readScroll);
    readScroll.addEventListener("scroll", syncFlyLayer, { passive: true });
    chainBody.addEventListener("scroll", syncFlyLayer, { passive: true });

    prevBtn.addEventListener("click", function () { if (idx > 0) goToCase(idx - 1); });
    nextBtn.addEventListener("click", function () { if (idx < cases.length - 1) goToCase(idx + 1); });

    SIM.onResize = function () { requestAnimationFrame(render); };
    render();

    return wrap;
  }

  // ---- not yet built: blank content area ----
  const wrap = document.createElement("div");
  wrap.className = "sim-content";

  // Day 1's two screens have no content yet, but they do have About copy, so they
  // carry the button in the same corner the built ones put it. Inside a .nnm-stack
  // like every built screen, which is what supplies the 9px above the top row and
  // the full width the button is pushed to the right edge of — without it the
  // row is a shrink-to-fit flex item with no free space to justify into, and the
  // button sits on the LEFT.
  const blankStack = document.createElement("div");
  blankStack.className = "nnm-stack";
  const blankHead = document.createElement("div");
  blankHead.className = "nnm-blankhead";
  blankHead.appendChild(makeAboutButton());
  blankStack.appendChild(blankHead);
  wrap.appendChild(blankStack);

  // Polite live region for screen-reader announcements. Call SIM.announce("...")
  // from anywhere in the interactive.
  const liveAnnounce = document.createElement("div");
  liveAnnounce.className = "sr-only";
  liveAnnounce.setAttribute("aria-live", "polite");
  liveAnnounce.setAttribute("aria-atomic", "true");
  wrap.appendChild(liveAnnounce);
  SIM._suppressAnnounce = false;
  SIM.announce = function(msg) {
    if (SIM._suppressAnnounce) return;
    liveAnnounce.textContent = "";
    requestAnimationFrame(() => { liveAnnounce.textContent = msg; });
  };

  // Handles invalidateSimCache() tears down when the sim is switched.
  SIM._timeouts = [];
  SIM._observers = [];

  return wrap;
}

  function applyDemoBtnStyle(btn, simKey, isActive) {
    const simData = SIMS[simKey];
    const theme = simData && simData.theme;
    if (theme) {
      btn.style.borderWidth = "2px";
      if (isActive) {
        btn.style.background = theme.btnActive;
        btn.style.color = theme.titleText;
        btn.style.borderColor = theme.btnBorder;
      } else {
        btn.style.background = theme.surface;
        btn.style.color = theme.titleText;
        btn.style.borderColor = theme.btnBorder;
      }
    } else {
      btn.style.borderWidth = "2px";
      if (isActive) {
        btn.style.background = "#d0d0d0";
        btn.style.color = "#333";
        btn.style.borderColor = "#555";
      } else {
        btn.style.background = "#fff";
        btn.style.color = "#333";
        btn.style.borderColor = "#555";
      }
    }
  }

  sims.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "toggle-btn" + (activeSim === s.key ? " active" : "");
    btn.setAttribute("aria-pressed", activeSim === s.key ? "true" : "false");
    btn.dataset.simKey = s.key;
    btn.textContent = s.label.toUpperCase();
    const simData = SIMS[s.key];
    if (simData && simData.titleFont) btn.style.fontFamily = simData.titleFont;
    if (simData && simData.titleLetterSpacing) btn.style.letterSpacing = simData.titleLetterSpacing;
    if (simData && simData.titleOffset) { btn.innerHTML = '<span style="position:relative;top:' + simData.titleOffset + '">' + btn.textContent + '</span>'; }
    btn.style.fontSize = "24px";
    btn.style.fontWeight = "700";
    btn.style.padding = "8px 10px";
    btn.style.minHeight = "50px";
    applyDemoBtnStyle(btn, s.key, activeSim === s.key);

    const theme = simData && simData.theme;
    btn.addEventListener("mouseenter", () => {
      if (btn.classList.contains("active")) return;
      btn.style.background = theme ? theme.btnHover : "#f0f0f0";
    });
    btn.addEventListener("mouseleave", () => {
      if (btn.classList.contains("active")) return;
      btn.style.background = theme ? theme.surface : "#fff";
    });
    btn.addEventListener("mousedown", () => {
      if (btn.classList.contains("active")) return;
      btn.style.background = theme ? theme.btnActive : "#d0d0d0";
    });
    btn.addEventListener("mouseup", () => {
      if (btn.classList.contains("active")) return;
      btn.style.background = theme ? theme.btnHover : "#f0f0f0";

    btn.addEventListener("click", () => {
      if (activeSim === s.key) return;

      invalidateSimCache();
      simBtns.querySelectorAll(".toggle-btn").forEach(b => {
        b.classList.remove("active");
        b.setAttribute("aria-pressed", "false");
        applyDemoBtnStyle(b, b.dataset.simKey, false);
      });
      btn.classList.add("active");
      btn.setAttribute("aria-pressed", "true");
      applyDemoBtnStyle(btn, s.key, true);
      document.querySelectorAll("[data-sim]").forEach(b => {
        b.classList.toggle("active", b.dataset.sim === s.key);

      rebuildDemoContent(demoWrap, simBtns);
    });

  });
  demoWrap.appendChild(simBtns);

  // Append buttons first so we can measure
  demoRow.appendChild(simBtns);

  container.appendChild(demoWrap);

  // Equalize button widths to the widest

  // Sim content (TD/Standalone: responsive 768–1024 x 562)

  if (SIM.onResize) SIM.onResize();
}

  const simBtnsActualW = measuredBtnW + 24;
  const availW = window.innerWidth - simBtnsActualW - demoPad - standaloneBorder;
  const demoContentW = Math.floor(Math.max(standaloneMin, Math.min(standaloneMax, availW)));

  const content = document.createElement("div");
  content.className = "content-area standalone";
  content.setAttribute("role", "main");
  content.style.width = demoContentW + "px";
  content.style.height = "562px";
  applySimTheme(content);
  { const tb = getSimTitleBar(); if (tb) content.appendChild(tb); }
  const sc = getSimContent();
  if (sc) content.appendChild(sc);

  contentCol.appendChild(content);
  if (SIM.onResize) SIM.onResize();
}

    b.setAttribute("aria-pressed", b.dataset.layout === activeLayout ? "true" : "false");
  });

  buildViewport();
}

function buildViewport() {
  if (demoMode) { buildDemoView(); return; }
  const device = DEVICES[activeDevice];
  const layout = LAYOUTS[activeLayout];
  const container = document.getElementById("viewportContainer");
  const info = document.getElementById("viewportInfo");
  // Detach cached sim elements before clearing container so they survive
  if (_simTitleBar && _simTitleBar.parentNode) _simTitleBar.remove();
  if (_simContent && _simContent.parentNode) _simContent.remove();
  container.innerHTML = "";
  container.style.paddingTop = "";
  container.style.alignSelf = "";
  container.style.maxWidth = "";
  container.style.overflow = "";
  document.body.style.background = "";
  document.body.classList.remove("teal-bg");
  document.body.style.overflow = "";
  document.body.style.paddingRight = "0";
  const wrapperEl = document.querySelector(".viewport-wrapper");
  if (wrapperEl) { wrapperEl.style.overflow = ""; wrapperEl.style.borderColor = ""; }
  const bwLabel = document.getElementById("browserWidthLabel");
  if (bwLabel) { bwLabel.style.color = ""; bwLabel.style.zIndex = ""; bwLabel.style.background = "rgba(0,0,0,0.15)"; }
  document.querySelectorAll(".btn-column-label").forEach(el => el.style.color = "");
  const demoHr = document.querySelector(".btn-column hr");
  if (demoHr) demoHr.style.borderColor = "";
  const msTitle = document.getElementById("app-title");
  if (msTitle) msTitle.style.color = "";
  info.style.textAlign = "";
  info.style.alignSelf = "";
  info.style.minWidth = "";

  // Update browser width label
  const bwEl = document.getElementById("browserWidthValue");
  const bwWrapper = document.querySelector(".viewport-wrapper");
  if (bwEl && bwWrapper) bwEl.textContent = Math.round(window.innerWidth - bwWrapper.getBoundingClientRect().left) + "px";

  const isNoLimit = activeDevice === "none";
  const availW = isNoLimit ? (layout.hasAP ? AP_WIDTH : 1200) : device.screenW;
  const availH = isNoLimit ? 700 : device.screenH - device.topChrome - device.bottomChrome;

  // Content width
  let contentW;
  if (activeLayout === "ap-2col") {
    // 28 left margin + sidebar + 10 right margin + 1 border + content + 1 border + 26 right margin = 1100
    contentW = sidebarExpanded ? AP_CONTENT_W_EXPANDED : AP_CONTENT_W_COLLAPSED;
  } else if (activeLayout === "ap-full") {
    contentW = 1044;
  } else {
    contentW = 1024;
  }

  const contentH = AP_CONTENT_H;

  // Info line
  if (isNoLimit) {
    info.innerHTML = `<strong>Teacher Desktop / ${layout.name}</strong><br><strong>Content:</strong> ${contentW}w × ${contentH}h`;
  } else {
    const wrapperClientW = document.querySelector(".viewport-wrapper").clientWidth;
    const frameAvailW = (activeDevice === "chromebook") ? Math.min(device.screenW, wrapperClientW) : device.screenW;
    info.innerHTML = `<strong>${device.name} / ${layout.name}</strong><br><strong>Screen:</strong> ${device.screenW}w × ${device.screenH}h • <strong>Available:</strong> ${frameAvailW}w × ${availH}h • <strong>Content:</strong> ${contentW}w × ${contentH}h`;
    // Label freeze when frame is clipped
    if (wrapperClientW < device.screenW) {
      info.style.alignSelf = "flex-start";
      const infoMinW = (activeDevice === "chromebook") ? Math.max(frameAvailW, 1100) : device.screenW;
      info.style.minWidth = infoMinW + "px";
    }
  }

  // Device frame
  const frame = document.createElement("div");
  frame.className = "device-frame" + (isNoLimit ? " no-limit" : "");

  if (isNoLimit && layout.hasAP) {
    // Teacher Desktop + AP: white page, full height, no border
    document.body.style.background = "#0481A0";
    document.body.classList.add("teal-bg");
    document.querySelectorAll(".btn-column-label").forEach(el => el.style.color = "#fff");
    const demoHrAP = document.querySelector(".btn-column hr");
    if (demoHrAP) demoHrAP.style.borderColor = "#fff";
    const msTitle = document.getElementById("app-title");
    if (msTitle) msTitle.style.color = "#fff";
    const bwLabelAP = document.getElementById("browserWidthLabel");
    if (bwLabelAP) { bwLabelAP.style.zIndex = "10"; bwLabelAP.style.background = "rgba(255,255,255,0.5)"; }
    const wrapperAP = document.querySelector(".viewport-wrapper");
    if (wrapperAP) wrapperAP.style.borderColor = "#fff";
    frame.classList.remove("no-limit");
    frame.style.width = AP_WIDTH + "px";
    frame.style.border = "none";
    frame.style.background = "#fff";
    frame.style.borderRadius = "0";
    frame.style.margin = "0 auto";
    frame.style.height = "100vh";
    frame.style.overflow = "hidden";
    frame.style.marginTop = "-" + container.getBoundingClientRect().top + "px";
    frame.style.paddingTop = container.getBoundingClientRect().top + "px";
    document.body.style.overflow = "hidden";
  } else if (isNoLimit) {
    const frameW = 1200;
    const frameH = 700;
    frame.style.width = frameW + "px";
    frame.style.height = frameH + "px";
  } else {
    container.style.maxWidth = "100%";
    const wrapperForOverflow = document.querySelector(".viewport-wrapper");
    const deviceFrameW = (activeDevice === "chromebook")
      ? Math.min(device.screenW, wrapperForOverflow ? wrapperForOverflow.clientWidth : device.screenW)
      : device.screenW;
    frame.style.width = deviceFrameW + "px";
    frame.style.height = device.screenH + "px";
    frame.style.margin = "0 -2px";
    if (wrapperForOverflow) wrapperForOverflow.style.overflow = "hidden";
    if (activeDevice !== "chromebook") {
      frame.style.boxShadow = "0 2px 12px rgba(0, 0, 0, 0.3)";
    }
  }

  // Top chrome
  if (!isNoLimit && device.topChrome > 0) {
    const top = document.createElement("div");
    top.className = "chrome-top";
    top.style.height = device.topChrome + "px";
    top.setAttribute("data-label", device.topLabel);

    frame.appendChild(top);
  }

  // Viewport area
  const viewport = document.createElement("div");
  viewport.className = "viewport-area";
  viewport.style.alignItems = "flex-start";
  if (isNoLimit && layout.hasAP) {
    viewport.style.height = "auto";
    viewport.style.minHeight = "100%";
    viewport.style.background = "#ededed";
  } else {
    viewport.style.height = availH + "px";
  }

  if (layout.hasAP) {
