          const availLato = pw - (latoW * 2) - crossW - (fullGap * 4);
          const szLato = Math.max(CIRCLE_MIN, Math.min(CIRCLE_MAX, Math.floor(availLato / 2)));

          if (szLato > CIRCLE_MIN) {
            const t = (szLato - CIRCLE_MIN) / (CIRCLE_MAX - CIRCLE_MIN);
            const gap = Math.max(minGap, Math.round(minGap + t * (fullGap - minGap)));
            const crossFontSize = Math.round(20 + t * (24 - 20));
            parents.style.gap = gap + "px";
            cross.style.fontSize = crossFontSize + "px";
            parents.querySelectorAll(".sim-parent-group").forEach(g => { g.style.flex = ""; });
            triggers.forEach(tr => {
              const dd = tr.closest(".sim-dropdown");
              if (dd.classList.contains("locked")) return;
              tr.style.width = tr._defaultW + "px";
              tr.style.padding = "";
              tr.style.gap = "";
              const caret = tr.querySelector(".sim-dropdown-caret");
              if (caret) { caret.style.width = ""; caret.style.height = ""; }
              tr.style.fontWeight = "";
              dd.style.fontFamily = "";
              const selItem = dd.querySelector(".sim-dropdown-item.selected");
              if (selItem) selItem.style.fontWeight = "";
            });
            circle1.style.width = szLato + "px"; circle1.style.height = szLato + "px";
            circle2.style.width = szLato + "px"; circle2.style.height = szLato + "px";
            return;
          }

          // Phase 2: circles at minimum (42px) — switch to Roboto Condensed, use min gap
          parents.style.gap = minGap + "px";
          cross.style.fontSize = "20px";
          parents.querySelectorAll(".sim-parent-group").forEach(g => {
            g.style.flex = g.classList.contains("locked") ? "" : "none";
          });
          circle1.style.width = CIRCLE_MIN + "px"; circle1.style.height = CIRCLE_MIN + "px";
          circle2.style.width = CIRCLE_MIN + "px"; circle2.style.height = CIRCLE_MIN + "px";

          // Space available for the two dropdowns after circles, cross, and gaps are placed
          const fixedSpace = CIRCLE_MIN * 2 + crossW + (minGap * 4);
          const ddBudget = Math.floor((pw - fixedSpace) / 2);
          const ddW = Math.max(condensedW, Math.min(latoW, ddBudget));

          const useCondensed = ddW < latoW;
          const ddT = latoW > condensedW ? (ddW - condensedW) / (latoW - condensedW) : 0;
          triggers.forEach(t => {
            const dd = t.closest(".sim-dropdown");
            if (dd.classList.contains("locked")) {
              return;
            }
            const ddPadL = Math.round(7 + ddT * (10 - 7));
            const ddPadR = Math.round(5 + ddT * (10 - 5));
            const ddGap = Math.round(0 + ddT * (6 - 0));
            const caretSize = Math.round(18 + ddT * (24 - 18));
            t.style.width = ddW + "px";
            t.style.padding = "8px " + ddPadR + "px 8px " + ddPadL + "px";
            t.style.gap = ddGap + "px";
            const caret = t.querySelector(".sim-dropdown-caret");
            if (caret) { caret.style.width = caretSize + "px"; caret.style.height = caretSize + "px"; }
            t.style.fontWeight = useCondensed ? "500" : "";
            dd.style.fontFamily = useCondensed ? "'Roboto Condensed',sans-serif" : "";
            const selItem = dd.querySelector(".sim-dropdown-item.selected");
            if (selItem) selItem.style.fontWeight = useCondensed ? "500" : "";
          });
        }
        SIM.updateCircleSize = updateCircleSize;

        inner.appendChild(parents);

        // Stats label straddling the border between parents and offspring
        const statsWrap = document.createElement("div");
        statsWrap.className = "sim-stats-wrap";
        const statsLabel = document.createElement("div");
        statsLabel.className = "sim-stats";
        statsLabel.innerHTML = "Select two parents to begin";
        statsWrap.style.display = "none";
        statsWrap.appendChild(statsLabel);
        inner.appendChild(statsWrap);

        // Middle: Offspring section (scrollable)
        const offspring = document.createElement("div");
        offspring.className = "sim-offspring";
        offspring.setAttribute("role", "region");
        offspring.setAttribute("aria-label", "Offspring");
        function updateOffspringTabindex() {
          if (offspring.scrollHeight > offspring.clientHeight) {
            offspring.setAttribute("tabindex", "0");
          } else {
            offspring.removeAttribute("tabindex");
          }
        }
        const placeholder = document.createElement("div");
        placeholder.className = "sim-offspring-placeholder";
        placeholder.innerHTML = "Each cross will produce 5\u201320 offspring.";
        placeholder.style.display = "none";
        offspring.appendChild(placeholder);

        function updateStatsLabel() {
          const trial = SIM.selectedTrial;
          const st = SIM.trialState[trial];
          if (!st || !st.p1 || !st.p2) {
            statsWrap.style.display = "none";
            parents.classList.remove("has-stats");
            return;
          }
          statsWrap.style.display = "";
          parents.classList.add("has-stats");
          if (st.p1 && st.p2 && st.generations.length === 0) {
            let text = "Click <b>Cross Plants</b> to see their offspring";
            if (st.fungusAfterGen !== null) text += " · Fungus active";
            statsLabel.innerHTML = text;
            const ph = offspring.querySelector(".sim-offspring-placeholder");
            if (ph) ph.style.display = "";
            return;
          }
          const crosses = st.generations.length;
          const total = st.generations.reduce((sum, gen) => sum + gen.length, 0);
          let text = "Crosses: " + crosses + " · Offspring: " + total;
          if (st.fungusAfterGen !== null) text += " · Fungus active";
          statsLabel.innerHTML = text;
        }
        SIM.updateStatsLabel = updateStatsLabel;

        const offspringWrap = document.createElement("div");
        offspringWrap.className = "sim-offspring-wrap";
        offspringWrap.appendChild(offspring);
        const offspringFocusRing = document.createElement("div");
        offspringFocusRing.className = "scroll-focus-ring";
        offspringWrap.appendChild(offspringFocusRing);
        inner.appendChild(offspringWrap);
        requestAnimationFrame(updateOffspringTabindex);

        // Track selected generation per trial
        SIM.selectedGen = {};

        // Render offspring for a given trial
        function updateGenRowTabindex() {
          const rows = Array.from(offspring.querySelectorAll(".gen-row"));
          if (rows.length === 0) return;
          const trial = SIM.selectedTrial;
          const selIdx = SIM.selectedGen[trial];
          // If a row is selected, it gets tabindex="0"; otherwise first row does
          const activeIdx = (selIdx !== null && selIdx >= 0 && selIdx < rows.length) ? selIdx : 0;
          rows.forEach((r, i) => r.setAttribute("tabindex", i === activeIdx ? "0" : "-1"));
        }

        function renderOffspring(trial) {
          const st = SIM.trialState[trial];
          if (trial !== SIM.selectedTrial) return;
          offspring.innerHTML = "";
          if (!st || (st.generations.length === 0 && st.fungusAfterGen === null)) {
            offspring.classList.remove("has-plants");
            const ph = document.createElement("div");
            ph.className = "sim-offspring-placeholder";
            ph.innerHTML = "Each cross will produce 5\u201320 offspring.";
            if (st && st.p1 && st.p2) ph.style.display = "";
            else ph.style.display = "none";
            offspring.appendChild(ph);
            SIM.selectedGen[trial] = null;
            requestAnimationFrame(updateOffspringTabindex);
            return;
          }
          offspring.classList.add("has-plants");

          // Fungus introduced before any crosses
          if (st.fungusAfterGen === 0) {
            const divider = document.createElement("div");
            divider.className = "fungus-divider";
            const dlbl = document.createElement("span");
            dlbl.className = "fungus-divider-label";
            dlbl.textContent = "Fungus introduced before crossing";
            divider.appendChild(dlbl);
            offspring.appendChild(divider);
          }

          st.generations.forEach((genPlants, gi) => {
            // Insert fungus divider after the generation it was introduced
            if (st.fungusAfterGen !== null && st.fungusAfterGen > 0 && gi === st.fungusAfterGen) {
              const divider = document.createElement("div");
              divider.className = "fungus-divider";
              const dlbl = document.createElement("span");
              dlbl.className = "fungus-divider-label";
              dlbl.textContent = "Fungus introduced after G" + st.fungusAfterGen;
              divider.appendChild(dlbl);
              offspring.appendChild(divider);
            }

            const row = document.createElement("div");
            row.className = "gen-row";
            row.setAttribute("role", "button");
            const genInf = genPlants.filter(p => p.infected).length;
            const genH = genPlants.length - genInf;
            row.setAttribute("aria-label", "Generation " + (gi + 1) + ", " + genPlants.length + " offspring, " + genH + " healthy, " + genInf + " infected");
            // Roving tabindex: only selected row (or first row) gets tabindex="0"
            const isSelected = SIM.selectedGen[trial] === gi;
            if (isSelected) row.classList.add("selected");
            row.setAttribute("tabindex", "-1");
            row.addEventListener("click", () => {
              if (SIM.selectedGen[trial] === gi) {
                SIM.selectedGen[trial] = null;
              } else {
                SIM.selectedGen[trial] = gi;
              }
              const rows = offspring.querySelectorAll(".gen-row");
              rows.forEach((r, ri) => {
                r.classList.toggle("selected", SIM.selectedGen[trial] === ri);
                r.setAttribute("aria-pressed", SIM.selectedGen[trial] === ri ? "true" : "false");
              });
              // Update roving tabindex
              updateGenRowTabindex();
              if (SIM.updateDataPanel) SIM.updateDataPanel();
            });
            row.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                row.click();
              } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                e.preventDefault();
                const rows = Array.from(offspring.querySelectorAll(".gen-row"));
                const cur = rows.indexOf(row);
                const next = e.key === "ArrowDown"
                  ? (cur + 1) % rows.length
                  : (cur - 1 + rows.length) % rows.length;
                rows[cur].setAttribute("tabindex", "-1");
                rows[next].setAttribute("tabindex", "0");
                rows[next].focus();
              } else if (e.key === "Home") {
                e.preventDefault();
                const rows = Array.from(offspring.querySelectorAll(".gen-row"));
                rows.forEach(r => r.setAttribute("tabindex", "-1"));
                rows[0].setAttribute("tabindex", "0");
                rows[0].focus();
              } else if (e.key === "End") {
                e.preventDefault();
                const rows = Array.from(offspring.querySelectorAll(".gen-row"));
                rows.forEach(r => r.setAttribute("tabindex", "-1"));
                rows[rows.length - 1].setAttribute("tabindex", "0");
                rows[rows.length - 1].focus();
              }
            });
            row.setAttribute("aria-pressed", isSelected ? "true" : "false");
            const lbl = document.createElement("div");
            lbl.className = "gen-label";
            lbl.innerHTML = "G" + (gi + 1) + "<br><span style='font-weight:400'>(" + genPlants.length + ")</span>";
            row.appendChild(lbl);
            const plantsWrap = document.createElement("div");
            plantsWrap.className = "gen-plants";
            genPlants.forEach(pl => {
              const cell = document.createElement("div");
              cell.className = "offspring-plant";
              cell.setAttribute("aria-hidden", "true");
              cell.innerHTML = bananaTreeSVG;
              if (pl.infected) {
                cell.classList.add("infected");
              }
              plantsWrap.appendChild(cell);
            });
            row.appendChild(plantsWrap);
            offspring.appendChild(row);
          });

          // Set initial roving tabindex
          updateGenRowTabindex();

          // Max crosses label after G25
          if (st.generations.length >= MAX_GENERATIONS) {
            const maxLabel = document.createElement("div");
            maxLabel.className = "sim-offspring-placeholder";
            maxLabel.textContent = "Max crosses reached";
            maxLabel.style.margin = "6px 0";
            maxLabel.style.padding = "2px 0";
            offspring.appendChild(maxLabel);
          }

          // Fungus divider at the end if introduced after last generation
          if (st.fungusAfterGen !== null && st.fungusAfterGen === st.generations.length && st.generations.length > 0) {
            const divider = document.createElement("div");
            divider.className = "fungus-divider";
            const dlbl = document.createElement("span");
            dlbl.className = "fungus-divider-label";
            dlbl.textContent = "Fungus introduced after G" + st.fungusAfterGen;
            divider.appendChild(dlbl);
            offspring.appendChild(divider);
          }

          // Scroll position set by caller when needed
          requestAnimationFrame(updateOffspringTabindex);
        }
        SIM.renderOffspring = renderOffspring;

        // Bottom: Buttons
        const buttons = document.createElement("div");
        buttons.className = "sim-buttons";
        ["Cross Plants", "Introduce Fungus", "Reset Trial"].forEach(label => {
          const btn = document.createElement("button");
          btn.className = "sim-btn";
          const iconMap = {
            "Cross Plants": "icons/Cross ICON.svg",
            "Introduce Fungus": "icons/Add Fungus ICON.svg",
            "Reset Trial": "icons/Reset ICON.svg"
          };
          if (iconMap[label]) {
            const icon = document.createElement("img");
            icon.src = iconMap[label];
            icon.alt = "";
            icon.setAttribute("aria-hidden", "true");
            btn.appendChild(icon);
            const span = document.createElement("span");
            span.className = "sim-btn-label";
            span.textContent = label;
            btn.appendChild(span);
          } else {
            btn.textContent = label;
          }
          if (label === "Cross Plants") {
            btn.setAttribute("aria-disabled", "true");
            SIM.crossBtn = btn;
            btn.addEventListener("click", () => {
              if (btn.getAttribute("aria-disabled") === "true") return;
              const trial = SIM.selectedTrial;
              const st = SIM.trialState[trial];
              if (st && st.p1 && st.p2 && st.generations.length < MAX_GENERATIONS) {
                st.locked = true;
                // Lock dropdowns
                parents.querySelectorAll(".sim-dropdown").forEach(d => d._lock());
                const count = OFFSPRING_MIN + Math.floor(Math.random() * (OFFSPRING_MAX - OFFSPRING_MIN + 1));
                const isFungusActive = st.fungusAfterGen !== null && st.generations.length >= st.fungusAfterGen;
                // Mendelian genetics: R = resistant (dominant), r = susceptible (recessive)
                const genotypes = {
                  "Wild W1": ["R", "R"],
                  "Wild W2": ["R", "r"],
                  "Wild W3": ["R", "r"],
                  "Cavendish C1": ["r", "r"],
                  "Cavendish C2": ["r", "r"]
                };
                const g1 = genotypes[st.p1];
                const g2 = genotypes[st.p2];
                const plants = [];
                for (let p = 0; p < count; p++) {
                  const a1 = g1[Math.floor(Math.random() * 2)];
                  const a2 = g2[Math.floor(Math.random() * 2)];
                  const isResistant = a1 === "R" || a2 === "R";
                  plants.push({ infected: isFungusActive && !isResistant });
                }
                st.generations.push(plants);
                const healthy = plants.filter(p => !p.infected).length;
                const infected = plants.filter(p => p.infected).length;
                if (SIM.announce) SIM.announce("Generation " + st.generations.length + ": " + plants.length + " offspring, " + healthy + " healthy, " + infected + " infected.");
                if (SIM.updateTrialCardLabel) SIM.updateTrialCardLabel(trial);
                renderOffspring(trial);
                offspring.scrollTop = offspring.scrollHeight;
                SIM.updateSimButtons();
              }
            });
          }
          if (label === "Introduce Fungus") {
            btn.setAttribute("aria-disabled", "true");
            SIM.fungusBtn = btn;
            btn.addEventListener("click", () => {
              if (btn.getAttribute("aria-disabled") === "true") return;
              const trial = SIM.selectedTrial;
              const st = SIM.trialState[trial];
              if (st && st.fungusAfterGen === null) {
                st.fungusAfterGen = st.generations.length;
                if (SIM.announce) SIM.announce("Fungus introduced.");
                if (SIM.updateTrialCardLabel) SIM.updateTrialCardLabel(trial);
                renderOffspring(trial);
                SIM.updateSimButtons();
                if (SIM.updateDataPanel) SIM.updateDataPanel();
              }
            });
          }
          if (label === "Reset Trial") {
            btn.setAttribute("aria-disabled", "true");
            SIM.resetBtn = btn;
            btn.addEventListener("click", () => {
              if (btn.getAttribute("aria-disabled") === "true") return;
              const trial = SIM.selectedTrial;
              if (SIM.trialState[trial]) {
                SIM.trialState[trial] = { p1: null, p2: null, locked: false, generations: [], fungusAfterGen: null };
                if (SIM.updateTrialCardLabel) SIM.updateTrialCardLabel(trial);
                if (SIM.syncDropdownsToTrial) SIM.syncDropdownsToTrial(trial);
                renderOffspring(trial);
                SIM.updateSimButtons();
              }
            });
          }
          buttons.appendChild(btn);
        });
        inner.appendChild(buttons);

        // Update button disabled states based on current trial
        SIM.updateSimButtons = function() {
          const trial = SIM.selectedTrial;
          const st = SIM.trialState[trial];
          if (!st) return;
          // Cross Plants: enabled only when both parents selected
          if (SIM.crossBtn) SIM.crossBtn.setAttribute("aria-disabled", (!(st.p1 && st.p2) || st.generations.length >= MAX_GENERATIONS) ? "true" : "false");
          // Introduce Fungus: enabled when both parents selected and not already introduced
          if (SIM.fungusBtn) {
            if (st.fungusAfterGen !== null) {
              SIM.fungusBtn.setAttribute("aria-disabled", "true");
            } else {
              SIM.fungusBtn.setAttribute("aria-disabled", (!(st.p1 && st.p2) || st.generations.length >= MAX_GENERATIONS) ? "true" : "false");
            }
          }
          // Reset Trial: enabled when at least one parent selected
          if (SIM.resetBtn) SIM.resetBtn.setAttribute("aria-disabled", (!(st.p1 || st.p2 || st.generations.length > 0)) ? "true" : "false");
          // Update stats label and data panel
          updateStatsLabel();
          if (SIM.updateDataPanel) SIM.updateDataPanel();
        };

        panel.appendChild(inner);
      }

      // Data panel content
      if (p.name === "Data") {
        const dataInner = document.createElement("div");
        dataInner.className = "data-panel-inner";

        // --- Top half: Pie Chart ---
        const topHalf = document.createElement("div");
        topHalf.className = "data-half pie-chart";
        const pieTitle = document.createElement("div");
        pieTitle.className = "data-chart-title";
        pieTitle.innerHTML = "Offspring Phenotypes:<br>All Generations";
        topHalf.appendChild(pieTitle);
        const pieChartBody = document.createElement("div");
        pieChartBody.className = "data-chart-body";
        const dpr = window.devicePixelRatio || 1;
        const pieCanvas = document.createElement("canvas");
        pieCanvas.width = 160 * dpr;
        pieCanvas.height = 103 * dpr;
        pieCanvas.style.width = "160px";
        pieCanvas.style.height = "103px";
        pieCanvas.setAttribute("role", "img");
        pieCanvas.setAttribute("aria-label", "Pie chart showing offspring phenotype percentages");
        pieChartBody.appendChild(pieCanvas);
        topHalf.appendChild(pieChartBody);
        const pieLegend = document.createElement("div");
        pieLegend.className = "data-chart-legend";
        pieLegend.innerHTML =
          '<span class="data-legend-item">' +
            '<span class="data-legend-label"><span class="data-legend-swatch" style="background:#C2C2C2"></span>Healthy</span>' +
            '<span class="data-legend-pct" id="pie-pct-healthy">\u2013</span>' +
          '</span>' +
          '<span class="data-legend-item">' +
            '<span class="data-legend-label"><span class="data-legend-swatch" style="background:#444"></span>Infected</span>' +
            '<span class="data-legend-pct" id="pie-pct-infected">\u2013</span>' +
          '</span>';
        topHalf.appendChild(pieLegend);
        dataInner.appendChild(topHalf);

        // Divider
        const divider = document.createElement("div");
        divider.className = "data-divider";
        dataInner.appendChild(divider);

        // --- Bottom half: Line Graph ---
        const bottomHalf = document.createElement("div");
        bottomHalf.className = "data-half line-graph";
        const lineTitle = document.createElement("div");
        lineTitle.className = "data-chart-title";
        lineTitle.innerHTML = "<span style='white-space:nowrap'>Fungus Resistance</span> over<br>All Generations";
        bottomHalf.appendChild(lineTitle);
        const lineChartBody = document.createElement("div");
        lineChartBody.className = "data-chart-body";
        const lineCanvas = document.createElement("canvas");
        lineCanvas.style.width = "100%";
        lineCanvas.style.height = "148px";
        lineCanvas.setAttribute("role", "img");
        lineCanvas.setAttribute("aria-label", "Line graph showing fungus resistance over generations");
        lineChartBody.appendChild(lineCanvas);
        bottomHalf.appendChild(lineChartBody);
        const lineLegend = document.createElement("div");
        lineLegend.className = "data-chart-legend";
        lineLegend.innerHTML =
          '<span class="data-legend-item">' +
            '<span class="data-legend-label">' +
              '<span class="line-legend-icon" style="display:inline-flex;align-items:center;justify-content:center;width:39px;height:16px;position:relative;flex-shrink:0;overflow:hidden">' +
                '<span style="position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:#808080"></span>' +
                '<span style="width:16px;height:16px;border-radius:50%;background:#808080;position:relative;flex-shrink:0"></span>' +
              '</span>Healthy</span>' +
          '</span>' +
          '<span class="data-legend-item">' +
            '<span class="data-legend-label">' +
              '<span class="line-legend-icon" style="display:inline-flex;align-items:center;justify-content:center;width:39px;height:16px;position:relative;flex-shrink:0;overflow:hidden">' +
                '<span style="position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:repeating-linear-gradient(to right,#444 0,#444 3px,transparent 3px,transparent 6px)"></span>' +
                '<span style="width:16px;height:16px;border-radius:50%;background:#444;position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center"><span style="width:6px;height:6px;border-radius:50%;background:#fff"></span></span>' +
              '</span>Infected</span>' +
          '</span>';
        bottomHalf.appendChild(lineLegend);
        dataInner.appendChild(bottomHalf);

        panel.appendChild(dataInner);

        // --- Data update function ---
        SIM.updateDataPanel = function() {
          if (SIM.updateCircleSize) SIM.updateCircleSize();
          // Adjust legend gaps and line icon width based on panel width
          const panelW = panel.clientWidth;
          const gapVal = Math.max(4, Math.min(20, Math.round((panelW - 150) * (20 - 4) / (285 - 150) + 4)));
          pieLegend.style.gap = gapVal + "px";
          lineLegend.style.gap = gapVal + "px";
          let iconW = 39;
          if (panelW < 250) {
            iconW = Math.max(16, Math.round((panelW - 190) * (39 - 16) / (250 - 190) + 16));
          }
          lineLegend.querySelectorAll(".line-legend-icon").forEach(el => { el.style.width = iconW + "px"; });
          if (panelW < 230) {
            lineTitle.innerHTML = "Fungus Resistance<br>over All Generations";
          } else {
            lineTitle.innerHTML = "Fungus Resistance over<br>All Generations";
          }

          const trial = SIM.selectedTrial;
          const st = SIM.trialState[trial];
          if (!st) return;
          const selGen = SIM.selectedGen ? SIM.selectedGen[trial] : null;
          const hasSelection = selGen !== null && selGen !== undefined && st.generations[selGen];
          if (SIM.dataShowAllBtn) {
            SIM.dataShowAllBtn.style.display = hasSelection ? "flex" : "none";
          }
          const aboutBtn = document.querySelector(".sim-info-btn");
          if (aboutBtn) {
            aboutBtn.classList.toggle("compact-hit", !!hasSelection);
          }

          // Compute stats
          let plants = [];
          if (hasSelection) {
            plants = st.generations[selGen];
            pieTitle.innerHTML = "Offspring Phenotypes:<br>G" + (selGen + 1) + " <span style=\"font-weight:400\">(" + plants.length + " offspring)</span>";
          } else if (st.generations.length > 0) {
            plants = st.generations.flat();
            pieTitle.innerHTML = "Offspring Phenotypes:<br>All Generations";
          } else {
            pieTitle.innerHTML = "Offspring Phenotypes:<br>All Generations";
          }

          const total = plants.length;
          const infected = plants.filter(p => p.infected).length;
          const healthy = total - infected;

          // Update legend percentages
          const pctHealthyEl = document.getElementById("pie-pct-healthy");
          const pctInfectedEl = document.getElementById("pie-pct-infected");
          if (total === 0) {
            if (pctHealthyEl) pctHealthyEl.textContent = "\u2013";
            if (pctInfectedEl) pctInfectedEl.textContent = "\u2013";
          } else {
            const hPct = Math.round((healthy / total) * 100);
            const iPct = 100 - hPct;
            if (pctHealthyEl) pctHealthyEl.textContent = hPct + "%";
            if (pctInfectedEl) pctInfectedEl.textContent = iPct + "%";
          }

          // --- Draw Pie ---
          const pCtx = pieCanvas.getContext("2d");
          pCtx.setTransform(1, 0, 0, 1, 0, 0);
          pCtx.clearRect(0, 0, pieCanvas.width, pieCanvas.height);
          pCtx.scale(dpr, dpr);
          const pw = 160, ph = 103;
          const cx = pw / 2, cy = ph / 2, r = Math.min(pw, ph) / 2 - 10;

          if (total === 0) {
            // Gray empty pie with "No data" label
            pCtx.beginPath();
            pCtx.arc(cx, cy, r, 0, Math.PI * 2);
            pCtx.fillStyle = "#e0e3e7";
            pCtx.fill();
            pCtx.fillStyle = "#333";
            pCtx.font = "16px Lato, sans-serif";
            pCtx.textAlign = "center";
            pCtx.textBaseline = "middle";
            pCtx.fillText("No data", cx, cy);
          } else {
            const hPct = Math.round((healthy / total) * 100);
            const iPct = 100 - hPct;
            const slices = [];
            if (healthy > 0) slices.push({ pct: healthy / total, color: "#C2C2C2", labelColor: "#333", label: hPct + "%" });
            if (infected > 0) slices.push({ pct: infected / total, color: "#444", labelColor: "#fff", label: iPct + "%" });

            let startAngle = -Math.PI / 2;
            slices.forEach(s => {
              const sweep = s.pct * 2 * Math.PI;
              pCtx.beginPath();
              pCtx.moveTo(cx, cy);
              pCtx.arc(cx, cy, r, startAngle, startAngle + sweep);
              pCtx.closePath();
              pCtx.fillStyle = s.color;
              pCtx.fill();

              // Label on slice
              const mid = startAngle + sweep / 2;
              let lx, ly;
              if (s.pct >= 1) {
                lx = cx;
                ly = cy;
              } else if (s.pct > 0.25) {
                const d = r * 0.45;
                lx = cx + d * Math.cos(mid);
                ly = cy + d * Math.sin(mid);
              } else {
                const d = r * (2 / 3);
                lx = cx + d * Math.cos(mid);
                ly = cy + d * Math.sin(mid);
              }
              if (s.pct > 0.08) {
                pCtx.fillStyle = s.labelColor;
                pCtx.font = "bold 16px Lato, sans-serif";
                pCtx.textAlign = "center";
                pCtx.textBaseline = "middle";
                pCtx.fillText(s.label, lx, ly);
              }
              startAngle += sweep;
            });
          }

          // --- Draw Line Graph ---
          const lCtx = lineCanvas.getContext("2d");
          const lw = lineChartBody.clientWidth || 260, lh = 148;
          lineCanvas.width = lw * dpr;
          lineCanvas.height = lh * dpr;
          lCtx.setTransform(1, 0, 0, 1, 0, 0);
          lCtx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
          lCtx.scale(dpr, dpr);

          const margin = { top: 25, right: 14, bottom: 32, left: 46 };
          const gw = lw - margin.left - margin.right;
          const gh = lh - margin.top - margin.bottom;

          // Y-axis gridlines & labels (always visible)
          lCtx.strokeStyle = "#949494";
          lCtx.lineWidth = 1;
          lCtx.fillStyle = "#333";
          lCtx.font = "16px 'Roboto Condensed', sans-serif";
          lCtx.textAlign = "right";
          lCtx.textBaseline = "middle";
          for (let i = 0; i <= 4; i++) {
            const y = margin.top + gh - (i / 4) * gh;
            lCtx.beginPath();
            lCtx.moveTo(margin.left, y);
            lCtx.lineTo(margin.left + gw, y);
            lCtx.stroke();
            lCtx.fillText((i * 25) + "%", margin.left - 11, y);
          }

          const gens = st.generations;
          if (gens.length === 0) {
            if (st.fungusAfterGen !== null) {
              const fx = margin.left;
              lCtx.strokeStyle = "#1565C0";
              lCtx.lineWidth = 2;
              lCtx.setLineDash([6, 4]);
              lCtx.beginPath();
              lCtx.moveTo(fx, margin.top);
              lCtx.lineTo(fx, margin.top + gh);
              lCtx.stroke();
              lCtx.setLineDash([]);
              lCtx.font = "bold 16px 'Roboto Condensed', sans-serif";
              const flagText = "Fungus";
              const tw = lCtx.measureText(flagText).width;
              const flagH = 22, flagPad = 4;
              const flagW = tw + flagPad * 2;
              const flagX = fx;
              const flagY = 22 - flagH;
              lCtx.fillStyle = "#1565C0";
              lCtx.beginPath();
              lCtx.moveTo(flagX, flagY);
              lCtx.lineTo(flagX + flagW, flagY);
              lCtx.lineTo(flagX + flagW, flagY + flagH);
              lCtx.lineTo(flagX, flagY + flagH);
              lCtx.closePath();
              lCtx.fill();
              lCtx.fillStyle = "#fff";
              lCtx.textAlign = "left";
              lCtx.textBaseline = "middle";
              lCtx.fillText(flagText, flagX + flagPad, flagY + flagH / 2);
            } else {
              lCtx.fillStyle = "#333";
              lCtx.font = "16px Lato, sans-serif";
              lCtx.textAlign = "center";
              lCtx.textBaseline = "middle";
              lCtx.fillText("No data", margin.left + gw / 2, margin.top + gh / 2);
            }
            return;
          }

          // X-axis labels
          lCtx.textAlign = "center";
          lCtx.textBaseline = "top";
          const xStep = gens.length > 1 ? gw / (gens.length - 1) : 0;

          // Show every Nth label to avoid overlap
          lCtx.font = "16px 'Roboto Condensed', sans-serif";
          const labelW = lCtx.measureText("G00").width + 4;
          const maxLabels = Math.max(1, Math.floor(gw / labelW));
          const labelStep = Math.ceil(gens.length / maxLabels);
          gens.forEach((_, gi) => {
            if (gi % labelStep !== 0 && gi !== gens.length - 1) return;
            const x = margin.left + (gens.length > 1 ? gi * xStep : gw / 2);
            lCtx.fillStyle = "#333";
            lCtx.fillText("G" + (gi + 1), x, margin.top + gh + 13);
          });

          // Compute healthy % per generation
          const healthyPcts = gens.map(g => {
            const t = g.length;
            const inf = g.filter(p => p.infected).length;
            return t > 0 ? ((t - inf) / t) * 100 : 100;
          });
          const infectedPcts = healthyPcts.map(h => 100 - h);

          // Fungus introduction marker
          if (st.fungusAfterGen !== null) {
            const fgi = st.fungusAfterGen;
            let fx;
            if (fgi === 0) {
              fx = margin.left;
            } else if (fgi >= gens.length) {
              fx = margin.left + gw;
            } else {
              fx = margin.left + (gens.length > 1 ? (fgi - 0.5) * xStep : gw / 2);
            }
            lCtx.strokeStyle = "#1565C0";
            lCtx.lineWidth = 2;
            lCtx.setLineDash([6, 4]);
            lCtx.beginPath();
            lCtx.moveTo(fx, margin.top);
            lCtx.lineTo(fx, margin.top + gh);
            lCtx.stroke();
            lCtx.setLineDash([]);

            // Flag label
            lCtx.font = "bold 16px 'Roboto Condensed', sans-serif";
            const flagText = "Fungus";
            const tw = lCtx.measureText(flagText).width;
            const flagH = 22, flagPad = 4;
            const flagW = tw + flagPad * 2;
            const flagX = fx;
            const flagY = 22 - flagH;
            lCtx.fillStyle = "#1565C0";
            lCtx.beginPath();
            lCtx.moveTo(flagX, flagY);
            lCtx.lineTo(flagX + flagW, flagY);
            lCtx.lineTo(flagX + flagW, flagY + flagH);
            lCtx.lineTo(flagX, flagY + flagH);
            lCtx.closePath();
            lCtx.fill();
            lCtx.fillStyle = "#fff";
            lCtx.textAlign = "left";
            lCtx.textBaseline = "middle";
            lCtx.fillText(flagText, flagX + flagPad, flagY + flagH / 2);
          }

          function drawLine(data, color, dashed, marker) {
            lCtx.strokeStyle = color;
            lCtx.lineWidth = 3;
            lCtx.setLineDash(dashed ? [3, 3] : []);
            lCtx.lineJoin = "round";
            lCtx.beginPath();
            data.forEach((val, i) => {
              const x = margin.left + (gens.length > 1 ? i * xStep : gw / 2);
              const y = margin.top + gh - (val / 100) * gh;
              if (i === 0) lCtx.moveTo(x, y);
              else lCtx.lineTo(x, y);
            });
            lCtx.stroke();
            lCtx.setLineDash([]);

            // Markers
            data.forEach((val, i) => {
              const x = margin.left + (gens.length > 1 ? i * xStep : gw / 2);
              const y = margin.top + gh - (val / 100) * gh;
              const baseR = Math.max(4, Math.min(8, xStep > 0 ? xStep * 0.35 : 8));
              const s = selGen === i ? baseR * 1.25 : baseR;
              lCtx.fillStyle = color;
              if (marker === "triangle") {
                lCtx.beginPath();
                lCtx.moveTo(x, y - s);
                lCtx.lineTo(x + s, y + s);
                lCtx.lineTo(x - s, y + s);
                lCtx.closePath();
                lCtx.fill();
              } else {
                lCtx.beginPath();
                lCtx.arc(x, y, s, 0, Math.PI * 2);
                lCtx.fill();
                if (dashed) {
                  lCtx.fillStyle = "#fff";
                  lCtx.beginPath();
                  lCtx.arc(x, y, s * 0.4, 0, Math.PI * 2);
                  lCtx.fill();
                  lCtx.fillStyle = color;
                }
              }
            });
          }

          drawLine(healthyPcts, "#808080", false, "circle");
          drawLine(infectedPcts, "#444", true, "circle");

          // Highlight selected generation
          if (selGen !== null && selGen !== undefined && selGen < gens.length) {
            const x = margin.left + (gens.length > 1 ? selGen * xStep : gw / 2);
            lCtx.fillStyle = "rgba(91, 155, 213, 0.15)";
            const bandW = gens.length > 1 ? Math.max(xStep * 0.6, 12) : 24;
            lCtx.fillRect(x - bandW / 2, margin.top, bandW, gh);
          }

          // Dynamic aria-labels for charts
          if (total === 0) {
            pieCanvas.setAttribute("aria-label", "Pie chart: no data");
            lineCanvas.setAttribute("aria-label", "Line graph: no data");
          } else {
            const hPctLabel = Math.round((healthy / total) * 100);
            const iPctLabel = 100 - hPctLabel;
            const genLabel = (selGen !== null && selGen !== undefined) ? "generation " + (selGen + 1) : "all generations";
            pieCanvas.setAttribute("aria-label", "Pie chart showing offspring phenotypes for " + genLabel + ": " + hPctLabel + "% healthy, " + iPctLabel + "% infected");
            const lastHealthy = Math.round(healthyPcts[healthyPcts.length - 1]);
            const lastInfected = 100 - lastHealthy;
            lineCanvas.setAttribute("aria-label", "Line graph showing fungus resistance over " + gens.length + " generation" + (gens.length > 1 ? "s" : "") + ". Latest: " + lastHealthy + "% healthy, " + lastInfected + "% infected");
          }
        };
      }

      panelWrap.appendChild(panel);

      // Title tab (overlays top of panel)
      const tab = document.createElement("div");
      tab.className = "sim-panel-tab";
      const tabLabel = document.createElement("h2");
      tabLabel.className = "sim-panel-tab-label";
      tabLabel.textContent = p.name;
      tab.appendChild(tabLabel);
      if (p.subtitle) {
        tab.style.border = "2px solid #555";
        tab.style.borderRight = "none";
        tab.style.borderRadius = "8px 0 0 8px";
        tab.style.position = "static";
        tab.style.transform = "none";
        tab.style.left = "";
        tab.style.height = "100%";
        const tabSub = document.createElement("div");
        tabSub.style.cssText = "display:flex;align-items:center;padding:0 12px 0 10px;background:#fff;height:100%;box-sizing:border-box;border:2px solid #555;border-left:none;border-radius:0 999px 999px 0;";
        const tabSubLabel = document.createElement("span");
        tabSubLabel.className = "sim-panel-tab-subtitle";
        tabSubLabel.textContent = p.subtitle;
        tabSub.appendChild(tabSubLabel);
        const tabWrap = document.createElement("div");
        tabWrap.className = "sim-tab-wrap";
        tabWrap.appendChild(tab);
        tabWrap.appendChild(tabSub);
        panelWrap.appendChild(tabWrap);
      } else
      if (p.name === "Data") {
        tab.style.position = "static";
        tab.style.transform = "none";
        tab.style.left = "";
        const tabWrap = document.createElement("div");
        tabWrap.style.cssText = "position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:36px;z-index:11;";
        tabWrap.appendChild(tab);
        const showAllBtn = document.createElement("button");
        showAllBtn.className = "data-show-all-btn";
        showAllBtn.textContent = "Show All";
        showAllBtn.addEventListener("click", () => {
          const trial = SIM.selectedTrial;
          const prevIdx = SIM.selectedGen ? SIM.selectedGen[trial] : null;
          if (SIM.selectedGen) SIM.selectedGen[trial] = null;
          if (SIM.renderOffspring) SIM.renderOffspring(trial);
          if (SIM.updateDataPanel) SIM.updateDataPanel();
          if (prevIdx !== null && prevIdx !== undefined) {
            const rows = document.querySelectorAll(".gen-row");
            const target = rows[prevIdx] || rows[0];
            if (target) target.focus();
          }
        });
        tabWrap.appendChild(showAllBtn);
        SIM.dataShowAllBtn = showAllBtn;
        panelWrap.appendChild(tabWrap);
      } else {
        panelWrap.appendChild(tab);
      }

      wrap.appendChild(panelWrap);
    });

    // Initial data panel render
    if (SIM.updateDataPanel) SIM.updateDataPanel();
    document.fonts.ready.then(() => {
      // Re-measure condensed dropdown width now that fonts are loaded
      const triggers = document.querySelectorAll(".sim-dropdown-trigger");
      if (triggers.length) {
        const m = document.createElement("span");
        m.style.cssText = "font-family:'Roboto Condensed',sans-serif;font-size:16px;visibility:hidden;position:absolute;white-space:nowrap;";
        document.body.appendChild(m);
        const opts = ["Wild W1", "Wild W2", "Wild W3", "Cavendish C1", "Cavendish C2"];
        let mxC = 0;
        opts.forEach(o => { m.textContent = o; mxC = Math.max(mxC, m.offsetWidth); });
        document.body.removeChild(m);
        triggers.forEach(t => { t._condensedW = mxC + 0 + 18 + 12 + 4; });
      }
      if (SIM.updateDataPanel) SIM.updateDataPanel();
    });

    // Ctrl+Arrow: navigate between panels
    const panelEls = wrap.querySelectorAll('.sim-panel[role="region"]');
    if (SIM.panelNavHandler) document.removeEventListener("keydown", SIM.panelNavHandler);
    SIM.panelNavHandler = (e) => {
      if (!e.ctrlKey || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
      e.preventDefault();
      const panelArr = Array.from(panelEls);
      const active = document.activeElement;
      let curIdx = -1;
      panelArr.forEach((p, i) => { if (p.contains(active)) curIdx = i; });
      const dir = e.key === "ArrowRight" ? 1 : -1;
      for (let i = 1; i <= panelArr.length; i++) {
        const nextIdx = (curIdx + dir * i + panelArr.length * panelArr.length) % panelArr.length;
        const focusable = nextIdx === curIdx ? null : panelArr[nextIdx].querySelectorAll('[tabindex="0"], button:not([tabindex="-1"]), a, input, select, textarea');
        if (focusable && focusable.length > 0) {
          focusable[0].focus();
          break;
        }
      }
    };
    document.addEventListener("keydown", SIM.panelNavHandler);

    return wrap;
  }
  return null;
}

function buildViewport() {
  const device = DEVICES[activeDevice];
  const layout = LAYOUTS[activeLayout];
  const container = document.getElementById("viewportContainer");
  const info = document.getElementById("viewportInfo");
  // Detach cached sim elements before clearing container so they survive
  if (_simTitleBar && _simTitleBar.parentNode) _simTitleBar.remove();
  if (_simContent && _simContent.parentNode) _simContent.remove();
  container.innerHTML = "";
  container.style.paddingTop = "";
  container.style.alignSelf = "";
  container.style.maxWidth = "";
  container.style.overflow = "";
  document.body.style.background = "";
  document.body.style.overflow = "";
  document.body.style.paddingRight = "0";
  const wrapperEl = document.querySelector(".viewport-wrapper");
  if (wrapperEl) { wrapperEl.style.overflow = ""; wrapperEl.style.borderColor = ""; }
  const bwLabel = document.getElementById("browserWidthLabel");
  if (bwLabel) { bwLabel.style.color = ""; bwLabel.style.zIndex = ""; bwLabel.style.background = "rgba(0,0,0,0.15)"; }
  document.querySelectorAll(".btn-column-label").forEach(el => el.style.color = "");
  const msTitle = document.getElementById("masssims-title");
  if (msTitle) msTitle.style.color = "";
  info.style.textAlign = "";
  info.style.alignSelf = "";
  info.style.minWidth = "";

  // Update browser width label
  const bwEl = document.getElementById("browserWidthValue");
  const bwWrapper = document.querySelector(".viewport-wrapper");
  if (bwEl && bwWrapper) bwEl.textContent = Math.round(window.innerWidth - bwWrapper.getBoundingClientRect().left) + "px";

  const isNoLimit = activeDevice === "none";
  const availW = isNoLimit ? (layout.hasAP ? AP_WIDTH : 1200) : device.screenW;
  const availH = isNoLimit ? 700 : device.screenH - device.topChrome - device.bottomChrome;

  // Content width
  let contentW;
  if (activeLayout === "ap-2col") {
    // 28 left margin + sidebar + 10 right margin + 1 border + content + 1 border + 26 right margin = 1100
    contentW = sidebarExpanded ? AP_CONTENT_W_EXPANDED : AP_CONTENT_W_COLLAPSED;
  } else if (activeLayout === "ap-full") {
    contentW = 1044;
  } else {
    contentW = 1024;
  }

  const contentH = AP_CONTENT_H;

  // Info line
  if (isNoLimit) {
    info.innerHTML = `<strong>Teacher Desktop / ${layout.name}</strong><br><strong>Content:</strong> ${contentW}w × ${contentH}h`;
  } else {
    const wrapperClientW = document.querySelector(".viewport-wrapper").clientWidth;
    const frameAvailW = (activeDevice === "chromebook") ? Math.min(device.screenW, wrapperClientW) : device.screenW;
    info.innerHTML = `<strong>${device.name} / ${layout.name}</strong><br><strong>Screen:</strong> ${device.screenW}w × ${device.screenH}h • <strong>Available:</strong> ${frameAvailW}w × ${availH}h • <strong>Content:</strong> ${contentW}w × ${contentH}h`;
    // Label freeze when frame is clipped
    if (wrapperClientW < device.screenW) {
      info.style.alignSelf = "flex-start";
      const infoMinW = (activeDevice === "chromebook") ? Math.max(frameAvailW, 1100) : device.screenW;
      info.style.minWidth = infoMinW + "px";
    }
  }

  // Device frame
  const frame = document.createElement("div");
  frame.className = "device-frame" + (isNoLimit ? " no-limit" : "");

  if (isNoLimit && layout.hasAP) {
    // Teacher Desktop + AP: white page, full height, no border
    document.body.style.background = "#0592af";
    document.querySelectorAll(".btn-column-label").forEach(el => el.style.color = "#fff");
    const msTitle = document.getElementById("masssims-title");
    if (msTitle) msTitle.style.color = "#fff";
    const bwLabelAP = document.getElementById("browserWidthLabel");
    if (bwLabelAP) { bwLabelAP.style.zIndex = "10"; bwLabelAP.style.background = "rgba(255,255,255,0.5)"; }
    const wrapperAP = document.querySelector(".viewport-wrapper");
    if (wrapperAP) wrapperAP.style.borderColor = "#fff";
    frame.classList.remove("no-limit");
    frame.style.width = AP_WIDTH + "px";
    frame.style.border = "none";
    frame.style.background = "#fff";
    frame.style.borderRadius = "0";
    frame.style.margin = "0 auto";
    frame.style.height = "100vh";
    frame.style.overflow = "hidden";
    frame.style.marginTop = "-" + container.getBoundingClientRect().top + "px";
    frame.style.paddingTop = container.getBoundingClientRect().top + "px";
    document.body.style.overflow = "hidden";
  } else if (isNoLimit) {
    const frameW = 1200;
    const frameH = 700;
    frame.style.width = frameW + "px";
    frame.style.height = frameH + "px";
  } else {
    container.style.maxWidth = "100%";
    const wrapperForOverflow = document.querySelector(".viewport-wrapper");
    const deviceFrameW = (activeDevice === "chromebook")
      ? Math.min(device.screenW, wrapperForOverflow ? wrapperForOverflow.clientWidth : device.screenW)
      : device.screenW;
    frame.style.width = deviceFrameW + "px";
    frame.style.height = device.screenH + "px";
    frame.style.margin = "0 -2px";
    if (wrapperForOverflow) wrapperForOverflow.style.overflow = "hidden";
  }

  // Top chrome
  if (!isNoLimit && device.topChrome > 0) {
    const top = document.createElement("div");
    top.className = "chrome-top";
    top.style.height = device.topChrome + "px";
    top.setAttribute("data-label", device.topLabel);

    frame.appendChild(top);
  }

  // Viewport area
  const viewport = document.createElement("div");
  viewport.className = "viewport-area";
  viewport.style.alignItems = "flex-start";
  if (isNoLimit && layout.hasAP) {
    viewport.style.height = "auto";
    viewport.style.minHeight = "100%";
    viewport.style.background = "#fff";
  } else {
    viewport.style.height = availH + "px";
  }

  if (layout.hasAP) {
    // Page container — 1100 x availH, centered, flush with chrome
    const page = document.createElement("div");
    page.style.width = "1100px";
    page.style.minHeight = isNoLimit ? "100%" : availH + "px";
    page.style.background = "#fff";
    page.style.display = "flex";
    page.style.flexDirection = "column";
    page.style.alignItems = "center";
    page.style.position = "relative";

    // Activity container — same width as content, centered, with border
    const ap = document.createElement("div");
    ap.className = "ap-container";
    ap.style.marginTop = "4px";
    const apW = activeLayout === "ap-2col" ? AP_WIDTH : contentW;
    ap.style.width = apW + "px";

    if (activeLayout === "ap-2col") {
      // 2-column: left column + right side (header above content only)
      const apBody = document.createElement("div");
      apBody.className = "ap-body";

      // Left column
      const sidebarW = sidebarExpanded ? 267 : 45;
      const leftCol = document.createElement("div");
      leftCol.className = "ap-left-column";
      leftCol.style.width = sidebarW + "px";

      // Toggle button
      const toggleBtn = document.createElement("div");
      toggleBtn.className = "ap-left-toggle";
      toggleBtn.title = sidebarExpanded ? "Click to hide column" : "Click to show column";
      toggleBtn.setAttribute("role", "button");
      toggleBtn.setAttribute("tabindex", "0");
      toggleBtn.setAttribute("aria-expanded", sidebarExpanded ? "true" : "false");
      toggleBtn.setAttribute("aria-label", sidebarExpanded ? "Collapse left column" : "Expand left column");

      if (sidebarExpanded) {
        toggleBtn.style.height = "40px";

        const toggleLabel = document.createElement("span");
        toggleLabel.className = "ap-left-toggle-label";
        toggleLabel.textContent = "Hide";
        toggleBtn.appendChild(toggleLabel);

        const toggleIcon = document.createElement("img");
        toggleIcon.className = "ap-left-toggle-icon";
        toggleIcon.src = "icons/Double Arrow ICON.svg";
        toggleIcon.alt = "Collapse";
        toggleBtn.appendChild(toggleIcon);
      } else {
        toggleBtn.style.height = (350) + "px";
        toggleBtn.style.flexDirection = "column";
        toggleBtn.style.alignItems = "center";
        toggleBtn.style.justifyContent = "flex-start";

        const toggleIcon = document.createElement("img");
        toggleIcon.className = "ap-left-toggle-icon-collapsed";
        toggleIcon.src = "icons/Double Arrow ICON.svg";
        toggleIcon.alt = "Expand";
        toggleBtn.appendChild(toggleIcon);

        const toggleLabel = document.createElement("span");
        toggleLabel.className = "ap-left-toggle-label-collapsed";
        toggleLabel.textContent = "Show";
        toggleBtn.appendChild(toggleLabel);
      }

      function toggleSidebar() {
        sidebarExpanded = !sidebarExpanded;
        buildViewport();
      }
      toggleBtn.addEventListener("click", toggleSidebar);
      toggleBtn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggleSidebar();
        }
      });

      leftCol.appendChild(toggleBtn);

      // Resources container (fills remaining height)
      if (sidebarExpanded) {
        const resources = document.createElement("div");
        resources.className = "ap-left-resources";

        const resHeader = document.createElement("div");
        resHeader.className = "ap-left-resources-header";
        const resLabel = document.createElement("span");
        resLabel.className = "ap-left-resources-header-label";
        resLabel.textContent = "Instructions";
        resHeader.appendChild(resLabel);
        resources.appendChild(resHeader);

        const resBody = document.createElement("div");
        resBody.className = "ap-left-resources-body";
        resBody.setAttribute("tabindex", "0");
        resBody.setAttribute("role", "region");
        resBody.setAttribute("aria-label", "Resources content");
        resBody.innerHTML = `<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
          <ul>
            <li>Ut eu eros nec tortor tincidunt consequat eget eu eros.</li>
            <li>Nullam in massa turpis.</li>
            <li>Morbi ut libero nec nibh lacinia mollis.</li>
            <li>Vestibulum vestibulum vestibulum placerat.</li>
          </ul>
          <p>Quisque dictum a justo eget semper. Pellentesque viverra augue a euismod consequat.</p>
          <p>Have fun!</p>`;
        resources.appendChild(resBody);

        leftCol.appendChild(resources);
      }

      apBody.appendChild(leftCol);

      // Right side: header + content (with border)
      const rightSide = document.createElement("div");
      rightSide.className = "ap-right-column";
      rightSide.style.width = (contentW) + "px";

      // AP header (above content only)
      const apHeader = document.createElement("div");
      apHeader.className = "ap-header";
      apHeader.style.height = (AP_HEADER_H) + "px";
      const apLabel = document.createElement("span");
      apLabel.className = "ap-header-label";
      apLabel.textContent = SIMS[activeSim].name + " Simulation";
      apHeader.appendChild(apLabel);
      rightSide.appendChild(apHeader);

      // Content area
      const content = document.createElement("div");
      content.className = "content-area";
      content.setAttribute("role", "main");
      content.style.width = "100%";
      content.style.height = (AP_CONTENT_H) + "px";
      content.appendChild(getSimTitleBar());
      const sc2col = getSimContent();
      if (sc2col) content.appendChild(sc2col);

      rightSide.appendChild(content);
      apBody.appendChild(rightSide);
      ap.appendChild(apBody);
    } else {
      // Full-width: border on whole AP container
      ap.style.border = "1px solid #858585";
      ap.style.boxSizing = "content-box";

      const apHeader = document.createElement("div");
      apHeader.className = "ap-header";
      apHeader.style.height = (AP_HEADER_H) + "px";
      const apLabel = document.createElement("span");
      apLabel.className = "ap-header-label";
      apLabel.textContent = SIMS[activeSim].name + " Simulation";
      apHeader.appendChild(apLabel);
      ap.appendChild(apHeader);

      const apBody = document.createElement("div");
      apBody.className = "ap-body";

      // Content area
      const content = document.createElement("div");
      content.className = "content-area";
      content.setAttribute("role", "main");
      content.style.width = (contentW) + "px";
      content.style.height = (AP_CONTENT_H) + "px";
      content.appendChild(getSimTitleBar());
      const scFull = getSimContent();
      if (scFull) content.appendChild(scFull);

      apBody.appendChild(content);
      ap.appendChild(apBody);
    }
    page.appendChild(ap);

    // Question containers (below AP on the page)
    if (activeLayout === "ap-full" || activeLayout === "ap-2col") {
      const qRow = document.createElement("div");
      qRow.className = "question-row";
      if (activeLayout === "ap-2col") {
        qRow.style.paddingLeft = "28px";
        qRow.style.paddingRight = "26px";
      }

      [
        { label: "Question #1", text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut eu eros nec tortor tincidunt consequat eget eu eros?" },
        { label: "Question #2", text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit?" }
      ].forEach(q => {
        const qContainer = document.createElement("div");
        qContainer.className = "question-container";

        const qHeader = document.createElement("div");
        qHeader.className = "question-header";
        const qLabel = document.createElement("span");
        qLabel.className = "question-header-label";
        qLabel.textContent = q.label;
        qHeader.appendChild(qLabel);
        qContainer.appendChild(qHeader);

        const qBody = document.createElement("div");
        qBody.className = "question-body";
        qBody.innerHTML = `<div>${q.text}</div><div class="question-input">Please type your answer here.</div>`;
        qContainer.appendChild(qBody);

        qRow.appendChild(qContainer);
      });

      page.appendChild(qRow);
    }
    viewport.appendChild(page);

    // Chromebook + AP: re-measure wrapper and override frame width (matches Standalone logic)
    if (activeDevice === "chromebook") {
      const cbWrapperW = document.querySelector(".viewport-wrapper").clientWidth;
      const cbFrameW = Math.min(device.screenW, cbWrapperW);
      frame.style.width = (cbFrameW) + "px";
      if (cbFrameW < 1100) {
        viewport.style.justifyContent = "flex-start";
      }
    }
  } else if (activeLayout === "standalone" && isNoLimit) {
    // Standalone + Teacher Desktop — gray background, content centered
    const standaloneMax = 1024;
    const standaloneMin = 768;
    const standaloneMargin = 20;
    const standaloneH = 562;

    document.body.style.background = "#e0e0e0";
    document.body.style.paddingRight = "0";
    container.style.alignSelf = "stretch";

    // Measure AFTER stretch so container matches wrapper width
    const fullW = container.clientWidth;
    const standaloneBorder = 4; // 2px border each side, box-sizing: content-box
    const standaloneW = Math.floor(Math.max(standaloneMin, Math.min(standaloneMax, fullW - (standaloneMargin * 2) - standaloneBorder)));
    const ml = standaloneW <= standaloneMin ? standaloneMargin : Math.floor((fullW - standaloneW - standaloneBorder) / 2);

    const topOffset = container.getBoundingClientRect().top;
    const verticalPad = Math.max(0, (window.innerHeight - topOffset - standaloneH) / 2);
    container.style.paddingTop = verticalPad + "px";

    const content = document.createElement("div");
    content.className = "content-area standalone";
    content.setAttribute("role", "main");
    content.style.width = (standaloneW) + "px";
    content.style.height = (standaloneH) + "px";
    content.style.marginLeft = ml + "px";
    content.appendChild(getSimTitleBar());
    const scSA1 = getSimContent();
    if (scSA1) content.appendChild(scSA1);

    // Update info line with actual responsive width
    info.innerHTML = `<strong>Teacher Desktop / ${layout.name}</strong><br><strong>Content:</strong> ${standaloneW}w × ${standaloneH}h`;
    if (standaloneW <= standaloneMin) {
      const clipW = standaloneMin + (standaloneMargin * 2) + standaloneBorder; // 812
      info.style.alignSelf = "flex-start";
      info.style.minWidth = clipW + "px";
    }

    container.appendChild(content);
    if (SIM.updateDataPanel) SIM.updateDataPanel();

    return;
  } else {
    // Standalone with device frame
    const standaloneMax = 1024;
    const standaloneMin = 768;
    const standaloneMargin = 20;
    const contentBorder = 4; // 2px border each side on .content-area.standalone (content-box)
    const wrapperClientW = document.querySelector(".viewport-wrapper").clientWidth;
    const standaloneH = 562;

    let standaloneW, simMarginLeft, frameVisualW;

    if (activeDevice === "chromebook") {
      // Chromebook: frame shrinks with browser, content responsive
      frameVisualW = Math.min(device.screenW, wrapperClientW);
      frame.style.width = (frameVisualW) + "px";

      const shrinkStart = standaloneMax + contentBorder + (standaloneMargin * 2); // 1068
      const clipStart = standaloneMin + contentBorder + (standaloneMargin * 2); // 812

      if (frameVisualW >= shrinkStart) {
        standaloneW = standaloneMax;
        simMarginLeft = null;
      } else if (frameVisualW >= clipStart) {
        standaloneW = frameVisualW - (standaloneMargin * 2) - contentBorder;
        simMarginLeft = standaloneMargin;
      } else {
        standaloneW = standaloneMin;
        simMarginLeft = standaloneMargin;
      }

      // Label freeze when clipping
      if (frameVisualW < clipStart) {
        info.style.alignSelf = "flex-start";
        info.style.minWidth = clipStart + "px";
      }
    } else {
      // iPad/Android: fixed frame, fixed content, no responsiveness
      frameVisualW = device.screenW;
      standaloneW = standaloneMax;
      simMarginLeft = null;

      // Label freeze when frame is clipped by wrapper
      if (wrapperClientW < device.screenW) {
        info.style.alignSelf = "flex-start";
        info.style.minWidth = device.screenW + "px";
      }
    }

    const content = document.createElement("div");
    content.className = "content-area standalone";
    content.setAttribute("role", "main");
    content.style.width = (standaloneW) + "px";
    content.style.height = (standaloneH) + "px";
    content.appendChild(getSimTitleBar());
    const scSA2 = getSimContent();
    if (scSA2) content.appendChild(scSA2);

    viewport.style.display = "flex";
    viewport.style.alignItems = "center";
    viewport.style.background = "#e0e0e0";

    if (simMarginLeft !== null) {
      viewport.style.justifyContent = "flex-start";
      content.style.marginLeft = simMarginLeft + "px";
    } else {
      viewport.style.justifyContent = "center";
    }
    viewport.appendChild(content);

    // Update info line
    info.innerHTML = `<strong>${device.name} / ${layout.name}</strong><br><strong>Screen:</strong> ${device.screenW}w × ${device.screenH}h • <strong>Available:</strong> ${frameVisualW}w × ${availH}h • <strong>Content:</strong> ${standaloneW}w × ${standaloneH}h`;
  }

  frame.appendChild(viewport);

  // Bottom chrome
  if (!isNoLimit && device.bottomChrome > 0) {
    const bottom = document.createElement("div");
    bottom.className = "chrome-bottom";
    bottom.style.height = (device.bottomChrome) + "px";
    bottom.setAttribute("data-label", device.bottomLabel);

    frame.appendChild(bottom);
  }

  container.appendChild(frame);
  if (SIM.updateDataPanel) SIM.updateDataPanel();
}

// Button wiring
function wireToggleGroup(selector, callback) {
  document.querySelectorAll(selector).forEach(btn => {
    btn.addEventListener("click", () => {
      if (callback) callback(btn);
      document.querySelectorAll(selector).forEach(b => {
        b.classList.remove("active");
        b.setAttribute("aria-pressed", "false");
      });
      btn.classList.add("active");
      btn.setAttribute("aria-pressed", "true");
      buildViewport();
    });
  });
}

wireToggleGroup("[data-sim]", btn => { activeSim = btn.dataset.sim; invalidateSimCache(); });
wireToggleGroup("[data-layout]", btn => {
  activeLayout = btn.dataset.layout;
  if (activeLayout === "ap-2col") sidebarExpanded = true;
});
wireToggleGroup("[data-device]", btn => { activeDevice = btn.dataset.device; });

buildViewport();

// Resize handler
let _resizeRafId = null;
function updateStandaloneDeviceFrame() {
  if (_resizeRafId) return; // already scheduled
  _resizeRafId = requestAnimationFrame(() => {
    _resizeRafId = null;
    _updateStandaloneDeviceFrameNow();
  });
}
function _updateStandaloneDeviceFrameNow() {
  const wrapper = document.querySelector(".viewport-wrapper");
  const contentEl = document.querySelector(".content-area.standalone");
  if (!wrapper || !contentEl) return;

  const device = DEVICES[activeDevice];
  if (!device) return;

  const wrapperClientW = wrapper.clientWidth;
  const info = document.getElementById("viewportInfo");

  if (activeDevice !== "chromebook") {
    // iPad/Android: no responsive changes, only label freeze
    if (info) {
      const isClipping = wrapperClientW < device.screenW;
      info.style.alignSelf = isClipping ? "flex-start" : "";
      info.style.minWidth = isClipping ? device.screenW + "px" : "";
    }
    return;
  }

  // Chromebook: full responsive logic
  const contentBorder = 4;
  const margin = 20;
  const standaloneMax = 1024;
  const standaloneMin = 768;
  const availH = device.screenH - device.topChrome - device.bottomChrome;

  const frameVisualW = Math.min(device.screenW, wrapperClientW);
  const frameEl = document.querySelector(".device-frame");
  if (frameEl) {
    frameEl.style.transition = "none";
    frameEl.style.width = frameVisualW + "px";
  }
  contentEl.style.transition = "none";

  const shrinkStart = standaloneMax + contentBorder + (margin * 2); // 1068
  const clipStart = standaloneMin + contentBorder + (margin * 2); // 812

  const viewport = contentEl.parentElement;

  let w;
  if (frameVisualW >= shrinkStart) {
    w = standaloneMax;
    contentEl.style.marginLeft = "";
    if (viewport) viewport.style.justifyContent = "center";
  } else if (frameVisualW >= clipStart) {
    w = frameVisualW - (margin * 2) - contentBorder;
    contentEl.style.marginLeft = margin + "px";
    if (viewport) viewport.style.justifyContent = "flex-start";
  } else {
    w = standaloneMin;
    contentEl.style.marginLeft = margin + "px";
    if (viewport) viewport.style.justifyContent = "flex-start";
  }

  contentEl.style.width = w + "px";
  const layoutName = LAYOUTS[activeLayout] ? LAYOUTS[activeLayout].name : activeLayout;
  if (info) {
    info.innerHTML = '<strong>' + device.name + ' / ' + layoutName + '</strong><br><strong>Screen:</strong> ' + device.screenW + 'w \u00d7 ' + device.screenH + 'h \u2022 <strong>Available:</strong> ' + frameVisualW + 'w \u00d7 ' + availH + 'h \u2022 <strong>Content:</strong> ' + w + 'w \u00d7 562h';
    const isClipping = frameVisualW < clipStart;
    info.style.alignSelf = isClipping ? "flex-start" : "";
    info.style.minWidth = isClipping ? clipStart + "px" : "";
  }
}

window.addEventListener("resize", () => {
  // Always update browser width label
  const bwEl = document.getElementById("browserWidthValue");
  const bwWrapper = document.querySelector(".viewport-wrapper");
  if (bwEl && bwWrapper) bwEl.textContent = Math.round(window.innerWidth - bwWrapper.getBoundingClientRect().left) + "px";

  if (activeLayout === "standalone" && activeDevice === "none") {
    // Teacher Desktop — full rebuild (responsive content)
    buildViewport();
  } else if (activeLayout === "standalone" && activeDevice !== "none") {
    // Device frame — lightweight update (no rebuild)
    updateStandaloneDeviceFrame();
  } else if (activeDevice === "chromebook" && activeLayout !== "standalone") {
    // Chromebook + AP layouts — shrink frame, label freeze
    const device = DEVICES[activeDevice];
    const wrapper = document.querySelector(".viewport-wrapper");
    if (device && wrapper) {
      const wrapperW = wrapper.clientWidth;
      const frameVisualW = Math.min(device.screenW, wrapperW);
      const frameEl = document.querySelector(".device-frame");
      if (frameEl) {
        frameEl.style.transition = "none";
        frameEl.style.width = frameVisualW + "px";
      }
      // Pin page to left when frame < 1100, restore centering when wider
      const viewportArea = document.querySelector(".viewport-area");
      if (viewportArea) {
        viewportArea.style.justifyContent = frameVisualW < 1100 ? "flex-start" : "";
      }
      const info = document.getElementById("viewportInfo");
      if (info) {
        const availH = device.screenH - device.topChrome - device.bottomChrome;
        const layoutName = LAYOUTS[activeLayout] ? LAYOUTS[activeLayout].name : activeLayout;
        const contentW = activeLayout === "ap-2col" ? (sidebarExpanded ? AP_CONTENT_W_EXPANDED : AP_CONTENT_W_COLLAPSED) : 1044;
        info.innerHTML = '<strong>' + device.name + ' / ' + layoutName + '</strong><br><strong>Screen:</strong> ' + device.screenW + 'w \u00d7 ' + device.screenH + 'h \u2022 <strong>Available:</strong> ' + frameVisualW + 'w \u00d7 ' + availH + 'h \u2022 <strong>Content:</strong> ' + contentW + 'w \u00d7 ' + AP_CONTENT_H + 'h';
        const isClipping = wrapperW < device.screenW;
        info.style.alignSelf = isClipping ? "flex-start" : "";
        info.style.minWidth = isClipping ? Math.max(frameVisualW, 1100) + "px" : "";
      }
    }
  } else if (activeDevice !== "none" && activeDevice !== "chromebook") {
    // iPad/Android + any layout — label freeze only
    const info = document.getElementById("viewportInfo");
    const device = DEVICES[activeDevice];
    if (info && device) {
      const wrapperW = document.querySelector(".viewport-wrapper").clientWidth;
      const isClipping = wrapperW < device.screenW;
      info.style.alignSelf = isClipping ? "flex-start" : "";
      info.style.minWidth = isClipping ? device.screenW + "px" : "";
    }
  }
  // Redraw charts at new size
  if (SIM.updateDataPanel) SIM.updateDataPanel();
});
</script>
</body>
