        requestAnimationFrame(function () { syncingScroll = false; });
      }, { passive: true });
    }
    linkScroll(readScroll, chainBody);
    linkScroll(chainBody, readScroll);

    prevBtn.addEventListener("click", function () { if (idx > 0) goToCase(idx - 1); });
    nextBtn.addEventListener("click", function () { if (idx < cases.length - 1) goToCase(idx + 1); });

    SIM.onResize = function () { requestAnimationFrame(render); };
    requestAnimationFrame(render);
    render();

    return wrap;
  }

  // ---- not yet built: blank content area ----
  const wrap = document.createElement("div");
  wrap.className = "sim-content";

  // Polite live region for screen-reader announcements. Call SIM.announce("...")
  // from anywhere in the interactive.
  const liveAnnounce = document.createElement("div");
  liveAnnounce.className = "sr-only";
  liveAnnounce.setAttribute("aria-live", "polite");
  liveAnnounce.setAttribute("aria-atomic", "true");
  wrap.appendChild(liveAnnounce);
  SIM._suppressAnnounce = false;
  SIM.announce = function(msg) {
    if (SIM._suppressAnnounce) return;
    liveAnnounce.textContent = "";
    requestAnimationFrame(() => { liveAnnounce.textContent = msg; });
  };

  // Handles invalidateSimCache() tears down when the sim is switched.
  SIM._timeouts = [];
  SIM._observers = [];

  return wrap;
}

function buildDemoView() {
  const wrapper = document.querySelector(".viewport-wrapper");

  btnColumn.style.zIndex = "10";

  groups[1].style.visibility = "hidden"; // Device
  const layoutGroup = groups[2];
  layoutGroup.querySelector(".btn-column-label").style.visibility = "hidden";
  layoutGroup.querySelectorAll("[data-layout]").forEach(b => b.style.visibility = "hidden");
  layoutGroup.querySelector("hr").style.visibility = "hidden";

  // Swap Demo Site button to Prototypes back button
  const demoBtn = document.getElementById("demo-site-btn");

  demoBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="transform:scaleX(-1)"><path d="M22,12 C22,6.48 17.52,2 12,2 C6.48,2 2,6.48 2,12 C2,17.52 6.48,22 12,22 C17.52,22 22,17.52 22,12 Z M4,12 C4,7.58 7.58,4 12,4 C16.42,4 20,7.58 20,12 C20,16.42 16.42,20 12,20 C7.58,20 4,16.42 4,12 Z M16,12 L12,16 L10.59,14.59 L12.17,13 L8,13 L8,11 L12.17,11 L10.58,9.41 L12,8 L16,12 Z" fill="currentColor" fill-rule="nonzero"/></svg>Prototypes';

  // Reset teal-bg styling from Prototypes page
  document.body.classList.remove("teal-bg");
  document.querySelectorAll(".btn-column-label").forEach(el => el.style.color = "");
  const msTitle = document.getElementById("app-title");
  if (msTitle) msTitle.style.color = "";
  const demoHr = document.querySelector(".btn-column hr");
  if (demoHr) demoHr.style.borderColor = "";
  wrapper.style.borderColor = "";

  // Hide viewport chrome
  wrapper.style.borderLeft = "none";
  if (bwLabel) bwLabel.style.display = "none";
  info.style.display = "none";
  document.body.style.background = "#ededed";
  document.body.style.padding = "20px 0";
  wrapper.style.alignItems = "stretch";
  container.style.paddingTop = "";
  container.style.alignSelf = "";
  container.style.maxWidth = "";
  container.style.flex = "1";
  container.style.display = "flex";

  const demoWrap = document.createElement("div");

  const demoRow = document.createElement("div");
  demoRow.setAttribute("data-demo-row", "");
  demoRow.style.cssText = "display:flex;align-items:center;justify-content:center;gap:24px;width:100%;";

  // Sim buttons column
  const simBtns = document.createElement("div");
  simBtns.id = "demo-sim-btns";
  simBtns.style.cssText = "display:flex;flex-direction:column;gap:8px;flex-shrink:0;";
  const sims = Object.keys(SIMS).map(k => ({ key: k, label: SIMS[k].name }));
  function applyDemoBtnStyle(btn, simKey, isActive) {
    const simData = SIMS[simKey];
    const theme = simData && simData.theme;
    if (theme) {
      btn.style.borderWidth = "2px";
      if (isActive) {
        btn.style.background = theme.btnActive;
        btn.style.color = theme.titleText;
        btn.style.borderColor = theme.btnBorder;
      } else {
        btn.style.background = theme.surface;
        btn.style.color = theme.titleText;
        btn.style.borderColor = theme.btnBorder;
      }
    } else {
      btn.style.borderWidth = "2px";
      if (isActive) {
        btn.style.background = "#d0d0d0";
        btn.style.color = "#333";
        btn.style.borderColor = "#555";
      } else {
        btn.style.background = "#fff";
        btn.style.color = "#333";
        btn.style.borderColor = "#555";
      }
    }
  }

  sims.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "toggle-btn" + (activeSim === s.key ? " active" : "");
    btn.setAttribute("aria-pressed", activeSim === s.key ? "true" : "false");
    btn.dataset.simKey = s.key;
    btn.textContent = s.label.toUpperCase();
    const simData = SIMS[s.key];
    if (simData && simData.titleFont) btn.style.fontFamily = simData.titleFont;
    if (simData && simData.titleLetterSpacing) btn.style.letterSpacing = simData.titleLetterSpacing;
    if (simData && simData.titleOffset) { btn.innerHTML = '<span style="position:relative;top:' + simData.titleOffset + '">' + btn.textContent + '</span>'; }
    btn.style.fontSize = "24px";
    btn.style.fontWeight = "700";
    btn.style.padding = "8px 10px";
    btn.style.minHeight = "50px";
    applyDemoBtnStyle(btn, s.key, activeSim === s.key);

    const theme = simData && simData.theme;
    btn.addEventListener("mouseenter", () => {
      if (btn.classList.contains("active")) return;
      btn.style.background = theme ? theme.btnHover : "#f0f0f0";
    });
    btn.addEventListener("mouseleave", () => {
      if (btn.classList.contains("active")) return;
      btn.style.background = theme ? theme.surface : "#fff";
    });
    btn.addEventListener("mousedown", () => {
      if (btn.classList.contains("active")) return;
      btn.style.background = theme ? theme.btnActive : "#d0d0d0";
    });
    btn.addEventListener("mouseup", () => {
      if (btn.classList.contains("active")) return;
      btn.style.background = theme ? theme.btnHover : "#f0f0f0";
    });

    btn.addEventListener("click", () => {
      if (activeSim === s.key) return;
      activeSim = s.key;
      invalidateSimCache();
      simBtns.querySelectorAll(".toggle-btn").forEach(b => {
        b.classList.remove("active");
        b.setAttribute("aria-pressed", "false");
        applyDemoBtnStyle(b, b.dataset.simKey, false);
      });
      btn.classList.add("active");
      btn.setAttribute("aria-pressed", "true");
      applyDemoBtnStyle(btn, s.key, true);
      document.querySelectorAll("[data-sim]").forEach(b => {
        b.classList.toggle("active", b.dataset.sim === s.key);
        b.setAttribute("aria-pressed", b.dataset.sim === s.key ? "true" : "false");
      });
      rebuildDemoContent(demoWrap, simBtns);
    });
    simBtns.appendChild(btn);
  });
  demoWrap.appendChild(simBtns);

  // Append buttons first so we can measure
  demoRow.appendChild(simBtns);
  demoWrap.appendChild(demoRow);
  container.appendChild(demoWrap);

  // Equalize button widths to the widest
  const btns = simBtns.querySelectorAll(".toggle-btn");
  let maxW = 0;
  btns.forEach(b => { if (b.offsetWidth > maxW) maxW = b.offsetWidth; });
  btns.forEach(b => { b.style.width = maxW + "px"; b.style.textAlign = "center"; });

  // Sim content (TD/Standalone: responsive 768–1024 x 562)
  const standaloneMax = 1024;

function buildViewport() {

  const device = DEVICES[activeDevice];
  const layout = LAYOUTS[activeLayout];

  const info = document.getElementById("viewportInfo");

  if (_simTitleBar && _simTitleBar.parentNode) _simTitleBar.remove();

  container.innerHTML = "";
  container.style.paddingTop = "";
  container.style.alignSelf = "";
  container.style.maxWidth = "";
  container.style.overflow = "";
  document.body.style.background = "";
  document.body.classList.remove("teal-bg");
  document.body.style.overflow = "";
  document.body.style.paddingRight = "0";
  const wrapperEl = document.querySelector(".viewport-wrapper");
  if (wrapperEl) { wrapperEl.style.overflow = ""; wrapperEl.style.borderColor = ""; }
  const bwLabel = document.getElementById("browserWidthLabel");
  if (bwLabel) { bwLabel.style.color = ""; bwLabel.style.zIndex = ""; bwLabel.style.background = "rgba(0,0,0,0.15)"; }

  info.style.textAlign = "";
  info.style.alignSelf = "";
  info.style.minWidth = "";

  // Update browser width label
  const bwEl = document.getElementById("browserWidthValue");
  const bwWrapper = document.querySelector(".viewport-wrapper");
  if (bwEl && bwWrapper) bwEl.textContent = Math.round(window.innerWidth - bwWrapper.getBoundingClientRect().left) + "px";

  const isNoLimit = activeDevice === "none";
  const availW = isNoLimit ? (layout.hasAP ? AP_WIDTH : 1200) : device.screenW;
  const availH = isNoLimit ? 700 : device.screenH - device.topChrome - device.bottomChrome;

  // Content width
  let contentW;
  if (activeLayout === "ap-2col") {
    // 28 left margin + sidebar + 10 right margin + 1 border + content + 1 border + 26 right margin = 1100
    contentW = sidebarExpanded ? AP_CONTENT_W_EXPANDED : AP_CONTENT_W_COLLAPSED;

    contentW = 1044;

  // Info line

    // Label freeze when frame is clipped
    if (wrapperClientW < device.screenW) {
      info.style.alignSelf = "flex-start";
      const infoMinW = (activeDevice === "chromebook") ? Math.max(frameAvailW, 1100) : device.screenW;

  // Device frame

    frame.style.border = "none";

    frame.style.borderRadius = "0";
    frame.style.margin = "0 auto";

    frame.style.overflow = "hidden";
    frame.style.marginTop = "-" + container.getBoundingClientRect().top + "px";
    frame.style.paddingTop = container.getBoundingClientRect().top + "px";

  } else if (isNoLimit) {

    const frameH = 700;

    frame.style.height = frameH + "px";
  } else {
    container.style.maxWidth = "100%";
    const wrapperForOverflow = document.querySelector(".viewport-wrapper");
    const deviceFrameW = (activeDevice === "chromebook")
      ? Math.min(device.screenW, wrapperForOverflow ? wrapperForOverflow.clientWidth : device.screenW)
      : device.screenW;
    frame.style.width = deviceFrameW + "px";
    frame.style.height = device.screenH + "px";

    if (activeDevice !== "chromebook") {

  // Top chrome
  if (!isNoLimit && device.topChrome > 0) {
    const top = document.createElement("div");

  // Viewport area

    viewport.style.height = "auto";

      toggleBtn.setAttribute("role", "button");
      toggleBtn.setAttribute("tabindex", "0");
      toggleBtn.setAttribute("aria-expanded", sidebarExpanded ? "true" : "false");
      toggleBtn.setAttribute("aria-label", sidebarExpanded ? "Collapse left column" : "Expand left column");

      if (sidebarExpanded) {
        toggleBtn.style.height = "40px";

        const toggleLabel = document.createElement("span");
        toggleLabel.className = "ap-left-toggle-label";
        toggleLabel.textContent = "Hide";
        toggleBtn.appendChild(toggleLabel);

        const toggleIcon = createSVGIcon(doubleArrowIconSVG);
        toggleIcon.classList.add("ap-left-toggle-icon");
        toggleBtn.appendChild(toggleIcon);
      } else {
        toggleBtn.style.height = (350) + "px";
        toggleBtn.style.flexDirection = "column";
        toggleBtn.style.alignItems = "center";
        toggleBtn.style.justifyContent = "flex-start";

        const toggleIcon = createSVGIcon(doubleArrowIconSVG);
        toggleIcon.classList.add("ap-left-toggle-icon-collapsed");
        toggleBtn.appendChild(toggleIcon);

        const toggleLabel = document.createElement("span");
        toggleLabel.className = "ap-left-toggle-label-collapsed";
        toggleLabel.textContent = "Show";
        toggleBtn.appendChild(toggleLabel);
      }

      function toggleSidebar() {

        buildViewport();
        const newToggle = document.querySelector(".ap-left-toggle");

      }
      toggleBtn.addEventListener("click", toggleSidebar);
      toggleBtn.addEventListener("keydown", (e) => {

          e.preventDefault();

      leftCol.appendChild(toggleBtn);

      // Resources container (fills remaining height)

        const resources = document.createElement("div");
        resources.className = "ap-left-resources";

        const resHeader = document.createElement("div");
        resHeader.className = "ap-left-resources-header";
        const resLabel = document.createElement("span");
        resLabel.className = "ap-left-resources-header-label";
        resLabel.textContent = "Instructions";
        resHeader.appendChild(resLabel);
        resources.appendChild(resHeader);

        const resBody = document.createElement("div");
        resBody.className = "ap-left-resources-body";
        resBody.setAttribute("role", "region");
        resBody.setAttribute("aria-label", "Resources content");
        resBody.innerHTML = `<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
          <ul>
            <li>Ut eu eros nec tortor tincidunt consequat eget eu eros.</li>
            <li>Nullam in massa turpis.</li>
            <li>Morbi ut libero nec nibh lacinia mollis.</li>
            <li>Vestibulum vestibulum vestibulum placerat.</li>
          </ul>
          <p>Quisque dictum a justo eget semper. Pellentesque viverra augue a euismod consequat.</p>
          <p>Have fun!</p>`;
        resources.appendChild(resBody);

        leftCol.appendChild(resources);
      }

      apBody.appendChild(leftCol);

      // Right side: header + content (with border)
      const rightSide = document.createElement("div");
      rightSide.className = "ap-right-column";
      rightSide.style.width = (contentW) + "px";

      // AP header (above content only)
      const apHeader = document.createElement("div");
      apHeader.className = "ap-header";
      apHeader.style.height = (AP_HEADER_H) + "px";
      const apLabel = document.createElement("span");
      apLabel.className = "ap-header-label";
      apLabel.textContent = SIMS[activeSim].name;
      apHeader.appendChild(apLabel);
      rightSide.appendChild(apHeader);

      // Content area
      const content = document.createElement("div");
      content.className = "content-area";
      content.setAttribute("role", "main");
      content.style.width = "100%";
      content.style.height = (AP_CONTENT_H) + "px";
      applySimTheme(content);
      { const tb = getSimTitleBar(); if (tb) content.appendChild(tb); }
      const sc2col = getSimContent();
      if (sc2col) content.appendChild(sc2col);

      rightSide.appendChild(content);
      apBody.appendChild(rightSide);
      ap.appendChild(apBody);
    } else {
      // Full-width: border on whole AP container
      ap.style.border = "1px solid #858585";
      ap.style.boxSizing = "content-box";

      const apHeader = document.createElement("div");
      apHeader.className = "ap-header";
      apHeader.style.height = (AP_HEADER_H) + "px";
      const apLabel = document.createElement("span");
      apLabel.className = "ap-header-label";
      apLabel.textContent = SIMS[activeSim].name;
      apHeader.appendChild(apLabel);
      ap.appendChild(apHeader);

      const apBody = document.createElement("div");
      apBody.className = "ap-body";

      // Content area
      const content = document.createElement("div");
      content.className = "content-area";
      content.setAttribute("role", "main");
      content.style.width = (contentW) + "px";
      content.style.height = (AP_CONTENT_H) + "px";
      applySimTheme(content);
      { const tb = getSimTitleBar(); if (tb) content.appendChild(tb); }
      const scFull = getSimContent();
      if (scFull) content.appendChild(scFull);

      apBody.appendChild(content);
      ap.appendChild(apBody);
    }
    page.appendChild(ap);

    // Question containers (below AP on the page)
    if (activeLayout === "ap-full" || activeLayout === "ap-2col") {
      const qRow = document.createElement("div");
      qRow.className = "question-row";
      if (activeLayout === "ap-2col") {
        qRow.style.paddingLeft = "28px";
        qRow.style.paddingRight = "26px";
      }

      [
        { label: "Question #1", text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut eu eros nec tortor tincidunt consequat eget eu eros?" },
        { label: "Question #2", text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit?" }
      ].forEach(q => {
        const qContainer = document.createElement("div");
        qContainer.className = "question-container";

        const qHeader = document.createElement("div");
        qHeader.className = "question-header";
        const qLabel = document.createElement("span");
        qLabel.className = "question-header-label";
        qLabel.textContent = q.label;
        qHeader.appendChild(qLabel);
        qContainer.appendChild(qHeader);

        const qBody = document.createElement("div");
        qBody.className = "question-body";
        qBody.innerHTML = `<div>${q.text}</div><div class="question-input">Please type your answer here.</div>`;
        qContainer.appendChild(qBody);

        qRow.appendChild(qContainer);
      });

      page.appendChild(qRow);
    }
    viewport.appendChild(page);

    // Chromebook + AP: re-measure wrapper and override frame width (matches Standalone logic)
    if (activeDevice === "chromebook") {
      const cbWrapperW = document.querySelector(".viewport-wrapper").clientWidth;
      const cbFrameW = Math.min(device.screenW, cbWrapperW);
      frame.style.width = (cbFrameW) + "px";
      if (cbFrameW < 1100) {
        viewport.style.justifyContent = "flex-start";
      }
    }
  } else if (activeLayout === "standalone" && isNoLimit) {
    // Standalone + Teacher Desktop — gray background, content centered
    const standaloneMax = 1024;
    const standaloneMin = 768;
    const standaloneMargin = 20;
    const standaloneH = 562;

    document.body.style.background = "#ededed";
    document.body.style.paddingRight = "0";
    container.style.alignSelf = "stretch";

    // Measure AFTER stretch so container matches wrapper width
    const fullW = container.clientWidth;
    const standaloneBorder = 4; // 2px border each side, box-sizing: content-box
    const standaloneW = Math.floor(Math.max(standaloneMin, Math.min(standaloneMax, fullW - (standaloneMargin * 2) - standaloneBorder)));
    const ml = standaloneW <= standaloneMin ? standaloneMargin : Math.floor((fullW - standaloneW - standaloneBorder) / 2);

    const topOffset = container.getBoundingClientRect().top;
    const verticalPad = Math.max(0, (window.innerHeight - topOffset - standaloneH) / 2);
    container.style.paddingTop = verticalPad + "px";

    const content = document.createElement("div");
    content.className = "content-area standalone";
    content.setAttribute("role", "main");
    content.style.width = (standaloneW) + "px";
    content.style.height = (standaloneH) + "px";
    content.style.marginLeft = ml + "px";
    applySimTheme(content);
    { const tb = getSimTitleBar(); if (tb) content.appendChild(tb); }
    const scSA1 = getSimContent();
    if (scSA1) content.appendChild(scSA1);

    // Update info line with actual responsive width
    info.innerHTML = `<strong>Teacher Desktop / ${layout.name}</strong><br><strong>Content:</strong> ${standaloneW}w × ${standaloneH}h`;
    if (standaloneW <= standaloneMin) {
      const clipW = standaloneMin + (standaloneMargin * 2) + standaloneBorder; // 812
      info.style.alignSelf = "flex-start";
      info.style.minWidth = clipW + "px";
    }

    container.appendChild(content);
    if (SIM.onResize) SIM.onResize();
    return;
  } else {
    // Standalone with device frame
    const standaloneMax = 1024;
    const standaloneMin = 768;
    const standaloneMargin = 20;
    const contentBorder = 4; // 2px border each side on .content-area.standalone (content-box)
    const wrapperClientW = document.querySelector(".viewport-wrapper").clientWidth;
    const standaloneH = 562;

    let standaloneW, simMarginLeft, frameVisualW;

    if (activeDevice === "chromebook") {
      // Chromebook: frame shrinks with browser, content responsive
      frameVisualW = Math.min(device.screenW, wrapperClientW);
      frame.style.width = (frameVisualW) + "px";

      const shrinkStart = standaloneMax + contentBorder + (standaloneMargin * 2); // 1068
      const clipStart = standaloneMin + contentBorder + (standaloneMargin * 2); // 812

      if (frameVisualW >= shrinkStart) {
        standaloneW = standaloneMax;
        simMarginLeft = null;
      } else if (frameVisualW >= clipStart) {
        standaloneW = frameVisualW - (standaloneMargin * 2) - contentBorder;
        simMarginLeft = standaloneMargin;
      } else {
        standaloneW = standaloneMin;
        simMarginLeft = standaloneMargin;
      }

      // Label freeze when clipping
      if (frameVisualW < clipStart) {
        info.style.alignSelf = "flex-start";
        info.style.minWidth = clipStart + "px";
      }
    } else {
      // iPad/Android: fixed frame, fixed content, no responsiveness
      frameVisualW = device.screenW;
      if (device.screenW <= standaloneMax + contentBorder) {
        standaloneW = device.screenW - (standaloneMargin * 2) - contentBorder;
        simMarginLeft = standaloneMargin;
      } else {
        standaloneW = standaloneMax;
        simMarginLeft = null;
      }

      // Label freeze when frame is clipped by wrapper
      if (wrapperClientW < device.screenW) {
        info.style.alignSelf = "flex-start";
        info.style.minWidth = device.screenW + "px";
      }

      frame.style.boxShadow = "0 2px 12px rgba(0, 0, 0, 0.3)";
    }

    const content = document.createElement("div");
    content.className = "content-area standalone";
    content.setAttribute("role", "main");
    content.style.width = (standaloneW) + "px";
    content.style.height = (standaloneH) + "px";
    applySimTheme(content);
    { const tb = getSimTitleBar(); if (tb) content.appendChild(tb); }
    const scSA2 = getSimContent();
    if (scSA2) content.appendChild(scSA2);

    viewport.style.display = "flex";
    viewport.style.alignItems = "center";
    viewport.style.background = "#ededed";

    if (simMarginLeft !== null) {
      viewport.style.justifyContent = "flex-start";
      content.style.marginLeft = simMarginLeft + "px";
    } else {
      viewport.style.justifyContent = "center";
    }
    viewport.appendChild(content);

    // Update info line
    info.innerHTML = `<strong>${device.name} / ${layout.name}</strong><br><strong>Screen:</strong> ${device.screenW}w × ${device.screenH}h • <strong>Available:</strong> ${frameVisualW}w × ${availH}h • <strong>Content:</strong> ${standaloneW}w × ${standaloneH}h`;
  }

  frame.appendChild(viewport);

  // Bottom chrome
  if (!isNoLimit && device.bottomChrome > 0) {
    const bottom = document.createElement("div");
    bottom.className = "chrome-bottom";
    bottom.style.height = (device.bottomChrome) + "px";
    bottom.setAttribute("data-label", device.bottomLabel);

    frame.appendChild(bottom);
  }

  container.appendChild(frame);
  if (SIM.onResize) SIM.onResize();
}

// Button wiring
function wireToggleGroup(selector, callback) {
  document.querySelectorAll(selector).forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.classList.contains("active")) return;
      if (callback) callback(btn);
      document.querySelectorAll(selector).forEach(b => {
        b.classList.remove("active");
        b.setAttribute("aria-pressed", "false");
      });
      btn.classList.add("active");
      btn.setAttribute("aria-pressed", "true");
      buildViewport();
    });
  });
}

wireToggleGroup("[data-sim]", btn => {
  activeSim = btn.dataset.sim;
  invalidateSimCache();
});
wireToggleGroup("[data-layout]", btn => {
  activeLayout = btn.dataset.layout;
  if (activeLayout === "ap-2col") sidebarExpanded = true;
});
wireToggleGroup("[data-device]", btn => { activeDevice = btn.dataset.device; });

document.getElementById("demo-site-btn").addEventListener("click", () => {
  if (demoMode) {
    demoMode = false;
    exitDemoView();
  } else {
    demoMode = true;
    _savedDevice = activeDevice;
    _savedLayout = activeLayout;
    activeDevice = "none";
    activeLayout = "standalone";
    buildDemoView();
  }
});

// Warm the Lato italic face at startup. It lives in a separate woff2 and is only used by
// late-appearing italic placeholders (e.g. "Max number of trials reached"), so over the
// network it would otherwise download on first render and flash from a wider fallback
// italic. Fetching it now means it's ready before any such label mounts. No-op locally
// (font is already instant) and fully guarded so it can never throw or block startup.
if (document.fonts && document.fonts.load) {
  try { document.fonts.load("italic 16px 'Lato'").catch(function () {}); } catch (e) {}
}

buildViewport();

// Resize handler
let _resizeRafId = null;
function updateStandaloneDeviceFrame() {
  if (_resizeRafId) return; // already scheduled
  _resizeRafId = requestAnimationFrame(() => {
    _resizeRafId = null;
    _updateStandaloneDeviceFrameNow();
  });
}
function _updateStandaloneDeviceFrameNow() {
  const wrapper = document.querySelector(".viewport-wrapper");
  const contentEl = document.querySelector(".content-area.standalone");
  if (!wrapper || !contentEl) return;

  const device = DEVICES[activeDevice];
  if (!device) return;

  const wrapperClientW = wrapper.clientWidth;
  const info = document.getElementById("viewportInfo");

  if (activeDevice !== "chromebook") {
    // iPad/Android: no responsive changes, only label freeze
    if (info) {
      const isClipping = wrapperClientW < device.screenW;
      info.style.alignSelf = isClipping ? "flex-start" : "";
      info.style.minWidth = isClipping ? device.screenW + "px" : "";
    }
    return;
  }

  // Chromebook: full responsive logic
  const contentBorder = 4;
  const margin = 20;
  const standaloneMax = 1024;
  const standaloneMin = 768;
  const availH = device.screenH - device.topChrome - device.bottomChrome;

  const frameVisualW = Math.min(device.screenW, wrapperClientW);
  const frameEl = document.querySelector(".device-frame");
  if (frameEl) {
    frameEl.style.transition = "none";
    frameEl.style.width = frameVisualW + "px";
  }
  contentEl.style.transition = "none";

  const shrinkStart = standaloneMax + contentBorder + (margin * 2); // 1068
  const clipStart = standaloneMin + contentBorder + (margin * 2); // 812

  const viewport = contentEl.parentElement;

  let w;
  if (frameVisualW >= shrinkStart) {
    w = standaloneMax;
    contentEl.style.marginLeft = "";
    if (viewport) viewport.style.justifyContent = "center";
  } else if (frameVisualW >= clipStart) {
    w = frameVisualW - (margin * 2) - contentBorder;
    contentEl.style.marginLeft = margin + "px";
    if (viewport) viewport.style.justifyContent = "flex-start";
  } else {
    w = standaloneMin;
    contentEl.style.marginLeft = margin + "px";
    if (viewport) viewport.style.justifyContent = "flex-start";
  }

  contentEl.style.width = w + "px";
  const layoutName = LAYOUTS[activeLayout] ? LAYOUTS[activeLayout].name : activeLayout;
  if (info) {
    info.innerHTML = '<strong>' + device.name + ' / ' + layoutName + '</strong><br><strong>Screen:</strong> ' + device.screenW + 'w \u00d7 ' + device.screenH + 'h \u2022 <strong>Available:</strong> ' + frameVisualW + 'w \u00d7 ' + availH + 'h \u2022 <strong>Content:</strong> ' + w + 'w \u00d7 562h';
    const isClipping = frameVisualW < clipStart;
    info.style.alignSelf = isClipping ? "flex-start" : "";
    info.style.minWidth = isClipping ? clipStart + "px" : "";
  }
  if (SIM.onResize) SIM.onResize();
}

window.addEventListener("resize", () => {
  // Always update browser width label
  const bwEl = document.getElementById("browserWidthValue");
  const bwWrapper = document.querySelector(".viewport-wrapper");
  if (bwEl && bwWrapper) bwEl.textContent = Math.round(window.innerWidth - bwWrapper.getBoundingClientRect().left) + "px";

  if (demoMode) { buildDemoView(); return; }

  if (activeLayout === "standalone" && activeDevice === "none") {
    // Teacher Desktop — full rebuild (responsive content)
    buildViewport();
  } else if (activeLayout === "standalone" && activeDevice !== "none") {
    // Device frame — lightweight update (no rebuild)
    updateStandaloneDeviceFrame();
  } else if (activeDevice === "chromebook" && activeLayout !== "standalone") {
    // Chromebook + AP layouts — shrink frame, label freeze
    const device = DEVICES[activeDevice];
    const wrapper = document.querySelector(".viewport-wrapper");
    if (device && wrapper) {
      const wrapperW = wrapper.clientWidth;
      const frameVisualW = Math.min(device.screenW, wrapperW);
      const frameEl = document.querySelector(".device-frame");
      if (frameEl) {
        frameEl.style.transition = "none";
        frameEl.style.width = frameVisualW + "px";
      }
      // Pin page to left when frame < 1100, restore centering when wider
      const viewportArea = document.querySelector(".viewport-area");
      if (viewportArea) {
        viewportArea.style.justifyContent = frameVisualW < 1100 ? "flex-start" : "";
      }
      const info = document.getElementById("viewportInfo");
      if (info) {
        const availH = device.screenH - device.topChrome - device.bottomChrome;
        const layoutName = LAYOUTS[activeLayout] ? LAYOUTS[activeLayout].name : activeLayout;
        const contentW = activeLayout === "ap-2col" ? (sidebarExpanded ? AP_CONTENT_W_EXPANDED : AP_CONTENT_W_COLLAPSED) : 1044;
        info.innerHTML = '<strong>' + device.name + ' / ' + layoutName + '</strong><br><strong>Screen:</strong> ' + device.screenW + 'w \u00d7 ' + device.screenH + 'h \u2022 <strong>Available:</strong> ' + frameVisualW + 'w \u00d7 ' + availH + 'h \u2022 <strong>Content:</strong> ' + contentW + 'w \u00d7 ' + AP_CONTENT_H + 'h';
        const isClipping = wrapperW < device.screenW;
        info.style.alignSelf = isClipping ? "flex-start" : "";
        info.style.minWidth = isClipping ? Math.max(frameVisualW, 1100) + "px" : "";
      }
    }
  } else if (activeDevice !== "none" && activeDevice !== "chromebook") {
    // iPad/Android + any layout — label freeze only
    const info = document.getElementById("viewportInfo");
    const device = DEVICES[activeDevice];
    if (info && device) {
      const wrapperW = document.querySelector(".viewport-wrapper").clientWidth;
      const isClipping = wrapperW < device.screenW;
      info.style.alignSelf = isClipping ? "flex-start" : "";
      info.style.minWidth = isClipping ? device.screenW + "px" : "";
    }
  }
  // Let the interactive re-measure at the new size
  if (SIM.onResize) SIM.onResize();
});

</script>
</body>
