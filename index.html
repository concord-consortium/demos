    commNote.textContent = "Researchers will read all " + items.length +
      " sets of notes and code one more attribute. You can afford " + BUDGET + ".";
    pBody.appendChild(commNote);

    const listEl = document.createElement("div");
    listEl.className = "d3b-list";
    pBody.appendChild(listEl);

    const resultEl = document.createElement("div");
    resultEl.className = "d3b-results";
    pBody.appendChild(resultEl);

    // r for an attribute against each pathway, over the whole set — the point is
    // that a commissioned attribute is judged on ALL 800, not the filtered few.
    function rowFor(attrIndex) {
      const vals = items.map(function (it) { return it.attrs[attrIndex]; });
      const out = [];
      for (let p = 0; p < NP; p++) {
        out.push(pearson(vals, items.map(function (it) { return it.act[p]; })));
      }
      return out;
    }

    function corrChip(r) {
      const el = document.createElement("span");
      el.className = "d3b-chip";
      const dot = document.createElement("i");
      dot.className = "d3-dot";
      const side = 8 + 22 * Math.sqrt(Math.min(1, Math.abs(r)));
      dot.style.width = side.toFixed(1) + "px";
      dot.style.height = side.toFixed(1) + "px";
      dot.style.background = r === 0 ? "#FFFFFF"
        : (r > 0 ? FILL_POS : FILL_NEG)[level(Math.min(1, Math.abs(r)))];
      const n = document.createElement("span");
      n.textContent = (r >= 0 ? "+" : "−") + Math.abs(r).toFixed(2);
      el.appendChild(dot); el.appendChild(n);
      return el;
    }

    function renderList() {
      listEl.innerHTML = "";
      HIDDEN.forEach(function (h) {
        const row = document.createElement("div");
        row.className = "d3b-item" + (bought.indexOf(h.a.key) >= 0 ? " done" : "");
        const name = document.createElement("div");
        name.className = "d3b-itemname";
        name.textContent = h.a.label;
        const desc = document.createElement("div");
        desc.className = "d3b-itemdesc";
        desc.textContent = h.a.description;
        const btn = document.createElement("button");
        btn.className = "d3b-buy";
        if (bought.indexOf(h.a.key) >= 0) {
          btn.textContent = "Coded";
          btn.disabled = true;
        } else {
          btn.textContent = "Commission";
          btn.disabled = bought.length >= BUDGET;
          btn.addEventListener("click", function () {
            if (bought.length >= BUDGET) return;
            bought.push(h.a.key);
            render();
          });
        }
        row.appendChild(name); row.appendChild(desc); row.appendChild(btn);
        listEl.appendChild(row);
      });
    }

    function renderResults() {
      resultEl.innerHTML = "";
      if (!bought.length) return;
      const h = document.createElement("div");
      h.className = "d3b-subhead";
      h.textContent = "What the coding found";
      resultEl.appendChild(h);
      const tbl = document.createElement("div");
      tbl.className = "d3b-table";
      const hdr = document.createElement("div");
      hdr.className = "d3b-trow head";
      hdr.appendChild(document.createElement("div"));
      NAMES.forEach(function (n) {
        const c = document.createElement("div");
        c.textContent = n;
        hdr.appendChild(c);
      });
      tbl.appendChild(hdr);
      bought.forEach(function (key) {
        const h2 = HIDDEN.filter(function (x) { return x.a.key === key; })[0];
        const rs = rowFor(h2.i);
        const tr = document.createElement("div");
        tr.className = "d3b-trow";
        const lab = document.createElement("div");
        lab.textContent = h2.a.label;
        tr.appendChild(lab);
        rs.forEach(function (r) {
          const c = document.createElement("div");
          if (Math.abs(r) >= 0.3) c.className = "hit";
          c.appendChild(corrChip(r));
          tr.appendChild(c);
        });
        tbl.appendChild(tr);
      });
      resultEl.appendChild(tbl);
    }

    function render() {
      const empty = cases.length === 0;
      casePane.casePanel.style.display = empty ? "none" : "";
      casePane.emptyMsg.hidden = !empty;
      panel.style.visibility = empty ? "hidden" : "";
      budgetEl.textContent = bought.length + " of " + BUDGET + " commissioned";
      renderList();
      renderResults();
      if (empty) return;
      if (idx >= cases.length) idx = cases.length - 1;
      const it = cases[idx];
      casePane.countEl.textContent = (idx + 1) + " / " + cases.length;
      setAriaDisabled(casePane.prevBtn, idx === 0);
      setAriaDisabled(casePane.nextBtn, idx === cases.length - 1);
      casePane.caseIdEl.title = "#" + it.id;
      for (let p = 0; p < NP; p++) casePane.paintReading(p, it);

      notesEl.textContent = it.obs || "(no notes for this conversation)";

      knownEl.innerHTML = "";
      D.attributes.forEach(function (a, i) {
        if (a.hidden && bought.indexOf(a.key) < 0) return;   // not coded yet
        const chip = document.createElement("span");
        const v = it.attrs[i];
        const lab = (a.valueLabels && a.valueLabels[v]) !== undefined
          ? a.valueLabels[v] : String(v);
        chip.className = "d3b-attr" + (a.hidden ? " new" : "") + (v ? " on" : "");
        chip.textContent = a.label + ": " + lab;
        knownEl.appendChild(chip);
      });
    }

    casePane.prevBtn.addEventListener("click", function () {
      if (idx > 0) { idx--; render(); }
    });
    casePane.nextBtn.addEventListener("click", function () {
      if (idx < cases.length - 1) { idx++; render(); }
    });

    // Opens on the cases the curriculum sends students to: the ones the model
    // got wrong where Pathway 3 was shouting.
    casePane.filter.input.value = "model_correct:0 AND pathway_3:>2";
    casePane.filter.input.dispatchEvent(new Event("input", { bubbles: true }));

    render();
    SIM.onResize = function () {};
    return wrap;
  }


  // ---------------------------------------------------------------
  // 3A — Correlations.  Matches Design Sketches: a matrix of pathways
  // against things we already know how to name, in two views. The point
  // of the day is that a pathway cannot be read directly — you interpret
  // it indirectly, through attributes you can name. Colour convention is
  // the shipped Pathway Explorer's and Day 2's: blue negative, warm positive.
  // ---------------------------------------------------------------
  if (activeSim === "d3a") {
    const D = window.NNM_DATA;
    const NP = D.nPathways;
    const ALL = D.items;
    // Correlations are computed over the filtered set, the way the shipped
    // Pathway Explorer does it. That is not a convenience: over all 800 Pathway 3
    // lines up with nothing, and its association with the predicted label only
    // appears once you narrow to the conversations the model got wrong. The
    // filter is how the day's finding is reached.
    let items = ALL.slice();

    const wrap = document.createElement("div");
    wrap.className = "sim-content d3-wrap";

    // ---- the series we can correlate a pathway against ----
    const HIDE = ["resource_stressed", "gestures_repeated", "young_present", "carrying_burden"];
    let rows = [], paths = [], R = [];
    function buildSeries() {
    rows = [
      { key: "target", label: "Actual label", vals: items.map(function (it) { return it.target; }),
        groups: [[0, "Wait"], [1, "Approach"]] },
      { key: "pred", label: "Model prediction", vals: items.map(function (it) { return it.pred; }),
        groups: [[0, "Wait"], [1, "Approach"]] },
      { key: "correct", label: "Model was correct", vals: items.map(function (it) { return it.pred === it.target ? 1 : 0; }),
        groups: [[0, "wrong"], [1, "right"]] }
    ];
    D.attributes.forEach(function (a, i) {
      if (HIDE.indexOf(a.key) >= 0) return;              // Day 3 reveals these later
      const vals = items.map(function (it) { return it.attrs[i]; });
      const uniq = Array.from(new Set(vals)).sort(function (x, y) { return x - y; });
      const groups = uniq.length <= 6
        ? uniq.map(function (v) { return [v, (a.valueLabels && a.valueLabels[v]) || String(v)]; })
        : [[0, "low"], [1, "high"]];
      rows.push({ key: a.key, label: a.label, vals: vals, groups: groups, integer: a.type === "integer" });
    });

    paths = [];
    const alo = Math.min.apply(null, D.scoreMin), ahi = Math.max.apply(null, D.scoreMax);
    for (let p = 0; p < NP; p++) {
      paths.push({ label: "Pathway " + (p + PATH_OFFSET),
                   vals: items.map(function (it) { return it.act[p]; }),
                   lo: alo, hi: ahi });
    }
    // The chain's own output, as a fourth column. This is where the curriculum's
    // question gets answered: read across the Actual label row and the weighted
    // sum sits just BELOW Pathway 1, not above it. The model's importances are
    // fitted to reproduce its own prediction, not the truth, so combining the
    // pathways with them throws away what the other two knew.
    const ws = items.map(function (it) {
      let t = 0;
      for (let p = 0; p < NP; p++) t += it.act[p] * D.importance[p];
      return t;
    });
    let wlo = Infinity, whi = -Infinity;
    ws.forEach(function (v) { if (v < wlo) wlo = v; if (v > whi) whi = v; });
    paths.push({ label: "Weighted sum", vals: ws, lo: wlo, hi: whi, derived: true });
    R = rows.map(function (row) {
      return paths.map(function (pa) { return pearson(row.vals, pa.vals); });
    });
    }

    const ACT_LO = Math.min.apply(null, D.scoreMin);
    const ACT_HI = Math.max.apply(null, D.scoreMax);

    // ---- header ----
    // One toolbar: the find bar at the same width it has in the Prediction Chain,
    // so the two interactives read as the same tool, and the view switch on the
    // far right where the Animate toggle sits over there.
    const toolbar = document.createElement("div");
    toolbar.className = "d3-toolbar";
    wrap.appendChild(toolbar);

    const filter = NNM_FILTER.buildBar(function (its) {
      items = its.length ? its : [];
      render();
    });
    filter.el.classList.add("d3-filter");
    toolbar.appendChild(filter.el);

    const head = document.createElement("div");
    head.className = "d3-head";
    const title = document.createElement("div");
    title.className = "d3-title";
    head.appendChild(title);
    const views = document.createElement("div");
    views.className = "d3-views";
    let view = "corr";
    const viewBtns = [["corr", "Correlation view"], ["graph", "Graph view"]].map(function (v) {
      const b = document.createElement("button");
      b.className = "d3-viewbtn";
      b.textContent = v[1];
      b.addEventListener("click", function () { view = v[0]; render(); });
      views.appendChild(b);
      return { key: v[0], el: b };
    });
    toolbar.appendChild(views);
    wrap.appendChild(head);

    const scroll = document.createElement("div");
    scroll.className = "d3-scroll";
    wrap.appendChild(scroll);

    const note = document.createElement("div");
    note.className = "d3-note";
    wrap.appendChild(note);

    // ---- a cell in the correlation view: area tracks |r|, colour its sign ----
    function corrCell(r) {
      const el = document.createElement("div");
      el.className = "d3-cell corr";
      const dot = document.createElement("i");
      dot.className = "d3-dot";
      const t = Math.sqrt(Math.min(1, Math.abs(r)));
      const side = 8 + 46 * t;
      dot.style.width = side.toFixed(1) + "px";
      dot.style.height = side.toFixed(1) + "px";
      dot.style.background = r === 0 ? "#FFFFFF"
        : (r > 0 ? FILL_POS : FILL_NEG)[level(Math.min(1, Math.abs(r)))];
      const num = document.createElement("span");
      num.className = "d3-r";
      num.textContent = (r >= 0 ? "+" : "−") + Math.abs(r).toFixed(2);
      el.appendChild(dot); el.appendChild(num);
      el.title = "r = " + r.toFixed(4) + "  (n = " + items.length + ")";
      if (Math.abs(r) >= 0.30) el.classList.add("strong");
      return el;
    }

    // ---- the graph view, built the way the sketch is: CODAP dot plots ----
    // Every panel uses the same mark. One dot is one conversation — stacks are
    // literal counts, not a histogram scaled to fit — so "how many" reads the same
    // in a marginal, a cell, and a category. Dots shrink when a stack would
    // overflow rather than the count being capped, which is what CODAP does.
    const AXIS_H = 16, LABEL_W = 52, PAD_R = 6, PAD_T = 6;

    function niceTicks(lo, hi, want) {
      const span = hi - lo;
      if (!(span > 0)) return [lo];
      const raw = span / want;
      const mag = Math.pow(10, Math.floor(Math.log10(raw)));
      const norm = raw / mag;
      const stepN = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
      const step = stepN * mag;
      const out = [];
      for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(v);
      return out;
    }

    function fmtTick(v, span) {
      const dp = span >= 20 ? 0 : span >= 4 ? 1 : 2;
      return (Math.abs(v) < 1e-9 ? 0 : v).toFixed(dp);
    }

    // Lays one band of dots: values -> x, packed into columns a dot wide, stacked
    // upward from the baseline. Returns the radius that made the tallest stack fit.
    function packBand(vals, lo, hi, plotW, bandH) {
      let r = 3.2;
      for (; r >= 0.9; r -= 0.15) {
        const d = r * 2, cols = Math.max(1, Math.round(plotW / d));
        const counts = new Array(cols).fill(0);
        let tallest = 0;
        for (let i = 0; i < vals.length; i++) {
          let c = Math.floor(((vals[i] - lo) / (hi - lo)) * cols);
          if (c < 0) c = 0; if (c >= cols) c = cols - 1;
          counts[c]++;
          if (counts[c] > tallest) tallest = counts[c];
        }
        if (tallest * d <= bandH - 2 || r <= 0.9) {
          const pts = [];
          const seen = new Array(cols).fill(0);
          for (let i = 0; i < vals.length; i++) {
            let c = Math.floor(((vals[i] - lo) / (hi - lo)) * cols);
            if (c < 0) c = 0; if (c >= cols) c = cols - 1;
            pts.push([c * d + r, seen[c] * d + r]);
            seen[c]++;
          }
          return { r: r, pts: pts };
        }
      }
      return { r: 0.9, pts: [] };
    }

    function svgEl(name, attrs) {
      const e = document.createElementNS(SVGNS, name);
      Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      return e;
    }

    // One dot plot. `bands` is a list of {label, vals}; a single band gives the
    // marginal distributions in the headers, several give a matrix cell.
    function dotPlot(bands, lo, hi, W, H, opts) {
      opts = opts || {};
      const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", height: H });
      svg.setAttribute("class", "d3-plot");
      const labW = opts.noLabels ? 8 : LABEL_W;
      const plotW = W - labW - PAD_R;
      const plotH = H - AXIS_H - PAD_T;
      const bandH = plotH / bands.length;

      bands.forEach(function (b, bi) {
        const base = PAD_T + (bi + 1) * bandH;
        svg.appendChild(svgEl("line", {
          x1: labW, x2: W - PAD_R, y1: base, y2: base,
          stroke: bi === bands.length - 1 ? "#B9C0CA" : "#E4E8EE", "stroke-width": 1
        }));
        if (!opts.noLabels) {
          const t = svgEl("text", { x: labW - 6, y: base - bandH / 2, class: "d3-blabel" });
          t.setAttribute("text-anchor", "end");
          t.setAttribute("dominant-baseline", "middle");
          t.textContent = b.label;
          svg.appendChild(t);
        }
        const packed = packBand(b.vals, lo, hi, plotW, bandH);
        packed.pts.forEach(function (pt) {
          svg.appendChild(svgEl("circle", {
            cx: labW + pt[0], cy: base - pt[1], r: packed.r, class: "d3-pt"
          }));
        });
      });

      niceTicks(lo, hi, 5).forEach(function (v) {
        const x = labW + ((v - lo) / (hi - lo)) * plotW;
        svg.appendChild(svgEl("line", {
          x1: x, x2: x, y1: PAD_T + plotH, y2: PAD_T + plotH + 3,
          stroke: "#B9C0CA", "stroke-width": 1
        }));
        const t = svgEl("text", { x: x, y: H - 3, class: "d3-tick" });
        t.setAttribute("text-anchor", "middle");
        t.textContent = fmtTick(v, hi - lo);
        svg.appendChild(t);
      });
      return svg;
    }

    function graphCell(row, pi) {
      const el = document.createElement("div");
      el.className = "d3-cell graph";
      const gv = row.gvals || row.vals;
      const bands = row.groups.map(function (g) {
        const vals = [];
        for (let i = 0; i < items.length; i++) if (gv[i] === g[0]) vals.push(paths[pi].vals[i]);
        return { label: g[1], vals: vals };
      });
      el.appendChild(dotPlot(bands, paths[pi].lo, paths[pi].hi, 210,
        Math.max(70, 26 * bands.length + AXIS_H + PAD_T)));
      return el;
    }

    // The marginals the sketch puts in the headers: what each variable looks like
    // on its own, before anything is compared. An attribute that is 95% one value
    // cannot correlate with much, and that is visible here and nowhere else.
    function pathMarginal(pa) {
      return dotPlot([{ label: "", vals: pa.vals }], pa.lo, pa.hi, 210, 62, { noLabels: true });
    }

    function rowMarginal(row) {
      const gv = row.gvals || row.vals;
      const counts = row.groups.map(function (g) {
        let n = 0;
        for (let i = 0; i < gv.length; i++) if (gv[i] === g[0]) n++;
        return { label: g[1], n: n };
      });
      const most = Math.max.apply(null, counts.map(function (c) { return c.n; })) || 1;
      const el = document.createElement("div");
      el.className = "d3-marg";
      counts.forEach(function (c) {
        const b = document.createElement("div");
        b.className = "d3-margrow";
        const bar = document.createElement("i");
        bar.style.width = (6 + 62 * c.n / most).toFixed(1) + "px";
        const lab = document.createElement("span");
        lab.textContent = c.label;
        const n = document.createElement("em");
        n.textContent = c.n;
        b.appendChild(bar); b.appendChild(lab); b.appendChild(n);
        el.appendChild(b);
      });
      return el;
    }

    // Below this, r swings wildly on one or two conversations and reads as a
    // finding when it is not. Every cell shares the same n, so the whole matrix
    // says so rather than marking cells individually.
    const MIN_N = 12;

    function render() {
      const n = items.length;
      title.textContent = "Correlations over " + n + " of " + ALL.length + " conversations";
      if (n < MIN_N) {
        scroll.innerHTML = "";
        note.innerHTML = n === 0
          ? "Nothing matches that filter."
          : "Only " + n + " conversations match. A correlation over so few is mostly "
            + "noise — widen the filter to at least " + MIN_N + " to read this matrix.";
        viewBtns.forEach(function (v) { v.el.classList.toggle("on", v.key === view); });
        return;
      }
      buildSeries();
      viewBtns.forEach(function (v) {
        v.el.classList.toggle("on", v.key === view);
        v.el.setAttribute("aria-pressed", v.key === view ? "true" : "false");
      });
      scroll.innerHTML = "";
      const grid = document.createElement("div");
      grid.className = "d3-grid " + view;
      grid.style.gridTemplateColumns = "150px repeat(" + paths.length + ", 1fr)";
      const corner = document.createElement("div");
      corner.className = "d3-corner";
      grid.appendChild(corner);
      paths.forEach(function (pa, pi) {
        const h = document.createElement("div");
        h.className = "d3-colhead" + (pa.derived ? " derived" : "");
        const nm = document.createElement("div");
        nm.className = "d3-colname";
        nm.textContent = pa.label;
        h.appendChild(nm);
        if (view === "graph") h.appendChild(pathMarginal(pa));
        grid.appendChild(h);
      });
      rows.forEach(function (row, ri) {
        const lab = document.createElement("div");
        lab.className = "d3-rowhead" + (ri < 3 ? " outcome" : "")
          + (row.derived ? " derived" : "");
        const nm = document.createElement("div");
        nm.className = "d3-rowname";
        nm.textContent = row.label;
        lab.appendChild(nm);
        if (view === "graph") lab.appendChild(rowMarginal(row));
        grid.appendChild(lab);
        paths.forEach(function (pa, pi) {
          grid.appendChild(view === "corr" ? corrCell(R[ri][pi]) : graphCell(row, pi));
        });
      });
      scroll.appendChild(grid);
      note.innerHTML = view === "corr"
        ? "Each circle is the correlation between that row and that pathway, over the "
          + items.length + " conversations in the filter. Area tracks strength, colour "
          + "tracks direction. Hover a cell for the exact value."
        : "One dot is one conversation. Each panel splits a pathway’s activations by the "
          + "row’s value; the headers show what each one looks like on its own. Two piles "
          + "sitting in the same place means the pathway does not tell those groups apart.";
    }

    // Opens on the conversations the model got wrong, which is where the day's
    // finding lives: over all 800 Pathway 3 lines up with nothing, and only in
    // here does it become the strongest thing in the matrix.
    filter.input.value = "model_correct:0";
    filter.input.dispatchEvent(new Event("input", { bubbles: true }));

    render();
    SIM.onResize = function () {};
    return wrap;
  }


  // ---------------------------------------------------------------
  // 2B — The Prediction Chain.  Laid out to match Design Sketches p.3:
  // left, one card holding all three pathway readings; right, the flow
  // activation x importance => weighted, the three converging on a sum,
  // the sum choosing between two outcomes, and the stacked bar beneath.
  // Probability is omitted on purpose (spec: "not visible, for internal").
  // ---------------------------------------------------------------
  if (activeSim === "d2b") {
    const D = window.NNM_DATA;
    const NP = D.nPathways;
    const IMP = D.importance;
    // Pathways are numbered from 1 for students. The data — act[], importance[],
    // explainedVariance[], baseValues[] — is indexed from 0 and stays that way,
    // so every label is the index plus PATH_OFFSET and nothing else converts.
    const PATH_NAMES = Array.from(
      { length: D.nPathways },
      function (_, i) { return "Pathway " + (i + PATH_OFFSET); }
    );
    // Area-proportional, not side-proportional: if the side tracked the value,
    // doubling it would quadruple the ink. side = MAX * sqrt(v / scale) makes the
    // AREA track the value, which is what the eye actually judges.
    // SIZE is measured against one scale for all four columns, so a square means
    // the same thing wherever it appears — and so the chain can be read across:
    // activation x importance visibly grows or shrinks into the weighted value.
    // Per-column sizing made that invisible, because it rescaled the result back
    // to the same apparent size as the input.
    // COLOUR stays per-column: activations are at most 6% of the shared scale, so
    // colouring them against it would wash the whole column out to nothing.
    function sizeSym(cell, v, sizeScale, colourScale) {
      const sq = cell.querySelector(".nnm-sq");
      if (!sq) return;
      const scale = colourScale === undefined ? sizeScale : colourScale;
      const t = Math.sqrt(Math.min(1, Math.abs(v) / sizeScale));
      const side = SYM_MIN + (SYM_MAX - SYM_MIN) * t;
      sq.style.width = side.toFixed(1) + "px";
      sq.style.height = side.toFixed(1) + "px";
      // Zero has no sign, and the legend already says so — its ramp runs
      // blue - white - orange. Tinting the opening square the lightest positive
      // shade claimed a direction the value does not have; it starts white and
      // takes a colour only once a word has moved it.
      sq.style.background = v === 0 ? "#FFFFFF"
        : (v > 0 ? FILL_POS : FILL_NEG)[level(Math.min(1, Math.abs(v) / scale))];
    }

    // One way in for every value the three symbol cells show, so the number and
    // its square can never disagree.
    function writeCell(cell, v, colourScale, sizeScale) {
      const num = cell.querySelector(".nnm-num");
      // 4dp throughout. Importance needs it because Pathway 2's is 0.0854 and 2dp
      // read 0.09 — 5.4% high on the one number whose smallness is the point. The
      // computed columns need it because at 3dp seven values across the 800 came
      // out as "+0.000"/"−0.000"; the smallest anywhere is −0.000135, so 4dp
      // clears every one of them.
      (num || cell).textContent = fmt(v, 4);
      paint(cell, v, colourScale);
      sizeSym(cell, v, sizeScale === undefined ? colourScale : sizeScale, colourScale);
    }

    function paint(el, v, scale) {
      const L = level(Math.min(1, Math.abs(v) / scale));
      el.style.background = (v >= 0 ? FILL_POS : FILL_NEG)[L];
      el.style.color = L === 4 ? "#fff" : "#1E242C";
      el.style.borderColor = L === 4 ? "transparent" : "rgba(30,36,44,0.14)";
    }

    const SUM_SCALE = 40;
    // Squares are sized against the largest value the whole dataset produces, so a
    // square means the same thing on every conversation. The weighted values and
    // the sum share one scale because the sum IS those three added — sharing is
    // what makes that readable. Activation keeps its own: it spans +-4.8 against
    // the weighted +-74, and one scale across both would flatten it to nothing.
    const SYM_SCALE = (function () {
      let m = 0;
      D.items.forEach(function (it) {
        let s = 0;
        for (let p = 0; p < NP; p++) {
          const w = it.act[p] * IMP[p];
          s += w;
          m = Math.max(m, Math.abs(w));
        }
        m = Math.max(m, Math.abs(s));
      });
      return m;
    })();
    // Side of the largest square. The squares are absolutely positioned, so they
    // do not drive layout width — only the cells do — and the sum's square is free
    // to overhang its 62px cell into the blank either side of it. The real limit
    // is vertical: the cell must be tall enough to centre this and still clear the
    // number below, and the rows (and through syncRows, the readings) follow.
    const SYM_MAX = 68;
    const SYM_MIN = 12;   // and of the smallest, so a zero still reads as a square
    const ACT_SCALE = Math.max.apply(null, D.scoreMin.map(Math.abs).concat(D.scoreMax.map(Math.abs)));
    const IMP_MAX = Math.max.apply(null, IMP.map(Math.abs));
    // One colour scale across all three pathways, not one each. Per-pathway
    // normalisation is common in attribution tools and keeps a weak output
    // readable, but here the three maxima sit within 1.48x of each other, so it
    // bought almost nothing while implying the readings were separately
    // calibrated and not comparable. It also disagreed with the cells the words
    // fly into: ACT_SCALE is already a single value across all three, so the same
    // word could read full-strength on the left and mid-tone on the right.
    // Pathway 1's strongest word now renders at 68% intensity, Pathway 2's at 76%.
    const TOK_MAX = Math.max.apply(null,
      Object.keys(D.vocabulary).map(function (w) { return Math.abs(D.vocabulary[w][1]); }));

    let cases = D.items.slice();
    let idx = 0;
    let step = 0;      // 0 = empty skeleton; the four buttons fill it in

    const wrap = document.createElement("div");
    wrap.className = "sim-content";
    const liveAnnounce = document.createElement("div");
    liveAnnounce.className = "sr-only";
    liveAnnounce.setAttribute("aria-live", "polite");
    liveAnnounce.setAttribute("aria-atomic", "true");
    wrap.appendChild(liveAnnounce);
    SIM.announce = function (msg) {
      liveAnnounce.textContent = "";
      requestAnimationFrame(function () { liveAnnounce.textContent = msg; });
    };
    SIM._timeouts = []; SIM._observers = [];

    const stack = document.createElement("div");
    stack.className = "nnm-stack";
    wrap.appendChild(stack);

    const root = document.createElement("div");
    root.className = "nnm";
    stack.appendChild(root);

    // The find bar sits over the conversation list it filters, so it takes the
    // left column's width and the flow panel runs the full height beside it.
    // The panel itself is shared with 3B — see buildCasePanel. 2B keeps its own
    // render(), because it has to withhold the word colours until Activate runs
    // and drive the chain on the right off the same case.
    const casePane = buildCasePanel({
      onFilter: function (items) { cases = items; goToCase(0); }
    });
    const leftCol = casePane.leftCol;
    root.appendChild(leftCol);
    const filter = casePane.filter;
    const emptyMsg = casePane.emptyMsg;
    const casePanel = casePane.casePanel;
    const caseIdEl = casePane.caseIdEl;
    const countEl = casePane.countEl;
    const prevBtn = casePane.prevBtn;
    const nextBtn = casePane.nextBtn;
    const readHead = casePane.readHead;
    const readScroll = casePane.readScroll;
    const readings = casePane.readings;
    // ================= right: the flow =================
    const rightCol = document.createElement("div");
    rightCol.className = "nnm-rightcol";
    root.appendChild(rightCol);

    const chainPanel = document.createElement("div");
    chainPanel.className = "nnm-panel nnm-flowpanel";
    chainPanel.setAttribute("role", "region");
    chainPanel.setAttribute("aria-label", "How the pathways decide");

    const chainHead = document.createElement("div");
    chainHead.className = "nnm-panel-head";
    const chainHeadTitle = document.createElement("span");
    chainHeadTitle.textContent = "Neural pathways";
    chainHead.appendChild(chainHeadTitle);

    // Words read off the page: three lines of text with some words marked.
    const ICON_ACTIVATE =
      '<svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">' +
      '<rect x="1" y="2.4" width="5.5" height="2.6" rx="1.1"/>' +
      '<rect x="8" y="2.4" width="7" height="2.6" rx="1.1" opacity=".3"/>' +
      '<rect x="1" y="6.7" width="4" height="2.6" rx="1.1" opacity=".3"/>' +
      '<rect x="5.5" y="6.7" width="6.5" height="2.6" rx="1.1"/>' +
      '<rect x="1" y="11" width="6.5" height="2.6" rx="1.1"/>' +
      '<rect x="9" y="11" width="4.5" height="2.6" rx="1.1" opacity=".3"/></svg>';

    // The multiply glyph itself, the same shape that sits in every row.
    const ICON_WEIGH =
      '<svg viewBox="0 0 32 32" aria-hidden="true" fill="currentColor">' +
      '<path d="M6 2 L16 12 L26 2 L30 6 L20 16 L30 26 L26 30 L16 20 L6 30 L2 26 L12 16 L2 6 Z"/></svg>';

    // Three contributions converging on one total.
    const ICON_ADDUP =
      '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round">' +
      '<path d="M1 1.4 L10 8"/><path d="M1 8 H10"/><path d="M1 14.6 L10 8"/>' +
      '<circle cx="12.8" cy="8" r="2.4" fill="currentColor" stroke="none"/></svg>';

    // One score forking to two answers; the one it picks is filled.
    const ICON_PREDICT =
      '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" ' +
      'stroke-width="1.7" stroke-linecap="round">' +
      '<path d="M0.8 8 H5"/><path d="M5 8 C8 8 7.5 2.6 10.2 2.6"/>' +
      '<path d="M5 8 C8 8 7.5 13.4 10.2 13.4"/>' +
      '<circle cx="12.9" cy="2.6" r="2.7" fill="currentColor" stroke="none"/>' +
      '<circle cx="12.9" cy="13.4" r="2"/></svg>';

    const STEP_LABELS = ["Activate", "Weigh", "Add Up", "Predict"];
    const STEP_ICONS = [ICON_ACTIVATE, ICON_WEIGH, ICON_ADDUP, ICON_PREDICT];
    let prevStep = 0;
    let wordAnim = false;          // true while the Words sequence is in flight
    let weighAnim = false;         // true while the Weigh sequence is in flight
    let addUpAnim = false;         // true while the three lines are converging
    let decideAnim = false;        // true while the answer line is being drawn
    let decidePending = true;      // the answer line is hidden until Decide runs
    let animateOn = true;          // the Animate checkbox
    // The non-animated version is the same screen with every stage arriving at
    // once. Reduced-motion users get it whether or not the box is ticked.
    function motionOff() {
      return !animateOn || window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }
    const CONV_W = 46;             // the conv SVG's real layout contribution
    let animSeq = 0;               // bumped to invalidate anything still queued
    const animTimers = [];

    function cancelAnim() {
      animSeq++;
      animTimers.forEach(clearTimeout);
      animTimers.length = 0;
      document.querySelectorAll(".nnm-fly").forEach(function (e) { e.remove(); });
      if (trackRaf) { cancelAnimationFrame(trackRaf); trackRaf = null; }
      // Both flags mean the same thing and must be cleared the same way: false =
      // the line is drawn. playDecide raises decidePending itself when it is about
      // to animate, so raising it here only affected the paths that DON'T animate
      // — restoring a conversation from memory — where it hid the fan line while
      // the three convergence lines came back drawn.
      for (let i = 0; i < solidPending.length; i++) solidPending[i] = false;
      decidePending = false;
      wordAnim = false;
      weighAnim = false;
      addUpAnim = false;
      decideAnim = false;
    }
    function later(fn, ms) {
      const mine = animSeq;
      const t = setTimeout(function () { if (mine === animSeq) fn(); }, ms);
      animTimers.push(t);
      SIM._timeouts.push(t);
    }

    // One word at a time: it lights where it sits, travels to the activation
    // cell carrying its own score, and on arrival that score is added to the
    // running total in the cell. The number a student watches climb IS the sum
    // that defines the pathway activation.
    function flyOne(el, target, v, scores) {
      const r = el.getBoundingClientRect();
      // The square is what the eye reads as the value now, and it sits in the
      // middle of a mostly empty 82px cell — aiming at the cell would send chips
      // to a rim well above it. Its centre is fixed as it grows (it is
      // translate(-50%,-50%)), so it is a stable target mid-flight.
      const tr = (target.querySelector(".nnm-sq") || target).getBoundingClientRect();
      const c = document.createElement("span");
      c.className = "nnm-fly";
      c.style.left = r.left + "px";
      c.style.top = r.top + "px";
      // Colours come from the token's own custom properties, not getComputedStyle:
      // `lit` animates the background, so the computed value can still be the
      // un-lit one and the chip would come out transparent.
      c.style.background = scores ? el.style.getPropertyValue("--tok-bg") : "#FFFFFF";
      c.style.color = scores ? el.style.getPropertyValue("--tok-fg") : "var(--nnm-ink-2)";
      if (!scores) c.style.border = "1px solid var(--nnm-rule)";
      c.textContent = el.textContent;
      document.body.appendChild(c);

      // Measure the CHIP, not the word. The chip is placed at the word's top-left
      // but is a different size, so offsetting by the word's centre leaves the
      // chip landing about 20px right of target.
      const cr = c.getBoundingClientRect();
      const dx = (tr.left + tr.width / 2) - (cr.left + cr.width / 2);
      const dy = (tr.top + tr.height / 2) - (cr.top + cr.height / 2);

      // A sampled quadratic Bézier rather than a few waypoints: the control point
      // sits above the midpoint, so the path is a real parabola into the cell.
      // Easing is baked into the sampling and the animation runs linear, because
      // an easing in the options would be re-applied between every keyframe.
      const lift = Math.min(150, Math.abs(dx) * 0.30 + 60);
      const cx = dx * 0.42;
      const cy = Math.min(0, dy) - lift;
      const STEPS = 20;
      const frames = [];
      for (let i = 0; i <= STEPS; i++) {
        const u = i / STEPS;
        const s2 = u * u * (3 - 2 * u);               // smoothstep
        const mt = 1 - s2;
        const x = 2 * mt * s2 * cx + s2 * s2 * dx;
        const y = 2 * mt * s2 * cy + s2 * s2 * dy;
        const sc = 1 - 0.56 * Math.pow(s2, 1.5);
        const rot = (1 - s2) * (dx < 0 ? 5 : -5);
        const op = s2 < 0.74 ? 1 : Math.max(0, 1 - (s2 - 0.74) / 0.26);
        frames.push({
          offset: u,
          transform: "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) rotate(" +
            rot.toFixed(2) + "deg) scale(" + sc.toFixed(3) + ")",
          opacity: op
        });
      }
      c.animate(frames, { duration: FLY, easing: "linear", fill: "forwards" });
      later(function () { c.remove(); }, FLY + 120);
    }

    function showZero(cell) {
      const z = cell.querySelector(".nnm-num");
      (z || cell).textContent = fmt(0, 4);
      sizeSym(cell, 0, SYM_SCALE, ACT_SCALE);
      cell.style.background = "#fff";
      cell.style.color = "var(--nnm-ink-3)";
      cell.style.borderColor = "rgba(30,36,44,0.14)";
    }

    // nnm-pop and nnm-tick both set `animation` at the same specificity, and
    // .nnm-pop is declared later, so it wins wherever both are present. A cell
    // revealed with a pop would then swallow every kick that followed — the
    // class went on, the animation never changed. Only one is ever left on.
    function bump(cell) {
      cell.classList.remove("nnm-tick", "nnm-pop");
      void cell.offsetWidth;   // restart the animation on a re-add
      cell.classList.add("nnm-tick");
    }

    function showRunning(cell, v) {
      cell.querySelector(".nnm-num").textContent = fmt(v, 4);
      sizeSym(cell, v, SYM_SCALE, ACT_SCALE);
      cell.style.color = "";
      paint(cell, v, ACT_SCALE);
      bump(cell);
    }

    const SCAN_HOLD = 300;   // how long a word wears the outline before resolving
    const FLY = 1440;        // a chip's journey
    const PAUSE = 100;       // after the sentence is lit, before the cell opens
    const TO_FLY = 110;      // base held before the first word sets off
    const TAIL = 170;        // after the last arrival, before the next pathway

    function playWords() {
      const it = cases[idx];
      const groups = readings.map(function (r) {
        return Array.prototype.slice.call(r.querySelectorAll(".nnm-tok.scored"));
      });
      const allWords = readings.map(function (r) {
        return Array.prototype.slice.call(r.querySelectorAll(".nnm-tok"));
      });
      if (motionOff()) {
        allWords.forEach(function (g) { g.forEach(function (e) { e.classList.add("lit"); }); });
        rows.forEach(function (r, p) { revealCell(r.querySelector(".act"), 0); });
        wordAnim = false;
        return;
      }
      let t = 0;
      for (let p = 0; p < NP; p++) {
        const toks = groups[p];
        const all = allWords[p];
        const cell = rows[p].querySelector(".act");
        const n = toks.length;
        // Longer conversations send words faster, so a pathway takes roughly the
        // same time to build whether it has four words or fourteen.
        const gap = Math.max(80, Math.min(170, 1100 / Math.max(1, n)));
        const start = t;

        // 1. every word in the sentence is scanned in turn — outlined, then
        //    resolved to a colour if this pathway knows it, or left white if not.
        //    Scanning all of them, not just the scoring ones, is the point: the
        //    model reads the whole sentence.
        const scanGap = Math.max(55, Math.min(120, 1400 / Math.max(1, all.length)));
        all.forEach(function (el, i) {
          later(function () { el.classList.add("scanning"); }, start + i * scanGap);
          later(function () {
            el.classList.remove("scanning");
            if (el.classList.contains("scored")) el.classList.add("lit");
          }, start + i * scanGap + SCAN_HOLD);
        });

        // 2. the cell opens empty, at zero
        const opened = start + all.length * scanGap + SCAN_HOLD + PAUSE;
        later(function () { cell.classList.remove("empty"); showZero(cell); }, opened);

        // 3. Only the words this pathway scores travel. That every word was read
        //    is already said by the scan above, which outlines all of them one at
        //    a time; flying them all as well repeats that and adds a claim that is
        //    not true — a word this pathway has no entry for did not contribute a
        //    zero, it has no value here at all. So the three beats each mean one
        //    thing: the scan reads, the flight contributes, the bounce moves the
        //    number.
        //    The pathway's constant base value rides in with the first word rather
        //    than appearing on its own beforehand: it is 0.2-0.9% of each pathway's
        //    range, and the thing it was meant to stand for — the length of the
        //    text — is not in this data, since it is the same value for a 12-word
        //    conversation and a 40-word one.
        let running = 0;
        const flyFrom = opened + TO_FLY;
        toks.forEach(function (el, i) {
          const v = D.vocabulary[el.textContent][1];
          const add = i === 0 ? v + D.baseValues[p] : v;
          later(function () { flyOne(el, cell, v, true); }, flyFrom + i * gap);
          later(function () {
            running += add;
            showRunning(cell, running);
          }, flyFrom + i * gap + FLY);
        });
        // Ten of the 800 conversations leave some pathway with no words it knows.
        // Nothing to fold the base into, so the cell lands on its answer directly.
        if (n === 0) {
          later(function () { showRunning(cell, it.act[p]); }, flyFrom);
        }

        // land on the stored activation, not the accumulated float, so the cell
        // agrees to the last digit with every other number on screen
        later(function () {
          cell.querySelector(".nnm-num").textContent = fmt(it.act[p], 4);
          sizeSym(cell, it.act[p], SYM_SCALE, ACT_SCALE);
          paint(cell, it.act[p], ACT_SCALE);
        }, flyFrom + n * gap + FLY + 40);

        t = flyFrom + n * gap + FLY + TAIL;
      }
      later(function () { wordAnim = false; }, t);
    }

    const WGT_MIN = 46;      // narrowest a weighted box gets, still fits its number

    // Weighted boxes are sized against the largest weighted value in THIS
    // conversation, so the row shows how much of this decision each pathway is
    // responsible for. On most conversations Pathway 1 fills its slot and the other two
    // are slivers — which is the point, and is what the stacked bar used to say.
    function weightedWidth(w, maxAbs, full) {
      if (!maxAbs) return full;
      return WGT_MIN + (full - WGT_MIN) * Math.min(1, Math.abs(w) / maxAbs);
    }

    function playWeigh() {
      const it = cases[idx];
      const wgt = it.act.map(function (a, p) { return a * IMP[p]; });
      const maxAbs = Math.max.apply(null, wgt.map(Math.abs));
      const full = rows[0].querySelector(".nnm-slot").getBoundingClientRect().width;
      const apply = function (p) {
        const cell = rows[p].querySelector(".wgt");
        cell.style.width = Math.round(weightedWidth(wgt[p], maxAbs, full)) + "px";
        cell.querySelector(".nnm-num").textContent = fmt(wgt[p], 4);
        sizeSym(cell, wgt[p], SYM_SCALE);
        paint(cell, wgt[p], SUM_SCALE);
        revealCell(cell, 0);
        trackConnectors(motionOff() ? 0 : 520);
      };

      if (motionOff()) {
        rows.forEach(function (r) { r.classList.add("lit-mul", "lit-arr"); });
        for (let p = 0; p < NP; p++) apply(p);
        weighAnim = false;
        return;
      }

      let t = 0;
      for (let p = 0; p < NP; p++) {
        (function (pi, start) {
          const r = rows[pi];
          later(function () {
            r.classList.add("lit-mul");
            bump(r.querySelector(".nnm-op.mul"));
          }, start);
          later(function () { bump(r.querySelector(".imp")); }, start + 260);
          later(function () {
            r.classList.add("lit-arr");
            bump(r.querySelector(".nnm-op.arr"));
          }, start + 560);
          later(function () { apply(pi); }, start + 820);
        })(p, t);
        t += 1040;
      }
      later(function () { weighAnim = false; }, t);
    }

    // How long one converging line takes to draw. The three run in turn, each
    // followed by the total it just changed.
    const DRAW = 620;

    const SUM_HOLD = 200;    // the total sits with its new value before the next line
    // The draw eases out — with this curve a line is all but touching its target
    // well before the 620ms formally ends. Reacting on that deadline reads as a
    // beat too late, so whatever the line delivers moves slightly ahead of it and
    // lands with the line rather than after it. Used by Add up and by Predict.
    const DRAW_LEAD = 90;

    // Fills the sum with a partial total. The first arrival reveals the cell;
    // later ones kick it, the same grammar the pathway activations use.
    function showSum(v, first) {
      sumCell.classList.remove("empty");
      sumCell.querySelector(".nnm-num").textContent = fmt(v, 4);
      sizeSym(sumCell, v, SYM_SCALE);
      paint(sumCell, v, SUM_SCALE);
      if (first) revealCell(sumCell, 0); else bump(sumCell);
    }

    function playAddUp() {
      if (motionOff()) {
        for (let i = 0; i < NP; i++) solidPending[i] = false;
        addUpAnim = false;
        trackConnectors(0);
        return;
      }
      for (let i = 0; i < NP; i++) solidPending[i] = true;
      trackConnectors(0);

      // One line at a time, each followed by the total it just changed, so the
      // sum is seen being built out of three contributions rather than appearing
      // whole once the lines have all landed.
      const it = cases[idx];
      let running = 0;
      let t = 60;
      for (let i = 0; i < NP; i++) {
        const p = i;
        later(function () {
          solidPending[p] = false;
          // Redraw first so the resting attribute reads "drawn": the animation has
          // no fill, so when it ends the attribute is what keeps the line visible.
          drawConnectors(lastChosen);
          const sol = convSolid[p];
          const len = parseFloat(sol.getAttribute("stroke-dasharray")) || 0;
          sol.animate(
            [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
            { duration: DRAW, easing: "cubic-bezier(.3,0,.35,1)" }
          );
        }, t);
        const react = t + DRAW - DRAW_LEAD;
        later(function () {
          running += it.act[p] * IMP[p];
          showSum(running, p === 0);
        }, react);
        t = react + SUM_HOLD;
      }
      later(function () { addUpAnim = false; }, t - SUM_HOLD + 30);
    }

    // The two answers are on screen from the start, plain. Decide draws the line
    // to the one the sum picked, and only when it arrives does that answer take
    // its colour — the line delivers the result rather than confirming it.
    function playDecide() {
      if (motionOff()) {
        decidePending = false;
        decideAnim = false;
        trackConnectors(0);
        return;
      }
      decidePending = true;
      trackConnectors(0);
      later(function () {
        decidePending = false;
        drawConnectors(lastChosen);
        const flen = fanSolid.getTotalLength ? fanSolid.getTotalLength() : 0;
        fanSolid.animate(
          [{ strokeDashoffset: flen }, { strokeDashoffset: 0 }],
          { duration: DRAW, easing: "cubic-bezier(.3,0,.35,1)" }
        );
      }, 60);
      // The line arrives first, then the answer it delivers takes its colour and
      // is kicked, and only after that does the comparison appear beneath. Three
      // separate beats: the route, the result, then how it measured up.
      later(function () {
        decideAnim = false;
        outEls.forEach(function (o) {
          const on = o.v === lastChosen;
          o.el.classList.toggle("on", on);
          if (on) { o.el.classList.remove("nnm-pop"); void o.el.offsetWidth; o.el.classList.add("nnm-pop"); }
        });
      }, 60 + DRAW - DRAW_LEAD);
    }

    // How long after Predict starts before the answer box has finished arriving.
    // The labels underneath wait for this.
    const DECIDE_SETTLED = 60 + DRAW - DRAW_LEAD + 420;

    // Each conversation is its own problem and keeps its own place in the chain.
    // Keyed by conversation id rather than position, so a filter that reorders or
    // narrows the set doesn't hand one conversation another's progress.
    const stepByCase = Object.create(null);

    function remember() {
      const it = cases[idx];
      if (it) stepByCase[it.id] = step;
    }

    // Arriving at a conversation restores where it was left — or the empty
    // skeleton the first time. It re-draws that state rather than replaying the
    // animation: you are returning to your work, not watching it happen again.
    function goToCase(n) {
      cancelAnim();
      idx = n;
      const it = cases[n];
      step = it ? (stepByCase[it.id] || 0) : 0;
      render();
    }

    function setStep(n) {
      cancelAnim();
      const from = step;
      step = n;
      remember();
      wordAnim = (n === 1);
      weighAnim = (n === 2);
      // Must be set before render(), not after: render decides whether the sum
      // cell is filled or left as a stand-in, and it reads this.
      addUpAnim = (n >= 3 && from < 3 && !motionOff());
      decideAnim = (n >= 4 && from < 4 && !motionOff());
      // Raised here, not in cancelAnim, because only here is it known whether an
      // animation is actually coming. In cancelAnim it also applied to the paths
      // that never animate — restoring a conversation — and hid the line there.
      // Left false, render would paint it fully drawn for a frame before
      // playDecide hid it again, which is the flash the convergence lines had.
      decidePending = decideAnim;
      render();
      if (wordAnim) playWords();
      if (weighAnim) playWeigh();
      if (n >= 3 && from < 3) playAddUp();
      if (n >= 4 && from < 4) playDecide();
    }
    const steps = document.createElement("div");
    steps.className = "nnm-steprow";
    const stepGroup = document.createElement("div");
    stepGroup.className = "nnm-stepgroup";
    steps.appendChild(stepGroup);
    const stepBtns = STEP_LABELS.map(function (label, i) {
      const b = document.createElement("button");
      b.className = "nnm-step";
      b.innerHTML = STEP_ICONS[i] + '<span>' + label + '</span>';
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () { setStep(i + 1); });
      stepGroup.appendChild(b);
      return b;
    });
    const resetBtn = document.createElement("button");
    resetBtn.className = "nnm-reset";
    resetBtn.innerHTML = '<span class="glyph">&#8634;</span><span>Reset</span>';
    resetBtn.setAttribute("aria-label", "Clear the steps and start over");
    resetBtn.addEventListener("click", function () { setStep(0); });
    stepGroup.appendChild(resetBtn);

    const animWrap = document.createElement("label");
    animWrap.className = "nnm-animtoggle";
    const animBox = document.createElement("input");
    animBox.type = "checkbox";
    animBox.checked = true;
    const animText = document.createElement("span");
    animText.textContent = "Animate";
    animWrap.appendChild(animBox);
    animWrap.appendChild(animText);
    animBox.addEventListener("change", function () {
      animateOn = animBox.checked;
      wrap.classList.toggle("nnm-nomotion", !animateOn);
      // Whatever was mid-flight is abandoned and the current step is re-drawn in
      // whichever mode we just switched to.
      cancelAnim();
      setStep(step);
    });
    chainHead.appendChild(animWrap);

    rightCol.appendChild(steps);
    chainPanel.appendChild(chainHead);

    const chainOuter = document.createElement("div");
    chainOuter.className = "nnm-panel-body nnm-flowouter";
    chainPanel.appendChild(chainOuter);
    const chainBody = document.createElement("div");
    chainBody.className = "nnm-flowbodywrap";
    chainOuter.appendChild(chainBody);
    rightCol.appendChild(chainPanel);

    const flowHead = document.createElement("div");
    flowHead.className = "nnm-flowhead";
    flowHead.innerHTML =
      '<span class="c act">Pathway<br>Activation</span>' +
      '<span class="g"></span>' +
      '<span class="c imp">Pathway<br>Importance</span>' +
      '<span class="g"></span>' +
      '<span class="c wgt">Weighted<br>Activation</span>' +
      '<span class="c far sum">Weighted<br>Sum</span>' +
      '<span class="c far dec">Pathway Prediction</span>';
    chainOuter.insertBefore(flowHead, chainBody);

    const flowBody = document.createElement("div");
    flowBody.className = "nnm-flowbody";
    chainBody.appendChild(flowBody);

    const rowsEl = document.createElement("div");
    rowsEl.className = "nnm-frows";
    flowBody.appendChild(rowsEl);

    // Typographic marks rather than drawn shapes: the old chunky X read as a close
    // button, and neither glyph could align or scale with the numbers beside it.
    // An arrow, not an equals sign. The panel is a flow diagram — the converging
    // lines and the fan are directional too — and the row does not actually
    // multiply out on screen, because activation is shown to 4dp and stored to 6.
    // "=" would invite a check that fails; the arrow claims only that one stage
    // produces the next. Revisit if activation ever goes to 5dp, which is what it
    // would take to make the arithmetic verifiable by hand.
    function glyphX() { return '<span class="nnm-glyph" aria-hidden="true">\u00D7</span>'; }
    function glyphArrow() { return '<span class="nnm-glyph arr" aria-hidden="true">\u2192</span>'; }

    const rows = [];
    for (let p = 0; p < NP; p++) {
      const r = document.createElement("div");
      r.className = "nnm-frow";
      r.innerHTML =
        '<span class="nnm-cell act sym"><i class="nnm-sq"></i><span class="nnm-num"></span></span>' +
        '<span class="nnm-op mul">' + glyphX() + '</span>' +
        '<span class="nnm-cell imp sym"><i class="nnm-sq"></i><span class="nnm-num"></span></span>' +
        '<span class="nnm-op arr">' + glyphArrow() + '</span>' +
        '<span class="nnm-slot"><span class="nnm-cell wgt sym">' +
          '<i class="nnm-sq"></i><span class="nnm-num"></span></span></span>';
      rowsEl.appendChild(r);
      rows.push(r);
    }

    // three weighted values converging on one score
    const conv = document.createElementNS(SVGNS, "svg");
    conv.setAttribute("class", "nnm-conv");
    const convPaths = [];
    for (let p = 0; p < NP; p++) {
      const ln = document.createElementNS(SVGNS, "line");
      ln.setAttribute("stroke", "#9AA3B0");
      ln.setAttribute("stroke-width", "1.3");
      ln.setAttribute("stroke-dasharray", "5 4");
      ln.setAttribute("stroke-linecap", "round");
      conv.appendChild(ln);
      convPaths.push(ln);
    }
    // A solid line over each dashed guide. It is hidden by holding its dash
    // offset at the full length, and drawn by running that offset to zero — from
    // the weighted value towards the sum, which is the direction of x1 to x2.
    // While a line is waiting its turn to be drawn it must read as hidden, not as
    // finished. An animation delay cannot do that job: during the delay the
    // animation is not in effect, so the resting "fully drawn" value applies and
    // the line flashes in complete before snapping back. Each line's turn is
    // scheduled instead, and this records which are still waiting.
    const solidPending = [false, false, false];
    const convSolid = [];
    for (let p = 0; p < NP; p++) {
      const ln = document.createElementNS(SVGNS, "line");
      ln.setAttribute("stroke", "#3E4753");
      ln.setAttribute("stroke-width", "2");
      ln.setAttribute("stroke-linecap", "round");
      conv.appendChild(ln);
      convSolid.push(ln);
    }
    flowBody.appendChild(conv);

    const decideWrap = document.createElement("div");
    decideWrap.className = "nnm-decidewrap";
    const decideRow = document.createElement("div");
    decideRow.className = "nnm-deciderow";
    decideWrap.appendChild(decideRow);
    flowBody.appendChild(decideWrap);

    const tail = document.createElement("div");
    tail.className = "nnm-tail";
    const sumLabel = document.createElement("div");
    sumLabel.className = "nnm-taillabel";
    sumLabel.hidden = true;   // the caption now lives in the header row
    const sumCell = document.createElement("div");
    sumCell.className = "nnm-cell sum sym";
    sumCell.innerHTML = '<i class="nnm-sq"></i><span class="nnm-num"></span>';
    tail.appendChild(sumLabel);
    tail.appendChild(sumCell);
    decideRow.appendChild(tail);

    // sum -> one of two outcomes
    const fan = document.createElementNS(SVGNS, "svg");
    fan.setAttribute("class", "nnm-fan");
    const fanUp = document.createElementNS(SVGNS, "path");
    const fanDown = document.createElementNS(SVGNS, "path");
    [fanUp, fanDown].forEach(function (pth) {
      pth.setAttribute("fill", "none");
      pth.setAttribute("stroke", "#B9C0CA");
      pth.setAttribute("stroke-width", "1.3");
      pth.setAttribute("stroke-dasharray", "5 4");
      pth.setAttribute("stroke-linecap", "round");
      fan.appendChild(pth);
    });
    // Drawn along whichever route the sum picks, the same way the converging
    // lines are: hidden by holding its dash offset at full length, then run to
    // zero so it fills from the sum towards the answer.
    const fanSolid = document.createElementNS(SVGNS, "path");
    fanSolid.setAttribute("fill", "none");
    fanSolid.setAttribute("stroke", "#3E4753");
    fanSolid.setAttribute("stroke-width", "2.2");
    fanSolid.setAttribute("stroke-linecap", "round");
    fan.appendChild(fanSolid);
    decideRow.appendChild(fan);

    const outs = document.createElement("div");
    outs.className = "nnm-outs";
    const outEls = [1, 0].map(function (v) {
      const o = document.createElement("span");
      o.className = "nnm-out " + (v === 1 ? "approach" : "wait");
      o.textContent = v === 1 ? "Approach" : "Wait";
      outs.appendChild(o);
      return { v: v, el: o };
    });
    decideRow.appendChild(outs);

    const labelsEl = document.createElement("div");
    labelsEl.className = "nnm-labels";
    decideRow.appendChild(labelsEl);

    const noteEl = document.createElement("div");
    noteEl.className = "nnm-note";
    chainBody.appendChild(noteEl);

    // ---------- helpers ----------
    // Exactly zero carries no sign — the same reason its square is white rather
    // than the lightest positive tint. A value that merely ROUNDS to zero keeps
    // its sign: Pathway 2's weighted values are all under +-0.41, so "+0.00" is
    // usually a real positive, not nothing.
    function fmt(v, dp) {
      const d = dp === undefined ? 2 : dp;
      return (v === 0 ? "" : v > 0 ? "+" : "−") + Math.abs(v).toFixed(d);
    }
    function pill(v) {
      const s = document.createElement("span");
      s.className = "nnm-pill " + (v === 1 ? "approach" : "wait");
      s.textContent = v === 1 ? "Approach" : "Wait";
      return s;
    }

    // Whether the wide arrangement fits must be re-decided every render:
    // measuring it once caught whatever layout happened to be up at build time.
    // Dropping the class first makes the browser report the wide widths.
    function fitFlow() {
      flowBody.classList.remove("narrow");
      // getBoundingClientRect, not offsetWidth: conv and fan are SVG elements and
      // SVGElement has no offsetWidth, so the sum came out NaN and never compared true.
      const wOf = function (el) { return el.getBoundingClientRect().width; };
      // conv's canvas reaches back over the slot via a negative margin, so its
      // rect is wider than the space it actually occupies. Use the constant, or
      // the flow measures itself as needing the slot width twice and goes narrow.
      // The labels are positioned out of the flow, so decideWrap no longer reports
      // their width — measure them alongside the row, since both still have to fit.
      const need = wOf(rowsEl) + CONV_W + Math.max(wOf(decideRow), wOf(labelsEl));
      // Measure against the panel's inner width, not flowBody's own: when the
      // row overflows, flowBody stretches with it and reports the inflated size,
      // so comparing need to that always says "it fits".
      const cs = getComputedStyle(chainOuter);
      const avail = chainOuter.clientWidth
        - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      if (avail > 0 && need > avail) flowBody.classList.add("narrow");
    }

    // Reading p on the left and flow row p on the right must sit on the same line.
    // Readings vary with text length, so both are cleared, measured, then set to
    // the taller of the pair — clearing first keeps it from ratcheting upward.
    // The flow panel starts at the top of the card while the readings start below
    // the find bar, so the captions absorb the difference and the first row still
    // lands on the first reading. Cleared before measuring so it cannot ratchet.
    function alignTops() {
      flowHead.style.height = "";
      const base = flowHead.getBoundingClientRect().height;
      // Measure the two things that must sit on the same line — the first reading
      // and the first flow row — not their scroll containers. The containers carry
      // padding for focus-ring room, so their top edges sit above their content by
      // an amount that has nothing to do with the alignment being solved for.
      const delta = readings[0].getBoundingClientRect().top
        - rows[0].getBoundingClientRect().top;
      if (delta > 0) flowHead.style.height = (base + delta) + "px";
    }

    // The last two captions sit over elements the header row cannot reach by
    // flex order — the conv SVG's negative margin means header widths and body
    // positions do not correspond. They are placed against the measured centres
    // of the sum cell and the pair of answers instead.
    function alignHeadCaptions() {
      const hr = flowHead.getBoundingClientRect();
      if (hr.width < 2) return;
      const place = function (cap, target) {
        const t = target.getBoundingClientRect();
        if (t.width < 1) { cap.style.display = "none"; return; }
        cap.style.display = "";
        cap.style.left = Math.round(t.left + t.width / 2 - hr.left) + "px";
      };
      place(flowHead.querySelector(".sum"), sumCell);
      place(flowHead.querySelector(".dec"), outs);
    }

    function syncRows() {
      readings.forEach(function (r) { r.style.minHeight = ""; });
      rows.forEach(function (r) { r.style.minHeight = ""; });
      const h = readings.map(function (r, i) {
        return Math.max(r.offsetHeight, rows[i].offsetHeight);
      });
      readings.forEach(function (r, i) { r.style.minHeight = h[i] + "px"; });
      rows.forEach(function (r, i) { r.style.minHeight = h[i] + "px"; });
    }

    // The weighted boxes change width over a 0.45s transition, and the converging
    // lines are anchored to their right edges — so a single redraw would catch the
    // box mid-move. This follows the edge frame by frame until the box settles.
    let lastChosen = 0;
    let trackRaf = null;
    // Callers ask for a window to follow; the longest one wins. Replacing the
    // deadline instead of extending it lets a trackConnectors(0) — playAddUp and
    // playDecide both open with one — cancel a follow that render() started for a
    // width transition still in flight, freezing the lines at whatever width the
    // boxes happened to be passing through.
    let trackUntil = 0;
    function trackConnectors(ms) {
      trackUntil = Math.max(trackUntil, performance.now() + ms);
      if (trackRaf) return;
      (function frame() {
        drawConnectors(lastChosen);
        if (performance.now() < trackUntil) {
          trackRaf = requestAnimationFrame(frame);
        } else {
          trackRaf = null;
        }
      })();
    }

    // The lines are anchored to the right edge of each weighted box, so the boxes'
    // geometry is what should drive the redraw — not a duration guessed in advance.
    // A timed follow only covers the transition it was told about: one that starts
    // late, a re-layout from fitFlow's narrow mode, or a second width change
    // arriving mid-flight all leave the lines attached to where the boxes were.
    // Watching the boxes themselves catches every width change, whatever caused it.
    if (window.ResizeObserver) {
      const boxWatch = new ResizeObserver(function () { drawConnectors(lastChosen); });
      rows.forEach(function (r) { boxWatch.observe(r.querySelector(".wgt")); });
      boxWatch.observe(sumCell);
      outEls.forEach(function (o) { boxWatch.observe(o.el); });
    }

    // Width is transitioned, so the end of that transition is the moment the final
    // anchor is knowable. Cheap, exact, and independent of any follow window:
    // whatever else has been cancelled by then, the lines land attached.
    rows.forEach(function (r) {
      r.querySelector(".wgt").addEventListener("transitionend", function (e) {
        if (e.propertyName === "width") drawConnectors(lastChosen);
      });
    });

    // The squares carry the anchors now, and they animate their own size, so the
    // lines have to follow them the same way they follow the boxes.
    rows.map(function (r) { return r.querySelector(".wgt .nnm-sq"); })
      .concat([sumCell.querySelector(".nnm-sq")])
      .forEach(function (sq) {
        if (!sq) return;
        if (window.ResizeObserver) {
          new ResizeObserver(function () { drawConnectors(lastChosen); }).observe(sq);
        }
        sq.addEventListener("transitionend", function (e) {
          if (e.propertyName === "width" || e.propertyName === "height") {
            drawConnectors(lastChosen);
          }
        });
      });

    // Fills a cell in and kicks it, without the stand-in hatching.
    function revealCell(el, delay) {
      el.classList.remove("empty", "nnm-pop", "nnm-tick");
      void el.offsetWidth;
      el.style.animationDelay = (delay || 0) + "ms";
      el.classList.add("nnm-pop");
    }

    // The converging lines start at the right EDGE of each weighted box, not at a
    // fixed column, so they stay attached as the boxes change width. That means the
    // SVG has to reach back over the slot: it is given a negative left margin equal
    // to the slot width and the same amount of extra width, so its canvas covers the
    // slot while its contribution to the row's layout is unchanged.

    // The lines leave the symbol, not the box around it. The box is transparent
    // now that the square carries the value, so anchoring to its edge left the
    // lines starting in blank space up to 26px clear of anything.
    function symRect(cell) {
      const sq = cell.querySelector(".nnm-sq");
      return (sq && sq.getBoundingClientRect().width > 0 ? sq : cell).getBoundingClientRect();
    }

    function drawConnectors(chosen) {
      const slotW = rows[0].querySelector(".nnm-slot").getBoundingClientRect().width;
      conv.style.marginLeft = (-slotW) + "px";
      conv.style.width = (CONV_W + slotW) + "px";

      // The SVG carries a width but no height, so its height falls out of the
      // viewBox's aspect ratio — and the viewBox is built from its own measured
      // height. That loop ratchets: a long conversation stretches it, and nothing
      // shrinks it again, so it holds flowBody at the tallest conversation seen
      // and the sum keeps centring on that rather than on the middle pathway.
      // The rows are the authority on how tall this column is. They carry explicit
      // heights from syncRows and never stretch, so their span is measured
      // directly rather than read off a container the SVG may already be inflating.
      const span = rows[NP - 1].getBoundingClientRect().bottom
        - rows[0].getBoundingClientRect().top;
      if (span > 0) conv.style.height = span + "px";

      const cr0 = conv.getBoundingClientRect();
      // The guides are on screen from the start — they are the shape of the chain
      // waiting to be filled, like the empty stand-in squares. Only an unmeasurable
      // canvas hides them.
      if (cr0.width < 2) {
        conv.style.visibility = "hidden";
      } else {
        conv.style.visibility = "";
        conv.setAttribute("viewBox", "0 0 " + cr0.width + " " + cr0.height);
        const sc = symRect(sumCell);
        const ty = sc.top + sc.height / 2 - cr0.top;
        // The sum square's own left edge. The SVG's right border is not the same
        // place — the square overhangs its cell and changes size — so ending the
        // lines at the border left a gap that grew and shrank with the value.
        const tx = sc.left - cr0.left;
        rows.forEach(function (r, i) {
          const rr = symRect(r.querySelector(".wgt"));
          const y = rr.top + rr.height / 2 - cr0.top;
          const x = rr.right - cr0.left;
          const ln = convPaths[i];
          ln.setAttribute("x1", x);
          ln.setAttribute("y1", y);
          ln.setAttribute("x2", tx);
          ln.setAttribute("y2", ty);

          const sol = convSolid[i];
          sol.setAttribute("x1", x);
          sol.setAttribute("y1", y);
          sol.setAttribute("x2", tx);
          sol.setAttribute("y2", ty);
          const len = Math.hypot(tx - x, ty - y);
          sol.setAttribute("stroke-dasharray", len);
          // Resting state: fully drawn once Add up has run, fully hidden before.
          // A running animation still overrides this, so redraws during the draw
          // reposition the line without cutting the animation short.
          sol.setAttribute("stroke-dashoffset", (step >= 3 && !solidPending[i]) ? 0 : len);
        });
      }

      const fr = fan.getBoundingClientRect();
      if (fr.width < 2) { fan.style.visibility = "hidden"; return; }
      fan.style.visibility = "";
      fan.setAttribute("viewBox", "0 0 " + fr.width + " " + fr.height);
      const sc2 = symRect(sumCell);
      const sy = sc2.top + sc2.height / 2 - fr.top;
      // Anchored the same way at both ends: it leaves the sum square's right edge
      // and arrives at the answer's left edge, wherever those happen to be.
      const sx = sc2.right - fr.left;
      outEls.forEach(function (o, i) {
        const orr = o.el.getBoundingClientRect();
        const oy = orr.top + orr.height / 2 - fr.top;
        const ox = orr.left - fr.left;
        const span = ox - sx;
        const pth = i === 0 ? fanUp : fanDown;
        pth.setAttribute("d", "M" + sx + " " + sy +
          " C " + (sx + span * 0.55) + " " + sy + ", " +
          (sx + span * 0.45) + " " + oy + ", " + ox + " " + oy);
      });

      const chosenPath = chosen === 1 ? fanUp : fanDown;
      fanSolid.setAttribute("d", chosenPath.getAttribute("d") || "");
      const flen = fanSolid.getTotalLength ? fanSolid.getTotalLength() : 0;
      fanSolid.setAttribute("stroke-dasharray", flen);
      fanSolid.setAttribute("stroke-dashoffset", (step >= 4 && !decidePending) ? 0 : flen);
    }

    // ---------- render ----------
    function render() {
      const empty = cases.length === 0;
      casePanel.style.display = empty ? "none" : "";
      chainPanel.style.visibility = empty ? "hidden" : "";
      emptyMsg.hidden = !empty;
      if (empty) return;
      if (idx >= cases.length) idx = cases.length - 1;
      const it = cases[idx];

      countEl.textContent = (idx + 1) + " / " + cases.length;
      setAriaDisabled(prevBtn, idx === 0);
      setAriaDisabled(nextBtn, idx === cases.length - 1);
      caseIdEl.title = "#" + it.id;   // id kept for cross-referencing the explorer

      // all three readings, on the one shared colour scale shown above them
      readings.forEach(function (r, p) {
        const txt = r.querySelector(".nnm-read-text");
        txt.innerHTML = "";
        it.text.split(/\s+/).forEach(function (w, wi) {
          if (wi) txt.appendChild(document.createTextNode(" "));
          const span = document.createElement("span");
          span.className = "nnm-tok";
          span.textContent = w;
          const v = D.vocabulary[w];
          // The tooltips say what the model made of a word, so they arrive with
          // the step that shows it. Before Activate the sentence is deliberately
          // plain, and a hover that gave up the value — or, on a blank, the
          // pathway that owns it — would hand over the answer the step exists to
          // reveal, while the words on screen still say nothing has been read.
          const told = step >= 1;
          if (v && v[0] === p) {
            const L = level(Math.min(1, Math.abs(v[1]) / TOK_MAX));
            span.classList.add("scored");
            span.style.setProperty("--tok-bg", (v[1] >= 0 ? FILL_POS : FILL_NEG)[L]);
            span.style.setProperty("--tok-fg", L === 4 ? "#fff" : "#1E242C");
            if (told) span.title = w + ": " + fmt(v[1], 4);
            // Lit straight away unless the Words sequence is about to light them
            // one at a time.
            if (step >= 1 && !wordAnim) span.classList.add("lit");
          } else if (v) {
            // Each of the 30 words belongs to exactly one pathway. Naming that
            // one turns a blank from "this word did not matter" into a fact.
            // No verb: half the vocabulary is negative, so "activates" would be
            // wrong for those, and "scores" is a term used nowhere else here.
            if (told) span.title = w + ": a " + PATH_NAMES[v[0]] + " word";
          }
          txt.appendChild(span);
        });
      });

      labelsEl.innerHTML = "";
      // Three different things are on screen and they must not share a word:
      // the column above is the PATHWAYS' prediction, this is the MODEL's, and
      // Actual is the truth. They disagree on 7% of conversations, which is the
      // whole point of Day 3 — so "Prediction" alone was ambiguous here.
      [["Model", it.pred], ["Actual", it.target]].forEach(function (pair) {
        const row = document.createElement("div");
        row.className = "nnm-label-row";
        const b = document.createElement("b"); b.textContent = pair[0];
        row.appendChild(b); row.appendChild(pill(pair[1]));
        labelsEl.appendChild(row);
      });
      if (it.pred !== it.target) {
        const f = document.createElement("div");
        f.className = "nnm-label-row";
        const sp = document.createElement("span");
        sp.className = "nnm-flag"; sp.textContent = "MODEL WAS WRONG";
        f.appendChild(sp); labelsEl.appendChild(f);
      }

      // the flow
      const wgt = []; let sum = 0;
      const revealed = function (el, on, wasOn, delay) {
        el.classList.toggle("empty", !on);
        el.classList.remove("nnm-pop");
        if (on && !wasOn) {
          void el.offsetWidth;                 // restart the animation
          el.style.animationDelay = (delay || 0) + "ms";
          el.classList.add("nnm-pop");
        }
      };
      for (let p = 0; p < NP; p++) {
        const a = it.act[p], w = a * IMP[p];
        wgt.push(w); sum += w;
        const r = rows[p];
        const actC = r.querySelector(".act"), impC = r.querySelector(".imp"), wgtC = r.querySelector(".wgt");
        writeCell(actC, a, ACT_SCALE, SYM_SCALE);
        impC.querySelector(".nnm-num").textContent = fmt(IMP[p], 4);
        sizeSym(impC, IMP[p], SYM_SCALE, IMP_MAX);
        writeCell(wgtC, w, SUM_SCALE, SYM_SCALE);
        revealed(actC, step >= 1 && !wordAnim, prevStep >= 1 && !wordAnim, p * 90);
        // Importance is never revealed: it is not produced by the step before it.
        // It is a property of the model — the same three numbers on all 800
        // conversations, unchanged by any step — so it is on screen from the
        // start, and staying put while everything around it moves is the point.
        impC.classList.remove("empty");
        revealed(wgtC, step >= 2 && !weighAnim, prevStep >= 2 && !weighAnim, p * 90 + 140);
        if (step >= 2 && !weighAnim) {
          const slot = r.querySelector(".nnm-slot").getBoundingClientRect().width;
          const maxAbs = Math.max.apply(null, it.act.map(function (a, k) { return Math.abs(a * IMP[k]); }));
          wgtC.style.width = Math.round(weightedWidth(w, maxAbs, slot)) + "px";
        } else if (step < 2) {
          wgtC.style.width = "";
        }
        if (!weighAnim) {
          r.classList.toggle("lit-mul", step >= 2);
          r.classList.toggle("lit-arr", step >= 2);
        } else {
          r.classList.remove("lit-mul", "lit-arr");
        }
      }
      // conv/fan visibility is owned by drawConnectors — see the note there.

      sumCell.querySelector(".nnm-num").textContent = fmt(sum, 4);
      sizeSym(sumCell, sum, SYM_SCALE);
      paint(sumCell, sum, SUM_SCALE);
      revealed(sumCell, step >= 3 && !addUpAnim, prevStep >= 3 && !addUpAnim, 260);

      const chosen = sum > 0 ? 1 : 0;
      lastChosen = chosen;
      outEls.forEach(function (o) {
        o.el.classList.remove("empty");
        o.el.classList.toggle("on", o.v === chosen && step >= 4 && !decideAnim);
      });

      // Held back until the Decide animation has finished, so the answer lands
      // before the comparison against it appears.
      if (step >= 4) {
        if (prevStep < 4) {
          labelsEl.style.visibility = "hidden";
          const t = setTimeout(function () {
            labelsEl.style.visibility = "";
            labelsEl.classList.remove("nnm-pop"); void labelsEl.offsetWidth;
            labelsEl.classList.add("nnm-pop");
          }, motionOff() ? 0 : DECIDE_SETTLED);
          SIM._timeouts.push(t);
        } else {
          labelsEl.style.visibility = "";
        }
      } else {
        labelsEl.style.visibility = "hidden";
      }

      noteEl.textContent = (step >= 4 && chosen !== it.pred)
        ? "The pathways and the model point different ways on this one. The pathways are a "
          + "summary of the model, not a copy of it — they land on the same answer in about "
          + "9 cases out of 10." : "";

      stepBtns.forEach(function (b, i) {
        b.classList.toggle("on", i + 1 === step);
        b.setAttribute("aria-pressed", i + 1 === step ? "true" : "false");
      });
      resetBtn.disabled = step === 0;

      fitFlow();

      alignTops();
      syncRows();
      alignHeadCaptions();
      // Widths may have just changed here too, so follow them rather than drawing once.
      trackConnectors(motionOff() ? 0 : 520);
      prevStep = step;

      SIM.announce("Conversation " + (idx + 1) + " of " + cases.length +
        ". Weighted sum " + fmt(sum) + ". Pathways say " + (chosen ? "approach" : "wait") + ".");
    }

    // The readings and the flow rows are aligned line for line, so they have to
    // scroll as one. The right side is taller (bar, hint, note sit below the rows),
    // so its scrollTop simply clamps when the left runs out — the guard stops the
    // two handlers bouncing the value back and forth.
    let syncingScroll = false;
    function linkScroll(a, b) {
      a.addEventListener("scroll", function () {
        if (syncingScroll) return;
        syncingScroll = true;
        b.scrollTop = a.scrollTop;
