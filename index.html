<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Net Maker</title>
<style>
/* Self-hosted fonts */
/* Barlow 400 */ @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 400; src: url('fonts/17ef8a066a33.woff2') format('woff2'); }
/* Barlow Condensed 400 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 400; src: url('fonts/343e6c738440.woff2') format('woff2'); }
/* Barlow Condensed 600 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 600; src: url('fonts/07c3c732a90e.woff2') format('woff2'); }
/* Lato 400 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; src: url('fonts/d5b18a30a456.woff2') format('woff2'); }
/* Lato 400i */ @font-face { font-family: 'Lato'; font-style: italic; font-weight: 400; src: url('fonts/lato-italic-400.woff2') format('woff2'); }
/* Lato 700 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 700; src: url('fonts/a658a6a6ab26.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    background: #ededed;
    color: #333;
    letter-spacing: 0.02em;
    padding: 20px;
  }

  /* Main layout: left buttons | viewport | right buttons */
  .main-layout {
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }

  /* Button columns */
  .btn-column {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 150px;
    flex-shrink: 0;
    padding-top: 0;
  }

  .btn-column [role="group"] {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .btn-column-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: -2px;
  }

  /* Day sub-heading inside the Interactives group */
  .day-sublabel {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #6B7280;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 0 2px;
  }
  .day-sublabel::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #C4C9D2;
  }
  .day-sublabel:first-child { margin-top: 0; }
  body.teal-bg .day-sublabel { color: rgba(255,255,255,0.85); }
  body.teal-bg .day-sublabel::after { background: rgba(255,255,255,0.4); }

  .toggle-btn {
    font-family: 'Barlow Condensed', sans-serif;
    /* Prototype chrome, not a student touch target — the 44px minimum doesn't
       apply here. padding + line-height set the real floor, so both move together. */
    padding: 5px 14px;
    min-height: 32px;
    font-size: 18px;
    line-height: 20px;
    font-weight: 600;
    color: #333;
    background: #f0f0f0;
    border: 1px solid #333;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    text-align: left;
    white-space: nowrap;
  }

  .toggle-btn:hover,
  .toggle-btn:focus-visible {
    background: #d8d8d8;
    color: #333;
  }

  .toggle-btn:focus {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px #fff;
  }
  .toggle-btn:focus:not(:focus-visible) {
    outline: none;
    box-shadow: none;
  }
  .toggle-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px #fff;
  }

  body.teal-bg .toggle-btn {
    border-color: #fff;
  }

  body.teal-bg .toggle-btn:focus {
    outline: none;
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px #005FCC, 0 0 0 4px #fff;
  }
  body.teal-bg .toggle-btn:focus:not(:focus-visible) {
    box-shadow: none;
  }
  body.teal-bg .toggle-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px #005FCC, 0 0 0 4px #fff;
  }

  .toggle-btn:active:not(.active) {
    background: #c0c0c0;
  }

  .toggle-btn.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }

  body.teal-bg .toggle-btn.active {
    border-color: #fff;
  }
  /* Viewport display area */
  .viewport-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-left: 1px solid #858585;
    align-self: stretch;
    min-height: calc(100vh - 40px);
    position: relative;
  }

  .viewport-info {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.3;
    color: #333;
    margin-bottom: 12px;
    text-align: center;
    min-height: 2.6em;
    position: relative;
    z-index: 1;
  }

  .viewport-info strong {
    font-weight: 600;
    color: #333;
  }

  /* Device frame */
  .device-frame {
    position: relative;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    box-sizing: content-box;
    border: 2px solid #333;
    transition: width 0.3s ease, height 0.3s ease;
  }

  .device-frame.no-limit {
    border-color: #ccc;
    border-style: dashed;
    background: transparent;
  }

  /* Browser / OS chrome bars */
  .chrome-top {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0 8px;
    position: relative;
  }

  .chrome-top::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    white-space: nowrap;
  }

  .chrome-bottom {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .chrome-bottom::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    text-align: center;
    white-space: nowrap;
  }

  /* Available viewport area */
  .viewport-area {
    background: #0481A0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
    flex: 1;
  }

  /* AP container — floated centered unit */
  .ap-container {
    background: transparent;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .ap-right-column {
    display: flex;
    flex-direction: column;
    width: 767px;
    box-sizing: content-box;
    border: 1px solid #858585;
    margin-right: 26px;
  }

  .ap-header {
    background: #047a99;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .ap-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .ap-body {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  /* Left column for 2-column layout */
  .ap-left-column {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-left: 28px;
    margin-right: 10px;
    transition: width 0.25s ease;
    overflow: hidden;
  }

  .ap-left-toggle {
    background: #3f3f3f;
    display: flex;
    align-items: center;
    position: relative;
    cursor: pointer;
  }

  .ap-left-toggle:hover,
  .ap-left-toggle:focus-visible {
    background: #4a4a4a;
  }

  .ap-left-toggle:active {
    background: #3a3a3a;
  }

  .ap-left-toggle-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    position: absolute;
    left: 181px;
    white-space: nowrap;
  }

  .ap-left-toggle-icon {
    position: absolute;
    right: 20px;
    width: 32px;
    height: 32px;
  }

  .ap-left-toggle-icon-collapsed {
    width: 32px;
    height: 32px;
    margin-top: 5px;
    transform: scaleX(-1);
  }

  .ap-left-toggle-label-collapsed {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    margin-top: 12px;
    white-space: nowrap;
  }

  .ap-left-toggle:focus {
    outline: none;
    box-shadow: inset 0 0 0 2px #005FCC, inset 0 0 0 4px #fff;
  }
  .ap-left-toggle:focus:not(:focus-visible) {
    box-shadow: none;
  }
  .ap-left-toggle:focus-visible {
    outline: none;
    box-shadow: inset 0 0 0 2px #005FCC, inset 0 0 0 4px #fff;
  }

  .ap-left-resources {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .ap-left-resources-header {
    background: #dfdfdf;
    height: 37px;
    padding-left: 20px;
    display: flex;
    align-items: center;
  }

  .ap-left-resources-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #333;
  }

  .ap-left-resources-body {
    flex: 1;
    background: #f4f4f4;
    padding: 25px 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
    overflow: auto;
  }

  .ap-left-resources-body p {
    margin: 0 0 16px 0;
  }

  .ap-left-resources-body p:last-child {
    margin-bottom: 0;
  }

  .ap-left-resources-body ul {
    margin: 0 0 16px 0;
    padding-left: 40px;
  }

  .ap-left-resources-body li {
    margin-bottom: 12px;
  }

  .ap-left-resources-body li:last-child {
    margin-bottom: 0;
  }
  /* Sim title bar */
  .sim-title-bar {
    height: 50px;
    background: var(--sim-title-bar-bg, #fff);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px 0 20px;
    flex-shrink: 0;
    position: relative;
  }

  .sim-title-bar::after {
    content: "";
    position: absolute;
    bottom: calc(-1 * var(--sim-title-accent, 0px));
    left: 0;
    right: 0;
    height: var(--sim-title-accent, 0px);
    background: inherit;
  }

  .sim-title-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sim-title-name {
    font-family: 'Lato', sans-serif;
    font-size: 24px;
    line-height: 1;
    font-weight: 700;
    color: var(--sim-title-text, #333);
    margin: 0;
    font-synthesis: none;
    display: flex;
    align-items: center;
    height: 28px;
  }

  .sim-title-desc {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    color: var(--sim-title-desc, #333);
  }

  .sim-title-right {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .sim-title-logo {
    display: block;
  }

  .sim-info-btn {
    margin-left: 5px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    font-weight: 700;
    padding: 3px 12px 3px 8px;
    height: 34px;
    box-sizing: border-box;
    border: 2px solid var(--sim-about-border, #555);
    border-radius: 6px;
    background: var(--sim-surface, #fff);
    color: var(--sim-about-text, #333);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .sim-info-btn::after {
    content: "";
    position: absolute;
    top: -7px;
    left: 0;
    right: 0;
    bottom: -7px;
  }

  .sim-info-btn.compact-hit::after {
    top: 0;
    bottom: 0;
  }

  .sim-info-btn svg {
    width: 24px;
    height: 24px;
    pointer-events: none;
  }

  .sim-info-btn:hover,
  .sim-info-btn:focus-visible {
    background: var(--sim-btn-hover, #f0f0f0);
  }

  .sim-info-btn:active {
    background: var(--sim-btn-active, #d0d0d0);
  }

  .sim-info-btn:focus {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }
  .sim-info-btn:focus:not(:focus-visible) {
    outline: none;
  }
  .sim-info-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }

  /* Info modal */
  .info-modal {
    position: absolute;
    top: 50px;
    right: 10px;
    width: 400px;
    max-height: 70%;
    background: #fff;
    border: 2px solid var(--sim-about-border, #555);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    z-index: 101;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .info-modal-header {
    display: flex;
    align-items: center;
    padding: 3px 3px 3px 12px;
    height: 52px;
    box-sizing: border-box;
    border-bottom: 1px solid var(--sim-modal-border, #555);
    cursor: grab;
    flex-shrink: 0;
    user-select: none;
    touch-action: none;
    background: var(--sim-surface, #fff);
  }

  .info-modal-header:active {
    cursor: grabbing;
  }

  .info-modal-header-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    margin-right: 10px;
  }

  .info-modal-header-title {
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #333;
    flex: 1;
    margin: 0;
  }

  .info-modal-close {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--sim-surface, #fff);
    border: none;
    cursor: pointer;
    border-radius: 4px;
    padding: 0;
    flex-shrink: 0;
    transition: background-color 0.15s ease;
  }

  .info-modal-close:hover,
  .info-modal-close:focus-visible {
    background: var(--sim-btn-hover, #f0f0f0);
  }

  .info-modal-close:active {
    background: var(--sim-btn-active, #d0d0d0);
  }

  .info-modal-close:focus {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }
  .info-modal-close:focus:not(:focus-visible) {
    outline: none;
  }
  .info-modal-close:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }

  .info-modal-close svg {
    width: 24px;
    height: 24px;
  }

  .info-modal-body {
    padding: 16px 20px 20px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 22px;
    color: #333;
    user-select: text;
  }

  .info-modal-body-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .info-modal-body:focus {
    outline: none;
  }
  .info-modal-body:focus-visible {
    outline: 2px solid transparent;
  }

  .info-modal-body-wrap .scroll-focus-ring {
    border-radius: 0 0 6px 6px;
  }

  .info-modal-body:focus ~ .scroll-focus-ring {
    display: block;
  }
  .info-modal-body:focus:not(:focus-visible) ~ .scroll-focus-ring {
    display: none;
  }
  .info-modal-body:focus-visible ~ .scroll-focus-ring {
    display: block;
  }

  .info-modal-body h3 {
    font-size: 16px;
    font-weight: 700;
    margin: 16px 0 6px;
    color: #333;
  }

  .info-modal-body h3:first-child {
    margin-top: 0;
  }

  .info-modal-body p {
    margin: 0 0 12px;
  }

  .info-modal-body ul,
  .info-modal-body ol {
    margin: 0 0 12px;
    padding-left: 20px;
  }

  .info-modal-body li {
    margin-bottom: 4px;
  }

  /* Question containers below sim content */
  .question-row {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    padding: 0 27px;
    width: 100%;
    box-sizing: border-box;
  }

  .question-container {
    width: 517px;
    display: flex;
    flex-direction: column;
    border: 1px solid #858585;
    box-sizing: content-box;
  }

  .question-header {
    background: #047a99;
    height: 36px;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .question-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .question-body {
    background: #fff;
    flex: 1;
    min-height: 200px;
    padding: 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
  }

  .question-input {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 16px;
    height: 200px;
    margin-top: 10px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-style: italic;
    color: #767676;
    line-height: 1.5;
  }
  .content-area.standalone {
    border: 2px solid var(--sim-panel-border, #555);
    border-radius: 10px;
    box-sizing: content-box;
    overflow: hidden;
  }

  /* Content area */
  .content-area {
    font-family: 'Lato', sans-serif;
    background: var(--sim-content-bg, #fff);
    position: relative;
    flex-shrink: 0;
    transition: width 0.25s ease;
    display: flex;
    flex-direction: column;
    user-select: none;
    overflow: hidden;
  }

  /* Sim content containers */
  .sim-content {
    display: flex;
    gap: 10px;
    padding: 0 10px 10px 10px;
    flex: 1;
    min-height: 0;
  }


  .sim-info-btn svg,
  .info-modal-close svg,
  .info-modal-header-icon {
    color: var(--sim-icon-color, #000);
  }

  #demo-site-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  /* Demo Site entry point is hidden for now. The demo view itself is untouched —
     buildDemoView() / exitDemoView() still work. Delete this one rule to bring it back. */
  #demo-site-divider,
  #demo-site-btn {
    display: none;
  }

  /* ============================================================
     Neural Net Maker interactives
     Signed values are orange-positive / blue-negative throughout.
     ============================================================ */
  .sim-content {
    --nnm-pos: #D9722E;
    --nnm-pos-soft: #FAE6D6;
    --nnm-neg: #3A72BE;
    --nnm-neg-soft: #DCE7F7;
    --nnm-ink: #1E242C;
    --nnm-ink-2: #58616F;
    --nnm-ink-3: #838C99;
    --nnm-rule: #CCD3DD;
    --nnm-rule-soft: #E4E9F0;
    --nnm-surface: #F4F6FA;
    --nnm-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  .nnm-stack { display: flex; flex-direction: column; width: 100%; min-height: 0; flex: 1; padding-top: 9px; }
  .nnm { display: flex; gap: 10px; width: 100%; min-height: 0; flex: 1; }

  /* --- shared query filter --- */
  .nnm-filterwrap { position: relative; flex-shrink: 0; }
  .nnm-filterbar {
    display: flex;
    align-items: center;
    gap: 9px;
    background: #fff;
    border: 1px solid var(--nnm-rule);
    border-radius: 7px;
    padding: 0 8px 0 12px;
    height: 36px;
    box-sizing: border-box;
  }
  .nnm-filterbar.bad { border-color: #C0503E; }
  .nnm-filter-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--nnm-ink-3);
    flex-shrink: 0;
  }
  .nnm-filter-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--nnm-mono);
    font-size: 13px;
    color: var(--nnm-ink);
    padding: 3px 0;
  }
  .nnm-filter-input::placeholder { color: #A6AEBA; }
  .nnm-filter-input:focus-visible { outline: none; }
  .nnm-filterbar:focus-within { border-color: var(--nnm-neg); box-shadow: 0 0 0 2px var(--nnm-neg-soft); }
  .nnm-filter-count {
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--nnm-mono);
    font-size: 11.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .nnm-filter-count.err { color: #C0503E; }
  .nnm-filter-help {
    width: 22px; height: 22px;
    flex-shrink: 0;
    border: 1px solid var(--nnm-rule);
    border-radius: 50%;
    background: #fff;
    color: var(--nnm-ink-2);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .nnm-filter-help:hover { background: var(--nnm-surface); }
  .nnm-filter-help:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .nnm-filter-helpbox {
    position: absolute;
    z-index: 20;
    top: calc(100% + 5px);
    right: 0;
    width: min(430px, 100%);
    background: #fff;
    border: 1px solid var(--nnm-rule);
    border-radius: 7px;
    box-shadow: 0 6px 20px -8px rgba(30,36,44,0.35);
    padding: 11px 13px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--nnm-ink-2);
    max-height: 300px;
    overflow: auto;
  }
  .nnm-filter-helpbox b {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--nnm-ink-3);
    margin: 8px 0 4px;
  }
  .nnm-filter-helpbox b:first-child { margin-top: 0; }
  .nnm-filter-helpbox ul { margin: 0; padding-left: 17px; }
  .nnm-filter-helpbox li { margin-bottom: 3px; }
  .nnm-filter-helpbox code,
  .nnm-fieldlist code {
    font-family: var(--nnm-mono);
    font-size: 11.5px;
    background: var(--nnm-surface);
    border: 1px solid var(--nnm-rule-soft);
    border-radius: 3px;
    padding: 0 4px;
    white-space: nowrap;
  }
  .nnm-fieldlist { display: flex; flex-wrap: wrap; gap: 4px; }
  /* A class-level `display` beats the UA rule for [hidden], so state it back. */
  .nnm-empty[hidden] { display: none; }
  .nnm-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--nnm-ink-3);
    font-size: 15px;
  }
  .nnm-panel {
    background: #fff;
    border: 1px solid var(--nnm-rule);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .nnm-panel-head {
    min-height: 44px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    padding: 9px 14px 8px;
    border-bottom: 1px solid var(--nnm-rule-soft);
    background: var(--nnm-surface);
    border-radius: 7px 7px 0 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .nnm-panel-body { padding: 12px 14px; overflow: auto; min-height: 0; flex: 1; }

  /* --- case navigator --- */
  .nnm-nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .nnm-navbtn {
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--nnm-rule);
    background: #fff;
    border-radius: 5px;
    cursor: pointer;
    color: var(--nnm-ink-2);
    font-size: 14px;
    line-height: 1;
    padding: 0;
  }
  .nnm-navbtn:hover:not([aria-disabled="true"]) { background: var(--nnm-surface); }
  .nnm-navbtn:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .nnm-navbtn[aria-disabled="true"] { opacity: 0.35; cursor: default; }
  .nnm-count {
    font-family: var(--nnm-mono);
    font-size: 11.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    text-transform: none;
    letter-spacing: 0;
  }

  /* --- alien conversation --- */
  .nnm-alien {
    font-family: var(--nnm-mono);
    font-size: 14px;
    line-height: 1.85;
    color: var(--nnm-ink);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .nnm-caseid {
    font-family: var(--nnm-mono);
    font-size: 11px;
    color: var(--nnm-ink-3);
    text-transform: none;
    letter-spacing: 0;
  }
  .nnm-decidewrap {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex-shrink: 0;
  }
  .nnm-deciderow { position: relative; display: flex; align-items: stretch; }
  /* Sits under the sum and the outcome it is being compared against, in a narrow
     column, so the two facts stack rather than running side by side. */
  /* Out of the flow, like the sum's caption before it. Left in, the wrapper
     centres the sum row plus these labels as one group, which lifts the sum
     half the labels' height above the centre of the three pathways. */
  .nnm-labels {
    position: absolute;
    top: calc(100% + 16px);
    left: 6px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }
  /* In the narrow layout the labels rejoin the flow, so the row must wrap or they
     sit alongside the sum and push the panel wide. */
  .nnm-flowbody.narrow .nnm-deciderow { flex-wrap: wrap; }
  .nnm-flowbody.narrow .nnm-labels {
    position: static;
    width: 100%;
    margin-top: 12px;
    padding-left: 0;
  }
  .nnm-label-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--nnm-ink-2);
  }
  .nnm-label-row b {
    font-weight: 400;
    color: var(--nnm-ink-3);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .nnm-pill {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 9px;
    border-radius: 11px;
    border: 1px solid currentColor;
  }
  .nnm-pill.approach { color: var(--nnm-pos); background: var(--nnm-pos-soft); }
  .nnm-pill.wait { color: var(--nnm-neg); background: var(--nnm-neg-soft); }
  .nnm-flag {
    font-size: 12px;
    font-weight: 700;
    color: #A03A2B;
    background: #FBE3DF;
    border-radius: 4px;
    padding: 1px 6px;
  }

  .nnm-tok {
    border-radius: 3px;
    padding: 1px 2px;
    margin: 0 -1px;
    /* The scan rule is an inset shadow, not an outline or a border. An outline is
       drawn outside the box, so adjacent words' outlines overlapped in the ~3.6px
       of a space; a border would reflow the sentence as each word gained one.
       Inset draws within the padding, so words can sit as tight as they like. */
    box-shadow: inset 0 0 0 0 transparent;
    transition: background-color 0.22s ease, color 0.22s ease, box-shadow 0.18s ease;
  }
  .nnm-tok.scanning { box-shadow: inset 0 0 0 1.5px var(--nnm-ink); }
  /* A scored word carries its colour but does not show it until it is lit —
     the Words step lights them one at a time, in sentence order. */
  .nnm-tok.scored.lit {
    background: var(--tok-bg);
    color: var(--tok-fg);
  }
  /* Clones that travel from the reading into the activation cell they feed.
     Fixed to the body so they are not clipped by either panel. */
  /* The travelling chip carries the word and the score it is about to add. */
  .nnm-fly {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    border-radius: 4px;
    padding: 2px 6px;
    white-space: nowrap;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    box-shadow: 0 2px 8px -2px rgba(30,36,44,0.4);
    will-change: transform, opacity;
  }
  /* A small kick each time the running total takes on another word. */
  .nnm-tick { animation: nnm-tick 0.26s ease-out; }
  @keyframes nnm-tick {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.09); }
    100% { transform: scale(1); }
  }
  .nnm-scale {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
    font-family: var(--nnm-mono);
    font-size: 10.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .nnm-scale-bar {
    flex: 1;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(to right, var(--nnm-neg), #fff, var(--nnm-pos));
    border: 1px solid var(--nnm-rule-soft);
  }
  .nnm-reading {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    margin-bottom: 7px;
    flex-shrink: 0;
  }
  .nnm-reading b { color: var(--nnm-ink); font-weight: 600; }

  /* --- left: three readings in one card, per the sketch --- */
  /* 470 tipped the flow into its stacked fallback at AP Full Width: the flow needs
     ~556px and the row only has ~1014 to share. 440 leaves the flow enough. */
  /* Two columns, each a toolbar over a card: find over the conversation,
     the steps over the pathways. Both toolbars are the same height so the
     two panels start on the same line. */
  .nnm-rightcol {
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex: 1 1 560px;
    min-width: 318px;
    min-height: 0;
  }
  /* No card behind these — just the buttons. The 36px height stays so the panel
     below still starts level with the conversation panel. */
  .nnm-steprow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 36px;
    box-sizing: border-box;
    flex-shrink: 0;
  }
  .nnm-leftcol {
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex: 1 1 440px;
    min-width: 236px;
    min-height: 0;
  }
  .nnm-readings { flex: 1; min-height: 0; }
  .nnm-readhead {
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    line-height: 1.25;
    color: var(--nnm-ink-2);
    height: 30px;              /* matches .nnm-flowhead's two-line captions */
    display: flex;
    align-items: flex-end;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .nnm-readscroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-gutter: stable;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .nnm-read { border-radius: 5px; padding: 0 5px; box-sizing: border-box; }
  .nnm-read-name {
    font-family: 'Lato', sans-serif;
    font-size: 12.5px;
    color: var(--nnm-ink-2);
    padding-bottom: 4px;
    border-bottom: 1px solid #B9CBE4;
    margin-bottom: 5px;
  }
  .nnm-read-scale {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--nnm-mono);
    font-size: 9.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }
  .nnm-read-scale .grad {
    flex: 1;
    height: 9px;
    border-radius: 2px;
    background: linear-gradient(to right, #1F4E8F, #C8D6E9, #FFFFFF, #EFD3C4, #A84A2C);
  }
  .nnm-read-text {
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    line-height: 1.85;
    color: var(--nnm-ink);
    word-break: break-word;
  }

  /* --- right: the flow diagram --- */
  .nnm-flowpanel { flex: 1; min-height: 0; }
  .nnm-flowouter { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  /* min-height:0 is required — without it a flex child refuses to shrink below its
     content and overflow-y:auto never engages, so the bar escaped the card. */
  .nnm-flowbodywrap {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    min-height: 0;
    flex: 1;
    scrollbar-gutter: stable;
    padding: 5px 0 5px 6px;
    margin: -5px 0 -5px -6px;
  }
  .nnm-flowhead {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 0;
    height: 30px;
    margin-bottom: 8px;
    flex-shrink: 0;
    box-sizing: content-box;
  }
  /* Positioned against measured centres rather than flex order. */
  .nnm-flowhead .c.far {
    position: absolute;
    bottom: 0;
    transform: translateX(-50%);
    width: auto;
    white-space: nowrap;
  }
  .nnm-flowhead .c {
    width: 82px;
    flex-shrink: 0;
    text-align: center;
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    line-height: 1.25;
    color: var(--nnm-ink-2);
  }
  .nnm-flowhead .g { width: 30px; flex-shrink: 0; }
  .nnm-flowbody { display: flex; align-items: stretch; flex-shrink: 0; min-width: 0; }
  .nnm-frows { display: flex; flex-direction: column; gap: 14px; flex-shrink: 0; }
  .nnm-frow { display: flex; align-items: center; gap: 0; border-radius: 5px; box-sizing: border-box; }
  .nnm-cell {
    width: 82px;
    height: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(30,36,44,0.14);
    border-radius: 6px;
    font-family: var(--nnm-mono);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    background: #fff;
    transition: background-color 0.35s ease, color 0.35s ease, opacity 0.3s ease;
  }
  /* Importance stays grey: it is the one number that does not change
     from conversation to conversation. */
  .nnm-cell.imp { background: #EFF1F4 !important; color: var(--nnm-ink) !important; border-color: #D3D8E0 !important; }
  .nnm-cell.sum { width: 62px; height: 40px; }
  /* A stage that has not run yet is a stand-in: the box is there so the shape of
     the calculation is visible from the start, but it holds no value and no colour. */
  .nnm-cell.empty, .nnm-out.empty {
    background: repeating-linear-gradient(-45deg, #FAFBFC 0 5px, #F1F3F6 5px 10px) !important;
    border-color: #D8DDE5 !important;
    border-style: dashed !important;
    color: transparent !important;
  }
  .nnm-pop { animation: nnm-pop 0.42s cubic-bezier(0.2, 0.9, 0.3, 1.3); }
  @keyframes nnm-pop {
    from { opacity: 0; transform: scale(0.90); }
    60%  { opacity: 1; }
    to   { opacity: 1; transform: scale(1); }
  }
  .nnm-reset {
    width: 36px; height: 36px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 1px solid var(--nnm-rule);
    background: #fff;
    border-radius: 5px;
    cursor: pointer;
    color: var(--nnm-ink-2);
    font-size: 21px;
    line-height: 1;
    padding: 0 0 2px;
  }
  .nnm-reset:hover { background: var(--nnm-surface); }

  .nnm-animtoggle {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    margin-left: 6px;
    padding: 0 4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    cursor: pointer;
    user-select: none;
  }
  .nnm-animtoggle input { width: 15px; height: 15px; margin: 0; cursor: pointer; accent-color: var(--nnm-neg); }
  .nnm-animtoggle:hover { color: var(--nnm-ink); }
  .nnm-animtoggle:focus-within { outline: 2px solid var(--nnm-neg); outline-offset: 2px; border-radius: 4px; }

  /* The non-animated version: same screen, every stage arriving at once. */
  .nnm-nomotion .nnm-pop,
  .nnm-nomotion .nnm-tick { animation: none !important; }
  .nnm-nomotion .nnm-cell,
  .nnm-nomotion .nnm-cell.wgt,
  .nnm-nomotion .nnm-tok { transition: none !important; }
  .nnm-reset:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  /* A fixed-width track for the weighted box, so the box can change size with
     its value without moving the flow's overall width. */
  .nnm-slot {
    width: 82px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }
  /* Resting width sits between the widest and narrowest a value can produce, so
     the Weigh step is seen to widen some boxes and narrow others rather than only
     ever shrinking them. */
  .nnm-cell.wgt {
    width: 58px;
    transition: width 0.45s cubic-bezier(.3,0,.3,1), background-color 0.35s ease, color 0.35s ease;
  }
  .nnm-op {
    width: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s ease;
  }
  .nnm-glyph { width: 22px; height: 22px; display: block; }
  .nnm-glyph.arr { width: 24px; height: 18px; }
  /* The operators darken as the Weigh step reaches them, one row at a time. */
  .nnm-glyph path { transition: fill 0.3s ease, stroke 0.3s ease; }
  .nnm-frow.lit-mul .mul .nnm-glyph path { fill: #BFC7D2; stroke: #7E8895; }
  .nnm-frow.lit-arr .arr .nnm-glyph path { fill: #BFC7D2; stroke: #7E8895; }

  .nnm-conv {
    flex-shrink: 0;
    transition: opacity 0.3s ease;
    overflow: visible;
    pointer-events: none;
  }
  .nnm-tail {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.3s ease;
  }
  /* Lifted out of the flow so only the cell is centred. Left in it, the tail
     centres label-plus-cell as a group, which pushes the cell below the midpoint
     the two answers are centred on — 40px above it and 6px below. */
  .nnm-taillabel {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    line-height: 1.2;
    color: var(--nnm-ink-2);
    text-align: center;
  }
  .nnm-flowbody.narrow .nnm-taillabel {
    position: static;
    transform: none;
    white-space: normal;
  }
  .nnm-fan { width: 40px; flex-shrink: 0; transition: opacity 0.3s ease; overflow: visible; }
  .nnm-outs {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    flex-shrink: 0;
    transition: opacity 0.3s ease;
  }
  .nnm-out {
    width: 74px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    border-radius: 6px;
    border: 1px solid rgba(30,36,44,0.14);
    background: #fff;
    color: var(--nnm-ink-3);
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .nnm-out.approach.on { background: #EFD3C4; color: #1E242C; }
  .nnm-out.wait.on { background: #1F4E8F; color: #fff; }

  .nnm-flowbody.narrow { flex-wrap: wrap; }
  .nnm-flowbody.narrow .nnm-cell { width: 74px; height: 36px; font-size: 12px; }
  .nnm-flowbody.narrow .nnm-slot { width: 74px; }
  .nnm-flowbody.narrow .nnm-cell.sum { width: 58px; }
  .nnm-flowbody.narrow .nnm-op { width: 26px; }
  .nnm-flowpanel:has(.nnm-flowbody.narrow) .nnm-flowhead .c { width: 74px; }
  .nnm-flowpanel:has(.nnm-flowbody.narrow) .nnm-flowhead .g { width: 26px; }
  .nnm-flowbody.narrow .nnm-out { width: 68px; height: 34px; font-size: 12.5px; }
  .nnm-flowbody.narrow .nnm-conv, .nnm-flowbody.narrow .nnm-fan { display: none; }
  .nnm-flowbody.narrow .nnm-decidewrap { width: 100%; padding-top: 12px; }
  .nnm-flowbody.narrow .nnm-deciderow { align-items: center; gap: 10px; }
  .nnm-flowbody.narrow .nnm-tail { flex-direction: row; gap: 8px; }
  .nnm-flowbody.narrow .nnm-outs { flex-direction: row; gap: 8px; }
  .nnm-flowbody.narrow .nnm-labels { flex-direction: row; gap: 6px 20px; align-items: center; }


  /* --- verdict --- */
  .nnm-verdict {
    margin-top: 14px;
    padding: 11px 13px;
    border: 1px solid var(--nnm-rule);
    border-radius: 7px;
    background: var(--nnm-surface);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    flex-shrink: 0;
  }
  .nnm-verdict-main {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nnm-note {
    min-width: 0;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--nnm-ink-2);
    font-style: italic;
    margin-top: 11px;
  }
  .nnm-note:empty { display: none; }
  .nnm-outs { display: flex; gap: 6px; }
  .nnm-out {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 3px 11px;
    border-radius: 11px;
    border: 1px solid var(--nnm-rule);
    color: var(--nnm-ink-3);
    background: #fff;
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  }
  .nnm-out.approach.on { color: var(--nnm-pos); border-color: var(--nnm-pos); background: var(--nnm-pos-soft); }
  .nnm-out.wait.on { color: var(--nnm-neg); border-color: var(--nnm-neg); background: var(--nnm-neg-soft); }

  /* --- step control --- */
  .nnm-step {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;

    closeBtn.className = "info-modal-close";
    closeBtn.setAttribute("aria-label", "Close");
    const closeIcon = createSVGIcon(closeIconSVG);
    closeBtn.appendChild(closeIcon);
    function closeModal() {
      modal.style.opacity = "0";
      modal.addEventListener("transitionend", function handler() {
        modal.removeEventListener("transitionend", handler);
        modal.remove();
      });
      document.removeEventListener("keydown", onModalKeydown);
      infoBtn.focus();
    }
    modal._closeModal = closeModal;
    closeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      closeModal();

    header.appendChild(hIcon);
    header.appendChild(hTitle);
    header.appendChild(closeBtn);

    // Body
    const body = document.createElement("div");
    body.className = "info-modal-body";

    bodyFocusRing.className = "scroll-focus-ring";

    modal.appendChild(header);
    modal.appendChild(bodyWrap);
    // Append to content-area (parent of title bar)
    const contentArea = bar.parentElement;
    if (contentArea) contentArea.appendChild(modal);
    requestAnimationFrame(() => { modal.style.opacity = "1"; });

    // Dragging (pointer events: mouse + touch + pen)
    let dragX = 0, dragY = 0, modalX = 0, modalY = 0, dragging = false;
    header.addEventListener("pointerdown", (e) => {
      if (e.target === closeBtn || closeBtn.contains(e.target)) return;
      dragging = true;
      dragX = e.clientX - modalX;
      dragY = e.clientY - modalY;
      header.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    header.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      modalX = e.clientX - dragX;
      modalY = e.clientY - dragY;
      modal.style.transform = "translate(" + modalX + "px, " + modalY + "px)";
    });
    header.addEventListener("pointerup", () => { if (dragging) modal.focus(); dragging = false; });
    header.addEventListener("pointercancel", () => { dragging = false; });

    // Keyboard dragging (Alt+Arrow)
    modal.addEventListener("keydown", (e) => {
      if (!e.altKey) return;
      const step = e.shiftKey ? 40 : 10;
      let dx = 0, dy = 0;
      if (e.key === "ArrowLeft") dx = -step;
      else if (e.key === "ArrowRight") dx = step;
      else if (e.key === "ArrowUp") dy = -step;
      else if (e.key === "ArrowDown") dy = step;
      else return;
      e.preventDefault();
      modalX += dx;
      modalY += dy;
      modal.style.transform = "translate(" + modalX + "px, " + modalY + "px)";
    });

    // Escape to close + focus trap
    function onModalKeydown(e) {
      if (e.key === "Escape") { closeModal(); return; }
      if (e.key === "Tab") {
        var focusable = modal.querySelectorAll('button, [tabindex="0"]');
        if (focusable.length === 0) return;
        var first = focusable[0];
        var last = focusable[focusable.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first) { e.preventDefault(); last.focus(); }
        } else {
          if (document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      }
    }
    document.addEventListener("keydown", onModalKeydown);

    closeBtn.focus();
  });

  right.appendChild(ccLogo);
  right.appendChild(infoBtn);

  bar.appendChild(left);
  bar.appendChild(right);
  return bar;
}
