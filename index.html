        pathways(0);
      } else {
        const t0 = setTimeout(settle, EX_FADE);
        const t1 = setTimeout(label, EX_FADE + EX_MOVE);
        SIM._timeouts.push(t0, t1);
        // Each conversation arrives a little faster than the last, so twenty of them
        // build rather than plod — the same decay the network's fans use. Every one
        // is named as it lands, and from the eleventh the whole column closes up to
        // take it: the same height holding more.
        let at = EX_FADE + EX_MOVE + EX_SHOW + 220;
        for (let i = 1; i < GRID_ROWS; i++) {
          const step = Math.max(CONV_MIN, CONV_FIRST * Math.pow(CONV_DECAY, i - 1));
          const n = i + 1;
          const ta = setTimeout(function () {
            const g = addRow(i);
            // Arrives just below the stack as it stands, then everything settles.
            g.style.transform = "translate(0px," + Math.round(rowY(i, i) + P - my) + "px)";
            g.style.opacity = "0";
            void g.getBoundingClientRect();
            g.style.transition = "opacity " + Math.round(step * 0.5) + "ms ease";
            g.style.opacity = "1";
          }, at);
          const tb = setTimeout(function () { centreAll(n, Math.round(step * 0.7)); },
                                at + Math.round(step * 0.35));
          SIM._timeouts.push(ta, tb);
          at += step;
        }
        const tc = setTimeout(function () { dropNames(CONV_NAMES_OUT); }, at + 240);
        const td = setTimeout(function () { heading(CONV_HEAD_IN); },
                              at + 240 + Math.round(CONV_NAMES_OUT * 0.6));
        SIM._timeouts.push(tc, td);

        let t = at + 240 + CONV_NAMES_OUT + CONV_HEAD_IN + 260;
        const tg = setTimeout(startGrid, t);
        SIM._timeouts.push(tg);
        t += 200;

        // Columns 2 and 3 fill a conversation at a time — the same beat the first
        // column had, so what a column IS carries over. After that a column arrives
        // whole, and faster each time: eighty of them one at a time would be a
        // different film.
        for (let c = 1; c < GRID_COLS; c++) {
          const n = c + 1;
          const single = c < 3;
          const step = single
            ? GRID_ROWS * GRID_ONE + 260
            : Math.max(GRID_MIN, GRID_FIRST * Math.pow(GRID_DECAY, c - 3));
          const tm = setTimeout(function () {
            const g = makeCol();
            // Born one pitch left of where the current leftmost sits, so it arrives
            // into open space and the shove happens afterwards.
            // One pitch left of where the CURRENT leftmost sits — which is index
            // n-2 in a layout of n-1 columns. Asking for index n-1 there is off the
            // end of that layout and already returns a pitch too far left.
            g.style.transform = "translate("
              + Math.round(gridColX(n - 2, n - 1) - P - mx) + "px,0px)";
            const cs = g.querySelectorAll("circle");
            cs.forEach(function (c2) {
              c2.style.opacity = "0";
              c2.style.transition = "opacity " + (single ? 180 : 140) + "ms ease";
            });
            void g.getBoundingClientRect();
            if (single) {
              cs.forEach(function (c2, i) {
                const tf = setTimeout(function () { c2.style.opacity = "1"; }, i * GRID_ONE);
                SIM._timeouts.push(tf);
              });
            } else {
              cs.forEach(function (c2) { c2.style.opacity = "1"; });
            }
          }, t);
          const tn = setTimeout(function () {
            layoutCols(n, Math.min(320, Math.round(step * 0.8)));
            setCount(n * GRID_ROWS);
          }, t + (single ? GRID_ROWS * GRID_ONE + 60 : Math.round(step * 0.45)));
          SIM._timeouts.push(tm, tn);
          t += step;
        }
        const tb2 = setTimeout(function () { gridBox(320); }, t + 260);
        const tp = setTimeout(function () { pathways(420); }, t + 780);
        SIM._timeouts.push(tb2, tp);
      }
      if (!EX_PATHWAYS) return;

      const colX = Math.round(X.W * 0.34);
      const pad = X.r + 2;
      const y0 = pad;
      const gap = (X.H - pad - y0) / (units.length - 1);
      let made = null;
      const boxes = function () {
        made = addPathwayBoxes(X, colX, y0, gap, units.length, quick);
      };
      const at = function (k) { return { x: colX, y: y0 + k * gap }; };
      const wire = function () { drawLoadings(X, units, at, made, quick); };

      if (quick) { boxes(); wire(); return; }
      const t2 = setTimeout(boxes, EX_FADE + EX_MOVE);
      const t3 = setTimeout(wire, EX_FADE + EX_MOVE + EX_SHOW);
      SIM._timeouts.push(t2, t3);
    }

    // ---- The third beat: which units make which pathway ----
    // One pathway at a time, its own lines drawing together, and then its box
    // filling. Sequential because the claim is: THESE units, therefore THIS value —
    // and a student who watches all three at once sees only that something happened.
    // ---- Reading the loading matrix, one row or one column at a time ----
    // Slide 2's sketch, rotated: nothing is drawn at rest, and picking one side
    // shows its loadings against the other. Pick a pathway and its fourteen
    // loadings appear beside the units; pick a unit and its three appear beside
    // the pathways. Both readings are the same table — a loading matrix has no
    // direction, which is exactly what the sketch demonstrates by drawing it from
    // both ends on one page — so neither side is presented as making the other.
    //
    // Drawing all 42 at once was the alternative and it was unreadable: the
    // corridor between the two columns is 130px, and forty-two lines crossing it
    // say only that everything connects to everything.
    const BAR_H = 7, BAR_MAX = 44;
    const LOAD_MAX = 0.585;          // the largest |loading| in the matrix
    // Which side of the matrix is being read, and which row or column of it. Lives
    // out here with `extracted` and survives a redraw for the same reason: a loading
    // is a property of the NETWORK, so the answer on screen is still the answer after
    // you turn to the next conversation. Only Reset clears it.
    let loadSel = null;              // {kind: "path"|"unit", i} or null

    function drawLoadings(X, units, at, made, quick, noFill) {
      if (!made) return;
      const it = cases[idx];
      const act = (it && it.act) || [];
      // The layer the connectors and bars live on. Under the neurons and boxes,
      // like every other wire on this screen.
      const g = el("g", { class: "d1a-loadgroup" });
      X.scene.insertBefore(g, X.scene.firstChild);
      // A bar sits on the FAR side of the thing it describes, away from the
      // connector that arrives at it — so a line never crosses a bar and a bar is
      // never read as belonging to the item at the other end of the line. Picking
      // a pathway puts the connectors in the corridor and the bars out on the left
      // of the units; picking a unit puts the connectors in the corridor and the
      // bars against the boxes at the far end of it.
      const rr = X.r;
      // A bar always butts against the item it describes, on the side the connector
      // arrives from, and grows away from it — so the connector runs into the bar
      // and the two read as one continuous run: hairline, then colour, then the
      // thing itself. Symmetric in both directions, which is the point: the same
      // number is being read from either end of the same table.
      //
      // Sign is the hue, not the direction — which is how the deck draws a loading
      // (the neurons inside a pathway are shaded purple or yellow, not offset one
      // way or the other). Growing positives one way and negatives the other made
      // the gap between bar and item depend on the sign, which reads as a second
      // variable that is not there.
      const UNIT_BASE = made.colX + rr + 6;    // bars grow right, toward the boxes
      const BOX_BASE = made.bx - 10;           // bars grow left, toward the units

      // The unit's own ring is not reused: syncRings owns it and recomputes it
      // from hover and focus, so it would be wiped by the next mouse move. This
      // one belongs to the load group and is cleared with everything else.
      function clear() {
        while (g.firstChild) g.removeChild(g.firstChild);
        made.boxes.forEach(function (b) { b.box.classList.remove("on"); });
      }

      // One bar plus its connector: the bar's length is the magnitude on a single
      // scale across the whole matrix, its direction and hue the sign.
      // (x1,y1) is where the connector starts — the picked item. It runs to
      // (x2, atY), the near edge of the thing being described, and the bar sits at
      // that same y with its zero at baseX.
      // dir is which way the bar grows from its item: +1 right, -1 left. The
      // connector always stops exactly where the bar ends.
      function mark(x1, y1, atY, baseX, dir, v) {
        const len = Math.max(2, Math.abs(v) / LOAD_MAX * BAR_MAX);
        const far = baseX + dir * len;
        g.appendChild(el("line", { x1: x1, y1: y1, x2: far, y2: atY,
                                   class: "d1a-loadwire" }));
        g.appendChild(el("rect", {
          x: dir > 0 ? baseX : far, y: atY - BAR_H / 2, width: len, height: BAR_H,
          class: "d1a-loadbar " + (v >= 0 ? "pos" : "neg")
        }));
      }

      // Out from the box, one line per unit, each ending in the bar that is that
      // unit's loading on it.
      function showPath(pi) {
        clear();
        const b = made.boxes[pi];
        b.box.classList.add("on");
        units.forEach(function (n, k) {
          mark(b.x, b.cy, at(k).y, UNIT_BASE, 1, PATH_LOAD[k][pi]);
        });
      }
      // The same run read from the other end: out from the unit, one line per
      // pathway, each ending in the bar that sits against its box.
      function showUnit(k) {
        clear();
        const q = at(k);
        g.appendChild(el("circle", { cx: q.x, cy: q.y, r: rr + 3.5,
                                     class: "d1a-loadring" }));
        made.boxes.forEach(function (b, pi) {
          mark(q.x + rr, q.y, b.cy, BOX_BASE, -1, PATH_LOAD[k][pi]);
        });
      }
      function pick(kind, i) {
        if (loadSel && loadSel.kind === kind && loadSel.i === i) {
          loadSel = null; clear(); return;
        }
        loadSel = { kind: kind, i: i };
        if (kind === "path") showPath(i); else showUnit(i);
      }

      made.boxes.forEach(function (b, pi) {
        b.box.classList.add("pick");
        b.box.setAttribute("tabindex", "0");
        b.box.setAttribute("role", "button");
        b.box.setAttribute("aria-label",
          "Pathway " + (pi + PATH_OFFSET) + ", show its loadings on the units");
        b.box.addEventListener("click", function () { pick("path", pi); });
        b.box.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick("path", pi); }
        });
      });
      units.forEach(function (n, k) {
        n.classList.add("pick");
        n.addEventListener("click", function () { pick("unit", k); });
      });

      // Nothing on this screen says it can be clicked, and both halves of the
      // matrix are only reachable by trying. The prompt sits above the pathways
      // and arrives once the reveal has finished — before that there is nothing to
      // click. It then STAYS: it is the only statement of what the two halves do,
      // and picking one of them does not teach you that the other is pickable too.
      // It also names both readings, so it stays true whichever one is showing.
      // Normally flush with the boxes, but it is 174 wide and they can be pushed
      // further right than that leaves room for — so it stops where the panel does.
      const tipX = Math.min(made.bx, X.W - 186);
      const tip = el("text", { x: tipX, y: 20, class: "d1a-loadtip" });
      ["Click a pathway or a neuron", "to see how strongly they link."]
        .forEach(function (line, i) {
          const t = el("tspan", { x: tipX, dy: i ? 16 : 0 });
          t.textContent = line;
          tip.appendChild(t);
        });
      made.g.appendChild(tip);
      function showTip(on) { tip.style.opacity = on ? "1" : "0"; }

      // A selection made before this redraw is put back on the new elements. Not
      // through pick(), which toggles — this is a restore, not a press.
      if (loadSel) {
        if (loadSel.kind === "path") showPath(loadSel.i); else showUnit(loadSel.i);
      }

      // The squares still land one pathway at a time — the reveal is the only
      // thing that was carried by the lines, and it survives without them.
      const fill = function (p) {
        setBoxLevel(made.boxes[p], (act[p] || 0) / ACT_SCALE, quick);
      };
      if (quick) { if (!noFill) [0, 1, 2].forEach(fill); showTip(true); return; }
      tip.style.opacity = "0";
      tip.style.transition = "opacity " + EX_FILL + "ms ease";
      if (!noFill) {
        [0, 1, 2].forEach(function (p) {
          const t = setTimeout(function () { fill(p); }, p * EX_FILL + 20);
          SIM._timeouts.push(t);
        });
      }
      const tt = setTimeout(function () { showTip(true); },
                            (noFill ? 1 : 3) * EX_FILL + 20);
      SIM._timeouts.push(tt);
    }

    // Day 2's sizing, to the letter: sqrt of the magnitude over the shared scale,
    // between a floor that keeps a near-zero pathway visible as a mark and a
    // ceiling that fits inside the box. Grown from the centre outwards.
    const SQ_MIN = 6, SQ_MAX = 26;
    function setBoxLevel(b, v, quick) {
      const t = Math.sqrt(Math.min(1, Math.abs(v)));
      const side = SQ_MIN + (SQ_MAX - SQ_MIN) * t;
      b.sq.style.transition = quick ? "none"
        : "x " + EX_FILL + "ms ease, y " + EX_FILL + "ms ease, width " + EX_FILL
          + "ms ease, height " + EX_FILL + "ms ease";
      b.sq.setAttribute("x", b.x + b.side / 2 - side / 2);
      b.sq.setAttribute("y", b.cy - side / 2);
      b.sq.setAttribute("width", side);
      b.sq.setAttribute("height", side);
      b.sq.setAttribute("fill", signColour(v));
    }

    // Three boxes to the right of the column, each labelled. Sized and spaced off
    // the column so they read as belonging to it rather than as a separate diagram.
    function addPathwayBoxes(X, colX, y0, gap, n, quick, bxIn) {
      const NP = 3, side = 34;
      // 0.58 of the width when the drawing had the whole panel. The pathway view now
      // shares the panel with the deck, so the caller says where.
      const bx = bxIn || Math.round(X.W * 0.58);
      const span = (n - 1) * gap;
      const step = span / (NP + 1);
      const g = el("g", { class: "d1a-pathgroup" });
      X.scene.appendChild(g);
      const boxes = [];
      for (let i = 0; i < NP; i++) {
        const cy = Math.round(y0 + step * (i + 1));
        const box = el("rect", { x: bx, y: cy - side / 2, width: side, height: side,
                                 rx: 6, class: "d1a-pathbox" });
        g.appendChild(box);
        // What goes INSIDE the box is the pathway's activation for this
        // conversation, drawn exactly as the Prediction Chain draws it: a square,
        // sized on the square root of the value over the same dataset-wide scale,
        // coloured by its sign. Not a fill gauge — a gauge would have needed a
        // scale of its own, and 76% of activations are under 1.0 against a maximum
        // of 4.78, so a linear fill left three-quarters of the dataset looking
        // empty. Reusing Day 2's mark means the last thing seen here is the first
        // thing seen there.
        const sq = el("rect", { x: bx + side / 2, y: cy, width: 0, height: 0,
                                rx: 1, class: "d1a-pathsq" });
        sq.setAttribute("pointer-events", "none");
        g.appendChild(sq);
        const lab = el("text", { x: bx + side + 10, y: cy + 4, class: "d1a-pathlabel" });
        lab.textContent = "Pathway " + (i + 1);
        g.appendChild(lab);
        boxes.push({ x: bx, cy: cy, side: side, sq: sq, box: box });
      }
      const made = { g: g, boxes: boxes, bx: bx, colX: colX };
      g.style.opacity = "0";
      if (quick) { g.style.opacity = "1"; return made; }
      g.style.transition = "opacity " + EX_SHOW + "ms ease";
      const t = setTimeout(function () { g.style.opacity = "1"; }, 20);
      SIM._timeouts.push(t);
      return made;
    }

    function restoreSteps() {
      // opened: every conversation arrives already run, on this screen and on every
      // redraw of it — a resize must not wind the network back to nothing.
      if (opts.opened) { applyStepState(4); return; }
      const id = hereId();
      applyStepState(id ? (stepState[id] || 0) : 0);
    }

    // Reset drops the selection too. After it the neurons are empty, so a readout
    // describing one is talking about a value that is no longer on screen — the
    // same argument as clearing it when a step runs.
    function clearSteps() {
      if (svgHost.__clearPin) svgHost.__clearPin();
      const id = hereId();
      if (id) delete stepState[id];
      clearStep1(); clearStep2(); clearStep3(); clearStep4();
      running = false; stepDone = 0;
      syncSteps();
      // Also the path every redraw takes, so this is where the tooltips get their
      // initial "name only" state as well as their reset.
      syncNodeInfo();
      if (svgHost.__paintPin) svgHost.__paintPin();
    }

    STEP_RUNNERS[0] = runStep1;
    STEP_RUNNERS[1] = runStep2;
    STEP_RUNNERS[2] = runStep3;
    STEP_RUNNERS[3] = runStep4;
    stepBtns.forEach(function (b, i) {
      b.addEventListener("click", function () {
        if (b.disabled || !STEP_RUNNERS[i]) return;
        // A pinned neuron holds every unrelated edge at 10%, so the fan about to
        // sweep would run almost invisibly behind the dim. Running a step is a
        // request to watch the whole layer, so the selection goes first.
        if (svgHost.__clearPin) svgHost.__clearPin();
        STEP_RUNNERS[i]();
      });
    });
    resetBtn.addEventListener("click", clearSteps);
    syncSteps();
    prevBtn.addEventListener("click", function () { if (idx > 0) { idx--; render(); } });
    nextBtn.addEventListener("click", function () {
      if (idx < cases.length - 1) { idx++; render(); }
    });

    render();
    SIM.onResize = function () { render(); };
    // The first render runs before the panel has been laid out, so the host still
    // measures 0 and the drawing above falls back to its minimums. This is what
    // redraws it at the real size, and what keeps it right as the window changes.
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(function () {
        if (Math.abs(svgHost.clientWidth - drawnW) < 1
            && Math.abs(svgHost.clientHeight - drawnH) < 1) return;
        render();
      });
      ro.observe(svgHost);
      SIM._observers.push(ro);
    }
    return wrap;
  }

  if (activeSim === "d1a") {
    return buildNetScreen({ steps: true, hover: true, marks: true,
                            title: "The Network" });
  }

  // Extract Pathways, state 1: where Trace a Case leaves off. No steps to run —
  // they are all already applied — and no hover, because nothing here is asking
  // "what is this neuron wired to" yet.
  if (activeSim === "d1b") {
    return buildNetScreen({ steps: false, hover: false, opened: true, extract: true,
                            filter: false, conversation: false,
                            title: "The Network → Activated Pathways" });
  }


  // ---------------------------------------------------------------
  // 1B (previous design) — Extract Pathways.  Design Sketches slides 17-18, and Scott's heatmap
  // demo: a grid of neuron activations on the left, and on the right one grid
  // per pathway showing loading x activation. 1A ends on "the network is real
  // and unreadable"; this is where the readable thing comes from.
  //
  // The extraction is NOT staged. The toy network below is run over all 800
  // conversations to make a real 800 x 96 activation matrix, and the pathways
  // are pulled out of it by actual factor extraction — power iteration with
  // deflation on the covariance — so the loadings, the explained variance and
  // the pathway scores on screen are all computed here, from that matrix. Only
  // the network underneath is invented: the alien corpus has no neuron layer
  // anywhere (alien-fa-4 carries pathway scores and importance but no
  // `loadings`, and its activations/ endpoint is a 404), while the Yelp fit has
  // 6 x 780. If Scott exports alien neuron data, ACT below is the only thing
  // that has to change.
  //
  // Slide 18 is the framing this has to keep: a pathway is not causal, not a
  // substitute for a hidden neuron, just an explanation tool.
  // ---------------------------------------------------------------
  // Superseded 2026-09-09: Extract Pathways now opens on the network end-state
  // instead. Left in place rather than deleted — the factor extraction here is real
  // (power iteration with deflation over a live 800 x 96 activation matrix) and
  // nothing else in the prototype computes loadings — so it is available if a later
  // state wants it. Unreachable until something sets this flag.
  const D1B_HEATMAP = false;
  if (D1B_HEATMAP && activeSim === "d1b") {
    const D = simData();
    const items = D.items;
    const VOCAB = Object.keys(D.vocabulary).sort();
    const LABELS = ["Wait", "Approach"];
    const NEUR = 96, GRID_W = 12, GRID_H = 8;   // 12 x 8 reads as a grid, not a list
    // However many the fit has. It was pinned at 4 while every other interactive
    // moved to the three-pathway fit, so Day 1 extracted four pathways and Day 2
    // then showed three of them.
    const NPATH = D.nPathways;
    let cases = items.slice();
    let idx = 0;
    let extracted = null;      // {loadings, scores, varFrac}
    let selPath = 0;
    let selNeuron = -1;
    let playing = false, playTimer = null;

    // ---- the neuron layer ----
    // A random network was the obvious construction and it was the wrong one:
    // random weights spread the variance evenly, so extraction returned four
    // look-alike pathways (11 / 10 / 7 / 6 percent) where the real fit is
    // dominated by the first (55 / 20 / 15 / 10). Four equally noisy grids is
    // the opposite of the lesson.
    //
    // So the neurons are built from the model's OWN pathway scores: each neuron
    // reads some mix of the four real pathways, scaled by how much variance the
    // fit says each one carries, plus its own private noise. Nothing about a
    // pathway is written into any single neuron — every neuron is a blend — but
    // the structure is genuinely there to be found, which is what makes the
    // extraction below worth running.
    const rand = (function (seed) {
      return function () {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296 * 2 - 1;
      };
    })(20260902);
    function tanh(x) { return Math.tanh ? Math.tanh(x) : (Math.exp(2*x)-1)/(Math.exp(2*x)+1); }

    const NP_REAL = D.nPathways;
    // Pathway scores come out of the fit standardised, so their spread says
    // nothing about their size; explainedVariance is where the size lives.
    const AMP = D.explainedVariance.map(Math.sqrt);
    const MIX = [];                       // NEUR x NP_REAL, unit length per neuron
    for (let j = 0; j < NEUR; j++) {
      const row = [];
      let n2 = 0;
      for (let k = 0; k < NP_REAL; k++) { const v = rand(); row.push(v); n2 += v * v; }
      const norm = Math.sqrt(n2) || 1;
      MIX.push(row.map(function (v) { return v / norm; }));
    }
    const NOISE = 0.35;                   // private variance per neuron
    // Every conversation's activations, once. This is the matrix the pathways
    // are extracted FROM, and slide 17 names it exactly: "activation value for
    // all neurons for all cases".
    const ACT = items.map(function (it) {
      const row = new Array(NEUR);
      for (let j = 0; j < NEUR; j++) {
        let s = 0;
        for (let k = 0; k < NP_REAL; k++) s += MIX[j][k] * AMP[k] * it.act[k];
        row[j] = tanh((s + NOISE * rand()) * 0.9);
      }
      return row;
    });
    const ACT_BY_ID = {};
    items.forEach(function (it, i) { ACT_BY_ID[it.id] = ACT[i]; });
    function hidden(it) { return ACT_BY_ID[it.id]; }

    // ---- real factor extraction ----
    // Power iteration with deflation over the covariance of the centred matrix.
    // Enough for four components on an 800 x 96 matrix, and it means the numbers
    // under each grid are measured rather than written in.
    function extract(nComp) {
      const n = ACT.length, m = NEUR;
      const mean = new Array(m).fill(0);
      for (let r = 0; r < n; r++) for (let c = 0; c < m; c++) mean[c] += ACT[r][c] / n;
      const X = ACT.map(function (row) {
        return row.map(function (v, c) { return v - mean[c]; });
      });
      // covariance, m x m
      const C = [];
      for (let a = 0; a < m; a++) C.push(new Array(m).fill(0));
      for (let r = 0; r < n; r++) {
        const row = X[r];
        for (let a = 0; a < m; a++) {
          const va = row[a];
          if (!va) continue;
          for (let b = a; b < m; b++) C[a][b] += va * row[b];
        }
      }
      for (let a = 0; a < m; a++) for (let b = a; b < m; b++) {
        C[a][b] /= (n - 1); C[b][a] = C[a][b];
      }
      let totalVar = 0;
      for (let a = 0; a < m; a++) totalVar += C[a][a];

      const loadings = [], eig = [];
      for (let k = 0; k < nComp; k++) {
        let v = [];
        for (let a = 0; a < m; a++) v.push(Math.sin((a + 1) * (k + 1) * 12.9898));
        let lam = 0;
        for (let iter = 0; iter < 120; iter++) {
          const u = new Array(m).fill(0);
          for (let a = 0; a < m; a++) {
            let s = 0;
            for (let b = 0; b < m; b++) s += C[a][b] * v[b];
            u[a] = s;
          }
          let norm = Math.sqrt(u.reduce(function (s, x) { return s + x * x; }, 0)) || 1;
          for (let a = 0; a < m; a++) u[a] /= norm;
          lam = norm;
          v = u;
        }
        // Sign is arbitrary in an eigenvector; pin it so the biggest loading is
        // positive, or the same run could paint a pathway's grid inverted.
        let big = 0;
        for (let a = 0; a < m; a++) if (Math.abs(v[a]) > Math.abs(v[big])) big = a;
        if (v[big] < 0) for (let a = 0; a < m; a++) v[a] = -v[a];
        loadings.push(v); eig.push(lam);
        // deflate
        for (let a = 0; a < m; a++) for (let b = 0; b < m; b++) C[a][b] -= lam * v[a] * v[b];
      }
      // Pathway score per case = the centred activations projected on the loading.
      const scores = X.map(function (row) {
        return loadings.map(function (L) {
          let s = 0;
          for (let a = 0; a < m; a++) s += row[a] * L[a];
          return s;
        });
      });
      return { loadings: loadings, scores: scores, mean: mean,
               varFrac: eig.map(function (e) { return e / totalVar; }) };
    }

    // ---- shell ----
    const wrap = document.createElement("div");
    wrap.className = "sim-content";
    SIM._timeouts = []; SIM._observers = []; SIM._rafs = [];
    const stack = document.createElement("div");
    stack.className = "nnm-stack";
    wrap.appendChild(stack);
    const toolbar = document.createElement("div");
    toolbar.className = "d3-toolbar d1b-toolbar";
    stack.appendChild(toolbar);
    const filter = NNM_FILTER.buildBar(function (its) {
      cases = its; idx = 0; render();
    });
    filter.el.classList.add("d3-filter");
    toolbar.appendChild(filter.el);
    if (filter.about) toolbar.appendChild(filter.about);
    const root = document.createElement("div");
    root.className = "nnm";
    stack.appendChild(root);

    function panel(parent, title, cls) {
      const col = document.createElement("div");
      col.className = "d3b-col " + (cls || "");
      parent.appendChild(col);
      const p = document.createElement("div");
      p.className = "nnm-panel d1b-panel";
      col.appendChild(p);
      const h = document.createElement("div");
      h.className = "nnm-panel-head";
      const t = document.createElement("span");
      t.textContent = title;
      h.appendChild(t);
      p.appendChild(h);
      const b = document.createElement("div");
      b.className = "nnm-panel-body d1b-body";
      p.appendChild(b);
      return { col: col, panel: p, head: h, body: b };
    }

    // ---- left: the activations one case at a time ----
    const actCard = panel(root, "Neuron activations", "d1b-actcol");
    const actCount = document.createElement("span");
    actCount.className = "d3b-count";
    actCard.head.appendChild(actCount);
    const nav = document.createElement("div");
    nav.className = "nnm-nav";
    const playBtn = document.createElement("button");
    playBtn.className = "nnm-navbtn d1b-play";
    playBtn.innerHTML = "&#9654;";
    playBtn.setAttribute("aria-label", "Play through the conversations");
    const prevBtn = document.createElement("button");
    prevBtn.className = "nnm-navbtn"; prevBtn.innerHTML = "&#9664;";
    prevBtn.setAttribute("aria-label", "Previous conversation");
    const nextBtn = document.createElement("button");
    nextBtn.className = "nnm-navbtn"; nextBtn.innerHTML = "&#9654;";
    nextBtn.setAttribute("aria-label", "Next conversation");
    nav.appendChild(playBtn); nav.appendChild(prevBtn); nav.appendChild(nextBtn);
    actCard.head.appendChild(nav);
    const actKey = document.createElement("div");
    actKey.className = "d1b-key";
    actKey.innerHTML = '<span>−</span><i class="act"></i><span>+ activation</span>';
    actCard.body.appendChild(actKey);
    const actGrid = document.createElement("div");
    actGrid.className = "d1b-grid d1b-actgrid";
    actCard.body.appendChild(actGrid);
    const actText = document.createElement("div");
    actText.className = "d1b-casetext";
    actCard.body.appendChild(actText);
    const extractBtn = document.createElement("button");
    extractBtn.className = "d1b-extract";
    extractBtn.textContent = "Extract pathways";
    actCard.body.appendChild(extractBtn);

    // ---- right: what comes out ----
    const outCard = panel(root, "Activated pathways", "d1b-outcol");
    const outSub = document.createElement("span");
    outSub.className = "d1b-headsub";
    outSub.textContent = "loading × activation";
    outCard.head.appendChild(outSub);
    const pathRow = document.createElement("div");
    pathRow.className = "d1b-pathrow";
    outCard.body.appendChild(pathRow);
    const loadHead = document.createElement("div");
    loadHead.className = "d3b-subhead d1b-loadhead";
    outCard.body.appendChild(loadHead);
    const loadKey = document.createElement("div");
    loadKey.className = "d1b-key d1b-loadkey";
    loadKey.innerHTML = '<span>−</span><i class="load"></i><span>+ loading</span>';
    outCard.body.appendChild(loadKey);
    const loadWrap = document.createElement("div");
    loadWrap.className = "d1b-loadwrap";
    outCard.body.appendChild(loadWrap);
    const note = document.createElement("div");
    note.className = "d1b-note";
    outCard.body.appendChild(note);

    // ---- drawing ----
    function actColour(v, scale) {
      const t = Math.min(1, Math.abs(v) / (scale || 1));
      if (t < 0.02) return "#FFFFFF";
      return (v >= 0 ? FILL_POS : FILL_NEG)[level(t)];
    }
    // Loadings get their own ramp, per slide 17 — purple positive, yellow
    // negative — so a loading can never be mistaken for an activation.
    const LOAD_POS = ["#EDE7F6", "#D1C4E9", "#B39DDB", "#9575CD", "#673AB7"];
    const LOAD_NEG = ["#FFF8E1", "#FFECB3", "#FFE082", "#FFCA28", "#F9A825"];
    function loadColour(v, scale) {
      const t = Math.min(1, Math.abs(v) / (scale || 1));
      if (t < 0.02) return "#FFFFFF";
      return (v >= 0 ? LOAD_POS : LOAD_NEG)[level(t)];
    }

    function fillGrid(host, vals, colour, scale, onPick) {
      host.innerHTML = "";
      for (let i = 0; i < vals.length; i++) {
        const d = document.createElement("i");
        d.className = "d1b-dot" + (i === selNeuron ? " picked" : "");
        d.style.background = colour(vals[i], scale);
        d.title = "Neuron " + (i + 1) + "   " + (vals[i] >= 0 ? "+" : "−")
          + Math.abs(vals[i]).toFixed(3);
        if (onPick) {
          d.addEventListener("click", function () { onPick(i); });
          d.classList.add("pickable");
        }
        host.appendChild(d);
      }
    }

    function renderPathways(h) {
      pathRow.innerHTML = "";
      if (!extracted) {
        const empty = document.createElement("div");
        empty.className = "d1b-empty";
        empty.textContent = "Nothing has been pulled out of these activations yet.";
        pathRow.appendChild(empty);
        loadHead.textContent = "";
        loadKey.style.visibility = "hidden";
        loadWrap.innerHTML = "";
        note.textContent = "";
        return;
      }
      loadKey.style.visibility = "";
      // loading x activation, neuron by neuron — the quantity Scott's demo puts
      // across the top of its right-hand panel, and the thing a pathway's score
      // is the sum of.
      const prods = extracted.loadings.map(function (L) {
        return L.map(function (l, i) { return l * (h[i] - extracted.mean[i]); });
      });
      const scale = Math.max.apply(null, prods.map(function (p) {
        return Math.max.apply(null, p.map(Math.abs)); })) || 1;
      prods.forEach(function (p, k) {
        const cell = document.createElement("div");
        cell.className = "d1b-path" + (k === selPath ? " on" : "");
        cell.style.animationDelay = (k * 90) + "ms";
        const cap = document.createElement("div");
        cap.className = "d1b-pathname";
        cap.textContent = "Pathway " + (k + 1);
        cell.appendChild(cap);
        const g = document.createElement("div");
        g.className = "d1b-grid d1b-pathgrid";
        fillGrid(g, p, actColour, scale, null);
        cell.appendChild(g);
        const stat = document.createElement("div");
        stat.className = "d1b-stat";
        const absMax = Math.max.apply(null, p.map(Math.abs));
        const sum = p.reduce(function (s, x) { return s + x; }, 0);
        stat.innerHTML = "absMax " + absMax.toFixed(3) + "<br>sum "
          + (sum >= 0 ? "+" : "−") + Math.abs(sum).toFixed(3) + "<br>"
          + Math.round(100 * extracted.varFrac[k]) + "% of variance";
        cell.appendChild(stat);
        cell.addEventListener("click", function () { selPath = k; render(); });
        pathRow.appendChild(cell);
      });

      // Loadings. A pathway's are shown on the same grid the neurons use, so the
      // two pictures line up dot for dot; a single neuron's are four bars out
      // from a zero line, which is the sketch under "Loadings" in the brief.
      loadWrap.innerHTML = "";
      if (selNeuron >= 0) {
        loadHead.textContent = "Neuron " + (selNeuron + 1) + " — its loading on each pathway";
        const chart = document.createElement("div");
        chart.className = "d1b-bars";
        const lim = Math.max.apply(null, extracted.loadings.map(function (L) {
          return Math.abs(L[selNeuron]); })) || 1;
        extracted.loadings.forEach(function (L, k) {
          const v = L[selNeuron];
          const row = document.createElement("div");
          row.className = "d1b-barrow";
          const lab = document.createElement("span");
          lab.className = "d1b-barlab";
          lab.textContent = "Pathway " + (k + 1);
          const track = document.createElement("i");
          track.className = "d1b-bartrack";
          const fill = document.createElement("i");
          fill.className = "d1b-barfill " + (v >= 0 ? "pos" : "neg");
          const half = 50 * Math.abs(v) / lim;
          fill.style.width = half.toFixed(2) + "%";
          fill.style.left = (v >= 0 ? 50 : 50 - half).toFixed(2) + "%";
          track.appendChild(fill);
          const num = document.createElement("em");
          num.className = "d1b-barnum";
          num.textContent = (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(3);
          row.appendChild(lab); row.appendChild(track); row.appendChild(num);
          chart.appendChild(row);
        });
        loadWrap.appendChild(chart);
      } else {
        loadHead.textContent = "Pathway " + (selPath + 1)
          + " — how much it reads from each neuron";
        const L = extracted.loadings[selPath];
        const lim = Math.max.apply(null, L.map(Math.abs)) || 1;
        const g = document.createElement("div");
        g.className = "d1b-grid d1b-loadgrid";
        fillGrid(g, L, loadColour, lim, function (i) { selNeuron = i; render(); });
        loadWrap.appendChild(g);
      }

      note.innerHTML = selNeuron >= 0
        ? '<button class="d1b-clear" type="button">Back to the pathway</button>'
          + " A neuron feeds every pathway a little and one of them a lot."
        : "Click a neuron to see what each pathway reads from it. "
          + "A pathway is not a part of the network — it is a way of reading one.";
      const clear = note.querySelector(".d1b-clear");
      if (clear) clear.addEventListener("click", function () { selNeuron = -1; render(); });
    }

    function render() {
      const empty = cases.length === 0;
      root.style.display = empty ? "none" : "";
      if (empty) return;
      if (idx >= cases.length) idx = cases.length - 1;
      const it = cases[idx];
      const h = hidden(it);

      actCount.textContent = (idx + 1) + " / " + cases.length;
      setAriaDisabled(prevBtn, idx === 0);
      setAriaDisabled(nextBtn, idx === cases.length - 1);
      playBtn.innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
      const scale = Math.max.apply(null, h.map(Math.abs)) || 1;
      fillGrid(actGrid, h, actColour, scale, extracted
        ? function (i) { selNeuron = i; render(); } : null);
      actText.textContent = it.text.split(/\s+/).slice(0, 14).join(" ") + "…";
      extractBtn.disabled = !!extracted;
      extractBtn.textContent = extracted ? "Pathways extracted" : "Extract pathways";

      renderPathways(h);
    }

    extractBtn.addEventListener("click", function () {
      if (extracted) return;
      extractBtn.textContent = "Extracting…";
      extractBtn.disabled = true;
      // A beat first, so the label actually paints before the arithmetic — the
      // extraction is real and takes long enough to see. A timer, NOT
      // requestAnimationFrame: rAF does not run in a background tab, so a student
      // who switched away mid-press would come back to a button that says
      // "Extracting…" for ever.
      const t = setTimeout(function () {
        extracted = extract(NPATH);
        root.classList.add("d1b-hasrun");
        render();
      }, 40);
      SIM._timeouts.push(t);
    });

    function step() {
      if (idx < cases.length - 1) idx++; else idx = 0;
      render();
    }
    playBtn.addEventListener("click", function () {
      playing = !playing;
      if (playing) {
        playTimer = setInterval(step, 700);
        SIM._timeouts.push(playTimer);
      } else if (playTimer) { clearInterval(playTimer); playTimer = null; }
      render();
    });
    prevBtn.addEventListener("click", function () { if (idx > 0) { idx--; render(); } });
    nextBtn.addEventListener("click", function () {
      if (idx < cases.length - 1) { idx++; render(); }
    });

    render();
    SIM.onResize = function () {};
    return wrap;
  }


  // ---- not yet built: blank content area ----
  const wrap = document.createElement("div");
  wrap.className = "sim-content";

  // Day 1's two screens have no content yet, but they do have About copy, so they
  // carry the button in the same corner the built ones put it. Inside a .nnm-stack
  // like every built screen, which is what supplies the 9px above the top row and
  // the full width the button is pushed to the right edge of — without it the
  // row is a shrink-to-fit flex item with no free space to justify into, and the
  // button sits on the LEFT.
  const blankStack = document.createElement("div");
  blankStack.className = "nnm-stack";
  const blankHead = document.createElement("div");
  blankHead.className = "nnm-blankhead";
  blankHead.appendChild(makeAboutButton());
  blankStack.appendChild(blankHead);
  wrap.appendChild(blankStack);

  // Polite live region for screen-reader announcements. Call SIM.announce("...")
  // from anywhere in the interactive.
  const liveAnnounce = document.createElement("div");
  liveAnnounce.className = "sr-only";
  liveAnnounce.setAttribute("aria-live", "polite");
  liveAnnounce.setAttribute("aria-atomic", "true");
  wrap.appendChild(liveAnnounce);
  SIM._suppressAnnounce = false;
  SIM.announce = function(msg) {
    if (SIM._suppressAnnounce) return;
    liveAnnounce.textContent = "";
    requestAnimationFrame(() => { liveAnnounce.textContent = msg; });
  };

  // Handles invalidateSimCache() tears down when the sim is switched.
  SIM._timeouts = [];
  SIM._observers = [];
  SIM._rafs = [];

  return wrap;
}

        toggleBtn.style.alignItems = "center";
        toggleBtn.style.justifyContent = "flex-start";

        const toggleIcon = createSVGIcon(doubleArrowIconSVG);
        toggleIcon.classList.add("ap-left-toggle-icon-collapsed");
        toggleBtn.appendChild(toggleIcon);

        const toggleLabel = document.createElement("span");
        toggleLabel.className = "ap-left-toggle-label-collapsed";
        toggleLabel.textContent = "Show";
        toggleBtn.appendChild(toggleLabel);
      }

      function toggleSidebar() {
        sidebarExpanded = !sidebarExpanded;
        buildViewport();
        const newToggle = document.querySelector(".ap-left-toggle");
        if (newToggle) newToggle.focus();
      }
      toggleBtn.addEventListener("click", toggleSidebar);
      toggleBtn.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggleSidebar();
        }
      });

      leftCol.appendChild(toggleBtn);

      // Resources container (fills remaining height)
      if (sidebarExpanded) {
        const resources = document.createElement("div");
        resources.className = "ap-left-resources";

        const resHeader = document.createElement("div");
        resHeader.className = "ap-left-resources-header";
        const resLabel = document.createElement("span");
        resLabel.className = "ap-left-resources-header-label";
        resLabel.textContent = "Instructions";
        resHeader.appendChild(resLabel);
        resources.appendChild(resHeader);

        const resBody = document.createElement("div");
        resBody.className = "ap-left-resources-body";
        resBody.setAttribute("role", "region");
        resBody.setAttribute("aria-label", "Resources content");
        resBody.innerHTML = `<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
          <ul>
            <li>Ut eu eros nec tortor tincidunt consequat eget eu eros.</li>
            <li>Nullam in massa turpis.</li>
            <li>Morbi ut libero nec nibh lacinia mollis.</li>
            <li>Vestibulum vestibulum vestibulum placerat.</li>
          </ul>
          <p>Quisque dictum a justo eget semper. Pellentesque viverra augue a euismod consequat.</p>
          <p>Have fun!</p>`;
        resources.appendChild(resBody);

        leftCol.appendChild(resources);
      }

      apBody.appendChild(leftCol);

      // Right side: header + content (with border)
      const rightSide = document.createElement("div");
      rightSide.className = "ap-right-column";
      rightSide.style.width = (contentW) + "px";

      // AP header (above content only)
      const apHeader = document.createElement("div");
      apHeader.className = "ap-header";
      apHeader.style.height = (AP_HEADER_H) + "px";
      const apLabel = document.createElement("span");
      apLabel.className = "ap-header-label";
      apLabel.textContent = SIMS[activeSim].name;
      apHeader.appendChild(apLabel);
      rightSide.appendChild(apHeader);

      // Content area
      const content = document.createElement("div");
      content.className = "content-area";
      content.setAttribute("role", "main");
      content.style.width = "100%";
      content.style.height = (AP_CONTENT_H) + "px";
      applySimTheme(content);
      { const tb = getSimTitleBar(); if (tb) content.appendChild(tb); }
      const sc2col = getSimContent();
      if (sc2col) content.appendChild(sc2col);

      rightSide.appendChild(content);
      apBody.appendChild(rightSide);
      ap.appendChild(apBody);
    } else {
      // Full-width: border on whole AP container
      ap.style.border = "1px solid #858585";
      ap.style.boxSizing = "content-box";

      const apHeader = document.createElement("div");
      apHeader.className = "ap-header";
      apHeader.style.height = (AP_HEADER_H) + "px";
      const apLabel = document.createElement("span");
      apLabel.className = "ap-header-label";
      apLabel.textContent = SIMS[activeSim].name;
      apHeader.appendChild(apLabel);
      ap.appendChild(apHeader);

      const apBody = document.createElement("div");
      apBody.className = "ap-body";

      // Content area
      const content = document.createElement("div");
      content.className = "content-area";
      content.setAttribute("role", "main");
      content.style.width = (contentW) + "px";
      content.style.height = (AP_CONTENT_H) + "px";
      applySimTheme(content);
      { const tb = getSimTitleBar(); if (tb) content.appendChild(tb); }
      const scFull = getSimContent();
      if (scFull) content.appendChild(scFull);

      apBody.appendChild(content);
      ap.appendChild(apBody);
    }
    page.appendChild(ap);

    // Question containers (below AP on the page)
    if (activeLayout === "ap-full" || activeLayout === "ap-2col") {
      const qRow = document.createElement("div");
      qRow.className = "question-row";
      if (activeLayout === "ap-2col") {
        qRow.style.paddingLeft = "28px";
        qRow.style.paddingRight = "26px";
      }

      [
        { label: "Question #1", text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut eu eros nec tortor tincidunt consequat eget eu eros?" },
        { label: "Question #2", text: "Lorem ipsum dolor sit amet, consectetur adipiscing elit?" }
      ].forEach(q => {
        const qContainer = document.createElement("div");
        qContainer.className = "question-container";

        const qHeader = document.createElement("div");
        qHeader.className = "question-header";
        const qLabel = document.createElement("span");
        qLabel.className = "question-header-label";
        qLabel.textContent = q.label;
        qHeader.appendChild(qLabel);
        qContainer.appendChild(qHeader);

        const qBody = document.createElement("div");
        qBody.className = "question-body";
        qBody.innerHTML = `<div>${q.text}</div><div class="question-input">Please type your answer here.</div>`;
        qContainer.appendChild(qBody);

        qRow.appendChild(qContainer);
      });

      page.appendChild(qRow);
    }
    viewport.appendChild(page);

    // Chromebook + AP: re-measure wrapper and override frame width (matches Standalone logic)
    if (activeDevice === "chromebook") {
      const cbWrapperW = document.querySelector(".viewport-wrapper").clientWidth;
      const cbFrameW = Math.min(device.screenW, cbWrapperW);
      frame.style.width = (cbFrameW) + "px";
      if (cbFrameW < 1100) {
        viewport.style.justifyContent = "flex-start";
      }
    }
  } else if (activeLayout === "standalone" && isNoLimit) {
    // Standalone + Teacher Desktop — gray background, content centered
    const standaloneMax = 1024;
    const standaloneMin = 768;
    const standaloneMargin = 20;
    const standaloneH = 562;

    document.body.style.background = "#ededed";
    document.body.style.paddingRight = "0";
    container.style.alignSelf = "stretch";

    // Measure AFTER stretch so container matches wrapper width
    const fullW = container.clientWidth;
    const standaloneBorder = 4; // 2px border each side, box-sizing: content-box
    const standaloneW = Math.floor(Math.max(standaloneMin, Math.min(standaloneMax, fullW - (standaloneMargin * 2) - standaloneBorder)));
    const ml = standaloneW <= standaloneMin ? standaloneMargin : Math.floor((fullW - standaloneW - standaloneBorder) / 2);

    const topOffset = container.getBoundingClientRect().top;
    const verticalPad = Math.max(0, (window.innerHeight - topOffset - standaloneH) / 2);
    container.style.paddingTop = verticalPad + "px";

    const content = document.createElement("div");
    content.className = "content-area standalone";
    content.setAttribute("role", "main");
    content.style.width = (standaloneW) + "px";
    content.style.height = (standaloneH) + "px";
    content.style.marginLeft = ml + "px";
    applySimTheme(content);
    { const tb = getSimTitleBar(); if (tb) content.appendChild(tb); }
    const scSA1 = getSimContent();
    if (scSA1) content.appendChild(scSA1);

    // Update info line with actual responsive width
    info.innerHTML = `<strong>Teacher Desktop / ${layout.name}</strong><br><strong>Content:</strong> ${standaloneW}w × ${standaloneH}h`;
    if (standaloneW <= standaloneMin) {
      const clipW = standaloneMin + (standaloneMargin * 2) + standaloneBorder; // 812
      info.style.alignSelf = "flex-start";
      info.style.minWidth = clipW + "px";
    }

    container.appendChild(content);
    if (SIM.onResize) SIM.onResize();
    return;
  } else {
    // Standalone with device frame
    const standaloneMax = 1024;
    const standaloneMin = 768;
    const standaloneMargin = 20;
    const contentBorder = 4; // 2px border each side on .content-area.standalone (content-box)
    const wrapperClientW = document.querySelector(".viewport-wrapper").clientWidth;
    const standaloneH = 562;

    let standaloneW, simMarginLeft, frameVisualW;

    if (activeDevice === "chromebook") {
      // Chromebook: frame shrinks with browser, content responsive
      frameVisualW = Math.min(device.screenW, wrapperClientW);
      frame.style.width = (frameVisualW) + "px";

      const shrinkStart = standaloneMax + contentBorder + (standaloneMargin * 2); // 1068
      const clipStart = standaloneMin + contentBorder + (standaloneMargin * 2); // 812

      if (frameVisualW >= shrinkStart) {
        standaloneW = standaloneMax;
        simMarginLeft = null;
      } else if (frameVisualW >= clipStart) {
        standaloneW = frameVisualW - (standaloneMargin * 2) - contentBorder;
        simMarginLeft = standaloneMargin;
      } else {
        standaloneW = standaloneMin;
        simMarginLeft = standaloneMargin;
      }

      // Label freeze when clipping
      if (frameVisualW < clipStart) {
        info.style.alignSelf = "flex-start";
        info.style.minWidth = clipStart + "px";
      }
    } else {
      // iPad/Android: fixed frame, fixed content, no responsiveness
      frameVisualW = device.screenW;
      if (device.screenW <= standaloneMax + contentBorder) {
        standaloneW = device.screenW - (standaloneMargin * 2) - contentBorder;
        simMarginLeft = standaloneMargin;
      } else {
        standaloneW = standaloneMax;
        simMarginLeft = null;
      }

      // Label freeze when frame is clipped by wrapper
      if (wrapperClientW < device.screenW) {
        info.style.alignSelf = "flex-start";
        info.style.minWidth = device.screenW + "px";
      }

      frame.style.boxShadow = "0 2px 12px rgba(0, 0, 0, 0.3)";
    }

    const content = document.createElement("div");
    content.className = "content-area standalone";
    content.setAttribute("role", "main");
    content.style.width = (standaloneW) + "px";
    content.style.height = (standaloneH) + "px";
    applySimTheme(content);
    { const tb = getSimTitleBar(); if (tb) content.appendChild(tb); }
    const scSA2 = getSimContent();
    if (scSA2) content.appendChild(scSA2);

    viewport.style.display = "flex";
    viewport.style.alignItems = "center";
    viewport.style.background = "#ededed";

    if (simMarginLeft !== null) {
      viewport.style.justifyContent = "flex-start";
      content.style.marginLeft = simMarginLeft + "px";
    } else {
      viewport.style.justifyContent = "center";
    }
    viewport.appendChild(content);

    // Update info line
    info.innerHTML = `<strong>${device.name} / ${layout.name}</strong><br><strong>Screen:</strong> ${device.screenW}w × ${device.screenH}h • <strong>Available:</strong> ${frameVisualW}w × ${availH}h • <strong>Content:</strong> ${standaloneW}w × ${standaloneH}h`;
  }

  frame.appendChild(viewport);

  // Bottom chrome
  if (!isNoLimit && device.bottomChrome > 0) {
    const bottom = document.createElement("div");
    bottom.className = "chrome-bottom";
    bottom.style.height = (device.bottomChrome) + "px";
    bottom.setAttribute("data-label", device.bottomLabel);

    frame.appendChild(bottom);
  }

  container.appendChild(frame);
  if (SIM.onResize) SIM.onResize();
}

// Button wiring
function wireToggleGroup(selector, callback) {
  document.querySelectorAll(selector).forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.classList.contains("active")) return;
      if (callback) callback(btn);
      document.querySelectorAll(selector).forEach(b => {
        b.classList.remove("active");
        b.setAttribute("aria-pressed", "false");
      });
      btn.classList.add("active");
      btn.setAttribute("aria-pressed", "true");
      buildViewport();
    });
  });
}

wireToggleGroup("[data-sim]", btn => {
  activeSim = btn.dataset.sim;
  invalidateSimCache();
});
wireToggleGroup("[data-layout]", btn => {
  activeLayout = btn.dataset.layout;
  if (activeLayout === "ap-2col") sidebarExpanded = true;
});
wireToggleGroup("[data-device]", btn => { activeDevice = btn.dataset.device; });

document.getElementById("demo-site-btn").addEventListener("click", () => {
  if (demoMode) {
    demoMode = false;
    exitDemoView();
  } else {
    demoMode = true;
    _savedDevice = activeDevice;
    _savedLayout = activeLayout;
    activeDevice = "none";
    activeLayout = "standalone";
    buildDemoView();
  }
});

// Warm the Lato italic face at startup. It lives in a separate woff2 and is only used by
// late-appearing italic placeholders (e.g. "Max number of trials reached"), so over the
// network it would otherwise download on first render and flash from a wider fallback
// italic. Fetching it now means it's ready before any such label mounts. No-op locally
// (font is already instant) and fully guarded so it can never throw or block startup.
if (document.fonts && document.fonts.load) {
  try { document.fonts.load("italic 16px 'Lato'").catch(function () {}); } catch (e) {}
}

buildViewport();

// Resize handler
let _resizeRafId = null;
function updateStandaloneDeviceFrame() {
  if (_resizeRafId) return; // already scheduled
  _resizeRafId = requestAnimationFrame(() => {
    _resizeRafId = null;
    _updateStandaloneDeviceFrameNow();
  });
}
function _updateStandaloneDeviceFrameNow() {
  const wrapper = document.querySelector(".viewport-wrapper");
  const contentEl = document.querySelector(".content-area.standalone");
  if (!wrapper || !contentEl) return;

  const device = DEVICES[activeDevice];
  if (!device) return;

  const wrapperClientW = wrapper.clientWidth;
  const info = document.getElementById("viewportInfo");

  if (activeDevice !== "chromebook") {
    // iPad/Android: no responsive changes, only label freeze
    if (info) {
      const isClipping = wrapperClientW < device.screenW;
      info.style.alignSelf = isClipping ? "flex-start" : "";
      info.style.minWidth = isClipping ? device.screenW + "px" : "";
    }
    return;
  }

  // Chromebook: full responsive logic
  const contentBorder = 4;
  const margin = 20;
  const standaloneMax = 1024;
  const standaloneMin = 768;
  const availH = device.screenH - device.topChrome - device.bottomChrome;

  const frameVisualW = Math.min(device.screenW, wrapperClientW);
  const frameEl = document.querySelector(".device-frame");
  if (frameEl) {
    frameEl.style.transition = "none";
    frameEl.style.width = frameVisualW + "px";
  }
  contentEl.style.transition = "none";

  const shrinkStart = standaloneMax + contentBorder + (margin * 2); // 1068
  const clipStart = standaloneMin + contentBorder + (margin * 2); // 812

  const viewport = contentEl.parentElement;

  let w;
  if (frameVisualW >= shrinkStart) {
    w = standaloneMax;
    contentEl.style.marginLeft = "";
    if (viewport) viewport.style.justifyContent = "center";
  } else if (frameVisualW >= clipStart) {
    w = frameVisualW - (margin * 2) - contentBorder;
    contentEl.style.marginLeft = margin + "px";
    if (viewport) viewport.style.justifyContent = "flex-start";
  } else {
    w = standaloneMin;
    contentEl.style.marginLeft = margin + "px";
    if (viewport) viewport.style.justifyContent = "flex-start";
  }

  contentEl.style.width = w + "px";
  const layoutName = LAYOUTS[activeLayout] ? LAYOUTS[activeLayout].name : activeLayout;
  if (info) {
    info.innerHTML = '<strong>' + device.name + ' / ' + layoutName + '</strong><br><strong>Screen:</strong> ' + device.screenW + 'w \u00d7 ' + device.screenH + 'h \u2022 <strong>Available:</strong> ' + frameVisualW + 'w \u00d7 ' + availH + 'h \u2022 <strong>Content:</strong> ' + w + 'w \u00d7 562h';
    const isClipping = frameVisualW < clipStart;
    info.style.alignSelf = isClipping ? "flex-start" : "";
    info.style.minWidth = isClipping ? clipStart + "px" : "";
  }
  if (SIM.onResize) SIM.onResize();
}

window.addEventListener("resize", () => {
  // Always update browser width label
  const bwEl = document.getElementById("browserWidthValue");
  const bwWrapper = document.querySelector(".viewport-wrapper");
  if (bwEl && bwWrapper) bwEl.textContent = Math.round(window.innerWidth - bwWrapper.getBoundingClientRect().left) + "px";

  if (demoMode) { buildDemoView(); return; }

  if (activeLayout === "standalone" && activeDevice === "none") {
    // Teacher Desktop — full rebuild (responsive content)
    buildViewport();
  } else if (activeLayout === "standalone" && activeDevice !== "none") {
    // Device frame — lightweight update (no rebuild)
    updateStandaloneDeviceFrame();
  } else if (activeDevice === "chromebook" && activeLayout !== "standalone") {
    // Chromebook + AP layouts — shrink frame, label freeze
    const device = DEVICES[activeDevice];
    const wrapper = document.querySelector(".viewport-wrapper");
    if (device && wrapper) {
      const wrapperW = wrapper.clientWidth;
      const frameVisualW = Math.min(device.screenW, wrapperW);
      const frameEl = document.querySelector(".device-frame");
      if (frameEl) {
        frameEl.style.transition = "none";
        frameEl.style.width = frameVisualW + "px";
      }
      // Pin page to left when frame < 1100, restore centering when wider
      const viewportArea = document.querySelector(".viewport-area");
      if (viewportArea) {
        viewportArea.style.justifyContent = frameVisualW < 1100 ? "flex-start" : "";
      }
      const info = document.getElementById("viewportInfo");
      if (info) {
        const availH = device.screenH - device.topChrome - device.bottomChrome;
        const layoutName = LAYOUTS[activeLayout] ? LAYOUTS[activeLayout].name : activeLayout;
        const contentW = activeLayout === "ap-2col" ? (sidebarExpanded ? AP_CONTENT_W_EXPANDED : AP_CONTENT_W_COLLAPSED) : 1044;
        info.innerHTML = '<strong>' + device.name + ' / ' + layoutName + '</strong><br><strong>Screen:</strong> ' + device.screenW + 'w \u00d7 ' + device.screenH + 'h \u2022 <strong>Available:</strong> ' + frameVisualW + 'w \u00d7 ' + availH + 'h \u2022 <strong>Content:</strong> ' + contentW + 'w \u00d7 ' + AP_CONTENT_H + 'h';
        const isClipping = wrapperW < device.screenW;
        info.style.alignSelf = isClipping ? "flex-start" : "";
        info.style.minWidth = isClipping ? Math.max(frameVisualW, 1100) + "px" : "";
      }
    }
  } else if (activeDevice !== "none" && activeDevice !== "chromebook") {
    // iPad/Android + any layout — label freeze only
    const info = document.getElementById("viewportInfo");
    const device = DEVICES[activeDevice];
    if (info && device) {
      const wrapperW = document.querySelector(".viewport-wrapper").clientWidth;
      const isClipping = wrapperW < device.screenW;
      info.style.alignSelf = isClipping ? "flex-start" : "";
      info.style.minWidth = isClipping ? device.screenW + "px" : "";
    }
  }
  // Let the interactive re-measure at the new size
  if (SIM.onResize) SIM.onResize();
});

</script>
</body>
