        let dropdownIdCounter = 0;
        function buildParentGroup(label, circleEl) {
          const id = "parent-dd-" + (dropdownIdCounter++);
          const group = document.createElement("div");
          group.className = "sim-parent-group";
          const lbl = document.createElement("span");
          lbl.className = "sim-parent-label";
          lbl.id = id + "-label";
          lbl.textContent = label;
          group.appendChild(lbl);

          const dropdown = document.createElement("div");
          dropdown.className = "sim-dropdown";

          // Measure longest option in both Lato and Roboto Condensed (for responsive)
          const measurer = document.createElement("span");
          measurer.style.cssText = "font-family:'Lato',sans-serif;font-size:16px;visibility:hidden;position:absolute;white-space:nowrap;";
          document.body.appendChild(measurer);
          let maxW = 0;
          parentOptions.forEach(opt => {
            measurer.textContent = opt;
            maxW = Math.max(maxW, measurer.offsetWidth);
          });
          measurer.style.fontFamily = "'Roboto Condensed',sans-serif";
          measurer.style.fontWeight = "400";
          let maxWCondensed = 0;
          parentOptions.forEach(opt => {
            measurer.textContent = opt;
            maxWCondensed = Math.max(maxWCondensed, measurer.offsetWidth);
          });
          document.body.removeChild(measurer);
          // width = text + gap(6) + caret(24) + padding(10+10) + border(2+2)
          const triggerW = maxW + 6 + 24 + 20 + 4;
          // condensed: gap(0) + caret(18) + padding(7+5) + border(2+2)
          const triggerWCondensed = maxWCondensed + 0 + 18 + 12 + 4;

          const trigger = document.createElement("div");
          trigger.className = "sim-dropdown-trigger";
          trigger.style.width = triggerW + "px";
          trigger._defaultW = triggerW;
          trigger._latoW = triggerW;
          trigger._condensedW = triggerWCondensed;
          trigger.setAttribute("tabindex", "0");
          trigger.setAttribute("role", "combobox");
          trigger.setAttribute("aria-expanded", "false");
          trigger.setAttribute("aria-haspopup", "listbox");
          trigger.setAttribute("aria-labelledby", id + "-label");
          trigger.setAttribute("aria-controls", id + "-list");

          const triggerText = document.createElement("span");
          triggerText.className = "sim-dropdown-text placeholder";
          triggerText.textContent = "Select\u2026";
          trigger.appendChild(triggerText);
          const caret = createSVGIcon(expandIconSVG);
          caret.classList.add("sim-dropdown-caret");
          trigger.appendChild(caret);
          dropdown.appendChild(trigger);

          const list = document.createElement("div");
          list.className = "sim-dropdown-list";
          list.id = id + "-list";
          list.setAttribute("role", "listbox");
          list.setAttribute("aria-labelledby", id + "-label");

          let focusedIndex = -1;
          const items = [];

          parentOptions.forEach((opt, i) => {
            const item = document.createElement("div");
            item.className = "sim-dropdown-item";
            item.textContent = opt;
            item.setAttribute("role", "option");
            item.setAttribute("aria-selected", "false");
            item.id = id + "-opt-" + i;

            item.addEventListener("click", (e) => {
              e.stopPropagation();
              selectItem(i);
            });
            items.push(item);
            list.appendChild(item);
          });
          dropdown.appendChild(list);

          function selectItem(i) {
            // Don't allow changes if trial is locked
            const trial = SIM.selectedTrial;
            if (SIM.trialState && SIM.trialState[trial] && SIM.trialState[trial].locked) {
              closeDropdown();
              return;
            }
            triggerText.textContent = parentOptions[i];
            triggerText.classList.remove("placeholder");
            items.forEach(it => {
              it.classList.remove("selected");
              it.setAttribute("aria-selected", "false");
              it.style.fontWeight = "";
            });
            items[i].classList.add("selected");
            items[i].setAttribute("aria-selected", "true");
            trigger.setAttribute("aria-activedescendant", items[i].id);
            closeDropdown();
            trigger.focus();
            // Update associated circle with banana tree
            if (circleEl) {
              circleEl.innerHTML = bananaTreeSVG;
              circleEl.style.color = parentColors[parentOptions[i]] || "#45A54A";
            }
            // Update trial state
            if (SIM.trialState && trial) {
              const parentNum = label === "Parent 1" ? "p1" : "p2";
              SIM.trialState[trial][parentNum] = parentOptions[i];
              if (SIM.updateTrialCardLabel) SIM.updateTrialCardLabel(trial);
              if (SIM.updateSimButtons) SIM.updateSimButtons();
            }
          }

          // Expose a way to set this dropdown externally
          dropdown._setSelection = function(value) {
            if (value === null) {
              triggerText.textContent = "Select\u2026";
              triggerText.classList.add("placeholder");
              items.forEach(it => {
                it.classList.remove("selected");
                it.setAttribute("aria-selected", "false");
                it.style.fontWeight = "";
              });
              if (circleEl) {
                circleEl.innerHTML = "";
                circleEl.style.color = "";
              }
            } else {
              const idx = parentOptions.indexOf(value);
              if (idx >= 0) {
                triggerText.textContent = parentOptions[idx];
                triggerText.classList.remove("placeholder");
                items.forEach(it => {
                  it.classList.remove("selected");
                  it.setAttribute("aria-selected", "false");
                  it.style.fontWeight = "";
                });
                items[idx].classList.add("selected");
                items[idx].setAttribute("aria-selected", "true");
                if (circleEl) {
                  circleEl.innerHTML = bananaTreeSVG;
                  circleEl.style.color = parentColors[parentOptions[idx]] || "#45A54A";
                }
              }
            }
          };
          dropdown._parentLabel = label;
          dropdown._lock = function() {
            dropdown.classList.add("locked");
            group.classList.add("locked");
            trigger.removeAttribute("tabindex");
            trigger.removeAttribute("role");
            trigger.removeAttribute("aria-expanded");
            trigger.removeAttribute("aria-haspopup");
            trigger.removeAttribute("aria-controls");
            trigger.removeAttribute("aria-activedescendant");
            trigger.style.width = "";
            trigger.style.padding = "";
            trigger.style.gap = "";
            trigger.style.fontWeight = "";
            dropdown.style.fontFamily = "";
            dropdown.insertBefore(lbl, trigger);
          };
          dropdown._unlock = function() {
            dropdown.classList.remove("locked");
            group.classList.remove("locked");
            trigger.setAttribute("tabindex", "0");
            trigger.setAttribute("role", "combobox");
            trigger.setAttribute("aria-expanded", "false");
            trigger.setAttribute("aria-haspopup", "listbox");
            trigger.setAttribute("aria-controls", id + "-list");
            trigger.style.width = triggerW + "px";
            group.insertBefore(lbl, dropdown);
          };

          function openDropdown(fromKeyboard) {
            document.querySelectorAll(".sim-dropdown.open").forEach(d => {
              d.classList.remove("open");
              d.querySelector(".sim-dropdown-trigger").setAttribute("aria-expanded", "false");
            });
            dropdown.classList.add("open");
            trigger.setAttribute("aria-expanded", "true");
            if (fromKeyboard) {
              focusedIndex = items.findIndex(it => it.classList.contains("selected"));
              if (focusedIndex < 0) focusedIndex = 0;
              updateFocus();
            } else {
              focusedIndex = -1;
              items.forEach(it => it.classList.remove("focused"));
            }
          }

          function closeDropdown() {
            dropdown.classList.remove("open");
            trigger.setAttribute("aria-expanded", "false");
            trigger.removeAttribute("aria-activedescendant");
            items.forEach(it => it.classList.remove("focused"));
            focusedIndex = -1;
          }

          function updateFocus() {
            items.forEach(it => it.classList.remove("focused"));
            if (focusedIndex >= 0 && focusedIndex < items.length) {
              items[focusedIndex].classList.add("focused");
              trigger.setAttribute("aria-activedescendant", items[focusedIndex].id);
              items[focusedIndex].scrollIntoView({ block: "nearest" });
            }
          }

          trigger.addEventListener("click", (e) => {
            e.stopPropagation();
            if (dropdown.classList.contains("locked")) return;
            if (dropdown.classList.contains("open")) closeDropdown();
            else openDropdown();
          });

          trigger.addEventListener("keydown", (e) => {
            if (dropdown.classList.contains("locked")) return;
            const isOpen = dropdown.classList.contains("open");
            switch (e.key) {
              case "Enter":
              case " ":
                e.preventDefault();
                if (isOpen && focusedIndex >= 0) selectItem(focusedIndex);
                else openDropdown(true);
                break;
              case "ArrowDown":
                e.preventDefault();
                if (!isOpen) { openDropdown(true); break; }
                focusedIndex = (focusedIndex + 1) % items.length;
                updateFocus();
                break;
              case "ArrowUp":
                e.preventDefault();
                if (!isOpen) { openDropdown(true); break; }
                focusedIndex = (focusedIndex - 1 + items.length) % items.length;
                updateFocus();
                break;
              case "Home":
                e.preventDefault();
                if (isOpen) { focusedIndex = 0; updateFocus(); }
                break;
              case "End":
                e.preventDefault();
                if (isOpen) { focusedIndex = items.length - 1; updateFocus(); }
                break;
              case "Escape":
                e.preventDefault();
                closeDropdown();
                break;
              case "Tab":
                closeDropdown();
                break;
              default:
                // Type-ahead: jump to first item starting with typed letter
                if (isOpen && e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                  const ch = e.key.toLowerCase();
                  const idx = items.findIndex(it => it.textContent.toLowerCase().startsWith(ch));
                  if (idx >= 0) { focusedIndex = idx; updateFocus(); }
                }
                break;
            }
          });

          group.appendChild(dropdown);
          return group;
        }

        // Close dropdowns when clicking outside
        if (SIM.closeDropdownsHandler) document.removeEventListener("click", SIM.closeDropdownsHandler);
        SIM.closeDropdownsHandler = () => {
          document.querySelectorAll(".sim-dropdown.open").forEach(d => {
            d.classList.remove("open");
            const trig = d.querySelector(".sim-dropdown-trigger");
            trig.setAttribute("aria-expanded", "false");
            trig.removeAttribute("aria-activedescendant");
          });
        };
        document.addEventListener("click", SIM.closeDropdownsHandler);

        // Left circle
        const circle1 = document.createElement("div");
        circle1.className = "sim-parent-circle";
        circle1.setAttribute("aria-hidden", "true");

        // Left dropdown
        parents.appendChild(buildParentGroup("Parent 1", circle1));

        parents.appendChild(circle1);

        // Cross symbol
        const cross = document.createElement("span");
        cross.className = "sim-cross-symbol";
        cross.textContent = "\u00d7";
        cross.setAttribute("aria-hidden", "true");
        parents.appendChild(cross);

        // Right circle
        const circle2 = document.createElement("div");
        circle2.className = "sim-parent-circle";
        circle2.setAttribute("aria-hidden", "true");
        parents.appendChild(circle2);

        // Right dropdown
        const parent2Group = buildParentGroup("Parent 2", circle2);
        parents.appendChild(parent2Group);

        // Sync dropdowns when switching trials
        SIM.syncDropdownsToTrial = function(letter) {
          const st = SIM.trialState[letter];
          parents.querySelectorAll(".sim-dropdown").forEach(d => {
            if (d._parentLabel === "Parent 1") {
              d._setSelection(st.p1);
            } else if (d._parentLabel === "Parent 2") {
              d._setSelection(st.p2);
            }
            if (st.locked) d._lock(); else d._unlock();
          });
          updateCircleSize();
        };

        function updateCircleSize() {
          const pw = parents.clientWidth;
          const triggers = parents.querySelectorAll(".sim-dropdown-trigger");
          const t0 = triggers[0];
          if (!t0) return;
          const latoW = t0._latoW;
          const condensedW = t0._condensedW;
          const crossW = 24;
          const minGap = 5;
          const fullGap = 10;

          // Phase 1: try Lato-width dropdowns, shrink circles
          const availLato = pw - (latoW * 2) - crossW - (fullGap * 4);
          const szLato = Math.max(CIRCLE_MIN, Math.min(CIRCLE_MAX, Math.floor(availLato / 2)));

          if (szLato > CIRCLE_MIN) {
            const t = (szLato - CIRCLE_MIN) / (CIRCLE_MAX - CIRCLE_MIN);
            const gap = Math.max(minGap, Math.round(minGap + t * (fullGap - minGap)));
            const crossFontSize = Math.round(20 + t * (24 - 20));
            parents.style.gap = gap + "px";
            cross.style.fontSize = crossFontSize + "px";
            parents.querySelectorAll(".sim-parent-group").forEach(g => { g.style.flex = ""; });
            triggers.forEach(tr => {
              const dd = tr.closest(".sim-dropdown");
              if (dd.classList.contains("locked")) return;
              tr.style.width = tr._defaultW + "px";
              tr.style.padding = "";
              tr.style.gap = "";
              const caret = tr.querySelector(".sim-dropdown-caret");
              if (caret) { caret.style.width = ""; caret.style.height = ""; }
              tr.style.fontWeight = "";
              dd.style.fontFamily = "";
              const selItem = dd.querySelector(".sim-dropdown-item.selected");
              if (selItem) selItem.style.fontWeight = "";
            });
            circle1.style.width = szLato + "px"; circle1.style.height = szLato + "px";
            circle2.style.width = szLato + "px"; circle2.style.height = szLato + "px";
            return;
          }

          // Phase 2: circles at minimum (42px) — switch to Roboto Condensed, use min gap
          parents.style.gap = minGap + "px";
          cross.style.fontSize = "20px";
          parents.querySelectorAll(".sim-parent-group").forEach(g => {
            g.style.flex = g.classList.contains("locked") ? "" : "none";
          });
          circle1.style.width = CIRCLE_MIN + "px"; circle1.style.height = CIRCLE_MIN + "px";
          circle2.style.width = CIRCLE_MIN + "px"; circle2.style.height = CIRCLE_MIN + "px";

          // Space available for the two dropdowns after circles, cross, and gaps are placed
          const fixedSpace = CIRCLE_MIN * 2 + crossW + (minGap * 4);
          const ddBudget = Math.floor((pw - fixedSpace) / 2);
          const ddW = Math.max(condensedW, Math.min(latoW, ddBudget));

          const useCondensed = ddW < latoW;
          const ddT = latoW > condensedW ? (ddW - condensedW) / (latoW - condensedW) : 0;
          triggers.forEach(t => {
            const dd = t.closest(".sim-dropdown");
            if (dd.classList.contains("locked")) {
              return;
            }
            const ddPadL = Math.round(7 + ddT * (10 - 7));
            const ddPadR = Math.round(5 + ddT * (10 - 5));
            const ddGap = Math.round(0 + ddT * (6 - 0));
            const caretSize = Math.round(18 + ddT * (24 - 18));
            t.style.width = ddW + "px";
            t.style.padding = "8px " + ddPadR + "px 8px " + ddPadL + "px";
            t.style.gap = ddGap + "px";
            const caret = t.querySelector(".sim-dropdown-caret");
            if (caret) { caret.style.width = caretSize + "px"; caret.style.height = caretSize + "px"; }
            t.style.fontWeight = useCondensed ? "500" : "";
            dd.style.fontFamily = useCondensed ? "'Roboto Condensed',sans-serif" : "";
            const selItem = dd.querySelector(".sim-dropdown-item.selected");
            if (selItem) selItem.style.fontWeight = useCondensed ? "500" : "";
          });
          const fungusLabel = statsLabel ? statsLabel.querySelector(".fungus-active-label") : null;
          if (fungusLabel) { fungusLabel.style.fontFamily = useCondensed ? "'Roboto Condensed',sans-serif" : ""; fungusLabel.style.fontWeight = useCondensed ? "500" : ""; }
          const condensedFont = useCondensed ? "'Roboto Condensed',sans-serif" : "";
          document.querySelectorAll(".fungus-divider-label").forEach(el => { el.style.fontFamily = condensedFont; el.style.fontWeight = useCondensed ? "500" : ""; });
        }
        SIM.updateCircleSize = updateCircleSize;

        inner.appendChild(parents);

        // Stats label straddling the border between parents and offspring
        const statsWrap = document.createElement("div");
        statsWrap.className = "sim-stats-wrap";
        const statsLabel = document.createElement("div");
        statsLabel.className = "sim-stats";
        statsLabel.innerHTML = "Select two parents to begin";
        statsWrap.style.display = "none";
        statsWrap.appendChild(statsLabel);
        inner.appendChild(statsWrap);

        // Middle: Offspring section (scrollable)
        const offspring = document.createElement("div");
        offspring.className = "sim-offspring";
        offspring.setAttribute("role", "region");
        offspring.setAttribute("aria-label", "Offspring");
        function updateOffspringTabindex() {
          if (offspring.scrollHeight > offspring.clientHeight) {
            offspring.setAttribute("tabindex", "0");
          } else {
            offspring.removeAttribute("tabindex");
          }
        }
        const placeholder = document.createElement("div");
        placeholder.className = "sim-offspring-placeholder";
        placeholder.innerHTML = "Each cross will produce 5\u201320 offspring.";
        placeholder.style.display = "none";
        offspring.appendChild(placeholder);

        function updateStatsLabel() {
          const trial = SIM.selectedTrial;
          const st = SIM.trialState[trial];
          if (!st || !st.p1 || !st.p2) {
            statsWrap.style.display = "none";
            parents.classList.remove("has-stats");
            return;
          }
          statsWrap.style.display = "";
          parents.classList.add("has-stats");
          if (st.p1 && st.p2 && st.crosses.length === 0) {
            let text;
            if (st.fungusAfterCross !== null) {
              text = "Cross plants to see their offspring · <b class='fungus-active-label' style='color:#1A3C8F'>Fungus active</b>";
            } else {
              text = "Click <b>Cross Plants</b> to see their offspring";
            }
            statsLabel.innerHTML = text;
            const ph = offspring.querySelector(".sim-offspring-placeholder");
            if (ph) ph.style.display = "";
            return;
          }
          const crosses = st.crosses.length;
          const total = st.crosses.reduce((sum, gen) => sum + gen.length, 0);
          let text = "Crosses: <b>" + crosses + "</b> · Offspring: <b>" + total + "</b>";
          if (st.fungusAfterCross !== null) text += " · <b class='fungus-active-label' style='color:#1A3C8F'>Fungus active</b>";
          statsLabel.innerHTML = text;
        }
        SIM.updateStatsLabel = updateStatsLabel;

        const offspringWrap = document.createElement("div");
        offspringWrap.className = "sim-offspring-wrap";
        offspringWrap.appendChild(offspring);
        const offspringFocusRing = document.createElement("div");
        offspringFocusRing.className = "scroll-focus-ring";
        offspringWrap.appendChild(offspringFocusRing);
        inner.appendChild(offspringWrap);
        requestAnimationFrame(updateOffspringTabindex);

        // Track selected cross per trial
        SIM.selectedCross = {};

        // Render offspring for a given trial
        function updateCrossRowTabindex() {
          const rows = Array.from(offspring.querySelectorAll(".cross-row"));
          if (rows.length === 0) return;
          const trial = SIM.selectedTrial;
          const selIdx = SIM.selectedCross[trial];
          // If a row is selected, it gets tabindex="0"; otherwise first row does
          const activeIdx = (selIdx !== null && selIdx >= 0 && selIdx < rows.length) ? selIdx : 0;
          rows.forEach((r, i) => r.setAttribute("tabindex", i === activeIdx ? "0" : "-1"));
        }

        function renderOffspring(trial) {
          const st = SIM.trialState[trial];
          if (trial !== SIM.selectedTrial) return;
          offspring.innerHTML = "";
          if (!st || (st.crosses.length === 0 && st.fungusAfterCross === null)) {
            offspring.classList.remove("has-plants");
            const ph = document.createElement("div");
            ph.className = "sim-offspring-placeholder";
            ph.innerHTML = "Each cross will produce 5\u201320 offspring.";
            if (st && st.p1 && st.p2) ph.style.display = "";
            else ph.style.display = "none";
            offspring.appendChild(ph);
            SIM.selectedCross[trial] = null;
            requestAnimationFrame(updateOffspringTabindex);
            return;
          }
          offspring.classList.add("has-plants");

          // Fungus introduced before any crosses
          if (st.fungusAfterCross === 0) {
            const divider = document.createElement("div");
            divider.className = "fungus-divider";
            const dlbl = document.createElement("span");
            dlbl.className = "fungus-divider-label";
            dlbl.innerHTML = fungusAddedSVG + "Fungus introduced before crossing";
            divider.appendChild(dlbl);
            offspring.appendChild(divider);
          }

          st.crosses.forEach((crossPlants, gi) => {
            // Insert fungus divider after the cross it was introduced
            if (st.fungusAfterCross !== null && st.fungusAfterCross > 0 && gi === st.fungusAfterCross) {
              const divider = document.createElement("div");
              divider.className = "fungus-divider";
              const dlbl = document.createElement("span");
              dlbl.className = "fungus-divider-label";
              dlbl.innerHTML = fungusAddedSVG + "Fungus introduced after C" + st.fungusAfterCross;
              divider.appendChild(dlbl);
              offspring.appendChild(divider);
            }

            const row = document.createElement("div");
            row.className = "cross-row";
            row.setAttribute("role", "button");
            const crossInf = crossPlants.filter(p => p.infected).length;
            const crossH = crossPlants.length - crossInf;
            row.setAttribute("aria-label", "Cross " + (gi + 1) + ", " + crossPlants.length + " offspring, " + crossH + " healthy, " + crossInf + " infected");
            // Roving tabindex: only selected row (or first row) gets tabindex="0"
            const isSelected = SIM.selectedCross[trial] === gi;
            if (isSelected) row.classList.add("selected");
            row.setAttribute("tabindex", "-1");
            row.addEventListener("click", () => {
              if (SIM.selectedCross[trial] === gi) {
                SIM.selectedCross[trial] = null;
              } else {
                SIM.selectedCross[trial] = gi;
              }
              const rows = offspring.querySelectorAll(".cross-row");
              rows.forEach((r, ri) => {
                r.classList.toggle("selected", SIM.selectedCross[trial] === ri);
                r.setAttribute("aria-pressed", SIM.selectedCross[trial] === ri ? "true" : "false");
              });
              // Update roving tabindex
              updateCrossRowTabindex();
              if (SIM.updateDataPanel) SIM.updateDataPanel();
              // Announce chart data to screen readers
              if (SIM.announce) {
                const sel = SIM.selectedCross[trial];
                if (sel !== null && sel !== undefined) {
                  const cp = st.crosses[sel];
                  const inf = cp.filter(p => p.infected).length;
                  const h = cp.length - inf;
                  const hP = Math.round((h / cp.length) * 100);
                  const iP = 100 - hP;
                  SIM.announce("Cross " + (sel + 1) + ": " + hP + "% healthy, " + iP + "% infected");
                } else {
                  SIM.announce("All crosses selected");
                }
              }
            });
            row.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                row.click();
              } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                e.preventDefault();
                const rows = Array.from(offspring.querySelectorAll(".cross-row"));
                const cur = rows.indexOf(row);
                const next = e.key === "ArrowDown"
                  ? (cur + 1) % rows.length
                  : (cur - 1 + rows.length) % rows.length;
                rows[cur].setAttribute("tabindex", "-1");
                rows[next].setAttribute("tabindex", "0");
                rows[next].focus({ preventScroll: true });
                scrollItemIntoView(rows[next], offspring);
              } else if (e.key === "Home") {
                e.preventDefault();
                const rows = Array.from(offspring.querySelectorAll(".cross-row"));
                rows.forEach(r => r.setAttribute("tabindex", "-1"));
                rows[0].setAttribute("tabindex", "0");
                rows[0].focus({ preventScroll: true });
                scrollItemIntoView(rows[0], offspring);
              } else if (e.key === "End") {
                e.preventDefault();
                const rows = Array.from(offspring.querySelectorAll(".cross-row"));
                rows.forEach(r => r.setAttribute("tabindex", "-1"));
                rows[rows.length - 1].setAttribute("tabindex", "0");
                rows[rows.length - 1].focus({ preventScroll: true });
                scrollItemIntoView(rows[rows.length - 1], offspring);
              }
            });
            row.setAttribute("aria-pressed", isSelected ? "true" : "false");
            const lbl = document.createElement("div");
            lbl.className = "cross-label";
            lbl.setAttribute("aria-hidden", "true");
            lbl.innerHTML = "C" + (gi + 1) + "<br><span style='font-weight:400'>(" + crossPlants.length + ")</span>";
            row.appendChild(lbl);
            const plantsWrap = document.createElement("div");
            plantsWrap.className = "cross-plants";
            crossPlants.forEach(pl => {
              const cell = document.createElement("div");
              cell.className = "offspring-plant";
              cell.setAttribute("aria-hidden", "true");
              if (pl.infected) {
                cell.classList.add("infected");
                cell.innerHTML = bananaTreeInfectedSVG;
              } else {
                cell.innerHTML = bananaTreeSVG;
              }
              plantsWrap.appendChild(cell);
            });
            row.appendChild(plantsWrap);
            offspring.appendChild(row);
          });

          // Set initial roving tabindex
          updateCrossRowTabindex();

          // Max crosses label after C10
          if (st.crosses.length >= MAX_CROSSES) {
            const maxLabel = document.createElement("div");
            maxLabel.className = "sim-offspring-placeholder";
            maxLabel.textContent = "Max number of crosses reached";
            maxLabel.style.margin = "6px 0";
            maxLabel.style.padding = "2px 0";
            offspring.appendChild(maxLabel);
          }

          // Fungus divider at the end if introduced after last cross
          if (st.fungusAfterCross !== null && st.fungusAfterCross === st.crosses.length && st.crosses.length > 0) {
            const divider = document.createElement("div");
            divider.className = "fungus-divider";
            const dlbl = document.createElement("span");
            dlbl.className = "fungus-divider-label";
            dlbl.innerHTML = fungusAddedSVG + "Fungus introduced after C" + st.fungusAfterCross;
            divider.appendChild(dlbl);
            offspring.appendChild(divider);
          }

          // Scroll position set by caller when needed
          requestAnimationFrame(updateOffspringTabindex);
        }
        SIM.renderOffspring = renderOffspring;

        // Bottom: Buttons
        const buttons = document.createElement("div");
        buttons.className = "sim-buttons";
        ["Cross Plants", "Introduce Fungus", "Reset Trial"].forEach(label => {
          const btn = document.createElement("button");
          btn.className = "sim-btn";
          const iconMap = {
            "Cross Plants": crossIconSVG,
            "Introduce Fungus": addFungusIconSVG,
            "Reset Trial": resetIconSVG
          };
          if (iconMap[label]) {
            const icon = createSVGIcon(iconMap[label]);
            btn.appendChild(icon);
            const span = document.createElement("span");
            span.className = "sim-btn-label";
            span.textContent = label;
            btn.appendChild(span);
          } else {
            btn.textContent = label;
          }
          if (label === "Cross Plants") {
            btn.setAttribute("aria-disabled", "true");
            SIM.crossBtn = btn;
            btn.addEventListener("click", () => {
              if (btn.getAttribute("aria-disabled") === "true") return;
              const trial = SIM.selectedTrial;
              const st = SIM.trialState[trial];
              if (st && st.p1 && st.p2 && st.crosses.length < MAX_CROSSES) {
                const wasUnlocked = !st.locked;
                st.locked = true;
                // Lock dropdowns
                parents.querySelectorAll(".sim-dropdown").forEach(d => d._lock());
                const count = OFFSPRING_MIN + Math.floor(Math.random() * (OFFSPRING_MAX - OFFSPRING_MIN + 1));
                const isFungusActive = st.fungusAfterCross !== null && st.crosses.length >= st.fungusAfterCross;
                // Mendelian genetics: R = resistant (dominant), r = susceptible (recessive)
                const genotypes = {
                  "Wild W1": ["R", "r"],
                  "Wild W2": ["R", "R"],
                  "Wild W3": ["R", "r"],
                  "Cavendish C1": ["r", "r"],
                  "Cavendish C2": ["r", "r"]
                };
                const g1 = genotypes[st.p1];
                const g2 = genotypes[st.p2];
                const plants = [];
                for (let p = 0; p < count; p++) {
                  const a1 = g1[Math.floor(Math.random() * 2)];
                  const a2 = g2[Math.floor(Math.random() * 2)];
                  const isResistant = a1 === "R" || a2 === "R";
                  plants.push({ infected: isFungusActive && !isResistant, genotype: a1 + a2 });
                }
                st.crosses.push(plants);
                const healthy = plants.filter(p => !p.infected).length;
                const infected = plants.filter(p => p.infected).length;
                let crossMsg = "Cross " + st.crosses.length + ": " + plants.length + " offspring, " + healthy + " healthy, " + infected + " infected.";
                if (wasUnlocked) crossMsg += " Parents locked.";
                if (SIM.announce) SIM.announce(crossMsg);
                if (SIM.updateTrialCardLabel) SIM.updateTrialCardLabel(trial);
                renderOffspring(trial);
                offspring.scrollTop = offspring.scrollHeight;
                SIM.updateSimButtons();
              }
            });
          }
          if (label === "Introduce Fungus") {
            btn.classList.add("sim-btn-fungus");
            btn.setAttribute("aria-disabled", "true");
            SIM.fungusBtn = btn;
            btn.addEventListener("click", () => {
              if (btn.getAttribute("aria-disabled") === "true") return;
              const trial = SIM.selectedTrial;
              const st = SIM.trialState[trial];
              if (st && st.fungusAfterCross === null) {
                st.fungusAfterCross = st.crosses.length;
                if (SIM.announce) SIM.announce("Fungus introduced.");
                if (SIM.updateTrialCardLabel) SIM.updateTrialCardLabel(trial);
                renderOffspring(trial);
                offspring.scrollTop = offspring.scrollHeight;
                SIM.updateSimButtons();
                if (SIM.updateDataPanel) SIM.updateDataPanel();
              }
            });
          }
          if (label === "Reset Trial") {
            btn.setAttribute("aria-disabled", "true");
            SIM.resetBtn = btn;
            btn.addEventListener("click", () => {
              if (btn.getAttribute("aria-disabled") === "true") return;
              const trial = SIM.selectedTrial;
              if (SIM.trialState[trial]) {
                SIM.trialState[trial] = { p1: null, p2: null, locked: false, crosses: [], fungusAfterCross: null };
                if (SIM.updateTrialCardLabel) SIM.updateTrialCardLabel(trial);
                if (SIM.syncDropdownsToTrial) SIM.syncDropdownsToTrial(trial);
                renderOffspring(trial);
                SIM.updateSimButtons();
                if (SIM.announce) SIM.announce("Trial " + trial + " reset.");
              }
            });
          }
          buttons.appendChild(btn);
        });
        inner.appendChild(buttons);

        // Update button disabled states based on current trial
        SIM.updateSimButtons = function() {
          const trial = SIM.selectedTrial;
          const st = SIM.trialState[trial];
          if (!st) return;
          // Cross Plants: enabled only when both parents selected
          if (SIM.crossBtn) SIM.crossBtn.setAttribute("aria-disabled", (!(st.p1 && st.p2) || st.crosses.length >= MAX_CROSSES) ? "true" : "false");
          // Introduce Fungus: enabled when both parents selected, not already introduced, and under MAX_CROSSES (by design)
          if (SIM.fungusBtn) {
            if (st.fungusAfterCross !== null) {
              SIM.fungusBtn.setAttribute("aria-disabled", "true");
            } else {
              SIM.fungusBtn.setAttribute("aria-disabled", (!(st.p1 && st.p2) || st.crosses.length >= MAX_CROSSES) ? "true" : "false");
            }
          }
          // Reset Trial: enabled when at least one parent selected
          if (SIM.resetBtn) SIM.resetBtn.setAttribute("aria-disabled", (!(st.p1 || st.p2 || st.crosses.length > 0)) ? "true" : "false");
          // Update stats label and data panel
          updateStatsLabel();
          if (SIM.updateDataPanel) SIM.updateDataPanel();
        };

        panel.appendChild(inner);
      }

      // Data panel content
      if (p.name === "Data") {
        const dataInner = document.createElement("div");
        dataInner.className = "data-panel-inner";

        // --- Top half: Pie Chart ---
        const topHalf = document.createElement("div");
        topHalf.className = "data-half pie-chart";
        const pieTitle = document.createElement("div");
        pieTitle.className = "data-chart-title";
        pieTitle.textContent = "Offspring Phenotypes:";
        topHalf.appendChild(pieTitle);
        const piePill = document.createElement("span");
        piePill.className = "data-chart-pill";
        piePill.textContent = "All Crosses";
        const pillClose = document.createElement("button");
        pillClose.className = "pill-close";
        pillClose.innerHTML = '<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><polygon fill="currentColor" fill-rule="nonzero" points="16.0104076 5.40380592 11.4142136 10 16.0104076 14.5961941 14.5961941 16.0104076 10 11.4142136 5.40380592 16.0104076 3.98959236 14.5961941 8.58578644 10 3.98959236 5.40380592 5.40380592 3.98959236 10 8.58578644 14.5961941 3.98959236"/></svg>';
        pillClose.setAttribute("aria-label", "Deselect cross, show all crosses");
        pillClose.addEventListener("click", (e) => {
          e.stopPropagation();
          const trial = SIM.selectedTrial;
          const prevIdx = SIM.selectedCross ? SIM.selectedCross[trial] : null;
          if (SIM.selectedCross) SIM.selectedCross[trial] = null;
          if (SIM.renderOffspring) SIM.renderOffspring(trial);
          if (SIM.updateDataPanel) SIM.updateDataPanel();
          if (prevIdx !== null && prevIdx !== undefined) {
            const rows = document.querySelectorAll(".cross-row");
            const target = rows[prevIdx] || rows[0];
            if (target) target.focus();
          }
        });
        piePill.appendChild(pillClose);
        piePill.addEventListener("click", () => {
          const trial = SIM.selectedTrial;
          const selCross = SIM.selectedCross ? SIM.selectedCross[trial] : null;
          if (selCross === null || selCross === undefined) return;
          const rows = document.querySelectorAll(".cross-row");
          const target = rows[selCross];
          if (!target) return;
          const container = target.closest(".sim-offspring");
          if (!container) return;
          const cs = getComputedStyle(container);
          const padTop = parseFloat(cs.paddingTop);
          const padBottom = parseFloat(cs.paddingBottom);
          const cRect = container.getBoundingClientRect();
          const tRect = target.getBoundingClientRect();
          if (tRect.top < cRect.top + padTop) {
            container.scrollBy({ top: tRect.top - cRect.top - padTop, behavior: "smooth" });
          } else if (tRect.bottom > cRect.bottom - padBottom) {
            container.scrollBy({ top: tRect.bottom - cRect.bottom + padBottom, behavior: "smooth" });
          }
        });
        topHalf.appendChild(piePill);
        const pieChartBody = document.createElement("div");
        pieChartBody.className = "data-chart-body";
        const pieCanvas = document.createElement("canvas");
        pieCanvas.width = 160 * (window.devicePixelRatio || 1);
        pieCanvas.height = 100 * (window.devicePixelRatio || 1);
        pieCanvas.style.width = "160px";
        pieCanvas.style.height = "100px";
        pieCanvas.setAttribute("role", "img");
        pieCanvas.setAttribute("aria-label", "Pie chart showing offspring phenotype percentages");
        pieChartBody.appendChild(pieCanvas);
        topHalf.appendChild(pieChartBody);
        const pieLegend = document.createElement("div");
        pieLegend.className = "data-chart-legend";
        pieLegend.innerHTML =
          '<span class="data-legend-item">' +
            '<span class="data-legend-label"><span class="data-legend-swatch" style="background:#3D9441"></span>Healthy</span>' +
            '<span class="data-legend-pct" id="pie-pct-healthy">\u2013</span>' +
          '</span>' +
          '<span class="data-legend-item">' +
            '<span class="data-legend-label"><span class="data-legend-swatch" style="background:#502600"></span>Infected</span>' +
            '<span class="data-legend-pct" id="pie-pct-infected">\u2013</span>' +
          '</span>';
        topHalf.appendChild(pieLegend);
        dataInner.appendChild(topHalf);

        // Divider
        const divider = document.createElement("div");
        divider.className = "data-divider";
        dataInner.appendChild(divider);

        // --- Bottom half: Bar Chart ---
        const bottomHalf = document.createElement("div");
        bottomHalf.className = "data-half bar-chart";
        const barTitle = document.createElement("div");
        barTitle.className = "data-chart-title";
        barTitle.innerHTML = "<span style='white-space:nowrap'>Fungus Resistance</span> over<br>All Crosses";
        bottomHalf.appendChild(barTitle);
        const barChartBody = document.createElement("div");
        barChartBody.className = "data-chart-body";
        const barCanvas = document.createElement("canvas");
        barCanvas.style.width = "100%";
        barCanvas.style.height = "158px";
        barCanvas.setAttribute("role", "img");
        barCanvas.setAttribute("aria-label", "Bar chart showing fungus resistance over crosses");
        barChartBody.appendChild(barCanvas);
        const barTable = document.createElement("table");
        barTable.className = "sr-only";
        barTable.setAttribute("aria-label", "Fungus resistance data by cross");
        barChartBody.appendChild(barTable);
        bottomHalf.appendChild(barChartBody);
        const barLegend = document.createElement("div");
        barLegend.className = "data-chart-legend";
        barLegend.innerHTML =
          '<span class="data-legend-item">' +
            '<span class="data-legend-label"><span class="data-legend-swatch" style="background:#3D9441"></span>Healthy</span>' +
          '</span>' +
          '<span class="data-legend-item">' +
            '<span class="data-legend-label"><span class="data-legend-swatch" style="background:#502600"></span>Infected</span>' +
          '</span>';
        bottomHalf.appendChild(barLegend);
        dataInner.appendChild(bottomHalf);

        panel.appendChild(dataInner);

        // --- Data update function ---
        SIM.updateDataPanel = function() {
          if (SIM.updateCircleSize) SIM.updateCircleSize();
          // Adjust legend gaps based on panel width
          const panelW = panel.clientWidth;
          const gapVal = Math.max(4, Math.min(20, Math.round((panelW - 150) * (20 - 4) / (285 - 150) + 4)));
          pieLegend.style.gap = gapVal + "px";
          barLegend.style.gap = gapVal + "px";
          if (panelW < 230) {
            barTitle.innerHTML = "Fungus Resistance<br>over All Crosses";
          } else {
            barTitle.innerHTML = "Fungus Resistance over<br>All Crosses";
          }

          const trial = SIM.selectedTrial;
          const st = SIM.trialState[trial];
          if (!st) return;
          const selCross = SIM.selectedCross ? SIM.selectedCross[trial] : null;
          const hasSelection = selCross !== null && selCross !== undefined && st.crosses[selCross];
          const aboutBtn = document.querySelector(".sim-info-btn");
          if (aboutBtn) {
            aboutBtn.classList.toggle("compact-hit", !!hasSelection);
          }

          // Compute stats
          let plants = [];
          if (hasSelection) {
            plants = st.crosses[selCross];
            piePill.innerHTML = "C" + (selCross + 1) + "&nbsp;<span style='font-weight:400'>(" + plants.length + " offspring)</span>";
            piePill.appendChild(pillClose);
            piePill.classList.add("active");
          } else if (st.crosses.length > 0) {
            plants = st.crosses.flat();
            piePill.textContent = "All Crosses";
            piePill.appendChild(pillClose);
            piePill.classList.remove("active");
          } else {
            piePill.textContent = "All Crosses";
            piePill.appendChild(pillClose);
            piePill.classList.remove("active");
          }

          const total = plants.length;
          const infected = plants.filter(p => p.infected).length;
          const healthy = total - infected;

          // Update legend percentages
          const pctHealthyEl = document.getElementById("pie-pct-healthy");
          const pctInfectedEl = document.getElementById("pie-pct-infected");
          if (total === 0) {
            if (pctHealthyEl) pctHealthyEl.textContent = "\u2013";
            if (pctInfectedEl) pctInfectedEl.textContent = "\u2013";
          } else {
            const hPct = Math.round((healthy / total) * 100);
            const iPct = 100 - hPct;
            if (pctHealthyEl) pctHealthyEl.textContent = hPct + "%";
            if (pctInfectedEl) pctInfectedEl.textContent = iPct + "%";
          }

          // --- Draw Pie ---
          const dprPie = window.devicePixelRatio || 1;
          pieCanvas.width = 160 * dprPie;
          pieCanvas.height = 100 * dprPie;
          const pCtx = pieCanvas.getContext("2d");
          pCtx.setTransform(1, 0, 0, 1, 0, 0);
          pCtx.clearRect(0, 0, pieCanvas.width, pieCanvas.height);
          pCtx.scale(dprPie, dprPie);
          const pw = 160, ph = 100;
          const cx = pw / 2, cy = 49, r = Math.min(pw, ph) / 2 - 10;

          if (total === 0) {
            // Gray empty pie with "No data" label
            pCtx.beginPath();
            pCtx.arc(cx, cy, r, 0, Math.PI * 2);
            pCtx.fillStyle = "#FFF3C4";
            pCtx.fill();
            pCtx.fillStyle = "#333";
            pCtx.font = "16px Lato, sans-serif";
            pCtx.textAlign = "center";
            pCtx.textBaseline = "middle";
            pCtx.fillText("No data", cx, cy);
          } else {
            const hPct = Math.round((healthy / total) * 100);
            const iPct = 100 - hPct;
            const slices = [];
            if (infected > 0) slices.push({ pct: infected / total, color: "#502600", labelColor: "#fff", label: iPct + "%" });
            if (healthy > 0) slices.push({ pct: healthy / total, color: "#45A54A", labelColor: "#000", label: hPct + "%" });

            let startAngle = -Math.PI / 2;
            slices.forEach(s => {
              const sweep = s.pct * 2 * Math.PI;
              pCtx.beginPath();
              pCtx.moveTo(cx, cy);
              pCtx.arc(cx, cy, r, startAngle, startAngle + sweep);
              pCtx.closePath();
              pCtx.fillStyle = s.color;
              pCtx.fill();
              s._mid = startAngle + sweep / 2;
              startAngle += sweep;
            });
            slices.forEach(s => {
              const mid = s._mid;
              let lx, ly;
              if (s.pct >= 1) {
                lx = cx;
                ly = cy;
              } else if (s.pct > 0.25) {
                const d = r * 0.55;
                lx = cx + d * Math.cos(mid);
                ly = cy + d * Math.sin(mid);
              } else {
                const d = r * (2 / 3);
                lx = cx + d * Math.cos(mid);
                ly = cy + d * Math.sin(mid);
              }
              if (s.pct > 0.08) {
                pCtx.fillStyle = s.labelColor;
                pCtx.font = "bold 16px Lato, sans-serif";
                pCtx.textAlign = "center";
                pCtx.textBaseline = "middle";
                pCtx.fillText(s.label, lx, ly);
              }
            });
          }

          // --- Draw Bar Chart ---
          const dprBar = window.devicePixelRatio || 1;
          const bCtx = barCanvas.getContext("2d");
          const lw = barChartBody.clientWidth || 260, lh = 158;
          barCanvas.width = lw * dprBar;
          barCanvas.height = lh * dprBar;
          bCtx.setTransform(1, 0, 0, 1, 0, 0);
          bCtx.clearRect(0, 0, barCanvas.width, barCanvas.height);
          bCtx.scale(dprBar, dprBar);

          const hasFungus = st.fungusAfterCross !== null;
          const margin = { top: hasFungus ? 35 : 15, right: 8, bottom: 28, left: 44 };
          const gw = lw - margin.left - margin.right;
          const gh = lh - margin.top - margin.bottom;

          // Y-axis gridlines & labels (always visible)
          bCtx.strokeStyle = "#949494";
          bCtx.lineWidth = 1;
          bCtx.fillStyle = "#333";
          bCtx.font = "400 16px 'Roboto Condensed', sans-serif";
          bCtx.textAlign = "right";
          bCtx.textBaseline = "middle";
          for (let i = 0; i <= 4; i++) {
            const y = margin.top + gh - (i / 4) * gh;
            bCtx.beginPath();
            bCtx.moveTo(margin.left, y);
            bCtx.lineTo(margin.left + gw, y);
            bCtx.stroke();
            bCtx.fillText((i * 25) + "%", margin.left - 6, y);
          }

          const gens = st.crosses;
          if (gens.length === 0) {
            if (st.fungusAfterCross !== null) {
              const fx = margin.left;
              bCtx.strokeStyle = "#1A3C8F";
              bCtx.lineWidth = 2;
              bCtx.setLineDash([6, 4]);
              bCtx.beginPath();
              bCtx.moveTo(fx, margin.top);
              bCtx.lineTo(fx, margin.top + gh);
              bCtx.stroke();
              bCtx.setLineDash([]);
              bCtx.font = "500 16px 'Roboto Condensed', sans-serif";
              const flagText = "Fungus";
              const tw = bCtx.measureText(flagText).width;
              const iconSz = 20, iconGap = 3;
              const flagH = 28, flagPadL = 4, flagPadR = 6;
              const flagW = flagPadL + iconSz + iconGap + tw + flagPadR;
              const flagX = fx;
              const flagY = 32 - flagH;
              const flagR = 4;
              bCtx.fillStyle = "#C8D8FC";
              bCtx.beginPath();
              bCtx.moveTo(flagX, flagY);
              bCtx.lineTo(flagX + flagW - flagR, flagY);
              bCtx.arcTo(flagX + flagW, flagY, flagX + flagW, flagY + flagR, flagR);
              bCtx.lineTo(flagX + flagW, flagY + flagH - flagR);
              bCtx.arcTo(flagX + flagW, flagY + flagH, flagX + flagW - flagR, flagY + flagH, flagR);
              bCtx.lineTo(flagX, flagY + flagH);
              bCtx.closePath();
              bCtx.fill();
              bCtx.fillStyle = "#1A3C8F";
              bCtx.textAlign = "left";
              bCtx.textBaseline = "middle";
              const iconX = flagX + flagPadL;
              const iconY = flagY + (flagH - iconSz) / 2;
              bCtx.save();
              bCtx.translate(iconX, iconY);
              bCtx.scale(iconSz / 24, iconSz / 24);
              const fp = buildFungusIconPath();
              bCtx.fill(fp);
              bCtx.restore();
              bCtx.fillText(flagText, iconX + iconSz + iconGap, flagY + flagH / 2 + 1.5);
            } else {
              bCtx.fillStyle = "#333";
              bCtx.font = "16px Lato, sans-serif";
              bCtx.textAlign = "center";
              bCtx.textBaseline = "middle";
              bCtx.fillText("No data", margin.left + gw / 2, margin.top + gh / 2);
            }
            barTable.innerHTML = "";
            return;
          }

          // Compute healthy % per cross
          const healthyPcts = gens.map(g => {
            const t = g.length;
            const inf = g.filter(p => p.infected).length;
            return t > 0 ? ((t - inf) / t) * 100 : 100;
          });
          const infectedPcts = healthyPcts.map(h => 100 - h);

          // Bar chart layout
          const groupGap = 4;
          const barGap = 2;
          const groupW = gw / gens.length;
          const barW = (groupW - groupGap - barGap) / 2;

          // X-axis labels
          bCtx.textAlign = "center";
          bCtx.textBaseline = "top";
          bCtx.font = "400 16px 'Roboto Condensed', sans-serif";
          const labelW = bCtx.measureText("C00").width + 4;
          const maxLabels = Math.max(1, Math.floor(gw / labelW));
          const labelStep = Math.ceil(gens.length / maxLabels);
          gens.forEach((_, gi) => {
            const isLast = gi === gens.length - 1;
            if (gi % labelStep !== 0 && !isLast) return;
            if (!isLast && gens.length > 1) {
              const nextShown = isLast ? gi : gens.length - 1;
              const thisX = margin.left + gi * groupW + groupW / 2;
              const lastX = margin.left + (gens.length - 1) * groupW + groupW / 2;
              if (lastX - thisX < labelW) return;
            }
            const groupX = margin.left + gi * groupW + groupW / 2;
            bCtx.fillStyle = "#333";
            bCtx.fillText("C" + (gi + 1), groupX, margin.top + gh + 9);
          });

          // Fungus introduction marker
          if (st.fungusAfterCross !== null) {
            const fgi = st.fungusAfterCross;
            let fx;
            if (fgi === 0) {
              fx = margin.left;
            } else if (fgi >= gens.length) {
              fx = margin.left + gw;
            } else {
              fx = margin.left + fgi * groupW;
            }
            bCtx.strokeStyle = "#1A3C8F";
            bCtx.lineWidth = 2;
            bCtx.setLineDash([6, 4]);
            bCtx.beginPath();
            bCtx.moveTo(fx, margin.top);
            bCtx.lineTo(fx, margin.top + gh);
            bCtx.stroke();
            bCtx.setLineDash([]);

            bCtx.font = "500 16px 'Roboto Condensed', sans-serif";
            const flagText = "Fungus";
            const tw = bCtx.measureText(flagText).width;
            const iconSz = 20, iconGap = 3;
            const flagH = 28, flagPadL = 4, flagPadR = 6;
            const flagW = flagPadL + iconSz + iconGap + tw + flagPadR;
            const flipLeft = fx + flagW > lw - margin.right;
            const flagX = flipLeft ? fx - flagW : fx;
            const flagY = 32 - flagH;
            const flagR = 4;
            bCtx.fillStyle = "#C8D8FC";
            bCtx.beginPath();
            if (flipLeft) {
              bCtx.moveTo(flagX + flagR, flagY);
              bCtx.lineTo(flagX + flagW, flagY);
              bCtx.lineTo(flagX + flagW, flagY + flagH);
              bCtx.lineTo(flagX + flagR, flagY + flagH);
              bCtx.arcTo(flagX, flagY + flagH, flagX, flagY + flagH - flagR, flagR);
              bCtx.lineTo(flagX, flagY + flagR);
              bCtx.arcTo(flagX, flagY, flagX + flagR, flagY, flagR);
            } else {
              bCtx.moveTo(flagX, flagY);
              bCtx.lineTo(flagX + flagW - flagR, flagY);
              bCtx.arcTo(flagX + flagW, flagY, flagX + flagW, flagY + flagR, flagR);
              bCtx.lineTo(flagX + flagW, flagY + flagH - flagR);
              bCtx.arcTo(flagX + flagW, flagY + flagH, flagX + flagW - flagR, flagY + flagH, flagR);
              bCtx.lineTo(flagX, flagY + flagH);
            }
            bCtx.closePath();
            bCtx.fill();
            bCtx.fillStyle = "#1A3C8F";
            bCtx.textAlign = "left";
            bCtx.textBaseline = "middle";
            const iconX = flagX + flagPadL;
            const iconY = flagY + (flagH - iconSz) / 2;
            bCtx.save();
            bCtx.translate(iconX, iconY);
            bCtx.scale(iconSz / 24, iconSz / 24);
            const fp = buildFungusIconPath();
            bCtx.fill(fp);
            bCtx.restore();
            bCtx.fillText(flagText, iconX + iconSz + iconGap, flagY + flagH / 2 + 1.5);
          }

          // Highlight selected cross
          if (selCross !== null && selCross !== undefined && selCross < gens.length) {
            const groupX = margin.left + selCross * groupW;
            bCtx.fillStyle = (SIMS[activeSim].theme && SIMS[activeSim].theme.crossLabelBg) || "#FFE680";
            bCtx.fillRect(groupX, margin.top, groupW, gh);
          }

          // Draw bars
          gens.forEach((_, gi) => {
            const groupX = margin.left + gi * groupW + groupGap / 2;
            const hH = Math.max(2, (healthyPcts[gi] / 100) * gh);
            const iH = Math.max(2, (infectedPcts[gi] / 100) * gh);
            const hX = groupX;
            const iX = groupX + barW + barGap;

            bCtx.fillStyle = "#3D9441";
            bCtx.fillRect(hX, margin.top + gh - hH, barW, hH);
            bCtx.fillStyle = "#502600";
            bCtx.fillRect(iX, margin.top + gh - iH, barW, iH);
          });

          // Dynamic aria-labels for charts
          if (total === 0) {
            pieCanvas.setAttribute("aria-label", "Pie chart: no data");
            barCanvas.setAttribute("aria-label", "Bar chart: no data");
            barTable.innerHTML = "";
          } else {
            const hPctLabel = Math.round((healthy / total) * 100);
            const iPctLabel = 100 - hPctLabel;
            const crossLabel = (selCross !== null && selCross !== undefined) ? "cross " + (selCross + 1) : "all crosses";
            pieCanvas.setAttribute("aria-label", "Pie chart showing offspring phenotypes for " + crossLabel + ": " + hPctLabel + "% healthy, " + iPctLabel + "% infected");
            const lastHealthy = Math.round(healthyPcts[healthyPcts.length - 1]);
            const lastInfected = 100 - lastHealthy;
            barCanvas.setAttribute("aria-label", "Bar chart showing fungus resistance over " + gens.length + " cross" + (gens.length > 1 ? "es" : "") + ". Latest: " + lastHealthy + "% healthy, " + lastInfected + "% infected");

            // Hidden data table for SR exploration of bar chart
            let tableHTML = "<thead><tr><th>Cross</th><th>Healthy</th><th>Infected</th></tr></thead><tbody>";
            gens.forEach((g, gi) => {
              const hP = Math.round(healthyPcts[gi]);
              const iP = 100 - hP;
              const fungusMarker = (st.fungusAfterCross !== null && gi === st.fungusAfterCross) ? " (fungus introduced)" : "";
              tableHTML += "<tr><td>C" + (gi + 1) + fungusMarker + "</td><td>" + hP + "%</td><td>" + iP + "%</td></tr>";
            });
            tableHTML += "</tbody>";
            barTable.innerHTML = tableHTML;
          }
        };
      }

      panelWrap.appendChild(panel);

      // Title tab (overlays top of panel)
      const tab = document.createElement("div");
      tab.className = "sim-panel-tab";
      const tabLabel = document.createElement("h2");
      tabLabel.className = "sim-panel-tab-label";
      tabLabel.textContent = p.name;
      tab.appendChild(tabLabel);
      if (p.subtitle) {
        const bc = (SIMS[activeSim].theme && SIMS[activeSim].theme.panelBorder) || "#555";
        tab.style.border = "2px solid " + bc;
        tab.style.borderRight = "none";
        tab.style.borderRadius = "999px 0 0 999px";
        tab.style.position = "static";
        tab.style.transform = "none";
        tab.style.left = "";
        tab.style.height = "100%";
        const tabSub = document.createElement("div");
        tabSub.style.cssText = "display:flex;align-items:center;padding:0 12px 0 10px;background:#FFFDF2;height:100%;box-sizing:border-box;border:2px solid " + bc + ";border-left:none;border-radius:0 999px 999px 0;";
        const tabSubLabel = document.createElement("span");
        tabSubLabel.className = "sim-panel-tab-subtitle";
        tabSubLabel.textContent = p.subtitle;
        tabSub.appendChild(tabSubLabel);
        const tabWrap = document.createElement("div");
        tabWrap.className = "sim-tab-wrap";
        tabWrap.appendChild(tab);
        tabWrap.appendChild(tabSub);
        panelWrap.appendChild(tabWrap);
      } else
      if (p.name === "Data") {
        tab.style.position = "static";
        tab.style.transform = "none";
        tab.style.left = "";
        const tabWrap = document.createElement("div");
        tabWrap.style.cssText = "position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:36px;z-index:11;";
        tabWrap.appendChild(tab);
        panelWrap.appendChild(tabWrap);
      } else {
        panelWrap.appendChild(tab);
      }

      wrap.appendChild(panelWrap);
    });

    // Initial data panel render
    if (SIM.updateDataPanel) SIM.updateDataPanel();
    document.fonts.ready.then(() => {
      // Re-measure condensed dropdown width now that fonts are loaded
      const triggers = document.querySelectorAll(".sim-dropdown-trigger");
      if (triggers.length) {
        const m = document.createElement("span");
        m.style.cssText = "font-family:'Roboto Condensed',sans-serif;font-weight:400;font-size:16px;visibility:hidden;position:absolute;white-space:nowrap;";
        document.body.appendChild(m);
        const opts = ["Wild W1", "Wild W2", "Wild W3", "Cavendish C1", "Cavendish C2"];
        let mxC = 0;
        opts.forEach(o => { m.textContent = o; mxC = Math.max(mxC, m.offsetWidth); });
        document.body.removeChild(m);
        triggers.forEach(t => { t._condensedW = mxC + 0 + 18 + 12 + 4; });
      }
      if (SIM.updateDataPanel) SIM.updateDataPanel();
    });

    // Ctrl+Arrow: navigate between panels
    const panelEls = wrap.querySelectorAll('.sim-panel[role="region"]');
    if (SIM.panelNavHandler) document.removeEventListener("keydown", SIM.panelNavHandler);
    SIM.panelNavHandler = (e) => {
      if (!e.ctrlKey || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
      e.preventDefault();
      const panelArr = Array.from(panelEls);
      const active = document.activeElement;
      let curIdx = -1;
      panelArr.forEach((p, i) => { if (p.contains(active)) curIdx = i; });
      const dir = e.key === "ArrowRight" ? 1 : -1;
      for (let i = 1; i <= panelArr.length; i++) {
        const nextIdx = (curIdx + dir * i + panelArr.length * panelArr.length) % panelArr.length;
        const focusable = nextIdx === curIdx ? null : panelArr[nextIdx].querySelectorAll('[tabindex="0"], button:not([tabindex="-1"]), a, input, select, textarea');
        if (focusable && focusable.length > 0) {
          focusable[0].focus();
          break;
        }
      }
    };
    document.addEventListener("keydown", SIM.panelNavHandler);

    return wrap;
  }
  return null;
}

  const isNoLimit = activeDevice === "none";

  const availH = isNoLimit ? 700 : device.screenH - device.topChrome - device.bottomChrome;

  // Content width
  let contentW;

    document.body.style.background = "#e0e0e0";
    document.body.style.paddingRight = "0";

    // Measure AFTER stretch so container matches wrapper width
    const fullW = container.clientWidth;
    const standaloneBorder = 4; // 2px border each side, box-sizing: content-box
    const standaloneW = Math.floor(Math.max(standaloneMin, Math.min(standaloneMax, fullW - (standaloneMargin * 2) - standaloneBorder)));
    const ml = standaloneW <= standaloneMin ? standaloneMargin : Math.floor((fullW - standaloneW - standaloneBorder) / 2);

    const topOffset = container.getBoundingClientRect().top;
    const verticalPad = Math.max(0, (window.innerHeight - topOffset - standaloneH) / 2);

    content.appendChild(getSimTitleBar());
    const scSA1 = getSimContent();
    if (scSA1) content.appendChild(scSA1);

    // Update info line with actual responsive width
    info.innerHTML = `<strong>Teacher Desktop / ${layout.name}</strong><br><strong>Content:</strong> ${standaloneW}w × ${standaloneH}h`;
    if (standaloneW <= standaloneMin) {
      const clipW = standaloneMin + (standaloneMargin * 2) + standaloneBorder; // 812
      info.style.alignSelf = "flex-start";
      info.style.minWidth = clipW + "px";
    }

    container.appendChild(content);
    if (SIM.updateDataPanel) SIM.updateDataPanel();

    return;
  } else {
    // Standalone with device frame
    const standaloneMax = 1024;
    const standaloneMin = 768;
    const standaloneMargin = 20;
    const contentBorder = 4; // 2px border each side on .content-area.standalone (content-box)
    const wrapperClientW = document.querySelector(".viewport-wrapper").clientWidth;
    const standaloneH = 562;

    let standaloneW, simMarginLeft, frameVisualW;

    if (activeDevice === "chromebook") {
      // Chromebook: frame shrinks with browser, content responsive
      frameVisualW = Math.min(device.screenW, wrapperClientW);
      frame.style.width = (frameVisualW) + "px";

      const shrinkStart = standaloneMax + contentBorder + (standaloneMargin * 2); // 1068
      const clipStart = standaloneMin + contentBorder + (standaloneMargin * 2); // 812

      if (frameVisualW >= shrinkStart) {
        standaloneW = standaloneMax;
        simMarginLeft = null;
      } else if (frameVisualW >= clipStart) {
        standaloneW = frameVisualW - (standaloneMargin * 2) - contentBorder;
        simMarginLeft = standaloneMargin;
      } else {
        standaloneW = standaloneMin;
        simMarginLeft = standaloneMargin;
      }

      // Label freeze when clipping
      if (frameVisualW < clipStart) {
        info.style.alignSelf = "flex-start";
        info.style.minWidth = clipStart + "px";
      }
    } else {
      // iPad/Android: fixed frame, fixed content, no responsiveness
      frameVisualW = device.screenW;
      if (device.screenW <= standaloneMax + contentBorder) {
        standaloneW = device.screenW - (standaloneMargin * 2) - contentBorder;
        simMarginLeft = standaloneMargin;
      } else {
        standaloneW = standaloneMax;
        simMarginLeft = null;
      }

      // Label freeze when frame is clipped by wrapper
      if (wrapperClientW < device.screenW) {
        info.style.alignSelf = "flex-start";
        info.style.minWidth = device.screenW + "px";
      }

      frame.style.boxShadow = "0 2px 12px rgba(0, 0, 0, 0.3)";
    }

    const content = document.createElement("div");
    content.className = "content-area standalone";
    content.setAttribute("role", "main");
    content.style.width = (standaloneW) + "px";
    content.style.height = (standaloneH) + "px";
    applySimTheme(content);
    content.appendChild(getSimTitleBar());
    const scSA2 = getSimContent();
    if (scSA2) content.appendChild(scSA2);

    viewport.style.display = "flex";
    viewport.style.alignItems = "center";
    viewport.style.background = "#e0e0e0";

    if (simMarginLeft !== null) {
      viewport.style.justifyContent = "flex-start";
      content.style.marginLeft = simMarginLeft + "px";
    } else {
      viewport.style.justifyContent = "center";
    }
    viewport.appendChild(content);

    // Update info line
    info.innerHTML = `<strong>${device.name} / ${layout.name}</strong><br><strong>Screen:</strong> ${device.screenW}w × ${device.screenH}h • <strong>Available:</strong> ${frameVisualW}w × ${availH}h • <strong>Content:</strong> ${standaloneW}w × ${standaloneH}h`;
  }

  frame.appendChild(viewport);

  // Bottom chrome
  if (!isNoLimit && device.bottomChrome > 0) {
    const bottom = document.createElement("div");
    bottom.className = "chrome-bottom";
    bottom.style.height = (device.bottomChrome) + "px";
    bottom.setAttribute("data-label", device.bottomLabel);

    frame.appendChild(bottom);
  }

  container.appendChild(frame);
  if (SIM.updateDataPanel) SIM.updateDataPanel();
}

// Button wiring
function wireToggleGroup(selector, callback) {
  document.querySelectorAll(selector).forEach(btn => {
    btn.addEventListener("click", () => {
      if (callback) callback(btn);
      document.querySelectorAll(selector).forEach(b => {
        b.classList.remove("active");
        b.setAttribute("aria-pressed", "false");
      });
      btn.classList.add("active");
      btn.setAttribute("aria-pressed", "true");
      buildViewport();
    });
  });
}

wireToggleGroup("[data-sim]", btn => { activeSim = btn.dataset.sim; invalidateSimCache(); });
wireToggleGroup("[data-layout]", btn => {
  activeLayout = btn.dataset.layout;
  if (activeLayout === "ap-2col") sidebarExpanded = true;
});
wireToggleGroup("[data-device]", btn => { activeDevice = btn.dataset.device; });

buildViewport();

// Resize handler
let _resizeRafId = null;
function updateStandaloneDeviceFrame() {
  if (_resizeRafId) return; // already scheduled
  _resizeRafId = requestAnimationFrame(() => {
    _resizeRafId = null;
    _updateStandaloneDeviceFrameNow();
  });
}
function _updateStandaloneDeviceFrameNow() {
  const wrapper = document.querySelector(".viewport-wrapper");
  const contentEl = document.querySelector(".content-area.standalone");
  if (!wrapper || !contentEl) return;

  const device = DEVICES[activeDevice];
  if (!device) return;

  const wrapperClientW = wrapper.clientWidth;
  const info = document.getElementById("viewportInfo");

  if (activeDevice !== "chromebook") {
    // iPad/Android: no responsive changes, only label freeze
    if (info) {
      const isClipping = wrapperClientW < device.screenW;
      info.style.alignSelf = isClipping ? "flex-start" : "";
      info.style.minWidth = isClipping ? device.screenW + "px" : "";
    }
    return;
  }

  // Chromebook: full responsive logic
  const contentBorder = 4;
  const margin = 20;
  const standaloneMax = 1024;
  const standaloneMin = 768;
  const availH = device.screenH - device.topChrome - device.bottomChrome;

  const frameVisualW = Math.min(device.screenW, wrapperClientW);
  const frameEl = document.querySelector(".device-frame");
  if (frameEl) {
    frameEl.style.transition = "none";
    frameEl.style.width = frameVisualW + "px";
  }
  contentEl.style.transition = "none";

  const shrinkStart = standaloneMax + contentBorder + (margin * 2); // 1068
  const clipStart = standaloneMin + contentBorder + (margin * 2); // 812

  const viewport = contentEl.parentElement;

  let w;
  if (frameVisualW >= shrinkStart) {
    w = standaloneMax;
    contentEl.style.marginLeft = "";
    if (viewport) viewport.style.justifyContent = "center";
  } else if (frameVisualW >= clipStart) {
    w = frameVisualW - (margin * 2) - contentBorder;
    contentEl.style.marginLeft = margin + "px";
    if (viewport) viewport.style.justifyContent = "flex-start";
  } else {
    w = standaloneMin;
    contentEl.style.marginLeft = margin + "px";
    if (viewport) viewport.style.justifyContent = "flex-start";
  }

  contentEl.style.width = w + "px";
  const layoutName = LAYOUTS[activeLayout] ? LAYOUTS[activeLayout].name : activeLayout;
  if (info) {
    info.innerHTML = '<strong>' + device.name + ' / ' + layoutName + '</strong><br><strong>Screen:</strong> ' + device.screenW + 'w \u00d7 ' + device.screenH + 'h \u2022 <strong>Available:</strong> ' + frameVisualW + 'w \u00d7 ' + availH + 'h \u2022 <strong>Content:</strong> ' + w + 'w \u00d7 562h';
    const isClipping = frameVisualW < clipStart;
    info.style.alignSelf = isClipping ? "flex-start" : "";
    info.style.minWidth = isClipping ? clipStart + "px" : "";
  }
}

// Track input method so focus rings only show on keyboard interaction.
// Covers old browsers (no :focus-visible) and the edge case where
// :focus-visible persists after clicking an already-keyboard-focused element.
document.addEventListener("mousedown", () => document.body.classList.add("using-mouse"));
document.addEventListener("keydown", () => document.body.classList.remove("using-mouse"));

window.addEventListener("resize", () => {
  // Always update browser width label
  const bwEl = document.getElementById("browserWidthValue");
  const bwWrapper = document.querySelector(".viewport-wrapper");
  if (bwEl && bwWrapper) bwEl.textContent = Math.round(window.innerWidth - bwWrapper.getBoundingClientRect().left) + "px";

  if (activeLayout === "standalone" && activeDevice === "none") {
    // Teacher Desktop — full rebuild (responsive content)
    buildViewport();
  } else if (activeLayout === "standalone" && activeDevice !== "none") {
    // Device frame — lightweight update (no rebuild)
    updateStandaloneDeviceFrame();
  } else if (activeDevice === "chromebook" && activeLayout !== "standalone") {
    // Chromebook + AP layouts — shrink frame, label freeze
    const device = DEVICES[activeDevice];
    const wrapper = document.querySelector(".viewport-wrapper");
    if (device && wrapper) {
      const wrapperW = wrapper.clientWidth;
      const frameVisualW = Math.min(device.screenW, wrapperW);
      const frameEl = document.querySelector(".device-frame");
      if (frameEl) {
        frameEl.style.transition = "none";
        frameEl.style.width = frameVisualW + "px";
      }
      // Pin page to left when frame < 1100, restore centering when wider
      const viewportArea = document.querySelector(".viewport-area");
      if (viewportArea) {
        viewportArea.style.justifyContent = frameVisualW < 1100 ? "flex-start" : "";
      }
      const info = document.getElementById("viewportInfo");
      if (info) {
        const availH = device.screenH - device.topChrome - device.bottomChrome;
        const layoutName = LAYOUTS[activeLayout] ? LAYOUTS[activeLayout].name : activeLayout;
        const contentW = activeLayout === "ap-2col" ? (sidebarExpanded ? AP_CONTENT_W_EXPANDED : AP_CONTENT_W_COLLAPSED) : 1044;
        info.innerHTML = '<strong>' + device.name + ' / ' + layoutName + '</strong><br><strong>Screen:</strong> ' + device.screenW + 'w \u00d7 ' + device.screenH + 'h \u2022 <strong>Available:</strong> ' + frameVisualW + 'w \u00d7 ' + availH + 'h \u2022 <strong>Content:</strong> ' + contentW + 'w \u00d7 ' + AP_CONTENT_H + 'h';
        const isClipping = wrapperW < device.screenW;
        info.style.alignSelf = isClipping ? "flex-start" : "";
        info.style.minWidth = isClipping ? Math.max(frameVisualW, 1100) + "px" : "";
      }
    }
  } else if (activeDevice !== "none" && activeDevice !== "chromebook") {
    // iPad/Android + any layout — label freeze only
    const info = document.getElementById("viewportInfo");
    const device = DEVICES[activeDevice];
    if (info && device) {
      const wrapperW = document.querySelector(".viewport-wrapper").clientWidth;
      const isClipping = wrapperW < device.screenW;
      info.style.alignSelf = isClipping ? "flex-start" : "";
      info.style.minWidth = isClipping ? device.screenW + "px" : "";
    }
  }
  // Redraw charts at new size
  if (SIM.updateDataPanel) SIM.updateDataPanel();
});
</script>
</body>
</html>
