       track's left edge by half its width — so this margin is small to land the
       visible ANIMATE-to-SLOW gap at about 10px. */
    flex-shrink: 0; margin-left: 0; width: 92px;
  }
  /* The thumb is sized here rather than left to the browser, so the stop
     positions are a known quantity the labels can be pinned to. */
  .nnm-speed input[type=range] {
    -webkit-appearance: none; appearance: none;
    /* Negative vertical margins pull the LAYOUT height back to what an 18px
       thumb occupied, so a bigger thumb does not make this header taller than
       the conversation header beside it. The thumb still draws at full size —
       margins do not clip. */
    width: 92px; height: 40px; margin: 0; cursor: pointer; background: transparent;
  }
  /* The bar is drawn by .nnm-trackline, so the native one is invisible. */
  /* The input is stretched over the whole block — bar AND labels — so the entire
     height is draggable and clicking a name jumps to that stop. Its content box
     is held to the bar's height with a bottom padding, which keeps the track (and
     so the thumb) up on the bar rather than centred in the taller box. */
  .nnm-speedtrack { position: relative; height: 18px; }
  .nnm-trackline {
    position: absolute; top: 50%; margin-top: -2px;
    background: #D3D8E0; pointer-events: none;
  }
  .nnm-speed input[type=range] {
    position: absolute; top: 0; left: 0; z-index: 1;
    box-sizing: border-box; padding-bottom: 22px;
  }
  .nnm-speed input[type=range]::-webkit-slider-runnable-track {
    height: 4px; background: transparent;
  }
  /* White with the same 2px rule the step buttons above it carry. border-box is
     load-bearing: without it the border would push the thumb to 18px and the
     labels, which are pinned to a 14px thumb, would stop lining up. */
  .nnm-speed input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    box-sizing: border-box;
    width: 24px; height: 24px; margin-top: -10px;
    border-radius: 50%; background: #fff; border: 2px solid var(--nnm-rule);
    transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .nnm-speed input[type=range]::-moz-range-track {
    height: 4px; background: transparent;
  }
  .nnm-speed input[type=range]::-moz-range-thumb {
    box-sizing: border-box;
    width: 24px; height: 24px; border-radius: 50%;
    background: #fff; border: 2px solid var(--nnm-rule);
    transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  /* Hover borrows the step buttons' hover fill; dragging fills it solid, so the
     thumb reads as held. Guarded on :not(:disabled) so it stays inert while
     Animate is off. Size never changes — the stops, ticks and track ends are all
     derived from the thumb's width, so growing it on hover would pull them apart. */
  .nnm-speed input[type=range]:not(:disabled):hover::-webkit-slider-thumb {
    background: var(--nnm-surface); border-color: #A7B0BC;
  }
  .nnm-speed input[type=range]:not(:disabled):hover::-moz-range-thumb {
    background: var(--nnm-surface); border-color: #A7B0BC;
  }
  .nnm-speed input[type=range]:not(:disabled):active::-webkit-slider-thumb {
    background: var(--nnm-ink); border-color: var(--nnm-ink);
    box-shadow: 0 0 0 4px rgba(30,36,44,0.10);
  }
  .nnm-speed input[type=range]:not(:disabled):active::-moz-range-thumb {
    background: var(--nnm-ink); border-color: var(--nnm-ink);
    box-shadow: 0 0 0 4px rgba(30,36,44,0.10);
  }
  /* Keyboard focus marks the thumb itself rather than drawing a ring round the
     whole control, which would sit awkwardly over the ticks. */
  .nnm-speed input[type=range]:focus-visible::-webkit-slider-thumb {
    border-color: var(--nnm-ink);
    box-shadow: 0 0 0 3px rgba(30,36,44,0.16);
  }
  .nnm-speed input[type=range]:focus-visible::-moz-range-thumb {
    border-color: var(--nnm-ink);
    box-shadow: 0 0 0 3px rgba(30,36,44,0.16);
  }
  /* Greyed and inert while Animate is off. */
  .nnm-speed.off { opacity: 0.4; }
  .nnm-speed.off input[type=range] { cursor: default; }
  /* One name per stop, with a tick above it. The row is inset by half a thumb at
     each end so the outer two sit under where the thumb actually comes to rest,
     not under the ends of the track. */
  .nnm-speedticks {
    position: relative; height: 17px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.03em; text-transform: uppercase; color: var(--nnm-ink-3);
    line-height: 1;
  }
  .nnm-speedticks span {
    position: absolute; top: 0; transform: translateX(-50%);
    padding-top: 6px; white-space: nowrap;
  }
  .nnm-speedticks span::before {
    content: ""; position: absolute; top: 0; left: 50%;
    width: 1px; height: 4px; margin-left: -0.5px; background: #B9C0CA;
  }
  .nnm-speedticks span.on { color: var(--nnm-ink); }
  .nnm-speedticks span.on::before { background: var(--nnm-ink); }
  /* No ring when clicked, kept for Tab — losing it there would leave the control
     untraceable by keyboard, which is worse than a ring after a click. The
     :not(:focus-visible) form is not enough on its own: browsers match
     :focus-visible on a clicked checkbox, so the modality class decides. */
  .nnm-animtoggle input:focus:not(:focus-visible),
  .nnm-speed input:focus:not(:focus-visible),
  .nnm-pointer .nnm-animtoggle input:focus,
  .nnm-pointer .nnm-speed input:focus { outline: none; box-shadow: none; }
  .nnm-animtoggle {
    flex-shrink: 0;
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    cursor: pointer;
    user-select: none;
  }
  .nnm-animtoggle input { width: 15px; height: 15px; margin: 0; cursor: pointer; accent-color: var(--nnm-neg); }
  .nnm-animtoggle:hover { color: var(--nnm-ink); }
  .nnm-animtoggle:focus-within { outline: 2px solid var(--nnm-neg); outline-offset: 2px; border-radius: 4px; }

  /* The non-animated version: same screen, every stage arriving at once. */
  .nnm-nomotion .nnm-pop,
  .nnm-nomotion .nnm-tick { animation: none !important; }
  .nnm-nomotion .nnm-cell,
  .nnm-nomotion .nnm-cell.wgt,
  .nnm-nomotion .nnm-sq,
  .nnm-nomotion .nnm-tok { transition: none !important; }
  .nnm-reset:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  /* A fixed-width track for the weighted box, so the box can change size with
     its value without moving the flow's overall width. */
  .nnm-slot {
    width: 82px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }
  /* Resting width sits between the widest and narrowest a value can produce, so
     the Weigh step is seen to widen some boxes and narrow others rather than only
     ever shrinking them. */
  /* A symbol cell holds a square over its number. The square carries magnitude
     by AREA and sign by colour; the number stays put rather than moving above or
     below by sign, so the column can still be scanned. The cell itself goes
     plain — colouring both it and the square would say the same thing twice and
     make the square's edge unreadable against it. */
  /* The square grows from a fixed centre, on the same line as the multiply glyph
     beside it, so it expands in every direction rather than upward off a baseline.
     Both it and the number are taken out of the flow to do that: in flow, a
     growing square pushes the number down the cell, and a label that bobs with
     the value is unreadable. The number is parked at half the LARGEST square plus
     a gap, so it is clear of the square at full size and never moves. */
  .nnm-cell.sym {
    position: relative;
    /* Only tall enough to hold the largest square centred. The number is absolute
       and hangs below into the row gap rather than being contained here — sizing
       the cell to fit it forced a matching 40px of empty space ABOVE the square,
       which nothing used, and pushed the row pitch to 126px for 65px of ink. */
    height: 72px;
    /* Transparent, not white: the connector lines run INTO these cells to reach
       the square in the middle, and an opaque cell paints over the last 25px of
       every line — the ends looked clipped. The square carries the fill, so the
       cell needs none. !important because paint() still writes one inline. */
    background: transparent !important;
    border-color: transparent !important;
  }
  .nnm-cell.sym .nnm-num {
    position: absolute;
    left: 0; right: 0;
    top: calc(50% + 41px);
    text-align: center;
  }
  /* Corner cues on the importance box: which way the carried square is about to
     resize. Out means multiplied by more than one, in means less. */
  /* Zero-size, fixed, holds the position; the flying element lives inside and
     owns the animation transform. The two nest without fighting. */
  .nnm-flyanchor { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 40; }
  /* A fixed box the size of the flow scroller's viewport. Being fixed it is the
     containing block for the absolutely positioned anchors inside it, so its
     overflow actually clips them — which a scroller cannot do to a fixed anchor
     parked on <body>. */
  .nnm-flyclip { position: fixed; overflow: hidden; pointer-events: none; z-index: 40; }
  .nnm-flyanchor.clipped { position: absolute; }
  /* The turn-over arrow, shown only where importance is negative. */
  .nnm-flipcue { position: absolute; left: 0; top: 0; pointer-events: none; color: #8A94A3; }
  .nnm-flipcue svg { display: block; overflow: visible; }
  .nnm-nomotion .nnm-flipcue { display: none; }
  .nnm-cue {
    position: absolute; left: 0; top: 0;
    width: 13px; height: 13px;
    color: #8A94A3;
    pointer-events: none;
    z-index: 41;
  }
  .nnm-cue svg { display: block; width: 13px; height: 13px; }
  .nnm-nomotion .nnm-cue { display: none; }

  /* The square carried across the row by the Weigh step. Same treatment as the
     squares it comes from and lands on, so it reads as the same object moving. */
  .nnm-carry {
    position: absolute; left: 0; top: 0;
    box-sizing: border-box;
    border: 1px solid transparent;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px #6E7580;
    pointer-events: none;
    z-index: 40;
    will-change: transform;
  }
  .nnm-cell.sym .nnm-sq {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
    box-sizing: border-box;
    border: 1px solid transparent;
    border-radius: 3px;
    flex-shrink: 0;
    /* Inset so it never changes the square's measured size — the connector lines
       anchor to that. Keeps a white or very pale square visible on white. */
    box-shadow: inset 0 0 0 1px #6E7580;
    transition: width 0.35s cubic-bezier(.3,0,.3,1),
                height 0.35s cubic-bezier(.3,0,.3,1),
                background-color 0.35s ease;
  }
  /* paint() flips the cell's text to white at the top colour level — correct when
     the cell itself carried a dark fill, fatal now that it is forced white and the
     square holds the colour. An explicit colour here beats that inherited value,
     so the number stays legible however dark its square gets. */
  .nnm-cell.sym .nnm-num { line-height: 1; color: #1E242C; }
  /* The weighted box still varies in width, so its own centre slides. The slot
     behind it does not, so the symbol is pinned to that instead and stays put. */
  .nnm-cell.wgt.sym .nnm-sq { left: 41px; }
  .nnm-cell.wgt.sym .nnm-num { left: 0; right: auto; width: 82px; }
  .nnm-flowbody.narrow .nnm-cell.wgt.sym .nnm-sq { left: 37px; }
  .nnm-flowbody.narrow .nnm-cell.wgt.sym .nnm-num { width: 74px; }
  /* Square corners on the importance box only. sizeSym writes its transparent
     fill and its darkest-shade outline inline; the radius belongs here because
     it never varies. */
  .nnm-cell.imp.sym .nnm-sq { border-radius: 0; }
  /* Nothing has been computed yet: the stand-in is the smallest square the scale
     can produce, empty. That is also the size a real value starts from, so the
     step grows the square out of the stand-in instead of collapsing a large
     placeholder first. Sized with !important because sizeSym writes the real
     dimensions inline, and .empty is toggled after that. */
  .nnm-cell.sym.empty .nnm-sq {
    width: 12px !important;
    height: 12px !important;
    background: #FFFFFF !important;
  }
  /* Beats the explicit colour that keeps a number legible on a dark square, which
     would otherwise defeat .empty's `color: transparent`. */
  .nnm-cell.sym.empty .nnm-num { color: transparent; }
  /* Held back while the carried square is still settling on top of it — see the
     drop timer in carry(). visibility, not display: the connector lines anchor to
     this square's measured rect and it has to keep occupying its place. */
  .nnm-cell.wgt.under .nnm-sq { visibility: hidden; }


  .nnm-cell.wgt {
    width: 58px;
    transition: width 0.45s cubic-bezier(.3,0,.3,1), background-color 0.35s ease, color 0.35s ease;
  }
  /* The operators sit on the NUMBERS, not on the squares: the row reads as
     0.1234 × 0.5000 → 0.0617, which is the arithmetic the step actually does.
     Dropped by the same 41px that puts .nnm-num's line box below the square,
     plus the 6px from that box's top down to the centre of the digits' ink —
     so the glyph's ink lands on the digits' ink, not on their line box.
     A relative offset, not a transform: .nnm-op carries the tick animation's
     scale, which is applied about the box's own centre once this has moved it. */
  .nnm-op {
    width: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    top: 47px;
    transition: opacity 0.3s ease;
  }
  .nnm-glyph {
    font-family: var(--nnm-mono);
    font-size: 24px;
    line-height: 1;
    color: #C2C9D4;
    display: block;
    transition: color 0.3s ease;
  }
  /* Each glyph's ink sits differently inside its own line box, so the shared 47px
     drop above lands them ~1px apart. These two make up the remainder: measured
     ink centres are 453.2 (×) and 454.3 (→) against a digit ink centre of 500.9,
     so × needs 47.7 and → needs 46.6. Sub-pixel, so the tick animation's scale
     (which does multiply them) moves them by a fraction of a pixel — invisible,
     and the same fraction the previous corrections already lived with. */
  /* Same 24px as the X, inherited from .nnm-glyph. Its own correction is a shade
     smaller: the equals' ink centres 0.13px higher in the line box than the X's. */
  .nnm-glyph.eq { position: relative; top: -0.15px; }
  .nnm-op.mul .nnm-glyph { position: relative; top: -0.3px; }
  /* The operators darken as the Weigh step reaches them, one row at a time. */
  .nnm-frow.lit-mul .mul .nnm-glyph,
  .nnm-frow.lit-eq .eq .nnm-glyph { color: #6B7583; }
  /* A bigger kick than the cells get. They are small marks with no number to
     carry the change, so the standard 1.09 barely registered on them. */
  .nnm-op.nnm-tick { animation: nnm-tick-op 0.30s ease-out; }
  /* The importance value takes the CELLS' 1.09, not the operators' 1.34, because
     a ratio is not a distance. The x's ink is 10.9px wide and the ='s 12.4px, so
     1.34 throws them about 2px out per side. The value's ink is 58.7px wide, so
     the same 1.34 would throw it nearly 10px — five times the travel, on the
     widest thing in the row. At 1.09 it moves 2.6px per side and reads as the
     same size of kick as the marks either side of it. */
  @keyframes nnm-tick-op {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.34); }
    100% { transform: scale(1); }
  }

  .nnm-conv {
    flex-shrink: 0;
    transition: opacity 0.3s ease;
    overflow: visible;
    pointer-events: none;
  }
  .nnm-tail {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.3s ease;
  }
  /* Lifted out of the flow so only the cell is centred. Left in it, the tail
     centres label-plus-cell as a group, which pushes the cell below the midpoint
     the two answers are centred on — 40px above it and 6px below. */
  .nnm-taillabel {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    line-height: 1.2;
    color: var(--nnm-ink-2);
    text-align: center;
  }
  .nnm-flowbody.narrow .nnm-taillabel {
    position: static;
    transform: none;
    white-space: normal;
  }
  .nnm-fan { width: 40px; flex-shrink: 0; transition: opacity 0.3s ease; overflow: visible; }
  .nnm-outs {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    flex-shrink: 0;
    transition: opacity 0.3s ease;
  }
  .nnm-out {
    width: 74px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    border-radius: 6px;
    border: 1px solid rgba(30,36,44,0.14);
    background: #fff;
    color: var(--nnm-ink-3);
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  /* Coloured before anything runs. The two answers are not empty slots waiting to
     be filled — every other white box in the row is one, but these are the two
     destinations, both equally true as options before the model has said
     anything. Greying them claims "nothing here yet", which is the wrong claim.
     Carrying the mapping instead (positive is orange, negative is blue, as
     everywhere else here) lets the chain read forward: a blue sum is visibly
     heading for the blue answer, rather than the student learning that pairing at
     the one moment they are busy watching the reveal.
     The FILL stays white until Predict, so which one won is still said by exactly
     one thing. */
  .nnm-out.approach { border-color: var(--nnm-pos); }
  .nnm-out.wait { border-color: var(--nnm-neg); }
  .nnm-out.approach.on { background: #EFD3C4; color: #1E242C; }
  .nnm-out.wait.on { background: #1F4E8F; color: #fff; }

  .nnm-flowbody.narrow { flex-wrap: wrap; }
  .nnm-flowbody.narrow .nnm-cell { width: 74px; height: 36px; font-size: 12px; }
  .nnm-flowbody.narrow .nnm-slot { width: 74px; }
  .nnm-flowbody.narrow .nnm-cell.sum { width: 58px; }
  /* Narrow drops the numbers to 12px, which lifts the centre of their ink by
     0.6px. The operators follow it rather than staying put and reading half a
     pixel low, the same tolerance the corrections above are drawn to. */
  .nnm-flowbody.narrow .nnm-op { width: 26px; top: 46.4px; }
  .nnm-flowpanel:has(.nnm-flowbody.narrow) .nnm-flowhead .c { width: 74px; }
  .nnm-flowpanel:has(.nnm-flowbody.narrow) .nnm-flowhead .g { width: 26px; }
  .nnm-flowbody.narrow .nnm-out { width: 68px; height: 34px; font-size: 12.5px; }
  .nnm-flowbody.narrow .nnm-conv, .nnm-flowbody.narrow .nnm-fan { display: none; }
  .nnm-flowbody.narrow .nnm-decidewrap { width: 100%; padding-top: 12px; }
  .nnm-flowbody.narrow .nnm-deciderow { align-items: center; gap: 10px; }
  .nnm-flowbody.narrow .nnm-tail { flex-direction: row; gap: 8px; }
  .nnm-flowbody.narrow .nnm-outs { flex-direction: row; gap: 8px; }
  .nnm-flowbody.narrow .nnm-labels { flex-direction: row; gap: 6px 20px; align-items: center; }


  /* --- verdict --- */
  .nnm-verdict {
    margin-top: 14px;
    padding: 11px 13px;
    border: 1px solid var(--nnm-rule);
    border-radius: 7px;
    background: var(--nnm-surface);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    flex-shrink: 0;
  }
  .nnm-verdict-main {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nnm-note {
    min-width: 0;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--nnm-ink-2);
    font-style: italic;
    margin-top: 11px;
  }
  .nnm-note:empty { display: none; }
  .nnm-outs { display: flex; gap: 6px; }
  .nnm-out {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 3px 11px;
    /* Fully rounded rather than a fixed radius, so it stays a true pill at the
       narrow layout's shorter height without a second value to keep in step. */
    border-radius: 999px;
    border: 1px solid var(--nnm-rule);
    color: var(--nnm-ink-3);
    background: #fff;
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  }
  .nnm-out.approach.on { color: var(--nnm-pos); border-color: var(--nnm-pos); background: var(--nnm-pos-soft); }
  .nnm-out.wait.on { color: var(--nnm-neg); border-color: var(--nnm-neg); background: var(--nnm-neg-soft); }
  /* AFTER the two blocks above, not before: there are two .nnm-out rule sets in
     this stylesheet, and a bare .nnm-out placed earlier loses to the later one on
     order at equal specificity. Unselected, ink-3 on white is 3.4:1 — under the
     4.5:1 these labels need. */
  .nnm-out { color: var(--nnm-ink-2); }

  /* --- step control --- */
  .nnm-step {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0 12px;
    height: 36px;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 2px solid var(--nnm-rule);
    background: #fff;
    color: var(--nnm-ink-2);
    border-radius: 5px;
    cursor: pointer;
  }
  /* Each icon is a miniature of what the step does to the diagram beside it —
     marked-up text, the multiply glyph, the three lines converging, the fork to
     two answers — rather than a generic metaphor. currentColor so they invert
     with the button when it is the active step. */
  .nnm-step svg { width: 13px; height: 13px; flex-shrink: 0; overflow: visible; }
  .nnm-step:hover { background: var(--nnm-surface); }
  /* Press states. Activation stays on click — moving it to mousedown would remove
     the escape hatch of pressing, thinking better of it and releasing off the
     button, and on the tablets this runs on it would fire whenever a scroll
     gesture happened to start on a control. What was missing is the feedback,
     not the speed: the button now answers the moment it is pressed. */
  /* Pressing a step shows the SELECTED look straight away — the press is the
     answer, not a grey stop on the way to it. Nothing changes on release except
     that it stays. No nudge either: a shift would mean the press was not quite
     the final state after all. */
  .nnm-step:active {
    background: var(--nnm-ink); border-color: var(--nnm-ink); color: #fff;
  }
  .nnm-step.on {
    background: var(--nnm-ink);
    border-color: var(--nnm-ink);
    color: #fff;
  }
  .nnm-step:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .nnm-step[aria-disabled="true"] { opacity: 0.35; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

</style>

// Lifted out of the title bar so more than one control can open it. The title
// bar is currently switched off (SHOW_SIM_TITLE_BAR), and 2B and 3B reach About
// from a button in their own filter row instead; both routes share this one
// implementation rather than growing a second modal.
function openAboutModal(triggerBtn, mountEl) {
  const existingModal = document.querySelector(".info-modal");
  if (existingModal) { existingModal._closeModal(); return; }
  // Remove existing modal if any
  // Create modal
  const modal = document.createElement("div");
  modal.className = "info-modal";
  modal.setAttribute("role", "dialog");
  modal.setAttribute("aria-modal", "true");
  modal.setAttribute("tabindex", "-1");
  // Header
  const header = document.createElement("div");
  header.className = "info-modal-header";
  const hIcon = createSVGIcon(infoIconSVG);
  hIcon.classList.add("info-modal-header-icon");
  const hTitle = document.createElement("h2");
  hTitle.className = "info-modal-header-title";
  hTitle.id = "info-modal-title";
  // Was "About the {name} Simulation", a MassSims leftover: 2B's name already
  // begins with "The", and none of these are simulations.
  hTitle.textContent = "About " + SIMS[activeSim].name;
  modal.setAttribute("aria-labelledby", "info-modal-title");
  const closeBtn = document.createElement("button");
  closeBtn.className = "info-modal-close";
  closeBtn.setAttribute("aria-label", "Close");
  const closeIcon = createSVGIcon(closeIconSVG);
  closeBtn.appendChild(closeIcon);
  function closeModal() {
    modal.style.opacity = "0";
    modal.addEventListener("transitionend", function handler() {
      modal.removeEventListener("transitionend", handler);
      modal.remove();
    });
    document.removeEventListener("keydown", onModalKeydown);
    triggerBtn.focus();
  }
  modal._closeModal = closeModal;
  closeBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    closeModal();
  });
  header.appendChild(hIcon);
  header.appendChild(hTitle);
  header.appendChild(closeBtn);

  // Body
  const body = document.createElement("div");
  body.className = "info-modal-body";
  body.innerHTML = SIMS[activeSim].about || "";

  body.setAttribute("tabindex", "0");
  const bodyWrap = document.createElement("div");
  bodyWrap.className = "info-modal-body-wrap";
  bodyWrap.appendChild(body);
  const bodyFocusRing = document.createElement("div");
  bodyFocusRing.className = "scroll-focus-ring";
  bodyWrap.appendChild(bodyFocusRing);
  modal.appendChild(header);
  modal.appendChild(bodyWrap);
  // Append to content-area (parent of title bar)
  const contentArea = mountEl;
  if (contentArea) contentArea.appendChild(modal);
  // Hung under whatever opened it, right edges aligned, rather than pinned to the
  // top-right of the content area — that was written for the title bar, where the
  // trigger happened to be in the corner. Anchoring to the trigger gives the same
  // result there and follows the button now that it sits over on the left.
  if (contentArea && triggerBtn) {
    const t = triggerBtn.getBoundingClientRect();
    const c = contentArea.getBoundingClientRect();
    const w = modal.getBoundingClientRect().width;
    modal.style.top = Math.round(t.bottom - c.top + 6) + "px";
    // Aligned to the trigger's right edge, but never so far that the modal's own
    // left edge leaves the content area — in the narrow layouts the button sits
    // well inside the modal's width.
    const wanted = Math.round(c.right - t.right);
    const most = Math.round(c.width - w - 10);
    modal.style.right = Math.max(10, Math.min(wanted, most)) + "px";
  }
  requestAnimationFrame(() => { modal.style.opacity = "1"; });

  // Dragging (pointer events: mouse + touch + pen)
  let dragX = 0, dragY = 0, modalX = 0, modalY = 0, dragging = false;
  header.addEventListener("pointerdown", (e) => {
    if (e.target === closeBtn || closeBtn.contains(e.target)) return;
    dragging = true;
    dragX = e.clientX - modalX;
    dragY = e.clientY - modalY;
    header.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  header.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    modalX = e.clientX - dragX;
    modalY = e.clientY - dragY;
    modal.style.transform = "translate(" + modalX + "px, " + modalY + "px)";
  });
  header.addEventListener("pointerup", () => { if (dragging) modal.focus(); dragging = false; });
  header.addEventListener("pointercancel", () => { dragging = false; });

  // Keyboard dragging (Alt+Arrow)
  modal.addEventListener("keydown", (e) => {
    if (!e.altKey) return;
    const step = e.shiftKey ? 40 : 10;
    let dx = 0, dy = 0;
    if (e.key === "ArrowLeft") dx = -step;
    else if (e.key === "ArrowRight") dx = step;
    else if (e.key === "ArrowUp") dy = -step;
    else if (e.key === "ArrowDown") dy = step;
    else return;
    e.preventDefault();
    modalX += dx;
    modalY += dy;
    modal.style.transform = "translate(" + modalX + "px, " + modalY + "px)";
  });

  // Escape to close + focus trap
  function onModalKeydown(e) {
    if (e.key === "Escape") { closeModal(); return; }
    if (e.key === "Tab") {
      var focusable = modal.querySelectorAll('button, [tabindex="0"]');
      if (focusable.length === 0) return;
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (e.shiftKey) {
        if (document.activeElement === first) { e.preventDefault(); last.focus(); }
      } else {
        if (document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    }
  }
  document.addEventListener("keydown", onModalKeydown);

  closeBtn.focus();
}

// =====================================================================
// Shared query filter — "consistently available in all interfaces"
// (Day 2 spec). The deployed Pathway Explorer parses these with liqe,
// a Lucene-like parser. A prototype in one HTML file cannot pull that
// dependency, so this implements the subset the curriculum actually
// uses, with the same syntax, so queries copy across between the two:
//
//   n:127                      id:8e8b7e9f           (jump to one case)
//   model_correct:0            voices_raised:1 AND pathway_1:>1
//   pathway_3:>2               yandor                (bare word = text)
//   NOT near_water:1           target_label:approach OR pathway_2:<-2
//
// Pathway fields carry the number students see, not the data's index:
// pathway_1 reads act[0]. See PATH_OFFSET.
// =====================================================================
// Students count pathways from 1; the data indexes them from 0.
const PATH_OFFSET = 1;

// Which export the interactive on screen is reading. Everything downstream is
// written against D.nPathways and D.importance rather than a literal 3, so the
// fourth pathway appears on its own wherever this returns the four-pathway set.
function simData() {
  const sim = SIMS[activeSim];
  return (sim && sim.pathways === 4) ? window.NNM_DATA_4 : window.NNM_DATA;
}

// One instance per dataset, built on first use. This used to be a single IIFE
// that captured window.NNM_DATA at load and precomputed FIELDS and the flattened
// rows from it — fine while there was one dataset, wrong the moment Day 2 and
// Day 3 read different ones.
const _filters = {};
function makeFilter(D) {

  // resource_stressed is deliberately absent: on Day 3 it is the planted
  // bias, hidden until students commission the coding. Exposing it in the
  // Day 2 search box would give the answer away before the investigation.
  const HIDDEN_FIELDS = ["resource_stressed"];

  const attrKeys = D.attributeKeys.filter(function (k) { return HIDDEN_FIELDS.indexOf(k) < 0; });
  const attrLabel = {};
  D.attributes.forEach(function (a) { attrLabel[a.key] = a.label; });

  const FIELDS = ["n", "id", "text", "target", "target_label", "prediction", "model_correct"]
    .concat(attrKeys)
    .concat(D.items.length
      ? Array.from({ length: D.nPathways }, function (_, i) { return "pathway_" + (i + PATH_OFFSET); })
      : []);

  // `i` arrives free: FLAT is built with .map, which passes the index.
  function flatten(it, i) {
    const o = {
      // Position in the full 800, so it does not shift when a filter narrows the
      // set — unlike the "3 / 57" counter, which is a position within the results.
      n: i + 1,
      // The hex id the upstream Pathway Explorer uses in its &item= parameter, so
      // a conversation can be named the same way in both places. Matches on a
      // substring, so a leading fragment is enough.
      id: it.id,
      text: it.text.replace(/\n/g, " "),
      target: it.target,
      target_label: it.target === 1 ? "approach" : "wait",
      prediction: it.pred,
      model_correct: it.pred === it.target ? 1 : 0
    };
    for (let p = 0; p < D.nPathways; p++) o["pathway_" + (p + PATH_OFFSET)] = it.act[p];
    D.attributeKeys.forEach(function (k, i) {
      if (HIDDEN_FIELDS.indexOf(k) < 0) o[k] = it.attrs[i];
    });
    return o;
  }
  const FLAT = D.items.map(flatten);

  // ---- tokenizer ----
  function lex(s) {
    const out = [];
    const re = /\s*(\(|\)|"[^"]*"|[^\s()]+)/g;
    let m;
    while ((m = re.exec(s)) !== null) out.push(m[1]);
    return out;
  }

  // ---- recursive descent ----
  function parse(str) {
    const toks = lex(str);
    let i = 0;
    const peek = function () { return toks[i]; };
    const isKw = function (t, kw) { return t && t.toUpperCase() === kw; };

    function parseOr() {
      let left = parseAnd();
      while (isKw(peek(), "OR")) { i++; const right = parseAnd(); left = or(left, right); }
      return left;
    }
    function parseAnd() {
      let left = parseNot();
      while (peek() && peek() !== ")" && !isKw(peek(), "OR")) {
        if (isKw(peek(), "AND")) i++;
        if (!peek() || peek() === ")" || isKw(peek(), "OR")) break;
        const right = parseNot();
        left = and(left, right);
      }
      return left;
    }
    function parseNot() {
      if (isKw(peek(), "NOT")) { i++; const inner = parseNot(); return function (o) { return !inner(o); }; }
      if (peek() && peek()[0] === "-" && peek().length > 1) {
        toks[i] = toks[i].slice(1);
        const inner = parseNot();
        return function (o) { return !inner(o); };
      }
      return parsePrimary();
    }
    function parsePrimary() {
      if (peek() === "(") { i++; const e = parseOr(); if (peek() === ")") i++; return e; }
      const t = toks[i++];
      if (t === undefined) return function () { return true; };
      return term(t);
    }
    function and(a, b) { return function (o) { return a(o) && b(o); }; }
    function or(a, b) { return function (o) { return a(o) || b(o); }; }

    function term(t) {
      const c = t.indexOf(":");
      if (c < 1) {                                   // bare word -> text search
        const needle = t.replace(/^"|"$/g, "").toLowerCase();
        return function (o) { return String(o.text).toLowerCase().indexOf(needle) >= 0; };
      }
      const field = t.slice(0, c);
      let raw = t.slice(c + 1).replace(/^"|"$/g, "");
      if (FIELDS.indexOf(field) < 0) throw new Error("unknown field “" + field + "”");
      const cmp = raw.match(/^(>=|<=|>|<)(.*)$/);
      if (cmp) {
        const n = parseFloat(cmp[2]);
        if (isNaN(n)) throw new Error("“" + cmp[2] + "” is not a number");
        const op = cmp[1];
        return function (o) {
          const v = o[field];
          if (typeof v !== "number") return false;
          return op === ">" ? v > n : op === "<" ? v < n : op === ">=" ? v >= n : v <= n;
        };
      }
      const num = parseFloat(raw);
      const isNum = raw !== "" && !isNaN(num) && /^-?[\d.]+$/.test(raw);
      const needle = raw.toLowerCase();
      return function (o) {
        const v = o[field];
        if (isNum && typeof v === "number") return v === num;
        return String(v).toLowerCase().indexOf(needle) >= 0;
      };
    }

    const fn = parseOr();
    if (i < toks.length) throw new Error("could not read “" + toks.slice(i).join(" ") + "”");
    return fn;
  }

  function run(query) {
    if (!query.trim()) return { items: D.items.slice(), error: null };
    let fn;
    try { fn = parse(query); }
    catch (e) { return { items: null, error: e.message }; }
    const out = [];
    for (let k = 0; k < FLAT.length; k++) if (fn(FLAT[k])) out.push(D.items[k]);
    return { items: out, error: null };
  }

  // ---- the bar ----
  function buildBar(onChange) {
    const bar = document.createElement("div");
    bar.className = "nnm-filterbar";

    const label = document.createElement("label");
    label.className = "nnm-filter-label";
    label.textContent = "Filter";
    const id = "nnm-q-" + Math.floor(performance.now() * 1000 % 1e9);
    label.setAttribute("for", id);

    const input = document.createElement("input");
    input.type = "text";
    input.id = id;
    input.className = "nnm-filter-input";
    input.placeholder = "model_correct:0";
    input.setAttribute("autocomplete", "off");
    input.setAttribute("spellcheck", "false");

    const count = document.createElement("span");
    count.className = "nnm-filter-count";

    const helpBtn = document.createElement("button");
    helpBtn.className = "nnm-filter-help";
    helpBtn.textContent = "?";
    helpBtn.setAttribute("aria-label", "Show what you can search for");
    helpBtn.setAttribute("aria-expanded", "false");

    const help = document.createElement("div");
    help.className = "nnm-filter-helpbox";
    help.hidden = true;
    help.innerHTML =
      '<b>Fields</b><div class="nnm-fieldlist">' +
      FIELDS.map(function (f) { return '<code>' + f + '</code>'; }).join(" ") +
      '</div><b>Examples</b><ul>' +
      '<li><code>n:127</code> — jump to conversation 127 of 800</li>' +
      '<li><code>id:8e8b7e9f</code> — jump to one by id (a fragment is enough)</li>' +
      '<li><code>model_correct:0</code> — the ones the model got wrong</li>' +
      '<li><code>pathway_3:&gt;2</code> — a high score on Pathway 3</li>' +
      '<li><code>voices_raised:1 AND pathway_1:&lt;0</code></li>' +
      '<li><code>yandor</code> — conversations containing that word</li>' +
      '<li><code>NOT near_water:1</code></li>' +
      '</ul>';

    bar.appendChild(label);
    bar.appendChild(input);
    bar.appendChild(count);
    bar.appendChild(helpBtn);

    const wrapEl = document.createElement("div");
    wrapEl.className = "nnm-filterwrap";
    wrapEl.appendChild(bar);
    wrapEl.appendChild(help);

    // About sits beside the filter rather than in a title bar of its own.
    const rowEl = document.createElement("div");
    rowEl.className = "nnm-filterrow";
    rowEl.appendChild(wrapEl);
    const aboutBtn = makeAboutButton();
    rowEl.appendChild(aboutBtn);

    helpBtn.addEventListener("click", function () {
      help.hidden = !help.hidden;
      helpBtn.setAttribute("aria-expanded", help.hidden ? "false" : "true");
    });

    let last = D.items.slice();
    let live = false;
    function apply() {
      const r = run(input.value);
      if (r.error) {
        bar.classList.add("bad");
        count.textContent = r.error;
        count.classList.add("err");
        return;
      }
      bar.classList.remove("bad");
      count.classList.remove("err");
      last = r.items;
      count.textContent = r.items.length === D.items.length
        ? String(D.items.length)
        : r.items.length + " of " + D.items.length;
      if (live) onChange(r.items);
    }
    input.addEventListener("input", apply);
    apply();
    live = true;   // the caller renders the initial state itself

    // The row, not the wrap: callers place one element and get the filter and
    // About together. `about` is handed out as well so a caller can move the
    // button somewhere else — 2B puts it at the right end of its step row — and
    // the filter simply takes the width the button gives up.
    return { el: rowEl, about: aboutBtn, input: input, current: function () { return last; } };
  }

  return { buildBar: buildBar, run: run, FIELDS: FIELDS };
}

function filterFor(D) {
  if (!_filters[D.fit]) _filters[D.fit] = makeFilter(D);
  return _filters[D.fit];
}

// Same surface the call sites already used; each call resolves to the instance
// for whichever dataset the current interactive reads.
const NNM_FILTER = {
  buildBar: function (onFilter) { return filterFor(simData()).buildBar(onFilter); },
  run: function (q) { return filterFor(simData()).run(q); },
  get FIELDS() { return filterFor(simData()).FIELDS; }
};

// Each day's interactive is built here, branching on activeSim.
// Screens not yet built fall through to the blank wrap at the bottom.
// =====================================================================
// Shared by every interactive: the diverging fill ramp and the SVG
// namespace. Blue reads negative, warm reads positive — the same
// convention the shipped Pathway Explorer uses, so a colour means the
// same thing across Day 2, Day 3 and the tool students may already know.
//
// Fills are quantised into five steps rather than a smooth ramp. Every
// continuous ramp has a band where neither dark nor light text reaches
// 4.5:1; stepping over it keeps each level legible, and it also matches
// the handful of distinct tints in the sketch. Verified per level.
// =====================================================================
// Which input the person is using. :focus-visible is meant to answer this, but
// browsers match it on a mouse click for checkboxes and range inputs — they take
// keyboard input, so the heuristic says show the ring. That is right for a text
// field and wrong for a checkbox you just clicked. Tracked here instead, so the
// ring is suppressed for pointer use and kept for Tab.
document.addEventListener("pointerdown", function () {
  document.documentElement.classList.add("nnm-pointer");
}, true);
document.addEventListener("keydown", function (e) {
  if (e.key === "Tab") document.documentElement.classList.remove("nnm-pointer");
}, true);

const SVGNS = "http://www.w3.org/2000/svg";
const FILL_NEG = ["#C8D6E9", "#A9BDD8", "#8DA6CA", "#7694BD", "#1F4E8F"];
const FILL_POS = ["#EFD3C4", "#E0B6A4", "#D29A84", "#C6836C", "#A84A2C"];
const CUTS = [0.12, 0.30, 0.50, 0.75];
// The Prediction Chain's Word Contribution scale is a smooth blend through five
// stops — deep blue, pale blue, white, pale orange, deep orange — evenly spaced.
// This returns the colour at any point on that same ramp, so the correlation
// fills and the key beside them can be continuous rather than bucketed, and a
// cell's colour can be read off the key at any value rather than only at the four
// places the buckets happened to change.
const RAMP_CSS = "#1F4E8F, #C8D6E9, #FFFFFF, #EFD3C4, #A84A2C";
function rampAt(v) {
  const t = Math.min(1, Math.abs(v));
  const ends = v >= 0 ? FILL_POS : FILL_NEG;
  // Two segments a side, matching the gradient's even stops: white to the palest
  // step over the first half, palest to deepest over the second.
  const from = t < 0.5 ? "#FFFFFF" : ends[0];
  const to = t < 0.5 ? ends[0] : ends[4];
  const k = t < 0.5 ? t / 0.5 : (t - 0.5) / 0.5;
  const A = parseInt(from.slice(1), 16), B = parseInt(to.slice(1), 16);
  const mix = function (sh) {
    const a = (A >> sh) & 255, b = (B >> sh) & 255;
    return Math.round(a + (b - a) * k);
  };
  return [mix(16), mix(8), mix(0)];
}
function rampHex(v) {
  const c = rampAt(v);
  return "#" + c.map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
}
// Relative luminance of the ramp at v. A bucket index cannot answer questions
// about the colour once the ramp is continuous; this can.
function rampLum(v) {
  const c = rampAt(v).map(function (x) {
    x /= 255;
    return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
// The label flips to white wherever the fill goes dark enough.
function rampIsDark(v) { return rampLum(v) < 0.30; }
// What to draw a histogram in when it sits ON the ramp. The bars' own #D08A6A is
// itself a colour from this ramp, so somewhere on the scale it matches the fill
// exactly — at r = 0.72 the fill is #D09781 against a #D08A6A bar, a contrast
// ratio of 1.1, and the histogram vanishes. Whichever of white or ink contrasts
// more with the colour behind it, computed rather than thresholded.
function rampBarInk(v) {
  const L = rampLum(v);
  const onWhite = 1.05 / (L + 0.05);
  const onInk = (L + 0.05) / 0.0177;
  return onWhite > onInk ? "#FFFFFF" : "#1E242C";
}

function level(t) {
  for (let i = 0; i < CUTS.length; i++) if (t < CUTS[i]) return i;
  return 4;
}


// =====================================================================
// The conversation panel — filter bar, the case card with its nav, and one
// reading per pathway under the shared word-contribution legend.
//
// Shared by 2B (where it feeds the prediction chain) and 3B (where it feeds
// the observation notes). Only the DOM is shared: each interactive keeps its
// own idea of what to do when the case changes, because 2B has to drive an
// animated chain off it and 3B does not.
// =====================================================================
function tokMax(D) {
  return Math.max.apply(null, Object.keys(D.vocabulary).map(function (w) {
    return Math.abs(D.vocabulary[w][1]);
  }));
}

function pathNames(D) {
  return Array.from({ length: D.nPathways }, function (_, i) {
    return "Pathway " + (i + PATH_OFFSET);
  });
}

function pearson(a, b) {
  const n = a.length;
  let ma = 0, mb = 0;
  for (let i = 0; i < n; i++) { ma += a[i]; mb += b[i]; }
  ma /= n; mb /= n;
  let num = 0, va = 0, vb = 0;
  for (let i = 0; i < n; i++) {
    const da = a[i] - ma, db = b[i] - mb;
    num += da * db; va += da * da; vb += db * db;
  }
  // NaN, not 0. If either series never varies there is no correlation to compute,
  // and returning 0 says "no relationship" — a claim about the data — when the
  // truth is that the question cannot be asked. Callers must test isFinite.
  return (va === 0 || vb === 0) ? NaN : num / Math.sqrt(va * vb);
}

function navGlyph(dir) {
  return '<svg viewBox="0 0 12 12" aria-hidden="true" fill="currentColor" ' +
    'stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="' +
    (dir < 0 ? "M8.4 1.9 L3.6 6 L8.4 10.1 Z" : "M3.6 1.9 L8.4 6 L3.6 10.1 Z") +
    '"/></svg>';
}

function buildCasePanel(opts) {

  const readHead = document.createElement("div");

    '<div class="nnm-legend">' +
      '<div class="nnm-legend-label">Word Contribution</div>' +

        '<span class="grad"></span>' +

  const readScroll = document.createElement("div");

  casePanel.appendChild(caseBody);
  leftCol.appendChild(casePanel);

  // Fills one reading with the conversation, each word this pathway scores
  // tinted on the shared scale. 2B does its own version so it can withhold the
  // colours until the Activate step; this is the plain always-on form.
  function paintReading(p, it) {
    const txt = readings[p].querySelector(".nnm-read-text");
    txt.innerHTML = "";
    it.text.split(/\s+/).forEach(function (w, wi) {
      if (wi) txt.appendChild(document.createTextNode(" "));

      if (v && v[0] === p) {
        const L = level(Math.min(1, Math.abs(v[1]) / TMAX));
        span.classList.add("scored", "lit");
        span.style.setProperty("--tok-bg", (v[1] >= 0 ? FILL_POS : FILL_NEG)[L]);
        span.style.setProperty("--tok-fg", L === 4 ? "#fff" : "#1E242C");
        span.title = w + ": " + (v[1] >= 0 ? "+" : "−") + Math.abs(v[1]).toFixed(4);
      } else if (v) {
        span.title = w + ": a " + NAMES[v[0]] + " word";
      }
      txt.appendChild(span);
    });
  }

  return {
    leftCol: leftCol, filter: filter, emptyMsg: emptyMsg,
    casePanel: casePanel, caseHead: caseHead, caseIdEl: caseIdEl,
    nav: nav, countEl: countEl, prevBtn: prevBtn, nextBtn: nextBtn,
    caseBody: caseBody, readHead: readHead, readScroll: readScroll,
    readings: readings, paintReading: paintReading, TOK_MAX: TMAX, PATH_NAMES: NAMES
  };
}

function buildSimContent() {

  // ---------------------------------------------------------------
  // 3B — Investigate Pathway 4.  The conversation panel from 2B on the
  // left; on the right the observation notes for that conversation and a
  // commissioning list. Pathway 4 lines up with none of the attributes we
  // were given, so students read what an observer wrote down and pay to
  // have a new attribute coded. Three of the four they can commission are
  // decoys — finding the one that fits is the work.
  // ---------------------------------------------------------------
  if (activeSim === "d3b") {
    const D = simData();
    const NP = D.nPathways;
    const items = D.items;
    const NAMES = pathNames(D);
    const BUDGET = 3;
    // The pathway this screen is about. Last of the four: it is the one no known
    // attribute explains (nothing above r = 0.06) and the only one that predicts
    // the model being WRONG (-0.18) — which is why the day sends students here to
    // find the attribute nobody thought to code. The content designer calls it P3;
    // she numbers from 0 and PATH_OFFSET numbers from 1, so it is the same column.
    const FOCUS = NP - 1;
    const HIDDEN = D.attributes
      .map(function (a, i) { return { a: a, i: i }; })
      .filter(function (x) { return x.a.hidden; });

    let cases = items.slice();
    const bought = [];
    const TMAX = tokMax(D);
    // The content designer's own query, translated: her "pathway_3" is this
    // prototype's pathway_4 (she numbers from 0, PATH_OFFSET numbers from 1), and
    // the >2 is an activation, so it carries over unchanged. It leaves 7 of the 63
    // conversations the model got wrong — every one resource-stressed, which is
    // the pattern the commissioning step exists to find. It was >1, which gives 24
    // and the same unanimous answer.
    const DEFAULT_QUERY = "model_correct:0 AND pathway_4:>2";

    const wrap = document.createElement("div");
    wrap.className = "sim-content";
    SIM._timeouts = []; SIM._observers = [];
    const stack = document.createElement("div");
    stack.className = "nnm-stack";
    wrap.appendChild(stack);

    // One row across the top, the way Correlations does it: the query on the left,
    // the day's question in the middle, About in the corner every interactive puts
    // it in.
    const toolbar = document.createElement("div");
    toolbar.className = "d3-toolbar d3b-toolbar";
    stack.appendChild(toolbar);
    const filter = NNM_FILTER.buildBar(function (its) {
      cases = its;
      panes.forEach(function (p, i) { p.idx = Math.min(i, Math.max(0, cases.length - 1)); });
      render();
    });
    filter.el.classList.add("d3-filter");
    toolbar.appendChild(filter.el);
    // Reset, then About. Everything this screen accumulates is undoable in one
    // place: the commissions, where each pane is in the set, and the query itself
    // if it has been edited away from the one the day opens on.
    const resetBtn = document.createElement("button");
    resetBtn.className = "nnm-reset";
    resetBtn.innerHTML = '<span class="glyph">&#8634;</span><span>Reset</span>';
    resetBtn.setAttribute("aria-label", "Clear the commissions and start over");
    resetBtn.addEventListener("click", function () {
      bought.length = 0;
      panes.forEach(function (p, i) { p.idx = i; });

      }
      render();
    });
    toolbar.appendChild(resetBtn);
    if (filter.about) toolbar.appendChild(filter.about);

    const root = document.createElement("div");
    root.className = "nnm";
    stack.appendChild(root);

    // Two conversations, side by side, in identical cards. The finding this screen
    // exists for is that the SAME words keep lighting up and the SAME thing keeps
    // turning up in the notes — neither of which is visible one conversation at a

    // the reading from its notes would break the very pairing being looked for.
    const panes = [0, 1].map(function (slot) {

      prev.className = "nnm-navbtn";
      prev.innerHTML = "&#9664;";
      prev.setAttribute("aria-label", "Previous conversation");
      const next = document.createElement("button");
      next.className = "nnm-navbtn";
      next.innerHTML = "&#9654;";

      head.appendChild(nav);
      panel.appendChild(head);

      const body = document.createElement("div");

      // The same key in both cards, built the way the conversation panel builds it

            '<span class="grad"></span>' +
            '<span class="hi">+' + TMAX.toFixed(4) + '</span></div>' +
        '</div>';
      readHead.setAttribute("role", "img");

      body.appendChild(readHead);

      const readName = document.createElement("div");
      readName.className = "nnm-read-name";
      readName.textContent = NAMES[FOCUS];
      body.appendChild(readName);
      const readText = document.createElement("div");

    // Third column: the one control set on this screen that is not per

    const buyCol = document.createElement("div");
    buyCol.className = "d3b-col d3b-buycol";
    root.appendChild(buyCol);
    const panel = document.createElement("div");
    panel.className = "nnm-panel d3b-panel";
    buyCol.appendChild(panel);
    const pHead = document.createElement("div");
    pHead.className = "nnm-panel-head";

    pTitle.textContent = "Commission coding";
    pHead.appendChild(pTitle);
    const budgetEl = document.createElement("span");
    budgetEl.className = "d3b-budget";

    function rowFor(attrIndex) {

      for (let p = 0; p < NP; p++) {

    }
    function corrChip(r) {
      const el = document.createElement("span");
      el.className = "d3b-chip";

        el.classList.add("undef");
        el.textContent = "\u2014";

        return el;
      }
      const dot = document.createElement("i");
      dot.className = "d3-dot";
      const side = 8 + 22 * Math.sqrt(Math.min(1, Math.abs(r)));
      dot.style.width = side.toFixed(1) + "px";
      dot.style.height = side.toFixed(1) + "px";
      dot.style.background = r === 0 ? "#FFFFFF"
        : (r > 0 ? FILL_POS : FILL_NEG)[level(Math.min(1, Math.abs(r)))];
      const n = document.createElement("span");
      n.textContent = (r >= 0 ? "+" : "−") + Math.abs(r).toFixed(2);
      el.appendChild(dot); el.appendChild(n);

    function renderList() {
      listEl.innerHTML = "";
      HIDDEN.forEach(function (h) {

          btn.textContent = "Commission";
          btn.disabled = bought.length >= BUDGET;
          btn.addEventListener("click", function () {
            if (bought.length >= BUDGET) return;
            bought.push(h.a.key);
            render();
          });
        }
        row.appendChild(name); row.appendChild(desc); row.appendChild(btn);
        listEl.appendChild(row);
      });
    }
    function renderResults() {
      resultEl.innerHTML = "";
      if (!bought.length) return;
      const h = document.createElement("div");
      h.className = "d3b-subhead";
      h.textContent = "What the coding found";
      resultEl.appendChild(h);
      const tbl = document.createElement("div");
      tbl.className = "d3b-table";
      const hdr = document.createElement("div");
      hdr.className = "d3b-trow head";
      hdr.appendChild(document.createElement("div"));
      NAMES.forEach(function (n) {
        const c = document.createElement("div");
        c.textContent = n;
        hdr.appendChild(c);
      });
      tbl.appendChild(hdr);
      bought.forEach(function (key) {
        const h2 = HIDDEN.filter(function (x) { return x.a.key === key; })[0];
        const rs = rowFor(h2.i);
        const tr = document.createElement("div");
        tr.className = "d3b-trow";
        const lab = document.createElement("div");
        lab.textContent = h2.a.label;
        tr.appendChild(lab);
        rs.forEach(function (r) {
          const c = document.createElement("div");
          if (Math.abs(r) >= 0.3) c.className = "hit";
          c.appendChild(corrChip(r));
          tr.appendChild(c);
        });
        tbl.appendChild(tr);
      });
      resultEl.appendChild(tbl);
    }

    // Only the focus pathway is lit. Every word in the vocabulary belongs to
    // exactly one pathway, so the four readings this screen used to show were
    // highlighting four disjoint sets of words in the same sentence — and a
    // student comparing conversations had to subtract three of them by eye to see
    // the one under investigation.
    function paintFocus(el, it) {
      el.innerHTML = "";
      it.text.split(/\s+/).forEach(function (w, wi) {
        if (wi) el.appendChild(document.createTextNode(" "));
        const span = document.createElement("span");
        span.className = "nnm-tok";
        span.textContent = w;
        const v = D.vocabulary[w];
        if (v && v[0] === FOCUS) {
          const L = level(Math.min(1, Math.abs(v[1]) / TMAX));
          span.classList.add("scored", "lit");
          span.style.setProperty("--tok-bg", (v[1] >= 0 ? FILL_POS : FILL_NEG)[L]);
          span.style.setProperty("--tok-fg", L === 4 ? "#fff" : "#1E242C");
          span.title = w + ": " + (v[1] >= 0 ? "+" : "−") + Math.abs(v[1]).toFixed(4);
        } else if (v) {
          span.title = w + ": a " + NAMES[v[0]] + " word";
        }
        el.appendChild(span);
      });
    }

    function render() {
      const empty = cases.length === 0;
      root.style.display = empty ? "none" : "";
      emptyMsg.hidden = !empty;
      budgetEl.textContent = bought.length + " of " + BUDGET + " commissioned";
      // Nothing to clear until something has been done — same rule the Prediction
      // Chain's Reset follows, where it is unavailable until a step has run.
      resetBtn.disabled = !bought.length
        && filter.input.value === DEFAULT_QUERY
        && panes.every(function (p, i) { return p.idx === i; });
      renderList();
      renderResults();
      if (empty) return;

      panes.forEach(function (pane) {
        // Two panes over a set that can be one long: the second pane shows the
        // same conversation rather than nothing, and its nav simply cannot move.
        if (pane.idx >= cases.length) pane.idx = cases.length - 1;
        const it = cases[pane.idx];
        pane.count.textContent = (pane.idx + 1) + " / " + cases.length;
        setAriaDisabled(pane.prev, pane.idx === 0);
        setAriaDisabled(pane.next, pane.idx === cases.length - 1);
        paintFocus(pane.readText, it);
        pane.notes.textContent = it.obs || "(no notes for this conversation)";
        pane.known.innerHTML = "";
        D.attributes.forEach(function (a, i) {
          if (a.hidden && bought.indexOf(a.key) < 0) return;   // not coded yet
          const chip = document.createElement("span");
          const v = it.attrs[i];
          const lab = (a.valueLabels && a.valueLabels[v]) !== undefined
            ? a.valueLabels[v] : String(v);
          chip.className = "d3b-attr" + (a.hidden ? " new" : "") + (v ? " on" : "");
          chip.textContent = a.label + ": " + lab;
          pane.known.appendChild(chip);
        });
      });
    }

    filter.input.value = DEFAULT_QUERY;
    filter.input.dispatchEvent(new Event("input", { bubbles: true }));

    render();
    SIM.onResize = function () {};
    return wrap;
  }


  // ---------------------------------------------------------------
  // 3A — Correlations.  Matches Design Sketches: a matrix of pathways
  // against things we already know how to name, in two views. The point
  // of the day is that a pathway cannot be read directly — you interpret
  // it indirectly, through attributes you can name. Colour convention is
  // the shipped Pathway Explorer's and Day 2's: blue negative, warm positive.
  // ---------------------------------------------------------------
  if (activeSim === "d3a") {
    const D = simData();
    const NP = D.nPathways;
    const ALL = D.items;
    // Correlations are computed over the filtered set, the way the shipped
    // Pathway Explorer does it. That is not a convenience: over all 800 Pathway 4
    // lines up with nothing, and its association with the predicted label only
    // appears once you narrow to the conversations the model got wrong. The
    // filter is how the day's finding is reached.
    let items = ALL.slice();

    const wrap = document.createElement("div");
    wrap.className = "sim-content d3-wrap";
    // invalidateSimCache disconnects whatever is parked here when the sim changes.
    SIM._timeouts = []; SIM._observers = [];

    // ---- the series we can correlate a pathway against ----
    const HIDE = ["resource_stressed", "gestures_repeated", "young_present", "carrying_burden"];
    let rows = [], paths = [], R = [];
    // Read by sizeRows(), which runs from the ResizeObserver as well as from
    // render() and so cannot reach render()'s own locals.
    let rowCount = 0;
    function buildSeries() {
    rows = [
      // Every column lists its 1-coded group FIRST. Three reasons, and they agree:
      // the Prediction Chain puts Approach before Wait because its outcome sits on
      // the sign axis; the key beside this matrix runs +1.0 at the top down to
      // -1.0, so the 1 band on top makes each stack read in the same direction as
      // the colour explaining it; and "correct / wrong", "yes / no" is the order
      // the words go in. Was ascending by code, which is the order the DATA is in,
      // not a reading order anyone chose.
      { key: "target", label: "Actual label", vals: items.map(function (it) { return it.target; }),
        groups: [[1, "Approach"], [0, "Wait"]] },
      { key: "pred", label: "Model prediction", vals: items.map(function (it) { return it.pred; }),
        groups: [[1, "Approach"], [0, "Wait"]] },
      { key: "correct", label: "Model was correct", vals: items.map(function (it) { return it.pred === it.target ? 1 : 0; }),
        // "correct", not "right": in a table with left/right geometry, sitting
        // beside Actual label and Model prediction, "right" reads as a direction
        // before it reads as correctness. It is also the header's own word.
        groups: [[1, "correct"], [0, "wrong"]] }
    ];
    D.attributes.forEach(function (a, i) {
      if (HIDE.indexOf(a.key) >= 0) return;              // Day 3 reveals these later
      const vals = items.map(function (it) { return it.attrs[i]; });
      // Descending, for the same reason the three columns above lead with 1.
      const uniq = Array.from(new Set(vals)).sort(function (x, y) { return y - x; });
      // At most three bands. Group size has six levels, and as a ROW that was six
      // short bar-rows in a 150px stub; as a COLUMN it is six stacked histograms in
      // every cell of that column, which drove the header band and every row to
      // three times the height of the rest of the matrix. Anything with more
      // levels is split at its median instead.
      // The split is for display only — the correlations above are computed on the
      // raw values, so nothing is coarsened in the arithmetic.
      let groups, gvals = null;
      if (uniq.length <= 3) {
        groups = uniq.map(function (v) {
          return [v, (a.valueLabels && a.valueLabels[v]) || String(v)];
        });
      } else {
        const sorted = vals.slice().sort(function (x, y) { return x - y; });
        const mid = sorted[Math.floor(sorted.length / 2)];
        gvals = vals.map(function (v) { return v < mid ? 0 : 1; });
        // Symbols, not words: "3 or more / under 3" was the one pair that read
        // badly once the columns were flipped to lead with their 1-coded group,
        // and it is also the longest label in a band that has ~100px to draw in.
        // "\u22653 / <3" is shorter, exact, and says the split is a threshold
        // rather than two named categories like Approach/Wait.
        groups = [[1, "\u2265 " + mid], [0, "< " + mid]];
      }
      rows.push({ key: a.key, label: a.label, vals: vals, gvals: gvals,
                  groups: groups, integer: a.type === "integer" });
    });

    paths = [];
    rowCount = 0;
    // A whole, symmetric axis — -5 to 5 — rather than the data's own -5.10 to 5.29.
    // Ticks then land ON the ends of the line instead of inside it, so the axis
    // stops where it is labelled; 0 is exactly the middle, which it was not; and
    // every plot in both views shares one round scale.
    //
    // Rounded rather than extended, so it can clip: 2 of 3200 activations fall
    // outside (-5.10 and 5.29), and binCounts already clamps anything out of range
    // into the end bins. That moves them by at most 0.29 — under one bin's 0.37 —
    // and no conversation is dropped from a count.
    const ax = Math.max(1, Math.round(Math.max(
      Math.abs(Math.min.apply(null, D.scoreMin)),
      Math.abs(Math.max.apply(null, D.scoreMax)))));
    const alo = -ax, ahi = ax;
    for (let p = 0; p < NP; p++) {
      paths.push({ label: "Pathway " + (p + PATH_OFFSET),
                   vals: items.map(function (it) { return it.act[p]; }),
                   // The same column over all 800, so the header can show how much
                   // of its usual range the filtered set actually occupies.
                   full: ALL.map(function (it) { return it.act[p]; }),
                   lo: alo, hi: ahi });
    }
    // A "Weighted sum" column used to sit here — the chain's own output, so that
    // reading across the Actual label row showed it landing just BELOW Pathway 1
    // rather than above it. Removed at the content designer's request. The matrix
    // is now the pathways alone; the columns are all things the model reads, with
    // nothing derived from them mixed in. If it ever comes back, it is
    // items.map(it => sum over p of it.act[p] * D.importance[p]), scaled over ALL
    // rather than over the filter so its ruler does not move when the filter does.
    R = rows.map(function (row) {
      return paths.map(function (pa) { return pearson(row.vals, pa.vals); });
    });
    }

    const ACT_LO = Math.min.apply(null, D.scoreMin);
    const ACT_HI = Math.max.apply(null, D.scoreMax);

    // ---- header ----
    // One toolbar: the find bar at the same width it has in the Prediction Chain,
    // so the two interactives read as the same tool, and the view switch on the
    // far right where the Animate toggle sits over there.
    const toolbar = document.createElement("div");
    toolbar.className = "d3-toolbar";
    wrap.appendChild(toolbar);

    const filter = NNM_FILTER.buildBar(function (its) {
      items = its.length ? its : [];
      render();
    });
    filter.el.classList.add("d3-filter");
    toolbar.appendChild(filter.el);

    const head = document.createElement("div");
    head.className = "d3-head";
    const title = document.createElement("div");
    title.className = "d3-title";
    head.appendChild(title);
    // Says the plots can be opened, which nothing else on screen does. It lives in
    // the head row rather than the toolbar for two reasons: the toolbar centres
    // the view switch with auto margins, so anything added there shoves it off the
    // midpoint; and being absolute here, showing and hiding it cannot move the
    // plots below. Centred on the WHOLE row, so it sits on the row's midpoint
    // rather than the midpoint of whatever the title leaves over.
    const viewHint = document.createElement("span");
    viewHint.className = "d3-viewhint";
    viewHint.textContent = "Click a histogram to see it larger";
    viewHint.hidden = true;
    head.appendChild(viewHint);
    const views = document.createElement("div");
    views.className = "d3-views";
    let view = "corr";
    let prevView = "corr";
    const viewSwitch = document.createElement("div");
    viewSwitch.className = "d3-viewswitch";
    function viewLabel(key, text) {
      const b = document.createElement("button");
      b.className = "d3-viewbtn";
      b.textContent = text;
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function () { view = key; render(); });
      return { key: key, el: b };
    }
    // Left to right: correlation, switch, graph.
    // "Correlations" and "Histograms", not "Correlation view" and "Graph view".
    // Two nouns naming what fills a cell, rather than a topic word beside a medium
    // word — and one of them was the name of the whole screen, which made switching
    // away read as leaving the subject rather than going to the evidence for it.
    // "view" is dropped from both: redundant beside a toggle whose only job is
    // switching views. The internal keys stay corr/graph.
    //
    // "Histograms" over "Distributions" for an 8th-grade audience: histograms are
    // 6th-grade content they have drawn (CCSS 6.SP.B.4), while "distribution" is
    // introduced as an abstract property a data set HAS, not as the name of a
    // picture. It is also the word the hint line under the toolbar already uses,
    // and one word for one thing matters more here than the more sophisticated
    // term. "Graphs" was the third candidate and was rejected: at this grade the
    // graph students associate with two variables is the scatter plot (8.SP.A.1),
    // so it would point them at a picture this screen does not contain.
    const corrView = viewLabel("corr", "Correlations");
    const graphView = viewLabel("graph", "Histograms");
    const viewTrack = document.createElement("span");
    viewTrack.className = "d3-switchtrack";
    // Hidden from assistive tech on purpose: the two names beside it are real
    // toggle buttons carrying aria-pressed, so the state and both ways of
    // changing it are already announced. A third control here would be the same
    // choice said a third time. Nothing becomes keyboard-inaccessible — the
    // track is a convenience for pointers.
    viewTrack.setAttribute("aria-hidden", "true");
    const viewThumb = document.createElement("i");
    viewThumb.className = "d3-switchthumb";
    viewTrack.appendChild(viewThumb);
    viewTrack.addEventListener("click", function () {
      view = (view === "corr" ? "graph" : "corr");
      render();
    });
    viewSwitch.appendChild(corrView.el);
    viewSwitch.appendChild(viewTrack);
    viewSwitch.appendChild(graphView.el);
    views.appendChild(viewSwitch);
    const viewBtns = [graphView, corrView];
    // One place that puts the control in step with `view`, called from both paths
    // through render() — the early return for too-few conversations, and the draw.
    function syncViews() {
      viewBtns.forEach(function (v) {
        v.el.classList.toggle("on", v.key === view);
        v.el.setAttribute("aria-pressed", v.key === view ? "true" : "false");
      });
      viewTrack.classList.toggle("graph", view === "graph");
    }
    // About goes INSIDE the right-hand group, not beside it: that leaves the
    // toolbar with exactly two children on the same 440:560 bases the panels
    // below use, so the filter comes out the width it has in the Prediction
    // Chain, and it leaves the switch free to centre in what is left.
    if (filter.about) views.appendChild(filter.about);
    toolbar.appendChild(views);
    wrap.appendChild(head);

    const scrollWrap = document.createElement("div");
    scrollWrap.className = "d3-scrollwrap";
    wrap.appendChild(scrollWrap);
    // The fade belongs to the scroller alone — on the row it would also wash out
    // the bottom of the legend, which does not scroll.
    const fadeBox = document.createElement("div");
    fadeBox.className = "d3-fadebox";
    scrollWrap.appendChild(fadeBox);
    const scroll = document.createElement("div");
    scroll.className = "d3-scroll";
    fadeBox.appendChild(scroll);

    // The key to the fills. Built once; shown only for the view it explains.
    // Stepped, not a smooth gradient: the cells take one of five colours a side,
    // so a continuous bar would promise a precision the matrix does not have.
    // The bands are sized by their span, so the axis stays linear and you can see
    // that the deepest colour covers a quarter of the range while the palest
    // covers an eighth.
    const legend = document.createElement("div");
    legend.className = "d3-legend";
    const legendLabel = document.createElement("div");
    legendLabel.className = "d3-legend-label";
    // Two lines, so it fits the 70px the key already reserves — one line would need
    // ~80 and another 12px off the matrix — and so it reads as a peer of the
    // two-line column headings beside it rather than as a caption.
    //
    // "(r)" and not just "Correlation": the word is already the page title and the
    // name of one of the two views, so on its own it does not say WHICH of the
    // three it labels. r is the symbol every other reading of this number uses —
    // the marker on the bar, the modal header, the cells' own tooltip — and this
    // is the only place the quantity is explained, so it is where the symbol
    // should be introduced.
    ["Correlation", "(r)"].forEach(function (line) {
      const ln = document.createElement("span");
      ln.textContent = line;
      legendLabel.appendChild(ln);
    });
    legend.appendChild(legendLabel);
    // Where the cell under the pointer sits ON the scale. A tooltip can only state
    // a number; this puts it in its place on the ramp, which is the thing the view
    // is trying to teach — overlapping piles are a pale square near the middle of
    // this bar, separated ones a deep square near an end. Shown in both views, and
    // on focus as well as hover, so it is not a mouse-only reading.
    const legendMark = document.createElement("div");
    legendMark.className = "d3-legend-mark";
    legendMark.hidden = true;
    const legendMarkLine = document.createElement("i");
    const legendMarkVal = document.createElement("span");
    legendMarkVal.className = "val";
    legendMark.appendChild(legendMarkLine);
    legendMark.appendChild(legendMarkVal);
    legend.appendChild(legendMark);
    const bar = document.createElement("div");
    bar.className = "d3-legend-bar";
    // One blend, top to bottom, running the shared ramp backwards so +1 is at the
    // top. The same five stops the Prediction Chain's Word Contribution scale
    // uses, drawn the same way — the fills are continuous now, so the key can be
    // too, and the ticks no longer have to sit at the places a bucket changed.
    bar.style.background = "linear-gradient(to bottom, " +
      RAMP_CSS.split(", ").reverse().join(", ") + ")";
    const ticks = document.createElement("div");
    ticks.className = "d3-legend-ticks";
    // Regular quarters now that the ramp is smooth. With a stepped bar the ticks
    // had to sit on the boundaries where the colour changed; with a blend, any
    // even spacing reads correctly.
    [1, 0.75, 0.5, 0.25, 0, -0.25, -0.5, -0.75, -1].forEach(function (v) {
      const t = document.createElement("span");
      t.style.top = (((1 - v) / 2) * 100).toFixed(2) + "%";
      t.textContent = (v > 0 ? "+" : v < 0 ? "\u2212" : "") + Math.abs(v).toFixed(2).replace(/0$/, "");
      if (v === 0) t.classList.add("zero");
      ticks.appendChild(t);
    });
    legend.appendChild(bar);
    legend.appendChild(ticks);
    scrollWrap.appendChild(legend);
    // 2px of slack: a scroller that stops a fraction of a pixel short of the end
    // would otherwise keep the fade up forever.
    function syncFade() {
      const atEnd = scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 2;
      fadeBox.classList.toggle("at-end", atEnd);
    }
    scroll.addEventListener("scroll", syncFade, { passive: true });

    // Delegated, so it survives every rebuild of the grid and costs one listener
    // rather than one per cell. focusin/focusout give keyboard users the same
    // reading.
    //
    // Bound to the DOCUMENT, not to the table or even to this interactive. The
    // rule is simply: whatever the pointer is over, if it is not a cell with a
    // correlation the marker goes. Hung on a container instead, the marker
    // survived every route out that container's own mouseleave did not fire for —
    // and mouseleave is exactly the event that does not fire when the pointer
    // jumps, when a modal opens under it, or when it exits through a child that
    // was removed mid-gesture.
    //
    // It unhooks itself once the legend is off the page, which is what happens
    // when the interactive is torn down on a sim switch — otherwise the closure
    // would be held alive by a listener nothing else knows to remove.
    function markFrom(e) {
      if (!legendMark.isConnected) {
        document.removeEventListener("mouseover", markFrom, true);
        document.removeEventListener("focusin", markFrom, true);
        return;
      }
      const t = e.target;
      const cell = t && t.closest ? t.closest(".d3-cell[data-r]") : null;
      if (cell) showMark(parseFloat(cell.dataset.r)); else hideMark();
    }
    // Capture, so it still runs for targets inside anything that stops bubbling.
    document.addEventListener("mouseover", markFrom, true);
    document.addEventListener("focusin", markFrom, true);
    const sizeWatch = new ResizeObserver(function () {
      sizeRows();
      sizeCorrCells();
      // Also on first mount: render() runs before the panel has a size, so this is
      // where the plots first get a real one.
      fitPlots();
      syncFade();
    });
    sizeWatch.observe(scroll);
    SIM._observers.push(sizeWatch);

    const note = document.createElement("div");
    note.className = "d3-note";
    wrap.appendChild(note);
    // Hidden, not just emptied. wrap is a flex column with a 10px gap, so an empty
    // note still costs the table that gap plus its own 2px — the table stopped
    // 12px above the bottom of the content area, where the Prediction Chain's
    // cards run all the way down to it. `hidden` takes it out of the flex flow
    // entirely, gap included.
    function setNote(html) {
      note.innerHTML = html || "";
      note.hidden = !html;
    }

    // Picks the largest square that still leaves every pathway visible, then lets
    // the matrix scroll sideways if that many squares do not fit across. Floored
    // so the number inside stays readable, capped so four pathways in a tall panel
    // do not become billboards.
    // The square is a mark drawn INSIDE the cell rather than being the cell. Tying
    // the two together was the whole problem: shrinking the square dragged its
    // column down with it, which broke the headings and forced them to turn 45
    // degrees. Now the grid divides the panel evenly and the square sits in the
    // middle of whatever cell it gets, so both views share one geometry.
    // 46px is the floor the value sets: "\u22120.51" measures 34.7px at 11px mono, and
    // anything narrower lets the text run out under the next square, which paints
    // over it — every column but the last lost its final digit.
    // The stub was 210 because the pathway histogram lives in it. Narrowed to 150:
    // the plot scales to whatever width it gets, and its ticks are short integers
    // now, so it survives the squeeze — and the 60px comes back to the eight
    // columns that carry the actual comparison.
    // HEAD is pinned, not auto. The counts hang out of flow so the name can centre
    // when they are gone — which also means the band would otherwise collapse to
    // the name's height the moment they went. 77 is the height it measured with
    // both in flow: 7 padding + 31 name + 4 gap + 26 counts + 7 padding + 2.
    // Fixed, nothing resizes when the view changes; only the name moves.
    const STUB = 150, ROW = 70, HEAD = 77, GAP = 1;
    // The gap the name and the range bar open between them once the plot is gone.
    // Must match .d3-stubinner.noplot .d3-margbox's padding-top.
    const STUB_GAP = 8;

    // Where the heading block rests in each view: flush to the top in graph view,
    // so it reads as a caption for the plot right beneath it; centred in the band
