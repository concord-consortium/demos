<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Net Maker</title>
<style>
/* Self-hosted fonts */
/* Barlow 400 */ @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 400; src: url('fonts/17ef8a066a33.woff2') format('woff2'); }
/* Barlow Condensed 400 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 400; src: url('fonts/343e6c738440.woff2') format('woff2'); }
/* Barlow Condensed 600 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 600; src: url('fonts/07c3c732a90e.woff2') format('woff2'); }
/* Lato 400 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; src: url('fonts/d5b18a30a456.woff2') format('woff2'); }
/* Lato 400i */ @font-face { font-family: 'Lato'; font-style: italic; font-weight: 400; src: url('fonts/lato-italic-400.woff2') format('woff2'); }
/* Lato 700 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 700; src: url('fonts/a658a6a6ab26.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    background: #ededed;
    color: #333;
    letter-spacing: 0.02em;
    padding: 20px;
  }

  /* Main layout: left buttons | viewport | right buttons */
  .main-layout {
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }

  /* Button columns */
  .btn-column {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 150px;
    flex-shrink: 0;
    padding-top: 0;
  }

  .btn-column [role="group"] {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .btn-column-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: -2px;
  }

  /* Day sub-heading inside the Interactives group */
  .day-sublabel {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #6B7280;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 0 2px;
  }
  .day-sublabel::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #C4C9D2;
  }
  .day-sublabel:first-child { margin-top: 0; }
  body.teal-bg .day-sublabel { color: rgba(255,255,255,0.85); }
  body.teal-bg .day-sublabel::after { background: rgba(255,255,255,0.4); }

  .toggle-btn {
    font-family: 'Barlow Condensed', sans-serif;
    /* Prototype chrome, not a student touch target — the 44px minimum doesn't
       apply here. padding + line-height set the real floor, so both move together. */
    padding: 5px 14px;
    min-height: 32px;
    font-size: 18px;
    line-height: 20px;
    font-weight: 600;
    color: #333;
    background: #f0f0f0;
    border: 1px solid #333;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    text-align: left;
    white-space: nowrap;
  }

  .toggle-btn:hover,
  .toggle-btn:focus-visible {
    background: #d8d8d8;
    color: #333;
  }

  .toggle-btn:focus {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px #fff;
  }
  .toggle-btn:focus:not(:focus-visible) {
    outline: none;
    box-shadow: none;
  }
  .toggle-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px #fff;
  }

  body.teal-bg .toggle-btn {
    border-color: #fff;
  }

  body.teal-bg .toggle-btn:focus {
    outline: none;
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px #005FCC, 0 0 0 4px #fff;
  }
  body.teal-bg .toggle-btn:focus:not(:focus-visible) {
    box-shadow: none;
  }
  body.teal-bg .toggle-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px #005FCC, 0 0 0 4px #fff;
  }

  .toggle-btn:active:not(.active) {
    background: #c0c0c0;
  }

  .toggle-btn.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }

  body.teal-bg .toggle-btn.active {
    border-color: #fff;
  }
  /* Viewport display area */
  .viewport-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-left: 1px solid #858585;
    align-self: stretch;
    min-height: calc(100vh - 40px);
    position: relative;
  }

  .viewport-info {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.3;
    color: #333;
    margin-bottom: 12px;
    text-align: center;
    min-height: 2.6em;
    position: relative;
    z-index: 1;
  }

  .viewport-info strong {
    font-weight: 600;
    color: #333;
  }

  /* Device frame */
  .device-frame {
    position: relative;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    box-sizing: content-box;
    border: 2px solid #333;
    transition: width 0.3s ease, height 0.3s ease;
  }

  .device-frame.no-limit {
    border-color: #ccc;
    border-style: dashed;
    background: transparent;
  }

  /* Browser / OS chrome bars */
  .chrome-top {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0 8px;
    position: relative;
  }

  .chrome-top::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    white-space: nowrap;
  }

  .chrome-bottom {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .chrome-bottom::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    text-align: center;
    white-space: nowrap;
  }

  /* Available viewport area */
  .viewport-area {
    background: #0481A0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
    flex: 1;
  }

  /* AP container — floated centered unit */
  .ap-container {
    background: transparent;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .ap-right-column {
    display: flex;
    flex-direction: column;
    width: 767px;
    box-sizing: content-box;
    border: 1px solid #858585;
    margin-right: 26px;
  }

  .ap-header {
    background: #047a99;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .ap-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .ap-body {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  /* Left column for 2-column layout */
  .ap-left-column {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-left: 28px;
    margin-right: 10px;
    transition: width 0.25s ease;
    overflow: hidden;
  }

  .ap-left-toggle {
    background: #3f3f3f;
    display: flex;
    align-items: center;
    position: relative;
    cursor: pointer;
  }

  .ap-left-toggle:hover,
  .ap-left-toggle:focus-visible {
    background: #4a4a4a;
  }

  .ap-left-toggle:active {
    background: #3a3a3a;
  }

  .ap-left-toggle-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    position: absolute;
    left: 181px;
    white-space: nowrap;
  }

  .ap-left-toggle-icon {
    position: absolute;
    right: 20px;
    width: 32px;
    height: 32px;
  }

  .ap-left-toggle-icon-collapsed {
    width: 32px;
    height: 32px;
    margin-top: 5px;
    transform: scaleX(-1);
  }

  .ap-left-toggle-label-collapsed {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    margin-top: 12px;
    white-space: nowrap;
  }

  .ap-left-toggle:focus {
    outline: none;
    box-shadow: inset 0 0 0 2px #005FCC, inset 0 0 0 4px #fff;
  }
  .ap-left-toggle:focus:not(:focus-visible) {
    box-shadow: none;
  }
  .ap-left-toggle:focus-visible {
    outline: none;
    box-shadow: inset 0 0 0 2px #005FCC, inset 0 0 0 4px #fff;
  }

  .ap-left-resources {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .ap-left-resources-header {
    background: #dfdfdf;
    height: 37px;
    padding-left: 20px;
    display: flex;
    align-items: center;
  }

  .ap-left-resources-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #333;
  }

  .ap-left-resources-body {
    flex: 1;
    background: #f4f4f4;
    padding: 25px 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
    overflow: auto;
  }

  .ap-left-resources-body p {
    margin: 0 0 16px 0;
  }

  .ap-left-resources-body p:last-child {
    margin-bottom: 0;
  }

  .ap-left-resources-body ul {
    margin: 0 0 16px 0;
    padding-left: 40px;
  }

  .ap-left-resources-body li {
    margin-bottom: 12px;
  }

  .ap-left-resources-body li:last-child {
    margin-bottom: 0;
  }
  /* Sim title bar */
  .sim-title-bar {
    height: 50px;
    background: var(--sim-title-bar-bg, #fff);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px 0 20px;
    flex-shrink: 0;
    position: relative;
  }

  .sim-title-bar::after {
    content: "";
    position: absolute;
    bottom: calc(-1 * var(--sim-title-accent, 0px));
    left: 0;
    right: 0;
    height: var(--sim-title-accent, 0px);
    background: inherit;
  }

  .sim-title-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sim-title-name {
    font-family: 'Lato', sans-serif;
    font-size: 24px;
    line-height: 1;
    font-weight: 700;
    color: var(--sim-title-text, #333);
    margin: 0;
    font-synthesis: none;
    display: flex;
    align-items: center;
    height: 28px;
  }

  .sim-title-desc {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    color: var(--sim-title-desc, #333);
  }

  .sim-title-right {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .sim-title-logo {
    display: block;
  }

  .sim-info-btn {
    margin-left: 5px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    font-weight: 700;
    padding: 3px 12px 3px 8px;
    height: 34px;
    box-sizing: border-box;
    border: 2px solid var(--sim-about-border, #555);
    border-radius: 6px;
    background: var(--sim-surface, #fff);
    color: var(--sim-about-text, #333);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .sim-info-btn::after {
    content: "";
    position: absolute;
    top: -7px;
    left: 0;
    right: 0;
    bottom: -7px;
  }

  .sim-info-btn.compact-hit::after {
    top: 0;
    bottom: 0;
  }

  .sim-info-btn svg {
    width: 24px;
    height: 24px;
    pointer-events: none;
  }

  .sim-info-btn:hover,
  .sim-info-btn:focus-visible {
    background: var(--sim-btn-hover, #f0f0f0);
  }

  .sim-info-btn:active {
    background: var(--sim-btn-active, #d0d0d0);
  }

  .sim-info-btn:focus {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }
  .sim-info-btn:focus:not(:focus-visible) {
    outline: none;
  }
  .sim-info-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }

  /* Info modal */
  .info-modal {
    position: absolute;
    top: 50px;
    right: 10px;
    width: 400px;
    max-height: 70%;
    background: #fff;
    border: 2px solid var(--sim-about-border, #555);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    z-index: 101;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .info-modal-header {
    display: flex;
    align-items: center;
    padding: 3px 3px 3px 12px;
    height: 52px;
    box-sizing: border-box;
    border-bottom: 1px solid var(--sim-modal-border, #555);
    cursor: grab;
    flex-shrink: 0;
    user-select: none;
    touch-action: none;
    background: var(--sim-surface, #fff);
  }

  .info-modal-header:active {
    cursor: grabbing;
  }

  .info-modal-header-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    margin-right: 10px;
  }

  .info-modal-header-title {
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #333;
    flex: 1;
    margin: 0;
  }

  .info-modal-close {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--sim-surface, #fff);
    border: none;
    cursor: pointer;
    border-radius: 4px;
    padding: 0;
    flex-shrink: 0;
    transition: background-color 0.15s ease;
  }

  .info-modal-close:hover,
  .info-modal-close:focus-visible {
    background: var(--sim-btn-hover, #f0f0f0);
  }

  .info-modal-close:active {
    background: var(--sim-btn-active, #d0d0d0);
  }

  .info-modal-close:focus {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }
  .info-modal-close:focus:not(:focus-visible) {
    outline: none;
  }
  .info-modal-close:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }

  .info-modal-close svg {
    width: 24px;
    height: 24px;
  }

  .info-modal-body {
    padding: 16px 20px 20px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 22px;
    color: #333;
    user-select: text;
  }

  .info-modal-body-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .info-modal-body:focus {
    outline: none;
  }
  .info-modal-body:focus-visible {
    outline: 2px solid transparent;
  }

  .info-modal-body-wrap .scroll-focus-ring {
    border-radius: 0 0 6px 6px;
  }

  .info-modal-body:focus ~ .scroll-focus-ring {
    display: block;
  }
  .info-modal-body:focus:not(:focus-visible) ~ .scroll-focus-ring {
    display: none;
  }
  .info-modal-body:focus-visible ~ .scroll-focus-ring {
    display: block;
  }

  .info-modal-body h3 {
    font-size: 16px;
    font-weight: 700;
    margin: 16px 0 6px;
    color: #333;
  }

  .info-modal-body h3:first-child {
    margin-top: 0;
  }

  .info-modal-body p {
    margin: 0 0 12px;
  }

  .info-modal-body ul,
  .info-modal-body ol {
    margin: 0 0 12px;
    padding-left: 20px;
  }

  .info-modal-body li {
    margin-bottom: 4px;
  }

  /* Question containers below sim content */
  .question-row {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    padding: 0 27px;
    width: 100%;
    box-sizing: border-box;
  }

  .question-container {
    width: 517px;
    display: flex;
    flex-direction: column;
    border: 1px solid #858585;
    box-sizing: content-box;
  }

  .question-header {
    background: #047a99;
    height: 36px;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .question-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .question-body {
    background: #fff;
    flex: 1;
    min-height: 200px;
    padding: 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
  }

  .question-input {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 16px;
    height: 200px;
    margin-top: 10px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-style: italic;
    color: #767676;
    line-height: 1.5;
  }
  .content-area.standalone {
    border: 2px solid var(--sim-panel-border, #555);
    border-radius: 10px;
    box-sizing: content-box;
    overflow: hidden;
  }

  /* Content area */
  .content-area {
    font-family: 'Lato', sans-serif;
    background: var(--sim-content-bg, #fff);
    position: relative;
    flex-shrink: 0;
    transition: width 0.25s ease;
    display: flex;
    flex-direction: column;
    user-select: none;
    overflow: hidden;
  }

  /* Sim content containers */
  .sim-content {
    display: flex;
    gap: 10px;
    padding: 0 10px 10px 10px;
    flex: 1;
    min-height: 0;
  }


  .sim-info-btn svg,
  .info-modal-close svg,
  .info-modal-header-icon {
    color: var(--sim-icon-color, #000);
  }

  #demo-site-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  /* Demo Site entry point is hidden for now. The demo view itself is untouched —
     buildDemoView() / exitDemoView() still work. Delete this one rule to bring it back. */
  #demo-site-divider,
  #demo-site-btn {
    display: none;
  }

  /* ============================================================
     Neural Net Maker interactives
     Signed values are orange-positive / blue-negative throughout.
     ============================================================ */
  .sim-content {
    --nnm-pos: #D9722E;
    --nnm-pos-soft: #FAE6D6;
    --nnm-neg: #3A72BE;
    --nnm-neg-soft: #DCE7F7;
    --nnm-ink: #1E242C;
    --nnm-ink-2: #58616F;
    --nnm-ink-3: #838C99;
    --nnm-rule: #CCD3DD;
    --nnm-rule-soft: #E4E9F0;
    --nnm-surface: #F4F6FA;
    --nnm-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  .nnm-stack { display: flex; flex-direction: column; width: 100%; min-height: 0; flex: 1; padding-top: 9px; }
  .nnm { display: flex; gap: 10px; width: 100%; min-height: 0; flex: 1; }

  /* --- shared query filter --- */
  .nnm-filterwrap { position: relative; flex-shrink: 0; }
  .nnm-filterbar {
    display: flex;
    align-items: center;
    gap: 9px;
    background: #fff;
    border: 1px solid var(--nnm-rule);
    border-radius: 7px;
    padding: 0 8px 0 12px;
    height: 36px;
    box-sizing: border-box;
  }
  .nnm-filterbar.bad { border-color: #C0503E; }
  .nnm-filter-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--nnm-ink-3);
    flex-shrink: 0;
  }
  .nnm-filter-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--nnm-mono);
    font-size: 13px;
    color: var(--nnm-ink);
    padding: 3px 0;
  }
  .nnm-filter-input::placeholder { color: #A6AEBA; }
  .nnm-filter-input:focus-visible { outline: none; }
  .nnm-filterbar:focus-within { border-color: var(--nnm-neg); box-shadow: 0 0 0 2px var(--nnm-neg-soft); }
  .nnm-filter-count {
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--nnm-mono);
    font-size: 11.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .nnm-filter-count.err { color: #C0503E; }
  .nnm-filter-help {
    width: 22px; height: 22px;
    flex-shrink: 0;
    border: 1px solid var(--nnm-rule);
    border-radius: 50%;
    background: #fff;
    color: var(--nnm-ink-2);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .nnm-filter-help:hover { background: var(--nnm-surface); }
  .nnm-filter-help:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .nnm-filter-helpbox {
    position: absolute;
    z-index: 20;
    top: calc(100% + 5px);
    right: 0;
    width: min(430px, 100%);
    background: #fff;
    border: 1px solid var(--nnm-rule);
    border-radius: 7px;
    box-shadow: 0 6px 20px -8px rgba(30,36,44,0.35);
    padding: 11px 13px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--nnm-ink-2);
    max-height: 300px;
    overflow: auto;
  }
  .nnm-filter-helpbox b {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--nnm-ink-3);
    margin: 8px 0 4px;
  }
  .nnm-filter-helpbox b:first-child { margin-top: 0; }
  .nnm-filter-helpbox ul { margin: 0; padding-left: 17px; }
  .nnm-filter-helpbox li { margin-bottom: 3px; }
  .nnm-filter-helpbox code,
  .nnm-fieldlist code {
    font-family: var(--nnm-mono);
    font-size: 11.5px;
    background: var(--nnm-surface);
    border: 1px solid var(--nnm-rule-soft);
    border-radius: 3px;
    padding: 0 4px;
    white-space: nowrap;
  }
  .nnm-fieldlist { display: flex; flex-wrap: wrap; gap: 4px; }
  /* A class-level `display` beats the UA rule for [hidden], so state it back. */
  .nnm-empty[hidden] { display: none; }
  .nnm-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--nnm-ink-3);
    font-size: 15px;
  }
  .nnm-panel {
    background: #fff;
    border: 1px solid var(--nnm-rule);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .nnm-panel-head {
    min-height: 44px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    padding: 9px 14px 8px;
    border-bottom: 1px solid var(--nnm-rule-soft);
    background: var(--nnm-surface);
    border-radius: 7px 7px 0 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .nnm-panel-body { padding: 12px 14px; overflow: auto; min-height: 0; flex: 1; }
  /* The two scrolling panels give up their right padding so the scroll container
     reaches the card edge and its bar rides there rather than floating 14px in.
     The inset moves onto the scrolling content itself, which keeps text off the
     bar without pulling the bar inwards. */
  .nnm-readings .nnm-panel-body,
  .nnm-flowpanel .nnm-panel-body { padding-right: 0; }
  .nnm-readhead { padding-right: 14px; }
  /* Exactly .nnm-flowbodywrap's box, so the two scrollers — and so the two
     scrollbars — start and end on the same lines. The 5/6px inset with matching
     negative margin buys focus-ring room without displacing anything. */
  .nnm-readscroll { padding: 5px 14px 5px 6px; margin: -5px 0 -5px -6px; }
  .nnm-readings, .nnm-flowpanel { --nnm-row-gap: 30px; }

  /* --- case navigator --- */
  .nnm-nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .nnm-navbtn {
    width: 36px; height: 36px;
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--nnm-rule);
    background: #fff;
    border-radius: 5px;
    cursor: pointer;
    color: var(--nnm-ink-2);
    padding: 0;
  }
  /* Drawn rather than typed. The ◀ ▶ characters carry their own side bearings and
     baseline offset, so they sit off-centre in the button by an amount that
     depends on the font — a symmetric viewBox centres exactly and always. */
  .nnm-navbtn svg { width: 19px; height: 19px; display: block; }
  .nnm-navbtn:hover:not([aria-disabled="true"]) { background: var(--nnm-surface); }
  .nnm-navbtn:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .nnm-navbtn[aria-disabled="true"] { opacity: 0.35; cursor: default; }
  .nnm-count {
    font-family: var(--nnm-mono);
    font-size: 11.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    text-transform: none;
    letter-spacing: 0;
  }

  /* --- alien conversation --- */
  .nnm-alien {
    font-family: var(--nnm-mono);
    font-size: 14px;
    line-height: 1.85;
    color: var(--nnm-ink);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .nnm-caseid {
    font-family: var(--nnm-mono);
    font-size: 11px;
    color: var(--nnm-ink-3);
    text-transform: none;
    letter-spacing: 0;
  }
  .nnm-decidewrap {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex-shrink: 0;
  }
  .nnm-deciderow { position: relative; display: flex; align-items: stretch; }
  /* Sits under the sum and the outcome it is being compared against, in a narrow
     column, so the two facts stack rather than running side by side. */
  /* Out of the flow, like the sum's caption before it. Left in, the wrapper
     centres the sum row plus these labels as one group, which lifts the sum
     half the labels' height above the centre of the three pathways. */
  /* Anchored on the right so the two rows line up with each other rather than
     ragging out from a shared left edge — the values are what is being compared,
     and they are the last thing on each line. */
  .nnm-labels {
    position: absolute;
    top: calc(100% + 16px);
    right: 6px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .nnm-labels .nnm-label-row { justify-content: flex-end; }
  /* In the narrow layout the labels rejoin the flow, so the row must wrap or they
     sit alongside the sum and push the panel wide. */
  .nnm-flowbody.narrow .nnm-deciderow { flex-wrap: wrap; }
  .nnm-flowbody.narrow .nnm-labels {
    position: static;
    width: 100%;
    margin-top: 12px;
    padding-left: 0;
  }
  .nnm-label-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--nnm-ink-2);
  }
  .nnm-label-row b {
    font-weight: 400;
    color: var(--nnm-ink-3);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .nnm-pill {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 9px;
    border-radius: 11px;
    border: 1px solid currentColor;
  }
  .nnm-pill.approach { color: var(--nnm-pos); background: var(--nnm-pos-soft); }
  .nnm-pill.wait { color: var(--nnm-neg); background: var(--nnm-neg-soft); }
  .nnm-flag {
    font-size: 12px;
    font-weight: 700;
    color: #A03A2B;
    background: #FBE3DF;
    border-radius: 4px;
    padding: 1px 6px;
  }

  .nnm-tok {
    border-radius: 3px;
    padding: 1px 2px;
    margin: 0 -1px;
    /* The scan rule is an inset shadow, not an outline or a border. An outline is
       drawn outside the box, so adjacent words' outlines overlapped in the ~3.6px
       of a space; a border would reflow the sentence as each word gained one.
       Inset draws within the padding, so words can sit as tight as they like. */
    box-shadow: inset 0 0 0 0 transparent;
    transition: background-color 0.22s ease, color 0.22s ease, box-shadow 0.18s ease;
  }
  .nnm-tok.scanning { box-shadow: inset 0 0 0 1.5px var(--nnm-ink); }
  /* A scored word carries its colour but does not show it until it is lit —
     the Words step lights them one at a time, in sentence order. */
  .nnm-tok.scored.lit {
    background: var(--tok-bg);
    color: var(--tok-fg);
  }
  /* Clones that travel from the reading into the activation cell they feed.
     Fixed to the body so they are not clipped by either panel. */
  /* The travelling chip carries the word and the score it is about to add. */
  .nnm-fly {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    border-radius: 4px;
    padding: 2px 6px;
    white-space: nowrap;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    box-shadow: 0 2px 8px -2px rgba(30,36,44,0.4);
    will-change: transform, opacity;
  }
  /* A small kick each time the running total takes on another word. */
  .nnm-tick { animation: nnm-tick 0.26s ease-out; }
  @keyframes nnm-tick {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.09); }
    100% { transform: scale(1); }
  }
  .nnm-scale {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
    font-family: var(--nnm-mono);
    font-size: 10.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .nnm-scale-bar {
    flex: 1;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(to right, var(--nnm-neg), #fff, var(--nnm-pos));
    border: 1px solid var(--nnm-rule-soft);
  }
  .nnm-reading {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    margin-bottom: 7px;
    flex-shrink: 0;
  }
  .nnm-reading b { color: var(--nnm-ink); font-weight: 600; }

  /* --- left: three readings in one card, per the sketch --- */
  /* 470 tipped the flow into its stacked fallback at AP Full Width: the flow needs
     ~556px and the row only has ~1014 to share. 440 leaves the flow enough. */
  /* Two columns, each a toolbar over a card: find over the conversation,
     the steps over the pathways. Both toolbars are the same height so the
     two panels start on the same line. */
  .nnm-rightcol {
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex: 1 1 560px;
    min-width: 318px;
    min-height: 0;
  }
  /* No card behind these — just the buttons. The 36px height stays so the panel
     below still starts level with the conversation panel. */
  .nnm-steprow {
    display: flex;
    align-items: center;
    height: 36px;
    box-sizing: border-box;
    flex-shrink: 0;
  }
  .nnm-stepgroup {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .nnm-leftcol {
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex: 1 1 440px;
    min-width: 236px;
    min-height: 0;
  }
  .nnm-readings { flex: 1; min-height: 0; }
  .nnm-readhead {
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    line-height: 1.25;
    color: var(--nnm-ink-2);
    min-height: 30px;          /* at least .nnm-flowhead's two-line captions */
    display: flex;
    align-items: flex-end;
    margin-bottom: 28px;
    flex-shrink: 0;
  }
  .nnm-readscroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-gutter: stable;
    display: flex;
    flex-direction: column;
    /* gap comes from --nnm-row-gap, shared with .nnm-frows */
  }
  .nnm-read { border-radius: 5px; padding: 0 5px; box-sizing: border-box; }
  /* Words carry a tooltip once Activate has run — its value here, or where it
     counts instead. Before that there is nothing to tell, so no help cursor. */
  .nnm-read-text .nnm-tok[title] { cursor: help; }
  .nnm-read-name {
    font-family: 'Lato', sans-serif;
    font-size: 12.5px;
    color: var(--nnm-ink-2);
    padding-bottom: 4px;
    border-bottom: 1px solid #B9CBE4;
    margin-bottom: 5px;
  }
  /* Label over the ramp, both filling the caption band. No "Scale" in the name —
     the gradient is visibly one; the legend names the quantity, not the widget. */
  .nnm-legend { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .nnm-legend-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--nnm-ink-3);
    line-height: 1.1;
  }
  .nnm-readhead .nnm-read-scale { margin-bottom: 0; font-size: 12px; }
  .nnm-readhead .nnm-read-scale .grad { height: 12px; border-radius: 3px; }
  .nnm-read-scale {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--nnm-mono);
    font-size: 9.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }
  .nnm-read-scale .grad {
    flex: 1;
    height: 9px;
    border-radius: 2px;
    background: linear-gradient(to right, #1F4E8F, #C8D6E9, #FFFFFF, #EFD3C4, #A84A2C);
  }
  .nnm-read-text {
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    line-height: 1.85;
    color: var(--nnm-ink);
    word-break: break-word;
  }

  /* --- right: the flow diagram --- */
  .nnm-flowpanel { flex: 1; min-height: 0; }
  .nnm-flowouter { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  /* min-height:0 is required — without it a flex child refuses to shrink below its
     content and overflow-y:auto never engages, so the bar escaped the card. */
  .nnm-flowbodywrap {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    min-height: 0;
    flex: 1;
    scrollbar-gutter: stable;
    padding: 5px 14px 5px 6px;
    margin: -5px 0 -5px -6px;
  }
  .nnm-flowhead { padding-right: 14px; box-sizing: border-box; }
  /* Outside the scroller, exactly as the legend is on the readings side, so both
     scrollbars span the same band and neither heading moves. Both scrollers now
     hold only their rows, so the sync — which copies scrollTop straight across —
     still lines them up row for row. */
  .nnm-flowhead {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 0;
    height: 30px;
    /* Matches .nnm-readhead's. alignTops only controls this element's height, and
       the captions are pinned to its bottom edge, so that space opens above them —
       the gap below has to be set here to stay in step with the legend's. */
    margin-bottom: 28px;
    flex-shrink: 0;
    box-sizing: content-box;
  }
  /* Positioned against measured centres rather than flex order. */
  .nnm-flowhead .c.far {
    position: absolute;
    bottom: 0;
    transform: translateX(-50%);
    width: auto;
    white-space: nowrap;
  }
  /* Two words, two lines: kept to the width of a cell so it breaks rather than
     reaching for the panel edge, which it was 13px short of on one line. */
  .nnm-flowhead .c.far.dec {
    white-space: normal;
    width: 82px;
  }
  .nnm-flowhead .c {
    width: 82px;
    flex-shrink: 0;
    text-align: center;
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    line-height: 1.25;
    color: var(--nnm-ink-2);
  }
  .nnm-flowhead .g { width: 30px; flex-shrink: 0; }
  .nnm-flowbody { display: flex; align-items: stretch; flex-shrink: 0; min-width: 0; }
  /* Both columns must use the SAME gap or they drift: syncRows matches each pair's
     height and alignTops pins the first pair, so a difference in gap accumulates
     down the rows and only shows from row 2 onwards. One value, used by both.
     20px is the floor — the number hangs 18px below its cell — and the rest is air. */
  .nnm-readscroll, .nnm-frows { gap: var(--nnm-row-gap); }
  .nnm-frows { display: flex; flex-direction: column; flex-shrink: 0; }
  .nnm-frow { display: flex; align-items: center; gap: 0; border-radius: 5px; box-sizing: border-box; }


  /* ---- 3B Investigate Pathway 3 ---- */
  .d3b-bar { justify-content: flex-start; }
  .d3b-barlabel {
    font-family: 'Lato', sans-serif; font-size: 13px; color: var(--nnm-ink-3); font-style: italic;
  }
  .d3b-panel { flex: 1; min-height: 0; }
  .d3b-body { display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  .d3b-budget {
    margin-left: auto; font-family: var(--nnm-mono); font-size: 11.5px; color: var(--nnm-ink-3);
  }
  .d3b-notes {
    font-family: 'Lato', sans-serif; font-size: 13.5px; line-height: 1.55;
    color: var(--nnm-ink); background: var(--nnm-surface);
    border-left: 3px solid #C6D2E2; border-radius: 0 5px 5px 0; padding: 10px 12px;
  }
  .d3b-known { display: flex; flex-wrap: wrap; gap: 6px; }
  .d3b-attr {
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.03em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--nnm-rule); color: var(--nnm-ink-3); background: #fff;
  }
  .d3b-attr.on { color: var(--nnm-ink); border-color: #B9C7DA; background: #F2F6FB; }
  /* A commissioned attribute is marked so it is obvious which facts were bought. */
  .d3b-attr.new { border-color: #C6836C; color: #A84A2C; background: #FBF1EC; }
  .d3b-subhead {
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--nnm-ink-2);
    border-top: 1px solid var(--nnm-rule-soft); padding-top: 10px;
  }
  .d3b-subnote { font-family: 'Lato', sans-serif; font-size: 12px; color: var(--nnm-ink-3); margin-top: -6px; }
  .d3b-list { display: flex; flex-direction: column; gap: 6px; }
  .d3b-item {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
    align-items: center; padding: 8px 10px;
    border: 1px solid var(--nnm-rule-soft); border-radius: 6px; background: #fff;
  }
  .d3b-item.done { background: #FBF1EC; border-color: #E4CBBF; }
  .d3b-itemname { font-family: 'Lato', sans-serif; font-size: 13.5px; color: var(--nnm-ink); }
  .d3b-itemdesc {
    grid-column: 1; font-family: 'Lato', sans-serif; font-size: 11.5px;
    line-height: 1.4; color: var(--nnm-ink-3);
  }
  .d3b-buy {
    grid-row: 1 / span 2; grid-column: 2;
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 0 12px; height: 32px; box-sizing: border-box;
    border: 2px solid var(--nnm-rule); background: #fff; color: var(--nnm-ink-2);
    border-radius: 5px; cursor: pointer;
  }
  .d3b-buy:hover:not(:disabled) { background: var(--nnm-surface); }
  .d3b-buy:disabled { opacity: 0.45; cursor: default; }
  .d3b-table { display: flex; flex-direction: column; gap: 4px; }
  .d3b-trow {
    display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 6px; align-items: center;
  }
  .d3b-trow > div { font-family: 'Lato', sans-serif; font-size: 12.5px; color: var(--nnm-ink-2); }
  .d3b-trow.head > div { font-size: 11.5px; color: var(--nnm-ink-3); text-align: center; }
  .d3b-trow > div.hit { background: #F7F9FC; border-radius: 5px; }
  .d3b-chip {
    display: flex; align-items: center; justify-content: center; gap: 7px; padding: 4px 0;
    font-family: var(--nnm-mono); font-size: 12px; font-variant-numeric: tabular-nums;
  }

  /* ---- 3A Correlations ---- */
  /* padding-top matches .nnm-stack so the toolbar sits on the same line as 2B's. */
  .d3-wrap { display: flex; flex-direction: column; min-height: 0; gap: 10px; padding-top: 9px; }
  /* The toolbar reuses 2B's column proportions exactly — .nnm's gap, .nnm-leftcol's
     basis, .nnm-rightcol's basis — so the find bar is the same width and sits in the
     same place, and the view switch lands where the Animate toggle does over there. */
  .d3-toolbar { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .d3-filter { flex: 1 1 440px; min-width: 236px; }
  .d3-head { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .d3-title {
    font-family: 'Lato', sans-serif; font-size: 15px; color: var(--nnm-ink-2);
  }
  .d3-views { display: flex; gap: 6px; justify-content: flex-end; flex: 1 1 560px; min-width: 318px; }
  .d3-viewbtn {
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 0 12px; height: 36px; box-sizing: border-box;
    border: 2px solid var(--nnm-rule); background: #fff; color: var(--nnm-ink-2);
    border-radius: 5px; cursor: pointer;
  }
  .d3-viewbtn:hover { background: var(--nnm-surface); }
  .d3-viewbtn.on { background: var(--nnm-ink); border-color: var(--nnm-ink); color: #fff; }
  .d3-scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; }
  .d3-grid {
    display: grid;
    grid-template-columns: 150px repeat(3, 1fr);
    gap: 2px;
    align-items: stretch;
  }
  .d3-colhead, .d3-rowhead {
    font-family: 'Lato', sans-serif; font-size: 12.5px; color: var(--nnm-ink-2);
    display: flex; align-items: center;
  }
  .d3-colhead { justify-content: flex-end; padding-bottom: 6px; border-bottom: 1px solid var(--nnm-rule-soft); }
  .d3-rowhead { justify-content: center; padding-right: 10px; border-right: 1px solid var(--nnm-rule-soft); }
  /* Both header bands stay put while the matrix scrolls under them — with eight
     rows you otherwise lose track of which pathway a column is. Opaque, or the
     cells show through; the corner sits above both where they cross. */
  .d3-colhead, .d3-rowhead, .d3-corner { position: sticky; background: #fff; }
  .d3-colhead { top: 0; z-index: 2; }
  .d3-rowhead { left: 0; z-index: 2; }
  .d3-corner { top: 0; left: 0; z-index: 3; }
  /* The outcome rows are what the model is judged against, not attributes of the
     scene — a heavier rule keeps the two blocks apart, as the explorer does. */
  .d3-rowhead.outcome { color: var(--nnm-ink); font-weight: 600; }
  /* Computed by the chain rather than observed about the scene. */
  .d3-rowhead.derived { color: var(--nnm-ink); font-weight: 600; font-style: italic; }
  /* Computed by the chain rather than read off it — kept visually apart from the
     three pathways it is made from. */
  .d3-colhead.derived { font-style: italic; color: var(--nnm-ink); border-left: 1px solid var(--nnm-rule-soft); }
  .d3-grid > .d3-rowhead.outcome + .d3-cell { background: #FCFCFD; }
  .d3-cell {
    display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 5px; min-height: 62px;
  }
  .d3-cell.corr { gap: 10px; }
  .d3-cell.corr.strong { background: #F7F9FC; box-shadow: inset 0 0 0 1px #DCE3EC; }
  .d3-dot { display: block; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(30,36,44,0.18); flex-shrink: 0; }
  .d3-r {
    font-family: var(--nnm-mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
    color: var(--nnm-ink-2); min-width: 46px;
  }
  .d3-cell.corr.strong .d3-r { color: var(--nnm-ink); font-weight: 700; }
  .d3-cell.graph { padding: 2px; align-items: stretch; }
  /* One dot is one conversation, so they are drawn at whatever size makes the
     tallest stack fit — never capped, or the stacks would stop meaning counts. */
  .d3-plot { display: block; overflow: visible; }
  .d3-pt { fill: #D08A6A; fill-opacity: 0.85; }
  .d3-blabel { font-family: 'Barlow Condensed', sans-serif; font-size: 10.5px; fill: #7B8593; }
  .d3-tick { font-family: var(--nnm-mono); font-size: 8.5px; fill: #97A0AD; }
  .d3-colname { text-align: center; }
  .d3-rowname { }
  .d3-colhead, .d3-rowhead { flex-direction: column; align-items: stretch; gap: 4px; }
  /* The row marginal: how the conversations divide between this row's values,
     which is the thing that decides whether a correlation could exist at all. */
  .d3-marg { display: flex; flex-direction: column; gap: 2px; padding-right: 10px; }
  .d3-margrow {
    display: flex; align-items: center; gap: 5px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 10.5px; color: #7B8593;
  }
  .d3-margrow i { display: block; height: 7px; border-radius: 2px; background: #E0B6A4; flex-shrink: 0; }
  .d3-margrow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .d3-margrow em { font-style: normal; font-family: var(--nnm-mono); font-size: 9.5px; color: #A6AEB9; }
  .d3-note {
    font-family: 'Lato', sans-serif; font-size: 12.5px; line-height: 1.45;
    color: var(--nnm-ink-3); flex-shrink: 0; padding-bottom: 2px;
  }

  .nnm-cell {
    width: 82px;
    height: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(30,36,44,0.14);
    border-radius: 6px;
    font-family: var(--nnm-mono);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    background: #fff;
    transition: background-color 0.35s ease, color 0.35s ease, opacity 0.3s ease;
  }
  /* Importance stays grey: it is the one number that does not change
     from conversation to conversation. */
  /* Importance keeps the same bare-square grammar as the other three columns.
     What marks it as a property of the MODEL rather than a result of a step is
     that it is the only column already showing a real value at step 0, while the
     others still hold their empty stand-ins — and that it never changes as you
     move between conversations. */
  .nnm-cell.imp { color: var(--nnm-ink) !important; }
  .nnm-cell.sum { width: 62px; height: 40px; }
  /* A stage that has not run yet is a stand-in: the box is there so the shape of
     the calculation is visible from the start, but it holds no value and no colour. */
  .nnm-cell.empty, .nnm-out.empty {
    background: repeating-linear-gradient(-45deg, #FAFBFC 0 5px, #F1F3F6 5px 10px) !important;
    border-color: #D8DDE5 !important;
    border-style: dashed !important;
    color: transparent !important;
  }
  .nnm-pop { animation: nnm-pop 0.42s cubic-bezier(0.2, 0.9, 0.3, 1.3); }
  @keyframes nnm-pop {
    from { opacity: 0; transform: scale(0.90); }
    60%  { opacity: 1; }
    to   { opacity: 1; transform: scale(1); }
  }
  .nnm-reset {
    height: 36px;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    border: 2px solid var(--nnm-rule);
    background: #fff;
    border-radius: 5px;
    cursor: pointer;
    color: var(--nnm-ink-2);
    padding: 0 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .nnm-reset .glyph { font-size: 19px; line-height: 1; padding-bottom: 2px; }
  .nnm-reset:hover:not(:disabled) { background: var(--nnm-surface); }
  /* Nothing to clear until a step has run, so it starts unavailable rather than
     inviting a press that would do nothing. */
  .nnm-reset:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .nnm-animtoggle {
    flex-shrink: 0;
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    cursor: pointer;
    user-select: none;
  }
  .nnm-animtoggle input { width: 15px; height: 15px; margin: 0; cursor: pointer; accent-color: var(--nnm-neg); }
  .nnm-animtoggle:hover { color: var(--nnm-ink); }
  .nnm-animtoggle:focus-within { outline: 2px solid var(--nnm-neg); outline-offset: 2px; border-radius: 4px; }

  /* The non-animated version: same screen, every stage arriving at once. */
  .nnm-nomotion .nnm-pop,
  .nnm-nomotion .nnm-tick { animation: none !important; }
  .nnm-nomotion .nnm-cell,
  .nnm-nomotion .nnm-cell.wgt,
  .nnm-nomotion .nnm-sq,
  .nnm-nomotion .nnm-tok { transition: none !important; }
  .nnm-reset:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  /* A fixed-width track for the weighted box, so the box can change size with
     its value without moving the flow's overall width. */
  .nnm-slot {
    width: 82px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }
  /* Resting width sits between the widest and narrowest a value can produce, so
     the Weigh step is seen to widen some boxes and narrow others rather than only
     ever shrinking them. */
  /* A symbol cell holds a square over its number. The square carries magnitude
     by AREA and sign by colour; the number stays put rather than moving above or
     below by sign, so the column can still be scanned. The cell itself goes
     plain — colouring both it and the square would say the same thing twice and
     make the square's edge unreadable against it. */
  /* The square grows from a fixed centre, on the same line as the multiply glyph
     beside it, so it expands in every direction rather than upward off a baseline.
     Both it and the number are taken out of the flow to do that: in flow, a
     growing square pushes the number down the cell, and a label that bobs with
     the value is unreadable. The number is parked at half the LARGEST square plus
     a gap, so it is clear of the square at full size and never moves. */
  .nnm-cell.sym {
    position: relative;
    /* Only tall enough to hold the largest square centred. The number is absolute
       and hangs below into the row gap rather than being contained here — sizing
       the cell to fit it forced a matching 40px of empty space ABOVE the square,
       which nothing used, and pushed the row pitch to 126px for 65px of ink. */
    height: 72px;
    /* Transparent, not white: the connector lines run INTO these cells to reach
       the square in the middle, and an opaque cell paints over the last 25px of
       every line — the ends looked clipped. The square carries the fill, so the
       cell needs none. !important because paint() still writes one inline. */
    background: transparent !important;
    border-color: transparent !important;
  }
  .nnm-cell.sym .nnm-num {
    position: absolute;
    left: 0; right: 0;
    top: calc(50% + 41px);
    text-align: center;
  }
  .nnm-cell.sym .nnm-sq {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
    box-sizing: border-box;
    border: 1px solid transparent;
    border-radius: 3px;
    flex-shrink: 0;
    /* Inset so it never changes the square's measured size — the connector lines
       anchor to that. Keeps a white or very pale square visible on white. */
    box-shadow: inset 0 0 0 1px rgba(30,36,44,0.20);
    transition: width 0.35s cubic-bezier(.3,0,.3,1),
                height 0.35s cubic-bezier(.3,0,.3,1),
                background-color 0.35s ease;
  }
  /* paint() flips the cell's text to white at the top colour level — correct when
     the cell itself carried a dark fill, fatal now that it is forced white and the
     square holds the colour. An explicit colour here beats that inherited value,
     so the number stays legible however dark its square gets. */
  .nnm-cell.sym .nnm-num { line-height: 1; color: #1E242C; }
  /* The weighted box still varies in width, so its own centre slides. The slot
     behind it does not, so the symbol is pinned to that instead and stays put. */
  .nnm-cell.wgt.sym .nnm-sq { left: 41px; }
  .nnm-cell.wgt.sym .nnm-num { left: 0; right: auto; width: 82px; }
  .nnm-flowbody.narrow .nnm-cell.wgt.sym .nnm-sq { left: 37px; }
  .nnm-flowbody.narrow .nnm-cell.wgt.sym .nnm-num { width: 74px; }
  /* Nothing has been computed yet: the stand-in is the smallest square the scale
     can produce, empty. That is also the size a real value starts from, so the
     step grows the square out of the stand-in instead of collapsing a large
     placeholder first. Sized with !important because sizeSym writes the real
     dimensions inline, and .empty is toggled after that. */
  .nnm-cell.sym.empty .nnm-sq {
    width: 12px !important;
    height: 12px !important;
    background: #FFFFFF !important;
  }
  /* Beats the explicit colour that keeps a number legible on a dark square, which
     would otherwise defeat .empty's `color: transparent`. */
  .nnm-cell.sym.empty .nnm-num { color: transparent; }

  .nnm-cell.wgt {
    width: 58px;
    transition: width 0.45s cubic-bezier(.3,0,.3,1), background-color 0.35s ease, color 0.35s ease;
  }
  .nnm-op {
    width: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s ease;
  }
  .nnm-glyph {
    font-family: var(--nnm-mono);
    font-size: 24px;
    line-height: 1;
    color: #C2C9D4;
    display: block;
    transition: color 0.3s ease;
  }
  .nnm-glyph.arr { font-size: 36px; }
  /* The operators darken as the Weigh step reaches them, one row at a time. */
  .nnm-frow.lit-mul .mul .nnm-glyph,
  .nnm-frow.lit-arr .arr .nnm-glyph { color: #6B7583; }
  /* A bigger kick than the cells get. They are small marks with no number to
     carry the change, so the standard 1.09 barely registered on them. */
  .nnm-op.nnm-tick { animation: nnm-tick-op 0.30s ease-out; }
  @keyframes nnm-tick-op {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.34); }
    100% { transform: scale(1); }
  }

  .nnm-conv {
    flex-shrink: 0;
    transition: opacity 0.3s ease;
    overflow: visible;
    pointer-events: none;
  }
  .nnm-tail {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.3s ease;
  }
  /* Lifted out of the flow so only the cell is centred. Left in it, the tail
     centres label-plus-cell as a group, which pushes the cell below the midpoint
     the two answers are centred on — 40px above it and 6px below. */
  .nnm-taillabel {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    line-height: 1.2;
    color: var(--nnm-ink-2);
    text-align: center;
  }
  .nnm-flowbody.narrow .nnm-taillabel {
    position: static;
    transform: none;
    white-space: normal;
  }
  .nnm-fan { width: 40px; flex-shrink: 0; transition: opacity 0.3s ease; overflow: visible; }
  .nnm-outs {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    flex-shrink: 0;
    transition: opacity 0.3s ease;
  }
  .nnm-out {
    width: 74px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    border-radius: 6px;
    border: 1px solid rgba(30,36,44,0.14);
    background: #fff;
    color: var(--nnm-ink-3);
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  .nnm-out.approach.on { background: #EFD3C4; color: #1E242C; }
  .nnm-out.wait.on { background: #1F4E8F; color: #fff; }

  .nnm-flowbody.narrow { flex-wrap: wrap; }
  .nnm-flowbody.narrow .nnm-cell { width: 74px; height: 36px; font-size: 12px; }
  .nnm-flowbody.narrow .nnm-slot { width: 74px; }
  .nnm-flowbody.narrow .nnm-cell.sum { width: 58px; }
  .nnm-flowbody.narrow .nnm-op { width: 26px; }
  .nnm-flowpanel:has(.nnm-flowbody.narrow) .nnm-flowhead .c { width: 74px; }
  .nnm-flowpanel:has(.nnm-flowbody.narrow) .nnm-flowhead .g { width: 26px; }
  .nnm-flowbody.narrow .nnm-out { width: 68px; height: 34px; font-size: 12.5px; }
  .nnm-flowbody.narrow .nnm-conv, .nnm-flowbody.narrow .nnm-fan { display: none; }
  .nnm-flowbody.narrow .nnm-decidewrap { width: 100%; padding-top: 12px; }
  .nnm-flowbody.narrow .nnm-deciderow { align-items: center; gap: 10px; }
  .nnm-flowbody.narrow .nnm-tail { flex-direction: row; gap: 8px; }
  .nnm-flowbody.narrow .nnm-outs { flex-direction: row; gap: 8px; }
  .nnm-flowbody.narrow .nnm-labels { flex-direction: row; gap: 6px 20px; align-items: center; }


  /* --- verdict --- */
  .nnm-verdict {
    margin-top: 14px;
    padding: 11px 13px;
    border: 1px solid var(--nnm-rule);
    border-radius: 7px;
    background: var(--nnm-surface);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    flex-shrink: 0;
  }
  .nnm-verdict-main {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nnm-note {
    min-width: 0;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--nnm-ink-2);
    font-style: italic;
    margin-top: 11px;
  }
  .nnm-note:empty { display: none; }
  .nnm-outs { display: flex; gap: 6px; }
  .nnm-out {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 3px 11px;
    /* Fully rounded rather than a fixed radius, so it stays a true pill at the
       narrow layout's shorter height without a second value to keep in step. */
    border-radius: 999px;
    border: 1px solid var(--nnm-rule);
    color: var(--nnm-ink-3);
    background: #fff;
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  }
  .nnm-out.approach.on { color: var(--nnm-pos); border-color: var(--nnm-pos); background: var(--nnm-pos-soft); }
  .nnm-out.wait.on { color: var(--nnm-neg); border-color: var(--nnm-neg); background: var(--nnm-neg-soft); }

  /* --- step control --- */
  .nnm-step {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0 12px;
    height: 36px;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 2px solid var(--nnm-rule);
    background: #fff;
    color: var(--nnm-ink-2);
    border-radius: 5px;
    cursor: pointer;
  }
  /* Each icon is a miniature of what the step does to the diagram beside it —
     marked-up text, the multiply glyph, the three lines converging, the fork to
     two answers — rather than a generic metaphor. currentColor so they invert
     with the button when it is the active step. */
  .nnm-step svg { width: 13px; height: 13px; flex-shrink: 0; overflow: visible; }
  .nnm-step:hover { background: var(--nnm-surface); }
  .nnm-step.on {
    background: var(--nnm-ink);
    border-color: var(--nnm-ink);
    color: #fff;
  }
  .nnm-step:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .nnm-step[aria-disabled="true"] { opacity: 0.35; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

</style>

<script>
const DEVICES = {
  none: {

    // Append to content-area (parent of title bar)
    const contentArea = bar.parentElement;
    if (contentArea) contentArea.appendChild(modal);
    requestAnimationFrame(() => { modal.style.opacity = "1"; });

    // Dragging (pointer events: mouse + touch + pen)
    let dragX = 0, dragY = 0, modalX = 0, modalY = 0, dragging = false;
    header.addEventListener("pointerdown", (e) => {
      if (e.target === closeBtn || closeBtn.contains(e.target)) return;
      dragging = true;
      dragX = e.clientX - modalX;
      dragY = e.clientY - modalY;
      header.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    header.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      modalX = e.clientX - dragX;
      modalY = e.clientY - dragY;
      modal.style.transform = "translate(" + modalX + "px, " + modalY + "px)";
    });
    header.addEventListener("pointerup", () => { if (dragging) modal.focus(); dragging = false; });
    header.addEventListener("pointercancel", () => { dragging = false; });

    // Keyboard dragging (Alt+Arrow)
    modal.addEventListener("keydown", (e) => {
      if (!e.altKey) return;
      const step = e.shiftKey ? 40 : 10;
      let dx = 0, dy = 0;
      if (e.key === "ArrowLeft") dx = -step;
      else if (e.key === "ArrowRight") dx = step;
      else if (e.key === "ArrowUp") dy = -step;
      else if (e.key === "ArrowDown") dy = step;
      else return;
      e.preventDefault();
      modalX += dx;
      modalY += dy;
      modal.style.transform = "translate(" + modalX + "px, " + modalY + "px)";
    });

    // Escape to close + focus trap
    function onModalKeydown(e) {
      if (e.key === "Escape") { closeModal(); return; }
      if (e.key === "Tab") {
        var focusable = modal.querySelectorAll('button, [tabindex="0"]');
        if (focusable.length === 0) return;
        var first = focusable[0];
        var last = focusable[focusable.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first) { e.preventDefault(); last.focus(); }
        } else {
          if (document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      }
    }
    document.addEventListener("keydown", onModalKeydown);

    closeBtn.focus();
  });

  right.appendChild(ccLogo);
  right.appendChild(infoBtn);

  bar.appendChild(left);
  bar.appendChild(right);
  return bar;
}

// =====================================================================
// Shared query filter — "consistently available in all interfaces"
// (Day 2 spec). The deployed Pathway Explorer parses these with liqe,
// a Lucene-like parser. A prototype in one HTML file cannot pull that
// dependency, so this implements the subset the curriculum actually
// uses, with the same syntax, so queries copy across between the two:
//
//   n:127                      id:8e8b7e9f           (jump to one case)
//   model_correct:0            voices_raised:1 AND pathway_1:>1
//   pathway_3:>2               yandor                (bare word = text)
//   NOT near_water:1           target_label:approach OR pathway_2:<-2
//
// Pathway fields carry the number students see, not the data's index:
// pathway_1 reads act[0]. See PATH_OFFSET.
// =====================================================================
// Students count pathways from 1; the data indexes them from 0.
const PATH_OFFSET = 1;

const NNM_FILTER = (function () {
  const D = window.NNM_DATA;

  // resource_stressed is deliberately absent: on Day 3 it is the planted
  // bias, hidden until students commission the coding. Exposing it in the
  // Day 2 search box would give the answer away before the investigation.
  const HIDDEN_FIELDS = ["resource_stressed"];

  const attrKeys = D.attributeKeys.filter(function (k) { return HIDDEN_FIELDS.indexOf(k) < 0; });
  const attrLabel = {};
  D.attributes.forEach(function (a) { attrLabel[a.key] = a.label; });

  const FIELDS = ["n", "id", "text", "target", "target_label", "prediction", "model_correct"]
    .concat(attrKeys)
    .concat(D.items.length
      ? Array.from({ length: D.nPathways }, function (_, i) { return "pathway_" + (i + PATH_OFFSET); })
      : []);

  // `i` arrives free: FLAT is built with .map, which passes the index.
  function flatten(it, i) {
    const o = {
      // Position in the full 800, so it does not shift when a filter narrows the
      // set — unlike the "3 / 57" counter, which is a position within the results.
      n: i + 1,
      // The hex id the upstream Pathway Explorer uses in its &item= parameter, so
      // a conversation can be named the same way in both places. Matches on a
      // substring, so a leading fragment is enough.
      id: it.id,
      text: it.text.replace(/\n/g, " "),
      target: it.target,
      target_label: it.target === 1 ? "approach" : "wait",
      prediction: it.pred,
      model_correct: it.pred === it.target ? 1 : 0
    };
    for (let p = 0; p < D.nPathways; p++) o["pathway_" + (p + PATH_OFFSET)] = it.act[p];
    D.attributeKeys.forEach(function (k, i) {
      if (HIDDEN_FIELDS.indexOf(k) < 0) o[k] = it.attrs[i];
    });
    return o;
  }
  const FLAT = D.items.map(flatten);

  // ---- tokenizer ----
  function lex(s) {
    const out = [];
    const re = /\s*(\(|\)|"[^"]*"|[^\s()]+)/g;
    let m;
    while ((m = re.exec(s)) !== null) out.push(m[1]);
    return out;
  }

  // ---- recursive descent ----
  function parse(str) {
    const toks = lex(str);
    let i = 0;
    const peek = function () { return toks[i]; };
    const isKw = function (t, kw) { return t && t.toUpperCase() === kw; };

    function parseOr() {
      let left = parseAnd();
      while (isKw(peek(), "OR")) { i++; const right = parseAnd(); left = or(left, right); }
      return left;
    }
    function parseAnd() {
      let left = parseNot();
      while (peek() && peek() !== ")" && !isKw(peek(), "OR")) {
        if (isKw(peek(), "AND")) i++;
        if (!peek() || peek() === ")" || isKw(peek(), "OR")) break;
        const right = parseNot();
        left = and(left, right);
      }
      return left;
    }
    function parseNot() {
      if (isKw(peek(), "NOT")) { i++; const inner = parseNot(); return function (o) { return !inner(o); }; }
      if (peek() && peek()[0] === "-" && peek().length > 1) {
        toks[i] = toks[i].slice(1);
        const inner = parseNot();
        return function (o) { return !inner(o); };
      }
      return parsePrimary();
    }
    function parsePrimary() {
      if (peek() === "(") { i++; const e = parseOr(); if (peek() === ")") i++; return e; }
      const t = toks[i++];
      if (t === undefined) return function () { return true; };
      return term(t);
    }
    function and(a, b) { return function (o) { return a(o) && b(o); }; }
    function or(a, b) { return function (o) { return a(o) || b(o); }; }

    function term(t) {
      const c = t.indexOf(":");
      if (c < 1) {                                   // bare word -> text search
        const needle = t.replace(/^"|"$/g, "").toLowerCase();
        return function (o) { return String(o.text).toLowerCase().indexOf(needle) >= 0; };
      }
      const field = t.slice(0, c);
      let raw = t.slice(c + 1).replace(/^"|"$/g, "");
      if (FIELDS.indexOf(field) < 0) throw new Error("unknown field “" + field + "”");
      const cmp = raw.match(/^(>=|<=|>|<)(.*)$/);
      if (cmp) {
        const n = parseFloat(cmp[2]);
        if (isNaN(n)) throw new Error("“" + cmp[2] + "” is not a number");
        const op = cmp[1];
        return function (o) {
          const v = o[field];
          if (typeof v !== "number") return false;
          return op === ">" ? v > n : op === "<" ? v < n : op === ">=" ? v >= n : v <= n;
        };
      }
      const num = parseFloat(raw);
      const isNum = raw !== "" && !isNaN(num) && /^-?[\d.]+$/.test(raw);
      const needle = raw.toLowerCase();
      return function (o) {
        const v = o[field];
        if (isNum && typeof v === "number") return v === num;
        return String(v).toLowerCase().indexOf(needle) >= 0;
      };
    }

    const fn = parseOr();
    if (i < toks.length) throw new Error("could not read “" + toks.slice(i).join(" ") + "”");
    return fn;
  }

  function run(query) {
    if (!query.trim()) return { items: D.items.slice(), error: null };
    let fn;
    try { fn = parse(query); }
    catch (e) { return { items: null, error: e.message }; }
    const out = [];
    for (let k = 0; k < FLAT.length; k++) if (fn(FLAT[k])) out.push(D.items[k]);
    return { items: out, error: null };
  }

  // ---- the bar ----
  function buildBar(onChange) {
    const bar = document.createElement("div");
    bar.className = "nnm-filterbar";

    const label = document.createElement("label");
    label.className = "nnm-filter-label";
    label.textContent = "Filter";
    const id = "nnm-q-" + Math.floor(performance.now() * 1000 % 1e9);
    label.setAttribute("for", id);

    const input = document.createElement("input");
    input.type = "text";
    input.id = id;
    input.className = "nnm-filter-input";
    input.placeholder = "model_correct:0";
    input.setAttribute("autocomplete", "off");
    input.setAttribute("spellcheck", "false");

    const count = document.createElement("span");
    count.className = "nnm-filter-count";

    const helpBtn = document.createElement("button");
    helpBtn.className = "nnm-filter-help";
    helpBtn.textContent = "?";
    helpBtn.setAttribute("aria-label", "Show what you can search for");
    helpBtn.setAttribute("aria-expanded", "false");

    const help = document.createElement("div");
    help.className = "nnm-filter-helpbox";
    help.hidden = true;
    help.innerHTML =
      '<b>Fields</b><div class="nnm-fieldlist">' +
      FIELDS.map(function (f) { return '<code>' + f + '</code>'; }).join(" ") +
      '</div><b>Examples</b><ul>' +
      '<li><code>n:127</code> — jump to conversation 127 of 800</li>' +
      '<li><code>id:8e8b7e9f</code> — jump to one by id (a fragment is enough)</li>' +
      '<li><code>model_correct:0</code> — the ones the model got wrong</li>' +
      '<li><code>pathway_3:&gt;2</code> — a high score on Pathway 3</li>' +
      '<li><code>voices_raised:1 AND pathway_1:&lt;0</code></li>' +
      '<li><code>yandor</code> — conversations containing that word</li>' +
      '<li><code>NOT near_water:1</code></li>' +
      '</ul>';

    bar.appendChild(label);
    bar.appendChild(input);
    bar.appendChild(count);
    bar.appendChild(helpBtn);

    const wrapEl = document.createElement("div");
    wrapEl.className = "nnm-filterwrap";
    wrapEl.appendChild(bar);
    wrapEl.appendChild(help);

    helpBtn.addEventListener("click", function () {
      help.hidden = !help.hidden;
      helpBtn.setAttribute("aria-expanded", help.hidden ? "false" : "true");
    });

    let last = D.items.slice();
    let live = false;
    function apply() {
      const r = run(input.value);
      if (r.error) {
        bar.classList.add("bad");
        count.textContent = r.error;
        count.classList.add("err");
        return;
      }
      bar.classList.remove("bad");
      count.classList.remove("err");
      last = r.items;
      count.textContent = r.items.length === D.items.length
        ? String(D.items.length)
        : r.items.length + " of " + D.items.length;
      if (live) onChange(r.items);
    }
    input.addEventListener("input", apply);
    apply();
    live = true;   // the caller renders the initial state itself

    return { el: wrapEl, input: input, current: function () { return last; } };
  }

  return { buildBar: buildBar, run: run, FIELDS: FIELDS };
})();

// Each day's interactive is built here, branching on activeSim.
// Screens not yet built fall through to the blank wrap at the bottom.
// =====================================================================
// Shared by every interactive: the diverging fill ramp and the SVG
// namespace. Blue reads negative, warm reads positive — the same
// convention the shipped Pathway Explorer uses, so a colour means the
// same thing across Day 2, Day 3 and the tool students may already know.
//
// Fills are quantised into five steps rather than a smooth ramp. Every
// continuous ramp has a band where neither dark nor light text reaches
// 4.5:1; stepping over it keeps each level legible, and it also matches
// the handful of distinct tints in the sketch. Verified per level.
// =====================================================================
const SVGNS = "http://www.w3.org/2000/svg";
const FILL_NEG = ["#C8D6E9", "#A9BDD8", "#8DA6CA", "#7694BD", "#1F4E8F"];
const FILL_POS = ["#EFD3C4", "#E0B6A4", "#D29A84", "#C6836C", "#A84A2C"];
const CUTS = [0.12, 0.30, 0.50, 0.75];
function level(t) {
  for (let i = 0; i < CUTS.length; i++) if (t < CUTS[i]) return i;
  return 4;
}


// =====================================================================
// The conversation panel — filter bar, the case card with its nav, and one
// reading per pathway under the shared word-contribution legend.
//
// Shared by 2B (where it feeds the prediction chain) and 3B (where it feeds
// the observation notes). Only the DOM is shared: each interactive keeps its
// own idea of what to do when the case changes, because 2B has to drive an
// animated chain off it and 3B does not.
// =====================================================================
function tokMax(D) {
  return Math.max.apply(null, Object.keys(D.vocabulary).map(function (w) {
    return Math.abs(D.vocabulary[w][1]);
  }));
}

function pathNames(D) {
  return Array.from({ length: D.nPathways }, function (_, i) {
    return "Pathway " + (i + PATH_OFFSET);
  });
}

function pearson(a, b) {
  const n = a.length;
  let ma = 0, mb = 0;
  for (let i = 0; i < n; i++) { ma += a[i]; mb += b[i]; }
  ma /= n; mb /= n;
  let num = 0, va = 0, vb = 0;
  for (let i = 0; i < n; i++) {
    const da = a[i] - ma, db = b[i] - mb;
    num += da * db; va += da * da; vb += db * db;
  }
  return (va === 0 || vb === 0) ? 0 : num / Math.sqrt(va * vb);
}

function navGlyph(dir) {
  return '<svg viewBox="0 0 12 12" aria-hidden="true" fill="currentColor" ' +
    'stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="' +
    (dir < 0 ? "M8.4 1.9 L3.6 6 L8.4 10.1 Z" : "M3.6 1.9 L8.4 6 L3.6 10.1 Z") +
    '"/></svg>';
}

function buildCasePanel(opts) {
  const D = window.NNM_DATA;
  const NP = D.nPathways;
  const TMAX = tokMax(D);
  const NAMES = pathNames(D);

  const leftCol = document.createElement("div");
  leftCol.className = "nnm-leftcol";

  const filter = NNM_FILTER.buildBar(opts.onFilter);
  leftCol.appendChild(filter.el);

  const emptyMsg = document.createElement("div");
  emptyMsg.className = "nnm-empty";
  emptyMsg.textContent = "No conversations match that search.";
  emptyMsg.hidden = true;

  const casePanel = document.createElement("div");
  casePanel.className = "nnm-panel nnm-readings";
  casePanel.setAttribute("role", "region");
  casePanel.setAttribute("aria-label", "Conversation");

  const caseHead = document.createElement("div");
  caseHead.className = "nnm-panel-head";
  const caseIdEl = document.createElement("span");
  caseIdEl.textContent = "Conversation";
  caseHead.appendChild(caseIdEl);
  const nav = document.createElement("div");
  nav.className = "nnm-nav";
  const countEl = document.createElement("span");
  countEl.className = "nnm-count";
  const prevBtn = document.createElement("button");
  prevBtn.className = "nnm-navbtn";
  prevBtn.innerHTML = navGlyph(-1);
  prevBtn.setAttribute("aria-label", "Previous conversation");
  const nextBtn = document.createElement("button");
  nextBtn.className = "nnm-navbtn";
  nextBtn.innerHTML = navGlyph(1);
  nextBtn.setAttribute("aria-label", "Next conversation");
  nav.appendChild(countEl); nav.appendChild(prevBtn); nav.appendChild(nextBtn);
  caseHead.appendChild(nav);
  casePanel.appendChild(caseHead);

  const caseBody = document.createElement("div");
  caseBody.className = "nnm-panel-body";
  caseBody.style.display = "flex";
  caseBody.style.flexDirection = "column";
  caseBody.style.overflow = "hidden";

  const readHead = document.createElement("div");
  readHead.className = "nnm-readhead";
  readHead.innerHTML =
    '<div class="nnm-legend">' +
      '<div class="nnm-legend-label">Word Contribution</div>' +
      '<div class="nnm-read-scale"><span class="lo">' + (-TMAX).toFixed(4) + '</span>' +
        '<span class="grad"></span>' +
        '<span class="hi">' + TMAX.toFixed(4) + '</span></div>' +
    '</div>';
  readHead.setAttribute("role", "img");
  readHead.setAttribute("aria-label",
    "Word contribution, shared by all three pathways: " + (-TMAX).toFixed(4) +
    " to " + TMAX.toFixed(4));
  caseBody.appendChild(readHead);

  const readScroll = document.createElement("div");
  readScroll.className = "nnm-readscroll";
  caseBody.appendChild(readScroll);

  const readings = [];
  for (let p = 0; p < NP; p++) {
    const r = document.createElement("div");
    r.className = "nnm-read";
    r.innerHTML =
      '<div class="nnm-read-name">' + NAMES[p] + '</div>' +
      '<div class="nnm-read-text"></div>';
    readScroll.appendChild(r);
    readings.push(r);
  }

  casePanel.appendChild(caseBody);
  leftCol.appendChild(casePanel);
  leftCol.appendChild(emptyMsg);

  // Fills one reading with the conversation, each word this pathway scores
  // tinted on the shared scale. 2B does its own version so it can withhold the
  // colours until the Activate step; this is the plain always-on form.
  function paintReading(p, it) {
    const txt = readings[p].querySelector(".nnm-read-text");
    txt.innerHTML = "";
    it.text.split(/\s+/).forEach(function (w, wi) {
      if (wi) txt.appendChild(document.createTextNode(" "));
      const span = document.createElement("span");
      span.className = "nnm-tok";
      span.textContent = w;
      const v = D.vocabulary[w];
      if (v && v[0] === p) {
        const L = level(Math.min(1, Math.abs(v[1]) / TMAX));
        span.classList.add("scored", "lit");
        span.style.setProperty("--tok-bg", (v[1] >= 0 ? FILL_POS : FILL_NEG)[L]);
        span.style.setProperty("--tok-fg", L === 4 ? "#fff" : "#1E242C");
        span.title = w + ": " + (v[1] >= 0 ? "+" : "−") + Math.abs(v[1]).toFixed(4);
      } else if (v) {
        span.title = w + ": a " + NAMES[v[0]] + " word";
      }
      txt.appendChild(span);
    });
  }

  return {
    leftCol: leftCol, filter: filter, emptyMsg: emptyMsg,
    casePanel: casePanel, caseHead: caseHead, caseIdEl: caseIdEl,
    nav: nav, countEl: countEl, prevBtn: prevBtn, nextBtn: nextBtn,
    caseBody: caseBody, readHead: readHead, readScroll: readScroll,
    readings: readings, paintReading: paintReading, TOK_MAX: TMAX, PATH_NAMES: NAMES
  };
}

function buildSimContent() {

  // ---------------------------------------------------------------
  // 3B — Investigate Pathway 3.  The conversation panel from 2B on the
  // left; on the right the observation notes for that conversation and a
  // commissioning list. Pathway 3 lines up with none of the attributes we
  // were given, so students read what an observer wrote down and pay to
  // have a new attribute coded. Three of the four they can commission are
  // decoys — finding the one that fits is the work.
  // ---------------------------------------------------------------
  if (activeSim === "d3b") {
    const D = window.NNM_DATA;
    const NP = D.nPathways;
    const items = D.items;
    const NAMES = pathNames(D);
    const BUDGET = 3;
    const HIDDEN = D.attributes
      .map(function (a, i) { return { a: a, i: i }; })
      .filter(function (x) { return x.a.hidden; });

    let cases = items.slice();
    let idx = 0;
    const bought = [];

    const wrap = document.createElement("div");
    wrap.className = "sim-content";
    SIM._timeouts = []; SIM._observers = [];
    const stack = document.createElement("div");
    stack.className = "nnm-stack";
    wrap.appendChild(stack);
    const root = document.createElement("div");
    root.className = "nnm";
    stack.appendChild(root);

    const casePane = buildCasePanel({
      onFilter: function (its) { cases = its; idx = 0; render(); }
    });
    root.appendChild(casePane.leftCol);

    const rightCol = document.createElement("div");
    rightCol.className = "nnm-rightcol";
    root.appendChild(rightCol);

    // a toolbar to match the find bar's height, so both cards start level
    const bar = document.createElement("div");
    bar.className = "nnm-steprow d3b-bar";
    const barLabel = document.createElement("div");
    barLabel.className = "d3b-barlabel";
    barLabel.textContent = "What else was going on?";
    bar.appendChild(barLabel);
    rightCol.appendChild(bar);

    const panel = document.createElement("div");
    panel.className = "nnm-panel d3b-panel";
    rightCol.appendChild(panel);
    const pHead = document.createElement("div");
    pHead.className = "nnm-panel-head";
    const pTitle = document.createElement("span");
    pTitle.textContent = "Observation notes";
    pHead.appendChild(pTitle);
    const budgetEl = document.createElement("span");
    budgetEl.className = "d3b-budget";
    pHead.appendChild(budgetEl);
    panel.appendChild(pHead);

    const pBody = document.createElement("div");
    pBody.className = "nnm-panel-body d3b-body";
    panel.appendChild(pBody);

    const notesEl = document.createElement("div");
    notesEl.className = "d3b-notes";
    pBody.appendChild(notesEl);

    const knownEl = document.createElement("div");
    knownEl.className = "d3b-known";
    pBody.appendChild(knownEl);

    const commHead = document.createElement("div");
    commHead.className = "d3b-subhead";
    commHead.textContent = "Commission coding";
    pBody.appendChild(commHead);
    const commNote = document.createElement("div");
    commNote.className = "d3b-subnote";
