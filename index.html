<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Net Maker</title>
<style>
/* Self-hosted fonts */
/* Barlow 400 */ @font-face { font-family: 'Barlow'; font-style: normal; font-weight: 400; src: url('fonts/17ef8a066a33.woff2') format('woff2'); }
/* Barlow Condensed 400 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 400; src: url('fonts/343e6c738440.woff2') format('woff2'); }
/* Barlow Condensed 600 */ @font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 600; src: url('fonts/07c3c732a90e.woff2') format('woff2'); }
/* Lato 400 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 400; src: url('fonts/d5b18a30a456.woff2') format('woff2'); }
/* Lato 400i */ @font-face { font-family: 'Lato'; font-style: italic; font-weight: 400; src: url('fonts/lato-italic-400.woff2') format('woff2'); }
/* Lato 700 */ @font-face { font-family: 'Lato'; font-style: normal; font-weight: 700; src: url('fonts/a658a6a6ab26.woff2') format('woff2'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    background: #ededed;
    color: #333;
    letter-spacing: 0.02em;
    padding: 20px;
  }

  /* Main layout: left buttons | viewport | right buttons */
  .main-layout {
    display: flex;
    align-items: flex-start;
    gap: 24px;
  }

  /* Button columns */
  .btn-column {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 150px;
    flex-shrink: 0;
    padding-top: 0;
  }

  .btn-column [role="group"] {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .btn-column-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: -2px;
  }

  /* Day sub-heading inside the Interactives group */
  .day-sublabel {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #6B7280;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 0 2px;
  }
  .day-sublabel::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #C4C9D2;
  }
  .day-sublabel:first-child { margin-top: 0; }
  body.teal-bg .day-sublabel { color: rgba(255,255,255,0.85); }
  body.teal-bg .day-sublabel::after { background: rgba(255,255,255,0.4); }

  .toggle-btn {
    font-family: 'Barlow Condensed', sans-serif;
    /* Prototype chrome, not a student touch target — the 44px minimum doesn't
       apply here. padding + line-height set the real floor, so both move together. */
    padding: 5px 14px;
    min-height: 32px;
    font-size: 18px;
    line-height: 20px;
    font-weight: 600;
    color: #333;
    background: #f0f0f0;
    border: 1px solid #333;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    text-align: left;
    white-space: nowrap;
  }

  .toggle-btn:hover,
  .toggle-btn:focus-visible {
    background: #d8d8d8;
    color: #333;
  }

  .toggle-btn:focus {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px #fff;
  }
  .toggle-btn:focus:not(:focus-visible) {
    outline: none;
    box-shadow: none;
  }
  .toggle-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px #fff;
  }

  body.teal-bg .toggle-btn {
    border-color: #fff;
  }

  body.teal-bg .toggle-btn:focus {
    outline: none;
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px #005FCC, 0 0 0 4px #fff;
  }
  body.teal-bg .toggle-btn:focus:not(:focus-visible) {
    box-shadow: none;
  }
  body.teal-bg .toggle-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 1px #fff, 0 0 0 3px #005FCC, 0 0 0 4px #fff;
  }

  .toggle-btn:active:not(.active) {
    background: #c0c0c0;
  }

  .toggle-btn.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }

  body.teal-bg .toggle-btn.active {
    border-color: #fff;
  }
  /* Viewport display area */
  .viewport-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-left: 1px solid #858585;
    align-self: stretch;
    min-height: calc(100vh - 40px);
    position: relative;
  }

  .viewport-info {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.3;
    color: #333;
    margin-bottom: 12px;
    text-align: center;
    min-height: 2.6em;
    position: relative;
    z-index: 1;
  }

  .viewport-info strong {
    font-weight: 600;
    color: #333;
  }

  /* Device frame */
  .device-frame {
    position: relative;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
    box-sizing: content-box;
    border: 2px solid #333;
    transition: width 0.3s ease, height 0.3s ease;
  }

  .device-frame.no-limit {
    border-color: #ccc;
    border-style: dashed;
    background: transparent;
  }

  /* Browser / OS chrome bars */
  .chrome-top {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0 8px;
    position: relative;
  }

  .chrome-top::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    white-space: nowrap;
  }

  .chrome-bottom {
    background: #1A2832;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .chrome-bottom::after {
    content: attr(data-label);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    color: #b0b0b0;
    text-align: center;
    white-space: nowrap;
  }

  /* Available viewport area */
  .viewport-area {
    background: #0481A0;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    position: relative;
    overflow: hidden;
    flex: 1;
  }

  /* AP container — floated centered unit */
  .ap-container {
    background: transparent;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .ap-right-column {
    display: flex;
    flex-direction: column;
    width: 767px;
    box-sizing: content-box;
    border: 1px solid #858585;
    margin-right: 26px;
  }

  .ap-header {
    background: #047a99;
    width: 100%;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .ap-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .ap-body {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  /* Left column for 2-column layout */
  .ap-left-column {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-left: 28px;
    margin-right: 10px;
    transition: width 0.25s ease;
    overflow: hidden;
  }

  .ap-left-toggle {
    background: #3f3f3f;
    display: flex;
    align-items: center;
    position: relative;
    cursor: pointer;
  }

  .ap-left-toggle:hover,
  .ap-left-toggle:focus-visible {
    background: #4a4a4a;
  }

  .ap-left-toggle:active {
    background: #3a3a3a;
  }

  .ap-left-toggle-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    position: absolute;
    left: 181px;
    white-space: nowrap;
  }

  .ap-left-toggle-icon {
    position: absolute;
    right: 20px;
    width: 32px;
    height: 32px;
  }

  .ap-left-toggle-icon-collapsed {
    width: 32px;
    height: 32px;
    margin-top: 5px;
    transform: scaleX(-1);
  }

  .ap-left-toggle-label-collapsed {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #dfdfdf;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    margin-top: 12px;
    white-space: nowrap;
  }

  .ap-left-toggle:focus {
    outline: none;
    box-shadow: inset 0 0 0 2px #005FCC, inset 0 0 0 4px #fff;
  }
  .ap-left-toggle:focus:not(:focus-visible) {
    box-shadow: none;
  }
  .ap-left-toggle:focus-visible {
    outline: none;
    box-shadow: inset 0 0 0 2px #005FCC, inset 0 0 0 4px #fff;
  }

  .ap-left-resources {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .ap-left-resources-header {
    background: #dfdfdf;
    height: 37px;
    padding-left: 20px;
    display: flex;
    align-items: center;
  }

  .ap-left-resources-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #333;
  }

  .ap-left-resources-body {
    flex: 1;
    background: #f4f4f4;
    padding: 25px 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
    overflow: auto;
  }

  .ap-left-resources-body p {
    margin: 0 0 16px 0;
  }

  .ap-left-resources-body p:last-child {
    margin-bottom: 0;
  }

  .ap-left-resources-body ul {
    margin: 0 0 16px 0;
    padding-left: 40px;
  }

  .ap-left-resources-body li {
    margin-bottom: 12px;
  }

  .ap-left-resources-body li:last-child {
    margin-bottom: 0;
  }
  /* Sim title bar */
  .sim-title-bar {
    height: 50px;
    background: var(--sim-title-bar-bg, #fff);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px 0 20px;
    flex-shrink: 0;
    position: relative;
  }

  .sim-title-bar::after {
    content: "";
    position: absolute;
    bottom: calc(-1 * var(--sim-title-accent, 0px));
    left: 0;
    right: 0;
    height: var(--sim-title-accent, 0px);
    background: inherit;
  }

  .sim-title-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sim-title-name {
    font-family: 'Lato', sans-serif;
    font-size: 24px;
    line-height: 1;
    font-weight: 700;
    color: var(--sim-title-text, #333);
    margin: 0;
    font-synthesis: none;
    display: flex;
    align-items: center;
    height: 28px;
  }

  .sim-title-desc {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    color: var(--sim-title-desc, #333);
  }

  .sim-title-right {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .sim-title-logo {
    display: block;
  }

  .sim-info-btn {
    margin-left: 5px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 20px;
    font-weight: 700;
    padding: 3px 12px 3px 8px;
    height: 34px;
    box-sizing: border-box;
    border: 2px solid var(--sim-about-border, #555);
    border-radius: 6px;
    background: var(--sim-surface, #fff);
    color: var(--sim-about-text, #333);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }

  .sim-info-btn::after {
    content: "";
    position: absolute;
    top: -7px;
    left: 0;
    right: 0;
    bottom: -7px;
  }

  .sim-info-btn.compact-hit::after {
    top: 0;
    bottom: 0;
  }

  .sim-info-btn svg {
    width: 24px;
    height: 24px;
    pointer-events: none;
  }

  .sim-info-btn:hover,
  .sim-info-btn:focus-visible {
    background: var(--sim-btn-hover, #f0f0f0);
  }

  .sim-info-btn:active {
    background: var(--sim-btn-active, #d0d0d0);
  }

  .sim-info-btn:focus {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }
  .sim-info-btn:focus:not(:focus-visible) {
    outline: none;
  }
  .sim-info-btn:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: 2px;
  }

  /* Info modal */
  .info-modal {
    position: absolute;
    top: 50px;
    right: 10px;
    width: 400px;
    max-height: 70%;
    background: #fff;
    border: 2px solid var(--sim-about-border, #555);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    z-index: 101;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  .info-modal-header {
    display: flex;
    align-items: center;
    padding: 3px 3px 3px 12px;
    height: 52px;
    box-sizing: border-box;
    border-bottom: 1px solid var(--sim-modal-border, #555);
    cursor: grab;
    flex-shrink: 0;
    user-select: none;
    touch-action: none;
    background: var(--sim-surface, #fff);
  }

  .info-modal-header:active {
    cursor: grabbing;
  }

  .info-modal-header-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    margin-right: 10px;
  }

  .info-modal-header-title {
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #333;
    flex: 1;
    margin: 0;
  }

  .info-modal-close {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--sim-surface, #fff);
    border: none;
    cursor: pointer;
    border-radius: 4px;
    padding: 0;
    flex-shrink: 0;
    transition: background-color 0.15s ease;
  }

  .info-modal-close:hover,
  .info-modal-close:focus-visible {
    background: var(--sim-btn-hover, #f0f0f0);
  }

  .info-modal-close:active {
    background: var(--sim-btn-active, #d0d0d0);
  }

  .info-modal-close:focus {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }
  .info-modal-close:focus:not(:focus-visible) {
    outline: none;
  }
  .info-modal-close:focus-visible {
    outline: 2px solid #005FCC;
    outline-offset: -2px;
  }

  .info-modal-close svg {
    width: 24px;
    height: 24px;
  }

  .info-modal-body {
    padding: 16px 20px 20px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    line-height: 22px;
    color: #333;
    user-select: text;
  }

  .info-modal-body-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .info-modal-body:focus {
    outline: none;
  }
  .info-modal-body:focus-visible {
    outline: 2px solid transparent;
  }

  .info-modal-body-wrap .scroll-focus-ring {
    border-radius: 0 0 6px 6px;
  }

  .info-modal-body:focus ~ .scroll-focus-ring {
    display: block;
  }
  .info-modal-body:focus:not(:focus-visible) ~ .scroll-focus-ring {
    display: none;
  }
  .info-modal-body:focus-visible ~ .scroll-focus-ring {
    display: block;
  }

  .info-modal-body h3 {
    font-size: 16px;
    font-weight: 700;
    margin: 16px 0 6px;
    color: #333;
  }

  .info-modal-body h3:first-child {
    margin-top: 0;
  }

  .info-modal-body p {
    margin: 0 0 12px;
  }

  .info-modal-body ul,
  .info-modal-body ol {
    margin: 0 0 12px;
    padding-left: 20px;
  }

  .info-modal-body li {
    margin-bottom: 4px;
  }

  /* Question containers below sim content */
  .question-row {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    padding: 0 27px;
    width: 100%;
    box-sizing: border-box;
  }

  .question-container {
    width: 517px;
    display: flex;
    flex-direction: column;
    border: 1px solid #858585;
    box-sizing: content-box;
  }

  .question-header {
    background: #047a99;
    height: 36px;
    display: flex;
    align-items: center;
    padding: 0;
  }

  .question-header-label {
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-left: 10px;
    line-height: 1;
  }

  .question-body {
    background: #fff;
    flex: 1;
    min-height: 200px;
    padding: 20px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    color: #333;
    line-height: 1.5;
  }

  .question-input {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 16px;
    height: 200px;
    margin-top: 10px;
    font-family: 'Lato', sans-serif;
    font-size: 16px;
    font-style: italic;
    color: #767676;
    line-height: 1.5;
  }
  .content-area.standalone {
    border: 2px solid var(--sim-panel-border, #555);
    border-radius: 10px;
    box-sizing: content-box;
    overflow: hidden;
  }

  /* Content area */
  .content-area {
    font-family: 'Lato', sans-serif;
    background: var(--sim-content-bg, #fff);
    position: relative;
    flex-shrink: 0;
    transition: width 0.25s ease;
    display: flex;
    flex-direction: column;
    user-select: none;
    overflow: hidden;
  }

  /* Sim content containers */
  .sim-content {
    display: flex;
    gap: 10px;
    padding: 0 10px 10px 10px;
    flex: 1;
    min-height: 0;
  }


  .sim-info-btn svg,
  .info-modal-close svg,
  .info-modal-header-icon {
    color: var(--sim-icon-color, #000);
  }

  #demo-site-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  /* Demo Site entry point is hidden for now. The demo view itself is untouched —
     buildDemoView() / exitDemoView() still work. Delete this one rule to bring it back. */
  #demo-site-divider,
  #demo-site-btn {
    display: none;
  }

  /* ============================================================
     Neural Net Maker interactives
     Signed values are orange-positive / blue-negative throughout.
     ============================================================ */
  .sim-content {
    --nnm-pos: #D9722E;
    --nnm-pos-soft: #FAE6D6;
    --nnm-neg: #3A72BE;
    --nnm-neg-soft: #DCE7F7;
    --nnm-ink: #1E242C;
    --nnm-ink-2: #58616F;
    --nnm-ink-3: #838C99;
    --nnm-rule: #CCD3DD;
    --nnm-rule-soft: #E4E9F0;
    --nnm-surface: #F4F6FA;
    --nnm-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  .nnm-stack { display: flex; flex-direction: column; width: 100%; min-height: 0; flex: 1; padding-top: 9px; }
  .nnm { display: flex; gap: 10px; width: 100%; min-height: 0; flex: 1; }

  /* --- shared query filter --- */
  /* The filter and the About button share one row. The filter takes what is left
     after the button, so adding About costs the row no height — which is why it
     lives here rather than in a 50px title bar above the whole interactive. */
  .nnm-filterrow { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .nnm-filterwrap { position: relative; flex: 1; min-width: 0; }
  /* Deliberately NOT a second round mini-button beside the "?" inside the bar.
     That one explains the search box; this one explains the interactive, and two
     22px circles 30px apart would read as a pair with one meaning. Squared off at
     the height of the bar, with a drawn icon and a word, it reads as a peer of the
     step buttons instead — which is what it is. */
  .nnm-about-btn {
    height: 36px;
    box-sizing: border-box;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 10px;
    border: 2px solid var(--nnm-rule);
    border-radius: 5px;
    background: #fff;
    color: var(--nnm-ink-2);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .nnm-blankhead { display: flex; justify-content: flex-end; height: 36px; flex-shrink: 0; }
  .nnm-about-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .nnm-about-btn:hover { background: var(--nnm-surface); }
  /* Same press-is-the-answer rule as every other button here. */
  .nnm-about-btn:active,
  .nnm-about-btn.on { background: var(--nnm-ink); border-color: var(--nnm-ink); color: #fff; }
  .nnm-about-btn:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .nnm-filterbar {
    display: flex;
    align-items: center;
    gap: 9px;
    background: #fff;
    border: 2px solid var(--nnm-rule);
    border-radius: 7px;
    padding: 0 8px 0 12px;
    height: 36px;
    box-sizing: border-box;
  }
  .nnm-filterbar.bad { border-color: #C0503E; }
  .nnm-filter-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    /* ink-2, not ink-3: at 3.4:1 this failed AA, and it is the word that says what
       the box beside it does. Shared by every interactive's filter bar. */
    color: var(--nnm-ink-2);
    flex-shrink: 0;
  }
  .nnm-filter-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--nnm-mono);
    font-size: 13px;
    color: var(--nnm-ink);
    padding: 3px 0;
  }
  .nnm-filter-input::placeholder { color: #A6AEBA; }
  .nnm-filter-input:focus-visible { outline: none; }
  .nnm-filterbar:focus-within { border-color: var(--nnm-neg); box-shadow: 0 0 0 2px var(--nnm-neg-soft); }
  .nnm-filter-count {
    max-width: 45%;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: var(--nnm-mono);
    font-size: 11.5px;
    /* ink-2 with the label beside it: at 3.4:1 this failed AA, and it is the one
       number in the bar a student acts on — how many the query matched. */
    color: var(--nnm-ink-2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .nnm-filter-count.err { color: #C0503E; }
  .nnm-filter-help {
    width: 22px; height: 22px;
    flex-shrink: 0;
    /* Same 2px rule the buttons carry. border-box keeps it 22px across — without
       it the thicker border would push it to 24 and unbalance the filter bar. */
    box-sizing: border-box;
    border: 2px solid var(--nnm-rule);
    border-radius: 50%;
    background: #fff;
    color: var(--nnm-ink-2);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .nnm-filter-help:hover { background: var(--nnm-surface); }
  .nnm-filter-help:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .nnm-filter-helpbox {
    position: absolute;
    z-index: 20;
    top: calc(100% + 5px);
    right: 0;
    width: min(430px, 100%);
    background: #fff;
    border: 1px solid var(--nnm-rule);
    border-radius: 7px;
    box-shadow: 0 6px 20px -8px rgba(30,36,44,0.35);
    padding: 11px 13px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--nnm-ink-2);
    max-height: 300px;
    overflow: auto;
  }
  .nnm-filter-helpbox b {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--nnm-ink-3);
    margin: 8px 0 4px;
  }
  .nnm-filter-helpbox b:first-child { margin-top: 0; }
  .nnm-filter-helpbox ul { margin: 0; padding-left: 17px; }
  .nnm-filter-helpbox li { margin-bottom: 3px; }
  .nnm-filter-helpbox code,
  .nnm-fieldlist code {
    font-family: var(--nnm-mono);
    font-size: 11.5px;
    background: var(--nnm-surface);
    border: 1px solid var(--nnm-rule-soft);
    border-radius: 3px;
    padding: 0 4px;
    white-space: nowrap;
  }
  .nnm-fieldlist { display: flex; flex-wrap: wrap; gap: 4px; }
  /* A class-level `display` beats the UA rule for [hidden], so state it back. */
  .nnm-empty[hidden] { display: none; }
  .nnm-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--nnm-ink-3);
    font-size: 15px;
  }
  .nnm-panel {
    background: #fff;
    border: 1px solid var(--nnm-rule);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .nnm-panel-head {
    min-height: 44px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    padding: 9px 14px 8px;
    border-bottom: 1px solid var(--nnm-rule-soft);
    background: var(--nnm-surface);
    border-radius: 7px 7px 0 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .nnm-panel-body { padding: 12px 14px; overflow: auto; min-height: 0; flex: 1; }
  /* The two scrolling panels give up their right padding so the scroll container
     reaches the card edge and its bar rides there rather than floating 14px in.
     The inset moves onto the scrolling content itself, which keeps text off the
     bar without pulling the bar inwards. */
  .nnm-readings .nnm-panel-body,
  .nnm-flowpanel .nnm-panel-body { padding-right: 0; }
  .nnm-readhead { padding-right: 14px; }
  /* Exactly .nnm-flowbodywrap's box, so the two scrollers — and so the two
     scrollbars — start and end on the same lines. The 5/6px inset with matching
     negative margin buys focus-ring room without displacing anything. */
  .nnm-readscroll { padding: 5px 14px 5px 6px; margin: -5px 0 -5px -6px; }
  .nnm-readings, .nnm-flowpanel { --nnm-row-gap: 30px; }

  /* --- case navigator --- */
  .nnm-nav { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .nnm-navbtn {
    width: 36px; height: 36px;
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--nnm-rule);
    background: #fff;
    border-radius: 5px;
    cursor: pointer;
    color: var(--nnm-ink-2);
    padding: 0;
  }
  /* Drawn rather than typed. The ◀ ▶ characters carry their own side bearings and
     baseline offset, so they sit off-centre in the button by an amount that
     depends on the font — a symmetric viewBox centres exactly and always. */
  .nnm-navbtn svg { width: 19px; height: 19px; display: block; }
  .nnm-navbtn:hover:not([aria-disabled="true"]) { background: var(--nnm-surface); }
  /* Same press as the step buttons: the dark fill, no nudge. The glyph is drawn
     in currentColor, so it turns white with the rest of the button. */
  .nnm-navbtn:active:not([aria-disabled="true"]) {
    background: var(--nnm-ink); border-color: var(--nnm-ink); color: #fff;
  }
  .nnm-navbtn:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  .nnm-navbtn[aria-disabled="true"] { opacity: 0.35; cursor: default; }
  .nnm-count {
    font-family: var(--nnm-mono);
    font-size: 11.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    text-transform: none;
    letter-spacing: 0;
  }

  /* --- alien conversation --- */
  .nnm-alien {
    font-family: var(--nnm-mono);
    font-size: 14px;
    line-height: 1.85;
    color: var(--nnm-ink);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .nnm-caseid {
    font-family: var(--nnm-mono);
    font-size: 11px;
    color: var(--nnm-ink-3);
    text-transform: none;
    letter-spacing: 0;
  }
  .nnm-decidewrap {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex-shrink: 0;
  }
  .nnm-deciderow { position: relative; display: flex; align-items: stretch; }
  /* Sits under the sum and the outcome it is being compared against, in a narrow
     column, so the two facts stack rather than running side by side. */
  /* Out of the flow, like the sum's caption before it. Left in, the wrapper
     centres the sum row plus these labels as one group, which lifts the sum
     half the labels' height above the centre of the three pathways. */
  /* Anchored on the right so the two rows line up with each other rather than
     ragging out from a shared left edge — the values are what is being compared,
     and they are the last thing on each line. */
  .nnm-labels {
    position: absolute;
    top: calc(100% + 16px);
    right: 6px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .nnm-labels .nnm-label-row { justify-content: flex-end; }
  /* In the narrow layout the labels rejoin the flow, so the row must wrap or they
     sit alongside the sum and push the panel wide. */
  .nnm-flowbody.narrow .nnm-deciderow { flex-wrap: wrap; }
  .nnm-flowbody.narrow .nnm-labels {
    position: static;
    width: 100%;
    margin-top: 12px;
    padding-left: 0;
  }
  .nnm-label-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--nnm-ink-2);
  }
  .nnm-label-row b {
    font-weight: 400;
    color: var(--nnm-ink-3);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .nnm-pill {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 9px;
    border-radius: 11px;
    border: 1px solid currentColor;
  }
  .nnm-pill.approach { color: var(--nnm-pos); background: var(--nnm-pos-soft); }
  .nnm-pill.wait { color: var(--nnm-neg); background: var(--nnm-neg-soft); }
  .nnm-flag {
    font-size: 12px;
    font-weight: 700;
    color: #A03A2B;
    background: #FBE3DF;
    border-radius: 4px;
    padding: 1px 6px;
  }

  .nnm-tok {
    border-radius: 3px;
    padding: 1px 2px;
    margin: 0 -1px;
    /* The scan rule is an inset shadow, not an outline or a border. An outline is
       drawn outside the box, so adjacent words' outlines overlapped in the ~3.6px
       of a space; a border would reflow the sentence as each word gained one.
       Inset draws within the padding, so words can sit as tight as they like. */
    box-shadow: inset 0 0 0 0 transparent;
    transition: background-color 0.22s ease, color 0.22s ease, box-shadow 0.18s ease;
  }
  .nnm-tok.scanning { box-shadow: inset 0 0 0 1.5px var(--nnm-ink); }
  /* A scored word carries its colour but does not show it until it is lit —
     the Words step lights them one at a time, in sentence order. */
  .nnm-tok.scored.lit {
    background: var(--tok-bg);
    color: var(--tok-fg);
  }
  /* Clones that travel from the reading into the activation cell they feed.
     Fixed to the body so they are not clipped by either panel. */
  /* The travelling chip carries the word and the score it is about to add. */
  .nnm-fly {
    position: absolute; left: 0; top: 0;
    z-index: 9999;
    pointer-events: none;
    border-radius: 4px;
    padding: 2px 6px;
    white-space: nowrap;
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    box-shadow: 0 2px 8px -2px rgba(30,36,44,0.4);
    will-change: transform, opacity;
  }
  /* A small kick each time the running total takes on another word. */
  .nnm-tick { animation: nnm-tick 0.26s ease-out; }
  @keyframes nnm-tick {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.09); }
    100% { transform: scale(1); }
  }
  .nnm-scale {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
    font-family: var(--nnm-mono);
    font-size: 10.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .nnm-scale-bar {
    flex: 1;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(to right, var(--nnm-neg), #fff, var(--nnm-pos));
    border: 1px solid var(--nnm-rule-soft);
  }
  .nnm-reading {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--nnm-ink-2);
    margin-bottom: 7px;
    flex-shrink: 0;
  }
  .nnm-reading b { color: var(--nnm-ink); font-weight: 600; }

  /* --- left: three readings in one card, per the sketch --- */
  /* 470 tipped the flow into its stacked fallback at AP Full Width: the flow needs
     ~556px and the row only has ~1014 to share. 440 leaves the flow enough. */
  /* Two columns, each a toolbar over a card: find over the conversation,
     the steps over the pathways. Both toolbars are the same height so the
     two panels start on the same line. */
  .nnm-rightcol {
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex: 1 1 560px;
    min-width: 318px;
    min-height: 0;
  }
  /* No card behind these — just the buttons. The 36px height stays so the panel
     below still starts level with the conversation panel. */
  .nnm-steprow {
    position: relative;
    display: flex;
    align-items: center;
    height: 36px;
    box-sizing: border-box;
    flex-shrink: 0;
  }
  /* Left-aligned on the flow panel's own left edge: .nnm-steprow is a sibling of
     the panel inside .nnm-rightcol and neither carries padding, so flex-start
     puts the first button flush with the card below it. */
  .nnm-stepgroup {
    /* Sized to its five buttons rather than to the row, so the free space to the
       right of them is the rule's to centre in. */
    flex: 0 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 6px;
  }
  /* The divider between the five steps and About. `margin: 0 auto` makes it take
     an equal share of the row's free space on each side, which centres it in the
     gap at any panel width and pushes About flush to the right edge without
     taking it out of the flow. At widths where there is no free space the margins
     collapse and it simply sits between the two, which is the right degradation.
     2px and --nnm-rule: the same line the buttons are drawn with. */
  .nnm-steprule {
    width: 2px;
    height: 36px;
    margin: 0 auto;
    flex-shrink: 0;
    background: var(--nnm-rule);
  }
  .nnm-leftcol {
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex: 1 1 440px;
    min-width: 236px;
    min-height: 0;
  }
  .nnm-readings { flex: 1; min-height: 0; }
  .nnm-readhead {
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    line-height: 1.25;
    color: var(--nnm-ink-2);
    min-height: 30px;          /* at least .nnm-flowhead's two-line captions */
    display: flex;
    align-items: flex-end;
    margin-bottom: 28px;
    flex-shrink: 0;
  }
  .nnm-readscroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-gutter: stable;
    display: flex;
    flex-direction: column;
    /* gap comes from --nnm-row-gap, shared with .nnm-frows */
  }
  .nnm-read { border-radius: 5px; padding: 0 5px; box-sizing: border-box; }
  /* Words carry a tooltip once Activate has run — its value here, or where it
     counts instead. Before that there is nothing to tell, so no help cursor. */
  .nnm-read-text .nnm-tok[title] { cursor: help; }
  .nnm-read-name {
    font-family: 'Lato', sans-serif;
    font-size: 12.5px;
    color: var(--nnm-ink-2);
    padding-bottom: 4px;
    border-bottom: 1px solid #B9CBE4;
    margin-bottom: 5px;
  }
  /* The one being read right now. Three sentences scan and fly in turn and
     nothing else says which is which — the highlighting is the thing you are
     already watching, so it cannot also be the thing that tells you where to
     look. The name is left-aligned in a block of its own, so the weight change
     reflows nothing. */
  .nnm-read-name.reading {
    font-weight: 700;
    color: var(--nnm-ink);
    border-bottom-color: var(--nnm-ink-3);
  }
  /* Label over the ramp, both filling the caption band. No "Scale" in the name —
     the gradient is visibly one; the legend names the quantity, not the widget. */
  .nnm-legend { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .nnm-legend-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--nnm-ink-3);
    line-height: 1.1;
  }
  .nnm-readhead .nnm-read-scale { margin-bottom: 0; font-size: 12px; }
  .nnm-readhead .nnm-read-scale .grad { height: 12px; border-radius: 3px; }
  .nnm-read-scale {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--nnm-mono);
    font-size: 9.5px;
    color: var(--nnm-ink-3);
    font-variant-numeric: tabular-nums;
    margin-bottom: 6px;
  }
  .nnm-read-scale .grad {
    flex: 1;
    height: 9px;
    border-radius: 2px;
    background: linear-gradient(to right, #1F4E8F, #C8D6E9, #FFFFFF, #EFD3C4, #A84A2C);
    /* Same hairline the correlation key carries. The ramp passes through white at
       zero, so without it the middle of the bar dissolves into the panel and the
       scale looks like two separate swatches. */
    box-shadow: inset 0 0 0 1px rgba(30,36,44,0.18);
  }
  .nnm-read-text {
    font-family: 'Lato', sans-serif;
    font-size: 13px;
    line-height: 1.85;
    color: var(--nnm-ink);
    word-break: break-word;
  }

  /* --- right: the flow diagram --- */
  .nnm-flowpanel { flex: 1; min-height: 0; }
  .nnm-flowouter { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  /* min-height:0 is required — without it a flex child refuses to shrink below its
     content and overflow-y:auto never engages, so the bar escaped the card. */
  .nnm-flowbodywrap {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    min-height: 0;
    flex: 1;
    scrollbar-gutter: stable;
    padding: 5px 14px 5px 6px;
    margin: -5px 0 -5px -6px;
  }
  .nnm-flowhead { padding-right: 14px; box-sizing: border-box; }
  /* Outside the scroller, exactly as the legend is on the readings side, so both
     scrollbars span the same band and neither heading moves. Both scrollers now
     hold only their rows, so the sync — which copies scrollTop straight across —
     still lines them up row for row. */
  .nnm-flowhead {
    position: relative;
    display: flex;
    align-items: flex-end;
    gap: 0;
    height: 30px;
    /* Matches .nnm-readhead's. alignTops only controls this element's height, and
       the captions are pinned to its bottom edge, so that space opens above them —
       the gap below has to be set here to stay in step with the legend's. */
    margin-bottom: 28px;
    flex-shrink: 0;
    box-sizing: content-box;
  }
  /* Positioned against measured centres rather than flex order. */
  .nnm-flowhead .c.far {
    position: absolute;
    bottom: 0;
    transform: translateX(-50%);
    width: auto;
    white-space: nowrap;
  }
  /* Two words, two lines: kept to the width of a cell so it breaks rather than
     reaching for the panel edge, which it was 13px short of on one line. */
  .nnm-flowhead .c.far.dec {
    white-space: normal;
    width: 82px;
  }
  .nnm-flowhead .c {
    width: 82px;
    flex-shrink: 0;
    text-align: center;
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    line-height: 1.25;
    color: var(--nnm-ink-2);
  }
  .nnm-flowhead .g { width: 30px; flex-shrink: 0; }
  .nnm-flowbody { display: flex; align-items: stretch; flex-shrink: 0; min-width: 0; }
  /* Both columns must use the SAME gap or they drift: syncRows matches each pair's
     height and alignTops pins the first pair, so a difference in gap accumulates
     down the rows and only shows from row 2 onwards. One value, used by both.
     20px is the floor — the number hangs 18px below its cell — and the rest is air. */
  .nnm-readscroll, .nnm-frows { gap: var(--nnm-row-gap); }
  .nnm-frows { display: flex; flex-direction: column; flex-shrink: 0; }
  .nnm-frow { display: flex; align-items: center; gap: 0; border-radius: 5px; box-sizing: border-box; }


  /* ---- 3B Investigate Pathway 4 ---- */
  .d3b-bar { justify-content: flex-start; }
  /* Nothing else in this bar is elastic, so About takes the slack itself. In 2B
     the rule's auto margins do it and in 3A the view switch's flex does. */
  .d3b-bar .nnm-about-btn { margin-left: auto; }
  /* Three columns: the two conversations being compared, then the one control set
     that is not per conversation. The conversations are equal — two things being
     compared cannot be given different amounts of room — and commissioning takes
     what is left, which is enough for four one-line items and the results table.
     Stacking commissioning below instead leaves it about 67px once two full
     conversation cards are placed, which is not a panel. */
  .d3b-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: 1 1 0; }
  .d3b-buycol { flex: 0 0 314px; }
  .d3b-conv, .d3b-panel { flex: 1; min-height: 0; }
  .d3b-convbody { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
  /* Nothing in this toolbar is elastic once the prompt is gone, so the query would
     stretch across the whole row and stop matching the one on Correlations. Held
     at the same basis, with the buttons taking the slack. */
  .d3b-toolbar .d3-filter { flex: 0 1 447px; }
  .d3b-toolbar .nnm-reset { margin-left: auto; }
  /* 9px between the query row and the cards under it, the same gap the Prediction
     Chain's columns carry between their top row and their panels. The stack has no
     row gap of its own, so the toolbar and the cards were butted together. */
  .d3b-toolbar { margin-bottom: 9px; }
  /* The reading is the thing being compared, so it gets the room in the card and
     the notes below it keep their own. */
  .d3b-readtext { flex-shrink: 0; margin-bottom: 12px; }
  .d3b-convbody .d3b-subhead { margin-top: 2px; }
  /* The notes scroll inside their own block rather than pushing the chips out of
     the card. The chips have to stay in view: they are where a commissioned
     attribute turns up, and the whole point of reading the notes is to decide
     what to commission. */
  .d3b-convbody .d3b-notes { flex: 1 1 auto; min-height: 90px; overflow-y: auto; }
  .d3b-convbody .d3b-known { flex-shrink: 0; padding-top: 8px; }
  .d3b-count {
    margin-left: auto; font-family: var(--nnm-mono); font-size: 11.5px;
    color: var(--nnm-ink-2); font-variant-numeric: tabular-nums;
  }
  .d3b-conv .nnm-nav { margin-left: 8px; }
  .d3b-panel { flex: 1; min-height: 0; }
  .d3b-body { display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  .d3b-budget {
    margin-left: auto; font-family: var(--nnm-mono); font-size: 11.5px; color: var(--nnm-ink-3);
  }
  .d3b-notes {
    font-family: 'Lato', sans-serif; font-size: 13.5px; line-height: 1.55;
    color: var(--nnm-ink); background: var(--nnm-surface);
    border-left: 3px solid #C6D2E2; border-radius: 0 5px 5px 0; padding: 10px 12px;
  }
  .d3b-known { display: flex; flex-wrap: wrap; gap: 6px; }
  .d3b-attr {
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.03em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--nnm-rule); color: var(--nnm-ink-3); background: #fff;
  }
  .d3b-attr.on { color: var(--nnm-ink); border-color: #B9C7DA; background: #F2F6FB; }
  /* A commissioned attribute is marked so it is obvious which facts were bought. */
  .d3b-attr.new { border-color: #C6836C; color: #A84A2C; background: #FBF1EC; }
  .d3b-subhead {
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--nnm-ink-2);
    border-top: 1px solid var(--nnm-rule-soft); padding-top: 10px;
  }
  .d3b-subnote { font-family: 'Lato', sans-serif; font-size: 12px; color: var(--nnm-ink-3); margin-top: -6px; }
  .d3b-list { display: flex; flex-direction: column; gap: 6px; }
  .d3b-item {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
    align-items: center; padding: 8px 10px;
    border: 1px solid var(--nnm-rule-soft); border-radius: 6px; background: #fff;
  }
  .d3b-item.done { background: #FBF1EC; border-color: #E4CBBF; }
  .d3b-itemname { font-family: 'Lato', sans-serif; font-size: 13.5px; color: var(--nnm-ink); }
  .d3b-itemdesc {
    grid-column: 1; font-family: 'Lato', sans-serif; font-size: 11.5px;
    line-height: 1.4; color: var(--nnm-ink-3);
  }
  .d3b-buy {
    grid-row: 1 / span 2; grid-column: 2;
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 0 12px; height: 32px; box-sizing: border-box;
    border: 2px solid var(--nnm-rule); background: #fff; color: var(--nnm-ink-2);
    border-radius: 5px; cursor: pointer;
  }
  .d3b-buy:hover:not(:disabled) { background: var(--nnm-surface); }
  .d3b-buy:disabled { opacity: 0.45; cursor: default; }
  .d3b-table { display: flex; flex-direction: column; gap: 4px; }
  .d3b-trow {
    display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 6px; align-items: center;
  }
  .d3b-trow > div { font-family: 'Lato', sans-serif; font-size: 12.5px; color: var(--nnm-ink-2); }
  .d3b-trow.head > div { font-size: 11.5px; color: var(--nnm-ink-3); text-align: center; }
  .d3b-trow > div.hit { background: #F7F9FC; border-radius: 5px; }
  .d3b-chip {
    display: flex; align-items: center; justify-content: center; gap: 7px; padding: 4px 0;
    font-family: var(--nnm-mono); font-size: 12px; font-variant-numeric: tabular-nums;
  }

  /* ---- 3A Correlations ---- */
  /* padding-top matches .nnm-stack so the toolbar sits on the same line as 2B's. */
  .d3-wrap {
    display: flex; flex-direction: column; min-height: 0; gap: 10px; padding-top: 9px;
    position: relative;                 /* the cell-detail scrim is laid over this */
  }
  /* The toolbar reuses 2B's column proportions exactly — .nnm's gap, .nnm-leftcol's
     basis, .nnm-rightcol's basis — so the find bar is the same width and sits in the
     same place, and the view switch lands where the Animate toggle does over there. */
  .d3-toolbar { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .d3-filter { flex: 1 1 440px; min-width: 236px; }
  .d3-head { position: relative; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .d3-title {
    font-family: 'Lato', sans-serif; font-size: 15px; color: var(--nnm-ink-2);
  }
  /* The same 560 basis .nnm-rightcol carries, against the filter's 440, so the
     toolbar divides exactly as the two panels beneath it do and the find bar is
     the width it is in the Prediction Chain. No gap: the switch's `margin: 0 auto`
     takes an equal share of whatever is left on each side, which centres it
     between the filter and About at any width — a gap would push it off by half
     of one. */
  .d3-views { display: flex; align-items: center; flex: 1 1 560px; min-width: 318px; }
  /* The auto margins centre the switch inside .d3-views, but the toolbar's own
     10px gap sits to the LEFT of that group and not to the right of it, so a
     switch centred in the group measures 10px further from the filter than from
     About. Backing off half the gap puts it on the true midpoint between the
     filter's right edge and About's left edge. */
  .d3-viewswitch { margin: 0 auto; position: relative; left: -5px; }
  /* One switch with a name on each side, correlation on the left because that is
     the view this opens on. The names ARE the control — no chrome of their own —
     so nothing competes with the thumb for the "which is it on" reading. */
  .d3-viewswitch { display: flex; align-items: center; gap: 10px; }
  .d3-viewbtn {
    font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 0; height: 36px; box-sizing: border-box;
    border: 0; background: none; color: var(--nnm-ink-2);
    cursor: pointer; white-space: nowrap;
  }
  /* Weight stays 600 in both states: going bold on the chosen name would widen it
     and shove the switch sideways every time it is thrown. Colour carries it, and
     the thumb's position carries it before colour does. --nnm-ink-2 is 6.3:1 on
     white, so the name that is not chosen is still properly readable. */
  .d3-viewbtn.on { color: var(--nnm-ink); }
  .d3-viewbtn:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 2px; border-radius: 3px; }
  /* The Prediction Chain's slider thumb exactly — 24px, white, 2px --nnm-rule —
     with its hover and press states, so the two controls read as one family. */
  .d3-switchtrack {
    position: relative;
    width: 54px; height: 30px;
    box-sizing: border-box;
    flex-shrink: 0;
    border: 2px solid var(--nnm-rule);
    border-radius: 15px;
    background: var(--nnm-surface);
    cursor: pointer;
  }
  .d3-switchthumb {
    position: absolute; left: 1px; top: 1px;
    width: 24px; height: 24px;
    box-sizing: border-box;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--nnm-rule);
    transition: transform 0.2s cubic-bezier(.3,0,.3,1);
  }
  /* 24px of travel: the padding box is 50px wide (54 less two 2px borders), the
     thumb is 24, and it is inset 1px at each end — 50 - 24 - 1 - 1. At 26 it
     would sit hard against the right border instead of mirroring its rest. */
  .d3-switchtrack.graph .d3-switchthumb { transform: translateX(24px); }
  .d3-switchtrack:hover .d3-switchthumb { background: var(--nnm-surface); border-color: #A7B0BC; }
  .d3-switchtrack:active .d3-switchthumb {
    background: var(--nnm-ink); border-color: var(--nnm-ink);
    box-shadow: 0 0 0 4px rgba(30,36,44,0.10);
  }
  /* Centred on the full width of the row, not on what the title leaves over.
     Absolute, so it takes no part in the row's flex and nothing moves when it
     appears. --nnm-ink-2, not the --nnm-ink-3 it used to wear: this is an
     instruction, and ink-3 measures 3.4:1 on white, under the 4.5:1 that 12px
     text has to clear. ink-2 is 6.3:1. */
  .d3-viewhint {
    position: absolute; left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    /* 15px, the same size as the title it shares the row with — one type size on
       the line, and the hint does not outrank the thing it sits beside. */
    font-family: 'Lato', sans-serif; font-size: 15px; font-style: italic;
    color: var(--nnm-ink-2); white-space: nowrap;
  }
  .d3-viewhint[hidden] { display: none; }
  .d3-viewbtn:hover { color: var(--nnm-ink); }
  /* The matrix is taller than the panel at every size this runs at, so the last
     row is always cut by the scroll edge. It scrolled before, but nothing said so
     — a row sliced in half just reads as broken. The wrapper carries a fade that
     is switched off once you reach the bottom. */
  .d3-scrollwrap { flex: 1; min-height: 0; display: flex; gap: 12px; }
  .d3-fadebox { position: relative; flex: 1; min-width: 0; display: flex; }
  .d3-fadebox::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
    background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 88%);
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.18s ease;
  }
  .d3-fadebox.at-end::after { opacity: 0; }
  .d3-scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-gutter: stable; }
  /* A real grid, ruled by the container showing through 1px gaps rather than by
     borders on the cells. Borders double up at every shared edge and drift by a
     subpixel wherever a column lands on a fraction; a gap is exactly one pixel
     everywhere by construction. Because every child paints its own background —
     headings and the pathway stub included — the ruling runs through the whole
     table without a single border being declared. The padding rules the outer
     edge as well as the gaps between children. */
  .d3-grid {
    display: grid;
    grid-template-columns: 150px repeat(3, 1fr);
    gap: 1px;
    padding: 1px;
    background: var(--nnm-rule);
    align-items: stretch;
  }
  .d3-colhead, .d3-rowhead {
    font-family: 'Lato', sans-serif; font-size: 12.5px; color: var(--nnm-ink-2);
    display: flex; align-items: center;
  }
  /* The ruled gaps draw these edges now. */
  /* flex-start, because the transform below does the positioning. */
  .d3-colhead { justify-content: flex-start; padding: 7px 6px; overflow: hidden; }
  /* Only as tall as the column NAME — the counts hang off it absolutely, so they
     never add to its height and the name can be centred in the band when they are
     not showing. Graph view lifts this to the top and the counts appear beneath,
     captioning the plots; correlation view drops it to the middle and takes the
     counts away, since the split they describe is not what a correlation measures. */
  .d3-headinner {
    position: relative; width: 100%;
    transition: transform 0.34s cubic-bezier(.34, 1.08, .5, 1);
  }
  .d3-headinner .d3-marg {
    position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px;
    transition: opacity 0.24s ease;
  }
  /* The two resting states, in CSS rather than measured. The band is a fixed 77,
     its padding 7 a side, and the name is pinned to two lines at 12.5/1.25 = 31 —
     so the slack is 32 and half of it is 16. Declaring it means the heading is
     already in the right place the moment it is built: nothing to measure, and no
     correction to watch happen after the panel mounts. */
  .d3-headinner { transform: translateY(0); }
  .d3-headinner.nocounts { transform: translateY(16px); }
  .d3-headinner.nocounts .d3-marg { opacity: 0; }
  .d3-rowhead { justify-content: flex-start; padding: 6px 10px 6px 8px; overflow: hidden; }
  /* Name and range bar are the block that moves; the plot hangs out of flow between
     them so it can leave without the block changing height. 70px row less 12
     padding is 58 of content; name 15 + range 13 = 28, so the slack is 30 and the
     pair centres at 15. */
  .d3-stubinner {
    position: relative; width: 100%;
    transform: translateY(0);
    transition: transform 0.34s cubic-bezier(.34, 1.08, .5, 1);
  }
  /* Centred in the row rather than nudged down by a fixed amount. The 15px this
     replaces was worked out when a row was 70px tall and its contents were a
     different height; rows size themselves now, so sizeRows measures the block and
     sets --stub-lift. The fallback is the old value, for the frame before the
     first measurement lands. */
  .d3-stubinner.noplot { transform: translateY(var(--stub-lift, 15px)); }
  /* 44 = the 22px of bars it had at 28, plus AXIS_H and PAD_T for the axis it now
     draws. The stub used to go without one on the grounds that every cell in its
     row carries the same axis on the same scale — but the stub's plot is ~132px
     wide against a cell's ~99, so its scale is stretched differently and the axis
     beside it cannot be borrowed. It was the only histogram on screen with no way
     to see where zero is. */
  .d3-pathplot {
    position: absolute; left: 0; right: 0; top: 0;
    height: 44px;
    transition: opacity 0.24s ease;
  }
  .d3-stubinner.noplot .d3-pathplot { opacity: 0; }
  /* The range bar sits below the plot's slot in graph view and directly under the
     name when the plot is gone. */
  /* Positioned, so the plot inside it hangs from the box's own top — against the
     stub it was anchoring to the top of the whole block and drawing over the name.
     The padding is what opens the gap the plot appears in, so it has to be
     transitioned too: without it the name slid up while the range bar jumped its
     28px in one frame. Same curve as the name's, so the two separate together. */
  .d3-margbox {
    position: relative; padding-top: 44px;
    transition: padding-top 0.34s cubic-bezier(.34, 1.08, .5, 1);
  }
  /* 8, not 0: with the plot gone the name and the bar were nearly touching. Kept
     on the padding that already animates, so the extra space opens and closes with
     the view rather than jumping. sizeRows uses this same 8 (STUB_GAP) to work out
     where the block sits — the two have to agree. */
  .d3-stubinner.noplot .d3-margbox { padding-top: 8px; }
  /* Two lines whether or not the label has a space to break at, so the band keeps
     one height and the marginals below it stay level. */
  .d3-colname { min-height: 2.5em; }
  /* Both header bands stay put while the matrix scrolls under them — with eight
     rows you otherwise lose track of which pathway a column is. Opaque, or the
     cells show through; the corner sits above both where they cross. */
  .d3-colhead, .d3-rowhead, .d3-corner { position: sticky; background: #fff; }
  .d3-colhead { top: 0; z-index: 2; }
  .d3-rowhead { left: 0; z-index: 2; }
  /* The one cell in the table that is not a heading and not a reading. It still
     has to be there — the grid needs something in that slot or every column shifts
     one to the left — but it should read as empty page, not as an empty box. The
     ruling is the container showing through 1px gaps, so white is painted into the
     two gaps that belong to this cell alone — the grid's own padding above it and
     to its left. NOT a 1px spread on all four sides: the gaps to its right and
     below are the first heading's left border and the first stub's top border, and
     those belong to the table. Three shadows rather than two because the 1px at
     the diagonal corner falls outside both strips. */
  .d3-corner {
    top: 0; left: 0; z-index: 3;
    box-shadow: -1px 0 0 #fff, 0 -1px 0 #fff, -1px -1px 0 #fff;
  }
  /* Pathways are the rows now and the series are the columns, so the outcome
     block — what the model is judged against, as opposed to attributes of the
     scene — is the first three COLUMNS. A heavier heading and a tinted cell keep
     the two blocks apart, as the explorer does. */
  .d3-colhead.outcome { color: var(--nnm-ink); font-weight: 600; }
  /* The heavier weight marks the outcome HEADINGS, not their counts — inherited,
     it made the same marginal look like two different things across the band. */
  .d3-colhead.outcome .d3-marg { color: var(--nnm-ink-2); font-weight: 400; }
  /* A tint no longer separates the outcome block from the attributes — every cell
     carries its own fill now — so the boundary is drawn instead, on the last
     column of the block. */
  .d3-colhead.sep, .d3-cell.sep { border-right: 2px solid var(--nnm-rule); }
  /* No radius: the cells tile, and a rounded corner would break the ruling. The
     row height comes from the grid, not from the contents. */
  .d3-cell {
    display: flex; align-items: center; justify-content: center;
    background: #fff; min-height: 0; overflow: hidden;
  }
  /* The fill is the cell, edge to edge — a rectangle, not a square, so it keeps
     whatever box the shared grid hands it and the two views tile identically. */
  .d3-sq {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%;
    /* The fill is an <i>, which is italic by default — and the value sits inside
       it, so it was inheriting the slant from its own container. */
    font-style: normal;
  }
  /* No marker for "strong" any more. It was a ring at |r| >= 0.30, from when the
     fills were bucketed; with a continuous ramp the colour already says how strong
     a cell is, and a hard threshold made 0.29 and 0.31 look like different kinds
     of thing. */
  .d3-cell.corr.deep .d3-r { color: #fff; }
  .d3-dot { display: block; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(30,36,44,0.18); flex-shrink: 0; }
  .d3-r {
    font-family: var(--nnm-mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
    color: var(--nnm-ink-2); min-width: 46px;
  }
  /* No reserved width inside the fill, and a size that fits it. Full ink: these
     are the reading, and on a pale fill ink-2 was softer than it needed to be. */
  .d3-cell.corr .d3-r { font-size: 11px; min-width: 0; color: var(--nnm-ink); }
  /* Headings were turned 45 degrees while the square WAS the column and there was
     no width for them. The column is ~88px now and "prediction" needs 58, so they
     read horizontally again. */

  /* No circle, and the dash sits where the circle would, so an undefined cell
     reads as a gap in the matrix rather than as a very small measured result. */
  .d3-cell.corr.undef { justify-content: center; }
  .d3-cell.corr.undef .d3-r { color: var(--nnm-ink-3); min-width: 0; }
  .d3b-chip.undef { color: var(--nnm-ink-3); }
  .d3-cell.graph { padding: 2px; align-items: stretch; }
  /* Bar height is a count, drawn at whatever scale makes the fullest bin fit —
     never capped, or the bars would stop meaning counts. */
  .d3-plot { display: block; overflow: visible; }
  .d3-bar { fill: #D08A6A; fill-opacity: 0.85; }

  /* The bar is the histogram's own axis, drawn as a line. Its margins are the
     insets the plot above uses — 8px for the label gutter, 6px for PAD_R — so the
     two line up, and the caption sits under it rather than beside it. Beside it,
     the caption's width decided the track's: "4% of range" and "64% of range"
     differ enough that two rows got tracks 5px apart in length, which is the one
     thing a bar like this must not do. */
  .d3-range {
    display: block; margin: 3px 6px 0 8px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
    color: var(--nnm-ink-2);
  }
  .d3-range-track {
    position: relative; display: block; height: 4px; border-radius: 2px;
    background: #E4E8EE;
  }
  /* Three layers on one axis: the track is the whole -5..5, the "full" segment is
     everything this pathway reaches over all 800 conversations, and the fill is
     what the filter left. The caption's percentage is fill / full, so the ratio it
     names is a ratio you can see. */
  .d3-range-full {
    position: absolute; top: 0; height: 4px; border-radius: 2px;
    background: #CCD3DD;
  }
  .d3-range-fill {
    position: absolute; top: 0; height: 4px; border-radius: 2px;
    background: #838C99;
  }
  .d3-range .cap { display: block; line-height: 1; margin-top: 4px; text-align: center; }
  .d3-blabel { font-family: 'Barlow Condensed', sans-serif; font-size: 10.5px; fill: var(--nnm-ink-2); }
  /* The close-up has room the matrix cells do not: 10.5px is sized for a 42px stub
     inside a 99px cell, and at 530px wide it read as fine print. The ticks are
     8.5px for the same reason and get the same treatment, a step below the band
     labels so the axis stays quieter than the groups it is measuring. */
  .d3-detail .d3-blabel { font-size: 14px; fill: var(--nnm-ink); }
  .d3-detail .d3-tick { font-size: 12px; fill: var(--nnm-ink-2); }
  .d3-tick { font-family: var(--nnm-mono); font-size: 8.5px; fill: var(--nnm-ink-2); }
  .d3-colname { text-align: center; }
  /* The stub is the widest thing in the row and the names are short, so they read
     better against the matrix than floating in the middle of it. */
  .d3-rowname { text-align: left; }
  .d3-colhead, .d3-rowhead { flex-direction: column; align-items: stretch; gap: 4px; }
  /* The row marginal: how the conversations divide between this row's values,
     which is the thing that decides whether a correlation could exist at all.
     The bar is drawn BEHIND the text rather than beside it. Sitting alongside, it
     took up to 32px of a ~79px column and the labels were the thing that gave —
     "Approach" became "App…" and "wrong" became "wro…". Behind, it costs no width
     at all, so every label reads in full and the proportion is still there. */
  .d3-marg { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .d3-margrow {
    display: flex; align-items: center; gap: 5px;
    font-family: 'Barlow Condensed', sans-serif; font-size: 10.5px; color: var(--nnm-ink-2);
  }
  /* Bar, label, count — the original arrangement. It truncated because the bar was
     drawn up to 32px while the column only had 84 of content, and the label was the
     one item allowed to shrink, so it absorbed the 5px overrun as an ellipsis.
     Capped to what is genuinely left over, with the label pinned to its own width
     and the count pushed to the right edge, everything fits with room to spare:
        26 bar + 5 + 35 label + 5 + 12 count = 83 in 88. */
  .d3-margrow i {
    flex: 0 0 auto;
    height: 7px; border-radius: 2px; background: #E0B6A4;
  }
  .d3-margrow span { flex: 0 0 auto; white-space: nowrap; }
  /* auto, so the counts line up on the right however long the label before them. */
  .d3-margrow em {
    margin-left: auto; font-style: normal;
    font-family: var(--nnm-mono); font-size: 9.5px; color: var(--nnm-ink-2);
    font-variant-numeric: tabular-nums;
  }
  /* Sized against the matrix, not the panel: it is a key to the squares, so it
     starts where they start and ends where they end. */
  /* Hidden, not removed. Taking the key out of the layout in graph view made the
     scroller 96px wider there, so the same grid produced 100px columns in one view
     and 88px in the other. Its space is reserved either way and the two views tile
     identically. */
  /* 70px, not the 55 the bar and ticks need: "Correlation" measures 62px in the
     column headings' own Lato 12.5, and squeezing it into 55 meant dropping to
     10.5px, at which it stops reading as a heading and starts reading as fine
     print. The 15px comes off the matrix, spread across eight columns — under 2px
     each. */
  .d3-legend {
    position: relative;
    display: flex; visibility: hidden;
    flex-shrink: 0; gap: 5px; align-items: flex-start;
    width: 70px;
  }
  /* Sits in the band sizeCorrCells opens above the bar to line it up with the
     first pathway row — so the label lands level with the column headings and
     reads as one of them. Absolute, so it takes no part in the bar/ticks row; its
     height is set alongside that padding, from the one measurement. */
  /* Centred across the key's full width — bar and ticks together, which is the
     block it names — and dropped to the foot of the heading band so it sits close
     to the thing it labels rather than floating in the middle of the space. */
  .d3-legend-label {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    padding-bottom: 13px; box-sizing: border-box;
    line-height: 1.25; text-align: center;
    font-family: 'Lato', sans-serif; font-size: 12.5px; color: var(--nnm-ink-2);
  }
  .d3-scrollwrap.showkey .d3-legend { visibility: visible; }
  .d3-legend-bar {
    width: 16px; flex-shrink: 0;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(30,36,44,0.18);
  }
  /* 40, not the 34 it held at 9.5px: at 11px with tabular-nums "+0.75" renders
     34.7px — wider than a canvas measurement of the same string predicts, because
     the tabular figures are set on a fixed advance. The legend is 70px and the bar
     and gap take 21, so this is inside what is already reserved. */
  .d3-legend-ticks { position: relative; width: 40px; flex-shrink: 0; }
  .d3-legend-ticks span {
    position: absolute; left: 0; transform: translateY(-50%);
    /* 11px, the size of the values in the cells: a tick and a cell value are the
       same kind of number in the same mono face, so they read at the same size.
       "+0.75" comes to 33.1px, which still clears the 34px column — going to the
       label's 12.5 would need 38 and would also make the key's numbers louder
       than the data's. 48.6px between ticks, so there is no vertical squeeze. */
    font-family: var(--nnm-mono); font-size: 11px;
    font-variant-numeric: tabular-nums; color: var(--nnm-ink-2);
    white-space: nowrap;
  }
  .d3-legend-ticks span.zero { color: var(--nnm-ink); }
  /* Sits across the bar with its value in the ticks column, on an opaque ground so
     it reads over whichever tick it lands on. Centred on its own line, so the top
     it is given is the value's position rather than the top of the mark. */
  /* display:flex here would otherwise beat the browser's own [hidden] rule, and
     `legendMark.hidden = true` would set the property while the element carried on
     painting. Same trap .d3-viewhint has a rule for. */
  .d3-legend-mark[hidden] { display: none; }
  .d3-legend-mark {
    position: absolute; left: 0; right: 0;
    /* Above the ticks. The marker is added to the legend before the bar and the
       ticks are, and positioned siblings with no z-index paint in DOM order — so
       the tick labels were drawing OVER the bubble, and its white fill covered
       nothing. That is what the tick-dimming had really been compensating for. */
    z-index: 1;
    transform: translateY(-50%);
    display: flex; align-items: center; gap: 0;
    pointer-events: none;
  }
  /* 22px: the bar's 16 plus 3px of overhang each side, so the line reads as
     pointing AT the ramp rather than as part of it. */
  /* 23 with the gap closed, where it was 22 with a 1px gap: the line grows by the
     pixel the gap gave up, so it runs into the bubble's outline and the pill does
     not shift. The two are one mark, in one ink. */
  .d3-legend-mark i {
    width: 23px; height: 2px; margin-left: -3px;
    background: var(--nnm-ink); flex-shrink: 0;
  }
  .d3-legend-mark .val {
    font-family: var(--nnm-mono); font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--nnm-ink); background: #FFFFFF;
    /* Solid white, so the tick label the pill lands on is covered rather than read
       through it — at r = 0.51 the bubble sits on "+0.5" and the two sets of digits
       printed over each other. This is what does that job now; the ticks are left
       alone. Outline in the same ink as the marker line it runs into, so the line
       and the bubble read as one object rather than as a mark with a label near
       it. */
    border: 1.5px solid var(--nnm-ink);
    padding: 3px 6px; border-radius: 999px;
  }
  .d3-legend-ticks span::before {
    content: ""; position: absolute; left: -4px; top: 50%;
    width: 3px; height: 1px; background: var(--nnm-rule);
  }
  /* --- cell detail --- */
  /* The matrix is the overview; this is the one panel behind a cell, big enough to
     read. Same card from either view, so a correlation and the distribution that
     produced it are two sides of one thing rather than two separate screens. */
  .d3-cell[role="button"] { position: relative; }
  .d3-cell.graph[role="button"], .d3-rowhead[role="button"] { cursor: pointer; }
  /* The pathway stub takes the same treatment as a graph cell. It has no fill of
     its own to protect, so the wash is safe here in either view — it is limited to
     graph view only because that is where it opens something. */
  .d3-rowhead[role="button"] { position: relative; }
  .d3-rowhead[role="button"]::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: rgba(30, 36, 44, 0);
    box-shadow: inset 0 0 0 0 rgba(30, 36, 44, 0);
    transition: background-color 0.12s ease, box-shadow 0.12s ease;
  }
  .d3-rowhead[role="button"]:hover::after {
    background: rgba(30, 36, 44, 0.07);
    box-shadow: inset 0 0 0 2px var(--nnm-ink-3);
  }
  .d3-rowhead[role="button"]:active::after {
    background: rgba(30, 36, 44, 0.14);
    box-shadow: inset 0 0 0 2px var(--nnm-ink-2);
  }
  .d3-rowhead[role="button"]:focus-visible {
    outline: 2px solid var(--nnm-neg); outline-offset: -2px;
  }
  /* Graph view only. In correlation view the cell's fill IS the reading, and a
     dark wash over it shifts the very colour the key is there to decode — the
     hover would be changing the data. Graph cells are white, so a wash costs
     nothing. Both the wash and the ring live on this overlay because an inset
     shadow on the cell itself paints under the fill and never appeared.
     Deeper on press, the way the buttons darken. */
  .d3-cell.graph[role="button"]::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: rgba(30, 36, 44, 0);
    box-shadow: inset 0 0 0 0 rgba(30, 36, 44, 0);
    transition: background-color 0.12s ease, box-shadow 0.12s ease;
  }
  /* The hover colour is the cell's own background, set per cell as --corr from the
     correlation it would show in the other view. The neutral grey wash is dropped
     while it is on: laid over the hue it would muddy it, and the cell would no
     longer match the key it is meant to be read against. Cells whose column is
     flat have no correlation, so they keep the grey. */
  .d3-cell.graph[role="button"] { transition: background-color 0.12s ease; }
  .d3-cell.graph.hascorr[role="button"]:hover,
  .d3-cell.graph.hascorr[role="button"]:focus-visible { background: var(--corr); }
  /* The overlay carries the ring and nothing else where there is a colour: it is
     painted ABOVE the plot, so any background on it covers the histogram. */
  .d3-cell.graph[role="button"]:hover::after,
  .d3-cell.graph[role="button"]:focus-visible::after {
    box-shadow: inset 0 0 0 2px var(--nnm-ink-3);
  }
  .d3-cell.graph[role="button"]:not(.hascorr):hover::after,
  .d3-cell.graph[role="button"]:not(.hascorr):focus-visible::after {
    background: rgba(30, 36, 44, 0.07);
  }
  /* Hovering any panel you can open darkens its bars. Where the cell is also
     wearing its correlation, --barfill is whatever contrasts with that colour (see
     rampBarInk) — the usual salmon is itself a colour from the ramp behind it, so
     at one point on the scale it would match it exactly. Everywhere else it falls
     back to ink: a cell whose column is flat has no correlation to show, and a
     pathway stub is not a pair, but both are still buttons that open a close-up
     and both should answer the pointer the same way. */
  .d3-cell.graph, .d3-rowhead { --barfill: var(--nnm-ink); }
  .d3-cell.graph[role="button"]:hover .d3-bar,
  .d3-cell.graph[role="button"]:focus-visible .d3-bar,
  .d3-rowhead[role="button"]:hover .d3-bar,
  .d3-rowhead[role="button"]:focus-visible .d3-bar {
    fill: var(--barfill); fill-opacity: 0.95;
  }
  .d3-cell.graph[role="button"]:active::after {
    background: rgba(30, 36, 44, 0.14);
    box-shadow: inset 0 0 0 2px var(--nnm-ink-2);
  }
  .d3-cell[role="button"]:focus-visible {
    outline: 2px solid var(--nnm-neg); outline-offset: -2px;
  }
  /* Marks where the open panel came from: the same dark outline the press state
     uses, held on. NO z-index — raised above the scrim it also cleared the card
     sitting inside it, so the cell painted over the panel. It stays under the wash
     with everything else and only the ring identifies it. */
  .d3-cell.selected::after, .d3-rowhead.selected::after {
    background: rgba(30, 36, 44, 0) !important;
    box-shadow: inset 0 0 0 2px var(--nnm-ink-2) !important;
  }
  .d3-scrim {
    position: absolute; inset: 0; z-index: 40;
    background: rgba(30, 36, 44, 0.28);
    display: flex; align-items: center; justify-content: center;
  }
  .d3-detail {
    background: #fff; border: 2px solid var(--nnm-rule);
    border-radius: 8px; box-shadow: 0 10px 28px -10px rgba(30,36,44,0.45);
    width: min(560px, 92%); max-height: 94%;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .d3-detail-head {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px 9px 13px;
    border-bottom: 1px solid var(--nnm-rule-soft);
  }
  .d3-detail-title {
    font-family: 'Lato', sans-serif; font-size: 14px; font-weight: 700;
    color: var(--nnm-ink); flex: 1; min-width: 0;
  }
  .d3-detail-r {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--nnm-mono); font-size: 13px; color: var(--nnm-ink);
    font-variant-numeric: tabular-nums;
  }
  .d3-detail-r i {
    display: block; width: 18px; height: 18px; border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(30,36,44,0.18);
  }
  .d3-detail-close {
    width: 26px; height: 26px; flex-shrink: 0;
    border: 2px solid var(--nnm-rule); border-radius: 5px; background: #fff;
    color: var(--nnm-ink-2); cursor: pointer; line-height: 1; font-size: 15px;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .d3-detail-close:hover { background: var(--nnm-surface); }
  .d3-detail-close:focus-visible { outline: 2px solid var(--nnm-neg); outline-offset: 1px; }
  /* 12 at the foot, not 4. The 4 was sized for a card that had a paragraph of
     text under the plot to hold it off the edge; with that gone the axis labels
     sat almost on the border. */
  .d3-detail-body { padding: 10px 13px 12px; }
  .d3-note {
    font-family: 'Lato', sans-serif; font-size: 12.5px; line-height: 1.45;
    color: var(--nnm-ink-3); flex-shrink: 0; padding-bottom: 2px;
  }

  .nnm-cell {
    width: 82px;
    height: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(30,36,44,0.14);
    border-radius: 6px;
    font-family: var(--nnm-mono);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    background: #fff;
    transition: background-color 0.35s ease, color 0.35s ease, opacity 0.3s ease;
  }
  /* Importance stays grey: it is the one number that does not change
     from conversation to conversation. */
  /* Importance keeps the same bare-square grammar as the other three columns.
     What marks it as a property of the MODEL rather than a result of a step is
     that it is the only column already showing a real value at step 0, while the
     others still hold their empty stand-ins — and that it never changes as you
     move between conversations. */
  .nnm-cell.imp { color: var(--nnm-ink) !important; }
  /* The importance VALUE starts pale — the same #C2C9D4 an unlit operator wears
     (see .nnm-glyph), and for the same reason: nothing has taken it up yet. It
     goes to ink at the beat the carried square lands on the box, so the number
     and the box are seen to be picked up together rather than the number having
     been dark all along. 0.2s, started 200ms before the square lands, so the
     change is complete as it arrives — see IMP_INK, which must match. */
  .nnm-cell.imp .nnm-num { color: #C2C9D4 !important; transition: color 0.2s ease; }
  .nnm-frow.lit-imp .imp .nnm-num { color: var(--nnm-ink) !important; }
  .nnm-cell.sum { width: 62px; height: 40px; }
  /* A stage that has not run yet is a stand-in: the box is there so the shape of
     the calculation is visible from the start, but it holds no value and no colour. */
  .nnm-cell.empty, .nnm-out.empty {
    background: repeating-linear-gradient(-45deg, #FAFBFC 0 5px, #F1F3F6 5px 10px) !important;
    border-color: #D8DDE5 !important;
    border-style: dashed !important;
    color: transparent !important;
  }
  .nnm-pop { animation: nnm-pop 0.42s cubic-bezier(0.2, 0.9, 0.3, 1.3); }
  @keyframes nnm-pop {
    from { opacity: 0; transform: scale(0.90); }
    60%  { opacity: 1; }
    to   { opacity: 1; transform: scale(1); }
  }
  .nnm-reset {
    /* In the flow, as the fifth member of .nnm-stepgroup. It was absolute at the
       row's right edge back when the four steps were centred and it had to stay
       clear of them; that job belongs to About now. */
    height: 36px;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    border: 2px solid var(--nnm-rule);
    background: #fff;
    border-radius: 5px;
    cursor: pointer;
    color: var(--nnm-ink-2);
    padding: 0 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .nnm-reset .glyph { font-size: 19px; line-height: 1; padding-bottom: 2px; }
  .nnm-reset:hover:not(:disabled) { background: var(--nnm-surface); }
  /* Same press as the step and nav buttons: the dark fill, no nudge. The glyph is
     a text character, so it inherits the colour and turns white with the rest of
     the button. */
  .nnm-reset:active:not(:disabled) {
    background: var(--nnm-ink); border-color: var(--nnm-ink); color: #fff;
  }
  /* Nothing to clear until a step has run, so it starts unavailable rather than
     inviting a press that would do nothing. */
  .nnm-reset:disabled {
    opacity: 0.35;
    cursor: default;
  }

  /* Speed sits to the right of Animate; the pair is pushed right together. */
  .nnm-speed {
    position: relative;
    display: flex; flex-direction: column; align-items: stretch; gap: 2px;
    /* The header already contributes its own 10px gap, and SLOW overhangs the
