        }
        const placeholder = document.createElement("div");
        placeholder.className = "sim-offspring-placeholder";
        placeholder.innerHTML = "Each cross will produce 5\u201320 offspring.";
        placeholder.style.display = "none";
        offspring.appendChild(placeholder);

        function updateStatsLabel() {
          const trial = SIM.selectedTrial;
          const st = SIM.trialState[trial];
          if (!st || !st.p1 || !st.p2) {
            statsWrap.style.display = "none";
            parents.classList.remove("has-stats");
            return;
          }
          statsWrap.style.display = "";
          parents.classList.add("has-stats");
          if (st.p1 && st.p2 && st.crosses.length === 0) {
            let text;
            if (st.fungusAfterCross !== null) {
              text = "Cross plants to see their offspring · <span class='fungus-active-label'>Fungus active</span>";
            } else {
              text = "Click <b>Cross Plants</b> to see their offspring";
            }
            statsLabel.innerHTML = text;
            const ph = offspring.querySelector(".sim-offspring-placeholder");
            if (ph) ph.style.display = "";
            return;
          }
          const crosses = st.crosses.length;
          const total = st.crosses.reduce((sum, gen) => sum + gen.length, 0);
          let text = "Crosses: <b>" + crosses + "</b> · Offspring: <b>" + total + "</b>";
          if (st.fungusAfterCross !== null) text += " · <span class='fungus-active-label'>Fungus active</span>";
          statsLabel.innerHTML = text;
        }
        SIM.updateStatsLabel = updateStatsLabel;

        const offspringWrap = document.createElement("div");
        offspringWrap.className = "sim-offspring-wrap";
        offspringWrap.appendChild(offspring);
        const offspringFocusRing = document.createElement("div");
        offspringFocusRing.className = "scroll-focus-ring";
        offspringWrap.appendChild(offspringFocusRing);
        inner.appendChild(offspringWrap);
        requestAnimationFrame(updateOffspringTabindex);

        // Track selected cross per trial
        SIM.selectedCross = {};

        // Render offspring for a given trial
        function updateCrossRowTabindex() {
          const rows = Array.from(offspring.querySelectorAll(".cross-row"));
          if (rows.length === 0) return;
          const trial = SIM.selectedTrial;
          const selIdx = SIM.selectedCross[trial];
          // If a row is selected, it gets tabindex="0"; otherwise first row does
          const activeIdx = (selIdx !== null && selIdx >= 0 && selIdx < rows.length) ? selIdx : 0;
          rows.forEach((r, i) => r.setAttribute("tabindex", i === activeIdx ? "0" : "-1"));
        }

        function renderOffspring(trial) {
          const st = SIM.trialState[trial];
          if (trial !== SIM.selectedTrial) return;
          offspring.innerHTML = "";
          if (!st || (st.crosses.length === 0 && st.fungusAfterCross === null)) {
            offspring.classList.remove("has-plants");
            const ph = document.createElement("div");
            ph.className = "sim-offspring-placeholder";
            ph.innerHTML = "Each cross will produce 5\u201320 offspring.";
            if (st && st.p1 && st.p2) ph.style.display = "";
            else ph.style.display = "none";
            offspring.appendChild(ph);
            SIM.selectedCross[trial] = null;
            requestAnimationFrame(updateOffspringTabindex);
            return;
          }
          offspring.classList.add("has-plants");

          // Fungus introduced before any crosses
          if (st.fungusAfterCross === 0) {
            const divider = document.createElement("div");
            divider.className = "fungus-divider";
            const dlbl = document.createElement("span");
            dlbl.className = "fungus-divider-label";
            dlbl.innerHTML = fungusAddedSVG + "Fungus introduced";
            divider.appendChild(dlbl);
            offspring.appendChild(divider);
          }

          st.crosses.forEach((crossPlants, gi) => {
            // Insert fungus divider after the cross it was introduced
            if (st.fungusAfterCross !== null && st.fungusAfterCross > 0 && gi === st.fungusAfterCross) {
              const divider = document.createElement("div");
              divider.className = "fungus-divider";
              const dlbl = document.createElement("span");
              dlbl.className = "fungus-divider-label";
              dlbl.innerHTML = fungusAddedSVG + "Fungus introduced after " + SIM.selectedTrial + st.fungusAfterCross;
              divider.appendChild(dlbl);
              offspring.appendChild(divider);
            }

            const row = document.createElement("div");
            row.className = "cross-row";
            row.setAttribute("role", "button");
            const crossInf = crossPlants.filter(p => p.infected).length;
            const crossH = crossPlants.length - crossInf;
            row.setAttribute("aria-label", "Cross " + trial + (gi + 1) + ", " + crossPlants.length + " offspring, " + crossH + " healthy, " + crossInf + " infected");
            // Roving tabindex: only selected row (or first row) gets tabindex="0"
            const isSelected = SIM.selectedCross[trial] === gi;
            if (isSelected) row.classList.add("selected");
            row.setAttribute("tabindex", "-1");
            row.addEventListener("click", () => {
              if (SIM.selectedCross[trial] === gi) {
                SIM.selectedCross[trial] = null;
              } else {
                SIM.selectedCross[trial] = gi;
              }
              const rows = offspring.querySelectorAll(".cross-row");
              rows.forEach((r, ri) => {
                r.classList.toggle("selected", SIM.selectedCross[trial] === ri);
                r.setAttribute("aria-pressed", SIM.selectedCross[trial] === ri ? "true" : "false");
              });
              // Update roving tabindex
              updateCrossRowTabindex();
              if (SIM.updateDataPanel) SIM.updateDataPanel();
              // Announce chart data to screen readers
              if (SIM.announce) {
                const sel = SIM.selectedCross[trial];
                if (sel !== null && sel !== undefined) {
                  const cp = st.crosses[sel];
                  const inf = cp.filter(p => p.infected).length;
                  const h = cp.length - inf;
                  const hP = Math.round((h / cp.length) * 100);
                  const iP = 100 - hP;
                  SIM.announce("Cross " + trial + (sel + 1) + ": " + hP + "% healthy, " + iP + "% infected");
                } else {
                  SIM.announce("No crosses selected. Charts reflect all crosses.");
                }
              }
            });
            row.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                row.click();
              } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                e.preventDefault();
                const rows = Array.from(offspring.querySelectorAll(".cross-row"));
                const cur = rows.indexOf(row);
                const next = e.key === "ArrowDown"
                  ? (cur + 1) % rows.length
                  : (cur - 1 + rows.length) % rows.length;
                rows[cur].setAttribute("tabindex", "-1");
                rows[next].setAttribute("tabindex", "0");
                rows[next].focus({ preventScroll: true });
                scrollItemIntoView(rows[next], offspring);
              } else if (e.key === "Home") {
                e.preventDefault();
                const rows = Array.from(offspring.querySelectorAll(".cross-row"));
                rows.forEach(r => r.setAttribute("tabindex", "-1"));
                rows[0].setAttribute("tabindex", "0");
                rows[0].focus({ preventScroll: true });
                scrollItemIntoView(rows[0], offspring);
              } else if (e.key === "End") {
                e.preventDefault();
                const rows = Array.from(offspring.querySelectorAll(".cross-row"));
                rows.forEach(r => r.setAttribute("tabindex", "-1"));
                rows[rows.length - 1].setAttribute("tabindex", "0");
                rows[rows.length - 1].focus({ preventScroll: true });
                scrollItemIntoView(rows[rows.length - 1], offspring);
              }
            });
            row.setAttribute("aria-pressed", isSelected ? "true" : "false");
            const lbl = document.createElement("div");
            lbl.className = "cross-label";
            lbl.setAttribute("aria-hidden", "true");
            lbl.innerHTML = SIM.selectedTrial + (gi + 1) + "<br><span style='font-weight:400'>(" + crossPlants.length + ")</span>";
            row.appendChild(lbl);
            const plantsWrap = document.createElement("div");
            plantsWrap.className = "cross-plants";
            crossPlants.forEach(pl => {
              const cell = document.createElement("div");
              cell.className = "offspring-plant";
              cell.setAttribute("aria-hidden", "true");
              if (pl.infected) {
                cell.classList.add("infected");
                cell.innerHTML = bananaTreeInfectedSVG;
              } else {
                cell.innerHTML = bananaTreeSVG;
              }
              plantsWrap.appendChild(cell);
            });
            row.appendChild(plantsWrap);
            offspring.appendChild(row);
          });

          // Set initial roving tabindex
          updateCrossRowTabindex();

          // Max crosses label after C6
          if (st.crosses.length >= MAX_CROSSES) {
            const maxLabel = document.createElement("div");
            maxLabel.className = "sim-offspring-placeholder";
            maxLabel.textContent = "Max number of crosses reached";
            maxLabel.style.margin = "6px 0";
            maxLabel.style.padding = "2px 0";
            offspring.appendChild(maxLabel);
          }

          // Fungus divider at the end if introduced after last cross
          if (st.fungusAfterCross !== null && st.fungusAfterCross === st.crosses.length && st.crosses.length > 0) {
            const divider = document.createElement("div");
            divider.className = "fungus-divider";
            const dlbl = document.createElement("span");
            dlbl.className = "fungus-divider-label";
            dlbl.innerHTML = fungusAddedSVG + "Fungus introduced after " + SIM.selectedTrial + st.fungusAfterCross;
            divider.appendChild(dlbl);
            offspring.appendChild(divider);
          }

          // Scroll position set by caller when needed
          requestAnimationFrame(updateOffspringTabindex);
        }
        SIM.renderOffspring = renderOffspring;

        // Bottom: Buttons
        const buttons = document.createElement("div");
        buttons.className = "sim-buttons";
        // Fungus toggle switch
        const fungusSwitch = document.createElement("div");
        fungusSwitch.className = "sim-switch disabled";
        fungusSwitch.setAttribute("role", "switch");
        fungusSwitch.setAttribute("aria-checked", "false");
        fungusSwitch.setAttribute("aria-labelledby", "sim-switch-label");
        fungusSwitch.setAttribute("tabindex", "0");
        const fungusIcon = createSVGIcon(fungusAddedSVG);
        fungusSwitch.appendChild(fungusIcon);
        const fungusLabel = document.createElement("span");
        fungusLabel.className = "sim-switch-label";
        fungusLabel.id = "sim-switch-label";
        fungusLabel.textContent = "Fungus";
        fungusSwitch.appendChild(fungusLabel);
        const hitArea = document.createElement("div");
        hitArea.className = "sim-switch-hit";
        const offLabel = document.createElement("span");
        offLabel.className = "sim-switch-state";
        offLabel.textContent = "Off";
        offLabel.style.fontWeight = "700";
        offLabel.setAttribute("aria-hidden", "true");
        hitArea.appendChild(offLabel);
        const track = document.createElement("div");
        track.className = "sim-switch-track";
        const thumb = document.createElement("div");
        thumb.className = "sim-switch-thumb";
        track.appendChild(thumb);
        hitArea.appendChild(track);
        const onLabel = document.createElement("span");
        onLabel.className = "sim-switch-state";
        onLabel.textContent = "On";
        onLabel.setAttribute("aria-hidden", "true");
        hitArea.appendChild(onLabel);
        fungusSwitch.appendChild(hitArea);
        SIM.fungusBtn = fungusSwitch;
        function toggleFungus() {
          if (fungusSwitch.classList.contains("disabled")) return;
          const trial = SIM.selectedTrial;
          const st = SIM.trialState[trial];
          if (!st) return;
          if (st.fungusAfterCross === null) {
            st.fungusAfterCross = st.crosses.length;
            fungusSwitch.setAttribute("aria-checked", "true");
            track.classList.add("on");
            offLabel.style.fontWeight = "400";
            onLabel.style.fontWeight = "700";
            if (SIM.announce) SIM.announce("Fungus introduced.");
          } else {
            st.fungusAfterCross = null;
            fungusSwitch.setAttribute("aria-checked", "false");
            track.classList.remove("on");
            offLabel.style.fontWeight = "700";
            onLabel.style.fontWeight = "400";
            if (SIM.announce) SIM.announce("Fungus removed.");
          }
          if (SIM.updateTrialCardLabel) SIM.updateTrialCardLabel(trial);
          renderOffspring(trial);
          offspring.scrollTop = offspring.scrollHeight;
          SIM.updateSimButtons();
          if (SIM.updateDataPanel) SIM.updateDataPanel();
        }
        hitArea.addEventListener("click", toggleFungus);
        fungusSwitch.addEventListener("keydown", (e) => {
          if ((e.key === "Enter" || e.key === " ") && !e.repeat) { e.preventDefault(); toggleFungus(); }
        });
        buttons.appendChild(fungusSwitch);

        ["Cross Plants", "Reset Trial"].forEach(label => {
          const btn = document.createElement("button");
          btn.className = "sim-btn";
          const iconMap = {
            "Cross Plants": crossIconSVG,
            "Reset Trial": resetIconSVG
          };
          if (iconMap[label]) {
            const icon = createSVGIcon(iconMap[label]);
            btn.appendChild(icon);
            const span = document.createElement("span");
            span.textContent = label;
            btn.appendChild(span);
          } else {
            btn.textContent = label;
          }
          if (label === "Cross Plants") {
            setAriaDisabled(btn, true);
            SIM.crossBtn = btn;
            btn.addEventListener("click", () => {
              if (btn.getAttribute("aria-disabled") === "true") return;
              const trial = SIM.selectedTrial;
              const st = SIM.trialState[trial];
              if (st && st.p1 && st.p2 && st.crosses.length < MAX_CROSSES) {
                const wasUnlocked = !st.locked;
                st.locked = true;
                parents.querySelectorAll(".sim-dropdown").forEach(d => d._lock());
                const count = OFFSPRING_MIN + Math.floor(Math.random() * (OFFSPRING_MAX - OFFSPRING_MIN + 1));
                const isFungusActive = st.fungusAfterCross !== null && st.crosses.length >= st.fungusAfterCross;
                const genotypes = {
                  "Wild W1": ["R", "r"],
                  "Wild W2": ["R", "R"],
                  "Wild W3": ["R", "r"],
                  "Cavendish C1": ["r", "r"],
                  "Cavendish C2": ["r", "r"]
                };
                const g1 = genotypes[st.p1];
                const g2 = genotypes[st.p2];
                const plants = [];
                for (let p = 0; p < count; p++) {
                  const a1 = g1[Math.floor(Math.random() * 2)];
                  const a2 = g2[Math.floor(Math.random() * 2)];
                  const isResistant = a1 === "R" || a2 === "R";
                  plants.push({ infected: isFungusActive && !isResistant, genotype: a1 + a2 });
                }
                st.crosses.push(plants);
                const healthy = plants.filter(p => !p.infected).length;
                const infected = plants.filter(p => p.infected).length;
                let crossMsg = "Cross " + st.crosses.length + ": " + plants.length + " offspring, " + healthy + " healthy, " + infected + " infected.";
                if (wasUnlocked) crossMsg += " Parents locked.";
                if (SIM.announce) SIM.announce(crossMsg);
                if (SIM.updateTrialCardLabel) SIM.updateTrialCardLabel(trial);
                renderOffspring(trial);
                offspring.scrollTop = offspring.scrollHeight;
                SIM.updateSimButtons();
              }
            });
          }
          if (label === "Reset Trial") {
            setAriaDisabled(btn, true);
            SIM.resetBtn = btn;
            btn.addEventListener("click", () => {
              if (btn.getAttribute("aria-disabled") === "true") return;
              const trial = SIM.selectedTrial;
              if (SIM.trialState[trial]) {
                SIM.trialState[trial] = { p1: null, p2: null, locked: false, crosses: [], fungusAfterCross: null };
                if (SIM.updateTrialCardLabel) SIM.updateTrialCardLabel(trial);
                if (SIM.syncDropdownsToTrial) SIM.syncDropdownsToTrial(trial);
                renderOffspring(trial);
                SIM.updateSimButtons();
                if (SIM.announce) SIM.announce("Trial " + trial + " reset.");
              }
            });
          }
          buttons.appendChild(btn);
        });
        inner.appendChild(buttons);

        // Watch buttons container width to toggle fungus switch stacking
        // Update button disabled states based on current trial
        SIM.updateSimButtons = function() {
          const trial = SIM.selectedTrial;
          const st = SIM.trialState[trial];
          if (!st) return;
          // Cross Plants: enabled only when both parents selected
          if (SIM.crossBtn) setAriaDisabled(SIM.crossBtn, !(st.p1 && st.p2) || st.crosses.length >= MAX_CROSSES);
          // Fungus switch: sync visual state and disabled
          if (SIM.fungusBtn) {
            const isOn = st.fungusAfterCross !== null;
            const switchTrack = SIM.fungusBtn.querySelector(".sim-switch-track");
            SIM.fungusBtn.setAttribute("aria-checked", isOn ? "true" : "false");
            if (switchTrack) { if (isOn) switchTrack.classList.add("on"); else switchTrack.classList.remove("on"); }
            const offLbl = SIM.fungusBtn.querySelectorAll(".sim-switch-state")[0];
            const onLbl = SIM.fungusBtn.querySelectorAll(".sim-switch-state")[1];
            if (offLbl) offLbl.style.fontWeight = isOn ? "400" : "700";
            if (onLbl) onLbl.style.fontWeight = isOn ? "700" : "400";
            if (st.crosses.length > 0 || !(st.p1 && st.p2)) {
              SIM.fungusBtn.classList.add("disabled");
              setAriaDisabled(SIM.fungusBtn, true);
            } else {
              SIM.fungusBtn.classList.remove("disabled");
              setAriaDisabled(SIM.fungusBtn, false);
            }
          }
          // Reset Trial: enabled when at least one parent selected
          if (SIM.resetBtn) setAriaDisabled(SIM.resetBtn, !(st.p1 || st.p2 || st.crosses.length > 0));
          // Update stats label and data panel
          updateStatsLabel();
          if (SIM.updateDataPanel) SIM.updateDataPanel();
          const activeCard = SIM.trialCards[trial];
          if (activeCard) {
            const container = activeCard.closest(".trials-scroll");
            if (container) {
              const cRect = container.getBoundingClientRect();
              const eRect = activeCard.getBoundingClientRect();
              const cs = getComputedStyle(container);
              const padTop = parseFloat(cs.paddingTop);
              const gap = parseFloat(cs.gap) || 10;
              if (eRect.top < cRect.top + padTop) {
                container.scrollBy({ top: eRect.top - cRect.top - padTop, behavior: "smooth" });
              } else if (eRect.bottom > cRect.bottom - gap) {
                container.scrollBy({ top: eRect.bottom - cRect.bottom + gap, behavior: "smooth" });
              }
            }
          }
        };

        panel.appendChild(inner);
        SIM._buttons = buttons;
        SIM._panel = panel;
      }

      // Data panel content
      if (p.name === "Data") {
        const dataInner = document.createElement("div");
        dataInner.className = "data-panel-inner";

        // --- Top half: Pie Chart ---
        const topHalf = document.createElement("div");
        topHalf.className = "data-half pie-chart";
        const pieTitle = document.createElement("div");
        pieTitle.className = "data-chart-title";
        pieTitle.textContent = "Offspring Phenotypes:";
        topHalf.appendChild(pieTitle);
        const piePill = document.createElement("span");
        piePill.className = "data-chart-pill";
        piePill.textContent = "All Crosses";
        const pillClose = document.createElement("button");
        pillClose.className = "pill-close";
        pillClose.innerHTML = '<svg aria-hidden="true" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><polygon fill="currentColor" fill-rule="nonzero" points="16.0104076 5.40380592 11.4142136 10 16.0104076 14.5961941 14.5961941 16.0104076 10 11.4142136 5.40380592 16.0104076 3.98959236 14.5961941 8.58578644 10 3.98959236 5.40380592 5.40380592 3.98959236 10 8.58578644 14.5961941 3.98959236"/></svg>';
        pillClose.setAttribute("aria-label", "Deselect cross, show all crosses");
        pillClose.addEventListener("click", (e) => {
          e.stopPropagation();
          const trial = SIM.selectedTrial;
          const prevIdx = SIM.selectedCross ? SIM.selectedCross[trial] : null;
          if (SIM.selectedCross) SIM.selectedCross[trial] = null;
          if (SIM.renderOffspring) SIM.renderOffspring(trial);
          if (SIM.updateDataPanel) SIM.updateDataPanel();
          if (prevIdx !== null && prevIdx !== undefined) {
            const rows = document.querySelectorAll(".cross-row");
            const target = rows[prevIdx] || rows[0];
            if (target) target.focus();
          }
        });
        piePill.appendChild(pillClose);
        piePill.addEventListener("click", () => {
          const trial = SIM.selectedTrial;
          const selCross = SIM.selectedCross ? SIM.selectedCross[trial] : null;
          if (selCross === null || selCross === undefined) return;
          const rows = document.querySelectorAll(".cross-row");
          const target = rows[selCross];
          if (!target) return;
          const container = target.closest(".sim-offspring");
          if (!container) return;
          const cs = getComputedStyle(container);
          const padTop = parseFloat(cs.paddingTop);
          const padBottom = parseFloat(cs.paddingBottom);
          const cRect = container.getBoundingClientRect();
          const tRect = target.getBoundingClientRect();
          const scrollBehavior = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
          if (tRect.top < cRect.top + padTop) {
            container.scrollBy({ top: tRect.top - cRect.top - padTop, behavior: scrollBehavior });
          } else if (tRect.bottom > cRect.bottom - padBottom) {
            container.scrollBy({ top: tRect.bottom - cRect.bottom + padBottom, behavior: scrollBehavior });
          }
        });
        topHalf.appendChild(piePill);
        const pieChartBody = document.createElement("div");
        pieChartBody.className = "data-chart-body";
        const pieCanvas = document.createElement("canvas");
        pieCanvas.width = 160 * (window.devicePixelRatio || 1);
        pieCanvas.height = 100 * (window.devicePixelRatio || 1);
        pieCanvas.style.width = "160px";
        pieCanvas.style.height = "100px";
        pieCanvas.setAttribute("role", "img");
        pieCanvas.setAttribute("aria-label", "Pie chart showing offspring phenotype percentages");
        pieChartBody.appendChild(pieCanvas);
        topHalf.appendChild(pieChartBody);
        const pieLegend = document.createElement("div");
        pieLegend.className = "data-chart-legend";
        pieLegend.innerHTML =
          '<span class="data-legend-item">' +
            '<span class="data-legend-label"><span class="data-legend-swatch" style="background:#3D9441"></span>Healthy</span>' +
            '<span class="data-legend-pct" id="pie-pct-healthy">\u2013</span>' +
          '</span>' +
          '<span class="data-legend-item">' +
            '<span class="data-legend-label"><span class="data-legend-swatch" style="background:#502600"></span>Infected</span>' +
            '<span class="data-legend-pct" id="pie-pct-infected">\u2013</span>' +
          '</span>';
        topHalf.appendChild(pieLegend);
        dataInner.appendChild(topHalf);

        // Divider
        const divider = document.createElement("div");
        divider.className = "data-divider";
        dataInner.appendChild(divider);

        // --- Bottom half: Bar Chart ---
        const bottomHalf = document.createElement("div");
        bottomHalf.className = "data-half bar-chart";
        const barTitle = document.createElement("div");
        barTitle.className = "data-chart-title";
        barTitle.innerHTML = "<span style='white-space:nowrap'>Fungus Resistance</span> over<br>All Crosses";
        bottomHalf.appendChild(barTitle);
        const barChartBody = document.createElement("div");
        barChartBody.className = "data-chart-body";
        const barCanvas = document.createElement("canvas");
        barCanvas.style.width = "100%";
        barCanvas.style.height = "158px";
        barCanvas.setAttribute("role", "img");
        barCanvas.setAttribute("aria-label", "Bar chart showing fungus resistance over crosses");
        barChartBody.appendChild(barCanvas);
        const barTable = document.createElement("table");
        barTable.className = "sr-only";
        barTable.setAttribute("aria-label", "Fungus resistance data by cross");
        barChartBody.appendChild(barTable);
        bottomHalf.appendChild(barChartBody);
        const barLegend = document.createElement("div");
        barLegend.className = "data-chart-legend";
        barLegend.innerHTML =
          '<span class="data-legend-item">' +
            '<span class="data-legend-label"><span class="data-legend-swatch" style="background:#3D9441"></span>Healthy</span>' +
          '</span>' +
          '<span class="data-legend-item">' +
            '<span class="data-legend-label"><span class="data-legend-swatch" style="background:#502600"></span>Infected</span>' +
          '</span>';
        bottomHalf.appendChild(barLegend);
        dataInner.appendChild(bottomHalf);

        panel.appendChild(dataInner);

        // --- Data update function ---
        SIM.updateDataPanel = function() {
          if (SIM.updateCircleSize) SIM.updateCircleSize();
          // Adjust legend gaps based on panel width
          const panelW = panel.clientWidth;
          const gapVal = Math.max(4, Math.min(20, Math.round((panelW - 150) * (20 - 4) / (285 - 150) + 4)));
          pieLegend.style.gap = gapVal + "px";
          barLegend.style.gap = gapVal + "px";
          if (panelW < 230) {
            barTitle.innerHTML = "Fungus Resistance<br>over All Crosses";
          } else {
            barTitle.innerHTML = "Fungus Resistance over<br>All Crosses";
          }

          const trial = SIM.selectedTrial;
          const st = SIM.trialState[trial];
          if (!st) return;
          const selCross = SIM.selectedCross ? SIM.selectedCross[trial] : null;
          const hasSelection = selCross !== null && selCross !== undefined && st.crosses[selCross];
          const aboutBtn = document.querySelector(".sim-info-btn");
          if (aboutBtn) {
            aboutBtn.classList.toggle("compact-hit", !!hasSelection);
          }

          // Compute stats
          let plants = [];
          if (hasSelection) {
            plants = st.crosses[selCross];
            piePill.innerHTML = SIM.selectedTrial + (selCross + 1) + "&nbsp;<span style='font-weight:400'>(" + plants.length + " offspring)</span>";
            piePill.setAttribute("aria-label", "Scroll to cross " + SIM.selectedTrial + (selCross + 1));
            piePill.appendChild(pillClose);
            piePill.classList.add("active");
          } else if (st.crosses.length > 0) {
            plants = st.crosses.flat();
            piePill.textContent = "All Crosses";
            piePill.removeAttribute("aria-label");
            piePill.appendChild(pillClose);
            piePill.classList.remove("active");
          } else {
            piePill.textContent = "All Crosses";
            piePill.removeAttribute("aria-label");
            piePill.appendChild(pillClose);
            piePill.classList.remove("active");
          }

          const total = plants.length;
          const infected = plants.filter(p => p.infected).length;
          const healthy = total - infected;

          // Update legend percentages
          const pctHealthyEl = document.getElementById("pie-pct-healthy");
          const pctInfectedEl = document.getElementById("pie-pct-infected");
          if (total === 0) {
            if (pctHealthyEl) pctHealthyEl.textContent = "\u2013";
            if (pctInfectedEl) pctInfectedEl.textContent = "\u2013";
          } else {
            const hPct = Math.round((healthy / total) * 100);
            const iPct = 100 - hPct;
            if (pctHealthyEl) pctHealthyEl.textContent = hPct + "%";
            if (pctInfectedEl) pctInfectedEl.textContent = iPct + "%";
          }

          // --- Draw Pie ---
          const dprPie = window.devicePixelRatio || 1;
          pieCanvas.width = 160 * dprPie;
          pieCanvas.height = 100 * dprPie;
          const pCtx = pieCanvas.getContext("2d");
          pCtx.setTransform(1, 0, 0, 1, 0, 0);
          pCtx.clearRect(0, 0, pieCanvas.width, pieCanvas.height);
          pCtx.scale(dprPie, dprPie);
          const pw = 160, ph = 100;
          const cx = pw / 2, cy = 49, r = Math.min(pw, ph) / 2 - 10;

          if (total === 0) {
            pCtx.beginPath();
            pCtx.arc(cx, cy, r, 0, Math.PI * 2);
            pCtx.fillStyle = (SIMS[activeSim].theme && SIMS[activeSim].theme.titleBarBg) || "#e8e8e8";
            pCtx.fill();
            pCtx.fillStyle = "#333";
            pCtx.font = "16px Lato, sans-serif";
            pCtx.textAlign = "center";
            pCtx.textBaseline = "middle";
            pCtx.fillText("No data", cx, cy);
          } else {
            const hPct = Math.round((healthy / total) * 100);
            const iPct = 100 - hPct;
            const slices = [];
            if (infected > 0) slices.push({ pct: infected / total, color: "#502600", labelColor: "#fff", label: iPct + "%" });
            if (healthy > 0) slices.push({ pct: healthy / total, color: "#45A54A", labelColor: "#000", label: hPct + "%" });

            let startAngle = -Math.PI / 2;
            slices.forEach(s => {
              const sweep = s.pct * 2 * Math.PI;
              pCtx.beginPath();
              pCtx.moveTo(cx, cy);
              pCtx.arc(cx, cy, r, startAngle, startAngle + sweep);
              pCtx.closePath();
              pCtx.fillStyle = s.color;
              pCtx.fill();
              s._mid = startAngle + sweep / 2;
              startAngle += sweep;
            });
            slices.forEach(s => {
              const mid = s._mid;
              let lx, ly;
              if (s.pct >= 1) {
                lx = cx;
                ly = cy;
              } else if (s.pct > 0.25) {
                const d = r * 0.55;
                lx = cx + d * Math.cos(mid);
                ly = cy + d * Math.sin(mid);
              } else {
                const d = r * (2 / 3);
                lx = cx + d * Math.cos(mid);
                ly = cy + d * Math.sin(mid);
              }
              if (s.pct > 0.08) {
                pCtx.fillStyle = s.labelColor;
                pCtx.font = "bold 16px Lato, sans-serif";
                pCtx.textAlign = "center";
                pCtx.textBaseline = "middle";
                pCtx.fillText(s.label, lx, ly);
              }
            });
          }

          // --- Draw Bar Chart ---
          const dprBar = window.devicePixelRatio || 1;
          const bCtx = barCanvas.getContext("2d");
          const lw = barChartBody.clientWidth || 260, lh = 158;
          barCanvas.width = lw * dprBar;
          barCanvas.height = lh * dprBar;
          bCtx.setTransform(1, 0, 0, 1, 0, 0);
          bCtx.clearRect(0, 0, barCanvas.width, barCanvas.height);
          bCtx.scale(dprBar, dprBar);

          const hasFungus = st.fungusAfterCross !== null;
          const margin = { top: hasFungus ? 35 : 15, right: 8, bottom: 28, left: 44 };
          const gw = lw - margin.left - margin.right;
          const gh = lh - margin.top - margin.bottom;

          // Y-axis gridlines & labels (always visible)
          bCtx.strokeStyle = "#949494";
          bCtx.lineWidth = 1;
          bCtx.fillStyle = "#333";
          bCtx.font = "400 16px 'Roboto Condensed', sans-serif";
          bCtx.textAlign = "right";
          bCtx.textBaseline = "middle";
          for (let i = 0; i <= 4; i++) {
            const y = margin.top + gh - (i / 4) * gh;
            bCtx.beginPath();
            bCtx.moveTo(margin.left, y);
            bCtx.lineTo(margin.left + gw, y);
            bCtx.stroke();
            bCtx.fillText((i * 25) + "%", margin.left - 6, y);
          }

          const gens = st.crosses;
          if (gens.length === 0) {
            if (st.fungusAfterCross !== null) {
              drawFungusFlag(bCtx, margin.left, margin, gh, false, lw);
            } else {
              bCtx.fillStyle = "#333";
              bCtx.font = "16px Lato, sans-serif";
              bCtx.textAlign = "center";
              bCtx.textBaseline = "middle";
              bCtx.fillText("No data", margin.left + gw / 2, margin.top + gh / 2);
            }
            barTable.innerHTML = "";
            pieCanvas.setAttribute("aria-label", "Pie chart: no data");
            return;
          }

          // Compute healthy % per cross
          const healthyPcts = gens.map(g => {
            const t = g.length;
            const inf = g.filter(p => p.infected).length;
            return t > 0 ? ((t - inf) / t) * 100 : 100;
          });
          const infectedPcts = healthyPcts.map(h => 100 - h);

          // Bar chart layout
          const groupGap = 4;
          const barGap = 2;
          const groupW = gw / gens.length;
          const barW = (groupW - groupGap - barGap) / 2;

          // Highlight selected cross (behind labels and bars)
          if (selCross !== null && selCross !== undefined && selCross < gens.length) {
            const groupX = margin.left + selCross * groupW;
            const hlHeight = gh + 27;
            bCtx.globalAlpha = 0.8;
            bCtx.fillStyle = (SIMS[activeSim].theme && SIMS[activeSim].theme.crossLabelBg) || "#FFE680";
            bCtx.fillRect(groupX, margin.top, groupW, hlHeight);
            bCtx.globalAlpha = 1;
          }

          // X-axis labels
          bCtx.textAlign = "center";
          bCtx.textBaseline = "top";
          bCtx.font = "400 16px 'Roboto Condensed', sans-serif";
          gens.forEach((_, gi) => {
            const groupX = margin.left + gi * groupW + groupW / 2;
            bCtx.fillStyle = "#333";
            bCtx.fillText(SIM.selectedTrial + (gi + 1), groupX, margin.top + gh + 9);
          });

          // Fungus introduction marker
          if (st.fungusAfterCross !== null) {
            const fgi = st.fungusAfterCross;
            let fx;
            if (fgi === 0) {
              fx = margin.left;
            } else if (fgi >= gens.length) {
              fx = margin.left + gw;
            } else {
              fx = margin.left + fgi * groupW;
            }
            drawFungusFlag(bCtx, fx, margin, gh, true, lw);
          }

          // Draw bars
          gens.forEach((_, gi) => {
            const groupX = margin.left + gi * groupW + groupGap / 2;
            const hH = Math.max(2, (healthyPcts[gi] / 100) * gh);
            const iH = Math.max(2, (infectedPcts[gi] / 100) * gh);
            const hX = groupX;
            const iX = groupX + barW + barGap;

            bCtx.fillStyle = "#3D9441";
            bCtx.fillRect(hX, margin.top + gh - hH, barW, hH);
            bCtx.fillStyle = "#502600";
            bCtx.fillRect(iX, margin.top + gh - iH, barW, iH);
          });

          // Dynamic aria-labels for charts
          if (total === 0) {
            pieCanvas.setAttribute("aria-label", "Pie chart: no data");
            barCanvas.setAttribute("aria-label", "Bar chart: no data");
            barTable.innerHTML = "";
          } else {
            const hPctLabel = Math.round((healthy / total) * 100);
            const iPctLabel = 100 - hPctLabel;
            const crossLabel = (selCross !== null && selCross !== undefined) ? "cross " + SIM.selectedTrial + (selCross + 1) : "all crosses";
            pieCanvas.setAttribute("aria-label", "Pie chart showing offspring phenotypes for " + crossLabel + ": " + hPctLabel + "% healthy, " + iPctLabel + "% infected");
            const lastHealthy = Math.round(healthyPcts[healthyPcts.length - 1]);
            const lastInfected = 100 - lastHealthy;
            barCanvas.setAttribute("aria-label", "Bar chart showing fungus resistance over " + gens.length + " cross" + (gens.length > 1 ? "es" : "") + ". Latest: " + lastHealthy + "% healthy, " + lastInfected + "% infected");

            // Hidden data table for SR exploration of bar chart
            let tableHTML = "<thead><tr><th>Cross</th><th>Healthy</th><th>Infected</th></tr></thead><tbody>";
            gens.forEach((g, gi) => {
              const hP = Math.round(healthyPcts[gi]);
              const iP = 100 - hP;
              const fungusMarker = (st.fungusAfterCross !== null && gi === st.fungusAfterCross) ? " (fungus introduced)" : "";
              tableHTML += "<tr><td>C" + (gi + 1) + fungusMarker + "</td><td>" + hP + "%</td><td>" + iP + "%</td></tr>";
            });
            tableHTML += "</tbody>";
            barTable.innerHTML = tableHTML;
          }
        };
      }

      panelWrap.appendChild(panel);

      // Title tab (overlays top of panel)
      const tab = document.createElement("div");
      tab.className = "sim-panel-tab";
      const tabLabel = document.createElement("h2");
      tabLabel.className = "sim-panel-tab-label";
      tabLabel.textContent = p.name;
      tab.appendChild(tabLabel);
      if (p.subtitle) {
        const bc = (SIMS[activeSim].theme && SIMS[activeSim].theme.panelBorder) || "#555";
        tab.style.border = "2px solid " + bc;
        tab.style.borderRight = "none";
        tab.style.borderRadius = "999px 0 0 999px";
        tab.style.position = "static";
        tab.style.transform = "none";
        tab.style.left = "";
        tab.style.height = "100%";
        const tabSub = document.createElement("div");
        const surfaceBg = (SIMS[activeSim].theme && SIMS[activeSim].theme.surface) || "#fff";
        tabSub.style.cssText = "display:flex;align-items:center;padding:0 12px 0 10px;background:" + surfaceBg + ";height:100%;box-sizing:border-box;border:2px solid " + bc + ";border-left:none;border-radius:0 999px 999px 0;";
        const tabSubLabel = document.createElement("span");
        tabSubLabel.className = "sim-panel-tab-subtitle";
        tabSubLabel.textContent = p.subtitle;
        tabSub.appendChild(tabSubLabel);
        const tabWrap = document.createElement("div");
        tabWrap.className = "sim-tab-wrap";
        tabWrap.appendChild(tab);
        tabWrap.appendChild(tabSub);
        panelWrap.appendChild(tabWrap);
      } else
      if (p.name === "Data") {
        tab.style.position = "static";
        tab.style.transform = "none";
        tab.style.left = "";
        const tabWrap = document.createElement("div");
        tabWrap.style.cssText = "position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:36px;z-index:11;";
        tabWrap.appendChild(tab);
        panelWrap.appendChild(tabWrap);
      } else {
        panelWrap.appendChild(tab);
      }

      wrap.appendChild(panelWrap);
    });

    // Initial data panel render
    if (SIM.updateDataPanel) SIM.updateDataPanel();
    if (SIM.updateNorDropdownSize) SIM.updateNorDropdownSize();
    document.fonts.ready.then(() => {
      // Re-measure condensed dropdown width now that fonts are loaded
      const triggers = document.querySelectorAll(".sim-dropdown-trigger");
      if (triggers.length) {
        const m = document.createElement("span");
        m.style.cssText = "font-family:'Roboto Condensed',sans-serif;font-weight:400;font-size:16px;visibility:hidden;position:absolute;white-space:nowrap;";
        document.body.appendChild(m);
        const opts = ["Wild W1", "Wild W2", "Wild W3", "Cavendish C1", "Cavendish C2"];
        let mxC = 0;
        opts.forEach(o => { m.textContent = o; mxC = Math.max(mxC, m.offsetWidth); });
        document.body.removeChild(m);
        triggers.forEach(t => { t._condensedW = mxC + 0 + 18 + 12 + 4; });
      }
      if (SIM.updateDataPanel) SIM.updateDataPanel();
      if (SIM.updateNorDropdownSize) SIM.updateNorDropdownSize();
    });

    // Ctrl+Arrow: navigate between panels
    const panelEls = wrap.querySelectorAll('.sim-panel[role="region"]');
    if (SIM.panelNavHandler) document.removeEventListener("keydown", SIM.panelNavHandler);
    SIM.panelNavHandler = (e) => {
      if (!e.ctrlKey || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
      e.preventDefault();
      const panelArr = Array.from(panelEls);
      const active = document.activeElement;
      let curIdx = -1;
      panelArr.forEach((p, i) => { if (p.contains(active)) curIdx = i; });
      const dir = e.key === "ArrowRight" ? 1 : -1;
      for (let i = 1; i <= panelArr.length; i++) {
        const nextIdx = (curIdx + dir * i + panelArr.length * panelArr.length) % panelArr.length;
        const focusable = nextIdx === curIdx ? null : panelArr[nextIdx].querySelectorAll('[tabindex="0"], button:not([tabindex="-1"]), a, input, select, textarea');
        if (focusable && focusable.length > 0) {
          focusable[0].focus();
          break;
        }
      }
    };
    document.addEventListener("keydown", SIM.panelNavHandler);

    return wrap;
  }

            resetBtn.setAttribute("tabindex", isSelected ? "0" : "-1");
          }
        }

        function buildTrialCard(letter) {
          trialState[letter] = SIM._defaultNorTrialState ? SIM._defaultNorTrialState() : {};

          card.setAttribute("tabindex", "-1");
          card.setAttribute("aria-label", "Trial " + letter);
          card.style.cursor = "pointer";
          SIM.trialCards[letter] = card;
          function selectTrial() {
            selectTrialByCard(card, letter);
          }
          card.addEventListener("click", selectTrial);
          card.addEventListener("keydown", (e) => {
            if ((e.key === "Enter" || e.key === " ") && e.target === card) {

          lbl.className = "trial-card-label";
          lbl.textContent = letter;

            if (cur < 0) return;
            const next = e.key === "ArrowDown"
              ? (cur + 1) % cards.length

            cards[cur].setAttribute("tabindex", "-1");
            cards[next].setAttribute("tabindex", "0");
            cards[next].focus({ preventScroll: true });
            scrollItemIntoView(cards[next], scrollWrap);

            cards.forEach(c => c.setAttribute("tabindex", "-1"));

            scrollItemIntoView(cards[0], scrollWrap);
          } else if (e.key === "End") {
            e.preventDefault();
            const cards = getTrialNavCards();
            cards.forEach(c => c.setAttribute("tabindex", "-1"));

        function buildNorDropdown(labelText, options, icons) {

            const itemLabel = document.createElement("span");
            itemLabel.textContent = opt;

            var optPathNum = NOR_PATH_NUM[opt];
            if (optPathNum && labelText.indexOf("Pathway") === 0) item.setAttribute("aria-label", optPathNum + " " + opt);
            item.setAttribute("aria-selected", "false");
            item.id = id + "-opt-" + i;
            item.addEventListener("click", (e) => {

              selectItem(i);

              triggerIcon.innerHTML = icons[i];
              triggerIcon.style.background = "none";
              triggerIcon.style.borderRadius = "0";

            if (labelText === "Pathway for Ocean Air Mass") {
              var derivedTemp = options[i] === "S/SE" ? "Warm" : options[i] === "NE" ? "Cool" : null;
              if (derivedTemp) announceVal += "; Temperature for Ocean Air Mass: " + derivedTemp;
            }
            if (SIM.announce) SIM.announce(labelText + ": " + announceVal);
            if (SIM.saveNorSelection) SIM.saveNorSelection(labelText, options[i]);

            SIM._suppressOceanTempAnnounce = false;
            if (SIM.updateNorDropdownSize) SIM.updateNorDropdownSize();

          dropdown._setSelection = function(value) {
            if (value === null) {

              });

          function openDD(fromKeyboard) {
            document.querySelectorAll(".sim-dropdown.open").forEach(d => {

        };

        function fillDataPanel(outcome, instant) {
          var d = SIM._OUTCOME_DATA[outcome];
          if (!d || !SIM._outcomeBar) return;
          var isRepeat = SIM._lastFilledOutcome === outcome;
          SIM._lastFilledOutcome = outcome;
          if (isRepeat) return;
          function setIcon(el, svg) { el.innerHTML = svg; }
          function setText(el, text) { el.textContent = text; }
          if (!instant) {
            setText = function(el, text) {
              el.style.transition = "opacity 0.3s ease";
              el.style.opacity = "0";
              SIM._norRunTimeouts.push(setTimeout(function() {
                el.textContent = text;
                el.style.opacity = "1";
                if (SIM._checkNorDataLabels) SIM._checkNorDataLabels();
              }, 300));
            };
            setIcon = function(el, newSVG) {
              var old = document.createElement("span");
              old.style.cssText = "position:absolute;inset:0;transition:opacity 0.6s ease;";
              old.innerHTML = el.innerHTML;
              el.innerHTML = "";
              el.style.position = "relative";
              el.appendChild(old);
              var inc = document.createElement("span");
              inc.style.cssText = "position:absolute;inset:0;opacity:0;transition:opacity 0.3s ease 0.3s;";
              inc.innerHTML = newSVG;
              el.appendChild(inc);
              void inc.offsetWidth;
              old.style.opacity = "0";
              inc.style.opacity = "1";
              SIM._norRunTimeouts.push(setTimeout(function() {
                el.innerHTML = newSVG;
                el.style.position = "";
              }, 620));
            };
          }
          if (instant) {
            SIM._outcomeBarLabel.textContent = d.banner;
          } else {
            var incoming = document.createElement("span");
            incoming.style.cssText = "position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:1;opacity:0;transition:opacity 0.6s ease;";
            incoming.textContent = d.banner;
            SIM._outcomeBar.appendChild(incoming);
            SIM._outcomeBarLabel.style.transition = "opacity 0.6s ease";
            SIM._outcomeBarLabel.style.opacity = "0";
            void incoming.offsetWidth;
            incoming.style.opacity = "1";
            SIM._norRunTimeouts.push(setTimeout(function() {
              SIM._outcomeBarLabel.textContent = d.banner;
              SIM._outcomeBarLabel.style.transition = "none";
              SIM._outcomeBarLabel.style.opacity = "1";
              SIM._outcomeBarLabel.style.webkitTextStrokeColor = "transparent";
              if (incoming.parentNode) incoming.parentNode.removeChild(incoming);
            }, 620));
          }
          SIM._outcomeBar.style.color = "#333";
          SIM._outcomeBar.style.fontWeight = SIM._outcomePillCondensed ? "500" : "700";
          var skyIconMap = {
            "Overcast, storm clouds": SIM._skyIcons.overcast,
            "Overcast, hazy": SIM._skyIcons.overcastHazy,
            "Cloudy": SIM._skyIcons.cloudy,
            "Clear, breezy": SIM._skyIcons.clearingBreezy,
            "Sunny": SIM._skyIcons.sunny
          };
          var windIconMap = {
            "From the NE, 45–60 mph": SIM._windIcons.neHigh,
            "From the NE, 25–35 mph": SIM._windIcons.neMedium,
            "From the NE, 15–20 mph": SIM._windIcons.neLow,
            "From the NW, 15–25 mph": SIM._windIcons.nwLow,
            "From the S/SE, 5–15 mph": SIM._windIcons.sseLight,
            "Variable, 0–10 mph": SIM._windIcons.variable
          };
          var precipTypeIconMap = {
            "Rain (snow inland)": SIM._precipTypeIcons.rain,
            "Rain (mix inland)": SIM._precipTypeIcons.rain,
            "Light rain / wet snow": SIM._precipTypeIcons.lightRain,
            "Scattered rain": SIM._precipTypeIcons.strayShower,
            "None": SIM._precipTypeIcons.none
          };
          var precipAmtIconMap = {
            "Heavy": SIM._precipAmtIcons.heavy,
            "Moderate": SIM._precipAmtIcons.moderate,
            "Light": SIM._precipAmtIcons.light,
            "Trace": SIM._precipAmtIcons.trace,
            "None": SIM._precipAmtIcons.none
          };
          var stormIconMap = {
            "Strong": SIM._stormIcons.strong,
            "Moderate": SIM._stormIcons.moderate,
            "Weak": SIM._stormIcons.weak
          };
          var siVal = d.intensity || "";
          var rowData = [
            { valKey: "Sky", text: d["Sky"], iconEl: SIM._skyIcon, svg: skyIconMap[d["Sky"]] || SIM._skyIcons.sunny },
            { valKey: "Wind", text: d["Wind"], iconEl: SIM._windIcon, svg: windIconMap[d["Wind"]] || SIM._windIcons.none },
            { valKey: "Precipitation Type", text: d["Precipitation Type"], iconEl: SIM._precipTypeIcon, svg: precipTypeIconMap[d["Precipitation Type"]] || SIM._precipTypeIcons.none },
            { valKey: "Precipitation Amount", text: d["Precipitation Amount"], iconEl: SIM._precipAmtIcon, svg: precipAmtIconMap[d["Precipitation Amount"]] || SIM._precipAmtIcons.none },
            { valKey: "Storm Intensity", text: siVal, iconEl: SIM._stormIcon, svg: stormIconMap[siVal] || SIM._stormIcons.none }
          ];
          var vals = SIM._dataValueEls;
          var stagger = instant ? 0 : 150;
          rowData.forEach(function(r, i) {
            var delay = i * stagger;
            function doUpdate() {
              if (vals && vals[r.valKey]) {
                setText(vals[r.valKey], r.text);
                vals[r.valKey].style.color = "#333";
                vals[r.valKey].style.fontWeight = "400";
              }
              if (r.iconEl) {
                setIcon(r.iconEl, r.svg);
              }
            }
            if (delay === 0) { doUpdate(); }
            else { SIM._norRunTimeouts.push(setTimeout(doUpdate, delay)); }
          });
          if (SIM._checkNorDataLabels) SIM._checkNorDataLabels();
          if (!isRepeat) {
            if (SIM._stopSnow) SIM._stopSnow();
            if (SIM._stopSun) SIM._stopSun();
            if (SIM._stopWind) SIM._stopWind();
            if (SIM._stopHaze) SIM._stopHaze();
            if ((outcome === "strong" || outcome === "moderate" || outcome === "weak") && SIM._startSnow) {
              SIM._startSnow(outcome, instant);
            } else if (outcome === "fair" && SIM._startSun) {
              SIM._startSun(instant);
            } else if (outcome === "windy" && SIM._startWind) {
              SIM._startWind(instant);
            } else if (outcome === "humid" && SIM._startHaze) {
              SIM._startHaze(instant);
            }
          }
        }

        function clearDataPanel() {
          SIM._lastFilledOutcome = null;
          if (SIM._progressFill) {
            SIM._progressFill.style.transition = "none";
            SIM._progressFill.style.width = "0";
            SIM._progressFill.style.left = "0";
          }
          if (SIM._outcomeBar) {
            SIM._outcomeBarLabel.textContent = "–";
            SIM._outcomeBar.style.color = "#333";
            SIM._outcomeBar.style.fontWeight = "";
            SIM._outcomeBarLabel.style.transition = "none";
            SIM._outcomeBarLabel.style.webkitTextStrokeColor = "transparent";
          }
          var vals = SIM._dataValueEls;
          if (vals) {
            Object.keys(vals).forEach(function(key) {
              vals[key].textContent = "–";
              vals[key].style.color = "#333";
              vals[key].style.fontWeight = "400";
            });
          }
          if (SIM._skyIcon) {
            SIM._skyIcon.innerHTML = SIM._standInIcon;
          }
          if (SIM._windIcon) {
            SIM._windIcon.innerHTML = SIM._standInIcon;
          }
          if (SIM._precipTypeIcon) {
            SIM._precipTypeIcon.innerHTML = SIM._standInIcon;
          }
          if (SIM._precipAmtIcon) {
            SIM._precipAmtIcon.innerHTML = SIM._standInIcon;
          }
          if (SIM._stormIcon) {
            SIM._stormIcon.innerHTML = SIM._standInIcon;
          }
          if (SIM._checkNorDataLabels) SIM._checkNorDataLabels();
          if (SIM._stopSnow) SIM._stopSnow();
          if (SIM._stopSun) SIM._stopSun();
          if (SIM._stopWind) SIM._stopWind();
          if (SIM._stopHaze) SIM._stopHaze();
        }

        var NOR_LABEL_KEYS = {
          "Pathway for Land Air Mass": "landPath",
          "Humidity for Land Air Mass": "landHum",
          "Temperature for Land Air Mass": "landTemp",
          "Pathway for Ocean Air Mass": "oceanPath",
          "Humidity for Ocean Air Mass": "oceanHum"
        };

        function defaultNorTrialState() {
          return { landPath: null, landHum: null, landTemp: null, oceanPath: null, oceanHum: null, outcome: null, hasRun: false };
        }
        SIM._defaultNorTrialState = defaultNorTrialState;
        if (SIM.trialState && SIM.trialState["A"] && !SIM.trialState["A"].hasOwnProperty("hasRun")) {
          SIM.trialState["A"] = defaultNorTrialState();
        }

        SIM.saveNorSelection = function(labelText, value) {
          if (SIM._norRunning) return;
          var key = NOR_LABEL_KEYS[labelText];
          if (!key) return;
          var trial = SIM.selectedTrial;
          if (SIM.trialState && SIM.trialState[trial]) {
            SIM.trialState[trial][key] = value;
            if (SIM.updateTrialCardLabel) SIM.updateTrialCardLabel(trial);
          }
          if (SIM.updateAMColors) SIM.updateAMColors();
          if (SIM.updateArrowColors) SIM.updateArrowColors();
        };

        SIM.syncNorToTrial = function(letter) {
          SIM._norRunning = false;
          stage.removeAttribute("aria-busy");
          if (SIM._resetArrowPositions) SIM._resetArrowPositions();
          if (SIM._norRunTimeouts) { SIM._norRunTimeouts.forEach(clearTimeout); SIM._norRunTimeouts.length = 0; }
          var st = SIM.trialState[letter];
          if (!st) return;
          SIM._suppressAnnounce = true;
          if (st.hasRun) {
            norDropdowns.forEach(function(dd) {
              var key = NOR_LABEL_KEYS[dd._labelText];
              if (key && st[key]) dd._setSelection(st[key]);
              else dd._setSelection(null);
            });
            setNorPillMode(true);
            fillDataPanel(st.outcome, true);
            if (SIM._norPromptWrap) SIM._norPromptWrap.style.display = "none";
            SIM._norPromptVisible = false;

            if (SIM._stopNorCloud) SIM._stopNorCloud();
            if (SIM._stopWxFx) SIM._stopWxFx();
            if ((st.outcome === "strong" || st.outcome === "moderate" || st.outcome === "weak" || st.outcome === "humid") && SIM._showNorCloudFinal) {
              SIM._showNorCloudFinal(st.outcome);
            }

            stage.style.transition = "none";
            stage.style.backgroundColor = "#d8d8d8";
            if (SIM.runBtn) {
              SIM.runBtn.querySelector("span").textContent = "Replay";
              setAriaDisabled(SIM.runBtn, false);
            }
            if (SIM.resetTrialBtn) setAriaDisabled(SIM.resetTrialBtn, false);
            var syncOd = SIM._OUTCOME_DATA ? SIM._OUTCOME_DATA[st.outcome] : null;
            stage.setAttribute("aria-label", "Weather map, " + (syncOd ? syncOd.banner.toLowerCase() : "simulation complete"));
          } else {
            setNorPillMode(false);
            norDropdowns.forEach(function(dd) {
              var key = NOR_LABEL_KEYS[dd._labelText];
              if (key && st[key]) dd._setSelection(st[key]);
              else dd._setSelection(null);
            });
            clearDataPanel();
            if (SIM._stopNorCloud) SIM._stopNorCloud();

            stage.style.transition = "none";
            stage.style.backgroundColor = "#ebebeb";
            stage.setAttribute("aria-label", "Weather map");
            if (SIM.runBtn) SIM.runBtn.querySelector("span").textContent = "Run";
            updateNorButtons();
          }
          if (SIM.updateOceanTemp) SIM.updateOceanTemp();
          if (SIM.updateAMColors) SIM.updateAMColors();
          if (SIM.updateArrowColors) SIM.updateArrowColors();
          updateNorDropdownSize();
          SIM._suppressAnnounce = false;

          var parts = ["Trial " + letter];
          parts.push("Land Air Mass Pathway: " + (st.landPath ? NOR_PATH_NUM[st.landPath] + " " + st.landPath : "not selected"));
          parts.push("Land Air Mass Humidity: " + (st.landHum || "not selected"));
          parts.push("Land Air Mass Temperature: " + (st.landTemp || "not selected"));
          parts.push("Ocean Air Mass Pathway: " + (st.oceanPath ? NOR_PATH_NUM[st.oceanPath] + " " + st.oceanPath : "not selected"));
          parts.push("Ocean Air Mass Humidity: " + (st.oceanHum || "not selected"));
          parts.push("Ocean Air Mass Temperature: " + (st.oceanPath ? (st.oceanPath === "S/SE" ? "Warm" : "Cool") : "not selected"));
          if (st.hasRun && SIM._OUTCOME_DATA && SIM._OUTCOME_DATA[st.outcome]) {
            parts.push("Weather Outcome: " + SIM._OUTCOME_DATA[st.outcome].banner);
          } else {
            parts.push("Weather Outcome: simulation not run");
          }
          SIM.announce(parts.join("; "));
        };

        SIM.resetNorTrial = function(letter) {
          if (SIM._norRunTimeouts) { SIM._norRunTimeouts.forEach(clearTimeout); SIM._norRunTimeouts.length = 0; }
          if (SIM.trialState) SIM.trialState[letter] = defaultNorTrialState();
          if (letter === SIM.selectedTrial) {
            setNorPillMode(false);
            norDropdowns.forEach(function(dd) { dd._setSelection(null); });
            clearDataPanel();
            if (SIM._stopNorCloud) SIM._stopNorCloud();
            if (SIM._resetArrowPositions) SIM._resetArrowPositions();
            if (SIM._stopSnow) SIM._stopSnow();
            if (SIM._stopSun) SIM._stopSun();
            if (SIM._stopWind) SIM._stopWind();
            if (SIM._stopHaze) SIM._stopHaze();
            if (SIM._stopWxFx) SIM._stopWxFx();

            stage.style.transition = "none";
            stage.style.backgroundColor = "#ebebeb";
            if (SIM._norPromptWrap) SIM._norPromptWrap.style.display = "none";
            SIM._norPromptVisible = false;
            SIM._norRunning = false;
            stage.removeAttribute("aria-busy");
            stage.setAttribute("aria-label", "Weather map");

            if (SIM.runBtn) {
              SIM.runBtn.querySelector("span").textContent = "Run";
              setAriaDisabled(SIM.runBtn, true);
            }
            if (SIM.resetTrialBtn) setAriaDisabled(SIM.resetTrialBtn, true);
            if (SIM.updateOceanTemp) SIM.updateOceanTemp();
            if (SIM.updateAMColors) SIM.updateAMColors();
            if (SIM.updateArrowColors) SIM.updateArrowColors();
            updateNorDropdownSize();
          }
          if (SIM.updateTrialCardLabel) SIM.updateTrialCardLabel(letter);
        };

        function setNorPillMode(on) {
          norDropdowns.forEach(function(dd) {
            var tr = dd.querySelector(".sim-dropdown-trigger");
            var caret = tr.querySelector(".sim-dropdown-caret");
            if (on) {
              if (caret) caret.style.display = "none";
              var text = tr.querySelector(".sim-dropdown-text");
              if (text) text.style.flex = "none";
              tr.style.transition = "none";
              tr.style.pointerEvents = "none";
              tr.style.cursor = "default";
              tr.style.justifyContent = "center";
              tr.style.padding = "0 10px";
              tr.style.height = "38px";
              tr.style.minHeight = "0";
              dd.style.alignSelf = "center";
              tr.style.borderRadius = "999px";
              tr.style.borderColor = "transparent";
              tr.setAttribute("tabindex", "-1");
              tr.setAttribute("role", "img");
              tr.removeAttribute("aria-disabled");
              tr.removeAttribute("aria-expanded");
              tr.removeAttribute("aria-haspopup");
              tr.removeAttribute("aria-controls");
              var pillVal = tr.querySelector(".sim-dropdown-text");
              tr.setAttribute("aria-label", dd._labelText + ": " + (pillVal ? pillVal.textContent : ""));
            } else {
              if (caret) caret.style.display = "";
              var text = tr.querySelector(".sim-dropdown-text");
              if (text) text.style.flex = "";
              tr.style.transition = "";
              tr.style.pointerEvents = "";
              tr.style.cursor = "";
              tr.style.justifyContent = "";
              tr.style.height = "";
              tr.style.minHeight = "";
              dd.style.alignSelf = "";
              tr.style.borderRadius = "";
              tr.style.borderColor = "";
              tr.setAttribute("tabindex", "0");
              tr.setAttribute("role", "button");
              tr.removeAttribute("aria-disabled");
              tr.setAttribute("aria-expanded", "false");
              tr.setAttribute("aria-haspopup", "listbox");
              var list = dd.querySelector(".sim-dropdown-list");
              if (list) tr.setAttribute("aria-controls", list.id);
              if (dd._labelText) tr.setAttribute("aria-label", dd._labelText);
            }
          });
          if (SIM._oceanTempDisplay) {
            if (on) {
              SIM._oceanTempDisplay.style.height = "38px";
              SIM._oceanTempDisplay.style.minHeight = "0";
              SIM._oceanTempDisplay.style.alignSelf = "center";
            } else {
              SIM._oceanTempDisplay.style.height = "";
              SIM._oceanTempDisplay.style.minHeight = "";
              SIM._oceanTempDisplay.style.alignSelf = "";
            }
          }
          SIM._norPillMode = on;
          if (SIM.updateNorDropdownSize) SIM.updateNorDropdownSize();
        }

        // Column headers (row 1)
        ["", "Pathway", "Humidity", "Temperature"].forEach(text => {
          const hdr = document.createElement("div");
          hdr.className = "nor-col-header";
          hdr.textContent = text;
          grid.appendChild(hdr);
        });

        // Row 2: Land Air Mass
        const am1 = document.createElement("div");
        am1.className = "nor-air-mass";
        am1.innerHTML = '<div class="nor-air-mass-icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M24.0038528,17.4002279 L24,20 L-2.84217094e-14,20 L0.00424533809,17.419615 L5.30400339,8.94000212 L6.85061922,6.4654168 L8.99984672,9.33353772 L14.0960769,2.53856411 L24.0038528,17.4002279 Z" fill="#FFFFFF" fill-rule="nonzero"/><path d="M14,6 L10.25,11 L13.1,14.8 L11.5,16 C9.81,13.75 7,10 7,10 L2,18 L22,18 L14,6 Z" fill="currentColor" fill-rule="evenodd"/></svg></div><span class="nor-air-mass-label">Land<br>Air Mass</span>';
        grid.appendChild(am1);
        grid.appendChild(buildNorDropdown("Pathway for Land Air Mass", ["N/NW", "W"], [pathwayIcon(1), pathwayIcon(4)]));
        grid.appendChild(buildNorDropdown("Humidity for Land Air Mass", ["Dry", "Humid"], [humidityDryIcon, humidityHumidIcon]));
        grid.appendChild(buildNorDropdown("Temperature for Land Air Mass", ["Cold", "Warm"], [tempColdIcon, tempWarmIcon]));

        // Row 3: Ocean Air Mass

        container.scrollBy({ top: eRect.bottom - cRect.bottom + padBottom, behavior });
      }

    var dataPanelId = "collapse-data-panel";

      { name: "Data", flex: 285, subtitle: null, bg: "#fff" }
    ];

    panels.forEach(p => {
      const panelWrap = document.createElement("div");
      if (p.fixedWidth) {
        panelWrap.style.width = p.fixedWidth + "px";
        panelWrap.style.flexShrink = "0";
      } else {
        panelWrap.style.flex = p.flex;
        panelWrap.style.minWidth = p.minWidth ? p.minWidth + "px" : "0";
      }
      panelWrap.style.position = "relative";

      const panel = document.createElement("div");
      panel.className = "sim-panel";
      panel.style.width = "100%";
      panel.style.height = "calc(100% - 17px)";
      if (p.bg) panel.style.background = p.bg;
      if (p.name === "Trials") {
        panel.setAttribute("role", "region");
      } else {
        panel.setAttribute("role", "region");
        panel.id = p.name === "Simulation" ? simPanelId : dataPanelId;
      }
      panel.setAttribute("aria-label", p.name + " panel");

      // --- Trials panel ---
      if (p.name === "Trials") {
        panel.classList.add("has-scroll");
        const scrollWrap = document.createElement("div");
        scrollWrap.className = "trials-scroll collapse-trials";
        scrollWrap.setAttribute("role", "listbox");
        scrollWrap.setAttribute("aria-orientation", "vertical");
        scrollWrap.setAttribute("aria-label", "Trials");
        function updateTrialsTabindex() {
          if (scrollWrap.scrollHeight > scrollWrap.clientHeight) {
            scrollWrap.setAttribute("tabindex", "0");
          } else {
            scrollWrap.removeAttribute("tabindex");
          }
        }
        const allLabels = ["A", "B", "C", "D"];
        const trialState = {};
        SIM.trialState = trialState;
        SIM.trialCards = {};
        SIM.selectedTrial = "A";


        function updateTrialCardLabel(letter) {
          const cardEl = SIM.trialCards[letter];
          if (!cardEl) return;
          const st = trialState[letter] || (trialState[letter] = {});
          if (typeof st.sampleCount !== "number") st.sampleCount = 0;
          let statsEl = cardEl.querySelector(".trial-card-stats");
          if (!statsEl) {
            statsEl = document.createElement("div");
            statsEl.className = "trial-card-stats";
            statsEl.setAttribute("aria-hidden", "true");
            cardEl.appendChild(statsEl);
          }
          const rows = TRIAL_CONTENT[letter] || [];
          var html = "";
          rows.forEach(function (label) {
            html += '<div class="collapse-attr-row">'
                 +    '<span class="collapse-attr-icon">' + (LABEL_ICON[label] || greenBox24) + '</span>'
                 +    '<span class="collapse-attr-label">' + label + '</span>'
                 +  '</div>';
          });
          html += '<div class="collapse-sample-count">'
               +    '<span class="collapse-sample-n">' + st.sampleCount + '</span>'
               +    (st.sampleCount === 1 ? ' sample' : ' samples')
               +  '</div>';
          statsEl.innerHTML = html;
          var aria = "Trial " + letter;
          if (rows.length) aria += ". " + rows.join(", ");
          aria += ". Sampled " + st.sampleCount + (st.sampleCount === 1 ? " time" : " times");
          cardEl.setAttribute("aria-label", aria);
          const resetBtn = cardEl.querySelector(".trial-card-reset");
          if (resetBtn) {
            setAriaDisabled(resetBtn, st.sampleCount === 0);

            resetBtn.setAttribute("tabindex", (isSelected) ? "0" : "-1");
          }

        function buildTrialCard(letter) {

          const card = document.createElement("div");

          SIM.trialCards[letter] = card;
          function selectTrial() {
            selectTrialByCard(card, letter);

          card.addEventListener("click", selectTrial);
          card.addEventListener("keydown", (e) => {
            if ((e.key === "Enter" || e.key === " ") && e.target === card) {
              e.preventDefault();
              selectTrial();
              return;
            }
            handleTrialCardNav(card, e);
          });
          card.setAttribute("aria-selected", "false");
          const lbl = document.createElement("span");
          lbl.className = "trial-card-label";
          lbl.textContent = letter;
          lbl.setAttribute("aria-hidden", "true");

          resetBtn.setAttribute("aria-label", "Reset trial " + letter);
          setAriaDisabled(resetBtn, true);
          resetBtn.setAttribute("tabindex", "-1");
          const resetIcon = createSVGIcon(resetIconSVG);
          resetBtn.appendChild(resetIcon);
          function resetTrial(e) {
            e.stopPropagation();
            if (resetBtn.getAttribute("aria-disabled") === "true") return;
            trialState[letter] = {};
            updateTrialCardLabel(letter);

          }
          resetBtn.addEventListener("click", resetTrial);
          card.appendChild(resetBtn);
          return card;

        function selectTrialByCard(targetCard, targetLetter) {
          scrollWrap.querySelectorAll(".trial-card:not(.new-card)").forEach(c => {
            c.classList.remove("selected");
            c.setAttribute("aria-selected", "false");
            c.style.cursor = "pointer";

            if (rb) rb.setAttribute("tabindex", "-1");

          targetCard.classList.add("selected");
          targetCard.setAttribute("aria-selected", "true");
          targetCard.style.cursor = "default";
          const rb = targetCard.querySelector(".trial-card-reset");
          if (rb) rb.setAttribute("tabindex", "0");

          if (indicator) indicator.textContent = targetLetter;
          if (SIM._syncNowBlock) SIM._syncNowBlock();
          if (SIM._syncActions) SIM._syncActions();
          scrollItemIntoView(targetCard, scrollWrap);
          updateTrialCardTabindex();
        }

        function getTrialNavCards() {
          return Array.from(scrollWrap.querySelectorAll(".trial-card")).filter(c => c.style.display !== "none");
        }

        function handleTrialCardNav(cardEl, e) {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            const cards = getTrialNavCards();
            const cur = cards.indexOf(cardEl);
            if (cur < 0) return;
            const next = e.key === "ArrowDown"
              ? (cur + 1) % cards.length
              : (cur - 1 + cards.length) % cards.length;
            cards[cur].setAttribute("tabindex", "-1");
            cards[next].setAttribute("tabindex", "0");
            cards[next].focus({ preventScroll: true });
            scrollItemIntoView(cards[next], scrollWrap);
          } else if (e.key === "Home") {
            e.preventDefault();
            const cards = getTrialNavCards();
            cards.forEach(c => c.setAttribute("tabindex", "-1"));
            cards[0].setAttribute("tabindex", "0");
            cards[0].focus({ preventScroll: true });
            scrollItemIntoView(cards[0], scrollWrap);
          } else if (e.key === "End") {
            e.preventDefault();
            const cards = getTrialNavCards();
            cards.forEach(c => c.setAttribute("tabindex", "-1"));
            cards[cards.length - 1].setAttribute("tabindex", "0");
            cards[cards.length - 1].focus({ preventScroll: true });
            scrollItemIntoView(cards[cards.length - 1], scrollWrap);
          }
        }

        function updateTrialCardTabindex() {
          const cards = getTrialNavCards();
          const selIdx = cards.findIndex(c => c.classList.contains("selected"));
          const activeIdx = selIdx >= 0 ? selIdx : 0;
          cards.forEach((c, i) => c.setAttribute("tabindex", i === activeIdx ? "0" : "-1"));
        }

          const card = buildTrialCard(letter);
          if (i === 0) {
            card.classList.add("selected");
            card.setAttribute("aria-selected", "true");
            card.setAttribute("tabindex", "0");
            card.style.cursor = "default";

          scrollWrap.appendChild(card);
          updateTrialCardLabel(letter);

          cards.forEach(function(c, i) {

        SIM.trialsObserver.observe(scrollWrap, { childList: true });

        const TL_STOPS = [
          // `at` is the dot's position as a fraction of the track, taken from the design
          { years: 100000, at: 0,      yr: "100,000 yr", event: ["Mammoths", "roam"],    icon: true,  end: false , art: MAMMOTH_ART },
          // the last glacial period ended ~11,700 years ago. Like 4,600 and 250, this is a
          // reference mark rather than a landable value — the handle never stops on it.
          { years: 11700,  at: 0.3037, yr: "11,700 yr",  event: ["Last Ice", "Age ends"], icon: true,  end: false, art: ICE_AGE_ART },
          { years: 4600,   at: 0.5550, yr: "4,600 yr",   event: ["Pyramids", "built"],   icon: true,  end: false, art: PYRAMIDS_ART },
          { years: 20,     at: 0.7650, yr: "20 yr",      event: ["Corvette", "Museum"],  icon: true,  end: false , art: CORVETTE_ART },
          { years: 0,      at: 0.9142, yr: "0 yr",       event: ["Museum", "collapses"], icon: true,  end: true , art: COLLAPSE_ART },
          // the right-hand end marker is the current calendar year, so it keeps up on its own.
          // Its position never moves; only the text changes.
          { years: null,   at: 1,      yr: String(new Date().getFullYear()), event: [],   icon: false, end: true }
        ];

        // Place each value by interpolating in log space between the two dots that bracket it,
        // so a value that equals a dot's year lands exactly on that dot.
        const TL_AT = (function () {
          const anchors = TL_STOPS.filter(function (s) { return s.years !== null; });
          return TL_VALUES.map(function (v) {
            for (let i = 0; i < anchors.length - 1; i++) {
              const hi = anchors[i], lo = anchors[i + 1];
              if (v <= hi.years && v >= lo.years) {
                if (v === hi.years) return hi.at;
                if (v === lo.years) return lo.at;
                if (lo.years === 0) {
                  // no log for zero: share the last stretch evenly among what is left
                  const inner = TL_VALUES.filter(function (x) { return x < hi.years && x > 0; });
                  return hi.at + (lo.at - hi.at) * (inner.indexOf(v) + 1) / (inner.length + 1);
                }
                const t = (Math.log10(hi.years) - Math.log10(v)) / (Math.log10(hi.years) - Math.log10(lo.years));
                return hi.at + (lo.at - hi.at) * t;
              }
            }
            return 1;
          });
        })();

        const tl = document.createElement("div");

        const row = document.createElement("div");

        const tlDots = [];
        TL_STOPS.forEach(function (st, i) {
          const stop = document.createElement("div");
          stop.className = "collapse-tl-stop" + (st.end ? " hollow" : "") + (st.years === 0 ? " zero" : "");

          const ico = document.createElement("span");
          ico.className = "collapse-tl-ico";
          if (st.art) {
            ico.classList.add("art");
            ico.innerHTML = st.art;
          } else if (st.icon) {
            ico.innerHTML = greenBox24;
          }
          stop.appendChild(ico);

          const dot = document.createElement("span");
          dot.className = "collapse-tl-dot";
          stop.appendChild(dot);

          const yr = document.createElement("span");

          // inset the end dots by half their own label so neither hangs off the track

          const halfFirst = tlStopEls[0].offsetWidth / 2;
          const halfLast = tlStopEls[tlStopEls.length - 1].offsetWidth / 2;
          tlInset = halfFirst;
          tlSpan = Math.max(0, w - halfFirst - halfLast);
          tlStopEls.forEach(function (el, i) {
            el.style.left = (tlInset + TL_STOPS[i].at * tlSpan) + "px";

          // solid as far as the collapse, dashed from there to the end marker

        function tlFormat(v) { return v.toLocaleString("en-US"); }
